name: m11d5-dxil

on:
  pull_request:
    paths:
      - src/backends/rhi-d3d12/**
      - src/backends/rhi/**
      - src/core/diagnostics/src/crash_handler_windows.cpp
      - src/core/determinism/src/hash.cpp
      - src/core/determinism/include/cy/core/determinism/random.h
      - src/core/jobs/src/schedule.cpp
      - src/core/jobs/include/cy/core/jobs/sync.h
      - src/core/memory/include/cy/core/memory/hash.h
      - src/core/memory/tests/test_containers.cpp
      - src/pcg/include/cy/pcg/dataset.h
      - tests/render/**
      - samples/03-first-light/shaders/first_light.slang
      - samples/03-first-light/shaders/first_light_dxil.h
      - samples/03-first-light/src/renderer.cpp
      - cmake/**
      - CMakeLists.txt
      - .github/workflows/m11d5-dxil.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the pinned Slang toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://github.com/shader-slang/slang/releases/download/v2026.9.2/slang-2026.9.2-windows-x86_64.zip" -OutFile "$env:RUNNER_TEMP\slang.zip"
          Expand-Archive "$env:RUNNER_TEMP\slang.zip" -DestinationPath "$env:RUNNER_TEMP\slang"
          Invoke-WebRequest -Uri "https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2602/dxc_2026_02_20.zip" -OutFile "$env:RUNNER_TEMP\dxc.zip"
          Expand-Archive "$env:RUNNER_TEMP\dxc.zip" -DestinationPath "$env:RUNNER_TEMP\dxc"
          Copy-Item "$env:RUNNER_TEMP\dxc\bin\x64\dxcompiler.dll" "$env:RUNNER_TEMP\slang\bin"
          Copy-Item "$env:RUNNER_TEMP\dxc\bin\x64\dxil.dll" "$env:RUNNER_TEMP\slang\bin"
      - name: Compile and embed DXIL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $slangc = "$env:RUNNER_TEMP\slang\bin\slangc.exe"
          $source = "samples/03-first-light/shaders/first_light.slang"
          & $slangc $source -target dxil -profile sm_6_6 -entry shadowVertex -stage vertex -o "$env:RUNNER_TEMP\shadow.dxil"
          & $slangc $source -target dxil -profile sm_6_6 -entry forwardVertex -stage vertex -o "$env:RUNNER_TEMP\forward.dxil"
          & $slangc $source -target dxil -profile sm_6_6 -entry forwardFragment -stage fragment -o "$env:RUNNER_TEMP\fragment.dxil"
          python samples/03-first-light/shaders/embed_dxil.py "samples/03-first-light/shaders/first_light_dxil.h" `
            "kFirstLightShadowVertexDxil=$env:RUNNER_TEMP\shadow.dxil" `
            "kFirstLightForwardVertexDxil=$env:RUNNER_TEMP\forward.dxil" `
            "kFirstLightForwardFragmentDxil=$env:RUNNER_TEMP\fragment.dxil"
      - uses: extractions/setup-just@v3
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure the native D3D12 backend
        shell: pwsh
        run: >-
          cmake --preset dev
          -D CMAKE_C_COMPILER=cl
          -D CMAKE_CXX_COMPILER=cl
          -D CY_RENDERER_D3D12=ON
          -D CY_RENDERER_VULKAN=OFF
          -D CY_RENDERER_METAL=OFF
          -D CY_SHADER_SLANG=OFF
          -D CY_SHADER_DXIL=OFF
          -D CY_BUILD_EDITOR=OFF
      - name: Build D3D12, conformance and golden targets
        shell: pwsh
        run: >-
          cmake --build --preset dev --target
          cy_rhi_d3d12
          cy_test_unit_rhi_d3d12
          cy_test_render_golden_backends
          cy_sample_first-light
      - name: Run the D3D12 debug-layer and golden suites
        shell: pwsh
        env:
          CY_GOLDEN_CAPTURE_DIR: ${{ runner.temp }}\golden
          CY_GOLDEN_LEDGER: ${{ runner.temp }}\golden\m11d5-three-backends-d3d12.manifest
        run: |
          New-Item -ItemType Directory -Force -Path "$env:CY_GOLDEN_CAPTURE_DIR" | Out-Null
          ctest --test-dir build/dev -C Development -R "^(unit.rhi_d3d12|render.golden_backends)$" --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m11d5-d3d12-evidence
          path: |
            samples/03-first-light/shaders/first_light_dxil.h
            ${{ runner.temp }}\golden\*
