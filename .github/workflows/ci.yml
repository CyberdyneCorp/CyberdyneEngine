# CyberdyneEngine — continuous integration.
#
# Every command below is a `just` recipe or the installation of a tool `just env-doctor` would tell
# a developer to install. That is not a convention: `developer-workflow-and-just` requires that a
# check gating a change is runnable locally by one command and that the local and remote invocations
# are the same code path, and lists a workflow that duplicates rather than invokes recipes among its
# forbidden patterns. `just ci-check` enforces both, and runs in the `quality` job below.
#
# What continuous integration adds around the recipes — checkout, caching, the matrix, artefact
# upload — is `uses:` steps and job configuration, which wrap the recipes rather than replacing
# them.
#
# --------------------------------------------------------------------------------------------------
# M9's CLOSING GATE: THIS FILE HAD NEVER PRODUCED A GREEN RUN, AND THE REASON WAS FOUR APT PACKAGES.
#
# `gh run list` over the whole life of the repository — sixty-three runs, M0's first commit to M8.c's
# last — returns `cancelled` or `queued` for every single one, and NOT ONE successful run. The most
# recent push run is the record: three jobs green (`spec validation`, `editor linux`,
# `roadmap-status`), ten red, twelve cancelled when the next push superseded them, and `milestone —
# the closed milestones' exit criteria` has never started at all.
#
# Every Linux job died at the same line, at CONFIGURE, before compiling anything:
#
#     CMake Error at build/dev/_deps/sdl3-src/cmake/macros.cmake:433 (message):
#       Couldn't find dependency package for XCURSOR.  Please install the needed packages
#       or configure with -DSDL_X11_XCURSOR=OFF
#
# The step above installed `libx11-dev libxext-dev libwayland-dev libxkbcommon-dev`. README.md's own
# "System libraries SDL3 builds against" list — the one a human is told to run on a fresh clone —
# names `libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev` beside them, and cmake/dependencies.cmake
# explains exactly why those four and no more: "What stays on is what DisplayServer needs — Xcursor,
# Xrandr for screen enumeration, Xfixes and XInput2 for input", with XScrnSaver and XTest forced OFF.
# So the workflow asked for a subset of the documented dependency set and SDL3 refused to configure,
# on every Linux leg, on every run, since M0.
#
# THE CONSEQUENCE IS NOT THE PACKAGES. `delivery-roadmap` permits M9's audit to be reduced only if
# "continuous integration has actually executed, so that cross-platform and cross-configuration
# claims are verified by something other than an agent's reasoning". It has not executed, so M9's
# gate ran the audit IN FULL and says so. Every criterion in this repository carrying `where = "ci"`
# — M3's `three-platforms`, M5.5's `editor-three-platforms`, M9's `lockstep-cross-platform` — defers
# its question to this file, and this file has never answered one.
#
# WHAT IS FIXED HERE AND WHAT IS NOT. The package list is fixed, and `tools/ci/check_workflows.py`
# now fails when it drifts from README.md's documented list again. THREE OTHER FAILURES ARE RECORDED
# AND NOT FIXED, because this host cannot run either operating system and a blind edit to a leg
# nobody can execute is how this list got wrong in the first place:
#   * `build windows-x86_64` / `windows-arm64`: swift-actions/setup-swift@v2 reports
#     `Version "6.0" is not available` on the Windows images, while the Linux and macOS legs accept
#     the same input.
#   * `editor macos`: `mapfile: command not found` — the macOS image's bash is 3.2 and the recipe
#     uses a bash 4 builtin.
#   * `editor windows`: `rustfmt refused the generated src/generated/mod.rs`.
# Each is a one-line finding with a named cause and none of them is verifiable from this machine.
# --------------------------------------------------------------------------------------------------
#
# The gate set is declared once, as data, in tools/roadmap/gates.toml — `just roadmap-gates` prints
# it. The jobs below are that list arranged into jobs: build, test, sanitizers and throughput,
# quality, spec validation, generated-code currency, identity and reflection, the non-default
# profiles, and the roadmap status record. `just ci-check` fails when a permanent gate declared
# there is run by no job here, so the two cannot drift apart in the direction that matters;
# `just ci-jobs` prints what this file actually invokes.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The nightly run `testing-and-quality` requires: the unit and integration suites under
  # AddressSanitizer, UndefinedBehaviorSanitizer and ThreadSanitizer "at least nightly". Through M2
  # this trigger did not exist, so that requirement was met by nothing — the `sanitize` job below
  # covers the jobs and ECS suites on every pull request, which is a different and much narrower
  # claim. `sanitize-nightly` is the job; this is the schedule that runs it.
  #
  # 03:41 UTC, and deliberately not on the hour: GitHub queues scheduled workflows and the round
  # hours are where every repository's cron lands, so an off-hour start is the difference between a
  # run that begins on time and one that begins twenty minutes late.
  schedule:
    - cron: '41 3 * * *'
  # So that the nightly set can be run against a branch before it is merged, rather than being
  # discovered the morning after. `sanitize-nightly` accepts this trigger as well as the schedule.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The engine's default working profile. Every recipe takes --profile; CI states it once here so
  # that a job cannot silently test a configuration nobody builds.
  CY_PROFILE: dev

jobs:
  # --- The three-platform, two-architecture build ------------------------------------------------
  #
  # THE SWIFT DECISION, M5 TASK 1.4 — recorded here because this matrix is what it is about.
  #
  # M4 left the question open: Swift is a hard requirement of `swift-scripting` and of the M4
  # artefact, and it was installed on exactly one job. Making it hard across the matrix means every
  # leg can install a toolchain, and two of the six cannot.
  #
  # THE ANSWER IS: HARD WHERE A TOOLCHAIN EXISTS, OPTIONAL WHERE ONE DOES NOT, AND THE MATRIX SAYS
  # WHICH IS WHICH. The `swift` column below is that statement, one value per leg:
  #
  #   action        the leg installs a toolchain through swift-actions/setup-swift.
  #   preinstalled  the runner image already has one, from Xcode. Installing a second would be
  #                 slower and would test a toolchain no macOS developer uses.
  #   none          no toolchain is obtainable on this leg today. The Swift suites and the M4
  #                 sample are NOT REGISTERED there — bindings/swift/CMakeLists.txt declines rather
  #                 than registering suites that skip — so the leg still builds and still runs every
  #                 other suite, and the absence is visible as a shorter test list rather than as a
  #                 green tick over nothing.
  #
  # WHY THE TWO `none` LEGS ARE none, precisely, because "ARM" is not the reason and repeating it
  # would be wrong:
  #
  #   linux-arm64    swift-actions/setup-swift resolves its toolchains from the Swift.org release
  #                  index, and this project has not verified that it selects an aarch64 Ubuntu
  #                  build on an `ubuntu-24.04-arm` runner. Swift.org DOES publish aarch64 Ubuntu
  #                  toolchains, so this is the leg that can be closed next, by installing swiftly
  #                  directly rather than through the action. Unverified from this machine: it is a
  #                  runner-image property and cannot be measured locally.
  #   windows-arm64  Swift for Windows publishes an x86_64 installer; an arm64-native Windows
  #                  toolchain is not part of a released Swift 6.0 distribution. This leg is
  #                  `none` by absence rather than by policy, and it is the one that stops Swift
  #                  from being a hard requirement of the whole matrix at M5.
  #
  # NOTHING HERE WAS EXECUTED. This file is edited on a Linux workstation with no runner; every
  # claim above is about a GitHub-hosted image and is verifiable only by running the workflow. The
  # `playable` job below keeps its own explicit toolchain install for exactly that reason — it is
  # the job that judges the Swift artefact, and it does not depend on this matrix being right.
  build:
    name: build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-x86_64, os: ubuntu-24.04, swift: action }
          - { label: linux-arm64, os: ubuntu-24.04-arm, swift: none }
          - { label: macos-x86_64, os: macos-13, swift: preinstalled }
          - { label: macos-arm64, os: macos-14, swift: preinstalled }
          - { label: windows-x86_64, os: windows-2022, msvc: x64, swift: action }
          - { label: windows-arm64, os: windows-11-arm, msvc: arm64, swift: none }
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - if: matrix.msvc != ''
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc }}
      # The `swift` column of the matrix above, applied. `preinstalled` and `none` install nothing:
      # one because the image already has a toolchain, the other because none exists for the leg.
      - if: matrix.swift == 'action'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'
      - name: Install the tools the doctor requires
        run: npm install -g @fission-ai/openspec
      # The pinned LLVM tooling. `just env-doctor` requires it on every host — the format and lint
      # gates are the project's, not Linux's — and the version is the one the justfile pins, which
      # is the same command `just env-doctor` prints as the correction. A distribution package
      # would be a different version on each runner, which is the ambiguity the pin removes.
      #
      # setup-python is here so that `pip` means the same interpreter on all six legs of the matrix;
      # the Windows and macOS images do not agree about whether it is `pip`, `pip3` or neither.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned LLVM tooling
        run: pip install clang-format==22.1.8 clang-tidy==22.1.8
      - name: Install the window-system headers SDL3 builds against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxkbcommon-dev libwayland-dev
      - name: Install the generator
        if: runner.os == 'macOS'
        run: brew install ninja
      # Keyed on the dependency manifest, per task 2.4.3: a change to deps/manifest.toml is exactly
      # the change that invalidates the fetched sources, and nothing else does. The build tree rides
      # in the same cache so that the test job restores what this job produced.
      - uses: actions/cache@v4
        with:
          path: build/dev
          key: cy-build-${{ matrix.label }}-${{ hashFiles('deps/manifest.toml', 'cmake/**', 'CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            cy-build-${{ matrix.label }}-${{ hashFiles('deps/manifest.toml', 'cmake/**', 'CMakeLists.txt') }}-
            cy-build-${{ matrix.label }}-
      - name: Diagnose the environment
        run: just env-doctor
      # `just build-engine`, not `just build-all`, because tools/roadmap/gates.toml declares that
      # command for the build-and-test gate and `just ci-check` fails when a declared gate is not
      # run. build-all is a one-line alias to it; the gate list is the thing that must not drift.
      - name: Build
        run: just build-engine

  # --- The graduated test set --------------------------------------------------------------------
  test:
    name: test ${{ matrix.label }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-x86_64, os: ubuntu-24.04, swift: action }
          - { label: linux-arm64, os: ubuntu-24.04-arm, swift: none }
          - { label: macos-x86_64, os: macos-13, swift: preinstalled }
          - { label: macos-arm64, os: macos-14, swift: preinstalled }
          - { label: windows-x86_64, os: windows-2022, msvc: x64, swift: action }
          - { label: windows-arm64, os: windows-11-arm, msvc: arm64, swift: none }
    env:
      # The machine-readable results `testing-and-quality` requires of a continuous integration run.
      # The recipe already knows how to produce them; the job only says where to put them.
      CY_TEST_JUNIT: test-results.xml
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - if: matrix.msvc != ''
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc }}
      # The `swift` column of the matrix above, applied. `preinstalled` and `none` install nothing:
      # one because the image already has a toolchain, the other because none exists for the leg.
      - if: matrix.swift == 'action'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'
      - name: Install the window-system headers SDL3 builds against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxkbcommon-dev libwayland-dev
      - name: Install the generator
        if: runner.os == 'macOS'
        run: brew install ninja
      - uses: actions/cache@v4
        with:
          path: build/dev
          key: cy-build-${{ matrix.label }}-${{ hashFiles('deps/manifest.toml', 'cmake/**', 'CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            cy-build-${{ matrix.label }}-${{ hashFiles('deps/manifest.toml', 'cmake/**', 'CMakeLists.txt') }}-
            cy-build-${{ matrix.label }}-
      - name: Unit, integration and smoke
        run: just test-all
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.label }}
          path: test-results.xml
          if-no-files-found: ignore

  # --- The concurrency suites under a data-race detector, and the job system's throughput ---------
  #
  # Task 3.2.12. `core-jobs-and-concurrency` lists "a data-race detector integration (TSan)" among
  # the concurrency diagnostics a development build provides, and a job system whose races are only
  # detectable locally is a job system whose races reach a user. So the sanitizers run here rather
  # than being something a developer might remember.
  #
  # A sanitized tree is not interchangeable with an ordinary one — the instrumentation changes the
  # ABI — so `just test-sanitize` configures its own build directory and never reuses build/dev.
  # That is why this job restores no cache from `build`: there is nothing in it this job can use.
  #
  # The two sanitizers are separate steps because TSan is exclusive: it cannot be combined with
  # AddressSanitizer, so each pass costs its own build. Both are scoped to the jobs suites with
  # `--tests jobs`; widening that to the whole test set is `testing-and-quality`'s nightly run,
  # which is a schedule this file does not yet have.
  #
  # Leak detection is on, which is the recipe's default rather than this job's choice. M1 task 2.12
  # declared the trace's pooled per-thread slots and rings at the allocation site
  # (src/core/diagnostics/src/lifetime.h), so a leak reported here is a defect rather than the
  # standing false positive M0 carried.
  sanitize:
    name: sanitizers and throughput
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - name: Install the generator and the window-system headers SDL3 builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxkbcommon-dev libwayland-dev
      # ThreadSanitizer first: it is the one the specification names, and running it before the
      # slower combined pass means a race is reported early rather than after two builds.
      - name: Data races over the job suite (TSan)
        run: just test-sanitize --sanitizer thread --tests jobs
      - name: Memory errors and undefined behaviour over the job suite (ASan + UBSan)
        run: just test-sanitize --sanitizer address,undefined --tests jobs
      # M2's suites, through the same two trees. `ecs_scheduling` is the first thing in the engine
      # that runs two systems over one world at once, and the race that shape produced was found by
      # this tool and closed with atomics; a regression there is a corrupted chunk under a parallel
      # reader, which no functional test reliably catches. Both trees are already configured by the
      # two steps above, so these are incremental builds rather than whole ones.
      - name: Data races over the suite that iterates one world from two systems (TSan)
        run: just test-sanitize --sanitizer thread --tests ecs_scheduling
      - name: Memory errors and undefined behaviour over the ECS suites (ASan + UBSan)
        run: just test-sanitize --sanitizer address,undefined --tests ecs
      # The throughput benchmark is a gate rather than a report: every metric it checks is
      # dimensionless — a speedup divided by the worker count, or a cost in units of a calibration
      # workload measured in the same process — precisely so that a two-core shared runner and a
      # workstation are held to the same threshold. It exits non-zero on a regression.
      #
      # `--profile profile` because assertions are compiled out there; a measurement taken with them
      # on is not the number the thresholds were recorded against, and the recipe says so.
      - name: Job system throughput against its thresholds
        run: just test-bench-jobs --profile profile

  # --- The whole test set under every sanitizer, nightly -----------------------------------------
  #
  # Task 1.5. `testing-and-quality`: "the unit and integration suites SHALL run under
  # AddressSanitizer, UndefinedBehaviorSanitizer and ThreadSanitizer at least nightly". The `sanitize`
  # job above is scoped to the suites whose failure modes are races — it runs on every pull request,
  # and widening it there would put three whole instrumented builds on the critical path of every
  # change. This job is the wide one, and it runs on the schedule instead.
  #
  # It is not merely `--tests .` bolted onto the job above. Two things had to be true first, and
  # neither was at M2's close:
  #
  #   * `just test-sanitize` exported CY_TEST_BUDGET_SCALE=0, which switches the per-test budget off
  #     rather than relaxing it, while the harness's own suite asserted the scale was positive — so
  #     `--tests .` failed on `unit.harness` before it reached anything the sanitizer had to say.
  #     The recipe now exports 20, the same relaxation the harness picks for itself under a
  #     sanitizer, and the harness suite no longer requires a positive scale.
  #   * the budget was wall clock, and a sanitized, oversubscribed runner is precisely where a
  #     wall-clock budget reports on the machine rather than on the test. It is CPU time now.
  #
  # `continue-on-error` is deliberately absent. A nightly job that is allowed to fail is a nightly
  # job nobody reads; if this is red, the sanitizer found something and someone has to look.
  sanitize-nightly:
    name: every suite under every sanitizer (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # Three instrumented builds and the whole test set through each. The default six hours would let
    # a hung suite hold a runner for a shift; the graduated recipes' own budgets are minutes.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - name: Install the generator and the window-system headers SDL3 builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxkbcommon-dev libwayland-dev
      # Each sanitizer gets its own tree, which the recipe arranges; TSan cannot be combined with
      # ASan, so this is three builds rather than two. They are separate steps so that a failure
      # names the tool that found it in the step list rather than only in the log.
      - name: Every suite under ThreadSanitizer
        run: just test-sanitize --sanitizer thread --tests .
      - name: Every suite under AddressSanitizer and UndefinedBehaviorSanitizer
        run: just test-sanitize --sanitizer address,undefined --tests .
      # UBSan alone as well as combined: ASan changes allocation layout, and an alignment or
      # object-lifetime finding that only appears without it is exactly the kind the combined run
      # can hide.
      - name: Every suite under UndefinedBehaviorSanitizer alone
        run: just test-sanitize --sanitizer undefined --tests .

  # --- The world: the ECS, the node façade, the cook, and the state hash ---------------------------
  #
  # M2's four new permanent gates, and they are a job of their own rather than steps in `test`
  # because of what they are: `test` runs every suite once and reports that they passed, which is a
  # different claim from "these particular properties still hold". Each command below is declared
  # literally in tools/roadmap/gates.toml and `just ci-check` compares the two, so the gate set and
  # this file cannot drift apart in the direction that matters.
  #
  # The suites run here also run inside `just test-all` in the test job. That duplication is
  # deliberate and cheap: a gate has to name the command that checks it, and a gate whose only
  # evidence is "some larger command included it" is a gate nobody can point at when it fails.
  world:
    name: world — ecs, nodes, cooking, state hash
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - name: Install the generator and the window-system headers SDL3 builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxkbcommon-dev libwayland-dev
      - uses: actions/cache@v4
        with:
          path: build/dev
          key: cy-build-world-${{ hashFiles('deps/manifest.toml', 'cmake/**', 'CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            cy-build-world-${{ hashFiles('deps/manifest.toml', 'cmake/**', 'CMakeLists.txt') }}-
            cy-build-world-
      # A structural change attempted mid-iteration is refused and counted, in every profile — a
      # returned error and a counter, never an assertion that two profiles compile out.
      - name: Structural change is observable only at flush points
        run: just test-unit -R ecs
      # The case that reproduced the race: two systems iterating one world at once.
      - name: Systems declare their access, and a stage runs them in parallel
        run: just test-integration -R ecs_scheduling
      # The milestone's named spike, as a gate: an authored hierarchy lowers to chunk-shaped blocks,
      # flattening is a walk to the root, and a cooked reference is a site in a table.
      - name: An authored hierarchy lowers to archetype blocks
        run: just test-integration -R scene_cooking
      - name: A cooked block activates as one memcpy per column per chunk
        run: just test-integration -R ecs_scale
      # No node duplicates component data, and no traversal produces a state a query would not.
      - name: The coherence invariants between nodes and entities
        run: just test-integration -R scene_scale
      # Across processes, not across iterations of one loop: a fresh address space is what exposes a
      # hash that depended on an allocation address or a per-process seed.
      - name: The state hash reproduces across processes
        run: just test-smoke -R tick_loop
      - name: The milestone artefact, across processes and across a snapshot restore
        run: just test-smoke -R headless_sim

  # --- First light: the RHI, the render graph, the shader pipeline and the frame -------------------
  #
  # M3's four new permanent gates, and a job of its own for the same reason `world` is: `test` runs
  # every suite once and reports that they passed, which is a different claim from "these particular
  # properties still hold". Each command below is declared literally in tools/roadmap/gates.toml and
  # `just ci-check` compares the two, so the gate set and this file cannot drift apart in the
  # direction that matters.
  #
  # NO GPU AND NO VULKAN BUILD, and that is the point rather than a limitation. A hosted runner has
  # no graphics device and the default build has CY_RENDERER_VULKAN off, so what `just test-render`
  # runs here is `render.null_frame` and `render.xr_prerequisites` — the whole of the milestone's
  # frame as far as it is DECIDED rather than drawn: the pass count before and after the one-off
  # upload, the submit count, the barrier batches in the recorded command stream equalling the number
  # the compiled plan derived, two runs producing an identical stream, and the three XR seams. That
  # is design.md §1's argument for writing the null backend first, cashed in.
  #
  # The golden images are NOT here. A committed reference is a photograph of one implementation and
  # this runner is another; they are a criterion of tools/roadmap/milestones/m3.toml carrying
  # `requires = "gpu"`, reported as not evaluated on a machine that cannot judge them rather than as
  # passed. `just roadmap-milestone m3` on a machine with a device is what evaluates them.
  render:
    name: first light — rhi, graph, shaders, frame
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - name: Install the generator and the window-system headers SDL3 builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxkbcommon-dev libwayland-dev
      - uses: actions/cache@v4
        with:
          path: build/dev
          key: cy-build-render-${{ hashFiles('deps/manifest.toml', 'cmake/**', 'CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            cy-build-render-${{ hashFiles('deps/manifest.toml', 'cmake/**', 'CMakeLists.txt') }}-
            cy-build-render-
      # The milestone's whole point: a pass declares reads and writes, and the graph derives the
      # barriers, the aliasing, the schedule, the semaphores and the ownership transfers.
      - name: Barriers, aliasing and scheduling are derived from the declarations
        run: just test-unit -R render_graph
      - name: Aliasing measurably reduces the plan's peak against its own no-aliasing control
        run: just test-integration -R render_graph_scale
      # The renderer above the graph, all of it with no GPU.
      - name: The explicit RHI over the null backend
        run: just test-unit -R rhi
      - name: The render server, the snapshot, the pass order, the lights and the culling
        run: just test-unit -R render_
      - name: The BRDF, the shading models and the standard material
        run: just test-unit -R material
      # Slang to SPIR-V and the pipeline around it, with CY_SHADER_SLANG off — over the SPIR-V
      # passthrough, which is the shipping path rather than a stub.
      - name: Reflection-driven binding, permutations and the shader cache
        run: just test-unit -R shader
      - name: Shader hot reload replaces a pipeline's program without a restart
        run: just test-integration -R shader_pipeline
      # The artefact's own frame, through a device that executes nothing.
      - name: The milestone's frame with no GPU, and the XR prerequisite seams
        run: just test-render

  # --- M4: the boundary, the Swift overlay, and the invariants that cross it ---------------------
  #
  # The `abi`, `swift-api`, `command-stream`, `input-fixed-tick`, `physics` and `character-artefact`
  # gates of tools/roadmap/gates.toml. Every step here is one of their declared commands; `just
  # ci-check` fails if a permanent gate is declared there and run by no job here, which is what keeps
  # the two files from drifting in the direction that matters.
  #
  # THE SWIFT TOOLCHAIN IS INSTALLED IN THIS JOB AND NOWHERE ELSE. Three of the five `swift_` suites
  # need one; the other two — the overlay's currency and the engine linking no Swift runtime — are
  # registered unconditionally and are most interesting on a runner that has none. The sample and its
  # smoke test are NOT REGISTERED AT ALL without a toolchain, because their gameplay is a Swift
  # module, so this job is the one that judges the milestone's artefact.
  playable:
    name: playable — abi, swift, input, physics, gameplay
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - name: Install the generator and the window-system headers SDL3 builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxkbcommon-dev libwayland-dev
      # swiftly writes its environment line to ~/.profile, which only login shells read — which is
      # why bindings/swift/tools/cy_swift_module.py sources it explicitly on every invocation rather
      # than trusting PATH. `just env-doctor` diagnoses the same case for a developer.
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'
      - uses: actions/cache@v4
        with:
          path: build/dev
          key: cy-build-playable-${{ hashFiles('deps/manifest.toml', 'cmake/**', 'CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            cy-build-playable-${{ hashFiles('deps/manifest.toml', 'cmake/**', 'CMakeLists.txt') }}-
            cy-build-playable-
      # The compatibility obligation, and it needs no build: it is a comparison between the header
      # and a committed baseline, so it runs first and costs nothing.
      - name: The C ABI's compatibility gate
        run: just quality-abi
      - name: The ABI's layout, values, errors and callbacks
        run: just test-unit -R abi
      - name: Module loading, type registration and the reload sequence
        run: just test-integration -R abi_
      # The overlay, the package, and a real Swift module hot-reloaded across a layout change.
      - name: The Swift overlay, its generator, the package and a live reload
        run: just test-integration -R swift_
      # The three invariants M4 pins, each of which a later milestone can undo silently.
      - name: One command stream, and the test that bypasses it and fails
        run: just test-unit -R gameplay
      - name: A press and a release between two ticks are both observed by the next
        run: just test-unit -R input
      - name: The same, against real SDL3 events, headless
        run: just test-integration -R sdl3_input
      - name: The physics interface, its two backends, and determinism across runs
        run: just test-unit -R physics
      - name: Physics components, events, queries and the character controller
        run: just test-integration -R physics_
      # The artefact. The smoke test runs the sample, then runs it again with the deciding
      # behaviours absent and requires nothing to happen — which is task 5.3 as a measurement.
      - name: The sample plays itself, and its control run decides nothing
        run: just test-smoke -R character_sample
      - name: The sample contains no C++ gameplay code
        run: just test-integration -R character_no_cpp_gameplay
      # The recipe a contributor uses, rather than only the test that links the same binary.
      # m4.toml's `sample-recipe` criterion names this job, and m4.toml's own rule is that a
      # criterion which passes locally and runs nowhere else is not a gate.
      - name: The sample runs through the workflow recipe
        run: just run-sample character --ticks 120

  # --- M5: the editor, its session, the importer and live reload ---------------------------------
  #
  # THE `editor` JOB IS THE ONE THIS PROJECT SHOULD HAVE HAD THE DAY THE RUST WORKSPACE LANDED.
  # `just build-editor-check` — the SDK generator's selftest, rustfmt, clippy with the workspace's
  # pedantic table as errors, and 505 tests — was green in all four profiles and run by nothing,
  # which three separate reports named before this job existed.
  #
  # THREE PLATFORMS, because that is the ROADMAP's M5 exit criterion — "editor headless tests run in
  # continuous integration on all three platforms" — and because a workspace that needs no window,
  # no graphics device and no interface toolkit is exactly the thing that can run anywhere. It is a
  # job of its own rather than a step in the `test` matrix so that a Windows-specific failure names
  # itself instead of failing six legs of an unrelated matrix.
  #
  # NOT VERIFIED FROM A DEVELOPER MACHINE. This file is edited on Linux; that the macOS and Windows
  # runner images carry cargo, rustfmt and clippy is a property of a GitHub-hosted image and is
  # verifiable only by running the workflow. `editor-three-platforms` in tools/roadmap/milestones/
  # m5.toml is the criterion that says so, and it is reported as not evaluated on this host rather
  # than as passed.
  editor:
    name: editor ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux, os: ubuntu-24.04 }
          - { label: macos, os: macos-14 }
          - { label: windows, os: windows-2022 }
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      # THE MINIMUM SUPPORTED RUST VERSION, PINNED WHERE IT IS ACTUALLY USED.
      #
      # `editor/Cargo.toml` declares 1.95 and `rust-toolchain.toml` selects it; this step is what
      # makes the declaration true on a runner, whose default toolchain is whatever the image
      # happens to ship and moves without anybody deciding it should. A version pinned locally and
      # floating in continuous integration is a version that is not pinned — and the failure it
      # produces is a compiler error inside a dependency, on one platform, in a log nobody reads
      # until a release is blocked.
      #
      # It moved from 1.92 at M5.5 because the interface toolkit chosen there — egui 0.36 over
      # wgpu 30 — refuses to build on 1.92.
      - name: The toolchain the editor declares
        run: just build-editor-toolchain
        shell: bash
      - uses: actions/cache@v4
        with:
          path: build/editor
          key: cy-editor-${{ matrix.label }}-${{ hashFiles('editor/Cargo.lock', 'editor/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            cy-editor-${{ matrix.label }}-${{ hashFiles('editor/Cargo.lock', 'editor/Cargo.toml') }}-
            cy-editor-${{ matrix.label }}-
      # The registry is reached now, which it was not before M5.5: this workspace depended on
      # nothing but the standard library for five milestones, and the milestone with a window in it
      # ended that. `editor/Cargo.lock` is committed and pins every version exactly, so what is
      # fetched is decided by a reviewed file rather than by the day the job ran.
      #
      # The viewport transport's dependencies — wgpu, ash, libc — are declared only for Linux, so
      # the macOS and Windows legs still resolve a small tree. That is a property of
      # `crates/cy-editor-viewport-transport/Cargo.toml` and the reason its `cfg` note gives.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cy-cargo-${{ matrix.label }}-${{ hashFiles('editor/Cargo.lock') }}
          restore-keys: cy-cargo-${{ matrix.label }}-
      - name: The editor's gates and its whole test suite
        run: just build-editor-check

  # The rest of M5, on Linux. The session needs a Unix domain socket — the live bridge is one, and
  # cy-runtime-stub refuses to pretend otherwise — so this job is not a matrix.
  authorable:
    name: authorable — the session, the importer, live reload
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - name: Install the generator and the window-system headers SDL3 builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxkbcommon-dev libwayland-dev
      - uses: actions/cache@v4
        with:
          path: build/dev
          key: cy-build-authorable-${{ hashFiles('deps/manifest.toml', 'cmake/**', 'CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            cy-build-authorable-${{ hashFiles('deps/manifest.toml', 'cmake/**', 'CMakeLists.txt') }}-
            cy-build-authorable-
      # The importer's purity and the cache's honesty, neither of which a functional test notices
      # being lost.
      - name: The importer framework, its options and its glTF reader
        run: just test-unit -R import
      - name: Mesh operations, the glTF document and the pipeline end to end
        run: just test-integration -R import_
      - name: The derivation key and the derived-data cache
        run: just test-unit -R assets
      - name: A cache hit reproduces the output rather than skipping it
        run: just test-integration -R assets_io
      # M4 closed with the reload model proven and nothing reloading a module while a runtime ran.
      - name: A module reloads while the runtime is live, preserving world state
        run: just test-integration -R live_reload
      - name: The world's components, fields and chunks read from outside the process
        run: just test-integration -R abi_inspector
      # The artefact, and then the check that its own assertions still fire.
      - name: The scripted session outlives its runtime being killed
        run: just test-smoke -R editor_session
      - name: The session driver's own negative cases
        run: just test-integration -R editor_session_selftest
      # The recipe a contributor uses, rather than only the test that registers the same driver.
      - name: The artefact runs through the workflow recipe
        run: just run-editor-session --only survive

  # --- Scale: the world, the residency policy, the pages, the save and the build graph ------------
  #
  # M6's six new permanent gates in one job, for the reason `world` and `render` are each one job:
  # `test` runs every suite once and reports that they passed, which is a different claim from
  # "these particular properties still hold". Every command below is declared literally in
  # tools/roadmap/gates.toml and `just ci-check` compares the two, so the gate set and this file
  # cannot drift apart in the direction that matters.
  #
  # NO DEVICE AND NO DISPLAY, which is true of the whole milestone rather than a limitation of this
  # job: the world streams, the surfaces page and the save is written on the CPU. M6's virtual
  # texturing is the address spaces, the page tables, the caches, the feedback path and the
  # producers — the device side arrives with M7, and none of what is here needs one.
  scale:
    name: scale — streaming, residency, pages, saves, the build graph
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - name: Install the generator and the window-system headers SDL3 builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxkbcommon-dev libwayland-dev
      - uses: actions/cache@v4
        with:
          path: build/dev
          key: cy-build-scale-${{ hashFiles('deps/manifest.toml', 'cmake/**', 'CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            cy-build-scale-${{ hashFiles('deps/manifest.toml', 'cmake/**', 'CMakeLists.txt') }}-
            cy-build-scale-
      # Cell identity, spatial binding, the ECS-native cook, layers, HLOD and the overlay that
      # answers for a region which has never been loaded.
      - name: A cell's identity, its binding and its cooked form
        run: just test-unit -R unit.world
      # Staged atomic activation, and a request made during activation being queued rather than
      # processed re-entrantly.
      - name: Activation is atomic, and a re-entrant request is deferred
        run: just test-integration -R world_activation && just test-integration -R world_streaming
      # The milestone's exit criterion for this capability, measured over a fixed route.
      - name: Continuous traversal holds the tick budget with no hitch
        run: just test-integration -R world_traversal
      # Residency and activation separate BY CONSTRUCTION, and a budget spent at admission.
      - name: One policy over separate storage, with bytes held while nothing simulates
        run: just test-unit -R unit.residency
      - name: The residency server destroyed with requests in flight
        run: just test-integration -R residency_teardown
      # A surface is never missing, only blurry — over the whole address space of a texture.
      - name: The mip tail's guarantee, and feedback that drops rather than waits
        run: just test-unit -R unit.virtual_texturing
      - name: A hundred texture systems destroyed with production in flight
        run: just test-integration -R virtual_texturing_teardown
      # The overlay as the save, and a generation that survives the process being killed.
      - name: The overlay, its identity, its scopes and its dirty tracking
        run: just test-unit -R unit.save
      - name: Generations are atomic under kill -9, and an unloaded region round-trips
        run: just test-integration -R save_archive && just test-integration -R save_kill_nine
      - name: Migration, preservation, and a damaged chunk as a diagnostic
        run: just test-integration -R save_service && just test-integration -R save_fuzz
      # The spike's finding as a gate: a key that omits the compiler is unrepresentable.
      - name: Derivation keys, the toolchain fingerprint, and output digests
        run: just test-unit -R unit.build_graph
      - name: Byte-identical rebuilds, precise invalidation, and undeclared reads refused
        run: just test-integration -R build_service
      - name: A patch interrupted at any stage leaves the previous build playable
        run: just test-integration -R build_patch
      # GPU-driven culling's expected values, computed on the CPU so a dispatch can be checked
      # against them when it lands.
      - name: Visibility ranges, HLOD and shadow caster culling
        run: just test-unit -R unit.render_gpu_culling
      - name: The GPU culling side torn down with work outstanding
        run: just test-integration -R render_gpu_culling_teardown
      # `rendering-geometry-and-resources` completes here, and the ledger is the part of it whose
      # loss would be silent: release records a frame, retire reclaims, and nothing frees under a
      # frame that is still reading.
      - name: Geometry resources, and a ledger destroyed with work outstanding
        run: just test-unit -R unit.render_geometry
      - name: The geometry side torn down mid-flight
        run: just test-integration -R render_geometry_teardown

  # --- The two jobs M5.5 declared it could not land ----------------------------------------------
  #
  # m5b.toml's closing note asked for exactly these two, and said why they were not in that change:
  # "a gate and its job land in the same change or neither does", and .github/workflows/ci.yml was
  # not M5.5's file. They are M6's, and their gates are beside them in tools/roadmap/gates.toml.

  # The half of M5.5 a hosted runner can judge: no window, no graphics device, an agent on the other
  # end of `cyberdyne-editor --mcp`. It is a `smoke` CTest entry, so `test` runs it too — this job
  # exists because "the agent interface still refuses what a scope does not grant" is a different
  # claim from "the suite passed", and because the RECIPE a contributor types is run here as well.
  agent:
    name: agent — authoring over MCP, and what it is refused
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - name: Install the generator and the window-system headers SDL3 builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxkbcommon-dev libwayland-dev
      - name: The toolchain the editor declares
        run: just build-editor-toolchain
      - uses: actions/cache@v4
        with:
          path: build/editor
          key: cy-agent-${{ hashFiles('editor/Cargo.lock', 'editor/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            cy-agent-${{ hashFiles('editor/Cargo.lock', 'editor/Cargo.toml') }}-
            cy-agent-
      - name: An agent composes, authors, is refused, and is told what it spent
        run: just test-smoke -R agent_authoring
      - name: The artefact runs through the workflow recipe
        run: just run-agent-authoring

  # THE WINDOW, AND THE ONE JOB IN THIS FILE THAT A HOSTED RUNNER CANNOT RUN. It needs an X server
  # with XTEST, a device that can import a dma-buf with an explicit DRM format modifier, python-xlib
  # and Pillow. GitHub's hosted images have none of them, so this is `runs-on: [self-hosted, linux,
  # x11]`.
  #
  # THE GUARD IS NOT AN EXCUSE, IT IS WHAT MAKES THE JOB HONEST WHERE THE RUNNER DOES NOT EXIST. A
  # job targeting a self-hosted label nobody has queues forever, and every pull request in a fork
  # would look stuck rather than failing. `vars.CY_EDITOR_WINDOW_RUNNER` is set on a repository that
  # HAS such a runner and unset everywhere else, where this job is skipped and says so. The
  # criteria it covers carry `requires = "display"` in tools/roadmap/milestones/m5b.toml, so a
  # machine that cannot judge them reports NOT EVALUATED rather than green — the two mechanisms
  # answer different questions and neither replaces the other.
  editor-window:
    name: editor window — a person driving it, through XTEST
    needs: build
    if: vars.CY_EDITOR_WINDOW_RUNNER == 'true'
    runs-on: [self-hosted, linux, x11]
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - name: The toolchain the editor declares
        run: just build-editor-toolchain
      - name: The window opens, is driven, and is photographed
        run: just test-smoke -R editor_window
      - name: The artefact runs through the workflow recipe
        run: just run-editor-window

  # --- Format, static analysis, layering, and the workflow's own checks --------------------------
  quality:
    name: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - name: Install the tools the doctor requires
        run: npm install -g @fission-ai/openspec
      # Ubuntu 24.04's `clang-format` and `clang-tidy` are 18.1.3, and this repository pins LLVM 22:
      # 18 and 22 disagree about three sites in this tree and about which checks exist at all, so
      # installing the distribution package here would run a different gate from the one a developer
      # runs. The version is the justfile's `llvm_pin_version`, and `just env-doctor` prints this
      # exact command as the correction when the local tooling is not it.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned LLVM tooling
        run: pip install clang-format==22.1.8 clang-tidy==22.1.8
      - name: Install the window-system headers
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxkbcommon-dev libwayland-dev
      # THE THIRD JOB THAT INSTALLS SWIFT, AND THE REASON IS THE LINT GATE'S INPUT.
      # `just quality-lint` runs clang-tidy against compile_commands.json, and without a Swift
      # toolchain samples/04-character/ and bindings/swift/ never declare their targets — so four
      # C++ translation units, 1 990 lines including the sample host that M4's whole "no C++
      # gameplay" claim is about, were formatted by the gate above (which walks the tree) and linted
      # by nobody. The format gate is a tree walk and needs nothing; this one needs the build.
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'
      - uses: actions/cache@v4
        with:
          path: build/dev
          key: cy-build-quality-${{ hashFiles('deps/manifest.toml', 'cmake/**', 'CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            cy-build-quality-${{ hashFiles('deps/manifest.toml', 'cmake/**', 'CMakeLists.txt') }}-
            cy-build-quality-
      - name: Formatting
        run: just quality-format-check
      # The layer rule is checked in two places and this recipe runs both: the source-level scan,
      # and the fixtures whose configure must fail. It needs no build.
      - name: Layering
        run: just quality-layers
      - name: The workflow itself
        run: just ci-check
      # clang-tidy needs the flags every file is compiled with, so the build comes first.
      - name: Configure and build for the compile database
        run: just build-engine
      - name: Static analysis
        run: just quality-lint
      # The other half of the layer rule, and the half quality-layers cannot reach: the project
      # graph's rejections are configure-time failures over fixture projects, so they are registered
      # as a CTest test rather than run by a recipe of their own. The `project-graph` gate declares
      # this command; without a job that runs it the check exists and gates nothing.
      - name: The project graph's rejections
        run: just test-integration -R project_graph

  # --- The specification set ----------------------------------------------------------------------
  specs:
    name: spec validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - name: Install the OpenSpec CLI
        run: npm install -g @fission-ai/openspec
      - name: Validate
        run: just quality-specs

  # --- Generated code, and the attribution generated from the dependency manifest -----------------
  generated:
    name: generated-code currency
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - name: Install the generator and the window-system headers
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxkbcommon-dev libwayland-dev
      # The reflection generator parses annotated C++ with a real frontend, so this job — the one
      # that asserts generated output is current and reproducible — is the one that must have it.
      # Without these two packages `just generate-check` fails naming them, which is the generator
      # being honest rather than silently skipping the check it exists to be.
      - name: Install the reflection generator's frontend
        run: |
          sudo apt-get install -y libclang1-18
          pip install --user clang==18.1.8
      - uses: actions/cache@v4
        with:
          path: build/dev
          key: cy-build-generated-${{ hashFiles('deps/manifest.toml', 'cmake/**', 'CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            cy-build-generated-${{ hashFiles('deps/manifest.toml', 'cmake/**', 'CMakeLists.txt') }}-
            cy-build-generated-
      # THIRD_PARTY.md is generated from deps/manifest.toml and needs nothing configured.
      - name: Attribution matches the dependency manifest
        run: just maintenance-deps-check
      # The generated headers are a function of the configuration, so a configure comes first.
      - name: Configure
        run: just build-engine
      - name: Generated headers are current and reproducible
        run: just generate-check
      - name: The generators, the feature options and the module graph
        run: just generate-test

  # --- Type and field identity, and the reflection round-trip goldens -----------------------------
  #
  # Task 6.1 and 6.2. `core-type-system` requires a check that "diffs the manifest and fails when an
  # existing entry's identifier changes, so an accidental identity change is a red build rather than
  # a corrupted save months later". `just quality-identity` is that check; until this job existed it
  # ran in no continuous-integration job at all, which made it a check a developer might remember
  # rather than a gate. The `identity` and `reflection` gates in tools/roadmap/gates.toml declare
  # these commands, and `just ci-check` fails if this job stops running them.
  #
  # It is a job of its own rather than a step in `quality` because it needs what that job does not:
  # the generator's compiler frontend, and a configured build to read the annotated headers the
  # build itself declares — so the gate cannot check a different set of types than the build
  # compiles.
  identity:
    name: identity and reflection
    runs-on: ubuntu-24.04
    steps:
      # The manifest gate diffs the identifiers against a revision, so it needs history rather than
      # the single commit actions/checkout fetches by default.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@v3
      - name: Install the generator and the window-system headers
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxkbcommon-dev libwayland-dev
      - name: Install the reflection generator's frontend
        run: |
          sudo apt-get install -y libclang1-18
          pip install --user clang==18.1.8
      - uses: actions/cache@v4
        with:
          path: build/dev
          key: cy-build-identity-${{ hashFiles('deps/manifest.toml', 'cmake/**', 'CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            cy-build-identity-${{ hashFiles('deps/manifest.toml', 'cmake/**', 'CMakeLists.txt') }}-
            cy-build-identity-
      # The identity gate reads the argument vector src/core/reflect/CMakeLists.txt writes at
      # configure time, so the configure comes first.
      - name: Configure
        run: just build-engine
      - name: Type and field identity against the tree and against git
        run: just quality-identity
      # The gate's own negative fixture: a field is renamed in a real tree and generation must fail
      # naming it. An identity check that has silently stopped firing fails here rather than passing
      # everything.
      - name: The identity gate still rejects an untombstoned rename
        run: just test-integration -R reflect_generator
      - name: The reflection round-trip goldens
        run: just test-unit -R reflect_

  # --- Every profile, not just the one everyone develops in ---------------------------------------
  #
  # Task 6.7. The build and test jobs above cover `dev`; this covers the other three. M0's gate found
  # a class of failure that only appears outside the default profile — assertions compiled out,
  # different optimisation, a different NDEBUG — and a milestone that only ever built `dev` would
  # have shipped it.
  #
  # The three profiles are separate steps rather than a matrix because tools/roadmap/gates.toml
  # declares each command literally and `just ci-check` compares the declared commands against what
  # this file runs: a matrix expression would make the gate set unverifiable, which is the drift the
  # check exists to prevent.
  profiles:
    name: profiles
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - name: Install the generator and the window-system headers SDL3 builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxkbcommon-dev libwayland-dev
      # THE SECOND JOB THAT INSTALLS SWIFT, AND M4'S GATE IS WHY. Without a toolchain,
      # bindings/swift/ and samples/04-character/ do not register their suites at all — so this job
      # was reporting three profiles green with the milestone's own artefact absent from the tree,
      # while `tools/roadmap/milestones/m4.toml`'s `four-profiles` criterion claimed it built "the
      # game module at swiftc -O in Profile and Shipping". It does now: the sample's Swift
      # configuration follows the engine profile, so `release` and `profile` here are the only place
      # in continuous integration where a Swift module is built optimised.
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'
      - uses: actions/cache@v4
        with:
          path: |
            build/debug
            build/profile
            build/release
          key: cy-build-profiles-${{ hashFiles('deps/manifest.toml', 'cmake/**', 'CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            cy-build-profiles-${{ hashFiles('deps/manifest.toml', 'cmake/**', 'CMakeLists.txt') }}-
            cy-build-profiles-
      - name: Build debug
        run: just build-engine --profile debug
      - name: Test debug
        run: just test-all --profile debug
      - name: Build profile
        run: just build-engine --profile profile
      - name: Test profile
        run: just test-all --profile profile
      - name: Build release
        run: just build-engine --profile release
      - name: Test release
        run: just test-all --profile release

  # --- THE CLOSED MILESTONES' OWN CRITERIA, WHICH NOTHING RAN UNTIL M6 --------------------------
  #
  # M6 TASK 10.9. Seven milestone gates in tools/roadmap/gates.toml carried `state = "green"` and no
  # job in this file ran one of them: `roadmap-milestone` appeared here in a COMMENT and nowhere
  # else. `delivery-roadmap` puts a closed milestone's criteria into the permanent set the moment it
  # closes and requires them to stay green, and a set nothing runs cannot go visibly red — the same
  # failure as M2's `milestone-m1` gate never being promoted, one level up. It is also the unmet
  # precondition that specification names for reducing the audit at M9, which is why it is closed
  # here rather than found there. `tools/ci/check_workflows.py` now fails when a green milestone
  # gate is unevaluated, so this job cannot quietly disappear again.
  #
  # ONE LEDGER, NOT TEN. The ledger has been flat since M5: `just roadmap-milestone m8a` evaluates
  # M0 through M8.a merged and deduplicated, each distinct check exactly once. Seven separate
  # invocations would run `four-profiles` seven times, which is the multiplication the flattening
  # removed and which `check_workflows.gate_coverage` therefore does not ask for.
  #
  # IT NAMES THE NEWEST *CLOSED* MILESTONE, AND THAT LINE MOVES WHEN A MILESTONE CLOSES. When
  # `milestone-m6` flips from `joins-on-close` to `green`, `m5b` below becomes `m6` in the same
  # commit; `just ci-check` fails until it does, which is the same forcing function `just
  # roadmap-test` already applies to the flip itself. gates.toml says so beside that gate.
  #
  # IT DID NOT MOVE TO `m8a` AT M8.a's OWN CLOSING GATE — that gate declined to flip a gate it could
  # not run green, over `m1:four-profiles` — and it moved afterwards, once the per-case budget was
  # normalised against a reference workload and Debug went from sixteen failures to 57/57.
  #
  # IT SAYS `m9` NOW, AND THAT EDIT LANDED IN THE SAME CHANGE THAT SET `milestone-m9` GREEN in
  # tools/roadmap/gates.toml (task 7.4), which is why the paragraph below still says `m8b`: it is the
  # record of the edit that established the rule, and the rule has been applied at every milestone
  # since. M9 adds forty-nine criteria of which one, `lockstep-cross-platform`, carries
  # `where = "ci"` — and THIS IS THE JOB IT DEFERS TO, which had never run once when M9's gate looked.
  # tools/roadmap/gates.toml. The two move together or not at all: `tools/ci/check_workflows.py`
  # fails when a green milestone gate sits above the newest ledger any workflow evaluates, and
  # `just roadmap-test` fails when an archived milestone's gate is still `joins-on-close`. What this
  # job gains is M8.b's thirty-five new criteria on top of M8.a's — the largest single addition any
  # milestone has made — of which exactly one, `m8b:render-assembly-device`, carries
  # `requires = "gpu"` and will be reported NOT EVALUATED here. Everything else, the closing
  # artefact included, is judged on this hosted runner: the slice assembles a frame without a
  # device and its picture is a committed file rather than a criterion that takes one.
  #
  # WHAT IT COSTS, PLAINLY, AND WHAT THAT COSTS IN TURN. This is the most expensive job in the file:
  # M5.5's ledger is 112 criteria and contains `four-profiles`, a build and a full test of all four
  # configurations. On the machine M6's gate ran it, one pass took hours. So it runs on the nightly
  # schedule, on `workflow_dispatch`, and on a **push to `main`** — not on every pull request.
  #
  # BE CLEAR ABOUT WHAT THAT WEAKENS. `delivery-roadmap` puts a closed milestone's criteria in the
  # permanent set and requires them to stay green, and the permanent set is a MERGE gate. This job
  # catches a regression within a day of merging rather than before merging, which is less than the
  # requirement asks for and much more than the nothing that ran until M6. The reason it is not
  # blocking is not principle but arithmetic: a merge gate that takes four hours is a merge gate
  # people route around, and the alternative to a slow gate is not a fast one, it is an override.
  #
  # What makes the reduction defensible rather than convenient is that most of the ledger's WORK is
  # already blocking through other jobs — `build`, `test`, `profiles`, `quality`, `specs`,
  # `generated`, `identity` and `roadmap` run the same recipes on every pull request. What this job
  # adds that nothing else does is the artefact recipes, the tier records, and the ledger's own
  # arithmetic. Narrowing it to a post-merge and nightly run is recorded here so the next milestone
  # can widen it rather than rediscover it.
  milestone:
    name: milestone — the closed milestones' exit criteria
    needs: build
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - name: Install the generator and the window-system headers SDL3 builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxkbcommon-dev libwayland-dev
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'
      - name: Install the pinned LLVM tooling and the specification CLI
        run: |
          pip install clang-format==22.1.8 clang-tidy==22.1.8
          npm install -g @fission-ai/openspec@latest
      - name: The exit criteria of every closed milestone, evaluated once each
        run: just roadmap-milestone m9 --ci

  # --- The capability status record ---------------------------------------------------------------
  roadmap:
    name: roadmap-status
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - name: Status matches the specification set
        run: just roadmap-status
      # The drift detection's own negative fixtures: a status recipe that stopped failing on drift
      # would report every capability green and gate nothing.
      - name: The drift detection still fires
        run: just roadmap-test
