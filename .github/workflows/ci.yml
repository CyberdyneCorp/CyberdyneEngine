# CyberdyneEngine — continuous integration.
#
# Every command below is a `just` recipe or the installation of a tool `just env-doctor` would tell
# a developer to install. That is not a convention: `developer-workflow-and-just` requires that a
# check gating a change is runnable locally by one command and that the local and remote invocations
# are the same code path, and lists a workflow that duplicates rather than invokes recipes among its
# forbidden patterns. `just ci-check` enforces both, and runs in the `quality` job below.
#
# What continuous integration adds around the recipes — checkout, caching, the matrix, artefact
# upload — is `uses:` steps and job configuration, which wrap the recipes rather than replacing
# them.
#
# The gate set is declared once, as data, in tools/roadmap/gates.toml — `just roadmap-gates` prints
# it. The jobs below are that list arranged into jobs: build, test, sanitizers and throughput,
# quality, spec validation, generated-code currency, identity and reflection, the non-default
# profiles, and the roadmap status record. `just ci-check` fails when a permanent gate declared
# there is run by no job here, so the two cannot drift apart in the direction that matters;
# `just ci-jobs` prints what this file actually invokes.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The engine's default working profile. Every recipe takes --profile; CI states it once here so
  # that a job cannot silently test a configuration nobody builds.
  CY_PROFILE: dev

jobs:
  # --- The three-platform, two-architecture build ------------------------------------------------
  build:
    name: build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-x86_64, os: ubuntu-24.04 }
          - { label: linux-arm64, os: ubuntu-24.04-arm }
          - { label: macos-x86_64, os: macos-13 }
          - { label: macos-arm64, os: macos-14 }
          - { label: windows-x86_64, os: windows-2022, msvc: x64 }
          - { label: windows-arm64, os: windows-11-arm, msvc: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - if: matrix.msvc != ''
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc }}
      - name: Install the tools the doctor requires
        run: npm install -g @fission-ai/openspec
      # The pinned LLVM tooling. `just env-doctor` requires it on every host — the format and lint
      # gates are the project's, not Linux's — and the version is the one the justfile pins, which
      # is the same command `just env-doctor` prints as the correction. A distribution package
      # would be a different version on each runner, which is the ambiguity the pin removes.
      #
      # setup-python is here so that `pip` means the same interpreter on all six legs of the matrix;
      # the Windows and macOS images do not agree about whether it is `pip`, `pip3` or neither.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned LLVM tooling
        run: pip install clang-format==22.1.8 clang-tidy==22.1.8
      - name: Install the window-system headers SDL3 builds against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libwayland-dev libxkbcommon-dev
      - name: Install the generator
        if: runner.os == 'macOS'
        run: brew install ninja
      # Keyed on the dependency manifest, per task 2.4.3: a change to deps/manifest.toml is exactly
      # the change that invalidates the fetched sources, and nothing else does. The build tree rides
      # in the same cache so that the test job restores what this job produced.
      - uses: actions/cache@v4
        with:
          path: build/dev
          key: cy-build-${{ matrix.label }}-${{ hashFiles('deps/manifest.toml', 'cmake/**', 'CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            cy-build-${{ matrix.label }}-${{ hashFiles('deps/manifest.toml', 'cmake/**', 'CMakeLists.txt') }}-
            cy-build-${{ matrix.label }}-
      - name: Diagnose the environment
        run: just env-doctor
      # `just build-engine`, not `just build-all`, because tools/roadmap/gates.toml declares that
      # command for the build-and-test gate and `just ci-check` fails when a declared gate is not
      # run. build-all is a one-line alias to it; the gate list is the thing that must not drift.
      - name: Build
        run: just build-engine

  # --- The graduated test set --------------------------------------------------------------------
  test:
    name: test ${{ matrix.label }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-x86_64, os: ubuntu-24.04 }
          - { label: linux-arm64, os: ubuntu-24.04-arm }
          - { label: macos-x86_64, os: macos-13 }
          - { label: macos-arm64, os: macos-14 }
          - { label: windows-x86_64, os: windows-2022, msvc: x64 }
          - { label: windows-arm64, os: windows-11-arm, msvc: arm64 }
    env:
      # The machine-readable results `testing-and-quality` requires of a continuous integration run.
      # The recipe already knows how to produce them; the job only says where to put them.
      CY_TEST_JUNIT: test-results.xml
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - if: matrix.msvc != ''
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc }}
      - name: Install the window-system headers SDL3 builds against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libwayland-dev libxkbcommon-dev
      - name: Install the generator
        if: runner.os == 'macOS'
        run: brew install ninja
      - uses: actions/cache@v4
        with:
          path: build/dev
          key: cy-build-${{ matrix.label }}-${{ hashFiles('deps/manifest.toml', 'cmake/**', 'CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            cy-build-${{ matrix.label }}-${{ hashFiles('deps/manifest.toml', 'cmake/**', 'CMakeLists.txt') }}-
            cy-build-${{ matrix.label }}-
      - name: Unit, integration and smoke
        run: just test-all
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.label }}
          path: test-results.xml
          if-no-files-found: ignore

  # --- The concurrency suites under a data-race detector, and the job system's throughput ---------
  #
  # Task 3.2.12. `core-jobs-and-concurrency` lists "a data-race detector integration (TSan)" among
  # the concurrency diagnostics a development build provides, and a job system whose races are only
  # detectable locally is a job system whose races reach a user. So the sanitizers run here rather
  # than being something a developer might remember.
  #
  # A sanitized tree is not interchangeable with an ordinary one — the instrumentation changes the
  # ABI — so `just test-sanitize` configures its own build directory and never reuses build/dev.
  # That is why this job restores no cache from `build`: there is nothing in it this job can use.
  #
  # The two sanitizers are separate steps because TSan is exclusive: it cannot be combined with
  # AddressSanitizer, so each pass costs its own build. Both are scoped to the jobs suites with
  # `--tests jobs`; widening that to the whole test set is `testing-and-quality`'s nightly run,
  # which is a schedule this file does not yet have.
  #
  # Leak detection is on, which is the recipe's default rather than this job's choice. M1 task 2.12
  # declared the trace's pooled per-thread slots and rings at the allocation site
  # (src/core/diagnostics/src/lifetime.h), so a leak reported here is a defect rather than the
  # standing false positive M0 carried.
  sanitize:
    name: sanitizers and throughput
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - name: Install the generator and the window-system headers SDL3 builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libwayland-dev libxkbcommon-dev
      # ThreadSanitizer first: it is the one the specification names, and running it before the
      # slower combined pass means a race is reported early rather than after two builds.
      - name: Data races over the job suite (TSan)
        run: just test-sanitize --sanitizer thread --tests jobs
      - name: Memory errors and undefined behaviour over the job suite (ASan + UBSan)
        run: just test-sanitize --sanitizer address,undefined --tests jobs
      # M2's suites, through the same two trees. `ecs_scheduling` is the first thing in the engine
      # that runs two systems over one world at once, and the race that shape produced was found by
      # this tool and closed with atomics; a regression there is a corrupted chunk under a parallel
      # reader, which no functional test reliably catches. Both trees are already configured by the
      # two steps above, so these are incremental builds rather than whole ones.
      - name: Data races over the suite that iterates one world from two systems (TSan)
        run: just test-sanitize --sanitizer thread --tests ecs_scheduling
      - name: Memory errors and undefined behaviour over the ECS suites (ASan + UBSan)
        run: just test-sanitize --sanitizer address,undefined --tests ecs
      # The throughput benchmark is a gate rather than a report: every metric it checks is
      # dimensionless — a speedup divided by the worker count, or a cost in units of a calibration
      # workload measured in the same process — precisely so that a two-core shared runner and a
      # workstation are held to the same threshold. It exits non-zero on a regression.
      #
      # `--profile profile` because assertions are compiled out there; a measurement taken with them
      # on is not the number the thresholds were recorded against, and the recipe says so.
      - name: Job system throughput against its thresholds
        run: just test-bench-jobs --profile profile

  # --- The world: the ECS, the node façade, the cook, and the state hash ---------------------------
  #
  # M2's four new permanent gates, and they are a job of their own rather than steps in `test`
  # because of what they are: `test` runs every suite once and reports that they passed, which is a
  # different claim from "these particular properties still hold". Each command below is declared
  # literally in tools/roadmap/gates.toml and `just ci-check` compares the two, so the gate set and
  # this file cannot drift apart in the direction that matters.
  #
  # The suites run here also run inside `just test-all` in the test job. That duplication is
  # deliberate and cheap: a gate has to name the command that checks it, and a gate whose only
  # evidence is "some larger command included it" is a gate nobody can point at when it fails.
  world:
    name: world — ecs, nodes, cooking, state hash
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - name: Install the generator and the window-system headers SDL3 builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libwayland-dev libxkbcommon-dev
      - uses: actions/cache@v4
        with:
          path: build/dev
          key: cy-build-world-${{ hashFiles('deps/manifest.toml', 'cmake/**', 'CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            cy-build-world-${{ hashFiles('deps/manifest.toml', 'cmake/**', 'CMakeLists.txt') }}-
            cy-build-world-
      # A structural change attempted mid-iteration is refused and counted, in every profile — a
      # returned error and a counter, never an assertion that two profiles compile out.
      - name: Structural change is observable only at flush points
        run: just test-unit -R ecs
      # The case that reproduced the race: two systems iterating one world at once.
      - name: Systems declare their access, and a stage runs them in parallel
        run: just test-integration -R ecs_scheduling
      # The milestone's named spike, as a gate: an authored hierarchy lowers to chunk-shaped blocks,
      # flattening is a walk to the root, and a cooked reference is a site in a table.
      - name: An authored hierarchy lowers to archetype blocks
        run: just test-integration -R scene_cooking
      - name: A cooked block activates as one memcpy per column per chunk
        run: just test-integration -R ecs_scale
      # No node duplicates component data, and no traversal produces a state a query would not.
      - name: The coherence invariants between nodes and entities
        run: just test-integration -R scene_scale
      # Across processes, not across iterations of one loop: a fresh address space is what exposes a
      # hash that depended on an allocation address or a per-process seed.
      - name: The state hash reproduces across processes
        run: just test-smoke -R tick_loop
      - name: The milestone artefact, across processes and across a snapshot restore
        run: just test-smoke -R headless_sim

  # --- Format, static analysis, layering, and the workflow's own checks --------------------------
  quality:
    name: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - name: Install the tools the doctor requires
        run: npm install -g @fission-ai/openspec
      # Ubuntu 24.04's `clang-format` and `clang-tidy` are 18.1.3, and this repository pins LLVM 22:
      # 18 and 22 disagree about three sites in this tree and about which checks exist at all, so
      # installing the distribution package here would run a different gate from the one a developer
      # runs. The version is the justfile's `llvm_pin_version`, and `just env-doctor` prints this
      # exact command as the correction when the local tooling is not it.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned LLVM tooling
        run: pip install clang-format==22.1.8 clang-tidy==22.1.8
      - name: Install the window-system headers
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libwayland-dev libxkbcommon-dev
      - uses: actions/cache@v4
        with:
          path: build/dev
          key: cy-build-quality-${{ hashFiles('deps/manifest.toml', 'cmake/**', 'CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            cy-build-quality-${{ hashFiles('deps/manifest.toml', 'cmake/**', 'CMakeLists.txt') }}-
            cy-build-quality-
      - name: Formatting
        run: just quality-format-check
      # The layer rule is checked in two places and this recipe runs both: the source-level scan,
      # and the fixtures whose configure must fail. It needs no build.
      - name: Layering
        run: just quality-layers
      - name: The workflow itself
        run: just ci-check
      # clang-tidy needs the flags every file is compiled with, so the build comes first.
      - name: Configure and build for the compile database
        run: just build-engine
      - name: Static analysis
        run: just quality-lint
      # The other half of the layer rule, and the half quality-layers cannot reach: the project
      # graph's rejections are configure-time failures over fixture projects, so they are registered
      # as a CTest test rather than run by a recipe of their own. The `project-graph` gate declares
      # this command; without a job that runs it the check exists and gates nothing.
      - name: The project graph's rejections
        run: just test-integration -R project_graph

  # --- The specification set ----------------------------------------------------------------------
  specs:
    name: spec validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - name: Install the OpenSpec CLI
        run: npm install -g @fission-ai/openspec
      - name: Validate
        run: just quality-specs

  # --- Generated code, and the attribution generated from the dependency manifest -----------------
  generated:
    name: generated-code currency
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - name: Install the generator and the window-system headers
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libwayland-dev libxkbcommon-dev
      # The reflection generator parses annotated C++ with a real frontend, so this job — the one
      # that asserts generated output is current and reproducible — is the one that must have it.
      # Without these two packages `just generate-check` fails naming them, which is the generator
      # being honest rather than silently skipping the check it exists to be.
      - name: Install the reflection generator's frontend
        run: |
          sudo apt-get install -y libclang1-18
          pip install --user clang==18.1.8
      - uses: actions/cache@v4
        with:
          path: build/dev
          key: cy-build-generated-${{ hashFiles('deps/manifest.toml', 'cmake/**', 'CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            cy-build-generated-${{ hashFiles('deps/manifest.toml', 'cmake/**', 'CMakeLists.txt') }}-
            cy-build-generated-
      # THIRD_PARTY.md is generated from deps/manifest.toml and needs nothing configured.
      - name: Attribution matches the dependency manifest
        run: just maintenance-deps-check
      # The generated headers are a function of the configuration, so a configure comes first.
      - name: Configure
        run: just build-engine
      - name: Generated headers are current and reproducible
        run: just generate-check
      - name: The generators, the feature options and the module graph
        run: just generate-test

  # --- Type and field identity, and the reflection round-trip goldens -----------------------------
  #
  # Task 6.1 and 6.2. `core-type-system` requires a check that "diffs the manifest and fails when an
  # existing entry's identifier changes, so an accidental identity change is a red build rather than
  # a corrupted save months later". `just quality-identity` is that check; until this job existed it
  # ran in no continuous-integration job at all, which made it a check a developer might remember
  # rather than a gate. The `identity` and `reflection` gates in tools/roadmap/gates.toml declare
  # these commands, and `just ci-check` fails if this job stops running them.
  #
  # It is a job of its own rather than a step in `quality` because it needs what that job does not:
  # the generator's compiler frontend, and a configured build to read the annotated headers the
  # build itself declares — so the gate cannot check a different set of types than the build
  # compiles.
  identity:
    name: identity and reflection
    runs-on: ubuntu-24.04
    steps:
      # The manifest gate diffs the identifiers against a revision, so it needs history rather than
      # the single commit actions/checkout fetches by default.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@v3
      - name: Install the generator and the window-system headers
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libwayland-dev libxkbcommon-dev
      - name: Install the reflection generator's frontend
        run: |
          sudo apt-get install -y libclang1-18
          pip install --user clang==18.1.8
      - uses: actions/cache@v4
        with:
          path: build/dev
          key: cy-build-identity-${{ hashFiles('deps/manifest.toml', 'cmake/**', 'CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            cy-build-identity-${{ hashFiles('deps/manifest.toml', 'cmake/**', 'CMakeLists.txt') }}-
            cy-build-identity-
      # The identity gate reads the argument vector src/core/reflect/CMakeLists.txt writes at
      # configure time, so the configure comes first.
      - name: Configure
        run: just build-engine
      - name: Type and field identity against the tree and against git
        run: just quality-identity
      # The gate's own negative fixture: a field is renamed in a real tree and generation must fail
      # naming it. An identity check that has silently stopped firing fails here rather than passing
      # everything.
      - name: The identity gate still rejects an untombstoned rename
        run: just test-integration -R reflect_generator
      - name: The reflection round-trip goldens
        run: just test-unit -R reflect_

  # --- Every profile, not just the one everyone develops in ---------------------------------------
  #
  # Task 6.7. The build and test jobs above cover `dev`; this covers the other three. M0's gate found
  # a class of failure that only appears outside the default profile — assertions compiled out,
  # different optimisation, a different NDEBUG — and a milestone that only ever built `dev` would
  # have shipped it.
  #
  # The three profiles are separate steps rather than a matrix because tools/roadmap/gates.toml
  # declares each command literally and `just ci-check` compares the declared commands against what
  # this file runs: a matrix expression would make the gate set unverifiable, which is the drift the
  # check exists to prevent.
  profiles:
    name: profiles
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - name: Install the generator and the window-system headers SDL3 builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libwayland-dev libxkbcommon-dev
      - uses: actions/cache@v4
        with:
          path: |
            build/debug
            build/profile
            build/release
          key: cy-build-profiles-${{ hashFiles('deps/manifest.toml', 'cmake/**', 'CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            cy-build-profiles-${{ hashFiles('deps/manifest.toml', 'cmake/**', 'CMakeLists.txt') }}-
            cy-build-profiles-
      - name: Build debug
        run: just build-engine --profile debug
      - name: Test debug
        run: just test-all --profile debug
      - name: Build profile
        run: just build-engine --profile profile
      - name: Test profile
        run: just test-all --profile profile
      - name: Build release
        run: just build-engine --profile release
      - name: Test release
        run: just test-all --profile release

  # --- The capability status record ---------------------------------------------------------------
  roadmap:
    name: roadmap-status
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - name: Status matches the specification set
        run: just roadmap-status
      # The drift detection's own negative fixtures: a status recipe that stopped failing on drift
      # would report every capability green and gate nothing.
      - name: The drift detection still fires
        run: just roadmap-test
