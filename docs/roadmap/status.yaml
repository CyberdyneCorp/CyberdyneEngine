# Per-capability implementation status — the authoritative record.
#
# tier:      none | seed | working | complete
# milestone: the milestone that last advanced this capability, or null
# change:    the OpenSpec change that advanced it, or null
#
# A change that implements or advances a capability updates its entry in the same
# commit. `just roadmap::status` fails when the keys here and the capability
# directories under openspec/specs/ disagree.
#
# The planned path of each capability through the milestone ladder is in
# capability-matrix.md; this file records what is actually true today.

# --- M8.a's amendment: two rows the plan marked Complete are still Working, and one row moved -----
#
# M8.a planned TWO capabilities reaching Complete. Its closing gate checked both against the code and
# neither is supported, so the plan was corrected rather than the record relaxed — the practice M5's
# gate started, M6's continued over five rows and M7's over six. The argument for each, with the
# unmet requirement and the command that shows it, is in tools/roadmap/milestones/m8a.toml beside
# `[criterion.expect_tiers]`, in the M8.a section of docs/ROADMAP.md, and in
# docs/roadmap/capability-matrix.md#where-m8as-tiers-are-thin. In short:
#
#   serialization-and-prefabs         working  The engine reads and writes `.cyworld`, the file's
#                                              type section is the schema a transaction addresses,
#                                              an unknown type survives a round trip byte for byte,
#                                              and all twelve editor operation variants decode. What
#                                              is absent is what M6's gate named and M8.a did not
#                                              touch: "Apply and extract" has no implementation
#                                              anywhere, and src/scene/serialization/README.md still
#                                              says so in its own words. `InstantiatePrefab` and
#                                              `SetPrefabOverride` are DECODED and counted as
#                                              IGNORED. The Complete cell moves to M8.b.
#   editor-documents-and-transactions working  One transaction per created primitive, per imported
#                                              mesh and per added body; undo empties the document and
#                                              the engine's world together; the out-of-band write
#                                              audit reads zero over a full session. But "Source
#                                              control integration" is UNSTARTED — no provider trait,
#                                              no Git, no Perforce, no null provider — and a
#                                              capability with one of twelve requirements unstarted
#                                              is not Complete. The Complete cell moves to M11,
#                                              beside every other editor-* row.
#
# ONE ROW'S `milestone` FIELD MOVED, AND ONLY ONE, BECAUSE THE FIELD MEANS "THE MILESTONE THAT LAST
# ADVANCED THE TIER" — the rule M5.5's gate wrote down when it declined to inflate two rows that had
# received substantial implementation without changing tier.
#
#   physics  M4 -> M8A.  This is a CORRECTION, not an advance, and it is the same correction M5.5's
#       gate made when it moved `editor-ui-ux`'s Working out of M5. `physics` was recorded Working at
#       M4 with NO `src/physics/` IN THE TREE: the capability's "Physics components" requirement —
#       bodies and colliders expressed as ECS components, created in a world, with
#       `cy::scene::LocalTransform` written back — had no implementation for four milestones, so
#       "the requirements a real project depends on are satisfied" was not true of the row.
#       `samples/04-character` did that work longhand in its own host, which is why M4's gate flagged
#       the absence and why implement-m8a-authorable's proposal opens with it. M8.a is the milestone
#       at which Working became true, and the record now says so.
#
# THE OTHER THREE ROWS M8.a NAMES DID NOT MOVE, and that is deliberate:
#   asset-import-pipeline (M5) gained `asset.import`, an OBJ importer, a primitive importer and one
#       derivation key across four formats. Working was already supportable at M5 — a project could
#       cook glTF and FBX — so the tier did not advance and the field does not move.
#   gameplay-framework (M4) gained `cy::gameplay::PlaySession` and spawning, so pressing play
#       simulates the authored world instead of reporting `hosting: NoRuntime`. Seed —
#       "interfaces, data model and invariants exist" — was already true at M4.
#   serialization-and-prefabs (M2) and editor-documents-and-transactions (M5) are the two above.
#
# SO M8.a ADVANCES NO CAPABILITY TIER. That is worth stating rather than leaving to be inferred from
# a diff of this file, and it is not the same as saying the milestone delivered little: it built
# src/physics/, src/gameplay/play/, two importers, the engine's `.cyworld` reader and writer, and a
# play session that restores a document byte for byte. It is what happens when a milestone's job is
# to make three existing records honest rather than to reach a new tier.

# --- M7's amendment, and why six rows the plan marked Complete are still Working -------------------
#
# M7's plan (docs/ROADMAP.md, the matrix, and implement-m7-fidelity/proposal.md) had NINE
# capabilities reaching Complete here. M7's closing gate checked each against the code; three are
# supported and six are not. The tiers below are what the tree holds. The argument for each, with
# the requirement that is unmet and the command that shows it, is in
# tools/roadmap/milestones/m7.toml beside `[criterion.expect_tiers]` and in
# docs/roadmap/capability-matrix.md#where-m7s-tiers-are-thin. In short:
#
#   rendering-architecture            working  The budget arbiter is built and certified over 71
#                                              step magnitudes with a negative control. Nothing in
#                                              the engine uses it: `libcy_rendering_arbiter.a` is
#                                              linked by its own two test binaries and by
#                                              samples/07-fidelity, and the seven
#                                              `SubsystemController`s live inside that sample over a
#                                              hard-coded cost table with one of seven costs taken
#                                              from the device. "Subsystem controllers SHALL …
#                                              report their measured cost to the arbiter" has no
#                                              instance under src/.
#   core-memory-and-containers        working  "Memory diagnostics" asks that a report be
#                                              attributable by domain, type, thread, world cell and
#                                              asset. Task 3.1 built all four axes — and NOTHING
#                                              PUSHES ONE. `grep -rn MemoryAttributionScope src/
#                                              tools/ samples/` outside src/core/memory/ returns
#                                              nothing, so the scenario "attribution answers a
#                                              question" is answerable only by a test that pushes
#                                              the scope itself. The mechanism is real; it has no
#                                              producer.
#   core-assets-and-io                working  Task 2.1's `StreamingSystem` is real and closes the
#                                              "Streaming" requirement M6 planned and did not touch.
#                                              Two others are not closed: "Hot reload" names cooked
#                                              outputs and `AssetSystem::reload` returns
#                                              NotImplemented for an asset served from a package
#                                              (asset_system.cpp:1182), and the "Development file
#                                              serving" scenario has no implementation —
#                                              `RemoteFileProvider` is an interface with no
#                                              transport, as src/core/assets/README.md has said
#                                              since M1.
#   rendering-culling-and-lod         working  M7 landed the GPU dispatch and it agrees with M6's
#                                              CPU reference. "Occlusion culling" is not closed:
#                                              `GpuCullPass::upload` REFUSES `kGpuCullOcclusion`
#                                              with NotImplemented because no hierarchical depth
#                                              buffer exists on the device, and the requirement's
#                                              "the HZB SHALL additionally serve cluster-granular
#                                              occlusion for virtual geometry" has no
#                                              implementation. `Hzb` and `TwoPassCull` are a CPU
#                                              model, tested as one; no frame occlusion-culls.
#   shader-system                     working  "Visual material editor" requires a node-graph
#                                              material editor in the editor that is a front-end
#                                              onto the material compiler. The compiler is here and
#                                              `cy_material` shows every lowering stage on a command
#                                              line; the editor has no material graph panel.
#   editor-viewport-and-gizmos        working  The engine's own renderer now fills the viewport over
#                                              a dma-buf, the engine generates the gizmo geometry,
#                                              a drag lands on a published handle and undo restores
#                                              the value exactly — all of it photographed. Task 5b.2
#                                              is NOT done: `.cyworld` is still read and written by
#                                              nothing under src/ or tools/, and
#                                              samples/05b-editor-window/runtime/session.h says so
#                                              in its own header — the runtime associates the
#                                              editor's identities with its own scene objects in
#                                              first-seen order and calls that "a stand-in for a
#                                              shared world". So "what you see is what ships" is not
#                                              true: three entities created in the editor during the
#                                              artefact changed nothing in the rendered image. The
#                                              "Selection and picking" requirement is engine-side
#                                              picking, and the artefact's own counter reads
#                                              `pick 0`.
#
# Three rows did reach Complete — rendering-materials-and-shading, residency and
# virtual-texturing — and nine advanced to Working with one new Seed.

# --- M6's amendment, and why five rows the plan marked Complete are still Working ------------------
#
# M6's plan (docs/ROADMAP.md, the matrix, and implement-m6-scale/proposal.md) had five capabilities
# reaching Complete here. M6's closing gate checked each against the code and none of the five is
# supported. The tiers below are what the tree holds; the argument for each, with the requirement
# that is unmet, is in tools/roadmap/milestones/m6.toml beside `[criterion.expect_tiers]` and in
# docs/roadmap/capability-matrix.md#where-m6s-tiers-are-thin. In short:
#
#   asset-import-pipeline             working  Model import's steps 7, 8 and 10 (skeletons,
#                                              animations, the prefab), USD, PNG/JPEG decoding, the
#                                              BC7/ASTC platform variants and the whole of "Virtual
#                                              geometry cooking" have no implementation.
#   core-assets-and-io                working  Its "Streaming" requirement — partial residency driven
#                                              by a residency budget and renderer feedback — is
#                                              unimplemented, and src/core/assets/ has NO change in
#                                              this milestone at all.
#   core-memory-and-containers        working  "Memory diagnostics" requires attribution by domain,
#                                              type, thread, world cell and asset; three of the five
#                                              axes do not exist. No change in this milestone.
#   serialization-and-prefabs         working  "Apply and extract" has no implementation anywhere in
#                                              the tree and no recorded exemption. The authoring
#                                              schema that landed here is real and is what made the
#                                              editor able to open a world; it is not the whole
#                                              capability.
#   rendering-geometry-and-resources  working  Its "Skinning" requirement reads bone matrices from
#                                              the GPU pose world, which is `animation-and-skinning`
#                                              at M8.b. `SkinningDescriptor::validate()` REFUSES that
#                                              value with NotImplemented and the suite asserts the
#                                              refusal. Task 10.8; the Complete cell moves to M8.b.
#
# Six rows did advance, all to Working, all recorded against implement-m6-scale.

