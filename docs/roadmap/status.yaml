# Per-capability implementation status — the authoritative record.
#
# tier:      none | seed | working | complete
# milestone: the milestone that last advanced this capability, or null
# change:    the OpenSpec change that advanced it, or null
#
# A change that implements or advances a capability updates its entry in the same
# commit. `just roadmap::status` fails when the keys here and the capability
# directories under openspec/specs/ disagree.
#
# The planned path of each capability through the milestone ladder is in
# capability-matrix.md; this file records what is actually true today.

# --- M6's amendment, and why five rows the plan marked Complete are still Working ------------------
#
# M6's plan (docs/ROADMAP.md, the matrix, and implement-m6-scale/proposal.md) had five capabilities
# reaching Complete here. M6's closing gate checked each against the code and none of the five is
# supported. The tiers below are what the tree holds; the argument for each, with the requirement
# that is unmet, is in tools/roadmap/milestones/m6.toml beside `[criterion.expect_tiers]` and in
# docs/roadmap/capability-matrix.md#where-m6s-tiers-are-thin. In short:
#
#   asset-import-pipeline             working  Model import's steps 7, 8 and 10 (skeletons,
#                                              animations, the prefab), USD, PNG/JPEG decoding, the
#                                              BC7/ASTC platform variants and the whole of "Virtual
#                                              geometry cooking" have no implementation.
#   core-assets-and-io                working  Its "Streaming" requirement — partial residency driven
#                                              by a residency budget and renderer feedback — is
#                                              unimplemented, and src/core/assets/ has NO change in
#                                              this milestone at all.
#   core-memory-and-containers        working  "Memory diagnostics" requires attribution by domain,
#                                              type, thread, world cell and asset; three of the five
#                                              axes do not exist. No change in this milestone.
#   serialization-and-prefabs         working  "Apply and extract" has no implementation anywhere in
#                                              the tree and no recorded exemption. The authoring
#                                              schema that landed here is real and is what made the
#                                              editor able to open a world; it is not the whole
#                                              capability.
#   rendering-geometry-and-resources  working  Its "Skinning" requirement reads bone matrices from
#                                              the GPU pose world, which is `animation-and-skinning`
#                                              at M8. `SkinningDescriptor::validate()` REFUSES that
#                                              value with NotImplemented and the suite asserts the
#                                              refusal. Task 10.8; the Complete cell moves to M8.
#
# Six rows did advance, all to Working, all recorded against implement-m6-scale.

