# Per-capability implementation status — the authoritative record.
#
# tier:      none | seed | working | complete
# milestone: the milestone that last advanced this capability, or null
# change:    the OpenSpec change that advanced it, or null
#
# A change that implements or advances a capability updates its entry in the same
# commit. `just roadmap::status` fails when the keys here and the capability
# directories under openspec/specs/ disagree.
#
# The planned path of each capability through the milestone ladder is in
# capability-matrix.md; this file records what is actually true today.

# --- M10's tiers: eight rows advanced, two completed, one demoted a second time, four cells moved --
#
# EIGHT ROWS ADVANCE HERE AND SEVEN OF THEM CAME FROM NOTHING. `environment-fields`, `terrain`,
# `water`, `foliage`, `weather-and-wind` and `procedural-content-generation` were all recorded at
# `none` with no directory in src/ when this milestone opened; `atmosphere-sky-and-clouds` was at
# Seed from M7 and `vfx-system` at Seed from M8.c. Each is at Working because its own criteria in
# tools/roadmap/milestones/m10.toml run suites over shipped code, not because the milestone's row in
# the plan said so.
#
#   vfx-system   seed -> working  M8C -> M10. M8.c's gate refused Working over an absent GPU compute
#                path and moved the cell here, naming the file and the function. `src/vfx/gpu/` is
#                that path: particle state resident in device buffers, indirect dispatch driven by
#                GPU-maintained counts, async compute where the device exposes a queue, the GPU sort
#                behind `BudgetLevers::sorted`, and the renderer kinds beyond Sprite and Mesh.
#                `cy::vfx` stays device-free so `integration.vfx` stays headless, which is why the
#                claim is split across a device-free criterion and a device one.
#
# TWO OF THE THREE ROWS M9 DEMOTED COMPLETE HERE, AND EACH BECAUSE THE CRITERION THAT BLOCKED IT
# WENT GREEN rather than because the gate re-read the specification and felt better about it:
#
#   diagnostics-profiling-and-crash  working -> complete  M9 -> M10. Both of M9's declared gaps are
#                                    closed and their declarations DELETED from m9.toml in the
#                                    change that closed them, because a declared gap that starts
#                                    passing fails the ledger. `CY_BREADCRUMB` is adopted at the five
#                                    boundaries the specification names — `Simulation::step`,
#                                    `Simulation::run_stage`, `AssetSystemImpl::publish`,
#                                    `CellActivation::publish`, `SaveService::perform_write` — each
#                                    asserted by its own module's suite; and a produced crash
#                                    artefact carries a basename and an offset from a module table
#                                    captured at install time rather than the build machine's paths.
#   gameplay-framework               working -> complete  M8B -> M10. `m9:gameplay-benchmarks` closed
#                                    the same way: `benchmarks/gameplay/` carries five committed
#                                    thresholds over the five rows of the specification's table a
#                                    measurement can speak to, and `bench_gameplay.cpp` names the two
#                                    it cannot and why.
#
# AND THE THIRD IS DEMOTED A SECOND TIME. `save-and-persistence` STAYS AT WORKING, M6, and its
# Complete cell moves from M10 to M11. Half of task 6.2 landed — conflict resolution over the logical
# metadata the specification names, on a `SaveSummary` that has no timestamp field in it, so "SHALL
# NOT be decided by file modification timestamps" is enforced by the type rather than by a
# convention. The other half did not: confidentiality needs a vetted AEAD, `thirdparty-dependencies`
# names mbedTLS as this engine's cryptography library and requires adoption to go through the
# OpenSpec change flow, and M10 added no dependency at all. A requirement-by-requirement audit then
# found the bill is larger than the two blockers M9 named: of twenty requirements, NINE SATISFIED,
# THREE UNMET and EIGHT PARTIAL, with the per-row evidence in src/save/README.md. design.md §4 wrote
# down in advance what a second demotion of one row means — the row is MIS-SCOPED RATHER THAN LATE,
# and that is a finding for M11's proposal rather than for M10's gate, where it is now carried.
#
# THE SKY IS AT WORKING WITH A DECLARED, FAILING GAP AGAINST IT, AND THE REASON IS WRITTEN HERE
# BECAUSE IT IS A JUDGEMENT. `m10:sky-field-round-trip` runs, fails, and names M11: the cloud shadow
# field is computed by a producer that reports writing tiles with darkest < 0.5, and
# `CloudShadowField::sample` returns the declared 1.0 at all twenty-five points inside
# `radius_metres`. Terrain and water round-trip through the same store, so it is the sky's write
# path. No consumer reads the field either — `grep -rn CloudShadow` outside src/rendering/sky/
# returns nothing — so "consumed by terrain, foliage, water, and illumination" has zero consumers as
# well as no readable producer.
#
# That is one requirement of thirteen, and it is half of one: the mechanism half of `Cloud shadows`
# ("the coarse field rather than virtual shadow pages") is met and enforced by an absent
# dependency — src/rendering/sky/CMakeLists.txt does not link cy::rendering-shadows, so there is no
# expression in the module that can allocate a shadow page — and the budget-lever half is met and
# counted. The twelve other requirements are built and MEASURED: five green criteria over five
# suites cover the physical atmosphere and its four tables, aerial perspective in the engine's own
# froxel volume, celestial bodies on a declared clock, sky composition, cloud representation and
# rendering, volumetric integration, planetary scale, environment profiles, the quality tiers, the
# diagnostics and the sky as a light. The tier ladder's Working is "the requirements a real project
# depends on are satisfied … optional and advanced requirements may be outstanding", and a project's
# sky is depended on for the sky, the sun and moon, aerial perspective and the sky light — all of
# which this row delivers — while cloud shadows darken a surface that is already lit.
#
# Recording it at Seed instead would say M10 did nothing for this row, which is false; recording it
# at Complete would be the failure the whole apparatus exists to catch. Working with a running,
# failing, rung-bearing gap is the same shape `audio` carries for `m8c:steam-audio-configures` and
# `simulation-and-determinism` for `m9:lockstep-cross-platform`. WHAT THIS RECORD DOES NOT SAY is
# that the gap is optional: if `sky-field-round-trip` is still open at M11 then this row does not
# reach Complete there, because the ledger will not let a declared gap be quietly deleted and will
# not let a passing one keep its declaration.
#
# FOUR COMPLETE CELLS MOVED OUT OF THE M10 COLUMN, and only one of them was M10's own row. The other
# three — `navigation`, `rendering-global-illumination` and `world-partition-and-streaming` — were
# parked in this column before M10 was written and this milestone never proposed, touched or audited
# any of them. `m9:record-matches-plan`, pointed at M10's own column, is the check that refused to
# let them close silently. The evidence per cell is in
# docs/roadmap/capability-matrix.md#where-m10s-tiers-are-thin; in short, each has a first-hand
# refutation rather than only an absence of work:
#
#   rendering-global-illumination  Cycle 2 of docs/roadmap/dependencies.md is the whole reason this
#                                  cell was at M10: an analytic sky seeds at M7 and "the physical
#                                  atmosphere … lands at M10, and GI reaches Complete there". The
#                                  atmosphere landed and THE SEAM WAS NEVER JOINED. `gi/lighting.h`
#                                  still says its two-colour sky "is the seam it will replace, not a
#                                  second sky"; nothing in the tree constructs a `gi::SkyTerm` from
#                                  `sky_light.h`'s gradient, and neither module links the other.
#   world-partition-and-streaming  The milestone whose column claimed this Complete closed on an
#                                  artefact with NO STREAMING IN IT: samples/10-world keeps the whole
#                                  world resident, meshes every terrain tile at level 0, and reports
#                                  `stitched_vertices` as zero precisely so a reader can see it.
#   navigation                     Terrain's contribution is real — `collision.h` produces a
#                                  `navigation::NavSourceGeometry` from the collision representation
#                                  — and it is one of sixteen requirements. Terrain "creates no body
#                                  and builds no navmesh", in its own CMakeLists' words, and no M10
#                                  task names this capability.

# --- M10's record audit: nineteen cells over four closed milestones, and the four rows it did NOT --
#
# M9's gate added `record-matches-plan`, ran the same comparison over every milestone whose gate was
# already green, and found NINETEEN cells those columns claim that this file does not support —
# thirteen of them Complete. It declared the finding as `m9:record-matches-plan-history` rather than
# claim the rows. M10 task 6.5 is the audit that read every one of the nineteen against the tree M10
# closes on: FIFTEEN CELLS MOVED in the capability matrix, and four rows were claimed HERE, at which
# point the criterion passed and its declaration was deleted. The evidence per cell is in
# docs/roadmap/capability-matrix.md#m10s-record-audit-nineteen-cells-over-four-closed-milestones
# and the change is openspec/changes/audit-closed-milestone-columns/, because moving a capability
# between milestones is an OpenSpec change against `delivery-roadmap` by that specification's rule.
#
# **M10's CLOSING GATE REFUSED THE FOUR CLAIMS AND THIS FILE HOLDS seed/M0 FOR ALL FOUR.** NOTHING
# IN THE REPOSITORY EVALUATES ANY OF THEM. Over all fifteen ledgers the only `expect_tiers` entry
# naming one of the four is `m0:roadmap-tiers`, which expects `seed`, and `_check_tiers` treats an
# exit tier as a FLOOR — so `seed` can never contradict a Working claim, and no gate could ever
# refuse one. `build-system-and-platforms` appears in no milestone ledger but m0.toml at all. A tier
# written into this file because a document argued well for it, with nothing that re-checks it, is
# the same defect as a plan column that outlives its evidence, one level down.
#
# So `m9:record-matches-plan-history` is a DECLARED GAP again, over exactly these four cells, closing
# at M11. Raising a row here needs a criterion that evaluates it, and writing that criterion belongs
# to whichever milestone wants the tier. WHAT FOLLOWS IS THE AUDIT'S EVIDENCE, PRESERVED AS THE BRIEF
# FOR THAT CRITERION — it is what a check would have to assert, and it is NOT this file's claim:
#
#   testing-and-quality          would be working at M3; recorded seed/M0. At M3's closing commit:
#                                cy_add_test carrying the taxonomy's per-case budgets and CTest
#                                labels, the
#                                unit, integration, smoke and render suites, golden images,
#                                benchmarks/ with a committed baseline and per-benchmark tolerances,
#                                and sanitize, sanitize-nightly, quality, specs, generated, identity
#                                and profiles jobs in CI. Complete stays at M11: swift-format, the
#                                licence-header check, the spelling check and the undocumented-symbol
#                                gate do not exist, and the three acceptance scenarios are unwritten.
#   build-system-and-platforms   would be working at M4; recorded seed/M0. Four profiles that mean
#                                the same thing in every toolchain, feature options, dependency management from the
#                                manifest, code generation, the compiler matrix — and at M4 the Swift
#                                toolchain integration the requirement names, which is the rung at
#                                which this build system first had to serve a second toolchain.
#   developer-workflow-and-just  would be working at M6; recorded seed/M0. Every category of the
#                                required recipe surface does something from M6. At M5 the whole Content category
#                                was `_not-implemented` stubs, which is why the W cell moved from
#                                M5 to M6 rather than being claimed where it stood.
#   thirdparty-dependencies      would be working at M8.b; recorded seed/M0. The manifest carries
#                                every field the requirement lists, for fifteen dependencies at M8.b and seventeen
#                                today, with deps/host-tools.toml for build-time tooling that is
#                                never linked, THIRD_PARTY.md generated from both, optional
#                                dependencies feature-gated with a test that proves a disabled
#                                feature fetches, builds and links nothing, and the editor's Rust
#                                crates under the same governance from M6.
#
# NO ROW MOVED DOWN IN THIS FILE, and that is the point worth stating: the audit moved PLAN cells,
# not recorded tiers. Fifteen cells in four columns claimed more than the tree holds; the record
# already said so, and it is the plan that now agrees with it. NO ROW MOVED UP EITHER — the four
# above stand at seed/M0 where M0 left them, and `just roadmap-debts` lists all four under
# "Behind the plan" as well as naming the reinstated gap.

# --- M8.a's amendment: two rows the plan marked Complete are still Working, and one row moved -----
#
# M8.a planned TWO capabilities reaching Complete. Its closing gate checked both against the code and
# neither is supported, so the plan was corrected rather than the record relaxed — the practice M5's
# gate started, M6's continued over five rows and M7's over six. The argument for each, with the
# unmet requirement and the command that shows it, is in tools/roadmap/milestones/m8a.toml beside
# `[criterion.expect_tiers]`, in the M8.a section of docs/ROADMAP.md, and in
# docs/roadmap/capability-matrix.md#where-m8as-tiers-are-thin. In short:
#
#   serialization-and-prefabs         working  The engine reads and writes `.cyworld`, the file's
#                                              type section is the schema a transaction addresses,
#                                              an unknown type survives a round trip byte for byte,
#                                              and all twelve editor operation variants decode. What
#                                              is absent is what M6's gate named and M8.a did not
#                                              touch: "Apply and extract" has no implementation
#                                              anywhere, and src/scene/serialization/README.md still
#                                              says so in its own words. `InstantiatePrefab` and
#                                              `SetPrefabOverride` are DECODED and counted as
#                                              IGNORED. The Complete cell moves to M8.b.
#   editor-documents-and-transactions working  One transaction per created primitive, per imported
#                                              mesh and per added body; undo empties the document and
#                                              the engine's world together; the out-of-band write
#                                              audit reads zero over a full session. But "Source
#                                              control integration" is UNSTARTED — no provider trait,
#                                              no Git, no Perforce, no null provider — and a
#                                              capability with one of twelve requirements unstarted
#                                              is not Complete. The Complete cell moves to M11,
#                                              beside every other editor-* row.
#
# ONE ROW'S `milestone` FIELD MOVED, AND ONLY ONE, BECAUSE THE FIELD MEANS "THE MILESTONE THAT LAST
# ADVANCED THE TIER" — the rule M5.5's gate wrote down when it declined to inflate two rows that had
# received substantial implementation without changing tier.
#
#   physics  M4 -> M8A.  This is a CORRECTION, not an advance, and it is the same correction M5.5's
#       gate made when it moved `editor-ui-ux`'s Working out of M5. `physics` was recorded Working at
#       M4 with NO `src/physics/` IN THE TREE: the capability's "Physics components" requirement —
#       bodies and colliders expressed as ECS components, created in a world, with
#       `cy::scene::LocalTransform` written back — had no implementation for four milestones, so
#       "the requirements a real project depends on are satisfied" was not true of the row.
#       `samples/04-character` did that work longhand in its own host, which is why M4's gate flagged
#       the absence and why implement-m8a-authorable's proposal opens with it. M8.a is the milestone
#       at which Working became true, and the record now says so.
#
# THE OTHER THREE ROWS M8.a NAMES DID NOT MOVE, and that is deliberate:
#   asset-import-pipeline (M5) gained `asset.import`, an OBJ importer, a primitive importer and one
#       derivation key across four formats. Working was already supportable at M5 — a project could
#       cook glTF and FBX — so the tier did not advance and the field does not move.
#   gameplay-framework (M4) gained `cy::gameplay::PlaySession` and spawning, so pressing play
#       simulates the authored world instead of reporting `hosting: NoRuntime`. Seed —
#       "interfaces, data model and invariants exist" — was already true at M4.
#   serialization-and-prefabs (M2) and editor-documents-and-transactions (M5) are the two above.
#
# SO M8.a ADVANCES NO CAPABILITY TIER. That is worth stating rather than leaving to be inferred from
# a diff of this file, and it is not the same as saying the milestone delivered little: it built
# src/physics/, src/gameplay/play/, two importers, the engine's `.cyworld` reader and writer, and a
# play session that restores a document byte for byte. It is what happens when a milestone's job is
# to make three existing records honest rather than to reach a new tier.

# --- M7's amendment, and why six rows the plan marked Complete are still Working -------------------
#
# M7's plan (docs/ROADMAP.md, the matrix, and implement-m7-fidelity/proposal.md) had NINE
# capabilities reaching Complete here. M7's closing gate checked each against the code; three are
# supported and six are not. The tiers below are what the tree holds. The argument for each, with
# the requirement that is unmet and the command that shows it, is in
# tools/roadmap/milestones/m7.toml beside `[criterion.expect_tiers]` and in
# docs/roadmap/capability-matrix.md#where-m7s-tiers-are-thin. In short:
#
#   rendering-architecture            working  The budget arbiter is built and certified over 71
#                                              step magnitudes with a negative control. Nothing in
#                                              the engine uses it: `libcy_rendering_arbiter.a` is
#                                              linked by its own two test binaries and by
#                                              samples/07-fidelity, and the seven
#                                              `SubsystemController`s live inside that sample over a
#                                              hard-coded cost table with one of seven costs taken
#                                              from the device. "Subsystem controllers SHALL …
#                                              report their measured cost to the arbiter" has no
#                                              instance under src/.
#   core-memory-and-containers        working  "Memory diagnostics" asks that a report be
#                                              attributable by domain, type, thread, world cell and
#                                              asset. Task 3.1 built all four axes — and NOTHING
#                                              PUSHES ONE. `grep -rn MemoryAttributionScope src/
#                                              tools/ samples/` outside src/core/memory/ returns
#                                              nothing, so the scenario "attribution answers a
#                                              question" is answerable only by a test that pushes
#                                              the scope itself. The mechanism is real; it has no
#                                              producer.
#   core-assets-and-io                working  Task 2.1's `StreamingSystem` is real and closes the
#                                              "Streaming" requirement M6 planned and did not touch.
#                                              Two others are not closed: "Hot reload" names cooked
#                                              outputs and `AssetSystem::reload` returns
#                                              NotImplemented for an asset served from a package
#                                              (asset_system.cpp:1182), and the "Development file
#                                              serving" scenario has no implementation —
#                                              `RemoteFileProvider` is an interface with no
#                                              transport, as src/core/assets/README.md has said
#                                              since M1.
#   rendering-culling-and-lod         working  M7 landed the GPU dispatch and it agrees with M6's
#                                              CPU reference. "Occlusion culling" is not closed:
#                                              `GpuCullPass::upload` REFUSES `kGpuCullOcclusion`
#                                              with NotImplemented because no hierarchical depth
#                                              buffer exists on the device, and the requirement's
#                                              "the HZB SHALL additionally serve cluster-granular
#                                              occlusion for virtual geometry" has no
#                                              implementation. `Hzb` and `TwoPassCull` are a CPU
#                                              model, tested as one; no frame occlusion-culls.
#   shader-system                     working  "Visual material editor" requires a node-graph
#                                              material editor in the editor that is a front-end
#                                              onto the material compiler. The compiler is here and
#                                              `cy_material` shows every lowering stage on a command
#                                              line; the editor has no material graph panel.
#   editor-viewport-and-gizmos        working  The engine's own renderer now fills the viewport over
#                                              a dma-buf, the engine generates the gizmo geometry,
#                                              a drag lands on a published handle and undo restores
#                                              the value exactly — all of it photographed. Task 5b.2
#                                              is NOT done: `.cyworld` is still read and written by
#                                              nothing under src/ or tools/, and
#                                              samples/05b-editor-window/runtime/session.h says so
#                                              in its own header — the runtime associates the
#                                              editor's identities with its own scene objects in
#                                              first-seen order and calls that "a stand-in for a
#                                              shared world". So "what you see is what ships" is not
#                                              true: three entities created in the editor during the
#                                              artefact changed nothing in the rendered image. The
#                                              "Selection and picking" requirement is engine-side
#                                              picking, and the artefact's own counter reads
#                                              `pick 0`.
#
# Three rows did reach Complete — rendering-materials-and-shading, residency and
# virtual-texturing — and nine advanced to Working with one new Seed.

# --- M6's amendment, and why five rows the plan marked Complete are still Working ------------------
#
# M6's plan (docs/ROADMAP.md, the matrix, and implement-m6-scale/proposal.md) had five capabilities
# reaching Complete here. M6's closing gate checked each against the code and none of the five is
# supported. The tiers below are what the tree holds; the argument for each, with the requirement
# that is unmet, is in tools/roadmap/milestones/m6.toml beside `[criterion.expect_tiers]` and in
# docs/roadmap/capability-matrix.md#where-m6s-tiers-are-thin. In short:
#
#   asset-import-pipeline             working  Steps 7 and 8 (skeletons, animations) landed after M9
#                                              for the FBX importer only; glTF still has neither, and
#                                              SKINNED MESH VERTICES ARE NOT IMPORTED AT ALL — MeshData
#                                              has no joint-index or weight arrays, so an imported rig
#                                              has nothing bound to it. Step 10 (the prefab), USD,
#                                              PNG/JPEG decoding, the BC7/ASTC platform variants and
#                                              the whole of "Virtual geometry cooking" have no
#                                              implementation.
#   core-assets-and-io                working  Its "Streaming" requirement — partial residency driven
#                                              by a residency budget and renderer feedback — is
#                                              unimplemented, and src/core/assets/ has NO change in
#                                              this milestone at all.
#   core-memory-and-containers        working  "Memory diagnostics" requires attribution by domain,
#                                              type, thread, world cell and asset; three of the five
#                                              axes do not exist. No change in this milestone.
#   serialization-and-prefabs         working  "Apply and extract" has no implementation anywhere in
#                                              the tree and no recorded exemption. The authoring
#                                              schema that landed here is real and is what made the
#                                              editor able to open a world; it is not the whole
#                                              capability.
#   rendering-geometry-and-resources  working  Its "Skinning" requirement reads bone matrices from
#                                              the GPU pose world, which is `animation-and-skinning`
#                                              at M8.b. At M6 `SkinningDescriptor::validate()`
#                                              refused that value, naming the milestone that owed it.
#                                              CORRECTED AT M8.d: the refusal went when M8.b built
#                                              the world, `validate()` accepts the source, and both
#                                              suites assert the acceptance rather than the refusal.
#                                              M8.d added `src/rendering/skinning/` — the compute
#                                              pass the requirement asks for, checked against
#                                              `cpu_reference_skin` and drawn from a vertex buffer.
#                                              The row stays Working: dual quaternion skinning and
#                                              blend-shape deltas are declared and not implemented,
#                                              and nothing decides WHICH instances are skinned.
#
# Six rows did advance, all to Working, all recorded against implement-m6-scale.

