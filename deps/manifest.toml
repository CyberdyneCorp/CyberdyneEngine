# CyberdyneEngine — the dependency manifest.
#
# The single source of truth for third-party code the build **acquires and links**:
# cmake/dependencies.cmake drives FetchContent from it, tools/deps/attribution.py generates
# THIRD_PARTY.md from it, and a security audit answers "which version, gated by what" from it.
# Nothing here is duplicated anywhere else; a version that appears in a CMake file rather than in
# this table is a defect.
#
# ITS COMPANION: deps/host-tools.toml. Third-party software the build requires to be *already on the
# machine* and never fetches or links — today, the reflection generator's C++ frontend — is declared
# there, under a schema that fits what it is. It is a second file rather than more tables here for
# one concrete reason: cmake/dependencies.cmake parses this file directly, without a TOML library,
# and turns every table it reads into a FetchContent_Declare needing a git repository and a
# 40-character commit. A PyPI wheel has neither, so an entry for one would carry fabricated fields
# and would then be fetched. That file's own header carries the full reasoning. Both files are
# loaded by tools/deps/manifest.py and both appear in THIRD_PARTY.md.
#
# `thirdparty-dependencies` fixes the required fields: name, version, commit, upstream URL, licence
# identifier, licence file path, whether it is optional and which feature gates it, whether a system
# version may be used, and a one-line justification. The remaining fields are what the build needs
# to act on the entry.
#
# Format — a deliberately small subset of TOML, because cmake/dependencies.cmake parses it directly
# and a parser is only as trustworthy as it is small:
#   * only `[[dependency]]` tables,
#   * one `key = value` per line, values are quoted strings or `true`/`false`,
#   * comments occupy a whole line; there are no inline comments,
#   * `name` is the first key of every table.
# Anything else is a configure-time error naming the line, rather than a silently ignored entry.
#
# Fields
#   name           lowercase identifier. The FetchContent name, the CY_SYSTEM_<NAME> suffix, and the
#                  engine-facing target cy::dep::<name>.
#   version        upstream release, without the tag's decoration.
#   tag            the upstream tag `commit` is the tip of, so the pin can be read by a human.
#   commit         the exact commit fetched. Never a branch, never a tag: a tag can be moved.
#   repository     upstream URL.
#   licence        SPDX identifier.
#   licence_file   path to the full licence text within the upstream tree.
#   optional       false when the engine always carries it.
#   feature        the CY_* option that gates it, empty when `optional` is false.
#   system_package true when a system-provided copy is acceptable, exposed as CY_SYSTEM_<NAME>.
#   system_find_package  the find_package() name of that system copy. Required when
#                  `system_package` is true, absent otherwise.
#   system_target  the target that system copy provides, which is not always the one the fetched
#                  build provides: zstd's in-tree target is `libzstd_static` and its installed
#                  config package exports `zstd::libzstd_static`. Required when `system_package` is
#                  true, absent otherwise.
#   cmake_target   the target the fetched build provides. cy::dep::<name> wraps it — or the system
#                  target — and engine code links only that wrapper, so where the dependency came
#                  from is invisible above this file.
#   source_subdir  where the CMake project lives when it is not at the root of the tree.
#   interface      the engine-owned interface it sits behind. This is the isolation the dependency
#                  policy requires: its types appear nowhere else.
#   scope          runtime | tool-time | test | development. What links it.
#   justification  one line: why this is integrated rather than built.

[[dependency]]
name = "sdl3"
version = "3.4.16"
tag = "release-3.4.16"
commit = "fa2c02bb6e21974a89ea9824bc53c9932abe5f9c"
repository = "https://github.com/libsdl-org/SDL"
licence = "Zlib"
licence_file = "LICENSE.txt"
optional = false
feature = ""
system_package = true
system_find_package = "SDL3"
system_target = "SDL3::SDL3"
cmake_target = "SDL3::SDL3"
source_subdir = ""
interface = "cy::Platform and cy::DisplayServer, implemented in platform/desktop-sdl3/"
scope = "runtime"
justification = "Window, event, and gamepad coverage across three desktop platforms, plus the controller database, which is maintenance rather than differentiation."

[[dependency]]
name = "doctest"
version = "2.4.12"
tag = "v2.4.12"
commit = "1da23a3e8119ec5cce4f9388e91b065e20bf06f5"
repository = "https://github.com/doctest/doctest"
licence = "MIT"
licence_file = "LICENSE.txt"
optional = true
feature = "CY_BUILD_TESTS"
system_package = true
system_find_package = "doctest"
system_target = "doctest::doctest"
cmake_target = "doctest::doctest"
source_subdir = ""
interface = "the CY_TEST_CASE wrapper in tests/, so the framework is replaceable"
scope = "test"
justification = "A test framework is not differentiating, and doctest compiles roughly an order of magnitude faster than the alternative — see design.md section 5."

[[dependency]]
name = "tracy"
version = "0.12.2"
tag = "v0.12.2"
commit = "c556831ddc6fe26d2fce01c14c97205a9dad46d5"
repository = "https://github.com/wolfpld/tracy"
licence = "BSD-3-Clause"
licence_file = "LICENSE"
optional = true
feature = "CY_PROFILING"
system_package = false
cmake_target = "Tracy::TracyClient"
source_subdir = ""
interface = "a backend of the engine's own trace in src/core/diagnostics/, never a second timeline beside it"
scope = "development"
justification = "An excellent frame profiler and viewer. The engine owns the trace schema and publishes into Tracy as one export of it."

[[dependency]]
name = "zstd"
version = "1.5.7"
tag = "v1.5.7"
commit = "ac66b19e6bd6b83238bf008eecc1298105298532"
repository = "https://github.com/facebook/zstd"
licence = "BSD-3-Clause"
licence_file = "LICENSE"
optional = false
feature = ""
system_package = true
system_find_package = "zstd"
system_target = "zstd::libzstd_static"
cmake_target = "libzstd_static"
source_subdir = "build/cmake"
interface = "the engine's compression interface in src/core/, which the trace writer and the package format consume"
scope = "runtime"
justification = "Best-in-class ratio at the speeds the trace writer and the package format need. Offered under BSD-3-Clause or GPL-2.0 and taken under BSD-3-Clause."

[[dependency]]
name = "blake3"
version = "1.8.7"
tag = "1.8.7"
commit = "f3149ec5bb5449af877ba20377a11008ff499fa2"
repository = "https://github.com/BLAKE3-team/BLAKE3"
licence = "CC0-1.0"
licence_file = "LICENSE_CC0"
optional = false
feature = ""
system_package = false
cmake_target = "BLAKE3::blake3"
source_subdir = "c"
interface = "the engine's hashing interface in src/core/, beneath derivation keys and content addressing"
scope = "runtime"
justification = "Cryptographic code is never hand-rolled, and the build graph's derivation keys need a fast tree hash. Offered under CC0-1.0, Apache-2.0 or Apache-2.0 WITH LLVM-exception and taken under CC0-1.0."

[[dependency]]
name = "vulkan_headers"
version = "1.4.304"
tag = "v1.4.304"
commit = "d4a196d8c84e032d27f999adcea3075517c1c97f"
repository = "https://github.com/KhronosGroup/Vulkan-Headers"
licence = "Apache-2.0"
licence_file = "LICENSE.md"
optional = true
feature = "CY_RENDERER_VULKAN"
system_package = false
cmake_target = "Vulkan::Headers"
source_subdir = ""
interface = "cy::rhi in src/backends/rhi/, whose types are engine-owned; no Vulkan type appears above src/backends/"
scope = "runtime"
justification = "The Khronos-published headers and the only definition of the API the Vulkan backend is written against. Headers only: the loader is resolved at run time by volk, so nothing links a Vulkan library."

[[dependency]]
name = "volk"
version = "1.4.304"
tag = "1.4.304"
commit = "0b17a763ba5643e32da1b2152f8140461b3b7345"
repository = "https://github.com/zeux/volk"
licence = "MIT"
licence_file = "LICENSE.md"
optional = true
feature = "CY_RENDERER_VULKAN"
system_package = false
cmake_target = "volk"
source_subdir = ""
interface = "cy::rhi in src/backends/rhi/vulkan/, which is the only directory that names a Vulkan symbol"
scope = "runtime"
justification = "A meta-loader: entry points are fetched per device rather than through the loader's dispatch trampoline, which removes a per-call indirection and lets the engine link no Vulkan library at all. Writing one is a generated-code maintenance task with no differentiation in it."

[[dependency]]
name = "vma"
version = "3.3.0"
tag = "v3.3.0"
commit = "1d8f600fd424278486eade7ed3e877c99f0846b1"
repository = "https://github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator"
licence = "MIT"
licence_file = "LICENSE.txt"
optional = true
feature = "CY_RENDERER_VULKAN"
system_package = false
cmake_target = "GPUOpen::VulkanMemoryAllocator"
source_subdir = ""
interface = "the RHI's memory report and transient pool in src/backends/rhi/vulkan/; GPU bytes reach the engine through cy::MemoryDomain::Gpu and the shared pressure monitor, not through a second report"
scope = "runtime"
justification = "Suballocation, memory-type selection, defragmentation and VK_EXT_memory_budget tracking against a device's own heaps. An allocator is not differentiating and getting memory types wrong is a class of bug that only appears on the vendor nobody tested."

[[dependency]]
name = "slang"
version = "2026.9.2"
tag = "v2026.9.2"
commit = "5ad2bcb74902fa5cf4344e9ee3dd33fa125883cb"
repository = "https://github.com/shader-slang/slang"
licence = "Apache-2.0 WITH LLVM-exception"
licence_file = "LICENSE"
optional = true
feature = "CY_SHADER_SLANG"
system_package = false
cmake_target = "slang"
source_subdir = ""
interface = "cy::shader::ShaderCompiler in src/backends/shader/slang/, which is the only directory that names a Slang symbol; the pipeline around it consumes SPIR-V"
scope = "tool-time"
justification = "The authoring language `shader-system` adopts, and the compiler that lowers it to SPIR-V. Writing a shading language is a multi-year commitment that competes directly with building the renderer; Slang supplies generics, interfaces, modules and multi-target output and is designed for exactly this use."

[[dependency]]
name = "jolt"
version = "5.6.0"
tag = "v5.6.0"
commit = "e77f175595e64cb44218cc9d9d56fc365ad0e36a"
repository = "https://github.com/jrouwe/JoltPhysics"
licence = "MIT"
licence_file = "LICENSE"
optional = true
feature = "CY_PHYSICS"
system_package = false
cmake_target = "Jolt"
source_subdir = "Build"
interface = "cy::physics::PhysicsServer in src/servers/physics/, implemented by src/backends/physics-jolt/, which is the only directory that names a JPH symbol"
scope = "runtime"
justification = "A mature, multithreaded, deterministic rigid-body solver under a permissive licence. Writing a competitive solver is a multi-year effort with no differentiating value for this engine, and `physics` says so outright."

[[dependency]]
name = "miniaudio"
version = "0.11.24"
tag = "0.11.24"
commit = "347321b27c58d42567e905c715de60ad43a6cb8e"
repository = "https://github.com/mackron/miniaudio"
licence = "MIT-0"
licence_file = "LICENSE"
optional = true
feature = "CY_AUDIO"
system_package = false
cmake_target = "miniaudio"
source_subdir = ""
interface = "cy::audio::AudioBackend in src/servers/audio/, implemented by src/backends/audio-miniaudio/, which is the only directory that names an ma_ symbol"
scope = "runtime"
justification = "Device I/O, sample-rate and channel conversion, decoding and streaming across every platform this engine targets, in one permissively licensed file. `audio` names it as the default backend and bounds what it is used for: the engine's own bus graph, voice management and spatialisation policy sit above it, and miniaudio's node graph, high-level engine API and 3D spatialisation are deliberately not used. Offered as public domain or MIT-0 and taken under MIT-0."
