version = "3.4.16"
tag = "release-3.4.16"
commit = "fa2c02bb6e21974a89ea9824bc53c9932abe5f9c"
repository = "https://github.com/libsdl-org/SDL"
licence = "Zlib"
licence_file = "LICENSE.txt"
optional = false
feature = ""
system_package = true
system_find_package = "SDL3"
