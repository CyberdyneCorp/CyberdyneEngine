# CyberdyneEngine — the dependency manifest.
#
# The single source of truth for third-party code the build **acquires and links**:
# cmake/dependencies.cmake drives FetchContent from it, tools/deps/attribution.py generates
# THIRD_PARTY.md from it, and a security audit answers "which version, gated by what" from it.
# Nothing here is duplicated anywhere else; a version that appears in a CMake file rather than in
# this table is a defect.
#
# ITS COMPANION: deps/host-tools.toml. Third-party software the build requires to be *already on the
# machine* and never fetches or links — today, the reflection generator's C++ frontend — is declared
# there, under a schema that fits what it is. It is a second file rather than more tables here for
# one concrete reason: cmake/dependencies.cmake parses this file directly, without a TOML library,
# and turns every table it reads into a FetchContent_Declare needing a git repository and a
# 40-character commit. A PyPI wheel has neither, so an entry for one would carry fabricated fields
# and would then be fetched. That file's own header carries the full reasoning. Both files are
# loaded by tools/deps/manifest.py and both appear in THIRD_PARTY.md.
#
# `thirdparty-dependencies` fixes the required fields: name, version, commit, upstream URL, licence
# identifier, licence file path, whether it is optional and which feature gates it, whether a system
# version may be used, and a one-line justification. The remaining fields are what the build needs
# to act on the entry.
#
# Format — a deliberately small subset of TOML, because cmake/dependencies.cmake parses it directly
# and a parser is only as trustworthy as it is small:
#   * only `[[dependency]]` tables,
#   * one `key = value` per line, values are quoted strings or `true`/`false`,
#   * comments occupy a whole line; there are no inline comments,
#   * `name` is the first key of every table.
# Anything else is a configure-time error naming the line, rather than a silently ignored entry.
#
# Fields
#   name           lowercase identifier. The FetchContent name, the CY_SYSTEM_<NAME> suffix, and the
#                  engine-facing target cy::dep::<name>.
#   version        upstream release, without the tag's decoration.
#   tag            the upstream tag `commit` is the tip of, so the pin can be read by a human.
#   commit         the exact commit fetched. Never a branch, never a tag: a tag can be moved.
#   repository     upstream URL.
#   licence        SPDX identifier.
#   licence_file   path to the full licence text within the upstream tree.
#   optional       false when the engine always carries it.
#   feature        the CY_* option that gates it, empty when `optional` is false.
#   system_package true when a system-provided copy is acceptable, exposed as CY_SYSTEM_<NAME>.
#   system_find_package  the find_package() name of that system copy. Required when
#                  `system_package` is true, absent otherwise.
#   system_target  the target that system copy provides, which is not always the one the fetched
#                  build provides: zstd's in-tree target is `libzstd_static` and its installed
#                  config package exports `zstd::libzstd_static`. Required when `system_package` is
#                  true, absent otherwise.
#   cmake_target   the target the fetched build provides. cy::dep::<name> wraps it — or the system
#                  target — and engine code links only that wrapper, so where the dependency came
#                  from is invisible above this file.
#   source_subdir  where the CMake project lives when it is not at the root of the tree.
#   interface      the engine-owned interface it sits behind. This is the isolation the dependency
#                  policy requires: its types appear nowhere else.
#   scope          runtime | tool-time | test | development. What links it.
#   justification  one line: why this is integrated rather than built.

# --- THE SET M5 NAMED AND DID NOT INTEGRATE ------------------------------------------------------
#
# `asset-import-pipeline` and `text-and-fonts` both reach a tier at M5 over libraries this file does
# not yet carry, and the omission is a decision rather than an oversight. It is recorded here, in the
# file that would carry them, because the next person to ask "why is there a JSON parser in
# tools/import/" should find the answer in one place.
#
#   meshoptimizer   mesh simplification, vertex cache and fetch optimisation, meshlet generation.
#                   The right dependency and the one `thirdparty-dependencies` names. M5 delivers
#                   engine-owned implementations of the three steps the importer needs, behind free
#                   functions over `cy::import::MeshData` — so integrating it is a change to one
#                   `.cpp` and to nothing that calls it. See tools/import/include/cy/import/mesh.h,
#                   which states what the engine-owned simplifier costs against a tuned one.
#   cgltf           a glTF parser, including its own JSON reader. tools/import/src/json.cpp is a
#                   strict JSON reader written to be deleted when this lands; its header says so.
#   texture codecs  BC7 and ASTC encoders. `cy::import::select_format` already names the format a
#                   cook WOULD produce and records `CookedTexture::encoded = false` beside the
#                   uncompressed payload, so a build that links an encoder produces a different
#                   derivation key and re-cooks rather than serving uncompressed pixels from the
#                   cache.
#   harfbuzz        shaping. `cy::text::TextServer`'s minimal backend reports
#   icu             the Unicode algorithms.        `complex_shaping`, `bidirectional` and
#   freetype        rasterisation and hinting.     `dictionary_line_breaking` as FALSE rather than
#                   approximating any of them, which is the specification's own carve-out for a
#                   minimal backend. They belong in src/backends/text-*/ at layer 3 when they land.
#
# WHY NOT NOW, IN ONE SENTENCE EACH. Integrating a dependency here is not adding a table: it is a
# `cy__configure_<name>` block in cmake/dependencies.cmake deciding what upstream builds, an
# attribution row, a licence review and a fetch on every configure — and ICU in particular is an
# autotools project whose CMake support is somebody else's build system wearing a hat. M5's task
# statement asks for interfaces before libraries, "as PhysicsServer was defined before Jolt was
# linked", and that is what was delivered: four seams with working implementations behind them and a
# test suite each, rather than four fetches and no time left to use them.
#
# WHAT THAT COSTS, STATED. The simplifier is less tuned than meshoptimizer's at aggressive ratios;
# the texture importer reads Targa and not PNG; the text server lays out Latin and refuses Arabic.
# Every one of those is reported by the code that cannot do it — a capability query, a diagnostic
# naming the missing decoder, a `false` in a struct — rather than approximated, which is the
# property that makes the gap safe to carry.

