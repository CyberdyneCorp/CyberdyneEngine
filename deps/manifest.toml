# --- M6: the two source-format libraries `asset-import-pipeline` names -----------------------------
#
# Both are single-translation-unit libraries that ship no CMake project of their own — ufbx is
# `ufbx.c` and `ufbx.h` in the root of its tree, xatlas is `source/xatlas/xatlas.cpp` and its header.
# `cmake_target` below therefore names a target this build DECLARES rather than one upstream
# provides, through the `cy__provide_<name>()` hook cmake/dependencies.cmake grew for exactly this
# shape. Both are still pinned to a commit, still fetched by the same code path, and still reached
# only through `cy::dep::<name>`; the only difference is who wrote the four lines that compile them.

[[dependency]]
name = "ufbx"
version = "0.20.0"
tag = "v0.20.0"
commit = "a63ff0a47485328880b3300e7bcdf01413343a45"
repository = "https://github.com/ufbx/ufbx"
licence = "MIT"
licence_file = "LICENSE"
optional = false
feature = ""
system_package = false
cmake_target = "ufbx"
source_subdir = ""
interface = "cy::import::FbxImporter in tools/import/, the only translation unit that names a ufbx_ symbol"
scope = "tool-time"
justification = "FBX is a closed format whose several binary and ASCII generations are only tractable through a maintained parser, and `thirdparty-dependencies` names this one. It is a single C file with no dependencies, so the cost of carrying it is the cost of compiling it once. Offered as MIT or Unlicense and taken under MIT."

[[dependency]]
name = "xatlas"
version = "2022.07.26"
tag = "master@f700c77"
commit = "f700c7790aaa030e794b52ba7791a05c085faf0c"
repository = "https://github.com/jpcy/xatlas"
licence = "MIT"
licence_file = "LICENSE"
optional = false
feature = ""
system_package = false
cmake_target = "xatlas"
source_subdir = ""
interface = "cy::import::generate_uv2 in tools/import/, the only translation unit that names an xatlas symbol"
scope = "tool-time"
justification = "Chart segmentation, parameterisation and packing for lightmap UVs, which `asset-import-pipeline` requires with a texel density, chart padding and a distortion limit. It is the library `thirdparty-dependencies` names, and the alternative is a research project. Upstream cuts no releases, so `tag` records the branch and the abbreviated commit the 40-character pin below belongs to."

# --- M8.b: navmesh generation -------------------------------------------------------------------
#
# `ai-system` draws the line this entry sits on: "Proven algorithms MAY be integrated where they are
# NOT DIFFERENTIATING — navmesh generation and pathfinding continue to use the navigation stack's
# dependencies. The scheduler, LOD policy, graph compiler, perception batching, knowledge model, and
# smart objects SHALL be engine-owned."
#
# So Recast — the voxelising generator — is integrated, and DETOUR, its runtime half, is not. That
# is a deliberate omission and the reason is in src/navigation/include/cy/navigation/navmesh.h:
# `navigation` requires navigation tiling independent of world cells, async queries completing on a
# DETERMINISTIC tick, and flow fields and hierarchical refinement Detour does not have. A runtime
# that owned its own allocation, its own tile identity and its own query scheduling would have to be
# worked around at each of those three points.
#
# `source_subdir` is `Recast`, upstream's generator subproject, so its CMake is read and Detour's,
# DetourCrowd's, DetourTileCache's and the demo's are not. That is the isolation this entry claims,
# expressed as a build fact rather than as a promise not to call something.

[[dependency]]
name = "recast"
version = "1.6.0"
tag = "v1.6.0"
commit = "6dc1667f580357e8a2154c28b7867bea7e8ad3a7"
repository = "https://github.com/recastnavigation/recastnavigation"
licence = "Zlib"
licence_file = "License.txt"
optional = true
feature = "CY_NAVIGATION"
system_package = false
cmake_target = "Recast"
source_subdir = "Recast"
interface = "cy::navigation::build_tile in src/navigation/, implemented by src/navigation/src/build_recast.cpp, which is the only translation unit that names an rc symbol"
scope = "runtime"
justification = "Voxelising source geometry and extracting walkable convex regions — the one navigation step `ai-system` names as not differentiating, and `navigation` specifies procedurally in Recast's own parameters: cell size and height, agent radius, height, climb and slope, region minimum and merge sizes, edge length and error, detail sample distance and error. It is the reference implementation of that algorithm and the alternative is a marching-squares research project. Detour is excluded by source_subdir; the runtime mesh, the queries, the hierarchy, flow fields, avoidance and crowds are engine code."

# --- M8.b: SPATIAL ACOUSTICS ---------------------------------------------------------------------
#
# `audio` names Steam Audio by name — "The engine SHALL support **Steam Audio** as an
# `AcousticsBackend`" — and constrains it in the same breath: "optional and capability-gated behind
# the `CY_AUDIO_STEAM_AUDIO` build option and a runtime capability query. When absent or disabled,
# the engine SHALL fall back to its own panning, distance attenuation, filter-based occlusion, and
# reverb sends", and "Content SHALL NOT depend on Steam Audio being present: it SHALL improve audio
# quality, never enable or gate gameplay."
#
# So the option DEFAULTS OFF and a default build fetches nothing: `cy::audio::FallbackAcoustics` is
# what every build has, and `cy::audio::steam_audio_compiled_in()` answers the build question while
# `AcousticsBackend::capabilities()` answers the runtime one.
#
# WHAT IS AND IS NOT VERIFIED AT M8.b, because a manifest entry is a claim and this one is only half
# checked: the entry parses, `-D CY_AUDIO_STEAM_AUDIO=OFF` (the default) configures and builds and
# fetches nothing, and src/audio/src/acoustics.cpp compiles in both cases with the Steam Audio path
# behind `#if defined(CY_AUDIO_STEAM_AUDIO)`. THE FETCH AND THE BUILD OF UPSTREAM HAVE NOT BEEN RUN
# on this machine, and the backend behind the option returns `NotImplemented` rather than pretending
# to simulate. src/audio/README.md records that gap as the milestone's, not as a defect.

[[dependency]]
name = "steam_audio"
version = "4.8.1"
tag = "v4.8.1"
commit = "0da18255cca520771f363ee01f100572b39a308e"
repository = "https://github.com/ValveSoftware/steam-audio"
licence = "Apache-2.0"
licence_file = "LICENSE.md"
optional = true
feature = "CY_AUDIO_STEAM_AUDIO"
system_package = false
cmake_target = "phonon"
source_subdir = "core"
interface = "cy::audio::AcousticsBackend in src/audio/include/cy/audio/acoustics.h, implemented by src/audio/src/acoustics.cpp, which is the only translation unit that may include phonon.h"
scope = "runtime"
justification = "HRTF binaural rendering, ambisonic encoding and decoding, geometry-aware occlusion with material-dependent transmission, real-time reflections and sound propagation — the acoustic simulation `audio` names it for, and the one part of the audio stack that is a research field rather than an engineering task. The engine's own panning, attenuation, filter-based occlusion and reverb sends remain the fallback, so a build without it is a complete game."
