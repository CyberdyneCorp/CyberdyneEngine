# CyberEditor — the Rust workspace. Task 2.1, `editor-rust-application`.
#
# --- WHY A WORKSPACE AND NOT A CRATE --------------------------------------------------------------
#
# `editor-rust-application`: "The editor SHALL be a multi-crate workspace rather than one crate, with
# dependencies flowing toward shared foundations ... Dependency direction SHALL be enforced by the
# workspace, and a cycle or an upward dependency SHALL be a build error rather than a review
# comment."
#
# Cargo gives half of that for free: a dependency cycle between crates is a hard error, not a lint.
# The other half — an *upward* dependency, which Cargo is perfectly happy with — is enforced by
# `crates/cy-editor-app/tests/layering.rs`, which reads the `[package.metadata.cy] layer` of every
# member and fails when any crate depends on one at its own level or above. That is the same shape
# as the engine's `tools/layercheck/layercheck.py`, and it is a test rather than a review comment
# for the same reason.
#
# --- THE PROFILE TABLE, FINALLY EXERCISED ---------------------------------------------------------
#
# M0's spike wrote the Cargo column of the profile table in `justfile` and reserved it unused for
# five milestones. This is where it is spent. The four names mean the same thing here that they mean
# in CMake:
#
#   just profile | CMake configuration | assertions | Cargo profile
#   -------------|---------------------|------------|--------------
#   debug        | Debug               | on         | dev
#   dev          | Development         | on         | development
#   profile      | Profile             | off        | profiling
#   release      | Shipping            | off        | shipping
#
# "Assertions" is `CY_ASSERT` in C++ and `debug_assertions` in Rust, and the mapping is exact: the
# two configurations that compile `CY_ASSERT` out are the two that set `debug-assertions = false`.
# That is checked rather than documented — `crates/cy-editor-app/tests/profiles.rs` reads the table
# out of `justfile` and asserts that each row's Cargo profile exists here with the assertion setting
# the row claims, so the two tables cannot drift.
#
# --- THE MINIMUM SUPPORTED RUST VERSION, AND WHY IT MOVED -----------------------------------------
#
# 1.92 through M5, 1.95 from M5.5. It moved because the interface toolkit chosen in M5.5 —
# egui 0.36 over wgpu 30 — refuses to build on 1.92, and a declared MSRV the workspace cannot
# actually build under is a lie a contributor discovers as a compiler error in a dependency.
#
# It is declared in three places on purpose, and they say the same thing:
#   * here, so Cargo refuses an older toolchain with a sentence naming this file;
#   * in `rust-toolchain.toml` at the repository root, so that `cargo` in a checkout SELECTS 1.95
#     rather than failing with whatever the machine's default happens to be — this machine's is
#     1.92, which is exactly the case that would otherwise be discovered late;
#   * on every continuous-integration leg that runs Cargo, because a version pinned locally and
#     unpinned in CI is a version that is not pinned.
#
# --- THE THIRD-PARTY DEPENDENCIES, AND THE RULE THEY ARRIVED UNDER ---------------------------------
#
# This workspace depended on nothing but the Rust standard library through M5, and
# `[workspace.dependencies]` was empty rather than absent so that adding the first one would be a
# visible edit in a reviewed file. This is that edit. The reasoning below is kept, because it is
# still the rule — what changed is that the milestone with a window in it reached the two things the
# standard library genuinely cannot do: draw a window, and import another process's `VkImage`.
#
# Every entry is pinned, and every entry names the crate that may use it. `thirdparty-dependencies`
# requires each to be justified; the justification lives in the manifest of the crate that names it,
# beside the code, rather than in a table nobody reads. The containment test
# (`crates/cy-editor-app/tests/containment.rs`) is what keeps "the toolkit is an implementation
# detail" true after the dependencies exist: exactly one crate may name the toolkit, and only it and
# the viewport transport may name a graphics API.
#
# The three reasons the empty table was worth keeping for five milestones, unchanged:
#
#   * The interface toolkit is an implementation detail (`editor-rust-application`), and the crates
#     delivered here — core, sdk, protocol, documents, commands, services, view models — are the
#     ones that must be *testable headlessly with no window, no graphics device and no interface
#     toolkit*. None of them needs a crate to do that, and picking one now would put a toolkit's
#     types in the layer that is specified never to see them.
#   * `thirdparty-dependencies` requires every dependency to be justified, and a dependency added
#     "because it is what one uses" cannot be. When the viewport and the panels arrive, the
#     toolkit's dependency tree will be a real decision with real measurement behind it.
#   * `cargo build --offline` works in a fresh checkout, so a continuous-integration leg needs no
#     registry access to build or test the editor, and a lockfile churn cannot break a milestone.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/leonardoaraujosantos/CyberdyneEngine"
publish = false

# Versions are exact rather than caret-ranged: the spike measured THESE, and "0.36.1" reading as
# "any 0.36.x" would let a patch release change a measured number without an edit.
[workspace.dependencies]
# The window, the event loop, the immediate-mode interface and the docking on top of it. Named by
# `cy-editor-shell` and by nothing else, which `crates/cy-editor-app/tests/containment.rs` enforces
# by deriving the render crate rather than trusting this comment.
#
# `eframe` carries `default-features = false` plus exactly what the editor uses: the wgpu renderer
# (there is no glow path, because the viewport imports a `VkImage`), X11 and Wayland, and
# AccessKit — which `editor-ui-ux` requires and which was one of the two properties that decided the
# toolkit. `persistence` is deliberately absent; see `crates/cy-editor-shell/Cargo.toml`.
eframe = { version = "=0.36.1", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wayland",
    "wgpu",
    "x11",
] }
egui = "=0.36.1"
egui-wgpu = "=0.36.1"
egui_dock = "=0.21.1"
# PNG decoding for the identity assets, and nothing else: no encoders, no other formats.
image = { version = "=0.25.9", default-features = false, features = ["png"] }
# The Vulkan API, for the parts wgpu does not expose: timeline semaphore import and export, the
# bounded host wait, and the DRM-format-modifier queries. `cy-editor-viewport-transport` only.
ash = "=0.38.0"
# `memfd_create`, `mmap`, and `SCM_RIGHTS` descriptor passing. Both platform crates.
libc = "=0.2.189"
# Three lines of executor for `wgpu::Instance::enumerate_adapters`, which is async. This workspace
# has no async runtime and wants none.
pollster = "=0.4.0"
# The editor's graphics device. `wgpu-hal` is not an accident of the dependency tree: the supported
# escape hatch that adds `VK_KHR_external_semaphore_fd` before `vkCreateDevice` is
# `wgpu_hal::vulkan::Adapter::open_with_callback`, and there is no wgpu-level equivalent.
wgpu = "=30.0.1"
wgpu-hal = { version = "=30.0.1", features = ["vulkan"] }
wgpu-types = "=30.0.1"

# --- The profiles ---------------------------------------------------------------------------------
#
# `dev` and `release` are Cargo's own names and cannot be renamed, so `dev` IS the `debug` row and
# every other row is a custom profile that inherits from one of them. A recipe never says `--profile
# release`: `just build-editor --profile release` maps the workflow's `release` to Cargo's
# `shipping`, which is why the mapping is a table and not a coincidence of names.

# `just --profile debug` — unoptimised, assertions on, overflow checks on.
[profile.dev]
opt-level = 0
debug = true
debug-assertions = true
overflow-checks = true
incremental = true

# `just --profile dev` — the working profile. Light optimisation so tests run at a usable speed,
# assertions still on. This is the one a developer builds all day.
[profile.development]
inherits = "dev"
opt-level = 1
debug = true
debug-assertions = true
overflow-checks = true
incremental = true

# `just --profile profile` — optimised with symbols, assertions OFF. Measurements come from here,
# and so does the answer to "does it still work with the assertions compiled out", which is the
# question hard-won experience says to ask of every profile a gate does not run.
[profile.profiling]
inherits = "release"
opt-level = 2
debug = true
debug-assertions = false
overflow-checks = false

# `just --profile release` — what ships. Note that what ships is the EDITOR: a packaged game
# contains none of this workspace, which follows from it being a separate binary rather than from a
# compilation flag.
[profile.shipping]
inherits = "release"
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = "thin"
codegen-units = 1
# NOT `panic = "abort"`, for two reasons that both point the same way.
#
# The editor deliberately CATCHES panics at two boundaries: `OperationService::start` wraps
# background work so that a defect in an importer settles that operation as failed instead of taking
# the editor down, and an editor plugin compiled from source is exactly the kind of code that has
# such a defect. Aborting would remove a designed resilience in the one configuration where it
# matters most — which is the same argument the engine makes for `borrow_valid` being a comparison
# rather than an assertion: a protection that only holds in some configurations is not a protection.
#
# And `cargo test` needs unwinding, so `panic = "abort"` would make this profile the one nothing is
# tested in. That is the shape of defect this project has already paid for twice.

# --- Lints, workspace-wide ------------------------------------------------------------------------
#
# `editor-rust-application` lists ten "forbidden editor application patterns" and requires that each
# "SHALL be checkable". Four of them are checkable by the compiler, and are set here so that they are
# checked in every crate rather than in the crates somebody remembered:
#
#   * `unsafe_code = "forbid"` is set PER CRATE rather than here, because exactly one crate is
#     allowed it — `cy-editor-sdk`, the audited interoperation overlay — and `forbid` cannot be
#     lifted by an inner `allow`, which is the property that makes it worth using. `cy-editor-app`'s
#     `tests/safety.rs` asserts that every other crate carries it.
#   * missing documentation on a public item is denied: the SDK and the command registry are read by
#     callers who cannot see the interface, per `editor-agent-interface`.
#   * `clippy::pedantic` is on, with the handful of lints that fight the house style turned back off
#     below and each one saying why.
[workspace.lints.rust]
missing_docs = "deny"
unreachable_pub = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# The editor's error enums are documented per variant and read better as prose than as a table of
# `# Errors` sections repeated on every wrapper; the crate-level documentation says what fails.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# `#[must_use]` on every accessor is noise in a crate whose accessors are all pure by construction.
must_use_candidate = "allow"
# Long literal blocks of prose in documentation are the house style; see any file in src/.
doc_markdown = "allow"
# A module named after the type it contains is the convention this workspace and the engine share.
module_name_repetitions = "allow"
# A vector's lanes are x, y, z and w. Renaming them to satisfy a lint about single-character
# bindings would make every vector site harder to read than the lint is worth, and this workspace
# destructures vectors constantly.
many_single_char_names = "allow"
