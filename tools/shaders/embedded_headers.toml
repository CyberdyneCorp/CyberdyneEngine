name = "sample_world_visual"
headers = ["samples/10-world/shaders/world_visual_spirv.h",
           "samples/10-world/shaders/world_visual_msl.h"]
source = "samples/10-world/shaders/world_visual.slang"
include = ["src/rendering/shaders"]
compile = [
    ["spirv", "compute", "shadeTerrain", "shadeTerrain.spv"],
    ["spirv", "compute", "shadeClouds", "shadeClouds.spv"],
    ["spirv", "compute", "evolveFoam", "evolveFoam.spv"],
    ["metal", "compute", "shadeTerrain", "shadeTerrain.metal"],
    ["metal", "compute", "shadeClouds", "shadeClouds.metal"],
    ["metal", "compute", "evolveFoam", "evolveFoam.metal"],
]
run = [
    ["{python}", "samples/10-world/shaders/embed_spirv.py",
     "samples/10-world/shaders/world_visual_spirv.h",
     "kWorldShadeTerrainSpirv={scratch}/shadeTerrain.spv",
     "kWorldShadeCloudsSpirv={scratch}/shadeClouds.spv",
     "kWorldEvolveFoamSpirv={scratch}/evolveFoam.spv"],
    ["{python}", "samples/10-world/shaders/embed_msl.py",
     "samples/10-world/shaders/world_visual_msl.h",
     "kWorldShadeTerrainMsl={scratch}/shadeTerrain.metal",
     "kWorldShadeCloudsMsl={scratch}/shadeClouds.metal",
     "kWorldEvolveFoamMsl={scratch}/evolveFoam.metal"],
]

# The iOS kernel's Slang is the VFX compiler's output for the mobile effect, and the app refuses the
# MSL at startup when that source's hash (shaders/mobile_vfx_kernel.h) differs. What this checks is
# the other half: that the header embeds the committed .metal.
[[group]]
name = "sample_ship_ios_vfx"
headers = ["samples/11-ship/ios/shaders/mobile_vfx_msl.h"]
run = [
    ["{python}", "src/vfx/gpu/shaders/embed_msl.py", "--title",
     "the iOS spark-plume simulation kernel", "samples/11-ship/ios/shaders/mobile_vfx_msl.h",
     "kMobileVfxMsl=samples/11-ship/ios/shaders/mobile_vfx.metal"],
]

# --- Headers that are deliberately not regenerated -------------------------------------------------

[[excluded]]
header = "samples/03-first-light/shaders/first_light_dxil.h"
reason = "DXIL needs DXC (CY_SHADER_DXIL); .github/workflows/m11d5-dxil.yml regenerates it on Windows"

[[excluded]]
header = "tests/render/world_before_aerial_perspective_spirv.h"
reason = "pinned to world_spirv.h at 1fe6446; its value is that it does not follow world.slang"

[[excluded]]
header = "tests/render/world_before_cloud_shadows_spirv.h"
reason = "pinned to world_spirv.h at 2614fb0; its value is that it does not follow world.slang"

[[excluded]]
header = "tests/render/water_before_aerial_perspective_spirv.h"
reason = "pinned to water_spirv.h at 8996cc35; its value is that it does not follow water.slang"
