# SPDX-License-Identifier: MIT
# Every committed embedded-shader header and how to reproduce it. Read by
# tools/shaders/embedded_headers.py; `just quality-shader-headers` fails when a header here is not
# what its sources produce, or when a header matching `patterns` is neither in a group nor excluded.
#
# A group is one set of headers produced together. Its `compile` steps run slangc from `cwd`
# (repository-relative, default the root) with the named entry, stage and target — `spirv` is
# SPIR-V 1.5, `metal` is MSL — writing `out` into a scratch directory the `run` commands see as
# `{scratch}`. The `run` commands then run from the root; `{python}`, `{slangc}` and
# `{clang_format}` name the tools. Every header is formatted with clang-format afterwards, which is
# what the format gate would do to it anyway.
#
# The paths slangc is given are part of the output: Slang writes them into the MSL's #line
# directives, so a group that compiled from its shader directory has to keep doing so.

patterns = ["src/**/*_spirv.h", "src/**/*_msl.h", "src/**/*_dxil.h", "src/**/*_embedded.h",
            "samples/**/*_spirv.h", "samples/**/*_msl.h", "samples/**/*_dxil.h",
            "tests/**/*_spirv.h", "tests/**/*_msl.h", "tests/**/*_dxil.h",
            "src/backends/shader/tests/fixtures/spirv_probe.h"]

