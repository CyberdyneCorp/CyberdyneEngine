# --- Headers assembled from slangc invocations and an embed script ---------------------------------

[[group]]
name = "particles"
headers = ["src/rendering/particles/shaders/particle_spirv.h",
           "src/rendering/particles/shaders/particle_msl.h"]
source = "src/rendering/shaders/cy/particle.slang"
include = ["src/rendering/shaders"]
metal_args = ["-D", "CY_FRAME_METAL=1", "-D", "CY_MATERIAL_METAL_ARGUMENT_BUFFER=1"]
compile = [
    ["spirv", "vertex", "cyParticleVertex", "issue15-particle-vertex.spv"],
    ["spirv", "fragment", "cyParticleFragment", "issue15-particle-fragment.spv"],
    ["metal", "vertex", "cyParticleVertex", "issue15-particle-vertex.metal"],
    ["metal", "fragment", "cyParticleFragment", "issue15-particle-fragment.metal"],
]
run = [
    ["{python}", "src/rendering/particles/shaders/embed_spirv.py",
     "src/rendering/particles/shaders/particle_spirv.h",
     "kParticleVertexSpirv={scratch}/issue15-particle-vertex.spv",
     "kParticleFragmentSpirv={scratch}/issue15-particle-fragment.spv"],
    ["{python}", "src/rendering/particles/shaders/embed_msl.py",
     "src/rendering/particles/shaders/particle_msl.h",
     "kParticleVertexMsl={scratch}/issue15-particle-vertex.metal",
     "kParticleFragmentMsl={scratch}/issue15-particle-fragment.metal"],
]

