# The permanent merge-gate set — task 4.4.1.
#
# `testing-and-quality` fixes what must pass before a change merges: every platform build, the unit
# and integration tests, static analysis and formatting, generated code current, the specification
# set valid. `delivery-roadmap` adds the status record and, on close, each milestone's own criteria.
# This file is that list, as data, because continuous integration, `just roadmap-gates` and the
# contributor documentation must name the same gates and three hand-maintained copies diverge.
#
# Each gate names the commands it runs. They are `just` recipes: a workflow file that reimplements a
# recipe is a defect (`developer-workflow-and-just`), and a gate is not exempt from that.
#
#   class = "permanent"  runs on every pull request, forever
#   class = "milestone"  a closed milestone's criteria. state = "joins-on-close" until the milestone
#                        closes; the change that closes it sets state = "green" and it is permanent
#                        from then on — a later milestone may not break an earlier milestone's gate.
#
# An override is recorded below, never taken silently. Every field is required and an expired
# override fails this check, so `just roadmap-gates` reports the truth about what is being skipped.

schema = 1

[[gate]]
id = "build-and-test"
describe = "Configure, build, and run every test suite on each supported desktop platform."
runs = ["just env-doctor", "just build-engine", "just test-all"]
platforms = ["linux", "windows", "macos"]
since = "m0"
class = "permanent"

[[gate]]
id = "format"
describe = "clang-format over the engine tree, against the committed .clang-format."
runs = ["just quality-format-check"]
platforms = ["linux"]
since = "m0"
class = "permanent"

[[gate]]
id = "lint"
describe = "clang-tidy over the engine tree, with findings treated as errors."
runs = ["just quality-lint"]
platforms = ["linux"]
since = "m0"
class = "permanent"

[[gate]]
id = "layering"
describe = "Layer order: declared links, source-level includes, the platform/ SDL rule, no bare target. Runs the negative fixtures, so enforcement that stopped firing is caught."
runs = ["just quality-layers"]
platforms = ["linux"]
since = "m0"
class = "permanent"

[[gate]]
id = "generated-code"
describe = "Generated output is current and reproducible: cy_features.h, cy_modules.h, THIRD_PARTY.md. generate-test covers the module graph, cycles and feature exclusion."
runs = ["just generate-check", "just generate-test", "just maintenance-deps-check"]
platforms = ["linux"]
since = "m0"
class = "permanent"

[[gate]]
id = "specs"
describe = "openspec validate --specs --strict: a specification that does not validate is not one."
runs = ["just quality-specs"]
platforms = ["linux"]
since = "m0"
class = "permanent"

[[gate]]
id = "roadmap-status"
describe = "The status record and openspec/specs/ agree, and every tier claim names the change that made it. roadmap-test proves the drift detection still fires."
runs = ["just roadmap-status", "just roadmap-test"]
platforms = ["linux"]
since = "m0"
class = "permanent"

# --- The gates M1 — Substrate added -----------------------------------------------------------------
#
# Task 6.1 to 6.8, and the proposal's "New permanent gates": the identity manifest check, the
# reflection round-trip goldens, generated-code reproducibility, the job system throughput benchmark
# and TSan over the job suite. Generated-code reproducibility is not a new gate — `generate-check`
# above already is one, and M1 only widened what it regenerates — so it is not restated here; the
# other four are declared below, together with the two checks M1 built and left undeclared.
#
# Each names commands that already run in .github/workflows/ci.yml. That is not a coincidence:
# `just ci-check` fails when a permanent gate declared here is run by no job there, and it is the
# check that stops this file from becoming a list of intentions.

[[gate]]
id = "identity"
describe = "Type and field identity: nothing unassigned, nothing removed silently, no identifier moved or recycled. Runs the generator's own negative fixture too, which renames a field in a real tree and requires the gate to reject it — so an identity check that has stopped firing is caught here rather than in a save file months later."
runs = ["just quality-identity", "just test-integration -R reflect_generator"]
platforms = ["linux"]
since = "m1"
class = "permanent"

[[gate]]
id = "reflection"
describe = "The reflection round-trip goldens: the committed byte-for-byte encoding, the same values in a different field order, and a payload carrying a field this build has never seen. A format change that was not meant to happen fails here."
runs = ["just test-unit -R reflect_"]
platforms = ["linux"]
since = "m1"
class = "permanent"

[[gate]]
id = "project-graph"
describe = "The project graph's rejections — a cycle, an undeclared dependency, an upward layer dependency, a shipping target that reaches editor code. They are configure-time failures over fixture projects, so they cannot be a C++ test: a program that links only exists because the graph was accepted."
runs = ["just test-integration -R project_graph"]
platforms = ["linux"]
since = "m1"
class = "permanent"

[[gate]]
id = "sanitizers"
describe = "The job suite under ThreadSanitizer, and again under AddressSanitizer with UndefinedBehaviorSanitizer. `core-jobs-and-concurrency` requires a data-race detector, and a job system whose races are only detectable locally is a job system whose races reach a user. Leak detection is on: M1 declared the trace's pooled allocations at their allocation site, so a leak reported here is a defect rather than M0's standing false positive. M2 widened it: `ecs_scheduling` is the first suite in the engine that runs two systems over one world at once, and a race there was found by exactly this tool and closed with atomics — a regression would be a corrupted chunk under a parallel reader, which no functional test reliably catches."
runs = [
    "just test-sanitize --sanitizer thread --tests jobs",
    "just test-sanitize --sanitizer address,undefined --tests jobs",
    "just test-sanitize --sanitizer thread --tests ecs_scheduling",
    "just test-sanitize --sanitizer address,undefined --tests ecs",
]
platforms = ["linux"]
since = "m1"
class = "permanent"

[[gate]]
id = "job-throughput"
describe = "The job system's throughput benchmark against its committed thresholds. Every metric it checks is dimensionless — a speedup divided by the worker count, a cost in units of a calibration workload measured in the same process — so a shared two-core runner and a workstation are held to the same number. --profile profile because assertions are compiled out there, and a measurement taken with them on is not the number the thresholds were recorded against."
runs = ["just test-bench-jobs --profile profile"]
platforms = ["linux"]
since = "m1"
class = "permanent"

[[gate]]
id = "profiles"
describe = "Every profile builds and its whole test set is green. The build and test jobs cover dev; this covers debug, profile and release, because M0's gate found the class of failure that only appears outside the profile everyone develops in."
runs = [
    "just build-engine --profile debug",
    "just test-all --profile debug",
    "just build-engine --profile profile",
    "just test-all --profile profile",
    "just build-engine --profile release",
    "just test-all --profile release",
]
platforms = ["linux"]
since = "m1"
class = "permanent"

[[gate]]
id = "workflows"
describe = "The workflow invokes recipes rather than reimplementing them, names no recipe that does not exist, and runs every permanent gate declared in this file; env-doctor still diagnoses a broken environment. It has run in the quality job since M0 and is declared here from M1, because it is the check that keeps this file and .github/workflows/ from drifting apart — and a gate that is enforced by nothing but habit is the drift it exists to catch."
runs = ["just ci-check"]
platforms = ["linux"]
since = "m1"
class = "permanent"

# --- The gates M2 — World added -----------------------------------------------------------------------
#
# The proposal's "New permanent gates": the state hash reproduces across runs and across snapshot
# restore, a cooked scene loads as archetype blocks, the coherence invariants hold, and structural
# changes are observable only at flush points. Four claims, four gates, and each is the check that
# stops a decision this milestone made from being quietly undone by a later one — because every one
# of them is a property that a change can break without breaking a single test that names it.
#
# Each names commands that already run in .github/workflows/ci.yml's `world` job. That is not a
# coincidence: `just ci-check` fails when a permanent gate declared here is run by no job there, so
# a gate is declared and its job lands in the same change, or neither does.

[[gate]]
id = "state-hash"
describe = "The hierarchical state hash, compared across PROCESSES rather than across iterations of one loop: a fresh address space each time is what would expose a hash that depended on an allocation address, a container's iteration order or a per-process hash seed. Covers the tick-loop probe and the M2 artefact, which also checks the hash against a snapshot capture, a divergence and a restore. Eight milestones of simulation code are written against this number; a change that makes it non-reproducible has broken determinism for all of them, and this is where it is caught."
runs = ["just test-smoke -R tick_loop", "just test-smoke -R headless_sim"]
platforms = ["linux"]
since = "m2"
class = "permanent"

[[gate]]
id = "cooked-blocks"
describe = "An authored hierarchy lowers to chunk-shaped archetype blocks, and a block activates as one memcpy per column per chunk. This is the assumption the whole storage decision rests on — the milestone's named spike — and it is the one that fails silently: a cook that started emitting per-field tags, or a flattening that became a per-edge test, would still produce a world that looks right and would cost M6 its bulk-copy activation. The flattening rule is a walk to the root, and the negative case (a static child of a moving parent keeps its relationship) is in this gate too."
runs = ["just test-integration -R scene_cooking", "just test-integration -R ecs_scale"]
platforms = ["linux"]
since = "m2"
class = "permanent"

[[gate]]
id = "scene-coherence"
describe = "The invariants between the node façade and the storage it is a façade onto: no node duplicates component data, destroying an entity invalidates its nodes, no traversal order produces a state a direct query would not, and no orphaned entity survives — the last of those carried by the scene load/unload cases rather than by `check_coherence()`, whose five invariants are the specification's numbered ones. design.md §3's rule is that there is no shadow copy at all, and the moment one exists every bug after it is a debugging session about which representation was right."
runs = ["just test-integration -R scene_scale"]
platforms = ["linux"]
since = "m2"
class = "permanent"

[[gate]]
id = "structural-deferral"
describe = "A structural change attempted while a query iterates is refused and counted, in ALL FOUR profiles — a returned error and a counter, never a CY_ASSERT, which is compiled out of Profile and Shipping. It is a correctness property rather than an optimisation: the scheduler parallelises systems from their declared access, and immediate structural mutation cannot coexist with that. The scheduling suite is in the same gate because it holds the case that reproduced the race — two systems iterating one world at once."
runs = ["just test-unit -R ecs", "just test-integration -R ecs_scheduling"]
platforms = ["linux"]
since = "m2"
class = "permanent"

# --- The gates M3 — First light added ---------------------------------------------------------------
#
# The proposal's "New permanent gates", and every one of them is a property a change can break
# without breaking a test that names it — which is the standard the M1 and M2 blocks above set.
#
# What is NOT here is as deliberate as what is. There is no golden-image gate: a committed reference
# is a photograph of one implementation, a hosted runner has no GPU, and the default build has
# CY_RENDERER_VULKAN off — so a `golden` gate would be an intention rather than a check. What runs
# on every pull request is everything about a frame that is DECIDED rather than drawn, which is most
# of it; the golden images are a criterion of m3.toml carrying `requires = "gpu"`, reported as not
# evaluated on a machine that cannot judge them rather than as passed.
#
# Each names commands that already run in .github/workflows/ci.yml's `render` job. That is not a
# coincidence: `just ci-check` fails when a permanent gate declared here is run by no job there, so
# a gate is declared and its job lands in the same change, or neither does.

[[gate]]
id = "render-graph"
describe = "The milestone's whole point: a pass declares what it reads and what it writes, and the graph derives the barriers, the transient aliasing, the pass schedule, the culling, the cross-queue semaphores and the queue-family ownership transfers. `just quality-layers` (the `layering` gate) is the STATIC half — no barrier-emitting symbol outside the graph and the RHI, proven against fixtures that introduce one. This is the DERIVATION half: that what comes out is correct, that it is identical across runs (design.md §6, and M9's replay depends on it), and that aliasing measurably reduces the plan's peak against its own no-aliasing control. Barriers written by hand spread to every pass and their removal is a renderer rewrite; this is the gate that stops the first one."
runs = ["just test-unit -R render_graph", "just test-integration -R render_graph_scale"]
platforms = ["linux"]
since = "m3"
class = "permanent"

[[gate]]
id = "render-device"
describe = "The render suites. WHAT THIS RUNS DEPENDS ON THE BUILD, and the honesty is the point: on a build with no Vulkan backend — which is the default, and what a hosted runner gets — `just test-render` runs `render.null_frame` and `render.xr_prerequisites`, which need no GPU and check everything about the artefact's frame that is decided rather than drawn: the pass count before and after the one-off upload, the submit count, the barrier batches in the recorded stream equalling the number the plan derived (the runtime half of task 7.2), two runs producing an identical command stream, and the three XR seams. On a machine with a device and CY_RENDERER_VULKAN=ON the same command also runs `render.conventions` and `render.golden`. A rendering milestone whose only gate is a photograph is a rendering milestone that is not gated on the machines that build it."
runs = ["just test-render"]
platforms = ["linux"]
since = "m3"
class = "permanent"

[[gate]]
id = "render-frame"
describe = "The renderer above the graph, and all of it runs with no GPU: the explicit RHI over the null backend, the handle-based render server and the GPU scene as a publication interface, the snapshot taken at M2's commit boundary, the thirteen-stage pass order in which a disabled feature is an ABSENT PASS rather than a branch, the BRDF (whose normalisation is asserted by integrating the distribution, which is what caught a GGX that lost energy), the shadow atlas and cascades, and the culling and LOD hysteresis. Each is a decision the milestone made that a later one can undo without any test that names it going red."
runs = [
    "just test-unit -R rhi",
    "just test-unit -R render_",
    "just test-unit -R material",
]
platforms = ["linux"]
since = "m3"
class = "permanent"

[[gate]]
id = "shader-pipeline"
describe = "Slang to SPIR-V, and the pipeline around it: permutations, reflection-driven binding (bindings derive from reflection rather than from a hand-maintained table, which is the requirement a hand-maintained table always eventually violates), the shader library and its tiered cache, the pipeline state cache, and hot reload over M2's file watcher. It runs with CY_SHADER_SLANG OFF, over the SPIR-V passthrough — which is not a stub but the shipping path, and is why a machine with no shader toolchain still exercises reflection, permutations, the cache and the reload."
runs = ["just test-unit -R shader", "just test-integration -R shader_pipeline"]
platforms = ["linux"]
since = "m3"
class = "permanent"

# --- The gates M4 — Playable added ----------------------------------------------------------------
#
# The proposal's "New permanent gates" are three: the ABI compatibility check, Swift API tests, and a
# check that the sample contains no C++ gameplay code. Declared below, together with the three
# invariants M4 built and would otherwise have left ungated — the one command stream, fixed-tick
# input, and physics determinism. Every one is a property a change can break without breaking a test
# that names it, which is the standard the M1, M2 and M3 blocks above set.
#
# WHAT IS NOT HERE. There is no `camera` or `audio` gate. Both capabilities land at Seed, both are
# covered by `just test-all` in the build-and-test gate, and neither carries an invariant that a
# later milestone can silently undo — which is what separates a gate from a suite. A gate declared
# for every module is a gate list nobody reads.
#
# Each names commands that already run in .github/workflows/ci.yml's `playable` job. That is not a
# coincidence: `just ci-check` fails when a permanent gate declared here is run by no job there, so
# a gate is declared and its job lands in the same change, or neither does.

[[gate]]
id = "abi"
describe = "THE COMPATIBILITY OBLIGATION, AND IT IS THE ONE THAT NEVER ENDS. `just quality-abi` compares the current interface table against a committed baseline and fails on anything but an append — a reorder, a removal, a changed signature — printing the approval stanza it would take to record a break. The gate's own selftest edits the LIVE header in memory and runs the real gate against the real baseline, so a parser that stopped recognising the table fails there rather than passing two fixtures that both describe nothing. The suites beside it hold the rest: the layout the description is derived under is asserted against the compiler's own sizeof and offsetof, and the loader is held to the reload sequence over C modules. By M5 the editor is compiled against this table; the window in which reordering it is cheap closed at the first exported symbol."
runs = [
    "just quality-abi",
    "just test-unit -R abi",
    "just test-integration -R abi_",
]
platforms = ["linux"]
since = "m4"
class = "permanent"

[[gate]]
id = "swift-api"
describe = "The Swift overlay and the game modules built against it. Two of these need no Swift toolchain and run everywhere — the committed overlay is what regeneration produces (a stale overlay is caught by whoever builds the ENGINE, not only by whoever builds Swift), and the engine's own binaries link no Swift runtime, which is most interesting on a machine that has none. The other three need one: the package's own tests, and a real Swift module hot-reloaded by the engine's loader across a layout change — carrying an ARC-managed `String` by name, which is the only migration the hot-reload spike found that works. `swift-scripting` also requires standard tooling to keep working, which is why the package is built by SwiftPM rather than by this build."
runs = ["just test-integration -R swift_"]
platforms = ["linux"]
since = "m4"
class = "permanent"

[[gate]]
id = "command-stream"
describe = "ONE VALIDATED COMMAND STREAM, AND THE TEST THAT BYPASSES IT AND FAILS. `gameplay-framework`'s M4 invariant, and the reason it is a gate rather than a suite: replay, rollback and lockstep are one command log read three ways, which is only true if the log is complete. A single system that reads a device directly does not merely bypass the stream — it makes the M9 guarantees unachievable until somebody finds it, and nothing points at it, because everything works until a desync months later. The suite holds the invariant three independent ways: `cy::gameplay` declares no dependency on `cy::servers-input` so an input header is not on its include path, the gameplay context has no input member, and a PARTIAL bypass — one axis through the stream and one from a side channel — runs perfectly, validates, fills the log, and then diverges on replay."
runs = ["just test-unit -R gameplay"]
platforms = ["linux"]
since = "m4"
class = "permanent"

[[gate]]
id = "input-fixed-tick"
describe = "A button pressed and released BETWEEN two ticks is observed as both by the tick that follows. design.md §5, and the requirement most likely to be implemented as `sample the current state each tick` — which passes every manual test and loses input precisely when the frame rate is uneven. The unit suite asserts it over the action layer and ends with a NEGATIVE CONTROL that computes what level sampling would have answered on the same events and requires the two to differ, so a refactor that made the accumulating path degenerate cannot leave the file passing vacuously. The integration suite asserts the platform half against real SDL3 events, which need no display and so run headless."
runs = ["just test-unit -R input", "just test-integration -R sdl3_input"]
platforms = ["linux"]
since = "m4"
class = "permanent"

[[gate]]
id = "physics"
describe = "`PhysicsServer` and everything behind it, and the suites are CONFORMANCE suites rather than tests of one backend: the same cases run over the reference implementation that is always built and over Jolt, because `physics` requires that swapping the backend change no gameplay code, component or asset — and a character that walks differently after a swap has changed gameplay whether or not any code moved. The character controller is engine code over shape casts for exactly that reason. Determinism across runs on one platform is in here too, which is the property M9's rollback is priced on."
runs = ["just test-unit -R physics", "just test-integration -R physics_"]
platforms = ["linux"]
since = "m4"
class = "permanent"

[[gate]]
id = "character-artefact"
describe = "THE SAMPLE CONTAINS NO C++ GAMEPLAY CODE, checked twice and the weaker check is the grep. The static half partitions the directory (Swift under game/, C++ under host/), requires exactly one call into the game per tick, checks THE DIRECTION OF EVERY COMPONENT ACCESS against the boundary the game declares — a host that wrote into `CharacterDrive` would be choosing the character's velocity — and refuses a copied tunable; it has its own negative cases, which edit the live tree in memory. The strong half is a RUN: the same binary with `--no-behaviours` loads the same module, builds the same level from it, brings up the same five servers and pushes the same scripted input through the same command stream with the two deciding behaviours not created. The command log hashes identically and nothing moves. A static check can only fail on the words somebody thought to forbid; this one fails on any decision at all having leaked to the C++ side. THE SAMPLE IS ABSENT WITHOUT A SWIFT TOOLCHAIN rather than skipping — its gameplay IS a Swift module — so this gate is a statement about a machine that can build one."
runs = [
    "just test-smoke -R character_sample",
    "just test-integration -R character_no_cpp_gameplay",
    "just run-sample character --ticks 120",
]
platforms = ["linux"]
since = "m4"
class = "permanent"

# --- The gates M5 — Authorable added ---------------------------------------------------------------
#
# M5 is the milestone that put a second application in the tree, in a second language, and the first
# gate below is the one this project should have had the moment it did. The other three are the
# invariants M5 built that a later milestone can break without breaking any test that names it —
# which is the standard the M1, M2, M3 and M4 blocks above set.
#
# WHAT IS NOT HERE. There is no `text` gate: `text-and-fonts` lands at Seed, its suite is covered by
# `just test-all` in build-and-test, and it carries no invariant a later milestone can silently undo.
# M4 made the same call for camera and audio and stated the rule. There is no `picking` gate either,
# and that one is worth being precise about: engine-side picking and the viewport transport are
# cases inside `unit.render_server`, which the `render-frame` gate already runs — adding a second
# gate over the same suite would say less and cost more.

[[gate]]
id = "editor"
describe = "THE EDITOR'S OWN GATES, AND THE GAP THIS CLOSES WAS REPORTED THREE TIMES BEFORE IT WAS SHUT. `just build-editor-check` runs the Rust SDK generator's selftest, rustfmt over the hand-written sources, clippy with the workspace's pedantic lint table as errors, and 505 tests — and until this gate existed it was green in all four profiles, called by no job and by no other recipe, so a change that broke any of it merged silently. What the tests hold is the milestone's whole invariant set: a document mutated ONLY through a transaction and the test that writes around it and fails, undo and redo round-tripping a session, the journal replaying after an abnormal termination, no crate depending upward or sideways, every crate but the audited SDK forbidding unsafe code, the four profiles meaning in Cargo what they mean in CMake — which matters because two of them compile the assertions out — and the editor surviving a runtime process killed under it. Three platforms, because the ROADMAP's exit criterion is that the editor's headless tests run in continuous integration on all three, and a workspace that needs no window, no graphics device and no toolkit is exactly the thing that can."
runs = ["just build-editor-check"]
platforms = ["linux", "windows", "macos"]
since = "m5"
class = "permanent"

[[gate]]
id = "editor-session"
describe = "KILL THE HOSTED RUNTIME MID-SESSION AND THE EDITOR SURVIVES WITH THE DOCUMENT INTACT. This is the argument for the editor being a client rather than part of the engine, and it is a statement about PROCESSES: a test that dropped a socket would prove the protocol handles an end of stream, and only killing a process proves the editor's fate is not tied to the runtime's. The session runs three real binaries — the engine's importer, the editor, and a runtime on the other side of a Unix domain socket — and the kill is ORDERED rather than timed, because a scripted session is over in three milliseconds and the first attempt at this raced and killed the runtime after the editor had already exited. The act is delivered through a FIFO, so every command in it provably runs after the runtime died. The selftest beside it requires the two assertions that carry the claim to FAIL when they should; a check that has never been seen to fire is a check nobody should trust. Linux and macOS only, because the live bridge is a Unix domain socket and the stub refuses to pretend otherwise."
runs = [
    "just test-smoke -R editor_session",
    "just test-integration -R editor_session_selftest",
    "just run-editor-session --only survive",
]
platforms = ["linux"]
since = "m5"
class = "permanent"

[[gate]]
id = "asset-import"
describe = "THE IMPORTER'S PURITY AND THE CACHE'S HONESTY, both of which are properties a later change can lose without any functional test noticing. An importer is handed BYTES and cannot open a file; a second file is read only through the resolver that records it as a dependency in the same act, so the dependency list cannot fall out of step with what was read. Two importers may not claim one extension, an option the schema does not declare is refused, and setting an option to its default produces the SAME cache key as never setting it — so a designer who opens the dialog and touches nothing does not invalidate the project. A derivation key frames every contribution, so two different inputs cannot collide and serve one computation's artefact for another's with no diagnostic. A miss is not an error, an unreadable record is deleted rather than reported as a build failure, and a HIT REPRODUCES THE OUTPUT rather than skipping it, so a developer who deleted their cooked directory and kept their cache gets their content back. A failed import is not cached, because a cached failure is one you cannot clear by fixing the source."
runs = [
    "just test-unit -R import",
    "just test-integration -R import_",
    "just test-unit -R assets",
    "just test-integration -R assets_io",
]
platforms = ["linux"]
since = "m5"
class = "permanent"

[[gate]]
id = "live-editing"
describe = "A MODULE RELOADS WHILE THE RUNTIME IS LIVE AND WORLD STATE SURVIVES IT. M4's spike proved the model — serialize, migrate by name, recreate, never dlclose — and M4 closed with nothing that reloaded a module while a runtime was running, which it recorded as its one half-satisfied criterion. This is the other half: reload applied at a frame boundary rather than under a system, over a DIRECTORY of generations rather than one file, because a Swift image needs a distinct module name per generation and copying a file cannot produce one. Beside it is runtime inspection over the ABI — the world's components, their fields and their chunks read from outside the process that owns them, which is what an editor attached to a running game actually does, and the reason the ABI grew a chunk entry at M4."
runs = [
    "just test-integration -R live_reload",
    "just test-integration -R abi_inspector",
]
platforms = ["linux"]
since = "m5"
class = "permanent"

# --- M6's gates: a world larger than memory, and a build that is a graph --------------------------
#
# Six new permanent gates, one per capability this milestone brought to Working, and a job for each
# command in .github/workflows/ci.yml — because `just ci-check` fails a permanent gate no workflow
# runs, and a gate declared without its job is the debt M5.5 recorded and this milestone pays two
# lines further down.
#
# WHY SIX RATHER THAN ONE. `test-all` runs every suite once and reports that they passed, which is a
# different claim from "these particular properties still hold" — the argument the `world` and
# `render` jobs already make, and the reason `physics`, `asset-import` and `live-editing` exist as
# gates beside them. Each of the six below names the property whose loss would be silent otherwise.

# A GATE'S `runs` IS A COMMAND SOMEBODY TYPES, AND THREE OF THEM COULD NOT BE TYPED. M6's closing
# gate found `just test-integration -R "world_(activation|streaming)"` failing with
# `bash: -c: line 1: syntax error near unexpected token '('` — `just`'s `*args` is a string, a recipe
# interpolates `{{args}}` textually, and the caller's quotes are gone by the time bash sees the
# parentheses. The `world-streaming` and `save` gates below each declared such a command, the same
# strings were in `.github/workflows/ci.yml`'s `scale` job, and four of `m6.toml`'s criteria ran them
# — so three of this milestone's suites were covered by a command that has never executed anything.
# Each is now one invocation per suite. `just/test.just` is where the real repair belongs and
# `m6.toml` says why it was not made here.

[[gate]]
id = "world-streaming"
describe = "A WORLD LARGER THAN MEMORY, AND THE THREE PROPERTIES THAT MAKE IT ONE. Cell identity is a fixed-seed hash of the partition's own configuration, so changing the cell size changes cell identity BY CONSTRUCTION rather than by a rule somebody remembers, and `compare_partitions` reports the field that moved instead of producing silently incompatible data. Cells are cooked in ECS-NATIVE FORM — archetype blocks handed to `ecs::World::instantiate()` with no transformation — so streaming cost is proportional to what arrives rather than to what content is; the day a conversion step becomes necessary before instantiation, that invariant has gone and this gate is where it shows. And activation is STAGED AND ATOMIC: a cell is prepared over several ticks into private staging and published in one, a consumer that reacts to activation by requesting another cell has its request QUEUED rather than processed re-entrantly, and a fixed route across a world that does not fit in the budget holds the per-tick activation budget every tick while cells stream in, out and away behind it."
runs = [
    "just test-unit -R unit.world",
    "just test-integration -R world_activation",
    "just test-integration -R world_streaming",
    "just test-integration -R world_traversal",
]
platforms = ["linux"]
since = "m6"
class = "permanent"

[[gate]]
id = "residency"
describe = "ONE POLICY, SEPARATE STORAGE — and the separation is structural rather than conventional, which is what this gate protects. `hold()` consults nothing about activation and there is no tick, no world and no running flag anywhere in the server's header, so \"a test holds bytes resident with simulation off\" is a property of the interface rather than of a test's arrangement. The budget is spent at ADMISSION rather than at arrival, which is the defect the suite found and would find again: without the pending record a three-page budget admitted five pages every frame, because nothing was resident yet at any decision point. Beside it, the teardown suite destroys the server with requests in flight from several threads — M6 creates and destroys worlds continuously, and M5.5's gate found this project's first real engine defect exactly there."
runs = [
    "just test-unit -R unit.residency",
    "just test-integration -R residency_teardown",
]
platforms = ["linux"]
since = "m6"
class = "permanent"

[[gate]]
id = "virtual-texturing"
describe = "A SURFACE IS NEVER MISSING, ONLY BLURRY — asserted over the WHOLE address space of a texture rather than at sampled points, because the failure it guards against is a hole at one address and a property checked at three addresses is not a property. The mip tail is pinned and the page table refuses to invalidate a pinned entry, so a runtime producer cannot revoke the guarantee while invalidating its own region. The other half is that feedback never blocks a frame: `record` is wait-free and DROPS rather than waits, and the teardown suite puts eight recording threads against a churning resolver while a hundred systems are destroyed with production in flight. A full cache REFUSES rather than choosing its own victim, so no second eviction policy can grow beside the residency layer's."
runs = [
    "just test-unit -R unit.virtual_texturing",
    "just test-integration -R virtual_texturing_teardown",
]
platforms = ["linux"]
since = "m6"
class = "permanent"

[[gate]]
id = "save"
describe = "THE SAVE IS THE OVERLAY, AND A GENERATION IS ATOMIC UNDER `kill -9`. The pointer is the only object whose rewrite changes what loads and it is a single atomic write, so killing the process at any of the five phases leaves the previous generation loadable — which the suite does at each phase rather than arguing. Every container is sorted by key rather than by insertion, so two overlays holding the same logical state encode to identical bytes and a content-addressed store recognises an unchanged region instead of rewriting it. A record of a type this build does not declare is PRESERVED rather than dropped, which is what lets a save written with a plugin load without it and save again with that state intact, and a damaged chunk is a diagnostic and a fallback to an older generation rather than lost progress."
runs = [
    "just test-unit -R unit.save",
    "just test-integration -R save_archive",
    "just test-integration -R save_kill_nine",
    "just test-integration -R save_service",
    "just test-integration -R save_fuzz",
]
platforms = ["linux"]
since = "m6"
class = "permanent"

[[gate]]
id = "build-graph"
describe = "THE CORRECTNESS BUG M6's SPIKE WAS COMMISSIONED TO FIND, AS A GATE. Two builds of one importer at -O2 and -O0 computed the IDENTICAL derivation key and one was served the other's artefact with a reported cache hit, because the key contributed no compiler, no flags and no library versions. One function now computes every key and REFUSES an incomplete toolchain fingerprint, so a key that omits the compiler is unrepresentable rather than discouraged; the fingerprint is generated from the dependency manifests at configure time, so adding a dependency without adding it to every key is impossible. A downstream node contributes its upstream's OUTPUT DIGEST rather than its key — the decision that is expensive to reverse — and a producer is handed read, discover and write and NO FILESYSTEM, so an undeclared read is an access violation rather than a stale artefact served with a report of success. Beside them: a cold build and a cache-warm build produce byte-identical artefacts, an edit invalidates exactly its dependents, and a patch interrupted at any stage — including by killing the process — leaves the previous build installed and verifiable."
runs = [
    "just test-unit -R unit.build_graph",
    "just test-integration -R build_service",
    "just test-integration -R build_patch",
]
platforms = ["linux"]
since = "m6"
class = "permanent"

[[gate]]
id = "render-culling"
describe = "GPU-DRIVEN CULLING'S EXPECTED VALUES, COMPUTED ON THE CPU, so that when the dispatch lands it is checked against a buffer rather than against a screenshot. `GpuCullView` is a shader contract — 272 bytes with static_asserted offsets and TWO plane sets, the view's own frustum and the camera's, because one frustum cannot answer both of the requirement's questions — and a visibility range stores its parent slot PLUS ONE so that a zeroed record means \"no parent\" rather than \"slot 0\", which was a live defect a test caught. The hierarchical depth buffer answers \"not occluded\" for every case it cannot decide, because false occlusion is a correctness bug and not a quality one. Beside it, the geometry side `rendering-geometry-and-resources` completes on: the resource ledger that RECORDS a release and reclaims it on retire rather than freeing it under a frame still reading it, and a teardown suite that destroys it with work outstanding."
runs = [
    "just test-unit -R unit.render_gpu_culling",
    "just test-integration -R render_gpu_culling_teardown",
    "just test-unit -R unit.render_geometry",
    "just test-integration -R render_geometry_teardown",
]
platforms = ["linux"]
since = "m6"
class = "permanent"

# --- The two gates M5.5 could not land, and the jobs that make them possible ----------------------
#
# m5b.toml's last note, in full: "THERE IS NO NEW `class = \"permanent\"` GATE IN THIS CHANGE. Every
# criterion below runs under a gate that already exists, and the two that no workflow can run name
# `milestone-m5b`. `just ci-check` fails a permanent gate no workflow runs, and
# .github/workflows/ci.yml is not this change's file. The closing change should add an
# `editor-window` gate for a self-hosted runner with a display, and an `agent` gate beside it,
# together with their jobs — a gate and its job land in the same change or neither does."
#
# This is that change, and both jobs are in .github/workflows/ci.yml beside these two declarations.
#
# WHAT MAKES THE WINDOW GATE HONEST ON A RUNNER THAT CANNOT RUN IT. The `editor-window` job is
# `runs-on: [self-hosted, linux, x11]` and is guarded by `if: vars.CY_EDITOR_WINDOW_RUNNER == 'true'`
# — a repository variable, set where such a runner exists and unset everywhere else. Without the
# guard a fork with no self-hosted runner would queue the job forever and every pull request would
# look stuck; with it, the job is SKIPPED and says so. The criteria it covers still carry
# `requires = "display"` in m5b.toml, so a machine that cannot judge them reports NOT EVALUATED
# rather than green — the two mechanisms answer different questions and neither replaces the other.

[[gate]]
id = "editor-window"
describe = "A PERSON OPERATES THE EDITOR'S WINDOW, AND NOTHING IN THE RUN IS A TEST HOOK. X11 key presses and pointer drags are synthesised through XTEST and delivered to the SERVER, so the editor cannot tell the driver from a hand on a keyboard; the viewport composites another process's rendered image through an imported dma-buf with no copy through the CPU. It needs an X server with XTEST, a device that can import a dma-buf with an explicit DRM format modifier, python-xlib and Pillow — which no hosted runner has, and which is why this gate's job is a self-hosted one behind a repository variable rather than a check that would report green because the window never opened. From M6 the drag it attempts reaches a real Transform, because opening a document now produces a schema and nodes."
runs = [
    "just test-smoke -R editor_window",
    "just run-editor-window",
]
platforms = ["linux"]
since = "m5b"
class = "permanent"

[[gate]]
id = "agent"
describe = "AN AGENT AUTHORS THROUGH THE SAME COMMANDS A PERSON USES, over the Model Context Protocol on the editor's standard input: it composes a scene, reads it back, writes a gameplay script whose file appears on disk and which undo removes and redo restores byte for byte, finds its own changes in the editor's history carrying actor, session and intent, is REFUSED a write outside its directories and an effect its scope does not grant, enters and leaves play, and is told what it has spent. Every tool it was offered is checked against the registry's own projection, so a hand-written tool entry fails this gate. No window and no graphics device, which is why this half of M5.5 is the half a hosted runner can judge — and why it is a gate of its own rather than a line in `build-and-test`, which runs the same smoke entry and reports only that a suite passed."
runs = [
    "just test-smoke -R agent_authoring",
    "just run-agent-authoring",
]
platforms = ["linux"]
since = "m5b"
class = "permanent"

# --- Milestone gates ------------------------------------------------------------------------------
#
# Task 4.4.3. A milestone's exit criteria join the gate set when it closes and stay green afterwards;
# a change that breaks one does not merge unless it lands the criterion's recorded replacement in the
# same change (`testing-and-quality`, Quality gates for merge). Until then the state below says so,
# and `just roadmap-milestone <id>` is the recipe that decides it.
#
# `state = "green"` HERE IS WHAT A LEDGER READS. Since M5 a ledger evaluates the permanent set —
# every green milestone's criteria, merged and deduplicated — plus its own, each check exactly once,
# and invokes no other ledger — `criteria.build_plan`, and tools/roadmap/README.md under
# "A ledger is flat".
# So `just roadmap-milestone m4` alone evaluates every criterion M0, M1, M2 and M3 closed with; the
# gates below are the same set sliced per milestone, for naming a failure, not four runs to make.
# Running the newest ledger is how a person or a job satisfies all of them without re-multiplying.
#
# M0 closed — openspec/changes/archive/2026-09-03-implement-m0-ground — so its gate is `green` and
# permanent from here on, which is what the class exists to record. It was left at
# `joins-on-close` when M0 was archived, and M1 then landed static-analysis findings in two modules
# that turned `just roadmap-milestone m0` red: exactly the regression this state is meant to make
# unmergeable. M1's ledger evaluates M0's whole set for the same reason — through the permanent set
# since M5, and before that through an `m0-green` criterion that ran M0's recipe outright.

[[gate]]
id = "milestone-m0"
describe = "M0 — Ground: the exit criteria of the milestone that built the toolchain, the skeleton and the first gates."
runs = ["just roadmap-milestone m0"]
platforms = ["linux", "windows", "macos"]
since = "m0"
class = "milestone"
milestone = "m0"
state = "green"

# M1 closed — openspec/changes/archive/…-implement-m1-substrate — and its gate was still
# `joins-on-close` when M2 came to close, which is the same omission the paragraph above records
# against M0. Flipped here, at M2's close, which is the milestone that is supposed to do it: M2's
# own modules are compiled into and run by M1's `four-profiles` criterion, so this is exactly the
# shape of regression the state exists to make unmergeable, and leaving it unflipped would have made
# M1's ledger something nothing runs.
#
# What it costs is recorded in docs/roadmap/capability-matrix.md and is not small: this gate runs
# `just roadmap-milestone m1`, a recipe of several minutes that contains `four-profiles`, and
# `four-profiles` was measured at M2's close failing roughly one Debug run in thirty. A pull request
# now has two independent exposures to that rate rather than one. Fixing the flake is the answer;
# an override here would only hide it.
#
# CORRECTED AT M5. "Two independent exposures" counted the ledgers that each ran `four-profiles`,
# and the count kept growing because each ledger also ran the one below it. It does not any more:
# one run of the newest ledger runs `four-profiles` once, so the exposure is one per run of it
# rather than one per rung. The flake is still the answer and still unfixed — m2.toml records it.

[[gate]]
id = "milestone-m1"
describe = "M1 — Substrate: the exit criteria of the milestone that built reflection and identity, memory, math, the job system, the asset layer and the project graph."
runs = ["just roadmap-milestone m1"]
platforms = ["linux", "windows", "macos"]
since = "m1"
class = "milestone"
milestone = "m1"
state = "green"

# M2 closed — openspec/changes/archive/…-implement-m2-world — and its gate was still
# `joins-on-close` when M3 came to close, which is the THIRD time in a row this has happened: M0's
# was flipped at M2 and M1's was flipped at M2 as well, both after the omission had already cost
