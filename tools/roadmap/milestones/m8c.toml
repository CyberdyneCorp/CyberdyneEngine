# --- Section 1: the determinism firewall ----------------------------------------------------------
#
# THE CRITERION THAT ARRIVED WITH ITS SUBJECTS. M8.b carried "VFX and inference cannot write gameplay
# state, proven by a test" with NEITHER SUBJECT IN THE TREE, which is a criterion its milestone
# satisfies vacuously. Both subjects exist now and the enforcement point is decided: the ECS WRITE
# PATH, not the command origin — because a command is the simulation's INPUT rather than its write,
# because `gameplay-framework` forbids provenance affecting validation or ordering, and because
# `vfx-system` states the diagnostic over COMPONENTS.

[[criterion]]
id = "firewall-ecs"
describe = "the write firewall at the ECS write path: an origin scope that nests and restores what it replaced, component authority raised but never lowered and derived from reflection with what could not be derived REPORTED rather than hidden, and every door — create, destroy, instantiate, remove, set_shared, set_sparse, remove_sparse, set_parent, the command buffer at RECORD time, the query chunk's mutable span and Snapshot::restore — refusing a write whose origin may not make it, and the disarm switch letting the same write land. THE GATE FOUND THIS CRITERION UNABLE TO FAIL AND FIXED IT: `unit.ecs` named the firewall in none of its fourteen sources, and passed with `WriteFirewall::admit` mutated to return true unconditionally. src/ecs/tests/test_firewall.cpp is the eleven cases that now go red under that mutation — 8 of 54 cases and 34 of 1,048 assertions. The thread-locality half is deliberately NOT here: this tier starts no thread, and `m8c:firewall-gameplay` covers it with eight"
source = "tasks 1.1, 1.2, 7.4, vfx-system delta"
kind = "recipe"
run = "just test-unit -R ^unit.ecs$"
ci_job = "milestone-m8c"

[[criterion]]
id = "firewall-gameplay"
describe = "THE TEST IN BOTH DIRECTIONS AND AS A NEGATIVE CONTROL: a VFX readback and a non-pinned inference result each attempt a gameplay write and are each refused by name, a permitted origin writes the same component and is not, and a re-simulation reaches the identical state digest regardless of what either did"
source = "tasks 1.2, 1.4"
kind = "recipe"
run = "just test-integration -R gameplay_firewall"
ci_job = "milestone-m8c"

[[criterion]]
id = "firewall-cook"
describe = "a non-pinned model feeding an authoritative AI node is refused AT COOK TIME, which is what `ml-inference`'s 'Multiplayer desync is prevented at cook time' asks for — a runtime diagnostic is not that requirement. The gate compares two digests computed by ONE function used on both sides, because two functions that agree today are two that can drift"
source = "tasks 1.3, 4.2, ml-inference"
kind = "recipe"
run = "just test-unit -R ml_cook"
ci_job = "milestone-m8c"

