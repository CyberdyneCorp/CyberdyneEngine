# DECLARED, RUN ON EVERY EVALUATION, AND STILL FAILING — and the closing gate had to build the
# mechanism that makes those three things compatible. This criterion was written to fail on purpose;
# `milestone-m8c` becomes a permanent merge gate the day it goes green and ci.yml runs
# `just roadmap-milestone m8c`, so with only "pass" and "fail" that job could never be green again,
# which is the sibling of the forbidden pattern "a milestone gate disabled rather than fixed or
# explicitly superseded". `known_gap` is the third answer: the criterion still runs, its failure is
# still printed under its own heading with the rung that must close it, and it does not hold the
# gate red. The direction that keeps it honest is the other one — the ledger FAILS if a declared gap
# starts passing, because a marker that outlived its gap is the next thing nobody notices.
known_gap = "Steam Audio does not configure and SteamAudioBackend::simulate returns NotImplemented. M8.c measured the cost in full — four upstream dependencies, a -fabi-version=6 line that blocks both pinned compilers, and a build-time tool this manifest has no field for — and moved `audio`'s Complete cell to M11 rather than claim the tier. FallbackAcoustics answers every query in every build, which is what `audio`'s \"content SHALL NOT depend on Steam Audio being present\" asks for"
known_gap_closes = "m11"

# --- Section 5: the artefact ----------------------------------------------------------------------

[[criterion]]
id = "slice-artefact"
describe = "the closing artefact as a CTest entry, so `just test-all` runs it and `build-and-test` covers it on every pull request: the game plays WITH PARTICLES AND A CUT IN IT — effects played from the activation pipeline's own cues, the scheduler's merged dispatches against its unmerged ones, the CPU fallback reported as a number, a compiled timeline blending two shots through the camera stack, and zero camera transforms written — and everything M8.b's artefact already claimed. No display and no graphics device"
source = "tasks 5.1, 5.2, 5.3"
kind = "recipe"
run = "just test-smoke -R vertical_slice"
ci_job = "milestone-m8c"

[[criterion]]
id = "slice-recipe"
describe = "the same artefact through the workflow a contributor types, which builds the engine first — so it fails when the recipe rots, which the CTest entry cannot see. It runs the scale act at the exit criterion's own figure of 8,000 agents, and it is where 'holding the frame budget it already declares' is measured: the simulation and the two new phases TOGETHER against the budget M8.b declared and M8.c did not raise"
source = "tasks 5.1, 5.3"
kind = "recipe"
run = "just run-vertical-slice"
timeout_s = 7200
ci_job = "milestone-m8c"

# THE NEGATIVE CONTROL M8.b BUILT, and its `run` string is IDENTICAL to m8b.toml's on purpose so the
# plan collapses the two into one run of it, reported as `m8b:slice-control`. It is declared here
# because M8.c extends the program that control runs against, and a ledger that did not name it
# would read as a milestone that stopped checking.
[[criterion]]
id = "slice-control"
describe = "THE NEGATIVE CONTROL, demonstrated on every ledger run rather than asserted once. `--interpret-control` adds a per-entity object with a virtual tick() and calls it in the loop; the interpretation audit must FIND it by name and the sample must return non-zero because of it. Act 4 of the driver is what requires that failure, so this criterion requires the ACT to pass and requires its named step to be in the output — a control that was deleted would report zero steps and exit zero, and that must not read as green"
source = "tasks 5.1, ROADMAP M8.b (no graph is interpreted at runtime)"
kind = "command"
run = "set -o pipefail; out=$(just run-vertical-slice --only control 2>&1); status=$?; echo \"$out\"; if [ $status -ne 0 ]; then echo 'the negative control act did not pass'; exit 1; fi; echo \"$out\" | grep -q 'an interpreted consumer is FOUND and the run fails because of it' || { echo 'the negative control act ran and did not report its step: it has been removed or renamed'; exit 1; }"
timeout_s = 3600
ci_job = "milestone-m8c"

# M8.c's OWN CONTROL, AND IT IS TASK 5.3. The determinism act now runs the slice twice with the same
# options — once with the particles and the cut live and once with `--no-spectacle` — and requires
# the IDENTICAL digest. As with `slice-control`, both halves are needed: the act must pass AND its
# named step must appear, because an act deleted from slice.py would report nothing and exit zero.
[[criterion]]
id = "slice-determinism"
describe = "the determinism act re-run with both new systems live reaches the SAME digest it reaches without them, which is the firewall's proof from the artefact's side. A particle system that wrote a health value, or a sequence that wrote a component instead of issuing a command, would move it — and the ECS write firewall would refuse the write before it could. Proved to fail by folding a VFX counter into the digest"
source = "tasks 5.3, 1.4"
kind = "command"
run = "set -o pipefail; out=$(just run-vertical-slice --only replay 2>&1); status=$?; echo \"$out\"; if [ $status -ne 0 ]; then echo 'the determinism act did not pass'; exit 1; fi; echo \"$out\" | grep -q 'the digest is the same with the particles and the cut live and without them' || { echo 'the spectacle determinism control is not in the output: it has been removed or renamed'; exit 1; }"
timeout_s = 3600
ci_job = "milestone-m8c"

[[criterion]]
id = "slice-capture"
describe = "THE SLICE'S FRAME IS CAPTURED RATHER THAN DRAWN, which M8.b's own report said a person could build all of M8.b without ever seeing. The pipeline layer's five callbacks and the particle renderer's extension record the frame on Vulkan with validation on; the identical frame is recorded through an EMPTY FrameSinks beside it; both are read back and the difference between them is counted in texels. Zero validation errors, and a control that lights no texel at all"
source = "tasks 1b.2, 5.4, 5.5"
kind = "command"
run = "set -e; just run-vertical-slice --only capture --capture build/m8c-capture/vertical-slice-m8c"
requires = "gpu"
reason = "it records the slice's frame on a graphics device and reads the image back; every other act of the artefact is judgeable with neither a device nor a display, and `m8c:slice-artefact` runs those"
timeout_s = 7200
ci_job = "milestone-m8c"

