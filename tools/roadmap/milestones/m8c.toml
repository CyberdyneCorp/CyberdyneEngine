# M8.c — Spectacle: the exit criteria, as data.
#
# The sources are openspec/changes/implement-m8c-spectacle/tasks.md and the M8.c row of
# docs/ROADMAP.md; every criterion below names which. `delivery-roadmap` requires each to be a recipe
# that exits zero, a command that exits zero, a benchmark within a threshold, or a committed artefact
# that is regenerated and compared — so an intention that cannot be run is a note at the bottom of
# this file, not a criterion.
#
# --- THIS LEDGER DECLARES ONLY M8.c's OWN CRITERIA, AND THERE IS NO `m8b-green` -------------------
#
# The ledger has been flat since M5 and `just roadmap-test` fails a ledger that invokes another one.
# `just roadmap-milestone m8c` evaluates the permanent set directly — the criteria of every milestone
# whose `class = "milestone"` gate carries `state = "green"` and which sits BELOW M8.c on the ladder,
# merged and deduplicated, each distinct check run exactly once — and then the criteria in this file.
# `criteria.build_plan` is the rule and tools/roadmap/README.md states it.
#
# A criterion here whose `run` string is identical to one an earlier ledger declared COLLAPSES into
# it and is reported under the earlier label — `m0:format` rather than `m8c:format`. The static gates
# are declared anyway, as every ledger since M3 has, because a ledger that does not name the checks
# its milestone had to satisfy is a ledger nobody can read. `four-profiles` below is deliberately
# spelled with the identical string nine earlier ledgers used, for the same reason.
#
# --- EVERY COMMAND IN THIS FILE WAS RUN, EXACTLY AS WRITTEN ---------------------------------------
#
# M6's closing gate found four criteria in m6.toml that had never executed anything, and M8.b's found
# one in m8b.toml that was INVERTED and had never been run as written — it asserted that the driver
# exits non-zero when what it wanted was that the ACT passes. So, as m8b.toml already required:
#
#   * no argument passed THROUGH a `just` recipe contains a shell metacharacter, because `just`'s
#     `*args` is interpolated textually into `bash -c` and an unquoted parenthesis reaches bash;
#   * every `-R` pattern is a `^…$` anchor or one plain word, and every one of them was listed with
#     `ctest -N` and its SELECTION READ rather than counted. `-R vfx` alone selects `unit.vfx_values`
#     and `integration.vfx_compiler` as well as `integration.vfx`, and `-R ml` selects
#     `unit.material` — both are the substring trap M7 and M8.b each recorded, and both are anchored
#     below;
#   * every criterion was executed on this machine and its output pasted into the closing report.
#
# --- WHY SO MANY CRITERIA NAME `milestone-m8c` AS THEIR CI JOB ------------------------------------
#
# The same arithmetic M7's, M8.a's and M8.b's ledgers recorded. M8.c declares ONE new gate —
# `milestone-m8c`, at `joins-on-close` — and points its own suites at it rather than inventing thirty
# more permanent gates whose jobs belong to `.github/workflows/ci.yml`. Until that gate flips to
# green the criteria below whose `ci_job` is `milestone-m8c` are run by `just roadmap-milestone m8c`
# and by nothing in continuous integration; the moment it flips they join the permanent set entire.
#
# --- WHAT THIS MILESTONE CARRIES THAT NO EARLIER ONE DID ------------------------------------------
#
# FIVE CRITERIA THAT NEED A GRAPHICS DEVICE, where M8.b carried one. That is the milestone's shape
# rather than an accident: M8.c is the first one whose subject is what a frame LOOKS like, and its
# section 1b exists because M8.b's gate found that a person could build all of M8.b and still not
# SEE it. Each of the five is reported NOT EVALUATED on a machine without a device rather than
# passed, and each has a companion that needs neither a device nor a display — `render.pipeline`
# beside `integration.render_pipeline`, `render.vfx` beside `integration.vfx`, `m8c:slice-capture`
# beside `m8c:slice-artefact` — so nothing this milestone claims is judgeable ONLY with a GPU.
#
# AND THE ARTEFACT IS SIX CRITERIA RATHER THAN FOUR.
#
#   slice-artefact     the CTest entry: the game plays, with particles and a cut in it. No display,
#                      no device.
#   slice-recipe       the same run through the workflow a contributor types, at the exit criterion's
#                      own 8,000 agents.
#   slice-control      THE NEGATIVE CONTROL M8.b built, unchanged and still required: a planted
#                      per-entity virtual tick is found and the run fails because of it.
#   slice-determinism  M8.c's OWN control, and it is task 5.3: the same options with the particles
#                      and the cut live and with `--no-spectacle`, requiring the identical digest.
#   slice-capture      the frame RECORDED on a device, and the same frame recorded with an empty
#                      `FrameSinks` beside it. The difference between those two is the whole of
#                      section 1b, measured in texels.
#   screenshot-*       the committed pictures, which is what makes the milestone evaluable by
#                      LOOKING — task 5.5's whole argument.

schema = 1
id = "m8c"
name = "Spectacle"
artefact = "samples/08-vertical-slice, EXTENDED — the same playable game with particles thrown by its own activation cues and a two-shot cinematic cut over its own fight. At 192 agents over 120 ticks: 309 effects played from committed activations, 4,135 live particles at the peak and none dropped for want of ring capacity, 360 merged dispatches against 19,044 unmerged — a factor of 52.9 from grouping emitters that share a compiled kernel — and 16,336 emitter-steps reported on the CPU path as DECLARED fallbacks rather than as a silence; a compiled timeline driving 90 frames of camera through cy::camera's stack, 29 of them with both shots contributing, at a blended lens of 0.444 rad strictly between the two rigs' own 0.42 and 1.15, with 0 arbitrated writes addressed at SubsystemId::Camera and 0 pose overrides; the two new phases costing 1.53 ms a tick against a declared 4 ms and 1.89 ms of simulation and spectacle together against the 25 ms M8.b declared and M8.c did not raise; the identical state digest with the two systems live and with --no-spectacle; and a frame RECORDED on Vulkan with validation on — five stages, 225 depth-prepass and 225 opaque draws, 4,635 sprite instances through the particle renderer's extension, 0 validation errors, 1,050,738 lit texels against 0 for the identical frame recorded through an empty FrameSinks, and 1,118,812 texels of difference between them"

# Non-binding, because none can be settled by running something. `delivery-roadmap` requires a
# criterion that cannot be evaluated by a machine to be restated as a check or moved here.
notes = [
    "`just roadmap-milestone m8c` is this recipe, so it cannot be one of the criteria it evaluates.",
    "tasks 6.4 — moving ci.yml's `milestone` job to `m8c` is checked by `workflows` below (`just ci-check`), which goes red the moment `milestone-m8c` is green above the newest ledger any workflow evaluates. It is the closing change's edit to make and not this file's.",
    "tasks 6.5 — opening the M9 change is `m9-open` below, which asks only that the change exists. AT THE TIME THIS FILE WAS WRITTEN IT FAILS, and it is meant to, exactly as m8b.toml's `m8c-open` and `roadmap-tiers` did: openspec/changes/ holds `implement-m8c-spectacle` and no `implement-m9-*`. The next rung IS M9 — `record.MILESTONES` carries m9 after m8c and there is no further split declared.",
    "tasks 7.x — the gate itself. A milestone cannot make passing its own gate one of the criteria that gate evaluates.",
    "THE SLICE'S BUDGETS ARE SHAPE BOUNDS AND NOT MACHINE NUMBERS, declared in `Budgets` in samples/08-vertical-slice/slice.h and printed by the program so the driver compares a measurement against the source rather than against a number copied into a script. M8.c DID NOT RAISE `kSimulationUs`: task 5.1 asks that particles and a cut fit INSIDE the budget the slice already declared, so `slice.py` checks the sum of the simulation and the two new phases against M8.b's own figure. `kSpectacleUs` beside it is the sub-allocation the two new systems share, and the VFX budget controller is told 1.5 ms of it so that 'cost is bounded by configuration' is a dial somebody turned.",
    "A FINDING IN A MODULE THE ARTEFACT ONLY USES, measured while the capture was written and reported rather than fixed: `SceneIndex::apply` leaves `SpatialEntry::gpu_slot` at zero — its own header says so and offers 'a caller that does own a GPU scene writes gpu_slot into the index itself' — but `SpatialIndex` exposes no way to set it after `insert`. Every draw of a `SceneIndex` frame therefore carries `instance_slot == 0`, which is invisible on a frame that is only ASSEMBLED and puts every prop of the level on top of the first one on a frame that is RECORDED. samples/08-vertical-slice/capture.cpp works around it by rebuilding the entries with `gpu_slot` set to the publisher's own spatial slot, and says so at the site. The fix belongs in src/rendering/culling/ or src/rendering/assembly/.",
    "`audio` DOES NOT REACH COMPLETE AT THIS MILESTONE ON THE EVIDENCE THIS LEDGER COLLECTED, and `steam-audio-configures` below is the forcing function that says so out loud: `-D CY_AUDIO_STEAM_AUDIO=ON` still does not configure and `SteamAudioBackend::simulate` still returns `ErrorCode::NotImplemented`. It is declared as a criterion rather than moved into these notes precisely because it CAN be run and does fail; a milestone that quietly dropped it would be repeating what M8.b's gate caught.",
]

