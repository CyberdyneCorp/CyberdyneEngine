# --- Section 6: the record and the next rung ------------------------------------------------------

# THE DOUBLE-STAR GLOB IS THE POINT, and m6.toml's own comment says why: a change lives at
# `openspec/changes/<name>/` while it is open and at `openspec/changes/archive/<date>-<name>/` once
# it closes, so a pattern that only matched an open change would turn red on the day the next
# milestone closed — which is the one day this criterion should be most satisfied. `**` matches both
# depths.
[[criterion]]
id = "m9-open"
describe = "the change for the next rung exists — open, or closed and archived — so the ladder continues deliberately. That rung is M9, Integrity: one command log read five ways, which `record.MILESTONES` already carries after m8c and which no further split has been declared against"
source = "tasks 6.5, delivery-roadmap"
kind = "path"
path = "openspec/changes/**/*m9*/proposal.md"
ci_job = "milestone-m8c"

# THE TIER FLOOR, AND TWO CELLS THIS MILESTONE PLANNED AND DID NOT REACH.
#
# `audio` is deliberately NOT in this table at `complete`: `steam-audio-configures` above is what
# would have to pass first, and it does not.
#
# AND `vfx-system` IS AT `seed`, NOT `working`, BECAUSE THE CLOSING GATE MOVED IT. What M8.c built
# is the asset model, the IR, the graph compiler, the derived attribute layout, the shared
# simulation world, the global scheduler, the budget controller, the bounded readback and the
# determinism firewall's producer side — everything the four suites above assert. What it did not
# build is the GPU compute dispatch: `device_dispatch_available()` answers false and every emitter
# falls back to the CPU, reporting `FallbackReason::DeviceDispatchUnimplemented` every frame. That
# is honest and it is not the requirement — `vfx-system`'s Purpose says "GPU simulation is the
# **default**, not an advanced mode" over a system "targeting millions of particles", which
# pre-empts Working's "optional and advanced requirements may be outstanding" for this one
# requirement by name. Seed's own definition — "behaviour may be minimal, single-threaded,
# unoptimised, or restricted to one backend" — is this module exactly. The `W` cell is at M10 in
# docs/roadmap/capability-matrix.md and the argument is in the M8.c section of docs/ROADMAP.md.
[[criterion]]
id = "roadmap-tiers"
describe = "the record carries M8.c's exit tiers, each naming the change that advanced it — `sequencing-and-cinematics` at Working, `vfx-system` and `ml-inference` at Seed. Two planned cells are absent on purpose and both are argued rather than dropped: `audio` at Complete, which `steam-audio-configures` below keeps failing about, and `vfx-system` at Working, which the closing gate moved to M10"
source = "tasks 6.3, implement-m8c-spectacle/proposal.md, ROADMAP M8.c"
kind = "tiers"
ci_job = "milestone-m8c"

[criterion.expect_tiers]
vfx-system = "seed"
sequencing-and-cinematics = "working"
ml-inference = "seed"

# --- Every profile --------------------------------------------------------------------------------

# THE IDENTICAL COMMAND M1 THROUGH M8.b DECLARE, written out rather than varied so that the plan
# COLLAPSES all of them into one run of it, reported as `m1:four-profiles`. That is the whole point
# of the flat ledger and the reason this string must not be "improved" here.
[[criterion]]
id = "four-profiles"
describe = "all four profiles build clean and just test-all is green in each — including the artefact and the suites this milestone's five new directories brought. CY_VFX and CY_ML default ON, as `delivery-roadmap` requires of a capability at Working and at Seed, and each also builds with its option OFF"
source = "tasks 7.2"
kind = "command"
run = "for p in debug dev profile release; do d=\"${CY_BUILD_DIR:+${CY_BUILD_DIR}/$p}\"; CY_BUILD_DIR=\"$d\" just build-engine --profile \"$p\" || exit 1; CY_BUILD_DIR=\"$d\" just test-all --profile \"$p\" || exit 1; done"
timeout_s = 28800
ci_job = "profiles"

# THE OPTIONS THIS MILESTONE ADDED, EACH BUILT WITH ITS FEATURE OFF. `-D CY_VFX=OFF` must remove
# src/vfx/ and leave the renderer untouched, which is `vfx-system`'s own "The system SHALL be
# removable at build time via CY_VFX WITHOUT AFFECTING THE REST OF THE RENDERER" — so
# src/rendering/particles/ is deliberately NOT behind it and this configuration proves it still
# builds. `-D CY_ML_ONNXRUNTIME=ON` is checked by `ml-onnxruntime` above, which is the other
# direction of the same rule.
[[criterion]]
id = "feature-options-off"
describe = "the whole tree configures and builds with each of this milestone's new feature options switched off — CY_VFX alone, and CY_RENDERER_VULKAN together with the CY_VIRTUAL_GEOMETRY that cmake/features.cmake requires with it. A capability that cannot be removed at build time is not behind an option, whatever cmake/features.cmake says; and samples/08-vertical-slice declares nothing at all in the configurations where its subjects are absent, rather than turning a removable feature into a configure error naming the artefact"
source = "tasks 2.x, 7.2, delivery-roadmap, testing-and-quality"
kind = "command"
run = "set -e; d=\"${CY_BUILD_DIR:+${CY_BUILD_DIR}/off-vfx}\"; CY_BUILD_DIR=\"$d\" just build-engine --profile dev -D CY_VFX=OFF; d=\"${CY_BUILD_DIR:+${CY_BUILD_DIR}/off-vulkan}\"; CY_BUILD_DIR=\"$d\" just build-engine --profile dev -D CY_RENDERER_VULKAN=OFF -D CY_VIRTUAL_GEOMETRY=OFF"
timeout_s = 14400
ci_job = "milestone-m8c"
