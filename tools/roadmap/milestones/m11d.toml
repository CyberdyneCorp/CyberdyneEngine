set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
binary="$d/cy_test_integration_packaging"
test -x "$binary" || { echo "no $binary — the suite integration.packaging does not exist"; exit 1; }
filter='a package audits its content*,provenance*,symbols are separable*'
out="$("$binary" "-tc=$filter" 2>&1)" || { echo "$out"; echo "the named case(s) FAILED"; exit 1; }
echo "$out" | tail -3
selected=$(printf '%s' "$out" | sed -nE 's/.*test cases: *([0-9]+) \|.*/\1/p' | head -1)
echo "the filter selected ${selected:-0} case(s) of the 3 it names"
test "${selected:-0}" -ge 3 || { echo "the named case(s) are not in integration.packaging any more — renamed, deleted, or the filter is stale"; exit 1; }
'''
ci_job = "milestone-m11d"

