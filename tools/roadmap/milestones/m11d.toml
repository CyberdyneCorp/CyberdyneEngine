# THE HANDOVER CHECK, in the shape `implement-m11-reach` task 0.1 settled for all five rungs — AND
# RE-POINTED, because a sixth rung was inserted above this one. It named `m11e` until M11.d's spike
# moved Metal and D3D12 into M11.d.5; a handover check that still named M11.e would have skipped a
# rung, which is the one thing a handover check exists to make impossible.
[[criterion]]
id = "m11d5-open"
describe = "the next rung's change exists — open, or closed and archived — AND has been deliberately entered. That rung is M11.d.5, Backends: the rung this one's spike carved out of it, which it hands the settled RHI interface, the shader targets, and two backends nobody on this host can compile"
source = "tasks, implement-m11-reach task 0.1, delivery-roadmap"
kind = "command"
run = '''
set -eo pipefail
# the double-star glob the ladder has used since M8.a: openspec/changes/**/*m11d5*/proposal.md
dirs=$(find openspec/changes -type d -name '*m11d5*' | sort)
test -n "$dirs" || { echo "no change directory matching openspec/changes/**/*m11d5*/"; exit 1; }
entered=""
for d in $dirs; do
    test -f "$d/proposal.md" || continue
    echo "  $d/proposal.md"
    # A CHECKED TASK OUTSIDE SECTION 0, and the exclusion is the point. Section 0 is a rung's own
    # decision-and-spike section, which the split that opened all five rungs could answer in advance;
    # a checked box there says the rung was SCOPED. A checked box in the body says the rung was
    # STARTED, which is the deliberate act this criterion is standing in for.
    if [ -f "$d/tasks.md" ] && grep -qE '^- \[x\] [1-9]' "$d/tasks.md"; then
        entered="$entered $d"
    fi
done
if [ -z "$entered" ]; then
    echo "the next rung's change exists and nobody has entered it: no task outside its section 0 is checked."
    exit 1
fi
echo "entered:$entered"
'''
ci_job = "milestone-m11d"
