# M11.d — Desktop: the exit criteria of M11's fourth rung, AFTER ITS SPIKE RESIZED IT.
#
# WHAT THIS RUNG IS FOR, AND WHAT IT IS NO LONGER FOR. `core-platform-abstraction` has SDL3 as its
# only implementation, so nothing has yet proved the abstraction carries no SDL assumption. Six of
# this rung's nine rows were last advanced at M0, M1 or M2, which makes it the rung carrying the
# OLDEST tiers in the record and the first to read them at Complete grade.
#
# IT NO LONGER CARRIES METAL OR D3D12. Its spike measured the two questions this rung was written
# against and the second answer resized it: this host is Linux, with no Apple toolchain, so neither
# backend can be compiled here, let alone judged. Sections 2 and 3 of tasks.md therefore MOVED — not
# deleted, not descoped — into **M11.d.5 · Backends**, a rung inserted between this one and M11.e,
# together with `golden-images-across-three-backends` so that rung cannot close on "it compiles
# somewhere". `delivery-roadmap`'s "A spike may resize a milestone as well as redirect it" is the
# rule; `openspec/changes/implement-m11d5-backends/` is the change; the marker below where the two
# backend criteria used to sit carries the full reasoning, and `rhi-and-render-graph`'s Complete cell
# moved with them.
#
# WHAT WAS VERIFIED ABSENT ON THE TREE THIS RUNG OPENED ON. SDL3 was the only `Platform` and the
# only `DisplayServer`. None of `just quality-requirements`, `just quality-docs`,
# `just quality-swift-format`, `just quality-licence` or `just quality-spelling` existed.
# `samples/11-ship` did not exist. Written in the past tense on purpose: this rung is being worked,
# the criteria below are the record of what had to be true, and a header that keeps asserting an
# absence its own rung is closing becomes false the day it succeeds.
#
# THE RUNG'S CENTRAL EVIDENCE QUESTION WAS ANSWERED BY ITS SPIKE AND NOT BY THIS FILE: whether a
# hosted macOS or Windows runner can present a graphics device at all. It can — a paravirtual Metal
# device with NO Apple GPU family, and a software D3D12 device on every Windows image — which is the
# evidence M11.d.5 is written against rather than this rung. Every claim below is still written to be
# reportable three ways — passed, failed, or NOT EVALUATED with a reason — and a criterion that would
# PASS on a runner with no device is the defect `where` exists to prevent.
#
# AN OWNERSHIP OVERLAP RECORDED RATHER THAN DECIDED. `developer-workflow-and-just`'s Complete cell is
# this rung's by the split's row allocation, and the four `release-*` recipes it depends on are
# M11.e's work by M11.e's own proposal. `release-recipes-stop-refusing` below is declared HERE
# because the row is here, and if the recipes are still refusing at this gate the row is demoted to
# M11.e with its reason rather than claimed over four recipes that refuse.

schema = 1
id = "m11d"
name = "Desktop"
artefact = "`samples/11-ship` built, cooked, packaged and launched on each desktop target from ONE recipe, plus the M0 sample and the M3 golden images running on a native platform backend with `src/core/`, `src/ecs/`, `src/servers/` and `src/scene/` untouched."

notes = [
    "`just roadmap-milestone m11d` is this recipe, so it cannot be one of the criteria it evaluates.",
    "THE STATIC GATES ARE SPELLED HERE EXACTLY AS THE OTHER RUNGS SPELL THEM, so they collapse to one check each across the ladder.",
    "THE TWO BACKENDS AND THE THREE-BACKEND IMAGE COMPARISON ARE M11.d.5's AND NOT THIS RUNG'S. See the section-2 marker below for why, and tools/roadmap/milestones/m11d5.toml for the criteria. This rung DOES still own the interface those backends will be written against — section 1 — because settling it here, on Vulkan and null, before either backend exists is the ordering the spike argued for and the insertion now enforces.",
    "THE NATIVE-PLATFORM CLAIM IS A DIFF CHECK AND NOT A TEST, and that is the point: the exit criterion is that replacing SDL3 on one desktop requires NO CHANGE in src/core/, src/ecs/, src/servers/ or src/scene/. A test cannot see that; a diff over the change that added the backend can, which is why `port-touches-no-engine-layer` reads the repository rather than running a suite.",
    "MSL AND DXIL ARE `shader-system`'s, WHICH IS M11.c's ROW. This rung's ledger checks that they exist because it cannot start without them, not because it owns them — M11.c's `shader-targets-for-the-next-rung` is the same claim from the other side, and the two are deliberately both present so the handover cannot be lost between rungs.",
    "tasks 9.x — the gate itself. A milestone cannot make passing its own gate one of the criteria that gate evaluates.",
    "`just quality-requirements` DOES NOT EXIST YET AND THE CRITERIA THAT CALL IT WILL SAY SO. `testing-and-quality` requires every requirement to map to a test, a gate or a recorded exemption, and the tool that checks it is one of that row's four absent gates — the row is M11.d's. It is named here rather than avoided because the mapping IS the Complete-grade claim these rows are being judged on: whichever rung reaches it first writes the tool, and M11.d is where it is finished. A criterion that names an absent recipe fails loudly with the recipe's name in it, which is the honest red.",
]

