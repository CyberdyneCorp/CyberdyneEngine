# --- Section 1: the eight interface gaps, settled before either backend is written -----------------
#
# The Metal seed's README records eight gaps and they are INTERFACE CHANGES before they are backends:
# an opaque memory-pool class the graph only compares for equality, layouts derived from the access
# masks `access.h` already carries, a queue-ownership capability query, a per-format support query, a
# pipeline-cache token, and a precondition on secondary recording. The seed exists to make that
# finding cheap; spending it is this rung's first task, and these two criteria are how it is spent.

[[criterion]]
id = "rhi-interface-gaps-settled"
describe = "the eight gaps the Metal seed recorded are closed in the INTERFACE, proved against Vulkan and the null backend before either new backend is written. A gap closed inside a backend is a gap the other two backends will rediscover"
source = "tasks 1, rhi-and-render-graph, src/backends/rhi-metal/README.md"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
binary="$d/cy_test_unit_rhi"
test -x "$binary" || { echo "no $binary — the suite unit.rhi does not exist"; exit 1; }
filter='an opaque memory pool*,queue ownership*,per-format support*,a pipeline cache token*'
out="$("$binary" "-tc=$filter" 2>&1)" || { echo "$out"; echo "the named case(s) FAILED"; exit 1; }
echo "$out" | tail -3
selected=$(printf '%s' "$out" | sed -nE 's/.*test cases: *([0-9]+) \|.*/\1/p' | head -1)
echo "the filter selected ${selected:-0} case(s) of the 4 it names"
test "${selected:-0}" -ge 4 || { echo "the named case(s) are not in unit.rhi any more — renamed, deleted, or the filter is stale"; exit 1; }
'''
ci_job = "milestone-m11d"

[[criterion]]
id = "null-backend-refuses-what-it-cannot-do"
describe = "the null backend refuses every capability it does not implement rather than silently succeeding. It is the cheapest place to discover an interface that cannot express a refusal, and this rung adds two backends that will each need to make one"
source = "tasks 1, rhi-and-render-graph"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
binary="$d/cy_test_unit_rhi"
test -x "$binary" || { echo "no $binary — the suite unit.rhi does not exist"; exit 1; }
filter='the null backend refuses*'
out="$("$binary" "-tc=$filter" 2>&1)" || { echo "$out"; echo "the named case(s) FAILED"; exit 1; }
echo "$out" | tail -3
selected=$(printf '%s' "$out" | sed -nE 's/.*test cases: *([0-9]+) \|.*/\1/p' | head -1)
echo "the filter selected ${selected:-0} case(s) of the 1 it names"
test "${selected:-0}" -ge 1 || { echo "the named case(s) are not in unit.rhi any more — renamed, deleted, or the filter is stale"; exit 1; }
'''
ci_job = "milestone-m11d"

# --- Section 2: THE TWO BACKENDS ARE NOT HERE ANY MORE ---------------------------------------------
#
# METAL AND D3D12 MOVED TO M11.d.5, A RUNG INSERTED BETWEEN THIS ONE AND M11.e. They are not deleted
# and they are not descoped. The reason is the machine rather than the plan: **Metal cannot be
# compiled on Linux, there is no Apple toolchain on this host, and D3D12 cannot be compiled on Linux
# either**, so neither backend could be written or judged where this rung is being worked.
# Half-building them here would have produced the defect this project has paid for nine times — a
# check that cannot fail — and `delivery-roadmap`'s "A spike may resize a milestone as well as
# redirect it" is the rule that permits moving them instead. The change that records it is
# `openspec/changes/implement-m11d5-backends/`; tools/roadmap/milestones/m11d5.toml carries the
# criteria, and design.md section 1.4.3 carries the measurement that argued for it.
#
# `golden-images-across-three-backends` WENT WITH THEM, and that is the half that matters. A rung
# that receives two backends and not the one criterion no single leg can answer is a rung that
# closes on "it compiles somewhere". `delivery-roadmap`'s "A criterion follows its subject" says so:
# leaving a criterion behind when its subject moves produces a check with nothing to check.
#
# WHAT STAYS HERE IS EVERYTHING THIS HOST CAN ACTUALLY CHECK, and it is most of the rung: the
# interface of section 1 above — settled before any backend exists, which is the ordering the spike
# argued for and which the split now enforces rather than requests — the prerequisite check below,
# the native platform backend of section 3, the core rows the port audits, the four absent quality
# gates, and `samples/11-ship` packaged and drawing.
#
# `shader-targets-emitted` STAYS AND IS NOT MOVED. It is a PREREQUISITE check rather than a backend
# claim — M11.c's row read from the rung that consumes it — and M11.d.5 inherits it from here, which
# is the flat ledger working as designed: the prerequisite is proved below the rung that needs it.

[[criterion]]
id = "shader-targets-emitted"
describe = "the shader system emits MSL and DXIL. `shader-system` is M11.c's row and this is the handover: `cache.h` names both as interchange forms, `compiler.h` describes the translation in a comment, `SLANG_ENABLE_DXIL` is OFF, and neither is emitted. This rung cannot start without them and checks so rather than discovering it"
source = "tasks 2, 3, shader-system, design.md §6"
kind = "command"
run = '''
set -eo pipefail
# THE TARGET NAME APPEARING IN THE OUTPUT IS NOT THE CLAIM, and was until M11.c delivered the
# recipe: `grep -i msl` matches the row of a table that reports metal-msl as UNAVAILABLE. The table
# is probed — each row is answered by compiling a shader for that target — and this reads the
# parseable line rather than the human one. M11.c's `shader-targets-for-the-next-rung` is the same
# claim from the other side and runs the full cross-target comparison; this rung checks the
# prerequisite it cannot start without.
just build-shaders --targets | tee /tmp/cy-m11d-targets.txt
grep -q "metal-msl=emitted" /tmp/cy-m11d-targets.txt
grep -q "d3d12-dxil=emitted" /tmp/cy-m11d-targets.txt
'''
ci_job = "milestone-m11d"

# --- Section 3: the native platform backend ----------------------------------------------------------

# THE SAME MUTATION AS `m11c:shader-targets-for-the-next-rung`, BECAUSE IT IS THE SAME CLAIM READ
# FROM THE RUNG THAT CONSUMES IT. This criterion asserts the prerequisite M11.d cannot start without
# — that this build emits MSL and DXIL — and what makes DXIL emittable is the shader model the DXIL
# case names. Take `profile_for(Target::Dxil)`'s profile away and the probe's real compilation fails,
# `cy_shaderc targets` answers `d3d12-dxil=unavailable`, and the second grep of this body fails. It
# still compiles: an empty last case of a switch falls out of it rather than into another case.
# M11.c's own criterion carries the argument for why this target and not `cmake/features.cmake`,
# which was measured unable to turn either of them red on an incremental rebuild.
[criterion.falsifies]
mutate = "delete-lines"
target = "src/backends/shader/slang/src/slang_compiler.cpp"
token  = "return \"sm_6_6\";"
note   = "this criterion had no derivable mutation at all — its body is two greps over a recipe's output, and `derive` refuses to guess one from that — so it declares this one. The subject is the emission rather than the word in the table: a stub that printed \"d3d12-dxil=emitted\" without compiling anything would survive a mutation of the output file and does not survive this."

[[criterion]]
id = "native-platform-backend"
describe = "a native `Platform` AND a native `DisplayServer` exist for one desktop platform, are neither SDL3's nor anything that predates this rung, and are compiled — so SDL3 is not the only way this engine opens a window. SDL3 was both since M0, and nothing had proved the abstraction carries no SDL assumption"
source = "tasks 4, core-platform-abstraction"
kind = "command"
run = '''
set -eo pipefail
# THIS CRITERION WAS REWRITTEN AT M11.d's CLOSE PHASE BECAUSE IT COULD NOT FAIL, and the rewrite is
# the one m11c:virtual-geometry-image records: ask for the subject BY NAME, and check the thing the
# describe actually claims. As first written it searched `src/` for `class .*DisplayServer`, and
# EVERY implementation of that interface in this repository lives under `platform/` — so the only
# file it ever matched was the ABSTRACT INTERFACE HEADER,
# src/core/platform/include/cy/core/platform/display_server.h, which contains no "sdl" and so
# answered "1 non-SDL implementation" on a tree with no native backend at all.
#
# THE BREAK TEST THAT CONDEMNED IT, run rather than argued: the old body, verbatim, against ebdf8d5 —
# the commit this rung opened on, when SDL3 genuinely WAS the only implementation and this
# criterion's own describe said so — prints "1 DisplayServer implementation(s) … of which non-SDL: 1"
# and EXITS 0. A check that is green on the state it exists to refuse is not a check.
# `just roadmap-falsify` had already classified it "no mutation": `class .*DisplayServer` is not a
# literal, so nothing could be renamed to turn it red either.
#
# WHAT IT ASKS NOW, and why each exclusion is there rather than convenient. The claim has three parts
# and this body has three parts:
#
#   BOTH interfaces          `core-platform-abstraction` says a port implements Platform AND
#                            DisplayServer. A window with no process services behind it is half a
#                            port, and the describe has always said "a native `Platform` and
#                            `DisplayServer`".
#   NEITHER headless NOR     both shipped before this rung — headless since M0, and counting either
#   the stub                 would make this criterion GREEN on the tree the rung opened on, which is
#                            the defect above committed in a new place. The stub is this rung's own
#                            work and it is a porting-surface proof, not a desktop: it is
#                            `m11d:porting-surface-against-a-stub`'s subject, and borrowing it here
#                            would let the native backend be deleted with this criterion still green.
#   AND IT IS COMPILED       platform/CMakeLists.txt must add the directory the implementation lives
#                            in. A backend nothing builds proves nothing about the abstraction, and a
#                            header alone would satisfy a search.
#
# MEASURED, both ways, at the close: GREEN on this tree (linux-native, one DisplayServer and one
# Platform, built by platform/CMakeLists.txt) and RED at ebdf8d5 with the message below — which is
# the difference this criterion exists to detect, and the one the old body could not see.
servers=$(grep -rl ": public DisplayServer" \
    --include='*.h' --include='*.cpp' --include='*.mm' platform/ src/ | sort || true)
platforms=$(grep -rl ": public Platform" \
    --include='*.h' --include='*.cpp' --include='*.mm' platform/ src/ | sort || true)
echo "DisplayServer implementations:"
printf '%s\n' "${servers:-  none}"
echo "Platform implementations:"
printf '%s\n' "${platforms:-  none}"

# Filtered on the PATH rather than on the class name, because the directory a backend lives in is
# what the build adds and what a reader looks for: platform/desktop-sdl3/, platform/headless/,
# platform/stub/. A native port for a second desktop is a directory beside them and needs no change
# here.
ported_servers=$(printf '%s\n' "$servers" | grep -vi sdl | grep -vi headless | grep -vi stub || true)
ported_platforms=$(printf '%s\n' "$platforms" | grep -vi sdl | grep -vi stub || true)
server_count=$(printf '%s\n' "$ported_servers" | grep -c . || true)
platform_count=$(printf '%s\n' "$ported_platforms" | grep -c . || true)
echo "  neither SDL3's, nor headless's, nor the stub's: ${server_count} DisplayServer(s), ${platform_count} Platform(s)"

test "$server_count" -ge 1 && test "$platform_count" -ge 1 || {
    echo "SDL3 is still the only desktop implementation of these two interfaces. The headless display"
    echo "  server and the stub platform are both excluded on purpose — headless predates this rung"
    echo "  and the stub is the porting-surface proof, so neither can stand for the second"
    echo "  implementation this criterion is about. Nothing has proved the abstraction carries no SDL"
    echo "  assumption, because nothing has implemented it twice."
    exit 1
}

wired=0
for file in $ported_servers; do
    directory="${file#platform/}"
    directory="${directory%%/*}"
    if grep -q "add_subdirectory(${directory})" platform/CMakeLists.txt; then
        echo "  and platform/CMakeLists.txt builds ${directory}/"
        wired=1
    fi
done
test "$wired" -eq 1 || {
    echo "the second implementation is in the tree and platform/CMakeLists.txt adds no directory that"
    echo "  holds it: a backend nothing compiles proves nothing about the abstraction."
    exit 1
}
'''
ci_job = "milestone-m11d"

[[criterion]]
id = "port-touches-no-engine-layer"
describe = "and adding it required NO CHANGE in `src/core/`, `src/ecs/`, `src/servers/` or `src/scene/`. This is the exit criterion in ROADMAP.md's own words, it is a property of the DIFF rather than of a test, and it is the only evidence that distinguishes an abstraction from a wrapper"
source = "tasks 4, ROADMAP M11.d exit criteria, core-platform-abstraction"
kind = "command"
run = '''
set -eo pipefail
python3 - <<'CHECK'
import subprocess, sys
marker = "native-platform-backend"
log = subprocess.run(["git", "log", "--format=%H %s", "-40"], capture_output=True, text=True).stdout
commits = [line.split(" ", 1)[0] for line in log.splitlines() if marker in line.lower()]
if not commits:
    print(f"no commit naming '{marker}' in the last 40 — the native backend has not landed,")
    print("  so the claim that it touched no engine layer cannot be evaluated and is not passed")
    sys.exit(1)
forbidden = ("src/core/", "src/ecs/", "src/servers/", "src/scene/")
bad = []
for commit in commits:
    files = subprocess.run(["git", "show", "--name-only", "--format=", commit],
                           capture_output=True, text=True).stdout.split()
    bad += [f"{commit[:9]} {name}" for name in files if name.startswith(forbidden)]
for entry in bad:
    print(f"  {entry}")
print(f"{len(bad)} engine-layer file(s) changed by the native platform backend")
sys.exit(1 if bad else 0)
CHECK
'''
ci_job = "milestone-m11d"

[[criterion]]
id = "porting-surface-against-a-stub"
describe = "the porting surface builds against a stub platform that shares no desktop assumption. A porting surface only ever exercised by desktops is a desktop interface, and M11.e proves the same surface against a real non-desktop one"
source = "tasks 4, ROADMAP M11.d exit criteria, build-system-and-platforms"
kind = "command"
run = "just build-engine --platform stub"
timeout_s = 3600
ci_job = "milestone-m11d"

[[criterion]]
id = "native-backend-runs-the-m0-sample"
describe = "the M0 sample RUNS on the native backend: it opens a real window through the native `DisplayServer`, ticks the runtime for a stated number of frames, writes its trace under the path the native `Platform` answered, and exits clean — and the display it reports is the native one rather than SDL3's. This is the cheapest possible proof that the window, the event loop and the runtime all came up on an implementation SDL never touched"
source = "tasks 4.3, ROADMAP M11.d exit criteria"
kind = "command"
run = '''
set -eo pipefail
# THIS CRITERION WAS REWRITTEN AT M11.d's CLOSE PHASE BECAUSE NEITHER HALF OF IT MEASURED ANYTHING.
# It read:
#
#   just run-sample 00-empty --platform native && just test-render m3 --platform native --compare-golden
#
# THE FIRST HALF NEVER TERMINATED AND ASSERTED NOTHING. `samples/00-empty` with no `--frames` runs
# "until the window is closed or the process is interrupted" (main.cpp, Options::frames), so on a
# machine with a display this half hangs until the ledger's own timeout kills it; and had it
# returned, an exit code is all it looked at — the same exit code an SDL3 run gives, and the same
# one a build with no native backend at all gives if anything ever fell back.
#
# THE SECOND HALF DISCARDED ITS OWN FLAG, TWICE OVER. `just test-render` is `_ctest render`
# (just/test.just:30), and `_ctest` PARSES `--platform` OUT AND THROWS IT AWAY for a port name —
# `case "${platform[1]:-}" in stub|native) platform=() ;;` — after which ctest silently drops the
# positional arguments it does not recognise. MEASURED at the close against three configured build
# trees (build/dev, build/m11c-final, build/m11d-core): `ctest -L render -N m3 --compare-golden`,
# the same with `zzzz-no-such-thing`, and NO ARGUMENTS AT ALL each select THE SAME 20 render tests.
# So its verdict was "the whole render label is green", and `--no-tests=ignore` — which `_ctest`
# passes for this label — would have made an EMPTY selection green too. `requires = "display"` did
# not save it: this host has one, so the criterion was evaluated and passed vacuously.
#
# AND THE GOLDEN CLAIM CANNOT BE SATISFIED AS IT WAS WRITTEN, WHICH IS A FINDING ABOUT THE CRITERION
# RATHER THAN ABOUT THE BACKEND. `tests/render/` links no platform target and constructs no
# `DisplayServer` at all: the goldens render offscreen through Vulkan into a readback buffer, so NO
# platform backend can change one texel of them and "the M3 golden images on the native backend"
# names nothing that exists. That is task 4.3's second bullet, and rewriting this criterion is where
# it lands. The M3 images are not thereby unasserted — `m3:golden` asks for `render.golden` BY NAME,
# refuses a selection that matched nothing, and compares against committed references, and
# `m11d5:golden-images-across-three-backends` carries the cross-backend claim. What a platform
# backend CAN be held to about a picture is that a frame reaches a window it opened, which is what
# `m11d:ship-sample-on-desktop` and `m11d:ship-sample-drawn` photograph.
#
# WHAT IS ASKED HERE, then, is the half that is about this backend, and every line of it is an
# observation of the run rather than of its exit code: the display server the sample REPORTS is not
# SDL3's, not the headless one and not the stub's; the window id is not `kInvalidWindow`; the trace
# went to an absolute path the native `Platform` answered and has bytes in it; and the loop ran the
# frames it was asked for and stopped because it reached them.
#
# (`empty` below rather than `00-empty`: `00-empty` is the DIRECTORY and `cy_sample_empty` is the
# binary samples/00-empty/CMakeLists.txt declares. `just run-sample` strips a leading number and
# resolves either spelling, but `tools/roadmap/falsify.py` refuses the directory spelling before it
# will run a criterion at all — that is its `absent-sample` rule, written after M11.a recorded two
# criteria as "red against a built tree" over an exit 2 from `run-sample: no sample '10-world'`. A
# criterion that cannot run is indistinguishable by exit code from one that ran and failed, so this
# one uses the name the build declares.)
frames=120

native=$(just run-sample empty --platform native --frames "${frames}" 2>&1) || {
    printf '%s\n' "${native}"
    echo "the M0 sample did not reach a clean exit on the native backend"
    exit 1
}
line=$(printf '%s\n' "${native}" | grep -m1 '^00-empty: display=' || true)
test -n "${line}" || {
    printf '%s\n' "${native}"
    echo "the sample printed no 'display=' line: it never got as far as a window"
    exit 1
}
echo "  ${line}"

server=$(printf '%s' "${line}" | sed -nE 's/^00-empty: display=([^ ]*) .*/\1/p')
window=$(printf '%s' "${line}" | sed -nE 's/.* window=([0-9]+) .*/\1/p')
trace=$(printf '%s' "${line}" | sed -nE 's/.* trace=(.*)$/\1/p')

# THE NAMES ARE THE THREE THIS RUNG DID NOT WRITE, not the one it did: a criterion that required the
# string "linux-x11" would have to be edited the day a second native port lands, and editing a
# criterion to admit a new implementation is how a check comes to be about its author's tree.
case "${server}" in
    ""|desktop-sdl3|headless|stub)
        echo "the sample was asked for the native backend and reports display='${server}'."
        echo "  A run that fell back to SDL3 — or to the headless server, or to the stub — is not a"
        echo "  native backend running the sample, and it is the outcome this criterion exists to"
        echo "  tell apart from success. The display server names itself (DisplayServer::name())."
        exit 1
        ;;
esac

test "${window:-0}" -ge 1 || {
    echo "the native display server reported window=${window:-<none>}, which is cy::kInvalidWindow:"
    echo "  the backend came up and no window was opened."
    exit 1
}

case "${trace}" in
    /*) ;;
    *)  echo "the trace went to '${trace}', which is not an absolute path. The sample falls back to"
        echo "  a bare '00-empty.cytrace' in the working directory when the platform cannot answer"
        echo "  its user data directory (main.cpp, resolve_trace_path), so a relative path here is"
        echo "  the native Platform failing to answer rather than the runtime choosing to write"
        echo "  where it was told."
        exit 1
        ;;
esac
test -s "${trace}" || {
    echo "no bytes at ${trace}: the runtime opened a trace on the native platform's own path and"
    echo "  nothing was written to it."
    exit 1
}

printf '%s\n' "${native}" | grep -qE "^00-empty: ${frames} frames, [0-9]+ simulation ticks, exit 0 \(frame limit\)$" || {
    printf '%s\n' "${native}" | grep -E "^00-empty:" || true
    echo "the loop did not run ${frames} frames and stop because it reached them. A window that"
    echo "  closed early, an interrupt, or a frame count that is not the one asked for are all"
    echo "  states in which the event loop did not do what this criterion claims it did."
    exit 1
}

# THE NEGATIVE CONTROL, and the reason it is here: every assertion above reads a string the sample
# printed, and a sample that printed the same string whatever it was asked for would satisfy all of
# them. So the SAME binary is asked for SDL3 and must report SDL3 — which is what makes 'the display
# it reported is not desktop-sdl3' evidence about which implementation ran rather than about what
# this file greps for. It also re-states task 4.5: SDL3 is not deleted, it is no longer alone.
control=$(just run-sample empty --platform sdl3 --frames 4 2>&1) || {
    printf '%s\n' "${control}"
    echo "the M0 sample no longer runs on SDL3, which is the control this criterion reads the native"
    echo "  run against — and a regression in its own right: the second implementation is a proof,"
    echo "  not a replacement (task 4.5)"
    exit 1
}
control_server=$(printf '%s\n' "${control}" | sed -nE 's/^00-empty: display=([^ ]*) .*/\1/p' | head -1)
echo "  control: the same binary asked for sdl3 reports display=${control_server:-<none>}"
test "${control_server}" = "desktop-sdl3" || {
    echo "asked for SDL3, the sample reports display='${control_server}' rather than desktop-sdl3:"
    echo "  the reported name does not track the backend that was selected, so it is not evidence"
    echo "  about which implementation ran and nothing above can be believed."
    exit 1
}
'''
requires = "display"
timeout_s = 3600
reason = "a native DisplayServer needs a display to open a window, and this criterion's whole subject is a window that opened. `port-touches-no-engine-layer`, `native-platform-backend` and `porting-surface-against-a-stub` carry the structural half of the claim on every machine, and `smoke.empty_sample` runs the same sample headless everywhere"
ci_job = "milestone-m11d"

# THE MUTATION TAKES THE NATIVE BACKEND OUT OF THE SAMPLE'S BUILD, WHICH IS THE CLAIM ITSELF, and it
# is a mutation this tree COMPILES: `CY_SAMPLE_LINUX_NATIVE` is what guards the sample's include of
# the native pair, its two members, and both arms of its switch, so without the definition the
# sample builds exactly as it did before M11.d and answers `--platform native` with "this build has
# no native platform backend". The alternative — breaking the X11 backend itself — was rejected for
# the reason platform/linux-native/src/x11_display_server.cpp was in flight under a peer at the time
# this was written; the mutation a prover applies to the WORKING TREE must not land in a file
# somebody else is editing.
[criterion.falsifies]
mutate = "delete-lines"
target = "samples/00-empty/CMakeLists.txt"
token  = "list(APPEND cy_sample_empty_definitions CY_SAMPLE_LINUX_NATIVE=1)"
note   = "measured against build/m11d-crit. UNMUTATED the sample answers `display=linux-x11 window=1 trace=/home/leonardo/.local/share/CyberdyneEngine/CyberdyneEngine/00-empty.cytrace` and `120 frames, 121 simulation ticks, exit 0 (frame limit)`, and the control answers `display=desktop-sdl3`; the tick count is matched as `[0-9]+` rather than asserted, because it follows the wall clock while the FRAME count is the one the loop was asked for. WITH THE DEFINITION GONE and the tree rebuilt over it, the sample's own #else answers `--platform native` with \"this build has no native platform backend\" and the run exits 1 at the first assertion here — which is exactly the claim: no native backend ran the sample, and the criterion says so instead of reading an exit code that an SDL3 run would have given identically."

# --- Section 4: the gates, the quality rows, and the oldest tiers in the record ----------------------

[[criterion]]
id = "documentation-gate"
describe = "the documentation gate passes: every public API documented, every recipe described. It is one of `testing-and-quality`'s four absent gates — with swift-format, the licence-header check and the spelling check — and the row has been recorded at Seed since M0 while its column claimed Working since M3"
source = "tasks, testing-and-quality, ROADMAP M11.d exit criteria"
kind = "recipe"
run = "just quality-docs"
ci_job = "milestone-m11d"

[[criterion]]
id = "full-gate-set"
describe = "the rest of `testing-and-quality`'s absent gates: swift-format, the licence-header check and the spelling check. THIS IS ONE HALF OF WHAT `m9:record-matches-plan-history` IS ABOUT — the row's Working tier has been claimed by a column and evaluated by no criterion in any ledger, and this is the first criterion in the project that runs something for it"
source = "tasks, testing-and-quality, m9:record-matches-plan-history"
kind = "command"
run = "just quality-swift-format && just quality-licence && just quality-spelling"
ci_job = "milestone-m11d"

[[criterion]]
id = "developer-workflow-recipes"
describe = "every category of the required recipe surface does something, and no recipe refuses naming a milestone that is not on the ladder. THE OTHER HALF OF `record-matches-plan-history` THIS RUNG OWNS: `developer-workflow-and-just` is recorded at Seed with its column claiming Working since M6, and four recipes in `just/release.just` refuse naming 'M12 — build-and-packaging', a milestone that does not exist on a ladder whose `record.MILESTONES` ends at m11e"
source = "tasks, developer-workflow-and-just, m9:record-matches-plan-history"
kind = "command"
run = '''
set -eo pipefail
python3 - <<'CHECK'
import pathlib, re, sys
sys.path.insert(0, "tools/roadmap")
import record as record_module
ladder = set(record_module.MILESTONES)
stale = []
for path in sorted(pathlib.Path("just").glob("*.just")):
    for number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
        for name in re.findall(r"\bM(\d+(?:\.5|\.[a-e])?)\b", line):
            identifier = f"m{name}".replace(".5", "b").replace(".", "")
            if identifier not in ladder and ("refus" in line.lower() or "not yet" in line.lower()
                                             or "—" in line):
                stale.append(f"{path.name}:{number}: names M{name}, which is not on the ladder")
for entry in stale:
    print(f"  {entry}")
print(f"{len(stale)} recipe line(s) refuse naming a milestone the ladder does not carry")
sys.exit(1 if stale else 0)
CHECK
'''
ci_job = "milestone-m11d"

