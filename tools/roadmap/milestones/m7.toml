# M7 — Fidelity: the exit criteria, as data.
#
# The sources are openspec/changes/implement-m7-fidelity/tasks.md and the M7 row of docs/ROADMAP.md;
# every criterion below names which. `delivery-roadmap` requires each to be a recipe that exits
# zero, a command that exits zero, a benchmark within a threshold, or a committed artefact that is
# regenerated and compared — so an intention that cannot be run is a note at the bottom of this
# file, not a criterion.
#
# --- THIS LEDGER DECLARES ONLY M7's OWN CRITERIA, AND THERE IS NO `m6-green` ----------------------
#
# The ledger has been flat since M5 and `just roadmap-test` fails a ledger that invokes another one.
# `just roadmap-milestone m7` evaluates the permanent set directly — the criteria of every milestone
# whose `class = "milestone"` gate carries `state = "green"` and which sits BELOW M7 on the ladder,
# merged and deduplicated, each distinct check run exactly once — and then the criteria in this
# file. `criteria.build_plan` is the rule and tools/roadmap/README.md states it.
#
# A criterion here whose `run` string is identical to one an earlier ledger declared COLLAPSES into
# it and is reported under the earlier label — `m0:format` rather than `m7:format`. The static gates
# are declared anyway, as every ledger since M3 has, because a ledger that does not name the checks
# its milestone had to satisfy is a ledger nobody can read. `residency-cost` and `viewport` below
# are deliberately spelled with the identical string an earlier ledger used, for the same reason.
#
# --- EVERY COMMAND IN THIS FILE WAS RUN, EXACTLY AS WRITTEN -----------------------------------------
#
# M6's closing gate found FOUR criteria in m6.toml that had never executed anything: they were
# written as `just test-integration -R "world_(activation|streaming)"`, `just`'s `*args` is a string
# interpolated textually into `bash -c`, and the parentheses reached bash unquoted. Each reported
# `FAILED exit 2` in 0.0 s having run no test, and the same three commands sat in ci.yml.
#
# So: no argument in this file contains a shell metacharacter. Every `-R` pattern is one plain word,
# several suites are joined with `&&` rather than with an alternation, and every command below was
# executed on this machine and its output pasted into the closing report. That defect in
# `just/test.just` is still live and is still M7's to fix — `test-unit`, `test-integration`,
# `test-smoke`, `test-render` and `_ctest` all pass `{{args}}` and `${rest}` through unquoted word
# splitting — and it is recorded rather than worked around here for the second milestone running.
#
# --- WHY SO MANY CRITERIA NAME `milestone-m7` AS THEIR CI JOB ---------------------------------------
#
# M6 declared seven new PERMANENT gates and landed a `.github/workflows/ci.yml` job for each in the
# same change, because `just ci-check` fails when a permanent gate is run by no job. M7 declares
# ONE new gate — `milestone-m7`, at `joins-on-close` — and points its own suites at it rather than
# inventing eight more permanent gates whose jobs belong to a file this change's section 12.4 owns.
#
# The consequence is stated rather than hidden: until `milestone-m7` flips to green, the criteria
# below whose `ci_job` is `milestone-m7` are run by `just roadmap-milestone m7` and by nothing in
# continuous integration. The moment it flips they join the permanent set entire, and ci.yml's
# `milestone` job — moved from `m5b` to the newest closed milestone in the same commit, which is
# task 12.4 — runs all of them. Where an existing permanent gate's own `runs` list demonstrably
# covers a criterion it is named instead, and eleven of them are: `render-frame` runs
# `just test-unit -R render_` and `just test-unit -R material`, `render-device` runs
# `just test-render`, `shader-pipeline`, `residency`, `editor-window`, `build-and-test`, `profiles`
# and the six static gates cover the rest.
#
# --- WHAT M7 ADDS TO THE PERMANENT SET, AND WHAT IT COSTS -------------------------------------------
#
# FORTY-ONE own criteria, of which twenty-seven run suites the milestone's fourteen new directories
# brought with them — src/rendering/{material,virtual_geometry,shadows,temporal,post,gi,denoise,
# raytracing,arbiter,sky,lighting,gpu_culling,virtual_texturing}, src/backends/rhi-metal and
# samples/07-fidelity. THREE carry `requires = "gpu"` and one `requires = "display"`, and each is
# reported NOT EVALUATED on a machine without one rather than passed, which is the honest half of a
# milestone whose subject is a frame. The two counts in this paragraph are prose and are checked by
# nothing, so `just roadmap-milestone m7 --list` is the arithmetic if you add a criterion.
#
# --- THE ARTEFACT, AND WHY IT IS THREE CRITERIA RATHER THAN ONE -------------------------------------
#
# `samples/07-fidelity` is one program and one driver, and the three ways of reaching it answer
# different questions — the same split m6.toml made. `fidelity-artefact` is the CTest entry, so
# `just test-all` runs it and the `build-and-test` gate covers it on every pull request.
# `fidelity-recipe` runs it through the workflow a contributor actually types, at full detail and
# 48 device frames rather than the half-detail 24-frame set the smoke entry cooks — both do four
# whole runs, because the headline is a median over runs either way. `screenshot-fidelity` is the
# committed picture, which is what makes the milestone evaluable by LOOKING.

schema = 1
id = "m7"
name = "Fidelity"
artefact = "samples/07-fidelity — a film-detail interior and exterior of 4.5 million source triangles across 186 instances of five shells, every one cooked through virtual geometry's builder and passed by the crack-free check the cook is required to run, put on the device through the cluster traversal and the visibility buffer, lit by the illumination system's software tier with indirect diffuse and reflections that carry colour, and then held to a 13.90 ms frame budget by the shipped budget arbiter and seven subsystem controllers under a scripted load spike swept over nine magnitudes — none of which oscillates, all of which return to authored quality, and whose geometry allocation is the frame the device itself measured"

# Non-binding, because none can be settled by running something. `delivery-roadmap` requires a
# criterion that cannot be evaluated by a machine to be restated as a check or moved here.
notes = [
    "`just roadmap-milestone m7` is this recipe, so it cannot be one of the criteria it evaluates.",
    "tasks 12.4 — moving ci.yml's `milestone` job from `m5b` to the newest closed milestone is checked by `workflows` below (`just ci-check`), which goes red the moment `milestone-m6` or `milestone-m7` is green above the newest ledger any workflow evaluates. It is a check, but it is the closing change's edit to make and not this file's.",
    "tasks 12.5 — docs/roadmap/status.yaml, docs/roadmap/capability-matrix.md and docs/ROADMAP.md are the closing change's. `roadmap-tiers` below checks the record, `roadmap-record` checks that the record and openspec/specs/ agree, and `plan-consistency` — new at M7 — checks that the four plan documents agree with each other and that the tier plan obeys its own dependency rules. No tool can tell an intention from its correction.",
    "tasks 12.8 — opening the M8 change is `m8-open` below, which asks only that the change exists. Whether its named spike is the right one is a judgement.",
    "tasks 13.x — the gate itself. A milestone cannot make passing its own gate one of the criteria that gate evaluates.",
    "THE HARDWARE RAY-TRACING TIER IS NOT EXERCISED BY ANY CRITERION HERE, AND THE REASON IS NOT THE MACHINE. The RTX 5060 this was built on has VK_KHR_ray_query; the engine's Vulkan backend sets fourteen capabilities and RayTracing is not among them, so `rt::AccelerationService` reports Unsupported and the SOFTWARE tier is the default path. `raytracing` and `gi-fallback` below therefore measure the software tier against a CPU-executed reference rather than against a device. That is why `rendering-global-illumination` is Working at M7 and Complete at M10, and closing the gap is `cy::rhi`'s work.",
    "THE ARTEFACT'S FRAME TIME IS SUBMIT-TO-IDLE ON A SERIALISED FRAME, not a device timestamp: `rendering::ExecutionResult` carries no timestamps, so nothing finer is available through the graph. samples/07-fidelity/frame.h names it where it is measured and samples/07-fidelity/README.md separates every measured figure from every modelled one. Timing a frame with the device's own query pool is a change to `cy::rendering::GraphExecutor`.",
    "THE CRACK-FREE HIERARCHY HOLDS TO ABOUT TEN LEVELS ON THE ARTEFACT'S CONTENT AND STARTS FAILING ABOVE IT. At `--detail 1.4` — 53,868 triangles a shell, eleven to fourteen levels — two of the five shells report boundary mismatches and open cuts; at the default and at half detail all five are clean at all 120 thresholds. The artefact records a GAP and exits non-zero when any asset fails, so this is reproducible rather than described. samples/07-fidelity/README.md carries the table, and it is `src/rendering/virtual_geometry/`'s to close.",
]

