# The M7 row of docs/ROADMAP.md, as data. An exit tier is a FLOOR rather than an equality: a later
# milestone advancing one of these past its M7 level must not make this recipe fail.
#
# --- THE NINE COMPLETES WERE CLAIMS. FOUR WERE EARNED AND FIVE WERE NOT -------------------------
#
# M5's ledger amended four rows at its own gate, M5.5's inherited the practice and M6's demoted five.
# M7's gate checked each of the nine against the code. Four are recorded Complete and five are
# recorded Working; the table below is the record, and each line is the reason with the thing that
# shows it.
#
# EARNED:
#
#   residency  complete. The policy gained the one field its own spike said it needed —
#       `LeverSchedule::relative_cost` — and it now has two claimants in shipped code fed by real
#       frame feedback: `FrameResidency::register_subsystems` registers Texture and Geometry, and
#       src/rendering/virtual_geometry/src/residency.cpp declares the second policy.
#
#   virtual-texturing  complete. The device side arrived: a feedback buffer written by a shader and
#       a page table sampled by one, with `bytes_read` making "no per-pixel stream reaches the CPU" a
#       measurement. What is thinner: the device-side page table is the FLAT form and `create()`
#       refuses a pyramid above 65,536 entries rather than pretending.
#
#   rendering-materials-and-shading  complete. The material compiler produces the `MaterialProgram`
#       parameter layout the M3 module already defined, and one cook key covers the compiler
#       version, the IR version, the module digest, the profile and every emitted program — the same
#       key under clang++ -O0+ASan, clang++ -O2, g++ -O0 and g++ -O2.
#
# NOT EARNED, AND THE C CELL MOVED TO M8:
#
#   rendering-architecture  WORKING, and this is the demotion that will surprise a reader, because
#       the budget arbiter is the best-certified thing in the milestone: 71 step magnitudes, none
#       oscillating, none settling over budget, beside a negative control that oscillates 252 times
#       in 450 frames when every controller runs its own copy of the decision. What is missing is a
#       renderer that uses it. From build.ninja: `libcy_rendering_arbiter.a` is linked by
#       `cy_test_unit_render_arbiter`, `cy_test_integration_render_arbiter_sweep` and
#       `samples/07-fidelity/cy_sample_fidelity`, and by nothing else in the tree. The seven
#       `SubsystemController`s exist only inside `samples/07-fidelity/spike.cpp`, over a hard-coded
#       cost table (`kRows`), with exactly one of the seven costs substituted from the device. So
#       "Subsystem controllers SHALL hold their own allocation using their own levers … and SHALL
#       report their measured cost to the arbiter" has no instance anywhere under `src/`. This is
#       the same bar M7's own proposal applied to M6 — "linked by nothing but their own test
#       binaries — not by the renderer, and not by M6's own artefact" — and applying a weaker one to
#       M7's headline capability than M7 applied to M6's is the drift a gate exists to stop.
#
#   rendering-culling-and-lod  WORKING. The dispatch computes what M6's CPU reference computes and
#       is compared against it, which is real and is what section 5 was for. But "Occlusion culling"
#       is a requirement of its own and `GpuCullPass::upload` REFUSES `kGpuCullOcclusion` with
#       NotImplemented — "no hierarchical depth buffer exists on the device yet" — so no frame in
#       this engine occlusion-culls. `Hzb` and `TwoPassCull` are a CPU model, tested as one. The
#       requirement's "the HZB SHALL additionally serve cluster-granular occlusion for virtual
#       geometry" has no implementation at all.
#
#   shader-system  WORKING. "Visual material editor" requires a node-graph material editor in the
#       editor which is a front-end onto the material compiler. The compiler is here and
#       `cy_material compile` prints every lowering stage; the editor has no material graph panel —
#       its graph dock says visual scripting arrives at M8.
#
#   core-assets-and-io  WORKING. `StreamingSystem` closes the "Streaming" requirement M6 planned and
#       did not touch. Two other requirements are open: "Hot reload" names cooked outputs and
#       `AssetSystem::reload` (asset_system.cpp:1182) returns NotImplemented for an asset served
#       from a package, and the "Development file serving" scenario has no implementation —
#       `RemoteFileProvider` is an interface with no transport.
#
#   core-memory-and-containers  WORKING. `MemoryAttributionScope` adds the world-cell and asset
#       axes and `report_attribution` groups by any of them. NOTHING PUSHES ONE: the symbol does not
#       appear anywhere outside src/core/memory/. The scenario "attribution answers a question" is
#       therefore answerable only by a test that pushes the scope itself, and in a running engine
#       every axis but `thread` reports `unattributed_bytes`. The mechanism is real and has no
#       producer.
#
#   editor-viewport-and-gizmos  WORKING, and this is the row that moved furthest without arriving.
#       The engine's own renderer fills the viewport over a dma-buf with no copy through the CPU,
#       the engine generates the gizmo geometry, a drag lands on a published handle, and undo
#       restores the value exactly — photographed in build/<tree>/editor-window/shots/. Task 5b.2 is
#       not done: `.cyworld` is still read and written by nothing under src/ or tools/, and
#       samples/05b-editor-window/runtime/session.h says in its own header that the runtime
#       associates the editor's identities with its own scene objects in first-seen order and that
#       this "is a stand-in for a shared world and it is named as one". So "what you see is what
#       ships" does not hold — three entities created in the editor during the artefact changed
#       nothing in the rendered image — and "Selection and picking", which is engine-side picking,
#       is unexercised: the artefact's own counter reads `pick 0`.
#
# WHAT IS NOT ADVANCED. `rendering-geometry-and-resources` stays where M6's gate put it — Complete at
# M8, because "Skinning" requires bone matrices read from the GPU pose world and
# `SkinningDescriptor::validate()` still refuses `PoseSource::GpuPoseWorld` with `NotImplemented`
# naming M8. M7 did not invent a second pose upload to get around it, which is the failure that
# requirement exists to prevent.
