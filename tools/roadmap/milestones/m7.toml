# --- WHAT THIS LEDGER DOES NOT RUN, AND WHY ---------------------------------------------------------
#
# `delivery-roadmap` allows a criterion to be a recipe, a command, a benchmark against a threshold or
# a committed artefact regenerated and compared — and nothing else. An intention that cannot be run
# is recorded here rather than written as a criterion, because a criterion that executes nothing is
# the exact defect M6's gate found four of.
#
# 1. **"The Metal seed renders the M3 golden scene"** — the M7 row's last exit criterion. It needs an
#    Apple GPU, and this project's continuous integration has no macOS runner with one; the seed
#    itself is `src/backends/rhi-metal/`, its findings are the `metal-seed` criterion above, and
#    that module's README says of the one file which would draw the scene — `src/device.mm` —
#    "Nothing in that file has been compiled or run. Treat every line of it as a proposal." Two of
#    the eight gaps have no workaround and should be closed before M11.
#
# 2. **Windows and macOS.** `three-platforms` above carries `where = "ci"` for the same reason it has
#    since M1: this host runs one operating system. Everything M7 added is Linux-verified only.
#
# 3. **A presented swapchain in the artefact.** `samples/07-fidelity` times *submit to idle* on a
#    serialised frame, because `ExecutionResult` carries no timestamps and the sample has no window.
#    Timing a frame with the device's own query pool is a change to `cy::rendering::GraphExecutor`
#    rather than to the sample, and the sample's README says so where the figure is printed.
