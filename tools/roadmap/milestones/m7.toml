# --- The material compiler ------------------------------------------------------------------------

# SECTION 6, AND THE MILESTONE'S FIRST NAMED SPIKE. design.md §1.2's seven decisions are properties
# of the IR and of nothing above it, and the suite is where they are held: identity is a content hash
# over the DAG, the symbol NAME rather than its table index (because `cy::Name`'s ordering is
# interning order and is not stable across runs), commutative operands canonically ordered by that
# same hash, and provenance in a SIDE TABLE because CSE merges two authoring nodes into one value.
[[criterion]]
id = "material-compiler"
describe = "a graph and a hand-written material compile to the SAME program, proven by the round trip and by the two front-ends being different before the compiler runs; every one of the nine pass switches is load-bearing, asserted as a table on every build; and a node preview is the final program with a different root. BOTH SUITES, because the compiler's cases live in two of them: M7's closing gate moved the ones that build the twelve-program family repeatedly into `integration.material_lowering` — 1.23 to 2.26 ms of CPU each in the Debug configuration against a 1 ms unit budget, so `unit.material_compiler` was green in dev and red in Debug — and a criterion that had kept naming only the unit suite would have stopped covering closure lowering, the pass table and binning on the day they moved"
source = "tasks 6.1, 6.2, 6.4, 13.2, ROADMAP M7 (The material compiler's IR round-trips; Node previews use the real compiler)"
kind = "command"
run = "just test-unit -R unit.material_compiler && just test-integration -R material_lowering"
ci_job = "render-frame"

[[criterion]]
id = "material-cook"
describe = "the cook: one digest over the compiler version, the IR version, the module digest, the profile and every emitted program, and a bundle carrying no timestamp, no path and no allocator address — which is what makes two cold cooks byte-identical"
source = "tasks 6.3"
kind = "recipe"
run = "just test-integration -R material_cook"
ci_job = "milestone-m7"

[[criterion]]
id = "materials-shading"
describe = "`rendering-materials-and-shading` to Complete: the GPU material table the compiler fills is the one M3 defined, and the image-based lighting path it feeds is unchanged"
source = "tasks 6.2, 6.3, ROADMAP M7"
kind = "command"
run = "just test-unit -R unit.material && just test-integration -R material_ibl"
ci_job = "milestone-m7"

# --- Virtual geometry -------------------------------------------------------------------------------

# SECTION 7. The crack-free rule is TWO NUMBERS PER CLUSTER and both are properties of a GROUP: a
# cluster is selected iff `screen_error(lod) <= t < screen_error(parent)`. The builder enforces a
# parent error strictly above its children's and a parent sphere containing theirs, and
# `check_watertight` asserts both — which is the check the requirement says runs when an asset is
# COOKED rather than when it is tested.
[[criterion]]
id = "virtual-geometry"
describe = "clusters, the crack-free hierarchy and its two invariants, geometric error, the page format and its quantisation, the always-resident root, and the CPU traversal the dispatch is compared against"
source = "tasks 7.1, 7.2, 7.3, ROADMAP M7"
kind = "recipe"
run = "just test-unit -R unit.virtual_geometry"
ci_job = "milestone-m7"

