describe = "one place in the renderer where a frame time may be accepted; a subsystem that declares a PRICED ladder rather than a number of milliseconds; tightening local and relaxing arbitrated; and the four mechanisms — the filter, the dwell, the period and the deadband — no one of which is sufficient alone"
