# M0 — Ground: the exit criteria, as data. Task 4.3.4.
#
# The sources are section 5 of openspec/changes/implement-m0-ground/tasks.md and the M0 row of
# docs/ROADMAP.md; every criterion below names which. `delivery-roadmap` requires each to be a
# recipe that exits zero, a test that passes, a benchmark within a threshold, or a committed
# artefact that is regenerated and compared — so an intention that cannot be run is a note at the
# bottom of this file, not a criterion.
#
# `ci_job` names the gate in tools/roadmap/gates.toml under which continuous integration runs the
# criterion. It is required on every criterion, including the ones this machine can evaluate: a
# criterion that passes locally and runs nowhere else is not a gate. A criterion that cannot be
# evaluated on the host running the recipe — another operating system, no display — carries a
# `reason`, is reported as not evaluated rather than as passed, and is counted separately.

schema = 1
id = "m0"
name = "Ground"
artefact = "samples/00-empty — opens a window, runs an empty loop through tick(), writes a trace, exits cleanly"

# Non-binding, because neither can be settled by running something. `delivery-roadmap` requires a
# criterion that cannot be evaluated by a machine to be restated as a check or moved here.
notes = [
    "tasks 5.8 — docs/roadmap/capability-matrix.md and docs/ROADMAP.md are corrected where M0 recorded an intention the implementation changed. Reviewed, not checked: no tool can tell an intention from its correction.",
    "tasks 5.9 — archiving this change happens after this recipe passes, so it cannot be one of the criteria it must satisfy.",
    "The gate set this milestone's criteria join on close is tools/roadmap/gates.toml; `just roadmap-gates` prints it.",
]

# --- The environment and the static gates: cheap, and they fail first -----------------------------

[[criterion]]
id = "doctor"
describe = "just env-doctor diagnoses the development environment"
source = "tasks 5.1"
kind = "recipe"
run = "just env-doctor"
ci_job = "build-and-test"

[criterion.falsifies]
mutate = "rename-token"
target = "just/env.just"
token = "cmake    | cmake"
note = "renaming the required tool and binary makes the doctor report the missing dependency"

[[criterion]]
id = "layering"
describe = "the layering check passes, and fails on each deliberately introduced violation"
source = "tasks 5.5"
kind = "recipe"
run = "just quality-layers"
ci_job = "layering"

[criterion.falsifies]
mutate = "rename-token"
target = "tools/layercheck/layercheck.py"
token = "platform/"
note = "renaming the SDL exemption makes the layer check reject the real SDL includes outside its recognised platform directory"

[[criterion]]
id = "specs"
describe = "openspec validate --specs --strict passes"
source = "tasks 5.9"
kind = "recipe"
run = "just quality-specs"
ci_job = "specs"

[[criterion]]
id = "format"
describe = "the formatting gate is live and green"
source = "tasks 5.4"
kind = "recipe"
run = "just quality-format-check"
ci_job = "format"

[[criterion]]
id = "roadmap-record"
describe = "the status record and openspec/specs/ agree"
source = "tasks 5.7, delivery-roadmap"
kind = "recipe"
run = "just roadmap-status"
ci_job = "roadmap-status"

[[criterion]]
id = "roadmap-tiers"
describe = "the record carries M0's exit tiers, each naming the change that advanced it"
source = "tasks 5.7"
kind = "tiers"
ci_job = "milestone-m0"

[criterion.expect_tiers]
build-system-and-platforms = "seed"
developer-workflow-and-just = "seed"
thirdparty-dependencies = "seed"
testing-and-quality = "seed"
core-platform-abstraction = "seed"
diagnostics-profiling-and-crash = "seed"
project-and-plugins = "seed"
delivery-roadmap = "working"

# --- The build, and everything that needs one -----------------------------------------------------

[[criterion]]
id = "build"
describe = "just build-engine configures and builds"
source = "tasks 5.1"
kind = "recipe"
run = "just build-engine"
ci_job = "build-and-test"

[[criterion]]
id = "generated-code"
describe = "generated headers are current and their regeneration is reproducible"
source = "ROADMAP M0, gates.toml"
kind = "recipe"
run = "just generate-check"
ci_job = "generated-code"

[[criterion]]
id = "lint"
describe = "the static analysis gate is live and green"
source = "tasks 5.4"
kind = "recipe"
run = "just quality-lint"
ci_job = "lint"

[[criterion]]
id = "test"
describe = "just test-all is green: unit, integration and smoke — every suite the harness budgets, its own `unit.harness` and `integration.harness` included. MEASURED ON A QUIET HOST, AND THAT PREMISE IS PART OF THE CLAIM. The suite's stall ceiling is a wall-clock assertion, and M11.c's fifth, sixth and seventh closes each refuted an allowance that tried to excuse a loaded host's share of it from inside the case; the owner's decision was that a timing-sensitive suite runs on a quiet host instead, the way `m11a:world-budget-on-a-device` does. `just test-quiet-host` builds the tree first, then waits up to ten minutes for every other process together to use at most two cores and for CPU pressure to stay at or under 10%, runs the suite in a session of its own, and judges the host across the run a second at a time with the suite's own process tree subtracted, requiring its BUSIEST second to be quiet too. A host that is not quiet FAILS this criterion with a `host too busy:` reason and its numbers; it is never a pass and never a skip. `smoke.quiet_host_before`, `smoke.quiet_host_across` and `smoke.quiet_host_own` prove the check is live by loading the host on purpose"
source = "tasks 5.1; M11.c's seventh close"
kind = "recipe"
run = "just test-quiet-host -- just test-all"
# DECLARED, NOT LEFT TO DERIVATION: a quiet host is this criterion's premise, so it must never run
# beside another criterion, whatever the scheduler could derive from its body.
needs = ["exclusive"]
ci_job = "build-and-test"

# THE MUTATION IS A SUITE THE COMMAND RUNS, NOT THE WRAPPER AROUND IT. `unit.render_gpu_culling`
# (test_gpu_cull.cpp) compares `output.counters().tested == 2` against what `cpu_reference_cull`
# filled, and this is the line that fills it — the same mutation `m7:gpu-culling` declares, for the
# same reason: `tested` is non-zero in every case the suite builds. With it gone `just test-all` is
# red inside the wrapper, and the wrapper passes that exit status through on a quiet host: a red
# suite on a quiet host is red. That the wrapper itself is live — that a BUSY host fails rather than
# passes — is the claim `smoke.quiet_host_before/across/own` make, by loading the host on purpose.
[criterion.falsifies]
mutate = "delete-lines"
target = "src/servers/render/culling/src/gpu_cull.cpp"
token  = "++counters.tested;"
note   = "unit.render_gpu_culling checks `output.counters().tested == 2` after `cpu_reference_cull`, which this line fills; the suite goes red, `just test-all` exits red inside `cy_quiet_host`, and the wrapper reports the suite's own exit status on a quiet host. The mutation shows the criterion's exit code carries a red suite; the host check's liveness is smoke.quiet_host_*'s claim."

# --- The closing artefact -------------------------------------------------------------------------

[[criterion]]
id = "sample-headless"
describe = "the empty sample runs under the headless display server and exits cleanly"
source = "tasks 5.2, 5.3"
kind = "recipe"
run = "just run-sample empty --headless --frames 10"
ci_job = "build-and-test"

[[criterion]]
id = "sample-window"
describe = "the empty sample opens a window and closes it"
source = "tasks 5.2"
kind = "recipe"
run = "just run-sample empty --frames 10"
requires = "display"
reason = "no window system on this host, and a headless run is not evidence that a window opens"
ci_job = "build-and-test"

[[criterion]]
id = "trace"
describe = "a run produces a trace file, and just diagnose-trace reads it"
source = "tasks 5.3"
kind = "command"
run = "trace=\"$(mktemp -d)/m0.cytrace\"; just run-sample empty --headless --frames 10 --trace \"$trace\" && just diagnose-trace \"$trace\""
ci_job = "build-and-test"

[[criterion]]
id = "three-platforms"
describe = "doctor, build and test are green on Linux, Windows and macOS"
source = "tasks 5.1, ROADMAP M0"
kind = "command"
run = "just env-doctor && just build-engine && just test-all"
where = "ci"
reason = "this host runs one operating system; the other two are built only by the CI matrix"
ci_job = "build-and-test"

# --- What comes next ------------------------------------------------------------------------------

# Amended while closing M1, and the amendment is the criterion doing what its description always
# said. The pattern was `openspec/changes/*m1*/proposal.md`, which stops matching the moment M1 is
# archived — `openspec archive` moves the change under `openspec/changes/archive/`, and `*` does not
# match a path separator. So the last step of closing M1 (its task 6.11) would have turned this
# criterion red, and with it `just roadmap-milestone m0`, and with that M1's own `m0-green`
# criterion: the ladder could not survive its own final rung. The question the criterion asks is
# whether the next milestone was opened deliberately, and a change that has been opened and then
# closed answers it more strongly than one still open. `**` matches both.
[[criterion]]
id = "m1-open"
describe = "the M1 change exists — open, or closed and archived — so the ladder continues deliberately"
source = "tasks 5.10"
kind = "path"
path = "openspec/changes/**/*m1*/proposal.md"
ci_job = "milestone-m0"
