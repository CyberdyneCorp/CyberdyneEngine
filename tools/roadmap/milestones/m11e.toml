# THE LADDER ENDS HERE, AND THE END IS CHECKED RATHER THAN ASSUMED. There is no `m12-open` criterion
# because there is no M12: this is the 1.0 gate. What could still go wrong is a rung added above this
# one in SOME of the places that read the ladder and not others — which is exactly the failure M8's
# split produced three times in one change, in three readers with three regular expressions. So the
# check is that the ladder's end is consistent: either m11e is the last rung everywhere, or whatever
# follows it carries a ledger, a gate, a floor and a change directory, all four.
[[criterion]]
id = "ladder-ends-here"
describe = "m11e is the last rung on the ladder in every place that reads one — or, if a rung has been added above it, that rung carries a ledger, a gate, a criteria floor and a change directory, all four. A ladder extended in three of four places is the defect M8's split found three times in one change"
source = "tasks 9.2, delivery-roadmap (An inserted milestone's rung is checked, not assumed)"
kind = "command"
run = '''
set -eo pipefail
python3 - <<'CHECK'
import pathlib, sys, tomllib
sys.path.insert(0, "tools/roadmap")
import record as record_module
import selftest as selftest_module
order = list(record_module.MILESTONES)
above = order[order.index("m11e") + 1:] if "m11e" in order else []
if not above:
    print("m11e is the last rung on record.MILESTONES: the ladder ends at the 1.0 gate")
    sys.exit(0)
gates = tomllib.loads(pathlib.Path("tools/roadmap/gates.toml").read_text(encoding="utf-8"))
declared = {gate.get("milestone") for gate in gates["gate"]}
problems = []
for rung in above:
    if not (pathlib.Path("tools/roadmap/milestones") / f"{rung}.toml").is_file():
        problems.append(f"{rung} has no ledger")
    if rung not in declared:
        problems.append(f"{rung} has no gate in gates.toml")
    if rung not in selftest_module.MINIMUM_CRITERIA:
        problems.append(f"{rung} has no floor in selftest.MINIMUM_CRITERIA")
    if not list(pathlib.Path("openspec/changes").glob(f"**/*{rung}*/proposal.md")):
        problems.append(f"{rung} has no change directory")
for problem in problems:
    print(f"  {problem}")
print(f"the ladder continues past 1.0 with {above}; {len(problems)} problem(s) with that extension")
sys.exit(1 if problems else 0)
CHECK
'''
ci_job = "milestone-m11e"
