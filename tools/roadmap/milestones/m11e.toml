[[criterion]]
id = "no-recipe-refuses-with-a-dead-milestone"
describe = "no recipe refuses naming a milestone that is not on the ladder, or one whose gate is already green. The release recipes once named 'M12 — build-and-packaging', which does not exist; this check keeps that stale plan from returning anywhere in just/"
source = "tasks 4, delivery-roadmap (A recipe that refuses names a rung that exists)"
kind = "command"
run = '''
set -eo pipefail
python3 - <<'CHECK'
import pathlib, re, sys, tomllib
sys.path.insert(0, "tools/roadmap")
import record as record_module
ladder = list(record_module.MILESTONES)
gates = tomllib.loads(pathlib.Path("tools/roadmap/gates.toml").read_text(encoding="utf-8"))
green = {gate.get("milestone") for gate in gates["gate"] if gate.get("state") == "green"}
problems = []
for path in sorted(pathlib.Path("just").glob("*.just")):
    for number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
        for name in re.findall(r"\bM(\d+(?:\.5|\.[a-e])?)\b", line):
            identifier = "m" + name.replace(".5", "b").replace(".", "")
            if identifier not in ladder:
                problems.append(f"{path.name}:{number}: names M{name}, which is not on the ladder")
            elif identifier in green:
                problems.append(f"{path.name}:{number}: names M{name}, whose gate is already green")
for problem in problems:
    print(f"  {problem}")
print(f"{len(problems)} recipe line(s) name a milestone that is absent or already closed")
sys.exit(1 if problems else 0)
CHECK
'''
ci_job = "milestone-m11e"

