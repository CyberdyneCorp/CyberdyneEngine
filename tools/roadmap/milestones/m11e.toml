[[criterion]]
id = "one-point-oh-record"
describe = "EVERY CAPABILITY IS COMPLETE OR DEFERRED WITH A RE-ENTRY POINT, evaluated by a check that reads the record and the deferral register and FAILS NAMING any capability that is neither. This is the 1.0 claim, and `delivery-roadmap`'s new requirement says in as many words that it SHALL NOT be satisfied by a document asserting it. Today it fails naming sixty-six rows"
