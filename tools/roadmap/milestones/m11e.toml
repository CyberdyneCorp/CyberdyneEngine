vfx-system = "complete"
# MOVED FROM M11.d — its task 7.6, the demotion its design.md §5.1 predicted. M11.d made the content
# audit, provenance and stripped-and-archived symbols real; downloadable content (a signed package
# set, and nothing signs), distributed execution (remote workers, a second machine) and the
# reproducibility bundle archived BY CI (an upload step in ci.yml) did not, and arrive here through
