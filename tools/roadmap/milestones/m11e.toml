# --- Section 2: the dependency set and attribution ----------------------------------------------------

[[criterion]]
id = "dependency-set-integrated"
describe = "the intended dependency set is integrated rather than listed. `thirdparty-dependencies` says about half of it is not, and the specification's own phrase — 'about half the intended set' — is a sentence that cannot go red, so this check counts `[[dependency]]` entries against the named set and fails naming the shortfall"
source = "tasks 3, thirdparty-dependencies, deps/manifest.toml"
kind = "command"
run = '''
set -eo pipefail
python3 - <<'CHECK'
import pathlib, sys, tomllib
manifest = tomllib.loads(pathlib.Path("deps/manifest.toml").read_text(encoding="utf-8"))
entries = manifest.get("dependency", [])
names = sorted(entry.get("name", "?") for entry in entries)
print(f"{len(entries)} dependency entries in deps/manifest.toml:")
print("  " + ", ".join(names))
spec = pathlib.Path("openspec/specs/thirdparty-dependencies/spec.md").read_text(encoding="utf-8")
intended = set()
for line in spec.splitlines():
    if line.startswith("|"):
        # THE TABLE WRITES LIBRARY NAMES IN BOLD, NOT BACKTICKS. Splitting on backticks collected
        # nothing, so `intended` was the EMPTY SET and this criterion passed over any manifest at all —
        # the check written to replace a sentence that could not go red could not go red either.
        intended.update(part.strip() for part in line.split("**")[1::2])
# NORMALISE BOTH SIDES BEFORE COMPARING. The specification writes human names -- "Jolt Physics",
# "HarfBuzz", "SPIRV-Cross" -- and deps/manifest.toml writes identifiers -- "jolt", "vulkan_headers".
# The first version of this filter kept only names that were already lowercase and space-free, which
# threw away every multi-word and every camel-cased library and left the set empty.
def key(text):
    return "".join(ch for ch in text.lower() if ch.isalnum())
integrated = {key(n) for n in names}
intended = {n for n in intended if n and not n.startswith("|")}
missing = sorted(
    n for n in intended
    if not any(k.startswith(key(n)) or key(n).startswith(k) for k in integrated if k)
)
print(f"{len(intended)} named in the intended set, {len(missing)} not integrated:")
print("  " + (", ".join(missing) or "none"))
sys.exit(1 if missing else 0)
CHECK
'''
ci_job = "milestone-m11e"

