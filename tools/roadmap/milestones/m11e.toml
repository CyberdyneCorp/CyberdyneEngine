just build-engine --profile dev > /dev/null
pattern='^(unit.xr|integration.xr_prerequisites)$'
registered=$(ctest --test-dir "$d" -N -R "$pattern" 2>/dev/null | grep -c 'Test *#' || true)
echo "$registered of 2 suite(s) match $pattern"
test "$registered" -ge 2 || { echo "a suite this criterion names is not registered — renamed, deleted, or never written"; exit 1; }
ctest --test-dir "$d" -R "$pattern" --output-on-failure
'''
ci_job = "milestone-m11e"

[[criterion]]
id = "record-matches-plan-history-closed"
describe = "every closed milestone's column agrees with the status record, over all nineteen rungs. `m9:record-matches-plan-history` — four cells over four closed milestones whose Working tier no criterion evaluated — closes HERE because two of its four rows are M11.d's and two are this rung's, and it cannot pass until the last is evaluated and recorded"
source = "tasks 6, m9:record-matches-plan-history, delivery-roadmap"
kind = "command"
run = '''
set -eo pipefail
python3 - <<'CHECK'
import sys, tomllib, pathlib
sys.path.insert(0, "tools/roadmap")
import plan as plan_module
import record as record_module
import gates as gates_module
matrix = plan_module.read_matrix()
entries = {entry.capability: entry for entry in record_module.load()}
gates = tomllib.loads(pathlib.Path("tools/roadmap/gates.toml").read_text(encoding="utf-8"))
closed = {gate["milestone"] for gate in gates["gate"]
          if gate.get("class") == "milestone" and gate.get("state") == "green"}
short = []
for capability, row in sorted(matrix.cells.items()):
    for rung, planned in row.items():
        if rung not in closed:
            continue
        have = entries.get(capability)
        tier = have.tier if have else None
        if tier not in plan_module.TIERS or plan_module.tier_rank(tier) < plan_module.tier_rank(planned):
            short.append(f"{rung.upper()} {capability}: {planned} planned, {tier} recorded")
for line in short:
    print(f"  {line}")
print(f"{len(short)} cell(s) over closed milestones exceed the status record")
sys.exit(1 if short else 0)
CHECK
'''
ci_job = "milestone-m11e"

