kind = "command"
run = '''
set -eo pipefail
python3 - <<'CHECK'
import pathlib, sys
sys.path.insert(0, "tools/roadmap")
import record as record_module
entries = record_module.load()
register = pathlib.Path("docs/roadmap/risks.md").read_text(encoding="utf-8")
short = []
for entry in sorted(entries, key=lambda item: item.capability):
    if entry.tier == "complete":
        continue
    if f"`{entry.capability}`" in register:
