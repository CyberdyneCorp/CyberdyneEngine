# M11.e — Ship: the exit criteria of the LAST rung on this ladder.
#
# WHAT MAKES THIS RUNG DIFFERENT FROM THE OTHER FOUR. It is the only one with no rung above it, so it
# is the only one permitted to record a DEFERRAL: a rung before it demotes a capability with the
# reason that demoted it, and a deferral is the final rung's act because it is the point at which
# "later" stops being available. That rule is what makes the deferral discipline enforceable rather
# than a habit, and `deferral-is-the-last-rungs-act` below is how it is checked.
#
# FOUR ROWS IS THE SMALLEST COUNT ON THE LADDER AND NOT THE SMALLEST RUNG. M11.a predicts demoting
# `save-and-persistence` and `audio`; M11.b `ml-inference` and `swift-scripting`; M11.c
# `rendering-culling-and-lod`; M11.d `build-and-packaging`. Six named candidates and an unknown
# number of unnamed ones arrive here, and the honest position stated at proposal time is that this
# rung's real load is whatever the four rungs above could not finish.
#
# AND THE UNNAMED ONES STARTED ARRIVING AT M11.c. Its gate judged its fifteen rows by task 3.5's rule
# — a row is Complete only where its requirements are evaluated rather than exempted — and twelve
# moved here with their reasons (`roadmap-tiers` below lists them). `rendering-culling-and-lod`, the
# one M11.c predicted, is one of the three that stayed.
#
# THE SPIKE THAT COMES FIRST AND MAY REWRITE THE RUNG. Can a hosted runner produce a mobile artefact
# at all? One empty project, cross-compiled, packaged and reported. If it cannot be done, the mobile
# scope is a deferral with a re-entry point and this becomes the distribution and record rung — which
# is a finding worth having on day one rather than at the gate. Sections 1 and 2 of this rung's tasks
# are scoped CONTINGENTLY on that answer and this file's mobile criteria are written to be reportable
# three ways.
#
# THERE IS NO `m12-open` CRITERION AND THE ABSENCE IS DECLARED RATHER THAN LEFT. Every rung since
# M8.a has closed by opening the next one. This rung has no next rung: what replaces that criterion
# is `one-point-oh-record` — the 1.0 claim evaluated by something that names the offending row — and
# `ladder-ends-here`, which fails if a rung is ever added above this one in some places and not
# others. A reader must not read the absence of an `*-open` criterion as an omission.

schema = 1
id = "m11e"
name = "Ship"
artefact = "`samples/11-ship` on every supported target from a single recipe — the desktop half from M11.d and at least one mobile target here — and THE 1.0 RECORD: seventy-six rows, each Complete or deferred with a re-entry point, every deferral naming what is unmet, why, and the condition that brings it back."

notes = [
    "`just roadmap-milestone m11e` is this recipe, so it cannot be one of the criteria it evaluates.",
    "THE STATIC GATES ARE SPELLED HERE EXACTLY AS THE OTHER FOUR RUNGS SPELL THEM. Running this ledger therefore evaluates the whole ladder ONCE — every closed milestone's criteria, deduplicated — which is what `criteria.build_plan` is for and what makes this rung's run the 1.0 regression suite rather than a fifth copy of it.",
    "TWO OF THE THREE STALE-REFUSAL RECIPES ARE M11.d's ROW. `build-shaders` and `maintenance-clean` belong to `developer-workflow-and-just`; the four `release-*` recipes are this rung's. `no-recipe-refuses-with-a-dead-milestone` below checks all of them from here, because the check is cheap and the defect is the same one, and this rung fixing a one-line label string is not this rung absorbing another rung's capability.",
    "`m9:record-matches-plan-history` CLOSES HERE AND NOT EARLIER, and the reason is arithmetic rather than preference: the gap is four rows over four closed milestones, two of them are M11.d's rows and two are this rung's, and it cannot pass until the last of the four is evaluated AND recorded. M11.a wrote the criteria that evaluate them; this rung is where the last tier lands.",
    "tasks 10.x — the gate itself. A milestone cannot make passing its own gate one of the criteria that gate evaluates.",
    "`just quality-requirements` DOES NOT EXIST YET AND THE CRITERIA THAT CALL IT WILL SAY SO. `testing-and-quality` requires every requirement to map to a test, a gate or a recorded exemption, and the tool that checks it is one of that row's four absent gates — the row is M11.d's. It is named here rather than avoided because the mapping IS the Complete-grade claim these rows are being judged on: whichever rung reaches it first writes the tool, and M11.d is where it is finished. A criterion that names an absent recipe fails loudly with the recipe's name in it, which is the honest red.",
]

