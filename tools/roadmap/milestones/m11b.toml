echo "$registered of 10 suite(s) match $pattern"
test "$registered" -ge 10 || { echo "a suite this criterion names is not registered — renamed, deleted, or never written"; exit 1; }
ctest --test-dir "$d" -R "$pattern" --output-on-failure
'''
