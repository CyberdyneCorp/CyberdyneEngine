[[criterion]]
id = "gameplay-suites"
describe = "the gameplay suites are green at Complete grade: abilities and effects, AI, animation and skinning, camera, navigation, physics, sequences, the interface, text and 2D"
source = "tasks"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
# ONE SUITE PER ROW THE `describe` NAMES, SPELLED AS CTEST REGISTERS IT.
#
# CORRECTED AT M11.b, AND THE CORRECTION IS THE POINT. Four of the ten names this criterion was
# written with have never existed: `unit.gameplay`, `unit.physics`, `unit.cy_sequencing` and
# `unit.cy_text` (the last two are MODULE target names, not suite names; the suites are
# `unit.sequencing` and `unit.text`, and `cy_add_test` names a suite `<kind>.<NAME>`). A fifth row
# the describe names — abilities and effects — had no suite in the pattern at all. So the criterion
# could only ever fail with "a suite this criterion names is not registered", which is a RED FOR THE
# WRONG REASON and reads exactly like a red for the right one. The ten below were read out of
# `ctest -N` rather than guessed, and the count check still goes red the day one is renamed or
# deleted — which is the only thing this half of the criterion is for.
pattern='^(unit\.ability_core|unit\.ai|unit\.animation|unit\.camera_system|unit\.navigation|unit\.physics_server|unit\.sequencing|unit\.ui|unit\.text|unit\.rendering_2d)$'
