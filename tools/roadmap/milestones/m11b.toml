# --- Section 5: the artefact -----------------------------------------------------------------------

[[criterion]]
id = "the-game-exists"
describe = "the game is in the tree as a project, with its content in the project rather than in C++. `samples/` holds sixteen entries and not one of them is a game with authored content: 08-vertical-slice is a slice and 11-ship is a packaging proof"
source = "tasks, ROADMAP M11.b closing artefact"
kind = "command"
run = '''
set -eo pipefail
dir=$(ls -d samples/*game* 2>/dev/null | head -1 || true)
test -n "$dir" || { echo "no game project under samples/"; exit 1; }
echo "game project: $dir"
assets=$(find "$dir" -type f \( -name '*.cyasset' -o -name '*.cyscene' -o -name '*.json' -o -name '*.toml' \) | wc -l)
sources=$(find "$dir" -type f \( -name '*.cpp' -o -name '*.h' \) | wc -l)
echo "  $assets authored file(s), $sources C++ file(s)"
test "$assets" -gt "$sources"
'''
ci_job = "milestone-m11b"

