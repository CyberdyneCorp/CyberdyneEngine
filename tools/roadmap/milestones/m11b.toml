# --- Section 1: the two rows that have been at Seed since M5 ---------------------------------------
#
# M10's audit ran two greps and both returned nothing:
#   grep -rniI 'SeparateProcess\|RemoteDevice\|InEditor' src/ editor/ tools/
#   grep -rniI 'LiveEditPolicy\|ReinitializeComponent\|RecreateEntity\|RestartWorld' src/ editor/ tools/
# Those two absences are what put `editor-architecture` and `live-editing` at Seed and kept them
# there while five milestones built on top of them. The criteria below are those greps inverted.

[[criterion]]
id = "play-modes-exist"
describe = "the three play modes are named in the tree and reachable. `InEditor`, `SeparateProcess` and `RemoteDevice` are one requirement in two specifications and no grep finds any of the three today, which is most of why `editor-architecture` is at Seed"
source = "tasks, editor-architecture (Play modes), live-editing"
kind = "command"
run = '''
set -eo pipefail
missing=""
for mode in SeparateProcess RemoteDevice InEditor; do
    hits=$(grep -rniIl "$mode" src/ editor/crates/ tools/ | grep -v "^tools/roadmap/" 2>/dev/null | grep -v "/target/" || true)
    count=$(printf '%s' "$hits" | grep -c . || true)
    echo "  $mode: $count file(s)"
    test "$count" -gt 0 || missing="$missing $mode"
done
test -z "$missing" || { echo "play modes with no implementation:$missing"; exit 1; }
'''
ci_job = "milestone-m11b"

[[criterion]]
id = "live-edit-policy-exists"
describe = "a per-field live edit policy exists with the three outcomes the requirement names — reinitialise the component, recreate the entity, restart the world. A capability with no per-field policy and no play modes is Seed, and this is the other half of why"
source = "tasks, live-editing (Live edit policy)"
kind = "command"
run = '''
set -eo pipefail
missing=""
for symbol in LiveEditPolicy ReinitializeComponent RecreateEntity RestartWorld; do
    hits=$(grep -rniIl "$symbol" src/ editor/crates/ tools/ | grep -v "^tools/roadmap/" 2>/dev/null | grep -v "/target/" || true)
    count=$(printf '%s' "$hits" | grep -c . || true)
    echo "  $symbol: $count file(s)"
    test "$count" -gt 0 || missing="$missing $symbol"
done
test -z "$missing" || { echo "live edit policy symbols absent:$missing"; exit 1; }
'''
ci_job = "milestone-m11b"

[[criterion]]
id = "play-mode-round-trip"
describe = "a world is played in each of the three modes and the same command stream drives all three. The spike this rung names asks whether the hosted runtime carries all three WITHOUT A SECOND WORLD MODEL; this is the case that answers it in the tree rather than in a design document"
source = "tasks, design.md §1, editor-architecture (Play modes)"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
binary="$d/cy_test_integration_editor_play"
test -x "$binary" || { echo "no $binary — the suite integration.editor_play does not exist"; exit 1; }
filter='a world plays in each of the three modes*'
out="$("$binary" "-tc=$filter" 2>&1)" || { echo "$out"; echo "the named case(s) FAILED"; exit 1; }
echo "$out" | tail -3
selected=$(printf '%s' "$out" | sed -nE 's/.*test cases: *([0-9]+) \|.*/\1/p' | head -1)
echo "the filter selected ${selected:-0} case(s) of the 1 it names"
test "${selected:-0}" -ge 1 || { echo "the named case(s) are not in integration.editor_play any more — renamed, deleted, or the filter is stale"; exit 1; }
'''
timeout_s = 3600
ci_job = "milestone-m11b"

