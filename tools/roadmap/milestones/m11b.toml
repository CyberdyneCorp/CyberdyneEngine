# THE HANDOVER CHECK, IN THE SHAPE `implement-m11-reach` TASK 0.1 SETTLED FOR ALL FIVE RUNGS. The
# double-star glob is kept as the search; what is asked of the result is ENTRY rather than existence,
# because the five rung changes were opened together and a `kind = "path"` criterion over
# `openspec/changes/**/*m11c*/proposal.md` would pass the moment it was written and could never go
# red. A criterion that cannot fail is not a criterion.
[[criterion]]
id = "m11c-open"
describe = "the next rung's change exists — open, or closed and archived — AND has been deliberately entered. That rung is M11.c, Image, which this rung hands two things it cannot finish without: a texture encoder and an editor to author a material in"
source = "tasks 12.3, implement-m11-reach task 0.1, delivery-roadmap"
kind = "command"
run = '''
set -eo pipefail
# the double-star glob the ladder has used since M8.a: openspec/changes/**/*m11c*/proposal.md
dirs=$(find openspec/changes -type d -name '*m11c*' | sort)
test -n "$dirs" || { echo "no change directory matching openspec/changes/**/*m11c*/"; exit 1; }
entered=""
for d in $dirs; do
    test -f "$d/proposal.md" || continue
    echo "  $d/proposal.md"
    # A CHECKED TASK OUTSIDE SECTION 0, and the exclusion is the point. Section 0 is a rung's own
    # decision-and-spike section, which the split that opened all five rungs could answer in advance;
    # a checked box there says the rung was SCOPED. A checked box in the body says the rung was
    # STARTED, which is the deliberate act this criterion is standing in for.
    if [ -f "$d/tasks.md" ] && grep -qE '^- \[x\] [1-9]' "$d/tasks.md"; then
        entered="$entered $d"
    fi
done
if [ -z "$entered" ]; then
    echo "the next rung's change exists and nobody has entered it: no task outside its section 0 is checked."
    exit 1
fi
echo "entered:$entered"
'''
ci_job = "milestone-m11b"
