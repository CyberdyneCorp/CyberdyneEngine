# M11.b — Authoring: the exit criteria of M11's second rung.
#
# WHAT THIS RUNG IS FOR. `editor-architecture` and `live-editing` have been at SEED SINCE M5 while
# five milestones built features on top of them, and the first thing this rung establishes is
# whether that is a mis-record or a thin foundation. It is the largest requirement load of the five
# rungs — twenty-four rows carrying 420 requirements, 39 % of the 1,069 M11 owes in total — and more
# rows than any closed milestone on this ladder advanced.
#
# WHY THE ARTEFACT IS A GAME AND NOT A SAMPLE. `samples/11-ship` is a PACKAGING proof and every
# existing demo proves one slice. Twenty-four authoring and gameplay rows can only be judged by
# something a person plays, whose content was authored in the editor rather than assembled in C++.
# The artefact must be honest about which parts a person authored and which parts the sample's code
# assembles, because that distinction is the entire claim.
#
# WHY IT COMES BEFORE M11.c AND THE ORDERING IS THE ARGUMENT. An art-directed shot assembled by hand
# in C++ proves the renderer and nothing else; one authored THROUGH this editor proves both. The
# dependency is concrete rather than rhetorical: M11.c needs textured materials and there is no BC7
# or ASTC encoder in the tree, so the texture path is this rung's work before it is that rung's
# subject.

schema = 1
id = "m11b"
name = "Authoring"
artefact = "a real sample game — a start, a loop, a way to win or lose, and content authored IN THE EDITOR rather than assembled in C++ — published with a statement of which parts a person authored and which parts the sample's code assembles."

notes = [
    "`just roadmap-milestone m11b` is this recipe, so it cannot be one of the criteria it evaluates.",
    "THE STATIC GATES ARE SPELLED HERE EXACTLY AS M11.a SPELLS THEM, so `criteria.fingerprint` collapses them to one check each. A rung that re-worded a `run` string would double the work and multiply its own failure probability by the number of ledgers naming it.",
    "THE SEVEN INHERITED GAPS ARE NONE OF THEM THIS RUNG'S. Six close at M11.a and one at M11.e; they are in the permanent set this ledger inherits and they still run on every evaluation. A gap re-pointed at the wrong rung is a gap nobody owns, which is why tasks 12.2 asks this rung to CONFIRM each still names the rung that closes it rather than to re-declare any of them here.",
    "WHERE THIS HOST CANNOT JUDGE A CLAIM THE CRITERION REPORTS NOT EVALUATED THROUGH `where`/`requires` RATHER THAN PASSING. The editor's own surfaces need a display; the game needs a device to be played on. Each such criterion has a companion that needs neither, which is M8.c's rule: nothing a milestone claims should be judgeable only on the machines with a GPU in them.",
    "tasks 13.x — the gate itself. A milestone cannot make passing its own gate one of the criteria that gate evaluates.",
    "`just quality-requirements` DOES NOT EXIST YET AND THE CRITERIA THAT CALL IT WILL SAY SO. `testing-and-quality` requires every requirement to map to a test, a gate or a recorded exemption, and the tool that checks it is one of that row's four absent gates — the row is M11.d's. It is named here rather than avoided because the mapping IS the Complete-grade claim these rows are being judged on: whichever rung reaches it first writes the tool, and M11.d is where it is finished. A criterion that names an absent recipe fails loudly with the recipe's name in it, which is the honest red.",
]

