# --- Section 1: the two rows that have been at Seed since M5 ---------------------------------------
#
# M10's audit ran two greps and both returned nothing:
#   grep -rniI 'SeparateProcess\|RemoteDevice\|InEditor' src/ editor/ tools/
#   grep -rniI 'LiveEditPolicy\|ReinitializeComponent\|RecreateEntity\|RestartWorld' src/ editor/ tools/
# Those two absences are what put `editor-architecture` and `live-editing` at Seed and kept them
# there while five milestones built on top of them.
#
# THE CRITERIA BELOW WERE THOSE GREPS INVERTED AND M11's GATE REFUSED ALL OF THEM AS "word-greps a
# dummy job satisfies". Inverting a grep does not make it a check: "the token is absent" can be made
# false by a person who does the work, and "the token is present" can be made true by a person who
# types it. What replaced them is a gate that compares things that can DISAGREE — the engine's
# declarations, the editor's, and the requirements' own tables — and a suite that drives the compiled
# engine. Each pair is one static criterion and one behavioural one, and neither replaces the other.

# THIS CRITERION WAS A GREP AND M11's GATE REFUSED IT, IN THREE WORDS: "word-greps a dummy job
# satisfies". It ran `grep -rniIl SeparateProcess ...` and passed when the token appeared anywhere —
# in a comment, in a task list, in this file. One file containing three words closed it. That is the
# eighth instance of the defect tools/roadmap/falsify.py enumerates, and the fix is not a better
# regex: the check has to compare things that can DISAGREE.
#
# `tools/editor/play_contract.py play-modes` derives the mode table from the declaration that fixes
# it on each side of the boundary — the engine's `constexpr kNames` and its `capabilities_of` and
# `availability_of` switch arms, the editor's `const fn name()` and its `matches!` predicates, and
# the markdown tables in `live-editing` and `editor-architecture` — and requires them to agree on
# the enumerators, their order, their spellings, which modes can step a frame, which isolate editor
# state, and whether every refusal names the rung the mode is due at. A word typed into a comment
# satisfies none of it, and `tools/editor/selftest.py` breaks each input in turn and requires the
# gate to notice. Registered as `integration.editor_contract_play_modes` as well, so it does not run
# only when a ledger remembers it.
#
# The BEHAVIOURAL half is `play-mode-round-trip` below, which drives one world through all three
# modes in the compiled engine. The two are complementary and neither replaces the other: a suite
# cannot establish that its own subject is the specification's subject, and this cannot establish
# that the modes run.
[[criterion]]
id = "play-modes-exist"
describe = "the three play modes are declared consistently by everything that has to agree about them. `InEditor`, `SeparateProcess` and `RemoteDevice` are one requirement in two specifications, and the engine, the editor and both specifications are required to name the same three, spell them the same way, and agree on which of them can step a frame and which isolate editor state"
source = "tasks, editor-architecture (Play modes), live-editing"
kind = "command"
run = "python3 tools/editor/play_contract.py play-modes"
ci_job = "milestone-m11b"

# The mutation cannot be derived — there is no text search in the body to derive it from — so it is
# DECLARED, as a verb and a target `falsify.py` executes rather than as a sentence. Renaming the
# engine's own spelling of a mode is the break this criterion exists to catch: the editor and the
# two specifications still say `separate-process` and the engine no longer does.
# THE `known_gap` AND `known_gap_closes` MARKERS THAT STOOD HERE ARE DELETED, BY M11.c's CLOSING
# GATE AND ON THE LEDGER'S OWN INSTRUCTION. `just roadmap-milestone m11c` reported "THE GAP IS
# CLOSED, DELETE THE DECLARATION: m11b:play-modes-exist now passes", and a marker that outlives its gap is the
# next thing nobody notices — `_summarise` fails the ledger for it in the other direction. The
# gap named M11.c as the rung that closes it and this is that act; the criterion itself, its
# `describe` and its `run` are untouched.

[criterion.falsifies]
mutate = "rename-token"
target = "src/gameplay/play/src/mode.cpp"
token = "separate-process"

# THE SAME GREP, THE SAME REFUSAL, AND THE SAME REPAIR. This one searched for four symbol names and
# passed when each appeared in any file, which a comment naming them satisfies.
#
# `tools/editor/play_contract.py live-edit-policy` compares the engine's policy table against the
# requirement's own table and against the classification the defaults are derived FROM
# (`reflect::PersistenceKind`, which `live-editing` says "until now had no consumer"). The leg that
# carries the rung's claim is the last one: `RecreateEntity` and `RestartWorld` must never be
# DERIVED. policy.h argues that at length — nothing about a field's classification can tell you that
# changing it invalidates the entity or the world — and `live-edit-applies-without-a-restart` below
# is written against exactly that distinction, "the policy is DECLARED per field rather than
# inferred". A build in which the classification could produce those two would make the per-field
# declaration unnecessary and that criterion vacuous, and this is what refuses it.
[[criterion]]
id = "live-edit-policy-exists"
describe = "a per-field live edit policy exists, with the six outcomes the requirement names, a total order over what they disturb, a derivation arm for every field classification the engine has — and with `RecreateEntity` and `RestartWorld` NEVER derived from a classification, because a policy that is always inferred is not per field"
source = "tasks, live-editing (Live edit policy)"
kind = "command"
run = "python3 tools/editor/play_contract.py live-edit-policy"
ci_job = "milestone-m11b"

# Declared for the reason the one above is. Renaming the engine's spelling of a policy breaks the
# kebab-case derivation the table and the enumeration are pinned to each other by.
# THE `known_gap` AND `known_gap_closes` MARKERS THAT STOOD HERE ARE DELETED, BY M11.c's CLOSING
# GATE AND ON THE LEDGER'S OWN INSTRUCTION. `just roadmap-milestone m11c` reported "THE GAP IS
# CLOSED, DELETE THE DECLARATION: m11b:live-edit-policy-exists now passes", and a marker that outlives its gap is the
# next thing nobody notices — `_summarise` fails the ledger for it in the other direction. The
# gap named M11.c as the rung that closes it and this is that act; the criterion itself, its
# `describe` and its `run` are untouched.

[criterion.falsifies]
mutate = "rename-token"
target = "src/gameplay/live/src/policy.cpp"
token = "recreate-entity"

# WHAT THIS CRITERION SAID BEFORE THE REPAIR ROUND, AND WHY IT WAS NOT A CHECK.
#
# It named the case "a world plays in each of the three modes" and required the filter to select it.
# The case existed, ran, and passed — by building THREE `PlaySession`s IN ONE PROCESS, giving each a
# different `PlayMode`, and comparing the three results. Three copies of one in-process simulation
# agree whatever the mode argument said, so the comparison measured nothing about locality; and
# `PlayModeSupport::runtime_launcher` was a literal `true` beside a comment reading "this build
# carries no launcher yet", so the availability it gated was a constant. M11.b's gate found it:
# "NO process launch of any kind … mode.cpp:66-68 says it itself".
#
# Deleting separate-process play outright would have left the old criterion GREEN. The repair is
# `cy/gameplay/play/launcher.h` (a real launch, supervised, over a versioned line protocol),
# `driver.h` (ONE command vocabulary, two localities) and a rewritten suite that drives the same
# stream through both and compares the two PROCESSES' results bit for bit.
[[criterion]]
id = "play-mode-round-trip"
describe = "one authored world, one command stream, and TWO PROCESSES — the editor's own and a second runtime process the engine launches — simulating to the same float, bit for bit. The spike this rung names asks whether the hosted runtime carries the modes WITHOUT A SECOND WORLD MODEL; the answer is only worth anything if the second locality is a second process, which is what the case now is and was not"
source = "tasks, design.md §1, editor-architecture (Play modes), live-editing (Play modes)"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
binary="$d/cy_test_integration_editor_play"
test -x "$binary" || { echo "no $binary — the suite integration.editor_play does not exist"; exit 1; }
# The second process itself. A tree that did not build it would report the mode unavailable, which
# is an honest answer to give about that tree and a useless one to accept here.
host="$d/cy_play_runtime_host"
test -x "$host" || { echo "no $host — separate-process play has no second process to launch"; exit 1; }
filter="a world plays in the editor's process and in a second one*"
out="$("$binary" "-tc=$filter" 2>&1)" || { echo "$out"; echo "the named case(s) FAILED"; exit 1; }
echo "$out" | tail -3
selected=$(printf '%s' "$out" | sed -nE 's/.*test cases: *([0-9]+) \|.*/\1/p' | head -1)
echo "the filter selected ${selected:-0} case(s) of the 1 it names"
test "${selected:-0}" -ge 1 || { echo "the named case(s) are not in integration.editor_play any more — renamed, deleted, or the filter is stale"; exit 1; }
'''
timeout_s = 3600
ci_job = "milestone-m11b"

[criterion.falsifies]
mutate = "rename-token"
target = "src/gameplay/play/tests/test_editor_play.cpp"
token  = "a world plays in the editor's process and in a second one"
note   = "the criterion names one case and checks that the filter SELECTED it, because `-tc=<a name that is not there>` exits zero having run nothing. Renaming the case leaves the suite green and takes the criterion red on the count. The MECHANISM mutation is the one on `separate-process-is-a-second-process` below: rename the host binary the launcher resolves and this case goes red too, on the comparison rather than on the count."

# THE MECHANISM, MUTATED AT ITS ROOT RATHER THAN AT A CASE NAME.
#
# `play-mode-round-trip` above is falsified by renaming its case, which catches a stale filter and
# nothing else. This one is falsified by renaming THE BINARY THE LAUNCHER RESOLVES: with
# `kRuntimeHostBinary` pointing at a name nothing builds, `runtime_launcher_available()` is false,
# `availability_of(SeparateProcess, …)` refuses, and every assertion about a second process fails —
# which is the property the literal `true` destroyed and the reason M11.b's gate could not tell a
# working mode from an absent one.
#
# It needs a COMPILED ENGINE, so `just roadmap-falsify` reports it "not provable here" and it is
# proved by hand: rename the constant, rebuild, watch the suite go red, restore, rebuild, watch it
# go green. The negative control without a rebuild is cheaper and also real — move
# `cy_play_runtime_host` out of the build directory and the suite fails at
# `runtime_launcher_available`.
[[criterion]]
id = "separate-process-is-a-second-process"
describe = "separate-process play launches a SECOND OPERATING-SYSTEM PROCESS, and the operating system agrees it is one: the child reports its own process identifier, the parent reads the same identifier from the kernel, and it is not the parent's. A play session built in the process that did the launching is REFUSED by name, which is the shape M11.b shipped and called three modes; and `--wait-for-debugger` starts the runtime stopped and builds nothing until it is released, which is the half of 'with the debugger attached' an engine can do"
source = "tasks 0.5 and 3.1, live-editing (Play modes), editor-architecture (Standalone play)"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
binary="$d/cy_test_integration_editor_play"
test -x "$binary" || { echo "no $binary — the suite integration.editor_play does not exist"; exit 1; }
host="$d/cy_play_runtime_host"
test -x "$host" || { echo "no $host — there is no second runtime process for this build to launch"; exit 1; }

# The engine actually calls a process launcher. Four string literals satisfied the old grep; this
# looks for the CALL, in the module that owns play mode.
grep -q "spawn_process" src/gameplay/play/src/launcher.cpp || {
    echo "src/gameplay/play/src/launcher.cpp does not spawn a process — separate-process play is a word again"; exit 1; }

# The three cases, by name, and the count is asserted because `-tc=<a name that is not there>` exits
# zero having run nothing.
names="a world plays in the editor's process and in a second one*
separate-process play refuses when there is no runtime host*
standalone play can be launched stopped so a debugger*
a play session in the launching process cannot call itself separate-process*"
found=0
while IFS= read -r filter; do
    out="$("$binary" "-tc=$filter" 2>&1)" || { echo "$out"; echo "FAILED: $filter"; exit 1; }
    selected=$(printf '%s' "$out" | sed -nE 's/.*test cases: *([0-9]+) \|.*/\1/p' | head -1)
    test "${selected:-0}" -ge 1 || { echo "not in the suite any more: $filter"; exit 1; }
    found=$((found + 1))
done <<NAMES
${names}
NAMES
echo "four named cases, ${found} selected and green"
test "${found}" -eq 4
'''
timeout_s = 3600
ci_job = "milestone-m11b"

[criterion.falsifies]
mutate = "rename-token"
target = "src/gameplay/play/include/cy/gameplay/play/launcher.h"
token  = "cy_play_runtime_host"
note   = "renaming the binary the launcher resolves leaves the engine building and every word in place, and takes the mode away: `runtime_launcher_available()` asks the filesystem for a file nothing produces, so the mode is unavailable and the suite fails at `runtime_launcher_available`, at `launch`, and at every comparison between the two processes. It needs a rebuild, so the prover reports it not provable in a source-only sandbox; the same break without a rebuild is `mv $CY_BUILD_DIR/cy_play_runtime_host elsewhere`."

[[criterion]]
id = "live-edit-applies-without-a-restart"
describe = "a field edited while a world is playing takes effect under its declared policy, and a field whose policy says restart restarts. The claim is that the policy is DECLARED per field rather than inferred, so the case edits one field of each policy class"
source = "tasks, live-editing"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
binary="$d/cy_test_integration_editor_live_edit"
test -x "$binary" || { echo "no $binary — the suite integration.editor_live_edit does not exist"; exit 1; }
filter='a field edited while playing*'
out="$("$binary" "-tc=$filter" 2>&1)" || { echo "$out"; echo "the named case(s) FAILED"; exit 1; }
echo "$out" | tail -3
selected=$(printf '%s' "$out" | sed -nE 's/.*test cases: *([0-9]+) \|.*/\1/p' | head -1)
echo "the filter selected ${selected:-0} case(s) of the 1 it names"
test "${selected:-0}" -ge 1 || { echo "the named case(s) are not in integration.editor_live_edit any more — renamed, deleted, or the filter is stale"; exit 1; }
'''
ci_job = "milestone-m11b"

# --- Section 2: the rest of the editor -------------------------------------------------------------

[criterion.falsifies]
mutate = "rename-token"
target = "src/gameplay/play/tests/test_editor_live_edit.cpp"
token  = "a field edited while playing"
note   = "as for play-mode-round-trip: the named case is the whole claim, and an empty selection is a pass unless the count is asserted. Renaming it takes the criterion red on that assertion."

[[criterion]]
id = "source-control-provider"
describe = "source control is behind a provider interface with a null implementation. M10's audit found seven hits for source control across the tree and every one of them a comment: `editor-documents-and-transactions`' last open requirement has been the same sentence since M8.a's gate wrote it"
source = "tasks, editor-documents-and-transactions (Source control integration)"
kind = "command"
run = '''
set -eo pipefail
impl=$(grep -rniIl "SourceControlProvider\|NullSourceControl" src/ editor/crates/ 2>/dev/null | grep -v "/target/" || true)
count=$(printf '%s' "$impl" | grep -c . || true)
echo "$count file(s) implement a source-control provider:"
printf '%s\n' "${impl:-  none — the seven hits in the tree are comments}"
test "$count" -ge 2
# THE GREP ALONE COULD NEVER FAIL FOR THE RIGHT REASON, so it is the first half and not the check.
# Two files naming a symbol is satisfied by two comments, which is exactly the state this criterion
# was declared over — M10's audit found seven hits and every one of them was a comment or a remedy
# string. The cases below EXECUTE the provider interface: the null provider's refusals, a provider
# that has no exclusive locking refusing rather than doing nothing, a provider swapped underneath a
# caller that named neither, and the panel that greys out what the provider cannot do. Each is
# named, so a case deleted or renamed fails here rather than quietly reducing what is checked.
#
# AND THE COUNT IS CHECKED, because `cargo test -- --exact <a name that is not there>` FILTERS TO
