# M12 — The Game: the exit criteria of the rung that proves the engine by using it.
#
# WHY THIS RUNG EXISTS. Sixty capabilities are recorded Working, each verified by the suite written
# alongside it, and NOTHING HAS EVER USED THEM TOGETHER. That is the gap no audit closes and no
# sweep reaches: a row observed only by its own tests is a row observed once. This ladder's whole
# argument is that a claim nobody observed is not a claim — eleven checks have shipped here unable
# to fail — and sixty rows at Working are sixty claims observed one at a time.
#
# AND THE SUBJECT WAS ALREADY DECLARED MISSING. `m11b:the-game-exists` has been a declared gap since
# M11.b: its check is `ls -d samples/*game*` and its answer is nothing. Three more travel with it —
# `-is-playable`, `-drawn`, `-is-honest-about-its-content`. No rung built the subject: M11.e's
# artefact is `samples/11-ship`, which `m11b:the-game-exists` itself calls "a packaging proof".
# THE FOUR CRITERIA MOVE HERE WITH THEIR SUBJECT, which is `delivery-roadmap`'s "A criterion follows
# its subject" — leaving them behind produces a check with nothing to check, and M11.d.5's own
# header records the same move being made for the same reason.
#
# SO 1.0 STOPS CLAIMING A GAME, AND THAT IS THE DELIBERATE PART. 1.0 IS THE ENGINE; THIS RUNG IS THE
# PROOF. M11.e's 1.0 record says so rather than leaving a reader to infer it.
#
# THE SLICE IS SCOPED BY WHAT IT EXERCISES, NOT BY WHAT IT CONTAINS. Art, balance, campaign and
# polish are out of scope. Every clause of the artefact exists because it drives a row that is
# currently claimed and unobserved: flow fields against `navigation`'s own "20,000 agents ordered to
# the same destination"; unit counts against instancing, indirect draws, GPU culling and HLOD; fog of
# war, an economy and a victory rule against `gameplay-framework`, which is recorded COMPLETE and
# whose specification requires exactly that scenario; and two clients on one seed against
# `simulation-and-determinism`.
#
# THE SECOND HALF IS NOT "FIX BUGS". It is that each defect the slice finds is repaired in a change
# carrying a test that FAILS WITHOUT THE REPAIR. A count of repairs is not a gate; a count of tests
# each watched going red is. A defect found in a row recorded Complete is a finding about the ladder
# and not only about the code, and the register records which.

schema = 1
id = "m12"
name = "The Game"

artefact = "samples/12-rts/ — a vertical slice sized to exercise named rows rather than to be good: 200 units ordered across one map on flow fields, fog of war, an economy and a victory rule, gameplay in Swift with hot reload used in anger, two clients agreeing on one seed, and a committed screenshot — beside a register of every defect it found, each with the test that fails without its repair."

notes = [
    "`just roadmap-milestone m12` is this recipe, so it cannot be one of the criteria it evaluates.",
    "THE FOUR GAME CRITERIA MOVED HERE FROM m11e WITH THEIR SUBJECT. They are not copied: two ledgers asserting one subject is how a rung closes on another's evidence.",
    "1.0 SHIPS FROM M11.e. This rung is the proof of it, not part of it, and no criterion here may be cited as a reason for M11.e to remain open.",
    "ART, BALANCE AND CAMPAIGN ARE OUT OF SCOPE. A criterion here that judges whether the game is GOOD is a criterion no machine can settle; what is checkable is that the rows it names were exercised together and that what it found was repaired with a test.",
]

[[criterion]]
id = "defects-carry-their-regression-test"
describe = "every defect the slice found is repaired in a change carrying a test that fails without the repair, and the register in the change's design.md records the defect, the row it belongs to, the test, and the tier that row held when it was found. A COUNT OF REPAIRS IS NOT A GATE; a count of tests each watched going red is. This is the project's own standing rule — 'any bug found needs a regression test added on the PR that solves it' — applied to the first consumer the engine has ever had, and it is the half of this rung that outlives the sample: the game is evidence, the tests are the residue"
source = "tasks 3, testing-and-quality, delivery-roadmap"
kind = "command"
run = '''
set -eo pipefail
register="openspec/changes/implement-m12-the-game/design.md"
test -f "$register" || { echo "no defect register at $register"; exit 1; }
defects=$(grep -cE '^\| *D[0-9]+ ' "$register" || true)
tested=$(grep -cE '^\| *D[0-9]+ .*\|.*(test|suite)[^|]*\|' "$register" || true)
echo "register: $defects defect(s), $tested carrying a named test"
test "${defects:-0}" -gt 0 || { echo "the register names no defect: a slice that found nothing did not exercise anything"; exit 1; }
test "${tested:-0}" -eq "${defects:-0}" || { echo "$((defects - tested)) defect(s) have no named test"; exit 1; }
'''
ci_job = "milestone-m12"

# THE MUTATION IS THE SHAPE THE RULE EXISTS TO REFUSE: a defect recorded with no test beside it. The
# register still parses, the rung still has findings, and the one thing that makes a finding durable
# is missing.
[criterion.falsifies]
mutate = "rename-token"
target = "openspec/changes/implement-m12-the-game/design.md"
token = "regression test"
note = "renaming the column the register's test cells are found by leaves every defect row present and none of them carrying a test, which is exactly the state this criterion refuses."
