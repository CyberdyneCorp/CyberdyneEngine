# M6 — Scale: the exit criteria, as data.
#
# The sources are openspec/changes/implement-m6-scale/tasks.md and the M6 row of docs/ROADMAP.md;
# every criterion below names which. `delivery-roadmap` requires each to be a recipe that exits
# zero, a command that exits zero, a benchmark within a threshold, or a committed artefact that is
# regenerated and compared — so an intention that cannot be run is a note at the bottom of this
# file, not a criterion.
#
# `ci_job` names the gate in tools/roadmap/gates.toml under which continuous integration runs the
# criterion. It is required on every criterion, including the ones this machine can evaluate: a
# criterion that passes locally and runs nowhere else is not a gate.
#
# --- THIS LEDGER DECLARES ONLY M6's OWN CRITERIA, AND THERE IS NO `m5b-green` ----------------------
#
# The ledger has been flat since M5 and `just roadmap-test` fails a ledger that invokes another one.
# `just roadmap-milestone m6` evaluates the permanent set directly — the criteria of every milestone
# whose `class = "milestone"` gate carries `state = "green"` and which sits BELOW M6 on the ladder,
# merged and deduplicated, each distinct check run exactly once — and then the criteria in this file.
# `criteria.build_plan` is the rule and tools/roadmap/README.md states it.
#
# That inheritance is only correct because `record.MILESTONES` now contains `m5b` between `m5` and
# `m6`: `criteria.rung` answers `len(MILESTONES)` for a milestone that is not on the ladder, so
# before that edit M5.5 sorted to the END and this ledger would have inherited M0–M5 and silently
# dropped M5.5's fifteen criteria. m5b.toml's header recorded the defect and section 0 of this
# milestone's tasks fixed it; this line is here so that the next inserted milestone is fixed FIRST
# rather than discovered by a ledger that quietly covered less than it said.
#
# A criterion here whose `run` string is identical to one an earlier ledger declared COLLAPSES into
# it and is reported under the earlier label — `m0:format` rather than `m6:format`. The static gates
# are declared anyway, as M3's, M4's, M5's and M5.5's are, because a ledger that does not name the
# checks its milestone had to satisfy is a ledger nobody can read.
#
# --- WHAT M6 ADDED TO THE PERMANENT SET, AND WHAT IT COSTS ----------------------------------------
#
# Twenty-two own criteria, of which fourteen run the C++ suites this milestone's seven new modules
# brought with them — src/world/, src/save/, src/servers/residency/,
# src/servers/render/virtual_texturing/, src/servers/render/culling/, src/servers/render/geometry/
# and tools/build/. Every one of those modules is ON BY DEFAULT: no `CY_*` option gates any of them,
# so every suite runs in every configuration `four-profiles` builds, which is the arithmetic behind
# that criterion's eight-hour budget growing rather than a new criterion beside it.
#
# The other eight are the static gates and the two whole-matrix commands, and every one of those
# COLLAPSES into an earlier ledger's identical declaration: one run of `just roadmap-milestone m6`
# is 134 distinct checks over 191 declarations, 112 of them inherited.
#
# --- THE ARTEFACT, AND WHY IT IS THREE CRITERIA RATHER THAN ONE -----------------------------------
#
# `samples/06-open-world` is one program and one driver, and the three ways of reaching it answer
# different questions. `open-world-artefact` is the CTest entry, so `just test-all` runs it and the
# `build-and-test` gate covers it on every pull request — the same call m5.toml made for `text` and
# m5b.toml for `agent-artefact`. `open-world-recipe` runs it through the workflow a contributor
# actually types. `screenshot-open-world` is the committed picture, which is what makes the
# milestone evaluable by LOOKING; `delivery-roadmap` allows a `path` criterion for exactly that —
# a committed artefact that is regenerated and compared — and the driver regenerates it with
# `--shot`.

schema = 1
id = "m6"
name = "Scale"
artefact = "samples/06-open-world — six kilometres of city cooked from a description, streamed continuously along a fixed route while two virtual textures page under the shared residency policy, saved, quit, reloaded into the state that was saved, torn down mid-flight three times, and then patched: one line of content changes, only the derivations that read it rebuild, and the same route out of the same installation directory reports a different world"

# Non-binding, because none can be settled by running something. `delivery-roadmap` requires a
# criterion that cannot be evaluated by a machine to be restated as a check or moved here.
notes = [
    "`just roadmap-milestone m6` is this recipe, so it cannot be one of the criteria it evaluates.",
    "tasks 10.6 — docs/roadmap/status.yaml, docs/roadmap/capability-matrix.md and docs/ROADMAP.md are the closing change's. `roadmap-tiers` below checks the record and `roadmap-record` checks that the record and openspec/specs/ agree; no tool can tell an intention from its correction.",
    "tasks 10.10 — opening the M7 change is `m7-open` below, which asks only that the change exists. Whether its named spike is the right one is a judgement.",
    "tasks 11.x — the gate itself. A milestone cannot make passing its own gate one of the criteria that gate evaluates.",
    "THE TWO OVERLAY MODELS. src/world/ defines `cy::world::PersistenceOverlay` (keyed by CellId, raw component bytes addressed by a RUNTIME component index) and src/save/ defines `cy::save::Overlay` (keyed by RegionKey, per-field value records addressed by reflect::TypeId). Both cite the same requirement and there is no criterion here that would fail because there are two: the artefact converts between them and says so at the point it does it (samples/06-open-world/run.cpp), which is the honest cost rather than a check. src/save/README.md carries the recommended resolution — hoist one `PersistentId` to layer 0 and have the world HOLD a save overlay — and it is a change for M7, because doing it after a save format has shipped is what migration is for.",
    "AN UNDECLARED READ IS BUILT AGAINST RATHER THAN CHECKED FOR. The spike's E9 showed a build serving a stale artefact and reporting success, and `build-and-packaging` calls that a DEFECT rather than a miss. The remedy is structural — a producer is handed `read`, `discover` and `write` and no filesystem, so an undeclared read is an `AccessViolation` — and `build-service` below exercises it. There is no criterion that opens a file behind the graph's back, because there is no way to write one that does not also have to be maintained forever.",
    "THE WINDOW ARTEFACT IS NOT REDECLARED HERE. m5b.toml's `window-artefact` and `window-recipe` run `just test-smoke -R editor_window` and `just run-editor-window`, and an identical `run` string collapses into the earlier declaration. What M6 changes about them is not the criterion but the world: `DocumentService::open` now produces a schema and nodes, so the drag those two criteria attempt reaches a Transform. They are inherited, not restated.",
]

