mutate = "delete-lines"
target = ".github/workflows/ci.yml"
token  = "just quality-layers"
note   = "this gate is the one that stops the CI copy of the gate list from drifting: a permanent gate whose commands no job runs fails it. The mutation takes the layering gate's command out of every job, which is exactly that drift — and it is the drift this rung has a live instance of, `m1:workflows`, recorded in task 8.4."

[[criterion]]
id = "generated-code"
describe = "the generated-code gate, all three commands — including the image codecs and texture encoders this rung's materials depend on, which M11.b adopts and this rung consumes"
