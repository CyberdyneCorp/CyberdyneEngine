echo "$count file(s) outside src/rendering/gi/ construct or consume a gi::SkyTerm:"
printf '%s\n' "${users:-  none — the seam cycle 2 is about has never been joined}"
test "$count" -ge 1
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
binary="$d/cy_test_integration_rendering_gi_sky"
test -x "$binary" || { echo "no $binary — the suite integration.rendering_gi_sky does not exist"; exit 1; }
filter='the sky term is built from the atmosphere*'
out="$("$binary" "-tc=$filter" 2>&1)" || { echo "$out"; echo "the named case FAILED"; exit 1; }
echo "$out" | tail -3
selected=$(printf '%s' "$out" | sed -nE 's/.*test cases: *([0-9]+) \|.*/\1/p' | head -1)
test "${selected:-0}" -ge 1 || { echo "the named case is not in integration.rendering_gi_sky any more"; exit 1; }
'''
