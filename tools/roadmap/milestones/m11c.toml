# NO `[criterion.falsifies]` HERE YET, AND THE REASON IS THIS CRITERION'S OWN SHAPE RATHER THAN AN
# OMISSION. `just roadmap-test` runs `falsify check`, so a prover cannot control it by running it
# again — `falsify._RUNS_THE_ROADMAP_TOOLING` refuses the tree control by name — and the only route
# left to a proof is the ordinary one: the criterion must PASS in the sandbox and go red under a
# mutation. It does not pass today: the ladder and `falsifiability.toml` disagree in 46 places
# (`just roadmap-falsify check`), which is what this criterion is reporting. The declaration it owes
# is M11.b's — `delete-lines "### Requirement:"` in `openspec/specs/audio/spec.md`, which makes the
# capability matrix over-count one row — and it goes in the moment the ladder is consistent enough
# for the positive control to pass. Declaring it before then would only move the digest and refuse
# the record for every other criterion in this file.

[[criterion]]
id = "four-profiles"
describe = "all four profiles build clean and just test-all is green in each. A renderer tuned in one profile and broken in another is a tuning rather than a fix, and this rung is entirely tuning"
source = "tasks 9.1"
kind = "command"
run = "for p in debug dev profile release; do d=\"${CY_BUILD_DIR:+${CY_BUILD_DIR}/$p}\"; CY_BUILD_DIR=\"$d\" just build-engine --profile \"$p\" || exit 1; CY_BUILD_DIR=\"$d\" just build-editor --profile \"$p\" || exit 1; CY_BUILD_DIR=\"$d\" just test-all --profile \"$p\" || exit 1; done"
timeout_s = 28800
ci_job = "profiles"

# --- Section 1: the material compiler and the shader system, first ---------------------------------

[[criterion]]
id = "material-compiler-at-complete-grade"
describe = "every requirement of `material-compiler` and `shader-system` maps to a test, a gate or a recorded exemption. They are first because image quality is expressed through them and because GI cannot be Complete on a material compiler that is not — twenty-one and thirteen requirements, both Working since M7 and M3 respectively"
source = "tasks 1, material-compiler, shader-system, testing-and-quality"
kind = "command"
run = "just quality-requirements material-compiler shader-system"
ci_job = "milestone-m11c"

[[criterion]]
id = "material-node-previews"
describe = "a node in the material graph previews through the RUNTIME compiler AND THE SHADER PIPELINE rather than through a second evaluator written for the editor. `unit.material_compiler` already proved the preview's TEXT is the shipping program's own; what had no caller anywhere in this tree was the third word of the requirement's own sentence — 'the same compiler, lowering, AND SHADER PIPELINE as runtime'. A preview is a picture and a picture comes from a compiled program, so this criterion's suite compiles one, and asks the same call with the compiler GONE to fail rather than fall back"
source = "tasks 1.1, material-compiler, editor-visual-language"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
# SMOKE AND NOT INTEGRATION, and the reason is measured rather than chosen: creating a Slang global
# session loads its core module and costs about a second of CPU before anything is compiled at all,
# which is the whole of the integration budget. `smoke.material_slang` beside it is smoke for the
# same reason and says so in its own CMake.
binary="$d/cy_test_smoke_material_preview"
test -x "$binary" || { echo "no $binary — the suite smoke.material_preview does not exist"; exit 1; }
filter='a node previews through the runtime compiler*'
out="$("$binary" "-tc=$filter" 2>&1)" || { echo "$out"; echo "the named case(s) FAILED"; exit 1; }
echo "$out" | tail -3
selected=$(printf '%s' "$out" | sed -nE 's/.*test cases: *([0-9]+) \|.*/\1/p' | head -1)
echo "the filter selected ${selected:-0} case(s) of the 1 it names"
test "${selected:-0}" -ge 1 || { echo "the named case(s) are not in smoke.material_preview any more — renamed, deleted, or the filter is stale"; exit 1; }
'''
ci_job = "milestone-m11c"

# THE MUTATION IS THE DEFECT THE REQUIREMENT NAMES, and it is production code rather than a test.
# Deleting the refusal in `compile_preview` turns "the compiler behind the preview is gone" from an
# error into a compilation that is attempted anyway — which is one line away from the fallback the
# requirement forbids, and is the line the negative control watches.
[criterion.falsifies]
mutate = "delete-lines"
target = "src/rendering/material/src/preview.cpp"
token = "return make_unexpected(kNoCompilerBehindThePreview);"
note = "the guard's body is ONE statement — the refusal is a named constant so that it can be — and deleting it leaves a tree that still COMPILES and a preview that is attempted with no compiler behind it. That is the defect, not a broken build: `smoke.material_preview` then gets a value back where the requirement says it must get an error, and goes red."

[[criterion]]
id = "lowering-stages-inspectable"
describe = "every lowering stage of a material is inspectable — graph, IR, optimised IR, generated source, compiled program. `editor-architecture`'s shader and material inspector requirement names all five, and a compiler whose stages cannot be read is one nobody can debug. FOUR OF THE FIVE EXISTED AS DATA AND NONE OF THEM COULD BE READ: no function in this tree turned a `Module` into anything a person can look at, so `material-compiler`'s 'its IR SHALL be dumpable in a readable form, before and after optimisation' had no implementation at all"
source = "tasks 1.3, material-compiler, shader-system, editor-architecture"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
binary="$d/cy_test_unit_material_compiler"
test -x "$binary" || { echo "no $binary — the suite unit.material_compiler does not exist"; exit 1; }
filter='every lowering stage is inspectable*'
out="$("$binary" "-tc=$filter" 2>&1)" || { echo "$out"; echo "the named case(s) FAILED"; exit 1; }
echo "$out" | tail -3
selected=$(printf '%s' "$out" | sed -nE 's/.*test cases: *([0-9]+) \|.*/\1/p' | head -1)
echo "the filter selected ${selected:-0} case(s) of the 1 it names"
test "${selected:-0}" -ge 1 || { echo "the named case(s) are not in unit.material_compiler any more — renamed, deleted, or the filter is stale"; exit 1; }
'''
ci_job = "milestone-m11c"

# THE MUTATION IS THE FIFTH STAGE'S OWN ABSENCE-WITH-A-REASON. `StageDump::reason` is what stops an
# inspection from presenting four stages as five: delete the assignment and the fifth stage comes
# back empty and unexplained, which is exactly the panel that shows what it has and calls it what it
# was asked for. The case reads the reason and goes red.
[criterion.falsifies]
mutate = "delete-lines"
target = "src/rendering/material/src/stages.cpp"
token = "backend.reason = kBackendStageIsOwed;"
note = "the reason is a named constant so that its assignment is one deletable statement and the tree still COMPILES without it. The fifth stage then comes back unavailable AND unexplained — the blank a panel would show as a stage — and the case that requires it to name `shader-system` goes red."

# --- Section 2: the eight rows that are the image ---------------------------------------------------

[[criterion]]
id = "gi-sky-term-constructed"
describe = "`gi::SkyTerm` is constructed from the atmosphere at one composition point, which is the whole of [cycle 2](docs/roadmap/dependencies.md). NOTHING IN THE TREE CONSTRUCTED ONE BEFORE THIS RUNG: `gi/lighting.h` described its two-colour gradient as 'the seam it will replace, not a second sky', `sky_light.h` carried a three-line adapter in a COMMENT and said a composition point writes it, and neither module linked the other — so all thirteen scenarios under 'Sky and atmosphere' were satisfied by that gradient with nothing able to say so. THE PLAN PROMISED THIS ROW COMPLETE AT M10 AND M10 DID NOT DELIVER IT. The check is in three parts and each catches a different fake: a LINK-GRAPH fact (a library, not a test, depends on `cy::rendering-gi` and `cy::rendering-sky` at once), a BEHAVIOUR (the term reaches the resolve and the picture moves), and a MEASUREMENT (a day of a moving sun against a full recomputation)"
source = "tasks 2.1-2.4, rendering-global-illumination, atmosphere-sky-and-clouds, dependencies.md cycle 2"
kind = "command"
run = '''
set -eo pipefail
# --- the link-graph half, which is what "the seam" means when it is not a paragraph ---------------
#
# A LIBRARY and not a test: `cy_add_module` with `TYPE STATIC`. A composition point that existed only
# as a test fixture would satisfy every behavioural case below and would join nothing.
joined=""
for cmake in $(grep -rl "cy_add_module" --include=CMakeLists.txt src/ | grep -v "/tests/"); do
    # COMMENTS STRIPPED FIRST, and the reason is measured rather than tidy: src/rendering/sky's own
    # CMakeLists says in capitals that it has NO DEPENDENCY on cy::rendering-gi, so a search over the
    # raw text counts the module that refuses the edge as one that has it.
    body=$(sed 's/#.*//' "$cmake")
    case "$body" in
        *cy::rendering-gi*) ;;
        *) continue ;;
    esac
    case "$body" in
        *cy::rendering-sky*) joined="$joined $cmake" ;;
    esac
done
echo "libraries under src/ that depend on cy::rendering-gi and cy::rendering-sky at once:${joined:- NONE}"
test -n "$joined" || { echo "the two modules do not reach each other: cycle 2 is still open"; exit 1; }
# And the term is CONSTRUCTED outside gi/, in a source file that is not a test.
builders=$(grep -rln "gi::SkyTerm{" --include='*.cpp' --include='*.h' src/ | grep -v "^src/rendering/gi/" | grep -v "/tests/" || true)
count=$(printf '%s' "$builders" | grep -c . || true)
echo "$count non-test file(s) outside src/rendering/gi/ CONSTRUCT a gi::SkyTerm:"
printf '%s\n' "${builders:-  none — the term is named but never built}"
test "$count" -ge 1
# --- the behaviour and the measurement -------------------------------------------------------------
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
binary="$d/cy_test_integration_rendering_gi_sky"
test -x "$binary" || { echo "no $binary — the suite integration.rendering_gi_sky does not exist"; exit 1; }
filter='the sky term is built from the atmosphere*,a moving sun is incremental*,cloud shadow reaches illumination*'
out="$("$binary" "-tc=$filter" 2>&1)" || { echo "$out"; echo "the named case(s) FAILED"; exit 1; }
echo "$out" | tail -3
selected=$(printf '%s' "$out" | sed -nE 's/.*test cases: *([0-9]+) \|.*/\1/p' | head -1)
echo "the filter selected ${selected:-0} case(s) of the 3 it names"
test "${selected:-0}" -ge 3 || { echo "the named cases are not in integration.rendering_gi_sky any more — renamed, deleted, or the filter is stale"; exit 1; }
'''
ci_job = "milestone-m11c"

# THE MUTATION IS THE FAKE THE WHOLE CRITERION IS AGAINST: a composition point that FITS the term from
# the atmosphere, reports its provenance honestly, and never installs it. The tree still compiles, the
# seam still exists in the link graph, the report still says `physical-atmosphere` — and the
# illumination system goes on answering out of whatever it was configured with, which is a
# two-colour gradient. That is exactly the shape a green criterion could have had, and the case that
# compares `system.sky_term()` against the seam's own term goes red on it.
[criterion.falsifies]
mutate = "delete-lines"
target = "src/rendering/sky_illumination/src/sky_illumination.cpp"
token = "system.set_sky_term(term_);"
note = "installing the term is ONE statement — `IlluminationSystem::set_sky_term` exists so that it can be, rather than the seam reaching into the settings — and deleting it leaves a tree that compiles and a sky nothing is lit by. `integration.rendering_gi_sky` then finds the system's term is not the one that was fitted, and the ground's indirect diffuse does not move between the placeholder and the atmosphere."

[[criterion]]
id = "denoiser-signals-have-producers"
describe = "every signal the denoiser declares has a producer THAT DRIVES THE FRAMEWORK, and the check names which do and which do not. `denoising` declares five — indirect diffuse, indirect specular, ray-traced shadows, ambient occlusion and stochastic direct — with a configuration each, and until this rung NOTHING IN THE TREE CALLED `Denoiser::denoise()` OUTSIDE THE DENOISER'S OWN TWO SUITES: `src/rendering/gi/` was the only module that named `Denoiser` and what it did with it was set its quality position from a budget lever. So the per-signal half of the specification was exercised by buffers written by the test asserting on them, and 'the framework handles five signals' was readable off an enumerator. The verdict here is the framework's OWN per-signal census after a frame of the real producer — a signal with no producer reports zero invocations, by name"
source = "tasks 2.5, denoising"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
binary="$d/cy_test_integration_render_gi_signals"
test -x "$binary" || { echo "no $binary — the suite integration.render_gi_signals does not exist"; exit 1; }
filter='every declared signal has a producer*,a visibility term is denoised as occlusion*'
out="$("$binary" "-tc=$filter" -s 2>&1)" || { echo "$out"; echo "the named case(s) FAILED"; exit 1; }
# The table `denoising` asks for, printed from what the framework recorded rather than from the
# enumerator's own range: every signal, its producer, and how many times it drove the denoiser.
echo "$out" | grep -E "produced=|decided fraction" || true
echo "$out" | tail -3
selected=$(printf '%s' "$out" | sed -nE 's/.*test cases: *([0-9]+) \|.*/\1/p' | head -1)
echo "the filter selected ${selected:-0} case(s) of the 2 it names"
test "${selected:-0}" -ge 2 || { echo "the named case(s) are not in integration.render_gi_signals any more — renamed, deleted, or the filter is stale"; exit 1; }
'''
ci_job = "milestone-m11c"

# THE MUTATION IS THE DEFECT ITSELF, ONE SIGNAL AT A TIME. `StochasticSignals::produce` routes each of
# the five in ONE statement — `signals.h` says that is for falsifiability rather than taste — so
# deleting the ambient-occlusion routing leaves a tree that compiles, a producer that still fills the
# buffer, and a framework with one declared signal nobody drives. Which is the tree as it stood before
# this rung, with four fewer signals missing.
[criterion.falsifies]
mutate = "delete-lines"
target = "src/rendering/gi/src/signals.cpp"
token = "route(routed, SignalKind::AmbientOcclusion, surfaces, history, denoiser, report);"
note = "the census then reports `AmbientOcclusion` with zero denoiser invocations and no reconstructed buffer, which is precisely the state `denoising`'s new requirement calls a finding — and the case goes red naming the signal."

[[criterion]]
id = "ray-tracing-capability-honest"
describe = "`Capability::RayTracing` reports what the DEVICE supports rather than what the backend compiled. IT WAS AN ENUMERATOR NOTHING SET FROM M3 UNTIL THIS RUNG and the M11.c spike confirmed it: every ray-traced tier in this tree ran its software fallback on an RTX 5060 whose driver lists `VK_KHR_ray_query` (design.md §1.3). The fix has a failure mode of its own and it is the one checked here — a capability set because the backend was COMPILED against the extension's headers, or because the extension is listed, without the device ever reporting the FEATURE. Six answers a device gives, each one withdrawn in turn: a capability derived from any five of them is a capability that can be reported for a device which cannot trace. AND THE CLAIM IS VULKAN ONLY — Metal and D3D12 are `rhi-and-render-graph`'s, which is M11.d's row, so this rung reports a one-backend capability rather than a portable one"
source = "tasks 2.6, 2.7, ray-tracing-infrastructure, rhi-and-render-graph"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
binary="$d/cy_test_unit_rhi"
test -x "$binary" || { echo "no $binary — the suite unit.rhi does not exist"; exit 1; }
filter='the ray-tracing capability reports the device*'
out="$("$binary" "-tc=$filter" 2>&1)" || { echo "$out"; echo "the named case(s) FAILED"; exit 1; }
echo "$out" | tail -3
selected=$(printf '%s' "$out" | sed -nE 's/.*test cases: *([0-9]+) \|.*/\1/p' | head -1)
echo "the filter selected ${selected:-0} case(s) of the 3 it names"
test "${selected:-0}" -ge 3 || { echo "the named case(s) are not in unit.rhi any more — renamed, deleted, or the filter is stale"; exit 1; }
# THE ONE-BACKEND CLAIM, CHECKED RATHER THAN WRITTEN DOWN. `describe` says Vulkan only; this is what
# makes that sentence go stale loudly rather than quietly if another backend grows the capability.
backends=$(grep -rl "set_ray_tracing_observation" --include='*.cpp' src/backends/ | grep -v "/tests/" | sed 's|src/backends/rhi/||;s|/src/.*||' | sort -u)
echo "backends that report a ray-tracing observation: $backends"
test "$(printf '%s' "$backends" | grep -c .)" -ge 1
'''
ci_job = "milestone-m11c"

# THE MUTATION IS ONE OF THE SIX ANSWERS, DELETED. `device_reports_ray_tracing` is written one line per
