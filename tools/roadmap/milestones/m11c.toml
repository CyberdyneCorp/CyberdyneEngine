[[criterion]]
id = "ray-tracing-on-the-device"
describe = "the DEVICE half of the same claim, which no machine without a GPU can settle. `unit.rhi` drives the derivation over a struct a test wrote; what it cannot check is whether the Vulkan backend fills that struct truthfully. This opens a real device, prints the six answers the driver gave — on the machine this was written on, an RTX 5060 reporting VK_KHR_acceleration_structure, VK_KHR_ray_query and VK_KHR_deferred_host_operations with both features — and requires the capability to be the derivation applied to them. It also runs the second of the two edits `ray-tracing-infrastructure`'s README has promised since M7: `service_config_for()` turning a device capability into `ServiceConfig::device_supports_ray_tracing`, with the renderer profile still a separate input so that 'disabled on capable hardware' stays the case the specification is about. WHAT IT DOES NOT CLAIM: that rays execute on the device. `AccelerationService` still traces `cy::Bvh` on the processor; what changed is that it no longer reports `Unsupported` on hardware that can trace"
source = "tasks 2.6, 2.7, ray-tracing-infrastructure"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
binary="$d/tests/render/cy_test_render_ray_tracing_capability"
