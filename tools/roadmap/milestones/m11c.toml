note   = "the claim is that the pass DOES dual quaternions. A dual quaternion is a UNIT one and both halves are divided by the real part's length; the mutation deletes the half that scales the dual part, so the rotation is still right and the TRANSLATION is short by the blend's own length. It compiles — `inverse` and `component` are both still used one line up — which is what makes it a defect rather than a build failure, and it is the shape a hand-written blend actually gets wrong. Watched: both dual-quaternion cases go red on the limb's length, 1.0 becoming 0.92, and the four matrix cases and the two blend-shape cases stay green. TWO OTHER MUTATIONS WERE TRIED AND REJECTED: deleting the line that applies the blend leaves `dual_apply` defined-but-not-used and `-Werror` stops the compile, which is a red no reader of this criterion could act on; and deleting a blend-shape delta line turns the OTHER half of this criterion red, which is equally good and says less about the half the criterion is named for."

[[criterion]]
id = "vfx-in-the-shot"
describe = "particles are in the artefact's frame, and something ASSERTS they are. An art-directed shot with no particles in it does not exercise `vfx-system`, and the row's own README records four absences by name — the fourth of which is an editor surface M11.b owes and this rung consumes. Three things have to hold and this criterion checks all three: the shot's own effect produces a population and that population is WHERE THE CAMERA IS LOOKING (`integration.vfx`, arithmetic, every machine); the frame DRAWS it and the drawn frame is compared against a COMMITTED reference (`render.vfx`, and the reference file must exist in the tree); and the published artefact says so — `docs/design/images/m11c-beauty-shot.manifest` carries the count the RENDERER reported, not the count the program published"
source = "tasks 5, vfx-system"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null

# 1. THE ARITHMETIC HALF, and it needs no graphics device. `particles are in the assembled frame:
#    the shot's air simulates and frames` cooks the artefact's own effect, settles it, and projects
#    every published record through the artefact's own camera. `> 0` would pass on a field behind
#    the camera; the case counts the ones inside the frustum.
binary="$d/cy_test_integration_vfx"
test -x "$binary" || { echo "no $binary — the suite integration.vfx does not exist"; exit 1; }
filter='particles are in the assembled frame*'
out="$("$binary" "-tc=$filter" 2>&1)" || { echo "$out"; echo "the named case(s) FAILED"; exit 1; }
echo "$out" | tail -3
selected=$(printf '%s' "$out" | sed -nE 's/.*test cases: *([0-9]+) \|.*/\1/p' | head -1)
echo "the filter selected ${selected:-0} case(s) of the 1 it names"
test "${selected:-0}" -ge 1 || { echo "the named case(s) are not in integration.vfx any more — renamed, deleted, or the filter is stale"; exit 1; }

# 2. THE PHOTOGRAPH, ASKED FOR BY NAME BEFORE IT IS RUN. This is `m7:virtual-geometry-gpu`'s guard
#    and `m11c:virtual-geometry-image`'s: `just test-render` passes `--no-tests=ignore`, so running
#    NOTHING is a pass, and ctest silently drops arguments it does not recognise. Listing is a
#    configure-time fact and needs no device.
ctest --test-dir "$d" -N -R '^render.vfx$' 2>/dev/null | grep -q 'render.vfx' || {
    echo "render.vfx is not registered in $d: nothing in this tree re-renders the artefact's air and"
    echo "compares it against a reference. Either the suite was renamed or deleted, or this tree was"
    echo "configured with no rendering backend; either way the picture is UNMEASURED."
    exit 1
}
# AND THE REFERENCE IS A COMMITTED FILE. A golden comparison whose reference the run itself writes
# is a comparison with itself. `test_shot_air.cpp` refuses to both write one and pass in the same
# run, and this is the other half of that: the file has to be here before the run starts.
test -f tests/render/references/beauty_shot_air.png || {
    echo "no tests/render/references/beauty_shot_air.png — there is no committed reference for the"
    echo "artefact's air to be compared against"
    exit 1
}
# Run it. On a machine with no device `DeviceFixture` reports the skip LOUDLY and the case passes,
# which is `tests/render/README.md`'s rule; on a machine with one this is the comparison.
just test-render -R '^render.vfx$'

# 3. AND THE PUBLISHED ARTEFACT CARRIES THE NUMBER. The still is a recipe a person runs, so what is
#    checked here is its provenance: a manifest that says zero motes, or no longer mentions them, is
#    a shot the row is not in any more.
manifest=docs/design/images/m11c-beauty-shot.manifest
test -f "$manifest" || { echo "no $manifest — the artefact has no provenance"; exit 1; }
drawn=$(sed -nE 's/^particles ([0-9]+) in ([0-9]+) draw\(s\).*/\1 \2/p' "$manifest" | head -1)
echo "the published manifest reports: particles ${drawn:-none}"
set -- ${drawn:-0 0}
test "${1:-0}" -ge 1 && test "${2:-0}" -ge 1 || {
    echo "$manifest does not report a drawn particle count: the published beauty shot has no air in"
    echo "it, or the manifest stopped publishing what the renderer reported"
    exit 1
}
'''
requires = "gpu"
reason = "step 2 photographs the air and compares it against a committed reference, which needs a graphics device, and step 3 reads a manifest only a capture on one can write. THE COST IS NAMED RATHER THAN HIDDEN: step 1 needs no device at all — it cooks the artefact's effect, settles it and projects every published record through the artefact's own camera — and gating the whole criterion on a GPU means a machine without one stops evaluating that half too. It is gated anyway, for `m11c:virtual-geometry-image`'s reason: a criterion that goes RED on a tree configured with no rendering backend is red for something that is not a defect, and a reader cannot tell that red from a real one. `frame-passes-through-post` carries the structural claim about this frame on every machine"
ci_job = "milestone-m11c"

# THE MUTATION BREAKS THE THING THE PICTURE IS OF, which is the only mutation that proves a golden
# image. Breaking the comparison, the tolerance or the reference's path proves that a file is being
# read and says nothing about whether the air is still in the frame. `publish_sprites` is the seam
# between the simulation and the renderer, and its one job is to REBASE a world-space particle
# against the camera — `ParticleInstance` has no world position and nowhere to put one. Deleting the
# z component of that rebase leaves every record with `position[2] = 0`, its default: the field
# simulates perfectly, publishes 996 motes, keeps every size and every radiance, and lands in the
# plane through the camera, where this shot's frustum is not. It compiles — `presentation` and
# `camera_position` are both still used on the two lines either side — which is what makes it a
# defect rather than a build failure, and it is the exact shape of "an effect that simulates and
# photographs as nothing" that the case's own header says it exists to catch.
[criterion.falsifies]
mutate = "delete-lines"
target = "src/vfx/src/runtime.cpp"
token  = "record.position[2] = presentation.position[2] + instance.position.z - camera_position.z;"
note = "measured against build/m11c-final on an RTX 5060. UNMUTATED: `integration.vfx` reports 996 motes published, 0 dropped, 3 emitters, 901 of 996 inside the artefact's frame and a brightest radiance of 35 811.6, 12 assertions green; `render.vfx` renders the same frame twice BIT-IDENTICALLY (0 of 129 600 texels differ, maximum channel delta 0, which is where the tolerance comes from rather than from a round number), differs from the same frame with an EMPTY ring by 4 713 texels of 129 600 — 3.64%, mean |delta| 20.7/255 where they differ, worst channel 255 — and matches the committed reference exactly, 386 assertions green. MUTATED: the framing collapses to 0 of 996 and `integration.vfx` goes red on that assertion ALONE — the population, the emitter count, the drawability and the radiance all stay green, so the verdict names what broke — and `render.vfx` goes red on six: the empty-ring control falls to 0 texels of difference (the air draws nothing at all), and the frame moves 4 111 texels of 129 600 away from the committed reference, 2 802 of them away from any high-contrast edge, worst channel delta 255 at (308, 173). RESTORED: `md5sum` back to the HEAD blob (1dfc6ce1ab3d3ba3681d167c3ceaaaa1), both suites green again. TWO OTHER MUTATIONS WERE TRIED AND REJECTED: deleting `stage.spawn_count(...)` from `embers.cpp` leaves its `rate` node defined-but-not-used and -Werror stops the compile, which is a red no reader of this criterion could act on; and deleting one of the three `kEmberEmitters` rows turns the criterion red on the POPULATION band rather than on the framing, which says less about the half the criterion is named for."


[[criterion]]
id = "vfx-trails-in-the-shot"
describe = "a renderer kind beyond `Sprite` and `Mesh` is COMPOSITED, and it is composited into the artefact. `src/vfx/README.md` recorded that the six kinds beyond the two publish rows and nothing draws them; M11.c task 6.3 builds `StripRenderer`, which draws what `publish_ribbons`, `publish_trails` and `publish_beams` derive, and puts it in the beauty shot: every ember carries a trail. Three things are checked: the shot's trails have the right SHAPE — one strip a mote, each within half a metre of its head, framed by the artefact's camera (`integration.vfx`, every machine); the frame DRAWS them — `render.vfx` renders the shot's air with and without the trails, the motes present in both, and requires the difference, and compares the whole against a committed reference; and the published manifest carries the strip renderer's own count. Decal, Light and Volume are NOT composited and this criterion does not claim them"
source = "tasks 6.3, vfx-system"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null

# 1. THE SHAPE, and it needs no device: one strip a mote, never two motes joined, and in shot.
binary="$d/cy_test_integration_vfx"
test -x "$binary" || { echo "no $binary — the suite integration.vfx does not exist"; exit 1; }
filter="particles are in the assembled frame: every mote's trail*"
out="$("$binary" "-tc=$filter" 2>&1)" || { echo "$out"; echo "the named case FAILED"; exit 1; }
echo "$out" | grep "trails" || true
selected=$(printf '%s' "$out" | sed -nE 's/.*test cases: *([0-9]+) \|.*/\1/p' | head -1)
test "${selected:-0}" -ge 1 || { echo "the named case is not in integration.vfx any more — renamed, deleted, or the filter is stale"; exit 1; }

# 2. THE PICTURE, asked for by name first (`m7:virtual-geometry-gpu`'s guard: `just test-render`
#    passes `--no-tests=ignore`, so running nothing would be a pass).
ctest --test-dir "$d" -N -R '^render.vfx$' 2>/dev/null | grep -q 'render.vfx' || {
    echo "render.vfx is not registered in $d: nothing photographs the trails"; exit 1; }
test -f tests/render/references/beauty_shot_air.png || {
    echo "no committed reference for the shot's air"; exit 1; }
just test-render -R '^render.vfx$'

# 3. THE PUBLISHED ARTEFACT CARRIES THE STRIP RENDERER'S COUNT.
manifest=docs/design/images/m11c-beauty-shot.manifest
test -f "$manifest" || { echo "no $manifest"; exit 1; }
line=$(sed -nE 's/^trails ([0-9]+) vertices in ([0-9]+) strip\(s\), ([0-9]+) segment\(s\), ([0-9]+) draw\(s\).*/\2 \3 \4/p' "$manifest" | head -1)
echo "the published manifest reports: strips segments draws = ${line:-none}"
set -- ${line:-0 0 0}
test "$1" -ge 1 && test "$2" -ge 1 && test "$3" -ge 1 || {
    echo "$manifest does not report drawn trails: the published beauty shot has no strips in it"; exit 1; }
'''
requires = "gpu"
reason = "step 2 photographs the trails on a graphics device and step 3 reads a manifest only a capture on one can write, for `m11c:vfx-in-the-shot`'s reason; step 1 needs no device and is gated with the rest, which is the same named cost that criterion carries"
ci_job = "milestone-m11c"

# THE MUTATION BREAKS THE COMPOSITING and nothing upstream of it: the publication still derives
# every trail, the ring is still written and the extension still runs and counts its draw — only the
# draw itself is gone. That is the defect this criterion exists for, "rows nothing draws", and the
# only check that can see it is the photograph.
[criterion.falsifies]
mutate = "delete-lines"
target = "src/rendering/particles/src/strip_renderer.cpp"
token  = "commands.draw((renderer->live() - 1U) * kVerticesPerSegment, 1, 0, 0);"
note = "RUN BY HAND against build/m11c-vfx on an RTX 5060, NOT YET RECORDED — `prove --mutate-the-tree` refuses a tree other phases are writing, so the Record phase runs `just roadmap-falsify prove m11c --only vfx-trails-in-the-shot --build-dir <tree> --mutate-the-tree --record` on a clean one. UNMUTATED: the criterion exits 0; `integration.vfx` reports 7 692 vertices in 984 strips for 996 motes, 0 dropped, the longest trail 0.235 m behind its mote and 892 of 984 inside the artefact's frame; `render.vfx` renders the shot twice bit-identically, the trails alone move 3 215 of 129 600 texels (2.48%, mean |delta| 15.2/255 where they differ, worst 210) and the frame matches `beauty_shot_air.png`; the manifest reports 984 strips, 6 708 segments, 1 draw. MUTATED: the publication, the ring, the extension and its draw COUNTER are all unchanged — `integration.vfx` stays green and the strip report still says 1 draw — and `render.vfx` goes red on four: the trails-only control falls to 0 texels, its mean to 0, and the frame moves 3 077 texels from the committed reference, 1 824 of them away from any high-contrast edge. RESTORED: md5 verified, `render.vfx` green again"
[[criterion]]
id = "remaining-rows-at-complete-grade"
describe = "the five rows this rung promotes that NO OTHER criterion reads at Complete grade — `rendering-culling-and-lod`, `atmosphere-sky-and-clouds`, `rendering-architecture`, `rendering-geometry-and-resources` and `vfx-system`, 9, 13, 16, 11 and 26 requirements — map to a test, a gate or a recorded exemption. The other ten of the fifteen are read by `material-compiler-at-complete-grade` and `image-rows-at-complete-grade`; these five were measured BY HAND at three successive closes and by nothing else, which is the one thing this ladder refuses everywhere it looks"
source = "tasks 4, 5, 6, testing-and-quality"
