if delta < 20.0:
    sys.exit("the post chain changed almost nothing, so the picture did not go through it")

extrema = graded.convert("L").getextrema()
spread = extrema[1] - extrema[0]
print(f"the graded frame spans {extrema[0]}..{extrema[1]} in luma")
