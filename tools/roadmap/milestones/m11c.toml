echo "$out" | tail -4

python3 - <<'PYCHECK'
import pathlib
import sys

texture = pathlib.Path("tools/import/src/texture.cpp").read_text()
if "header.encoded = can_encode(format);" not in texture:
    sys.exit("`CookedTexture::encoded` is no longer written from `can_encode`: the cooked header can "
             "again claim a compression that did not happen")

encode = pathlib.Path("tools/import/src/block_encode.cpp").read_text()
marker = "bool can_encode("
if marker not in encode:
    sys.exit("tools/import/src/block_encode.cpp no longer declares can_encode")
body = encode[encode.index(marker):]
body = body[:body.index("}") + 1]
produced = [name for name in ("BC7", "BC5", "BC4") if name in body]
absent = [name for name in ("BC6H", "ASTC_4x4", "ASTC_6x6") if name not in body]
print(f"can_encode produces {', '.join(produced)}")
print(f"still named by select_format and produced by nobody: {', '.join(absent) or 'nothing'}")
if len(produced) < 3:
    sys.exit(f"the encoder no longer produces {set(('BC7','BC5','BC4')) - set(produced)}")
