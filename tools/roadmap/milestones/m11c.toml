'''
requires = "gpu"
reason = "it opens a Vulkan device and reads what the driver answered about ray tracing, which a machine with no GPU cannot do; the derivation it checks against is covered device-free by `ray-tracing-capability-honest`, so a green here must mean the backend and not the arithmetic. AND THIS HOST HAS ONE GPU VENDOR AND ONE BACKEND — design.md §1.3 and §3.3 — so what it settles is one driver's answer through the Vulkan backend, and the portable claim is `rhi-and-render-graph`'s at M11.d"
ci_job = "milestone-m11c"

