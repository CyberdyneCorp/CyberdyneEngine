filter='the ray-tracing capability agrees with what the device reported*,the ray-tracing service is configured from the device*'
out="$("$binary" "-tc=$filter" 2>&1)" || { echo "$out"; echo "the named case(s) FAILED"; exit 1; }
echo "$out" | grep -E "RayTracing=|availability with the profile|no Vulkan device" || true
echo "$out" | tail -3
selected=$(printf '%s' "$out" | sed -nE 's/.*test cases: *([0-9]+) \|.*/\1/p' | head -1)
test "${selected:-0}" -ge 2 || { echo "the named case(s) are not in render.ray_tracing_capability any more"; exit 1; }
# A SKIP IS NOT A PASS, AND TASK 9.3 MEASURED THIS ONE PASSING OVER NOTHING. `tests/render/device.h`
# prints the line below and RETURNS when no Vulkan device can be created, so the case exits 0 having
# executed zero assertions. `requires = "gpu"` does not catch it: `criteria._has_gpu()` asks whether
# /dev/dri holds a render node, which is a different question from whether a Vulkan device can be
