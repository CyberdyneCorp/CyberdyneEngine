[[criterion]]
id = "gi-sky-term-constructed"
describe = "`gi::SkyTerm` is constructed from the atmosphere at one composition point, which is the whole of [cycle 2](docs/roadmap/dependencies.md). NOTHING IN THE TREE CONSTRUCTS ONE TODAY: `gi/lighting.h` still describes its two-colour gradient as 'the seam it will replace, not a second sky', `sky_light.h` carries a three-line adapter and says a composition point writes it, and neither module links the other. THE PLAN PROMISED THIS ROW COMPLETE AT M10 AND M10 DID NOT DELIVER IT"
source = "tasks 2, rendering-global-illumination, dependencies.md cycle 2"
kind = "command"
run = '''
set -eo pipefail
users=$(grep -rln "SkyTerm" --include='*.cpp' --include='*.h' src/ | grep -v "^src/rendering/gi/" || true)
