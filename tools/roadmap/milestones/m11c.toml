# WHY THIS CRITERION EXISTS AND WHY IT IS THE THIRD RATHER THAN A WIDENING OF THE SECOND. Fifteen
# rows are promoted by this rung and two criteria between them read ten at Complete grade. The other
# five were measured with this exact recipe at the close, by hand, and reported in the record — a
# measurement, not a check: it is not in the ledger, CI never runs it, and nothing goes red the day
