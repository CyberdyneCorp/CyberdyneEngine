[[criterion]]
id = "temporal-anti-aliasing-accumulates"
describe = "THE TEMPORAL RESOLVE DOES WHAT ITS NAME SAYS, and a pinned capture reproduces it byte for byte. `6514c3d` put a temporal pass in the frame and its device suite asserted that the pass RAN (`temporal_resolves == 1`); nothing asserted what it DID, and measured, it did not accumulate: pinned jitter held ONE sample forever, so a pinned capture accumulated one offset; the resolve re-sampled a still camera's history at a different sub-pixel offset every frame, so its picture changed frame to frame as much as an unresolved one (1.057/255 against 0.997/255 with the history cut every frame); history was imported as `Undefined`, which `rhi/types.h` defines as discarded; frames with NO temporal stage were jittered anyway; and motion vectors were derived against a WORLD view for camera-RELATIVE positions, so a still camera away from the origin had motion. This runs the device cases that measure accumulation against a cut-every-frame control and determinism across two pinned runs, and the device-free cases for the other three"
source = "tasks 3.4, temporal-rendering"
kind = "command"
run = '''
set -eo pipefail
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null

check() {
    binary="$1"; filter="$2"; want="$3"
    test -x "$binary" || { echo "no $binary"; exit 1; }
    out="$("$binary" "-tc=$filter" 2>&1)" || { echo "$out" | grep -vE "^graphics validation"; echo "the named case(s) in $binary FAILED"; exit 1; }
    selected=$(printf '%s' "$out" | sed -nE 's/.*test cases: *([0-9]+) \|.*/\1/p' | head -1)
    echo "$(basename "$binary"): the filter selected ${selected:-0} case(s) of the $want it names"
    test "${selected:-0}" -ge "$want" || { echo "the named case(s) are not in $binary any more — renamed, deleted, or the filter is stale"; exit 1; }
    last_out="$out"
}
# 1. DEVICE-FREE: no jitter without a temporal stage, history imported as what it was left in,
#    motion derived about this frame's camera, and a pinned sequence that still steps.
check "$d/cy_test_integration_render_assembly" 'a chain with no temporal stage draws an UNJITTERED frame*,the temporal history is imported as what the last frame left it in*' 2
check "$d/cy_test_integration_render_pipeline" 'motion vectors are derived about THIS frame*' 1
check "$d/cy_test_unit_render_temporal" 'pinned? the sequence still MOVES*' 1

# 2. THE DEVICE: accumulation against its own cut-every-frame control, and determinism.
check "$d/cy_test_render_pipeline" 'temporal anti-aliasing*' 2
printf '%s\n' "$last_out" | grep -E '^temporal' || true
# A SKIP IS NOT A PASS — `material-texture-is-bound`'s guard, for its reason.
if printf '%s\n' "$last_out" | grep -q 'no requested graphics device on this machine'; then
    echo "the device cases SKIPPED for want of a device: that is not a pass"; exit 1
fi
assertions=$(printf '%s' "$last_out" | sed -nE 's/.*assertions: *([0-9]+) \|.*/\1/p' | head -1)
test "${assertions:-0}" -ge 12 || { echo "the device cases executed ${assertions:-0} assertion(s): they measured nothing"; exit 1; }
'''
requires = "gpu"
reason = "whether a resolve accumulates is a property of the PICTURE: the frame-to-frame change of a still camera under a moving jitter, measured against the same scene with the history cut every frame, and only a graphics device renders either. The device-free halves run first and are what a machine with no GPU could carry; they are gated with the rest for `m11c:virtual-geometry-image`'s reason. AND THIS HOST HAS ONE GPU VENDOR — design.md section 1.3"
ci_job = "milestone-m11c"

# THE MUTATION IS THE PINNED-JITTER DEFECT IN THE SHAPE IT HAD: the sequence stops stepping. The tree
# still builds — the line is the whole `else` body — the resolve still runs every frame and the
# manifest still lists the stage, and the picture is one sample accumulated sixteen times.
[criterion.falsifies]
mutate = "delete-lines"
target = "src/rendering/temporal/src/jitter.cpp"
token = "index_ = (index_ + 1U) % config_.length;"
note = "PENDING the Record phase: see openspec/changes/implement-m11c-image/tasks.md 3.4 for the hand-run numbers"

# THIS CRITERION WAS `just test-render virtual-geometry --shaded --compare-golden` AND IT MEASURED
# NONE OF THOSE THREE WORDS. `just test-render` is `_ctest render`, which selects with
# `--label-regex "^render$" --no-tests=ignore` and then appends whatever else was passed; ctest
# SILENTLY DISCARDS a positional argument it does not recognise. Measured against
# `build/m11c-close-gate`, `ctest … -N virtual-geometry --shaded --compare-golden`,
# `… -N sky --times-of-day 4 --compare-golden` and `… -N zzzz-no-such-thing` each select THE SAME 17
# render cases — so the criterion's verdict was "the whole render label is green", `--no-tests=ignore`
# would have made an EMPTY label green too, and no state of the tree could make it say anything about
# a shaded capture. That is instance 3 of the defect `tools/roadmap/falsify.py` enumerates, committed
# again; `m7:virtual-geometry-gpu` above already writes the registration check that avoids it, and
# names `--no-tests=ignore` in its own error message. The shape below is that one.
# ITS SUBJECT CHANGED AT TASK 4.3. `samples/07-fidelity` — whose frame this photographs — draws its
# clusters in the FORWARD FRAME's `virtual geometry` stage now, rasterised in hardware, rather than
# with the compute rasteriser in a graph of its own; the suite asserts which one ran, and the
# reference was regenerated for it. The note under `[criterion.falsifies]` carries both measurements.
[[criterion]]
id = "virtual-geometry-image"
describe = "the virtual-geometry and virtual-shadow evidence is an image of the SHADED result compared against a committed reference, rather than a normals debug view. The capture in the tree today is `docs/design/images/virtual-geometry-shaded.png`, written by `just capture-virtual-geometry` — a recipe a person runs, which nothing re-photographs and nothing compares — and the only cases in `render.virtual_geometry_gpu` are traversal, residency, occlusion and visibility-buffer cases. So the row's picture is asserted by nobody: this names the suite that would assert it and the reference it would assert against"
source = "tasks 2, virtual-geometry, virtual-shadows"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
# THE SUITE IS ASKED FOR BY NAME BEFORE IT IS RUN, which is `m7:virtual-geometry-gpu`'s own guard and
# the whole reason this criterion was rewritten: `just test-render` passes `--no-tests=ignore`, so
# running nothing is a pass, and ctest drops arguments it does not know.
ctest --test-dir "$d" -N -R '^render.virtual_geometry_shaded$' 2>/dev/null | grep -q 'render.virtual_geometry_shaded' || {
    echo "render.virtual_geometry_shaded is not registered in $d: nothing in this tree photographs the SHADED"
    echo "virtual-geometry frame and compares it against a reference. The committed picture,"
    echo "docs/design/images/virtual-geometry-shaded.png, is written by a recipe a person runs and is asserted by"
    echo "nothing. Either the suite has been renamed or deleted, or this tree was configured with no rendering"
    echo "backend; either way the image is UNMEASURED."
    exit 1
}
# AND THE REFERENCE IS A COMMITTED FILE. A golden comparison whose reference the run itself writes is
# a comparison with itself, which is what `tests/render/README.md` says a reference is not.
test -f tests/render/references/virtual_geometry_shaded.png || {
    echo "no tests/render/references/virtual_geometry_shaded.png — there is no committed reference for a shaded"
    echo "virtual-geometry capture to be compared against"
    exit 1
}
just test-render -R '^render.virtual_geometry_shaded$'
'''
requires = "gpu"
reason = "a shaded capture needs a graphics device, AND THIS HOST HAS ONE GPU VENDOR — the M11.c spike measured every picture it took against one driver's rasterisation and one vendor's floating point, so a green here is a claim about this vendor and not about the image; `frame-passes-through-post` above carries the structural claim on every machine"
ci_job = "milestone-m11c"

# THE MUTATION BREAKS THE THING THE PICTURE IS OF, WHICH IS THE ONLY MUTATION THAT PROVES A GOLDEN
# IMAGE. Breaking the comparison, the tolerance or the reference's path proves that a file is being
# read; it says nothing about whether the frame is still a frame. `Finaliser::emit_hierarchy()` is
# where a cooked cluster learns how many children it has, and without that one assignment every
# cluster reports zero — so the GPU traversal's `clusterTooCoarse(...) && cluster.childCount > 0`
# is never true, the hierarchy STOPS DESCENDING, and the device draws each instance's coarsest
# cluster and nothing beneath it. The cook still succeeds, the frame still renders, validation is
# still clean; the picture is of coarser geometry.
#
# RE-MEASURED AT TASK 4.3, BECAUSE THE SUBJECT CHANGED — kept in this comment rather than in the
# note below, because the note is part of the proof's digest and the recorded proof is of the same
# command and the same mutation. The sample now draws its clusters in the forward frame's `virtual
# geometry` stage (the hardware rasteriser) and the reference was regenerated for it: the compute
# path still matched the OLD reference exactly (0 of 57,600), the forward path moved 15 texels, 7
# beyond tolerance. Against build/m11c-vg with this mutation applied by hand: clusters decoded
# 3,324 -> 246, 45,180 of 57,600 texels move — 78.44%, 37,882 of them off any high-contrast edge,
# worst channel delta 188 — and the same three assertions go red. Restored: md5sum back to the HEAD
# blob, the suite green at 2 of 2 cases and the frame bit-identical to the new reference.
[criterion.falsifies]
mutate = "delete-lines"
target = "src/rendering/virtual_geometry/src/build.cpp"
token = "out.clusters[index].child_count = out.groups[from].member_count;"
note = "measured against build/m11c-final on an RTX 5060: unmutated the suite is 2 cases and 28 assertions green, and the frame is BIT-IDENTICAL to the committed reference across three separate processes — 0 of 57,600 texels differ, maximum channel delta 0, which is where the tolerance comes from rather than from a round number. With the line gone the traversal decodes 246 clusters instead of 3,324, coverage falls from 57,600 to 55,322, and 46,257 of 57,600 texels move — 80.31% of the frame, 38,878 of them away from any high-contrast edge, worst channel delta 188 of 255. The second row was mutated separately and is recorded in the suite's own header: deleting `entry.state = PageState::Resident;` from `ShadowPageCache::record_render` leaves every rasterised page non-resident, drops the shadowed pixel count from 24,649 to 0, and moves 24,578 texels — 42.67%."

# TASK 4.3, AND THE LINK GRAPH WAS THE MEASUREMENT. Until this criterion `src/rendering/virtual_geometry/
# README.md` said "Nothing in the tree links `cy::rendering-virtual-geometry` from
# `cy::rendering-forward`": every picture of a cluster had been drawn by a harness graph with the
# compute rasteriser in it, and the forward frame had no stage virtual geometry could be in. This asks
# for the suite that draws them IN the forward frame — `ForwardFrame`'s `virtual geometry` stage,
# rasterised in hardware into the frame's own depth — by name before it runs it, for
# `m7:virtual-geometry-gpu`'s reason: `just test-render` passes `--no-tests=ignore`.
[[criterion]]
id = "virtual-geometry-in-the-forward-frame"
describe = "virtual geometry is a STAGE OF THE FORWARD FRAME'S PASS ORDER and is rasterised there in hardware — the path `virtual-geometry` names as the default. `render.virtual_geometry_forward` builds a `ForwardFrame` whose `virtual geometry` stage is recorded by `vg::ForwardVisibility`, draws one traversal through it and through the compute rasteriser, and requires the two visibility buffers to agree to within the pixels a fill rule decides, the resolve over the hardware buffer to match the CPU reconstruction at every covered pixel, the stage's callback to have run, and a depth prepass that writes a plane through the object to hide exactly the part of it behind the plane. Before this rung nothing in the tree linked the module from the forward frame, and the only rasteriser that had ever run was the compute one. WHAT IT DOES NOT CLAIM: that the forward frame SHADES virtual geometry — no stage reads the visibility target into `FrameResources::color`, and `forward_visibility.h` says so"
source = "tasks 4.3, virtual-geometry"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
ctest --test-dir "$d" -N -R '^render.virtual_geometry_forward$' 2>/dev/null | grep -q 'render.virtual_geometry_forward' || {
    echo "render.virtual_geometry_forward is not registered in $d: nothing in this tree draws virtual"
    echo "geometry in the forward frame's pass order. Either the suite was renamed or deleted, or this"
    echo "tree was configured with no rendering backend; either way the stage is UNMEASURED."
    exit 1
}
just test-render -R '^render.virtual_geometry_forward$'
'''
requires = "gpu"
reason = "the suite draws on a device and compares two rasterisers' buffers, which no machine without a GPU can do; `unit.render_forward` carries the device-free half — the stage's place in the pass order, its targets, its declared reads and its refusal of MSAA — on every machine"
ci_job = "milestone-m11c"

# THE MUTATION TAKES THE DRAW OUT OF THE STAGE AND LEAVES THE STAGE. With the callback assignment gone
# the frame still declares `virtual geometry`, its visibility target, its depth write and every read
# the callback would have made — so the pass order, the graph and the barriers are what they were —
# and nothing records into it. It compiles: `record_stage` is a member function and an unreferenced
# one is not a warning. That is exactly the state task 4.3 began from, one stage further on: a
# frame with a place for virtual geometry and nothing drawing there.
[criterion.falsifies]
mutate = "delete-lines"
target = "src/rendering/virtual_geometry/src/forward_visibility.cpp"
token = "description_.callbacks[stage] = FramePassCallback(&record_stage, this);"
note = "measured in build/m11c-vg on an RTX 5060, validation and synchronisation validation on. UNMUTATED: 3 cases green; 23 visible clusters, 2,529 pixels covered by both rasterisers, NONE by one alone, all 2,529 naming the same cluster AND the same triangle; 2,529 of 2,529 resolved normals agreeing with `reconstruct_surface`; a prepass plane at z = 0.8 leaves 1,325 of 2,529 pixels (52.4%, against 53% from the geometry) and none of them behind it; 0 validation errors. MUTATED (applied by hand, the prover having been refused a tree other agents were editing): 2 of 3 cases and 10 assertions red — `stages_recorded` and `draws` 0, 0 pixels covered by the hardware path against 2,529 by the compute one, 0 pixels reconstructed, both bins empty, and the prepass case covering 0 with or without its plane; the refusals case stays green, as it should. RESTORED: md5sum back to 4d16adccde76b0da44b2ca84db780f5e and the suite green again at 3 of 3 cases, 1,377 assertions."

[[criterion]]
id = "lighting-and-shadow-suites"
describe = "the lighting, shadow, GI, denoising, post, temporal and virtual-geometry suites are green together. Eight rows have been at Working since M7 and each has been gated separately; this is the one run in which they are all true at once"
source = "tasks 2"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
# THE EIGHT ROWS' SUITES, SPELLED AS `cy_add_test` DECLARES THEM. This ledger was written with the
# ROW names — `unit.rendering_lighting`, `unit.denoising`, `unit.temporal_rendering`,
# `unit.virtual_shadows` — and NOT ONE OF THOSE FOUR IS A SUITE IN THIS TREE, so the pattern matched
# nothing and the `registered` guard below would have failed for a reason that has nothing to do
# with the eight rows being green. The suites are named here and the guard is what keeps the list
# honest when one is renamed.
pattern='^(unit.render_lighting|unit.render_shadows|unit.render_gi|unit.render_denoise|unit.render_post|unit.render_temporal|unit.virtual_geometry|unit.render_raytracing)$'
registered=$(ctest --test-dir "$d" -N -R "$pattern" 2>/dev/null | grep -c 'Test *#' || true)
echo "$registered of 8 suite(s) match $pattern"
test "$registered" -ge 8 || { echo "a suite this criterion names is not registered — renamed, deleted, or never written"; exit 1; }
ctest --test-dir "$d" -R "$pattern" --output-on-failure
'''
timeout_s = 3600
ci_job = "milestone-m11c"

# THE MUTATION IS A SUITE THAT STOPPED BEING REGISTERED, which is the failure the `registered` guard
# above exists for and the one a bare `ctest -R` cannot tell from "no test matched, so nothing
# failed". Renaming the suite in its own CMakeLists leaves a tree that still CONFIGURES, still
# BUILDS and still runs the cases — under a name this criterion does not ask for — so seven of the
# eight rows are green and the criterion goes red naming the eighth.
[criterion.falsifies]
mutate = "rename-token"
target = "src/rendering/temporal/tests/CMakeLists.txt"
token = "render_temporal"
note = "the rename is confined to one file and is applied to every occurrence in it, so `cy_add_test(NAME ...)` and the deferred declaration function stay consistent and the build is unaffected. What changes is the registered suite's NAME: `unit.render_temporal` is no longer in the tree, `registered` counts 7 of 8, and the criterion exits naming a suite that has been renamed, deleted or never written — which is the shape of the M8 defect this project has now found seven times, where an empty selection reads as a pass."

[[criterion]]
id = "image-rows-at-complete-grade"
describe = "every requirement of the eight image rows maps to a test, a gate or a recorded exemption — 26, 20, 29, 6, 6, 15, 8 and 13 requirements respectively, none of them read end to end at Complete grade by anybody"
source = "tasks 2, testing-and-quality"
kind = "command"
run = "just quality-requirements virtual-geometry virtual-shadows rendering-global-illumination denoising ray-tracing-infrastructure rendering-post-processing temporal-rendering rendering-lighting-and-shadows"
