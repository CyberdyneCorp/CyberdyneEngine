[[criterion]]
id = "shader-targets-for-the-next-rung"
describe = """the shader system emits MSL and DXIL, which M11.d cannot start without — AND THE SAME \
GRAPH COMPILED FOR TWO TARGETS DECLARES THE SAME INTERFACE. Before M11.c the front end hard-coded \
SLANG_SPIRV, `SLANG_ENABLE_DXIL` was OFF, `just build-shaders` refused with a milestone label, and \
`cache.h`'s 'metal-msl' and 'd3d12-dxil' named forms nothing produced. THE SECOND HALF OF THIS \
CLAIM IS THE HALF THAT MATTERS: a check that three files exist and are not empty passes on a stub \
that writes the SPIR-V out three times, so what is measured is that each artefact is in the form \
its target names, that the artefacts of one entry point differ from each other, and that they \
declare the same entry point, stage, workgroup and parameters. Where each target PUTS those \
parameters is deliberately not compared — Metal and D3D12 give them different index spaces, and \
requiring them to match would be requiring a falsehood"""
source = "tasks 1.5-1.7, shader-system, M11.d design.md §6"
kind = "command"
run = '''
set -eo pipefail
# THE TABLE IS PROBED, NOT DECLARED: `cy_shaderc targets` answers each row by compiling a shader for
# that target, so a machine where DXC did not load reports d3d12-dxil as unavailable rather than
# reporting the CMake option somebody set.
just build-shaders --targets | tee /tmp/cy-m11c-targets.txt
grep -q "metal-msl=emitted" /tmp/cy-m11c-targets.txt
grep -q "d3d12-dxil=emitted" /tmp/cy-m11c-targets.txt

# AND THE MEASUREMENT. Every `[shader(...)]` entry point under src/ and samples/ is compiled for
# every emitted target and the artefacts of one entry point are compared against each other. The
# recipe exits non-zero on a disagreement or a refusal; the floor below is what stops a run that
# compiled nothing from passing, which is the failure mode a summary line cannot otherwise have.
just build-shaders src samples | tee /tmp/cy-m11c-shader-set.txt
summary=$(grep -o "shader-set: .*" /tmp/cy-m11c-shader-set.txt | tail -1)
test -n "$summary" || { echo "no shader-set summary line: the run did not finish"; exit 1; }
echo "$summary"
# `grep -o` on the field with its leading space, because `modules_without_entry_points` ends in the
# same twelve characters as `entry_points` and a greedy sed matched that one instead — which read as
# the set having shrunk to seventeen entry points, and is the kind of wrong number a threshold hides.
comparisons=$(echo "$summary" | grep -o " comparisons=[0-9]*" | cut -d= -f2)
entry_points=$(echo "$summary" | grep -o " entry_points=[0-9]*" | cut -d= -f2)
test "${entry_points:-0}" -ge 30 || { echo "only ${entry_points} entry point(s) found: the set is not the engine's"; exit 1; }
test "${comparisons:-0}" -ge 60 || { echo "only ${comparisons} comparison(s): nothing was cross-checked"; exit 1; }
echo "$summary" | grep -q "disagreements=0 failures=0"
'''
timeout_s = 3600
ci_job = "milestone-m11c"

# THE MUTATION IS THE DXIL PROFILE, AND IT REPLACES ONE THAT WAS MEASURED NOT TO WORK.
# The declared mutation until M11.c's closing round was `delete-lines 'CY_SHADER_DXIL|DEVELOPMENT|'`
# in cmake/features.cmake, and the prover refuted it in as many words: "the criterion still PASSES
# with 1 file(s) mutated and build/m11c-final rebuilt over them: it cannot go red". The argument for
# it was sound and the reach was not — that row governs how the Slang DEPENDENCY is configured, and
# an incremental rebuild of a tree that is already configured never revisits it, so the mutation only
# bites from an empty build directory. A criterion whose only mutation needs a from-empty build is a
# criterion this ladder cannot judge, which is the shape the whole module exists to refuse.
#
# `profile_for(Target::Dxil)` is the same claim one layer in and inside the engine's own sources:
# shader model 6.6 is the floor `virtual-geometry`'s 64-bit atomic visibility raster requires, and
# it is named in that function's own comment. With the line gone the case falls out of the switch to
# `return ""`, DXIL is asked for at no profile, the probe's real compilation fails, `cy_shaderc
# targets` reports `d3d12-dxil=unavailable`, and this criterion's second grep fails. It still
# compiles — an empty last case is not an implicit fallthrough — which is what separates a criterion
# going red for the defect it names from one going red because the tree stopped building.
[criterion.falsifies]
mutate = "delete-lines"
target = "src/backends/shader/slang/src/slang_compiler.cpp"
token  = "return \"sm_6_6\";"
note   = "measured at M11.c's close: the previously declared mutation on cmake/features.cmake was REFUTED — the criterion stayed green with the CY_SHADER_DXIL row deleted and the tree rebuilt, because an incremental rebuild does not reconfigure the Slang dependency the row governs. This one is inside the engine's own sources and is reached by the same rebuild: with no shader model the DXIL probe cannot compile, the target table reports d3d12-dxil=unavailable, and the first half of this body fails before the cross-target comparison is reached."

# --- The completeness half of the same subject, asked separately and answered red ------------------
#
# WHY THIS IS A SECOND CRITERION AND NOT A STRICTER FIRST ONE. The one above asks whether the shader
# system EMITS the three targets and whether two of them agree about a graph. This one asks whether
# every shader the engine has reaches every target. They are different questions with different
# owners: the first is `shader-system`'s and this rung's, the second is about two shaders' choice of
# a Vulkan-only semantic and belongs to the rung that adds a D3D12 backend and can compare the
# resulting images. Folding the second into the first would have made a measured capability
# indistinguishable from an unmeasured one, which is how "MSL and DXIL are emitted" became a
# sentence in a comment in the first place.

[[criterion]]
id = "every-shader-reaches-every-target"
describe = """every entry point the engine declares compiles for every target this build emits. \\
