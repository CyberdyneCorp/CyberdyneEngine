[[criterion]]
id = "beauty-textures-are-reproducible"
describe = "the nine committed textures are exactly what their generator produces from its seed. This is the whole of their provenance: they are the first content this project ships and `thirdparty-dependencies`' governance applies to content as much as to code, so the record has to be CHECKABLE rather than asserted. A file whose bytes stop matching is a file somebody edited by hand"
source = "tasks 6.2, thirdparty-dependencies"
kind = "command"
run = '''
set -eo pipefail
work=$(mktemp -d)
trap 'rm -rf "$work"' EXIT
python3 tools/content/make_beauty_textures.py --out "$work" --seed 0x5EEDB107 > /dev/null
checked=0
for texture in content/beauty/textures/*.png; do
    name=$(basename "$texture")
    test -f "$work/$name" || { echo "$name is not one the generator writes"; exit 1; }
    cmp -s "$texture" "$work/$name" || { echo "$name is not what tools/content/make_beauty_textures.py produces at seed 0x5EEDB107"; exit 1; }
