describe = "a node in the material graph previews through the RUNTIME compiler rather than through a second evaluator written for the editor. A preview computed by a second implementation is a preview of that implementation"
source = "tasks 1, material-compiler, editor-visual-language"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
binary="$d/cy_test_integration_material_preview"
test -x "$binary" || { echo "no $binary — the suite integration.material_preview does not exist"; exit 1; }
filter='a node previews through the runtime compiler*'
out="$("$binary" "-tc=$filter" 2>&1)" || { echo "$out"; echo "the named case(s) FAILED"; exit 1; }
echo "$out" | tail -3
selected=$(printf '%s' "$out" | sed -nE 's/.*test cases: *([0-9]+) \|.*/\1/p' | head -1)
echo "the filter selected ${selected:-0} case(s) of the 1 it names"
test "${selected:-0}" -ge 1 || { echo "the named case(s) are not in integration.material_preview any more — renamed, deleted, or the filter is stale"; exit 1; }
'''
ci_job = "milestone-m11c"

