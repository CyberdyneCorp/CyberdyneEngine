describe = "`CookedTexture::encoded` is written from what the encoder can actually PRODUCE and from nothing else. It was an unconditional `false` for six milestones while `select_format` named BC7, BC5, BC4, BC6H and two ASTC block sizes; M11.c wrote the first three and made the flag follow `can_encode`. The two it did not write are still named by the policy and produced by nobody, so a mobile cook still writes uncompressed pixels — and the flag is what stops that being a silent lie. The suite decodes what the encoder produced and measures the error, so a build that wrote zeroes fails"
source = "tasks 6.1b, asset-import-pipeline (Texture cooking)"
kind = "command"
run = '''
