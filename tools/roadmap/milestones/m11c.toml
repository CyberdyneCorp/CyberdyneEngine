[[criterion]]
id = "hierarchical-depth-on-a-device"
describe = "a hierarchical depth buffer is built and read on the device, and occlusion is cluster-granular. `cull_pass.cpp` carried the two-pass model on the processor and no device path existed — which is why this rung predicted demoting `rendering-culling-and-lod` and said so before its gate did. TWO CASES, BECAUSE THE SENTENCE HAS TWO HALVES: `integration.rendering_culling` compares the DEVICE pyramid against the CPU model TEXEL FOR TEXEL, and `render.virtual_geometry_gpu` runs the second consumer over that same pyramid and compares its node prunes and cluster rejections against the reference traversal's. ONE PIECE OF DEVICE WORK, TWO ROWS: `cy::rendering-hzb` is linked by both consumers and `hzb_sample.slang` is included by both shaders, so the ledger is not counting one implementation twice"
source = "tasks 4.1, 4.2, rendering-culling-and-lod, virtual-geometry"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
failures=0
check() {
    binary="$1"
    suite="$2"
    filter="$3"
    test -x "$binary" || { echo "no $binary — the suite $suite does not exist"; exit 1; }
    out="$("$binary" "-tc=$filter" 2>&1)" || { echo "$out" | tail -20; echo "the named case(s) of $suite FAILED"; failures=1; return; }
    echo "$out" | grep -E "MESSAGE|hzb:|occlusion cull:" || true
    echo "$out" | tail -3
    selected=$(printf '%s' "$out" | sed -nE 's/.*test cases: *([0-9]+) \|.*/\1/p' | head -1)
    echo "$suite: the filter selected ${selected:-0} case(s) of the 1 it names"
    test "${selected:-0}" -ge 1 || { echo "the named case is not in $suite any more — renamed, deleted, or the filter is stale"; exit 1; }
}
# 1. THE PYRAMID ITSELF, against the CPU model that has passed its own tests since M6. A model
#    passing its own tests is not a pass; this case reads the DEVICE pyramid back and compares every
#    texel of every level.
check "$d/tests/integration/cy_test_integration_rendering_culling" "integration.rendering_culling" \
      'a hierarchical depth buffer is built on the device*'
# 2. THE SECOND CONSUMER, over the same pyramid: virtual geometry's cluster-granular occlusion,
#    swept over occluder depth and selection threshold so that BOTH the node prune and the cluster
#    rejection fire, and compared against the reference traversal.
check "$d/cy_test_render_virtual_geometry_gpu" "render.virtual_geometry_gpu" \
      'cluster occlusion reads the shared*'
test "$failures" -eq 0
'''
requires = "gpu"
reason = "an HZB is built by the device; the CPU two-pass model it replaces is already covered by `unit.render_culling`, so a green here must mean the device path and not the model. AND THIS HOST HAS ONE GPU VENDOR, so an agreement measured here is agreement with one driver — design.md §1.3 and §4"
ci_job = "milestone-m11c"

# THE MUTATION IS A DEFECT IN THE PYRAMID'S CONSTRUCTION, and it is production code rather than a
# test. `declare()` computes each reduction's source offset from the level below it; deleting that
# assignment leaves the offset at its default of zero, so every level above the first reduces from
# LEVEL 0's texels while believing they are the previous level's. The tree still compiles, the
# dispatches still run, the counters still move — and the pyramid is wrong from level 2 up.
#
# Measured before it was written down: 178 differing texels, the first at level 2 texel 106, where
# the model says 0.0141871329 and the device says 0. That is the shape the whole criterion exists
# for — a device pass that produces A pyramid rather than THE pyramid — and it is invisible to
# anything that checks a counter instead of the contents.
[criterion.falsifies]
mutate = "delete-lines"
target = "src/rendering/hzb/src/hzb_pass.cpp"
token = "step.push.source_offset = hzb_level_offset(desc_.width, desc_.height, level - 1U);"
note = "the assignment is one statement and deleting it leaves a tree that BUILDS and a pyramid whose upper levels are reduced from the wrong source. A criterion that only asked whether the dispatches ran, or whether `rejected_by_occlusion` was non-zero, would stay green through it."

