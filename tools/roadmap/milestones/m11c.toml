# --- Section 3: culling, the sky, and the two architecture rows -------------------------------------

[[criterion]]
id = "hierarchical-depth-on-a-device"
describe = "a hierarchical depth buffer is built and read on the device, and occlusion is cluster-granular. `cull_pass.cpp` carried the two-pass model on the processor and no device path existed — which is why this rung predicted demoting `rendering-culling-and-lod` and said so before its gate did. TWO CASES, BECAUSE THE SENTENCE HAS TWO HALVES: `integration.rendering_culling` compares the DEVICE pyramid against the CPU model TEXEL FOR TEXEL, and `render.virtual_geometry_gpu` runs the second consumer over that same pyramid and compares its node prunes and cluster rejections against the reference traversal's. ONE PIECE OF DEVICE WORK, TWO ROWS: `cy::rendering-hzb` is linked by both consumers and `hzb_sample.slang` is included by both shaders, so the ledger is not counting one implementation twice"
source = "tasks 4.1, 4.2, rendering-culling-and-lod, virtual-geometry"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
failures=0
check() {
    binary="$1"
    suite="$2"
    filter="$3"
    test -x "$binary" || { echo "no $binary — the suite $suite does not exist"; exit 1; }
    out="$("$binary" "-tc=$filter" 2>&1)" || { echo "$out" | tail -20; echo "the named case(s) of $suite FAILED"; failures=1; return; }
    echo "$out" | grep -E "MESSAGE|hzb:|occlusion cull:" || true
    echo "$out" | tail -3
    selected=$(printf '%s' "$out" | sed -nE 's/.*test cases: *([0-9]+) \|.*/\1/p' | head -1)
    echo "$suite: the filter selected ${selected:-0} case(s) of the 1 it names"
    test "${selected:-0}" -ge 1 || { echo "the named case is not in $suite any more — renamed, deleted, or the filter is stale"; exit 1; }
    # A SKIP IS NOT A PASS — task 9.3. `tests/render/device.h` prints this line and RETURNS when no
    # Vulkan device can be created, so the case exits 0 having executed zero assertions, and
    # `requires = "gpu"` does not catch it: `criteria._has_gpu()` asks whether /dev/dri holds a
    # render node, which is a different question from whether a device can be created. Measured with
    # the ICD hidden: the whole render label is 17 of 17 green in 3.78 s against 186.48 s with the
    # device. The guard is `m11a:field-device-agrees-with-cpu`'s.
    printf '%s\n' "$out" | grep -q 'no Vulkan device on this machine' && { echo "$suite SKIPPED for want of a device: that is not a pass"; exit 1; }
    assertions=$(printf '%s' "$out" | sed -nE 's/.*assertions: *([0-9]+) \|.*/\1/p' | head -1)
    test "${assertions:-0}" -ge 1 || { echo "$suite executed ${assertions:-0} assertion(s): it measured nothing"; exit 1; }
}
# 1. THE PYRAMID ITSELF, against the CPU model that has passed its own tests since M6. A model
#    passing its own tests is not a pass; this case reads the DEVICE pyramid back and compares every
#    texel of every level.
check "$d/tests/integration/cy_test_integration_rendering_culling" "integration.rendering_culling" \
      'a hierarchical depth buffer is built on the device*'
# 2. THE SECOND CONSUMER, over the same pyramid: virtual geometry's cluster-granular occlusion,
#    swept over occluder depth and selection threshold so that BOTH the node prune and the cluster
#    rejection fire, and compared against the reference traversal.
check "$d/cy_test_render_virtual_geometry_gpu" "render.virtual_geometry_gpu" \
      'cluster occlusion reads the shared*'
test "$failures" -eq 0
'''
requires = "gpu"
reason = "an HZB is built by the device; the CPU two-pass model it replaces is already covered by `unit.render_culling`, so a green here must mean the device path and not the model. AND THIS HOST HAS ONE GPU VENDOR, so an agreement measured here is agreement with one driver — design.md §1.3 and §4"
ci_job = "milestone-m11c"

# THE MUTATION IS A DEFECT IN THE PYRAMID'S CONSTRUCTION, and it is production code rather than a
# test. `declare()` computes each reduction's source offset from the level below it; deleting that
# assignment leaves the offset at its default of zero, so every level above the first reduces from
# LEVEL 0's texels while believing they are the previous level's. The tree still compiles, the
# dispatches still run, the counters still move — and the pyramid is wrong from level 2 up.
#
# Measured before it was written down: 178 differing texels, the first at level 2 texel 106, where
# the model says 0.0141871329 and the device says 0. That is the shape the whole criterion exists
# for — a device pass that produces A pyramid rather than THE pyramid — and it is invisible to
# anything that checks a counter instead of the contents.
[criterion.falsifies]
mutate = "delete-lines"
target = "src/rendering/hzb/src/hzb_pass.cpp"
token = "step.push.source_offset = hzb_level_offset(desc_.width, desc_.height, level - 1U);"
note = "the assignment is one statement and deleting it leaves a tree that BUILDS and a pyramid whose upper levels are reduced from the wrong source. A criterion that only asked whether the dispatches ran, or whether `rejected_by_occlusion` was non-zero, would stay green through it."

# REWRITTEN FOR THE REASON SPELLED OUT OVER `virtual-geometry-image` ABOVE: `just test-render sky
# --times-of-day 4 --compare-golden` selected the same 17 render cases as `just test-render` with no
# arguments at all, and there is no `render.sky` case in that list — the sky's only device coverage is
# `render.environment_field`, which samples a field rather than photographing a picture.
[[criterion]]
id = "sky-as-an-image"
describe = "the sky is judged as an IMAGE rather than as a table: a capture at four times of day compared against committed references within tolerance. Four references, because the claim the row makes is about the atmosphere's response to sun elevation and one still cannot carry it — the same argument `just capture-virtual-geometry` makes for three thresholds. CONDITIONAL ON M11.a CLOSING `m10:sky-field-round-trip` — this rung owns the illumination consumer of the cloud shadow field and cannot write one against a sampler that returns its declared default at every point"
source = "tasks 3, atmosphere-sky-and-clouds"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
ctest --test-dir "$d" -N -R '^render.sky_times_of_day$' 2>/dev/null | grep -q 'render.sky_times_of_day' || {
    echo "render.sky_times_of_day is not registered in $d: nothing in this tree photographs the sky at four times"
    # NO BACKTICKS IN THIS MESSAGE: it is inside double quotes in a shell, so a quoted
    # `just test-render` would be a command substitution that RAN the render suites on the way
    # to printing a diagnostic about them.
    echo "of day and compares the frames against references. 'just test-render' selects with --no-tests=ignore, so"
    echo "an absent suite would otherwise be reported as a pass."
    exit 1
}
missing=""
for hour in dawn noon dusk night; do
    test -f "tests/render/references/sky_${hour}.png" || missing="${missing} sky_${hour}.png"
done
test -z "${missing}" || {
    echo "missing committed reference(s) under tests/render/references/:${missing}"
    echo "a time of day with no reference is a time of day nothing compares"
    exit 1
}
# `-V` AND NOT THE BARE RECIPE, for M10's reason on `sky-field-round-trip`: the numbers this
# criterion is about are printed by cases that PASS, and `_ctest` passes `--output-on-failure`, so a
# green run prints nothing. What that hides is worse than a silent pass. Every suite in
# tests/render/ SKIPS LOUDLY and EXITS ZERO on a machine with no device — which is the right
# behaviour for `just test-render` and the wrong verdict for a criterion whose whole claim is that a
# picture was taken. A driver that stopped presenting a device would turn this criterion green while
# photographing nothing, which is the defect this project has shipped nine times. So the four
# photograph lines are required to be in the output: they are written by the case AFTER the frame
# has been composed and read back, and no skipping run can produce one. MEASURED, not asserted: run
# on this host with `VK_DRIVER_FILES=/dev/null`, the suite prints "no Vulkan device on this machine"
# four times, reports `5 passed, 0 failed` over ZERO ASSERTIONS and exits 0 — and the loop below
# turns that into the red it is.
if ! out="$(just test-render -R '^render.sky_times_of_day$' -V 2>&1)"; then
    printf '%s\n' "$out" | tail -40
    echo "render.sky_times_of_day is red: the sky no longer matches its committed references"
    exit 1
fi
printf '%s\n' "$out" | grep -E 'sun elevation|texels over tolerance|one ULP in the exposure' || true
for hour in dawn noon dusk night; do
    printf '%s\n' "$out" | grep -q "sky_${hour}: sun elevation" || {
        echo "sky_${hour} never reported a sun elevation: the case did not photograph anything."
        echo "Every suite under tests/render/ skips loudly and exits zero with no device, so an"
        echo "exit code alone cannot tell a picture from an absent one."
        exit 1
    }
done
'''
requires = "gpu"
reason = "a sky capture needs a device, and on this one-GPU-vendor host the picture is judged against a single driver; the field round trip it depends on is checked without one by M11.a's `sky-field-consumed-outside-the-sky`"
ci_job = "milestone-m11c"

[criterion.falsifies]
