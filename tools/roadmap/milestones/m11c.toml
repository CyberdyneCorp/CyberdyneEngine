[[criterion]]
id = "materials-are-textures"
describe = "the artefact's materials are TEXTURES rather than constants, and the check RUNS THE COMPILER rather than counting files. `cy_material author` is handed each committed canvas, lowers it through the engine's own `lower_material`, compiles it, and reports how many textures the module declares; a material that samples none reports zero. The same run regenerates the committed `.cygraph` and the bytes must match, so a graph somebody edited by hand is red too"
source = "tasks 6, ROADMAP M11.c closing artefact, material-compiler"
kind = "command"
run = '''
set -eo pipefail
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
cooker="$d/tools/material/cy_material"
test -x "$cooker" || { echo "no $cooker — cy_material was not built"; exit 1; }
canvases=$(ls content/beauty/materials/*.cymatcanvas 2>/dev/null || true)
test -n "$canvases" || { echo "no authored material canvas in content/beauty/materials/"; exit 1; }

work=$(mktemp -d)
trap 'rm -rf "$work"' EXIT
materials=0
for canvas in $canvases; do
    name=$(basename "$canvas" .cymatcanvas)
    "$cooker" author "$canvas" --graph "$work/$name.cygraph" \
        --module "$work/$name.slang" --info "$work/$name.cymatinfo" > "$work/$name.log"
    cat "$work/$name.log"
    textures=$(sed -nE 's/.*[, ]([0-9]+) textures.*/\1/p' "$work/$name.log" | head -1)
    test "${textures:-0}" -ge 2 || { echo "$name declares ${textures:-0} texture(s): its material is constants"; exit 1; }
    grep -q "cy_material_sample(" "$work/$name.slang" || { echo "$name declares textures and its generated program samples none"; exit 1; }
    cmp -s "$work/$name.cygraph" "content/beauty/materials/$name.cygraph" || { echo "$name.cygraph is not what the authoring path produces from its canvas"; exit 1; }
    materials=$((materials + 1))
done
echo "$materials material(s), each with at least two sampled textures, each regenerating its committed .cygraph"
test "$materials" -ge 3
'''
ci_job = "milestone-m11c"

# The mutation cannot be derived — the body runs a compiler rather than searching text — so it is
