'''
ci_job = "milestone-m11c"

[criterion.falsifies]
mutate = "delete-lines"
target = "tools/import/src/texture.cpp"
token = "header.encoded = can_encode(format);"
note = "The line that makes the flag follow the encoder goes away and `encoded` falls back to its default — which is exactly the state the tree was in for six milestones, with `select_format` naming BC7 and the payload carrying uncompressed pixels under it. The file still compiles and every other case in the suite still passes, which is what makes this a red about the CLAIM rather than about the build."

# --- Section 5: the record, the tiers, and the next rung --------------------------------------------

[[criterion]]
id = "roadmap-tiers"
describe = "the status record is at this rung's exit tiers: fifteen rows from Working to Complete. IT FAILS UNTIL THE CLOSING CHANGE WRITES THEM AND IT IS MEANT TO. This rung predicts demoting `rendering-culling-and-lod`, and `ray-tracing-infrastructure` and `vfx-system` if their cross-rung dependencies do not land; a demoted row is recorded at Working with its reason and the expectation moves to the rung that takes it"
