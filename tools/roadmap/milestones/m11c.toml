target = "src/core/reflect/generated/cy_reflect_generated.cpp"
note   = "the reflection metadata is COMMITTED, so its currency check is a comparison between the committed file and what the generator produces from the annotated headers. Emptying it is the staleness this gate exists to catch — an annotated header edited without the generator being run — and `reflect_gen --check` names the file. The headers half of the recipe writes into the build tree and cannot be reached by a source mutation, so the committed half is the one that is broken here. This rung has its own instance of the same gate catching something real: task 6.2 wrote a shipped-content licence record into a GENERATED file and `just maintenance-deps-check` said so."

[[criterion]]
