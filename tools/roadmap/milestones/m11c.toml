# M11.c — Image: the exit criteria of M11's third rung.
#
# WHY THIS RUNG EXISTS, stated the way its proposal states it. Every renderer row is at Working and
# THE DEMOS DO NOT LOOK LIKE A MODERN ENGINE: the world is untextured procedural geometry, the
# virtual-geometry capture is a normals debug view, post-processing is untuned, and nothing has been
# optimised so nothing has been tuned. There are six image files in the entire tree outside docs/ —
# four editor identity marks and two golden references — so every material in every published
# picture is a constant. `samples/10-world` links neither `cy::rendering-assembly` nor the post,
# temporal, forward or shadow libraries, so the world picture never passes through tone mapping or
# anti-aliasing at all. THE MECHANISMS ARE REAL AND GATED; THE OUTPUT IS NOT.
#
# WHY `material-compiler` AND `shader-system` COME FIRST AND THE ORDER IS NOT A PREFERENCE. Image
# quality is expressed through them, and `rendering-global-illumination` cannot be Complete on a
# material compiler that is not. The visual material editor is the panel M11.b built; this rung is
# what stands behind it.
#
# WHY THE ARTEFACT IS AUTHORED THROUGH THE EDITOR. A shot assembled by hand in C++ proves the
# renderer and nothing else. One authored through the editor M11.b finished proves both, and is the
# honest demonstration of a usable engine. It must be published beside a statement of what was
# authored and what the renderer produced, or it is a screenshot rather than evidence.
#
# ONE HARD CROSS-RUNG GATE, STATED RATHER THAN RISKED. `atmosphere-sky-and-clouds` cannot complete
# here unless M11.a closes `m10:sky-field-round-trip`: this rung owns the illumination consumer of
# the cloud shadow field and a consumer cannot be written against a sampler that returns its declared
# default at every point. status.yaml already states the condition in as many words.

schema = 1
id = "m11c"
name = "Image"
artefact = "an art-directed beauty shot — real materials, tone mapping, anti-aliasing, tuned post — assembled THROUGH the editor M11.b finished rather than in C++, and published beside a statement of what was authored and what the renderer produced."

notes = [
    "`just roadmap-milestone m11c` is this recipe, so it cannot be one of the criteria it evaluates.",
    "THE STATIC GATES ARE SPELLED HERE EXACTLY AS M11.a AND M11.b SPELL THEM, so they collapse to one check each across the ladder.",
    "THE DEVICE CRITERIA EACH HAVE A COMPANION THAT NEEDS NO DEVICE, which is M8.c's rule: nothing a milestone claims should be judgeable only on the machines with a GPU in them. `beauty-shot` needs one; `frame-passes-through-post` and `materials-are-textures` do not, and they carry the structural half of the same claim.",
    "WHAT IS NOT A CRITERION BECAUSE NO MACHINE HERE CAN SETTLE IT. Whether the shot is beautiful is a judgement and there is no check for it. What IS checkable is that it went through tone mapping and anti-aliasing, that its materials are textures rather than constants, that it was assembled through the editor, and that the README says which is which — four facts that together make the judgement possible rather than replacing it.",
    "tasks 9.x — the gate itself. A milestone cannot make passing its own gate one of the criteria that gate evaluates.",
    "`just quality-requirements` DOES NOT EXIST YET AND THE CRITERIA THAT CALL IT WILL SAY SO. `testing-and-quality` requires every requirement to map to a test, a gate or a recorded exemption, and the tool that checks it is one of that row's four absent gates — the row is M11.d's. It is named here rather than avoided because the mapping IS the Complete-grade claim these rows are being judged on: whichever rung reaches it first writes the tool, and M11.d is where it is finished. A criterion that names an absent recipe fails loudly with the recipe's name in it, which is the honest red.",
]

# --- The static gates, shared with every other rung -----------------------------------------------

[[criterion]]
id = "specs"
describe = "openspec validate --specs --strict passes over the specification set, including the six deltas this rung writes"
source = "tasks 8.3"
kind = "recipe"
run = "just quality-specs"
ci_job = "specs"

[criterion.falsifies]
mutate = "delete-lines"
target = "openspec/specs/delivery-roadmap/spec.md"
token  = "#### Scenario:"
note   = "`--strict` refuses a requirement with no scenario, so taking the scenarios out of one specification is the shape this gate exists to catch. M11.b proves the same gate with the same mutation; the command is identical on both rungs and so is what can break it."

[[criterion]]
id = "format"
describe = "the formatting gate is green over a tree that gained the shader targets, the GI/atmosphere adapter, a hierarchical depth buffer and a tuned post chain"
source = "tasks 9.1"
kind = "recipe"
run = "just quality-format-check"
ci_job = "format"

[criterion.falsifies]
mutate = "delete-lines"
target = ".clang-format"
token  = "IndentWidth: 4"
note   = "the gate's claim is that the tree matches `.clang-format`; the mutation changes what `.clang-format` ASKS FOR — indentation falls back to the Google default of two — so every file in the tree differs from the style and the gate has to report it. M11.b records that deleting a line of C++ was tried there first and refuted, because this project does not indent inside a namespace; the same objection holds here, so the same mutation is taken."

[[criterion]]
id = "lint"
describe = "clang-tidy is clean, including the cognitive-complexity limits — which a material compiler's lowering stages and a denoiser are exactly the kind of code to breach, and which this project's own table permits 25 to 35 for and no more"
source = "tasks 9.1"
kind = "recipe"
run = "just quality-lint"
ci_job = "lint"

[criterion.falsifies]
mutate = "rename-token"
target = "src/core/memory/src/tracking_allocator.cpp"
token  = "NOLINTNEXTLINE"
note   = "the gate's claim is that clang-tidy reports nothing over what the build compiles, and `WarningsAsErrors` set to everything is what turns a finding into an exit code. The mutation renames the three earned suppressions in the allocator that casts through `void*` on purpose, so three real `bugprone-casting-through-void` findings fire on real lines of shipping code. A NEW defect was rejected for the reason M11.b records: it would have to be a defect clang-tidy is configured to catch, which is a guess about the check list, while a suppression that stops suppressing is a finding the tree has already agreed is one. THIS RUNG IS WHERE THE GATE ACTUALLY CAUGHT SOMETHING — 41 findings in nine files M11.c wrote, task 9.1 — so the mutation is over the same command that found them."

[[criterion]]
id = "layering"
describe = "the layer order holds with the GI/atmosphere seam joined. `src/rendering/sky/CMakeLists.txt` records the absent dependency on `cy::rendering-gi` as DELIBERATE, which is what made the gradient fit measurable with no GI system present; joining the seam must not turn that absence into a cycle"
source = "tasks 9.1, engine-architecture, dependencies.md cycle 2"
kind = "recipe"
run = "just quality-layers"
ci_job = "layering"

[criterion.falsifies]
mutate = "rename-token"
target = "tools/layercheck/layercheck.py"
token  = "platform/"
note   = "the sdl rule is `no SDL header appears outside platform/`. Renaming the directory the rule exempts turns the SDL includes that legitimately live in `platform/desktop-sdl3/` into reported violations over real source files — the check FIRES rather than crashing. M11.b records that renaming the expression itself was tried and rejected because it made the checker raise a NameError, which is a red for a reason no reader of this criterion could act on."

[[criterion]]
id = "workflows"
describe = "the workflows and the recipes agree, and it goes red the moment `milestone-m11c` is green above the newest ledger any workflow evaluates"
source = "tasks 8.4, developer-workflow-and-just"
kind = "recipe"
