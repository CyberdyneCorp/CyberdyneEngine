[[criterion]]
id = "beauty-shot"
describe = "the shot, the manifest the frame wrote about itself, and the AGREEMENT between them and the tree. `capture_manifest` builds the stage list out of `AssemblyReport` and re-derives nothing, so the manifest is the one part of the caption a machine can check — and this checks it against things it did not write: the published image's own dimensions against the resolution and the supersample factor the frame recorded, and every authored graph and source texture the manifest names against the files in `content/`. A caption naming a material nobody committed, or a resolution nobody rendered, is red"
source = "tasks 7, ROADMAP M11.c closing artefact, design.md section 7"
kind = "command"
run = '''
set -eo pipefail
python3 - <<'PYCHECK'
import pathlib
import re
import sys

from PIL import Image

still = pathlib.Path("docs/design/images/m11c-beauty-shot.png")
manifest_path = pathlib.Path("docs/design/images/m11c-beauty-shot.manifest")
caption = pathlib.Path("docs/design/beauty-shot.md")
for path in (still, manifest_path, caption):
    if not path.is_file():
        sys.exit(f"{path} is not in the tree, so the artefact is incomplete")

manifest = manifest_path.read_text()
print(manifest.split("\n# content")[0].strip())

def one(pattern: str) -> str:
    found = re.search(pattern, manifest, re.M)
    if found is None:
        sys.exit(f"the manifest no longer reports {pattern!r}: it is not the file this check reads")
    return found.group(1)

# --- WHAT THE FRAME SAID ABOUT ITSELF ---------------------------------------------------------
if not re.search(r"^purpose publication$", manifest, re.M):
    sys.exit("the capture is not a publication capture")
if not re.search(r"^arbiter pinned$", manifest, re.M):
    sys.exit("the arbiter was free to degrade the frame between assembling it and photographing it")
errors = int(one(r"^validation-errors (\d+)$"))
if errors:
    sys.exit(f"the device reported {errors} validation error(s) while this frame was drawn")
stages = int(one(r"^post-stages (\d+)$"))
listed = re.findall(r"^  \d+ step \d+ (\w+)", manifest, re.M)
if stages < 3 or len(listed) != stages:
    sys.exit(f"the manifest claims {stages} post stage(s) and lists {len(listed)}: {listed}")
for stage in ("ExposureApply", "Tonemap"):
    if stage not in listed:
        sys.exit(f"the frame ran no {stage} stage, so the picture did not go through the post chain")
print(f"post chain: {' -> '.join(listed)}")

# --- AND IT AGREES WITH THE PUBLISHED FILE ----------------------------------------------------
width, height = (int(value) for value in one(r"^resolution (\d+x\d+)$").split("x"))
supersample = int(one(r"^supersample (\d+)x$"))
published = Image.open(still).size
if (width // supersample, height // supersample) != published:
    sys.exit(f"the frame says {width}x{height} at {supersample}x and the published image is "
             f"{published[0]}x{published[1]}: the caption and the file disagree about the picture")
print(f"rendered {width}x{height}, published {published[0]}x{published[1]} at {supersample}x")

# --- AND THE CONTENT IT NAMES IS IN THE TREE ---------------------------------------------------
named = 0
for line in manifest.splitlines():
    found = re.match(r"\s+(?:authored|albedo|normal|data)\s+(\S+\.(?:cygraph|png))", line)
    if found is None:
        continue
    path = pathlib.Path(found.group(1))
    if not path.is_file():
        sys.exit(f"the manifest names {path} and it is not in the tree")
    named += 1
if named < 12:
    sys.exit(f"the manifest names {named} content file(s); three textured materials is twelve")
print(f"{named} committed content file(s) named by the manifest, all present")

# --- AND THE CAPTION EXISTS AND SAYS WHAT IT IS NOT --------------------------------------------
text = caption.read_text()
for heading in ("What a person authored", "What the renderer produced", "What it is not"):
    if heading.lower() not in text.lower():
        sys.exit(f"docs/design/beauty-shot.md has no '{heading}' section: the picture is published "
                 "without the half of the artefact that makes it evidence")
print("the provenance names what was authored, what was rendered, and what the frame is not")
PYCHECK
'''
ci_job = "milestone-m11c"

[criterion.falsifies]
mutate = "delete-lines"
target = "docs/design/images/m11c-beauty-shot.manifest"
token = "ExposureApply"
note = "The exposure stage vanishes from the list the frame wrote about itself, and the stage count no longer matches the stages listed. Both legs catch it, which is deliberate: a manifest edited by hand is the one way a caption built from `AssemblyReport` could still lie."

# --- THREE THINGS THIS RUNG DID NOT FINISH, AND THE CHECKS THAT KEEP THE CAPTION HONEST ABOUT THEM --
#
# NONE OF THESE IS A `known_gap`, AND THE REASON IS THE PROVER'S RULE RATHER THAN A PREFERENCE. A
# declared gap is judged the other way round — its declared mutation must take it GREEN, because what
# a red gap has not shown is that it is not PERMANENTLY red — and none of the three closing acts below
# is a deletion the prover can apply. The honest alternative is not silence: each is a criterion that
# is GREEN, that states what is ABSENT, and that goes RED the day the absence is filled or the day the
# published caption stops saying so. A ratchet in the direction that matters.

[[criterion]]
id = "the-frame-samples-what-the-material-cannot"
describe = "the compiled-material vocabulary has no normal and no occlusion term, the artefact's frame samples both on the material's behalf, and the published provenance SAYS SO. The check COMPILES one of the shot's own material graphs and reads what the emitter produced: a program that writes `surface.normal` would mean the vocabulary had grown one, and the frame's stand-in should then go. `CyClosure`'s five terms are diffuse, specular, emission, roughness and weight, and `cyResolveSurface` therefore hands the light loop a `Surface` whose normal is (0,0,1) whatever a graph was authored to do"
source = "tasks 6.1c and 7.5, material-compiler, design.md section 7"
kind = "command"
run = '''
set -eo pipefail
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
cooker="$d/tools/material/cy_material"
test -x "$cooker" || { echo "no $cooker — cy_material was not built"; exit 1; }
work=$(mktemp -d)
trap 'rm -rf "$work"' EXIT
"$cooker" author content/beauty/materials/weathered_stone.cymatcanvas \
    --graph "$work/g.cygraph" --module "$work/m.slang" --info "$work/m.cymatinfo" > /dev/null

python3 - "$work/m.slang" <<'PYCHECK'
import pathlib
import sys

module = pathlib.Path(sys.argv[1]).read_text()
body = module[module.index("void cy_material_"):]
print(body.strip()[:400])
for term in ("surface.normal", "surface.occlusion"):
    if term in body:
        sys.exit(f"the generated program writes {term}. The compiled-material vocabulary has grown a "
                 "term for it, so samples/12-beauty/shaders/beauty.slang should stop sampling it on "
                 "the material's behalf and docs/design/beauty-shot.md should stop saying it does.")
written = sorted({line.split("=")[0].strip() for line in body.splitlines()
                  if line.strip().startswith("surface.")})
print(f"a compiled material writes exactly: {', '.join(written)}")

closure = pathlib.Path("src/rendering/shaders/cy/material.slang").read_text()
declaration = closure[closure.index("public struct CyClosure"):]
declaration = declaration[:declaration.index("};")]
if "normal" in declaration:
    sys.exit("CyClosure now carries a normal term")
print("CyClosure carries no normal term and no occlusion term")

frame = pathlib.Path("samples/12-beauty/shaders/beauty.slang").read_text()
for call in ("cyMaterialSampleTexture(normalSlot", "cyMaterialSampleTexture(dataSlot"):
    if call not in frame:
        sys.exit(f"the artefact's frame no longer calls {call}...): either the material does it now, "
                 "or the shot lost its normal mapping")
print("the frame samples both from the material's own table, at the material's own slots")

caption = pathlib.Path("docs/design/beauty-shot.md").read_text()
if "no normal term" not in caption:
    sys.exit("the artefact's provenance no longer states that the compiled-material vocabulary has "
             "no normal term")
print("and the published provenance says so")
PYCHECK
'''
ci_job = "milestone-m11c"

