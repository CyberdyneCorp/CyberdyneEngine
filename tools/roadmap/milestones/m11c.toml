[[criterion]]
id = "the-post-chain-changes-the-picture"
describe = "the artefact went through the post chain, and the evidence is the PAIR rather than a stage list. Both images come out of ONE submission — the 8-bit output the resolve wrote and the linear scene colour it read — so they cannot differ in anything but the chain, and they are required to differ a lot. THIS IS M11.c's SPIKE NEGATIVE CONTROL B MADE PERMANENT: if tone mapping off changes nothing, the frame is not going through the chain and every claim about exposure is a claim about a code path the picture never took"
source = "tasks 7.4, design.md section 1.2, rendering-post-processing"
kind = "command"
run = '''
set -eo pipefail
python3 - <<'PYCHECK'
import sys
from PIL import Image

graded = Image.open("docs/design/images/m11c-beauty-shot.png").convert("RGB")
linear = Image.open("docs/design/images/m11c-beauty-shot-linear.png").convert("RGB")
if graded.size != linear.size:
    sys.exit(f"the pair is {graded.size} against {linear.size}: they are not the same frame")
if graded.size[0] < 1280:
