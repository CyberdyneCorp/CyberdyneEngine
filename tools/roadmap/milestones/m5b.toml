    "THERE IS NO NEW `class = \"permanent\"` GATE IN THIS CHANGE. Every criterion below runs under a gate that already exists, and the two that no workflow can run name `milestone-m5b`. `just ci-check` fails a permanent gate no workflow runs, and .github/workflows/ci.yml is not this change's file. The closing change should add an `editor-window` gate for a self-hosted runner with a display, and an `agent` gate beside it, together with their jobs — a gate and its job land in the same change or neither does.",
    "The gate set this milestone's criteria join on close is tools/roadmap/gates.toml; `just roadmap-gates` prints it. `milestone-m5b` is declared there at `joins-on-close`, and the change that closes M5.5 flips it to green.",
