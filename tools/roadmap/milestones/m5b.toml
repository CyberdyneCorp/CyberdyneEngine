# M5.5 — Operable: the exit criteria, as data.
#
# The sources are openspec/changes/implement-m5b-operable/tasks.md and the M5.5 row the same change
# inserts into docs/ROADMAP.md; every criterion below names which. `delivery-roadmap` requires each
# to be a recipe that exits zero, a test that passes, a benchmark within a threshold, or a committed
# artefact that is regenerated and compared — so an intention that cannot be run is a note at the
# bottom of this file, not a criterion.
#
# `ci_job` names the gate in tools/roadmap/gates.toml under which continuous integration runs the
# criterion. It is required on every criterion, including the ones this machine can evaluate: a
# criterion that passes locally and runs nowhere else is not a gate.
#
# --- THIS LEDGER DECLARES ONLY M5.5's OWN CRITERIA, AND THERE IS NO `m5-green` ---------------------
#
# The ledger has been flat since M5. `just roadmap-milestone m5b` evaluates the permanent set
# directly — the criteria of every milestone whose `class = "milestone"` gate carries
# `state = "green"` and which sits below M5.5 on the ladder, merged and deduplicated, each distinct
# check run exactly once — and then the criteria in this file. `criteria.build_plan` is the rule and
# tools/roadmap/README.md states it. A criterion here whose `run` string is identical to one an
# earlier ledger declared COLLAPSES INTO IT and is reported under the earlier label, `m0:format`
# rather than `m5b:format`. The static gates are declared anyway, as M3's, M4's and M5's are,
# because a ledger that does not name the checks its milestone had to satisfy is a ledger nobody can
# read.
#
# --- WHY M5.5 IS `m5b` AND WHAT THAT COSTS --------------------------------------------------------
#
# `record.MILESTONES` is `m0`…`m11` and does not contain `m5b`, so `criteria.rung("m5b")` answers
# `len(MILESTONES)` and this ledger sorts to the END of the ladder rather than between M5 and M6.
# For THIS ledger that is harmless and in fact exactly right: it inherits every green milestone below
# it, which is M0 through M5, and nothing sits above it yet. It stops being harmless the day M6's
# ledger lands, because M6 would then rank BELOW M5.5 and would not inherit it. Whoever writes
# m6.toml must add `m5b` to `record.MILESTONES` between `m5` and `m6` first — and that same edit is
# what `docs/roadmap/status.yaml` needs before any capability row can name M5.5 as the milestone that
# advanced it, since `record._entry` refuses a milestone that is not on the ladder. Recorded here
# rather than fixed in passing because `tools/roadmap/record.py` is not this change's file and the
# edit changes the meaning of every ledger at once.
#
# --- WHY THERE ARE TWO ARTEFACTS AND ONLY ONE OF THEM IS IN A PERMANENT GATE -----------------------
#
# `design.md` §5: "A single artefact cannot demonstrate both a person operating an editor and an
# agent authoring through it, and pretending otherwise would repeat M5's mistake in a different
# shape." So there are two, and they are asymmetric on purpose:
#
#   samples/05b-agent-authoring  needs no display and no graphics device. It is a CTest smoke entry,
#                                so `just test-all` runs it and the `build-and-test` gate covers it
#                                on every pull request. That is the half continuous integration can
#                                judge.
#   samples/05b-editor-window    needs an X server with XTEST, a device that can import a dma-buf
#                                with an explicit DRM format modifier, python-xlib and Pillow. No
#                                hosted runner has any of that. Its criteria carry
#                                `requires = "display"` and a reason, so they are reported as NOT
#                                EVALUATED rather than as passed — which is the same position
#                                m3.toml takes about the golden images.
#
# THE WINDOW CRITERIA NAME `milestone-m5b` AS THEIR JOB AND THAT IS DELIBERATE. A `class =
# "permanent"` gate whose commands no workflow runs fails `just ci-check`, and no workflow can run
# these. Declaring one anyway would trade an honest "not evaluated" for a gate that is red on every
# pull request — and `delivery-roadmap` forbids exactly that trade. The gate that evaluates them is
# this milestone's own recipe, on a machine that has a display.

schema = 1
id = "m5b"
name = "Operable"
artefact = "samples/05b-editor-window — the editor's window opened on a project and operated through synthesised X11 input, compositing another process's GPU image with no copy through the CPU; and samples/05b-agent-authoring — an agent over the Model Context Protocol composing a scene, writing gameplay source as an undoable transaction, and being refused what its scope does not grant"

# Non-binding, because none can be settled by running something. `delivery-roadmap` requires a
# criterion that cannot be evaluated by a machine to be restated as a check or moved here.
notes = [
    "`just roadmap-milestone m5b` is this recipe, so it cannot be one of the criteria it evaluates.",
    "tasks 5.9 — docs/roadmap/status.yaml and docs/roadmap/capability-matrix.md are the closing change's, and they cannot record M5.5 until `record.MILESTONES` contains `m5b`: `record._entry` refuses a milestone that is not on the ladder. See the header. `roadmap-tiers` below checks the record; no tool can tell an intention from its correction.",
    "tasks 5.10 — archiving this change happens after this recipe passes, so it cannot be one of the criteria it must satisfy.",
    "tasks 5.11 — opening the M6 change is `m6-open` below, which asks only that the change exists. Whether the derivation key model is the right named spike is a judgement.",
    "TASK 5.1, 'a person can select AND MANIPULATE' — HALF SATISFIED, and the artefact says so on every run rather than being quietly narrowed. Selection works through the outliner and the keyboard; a gizmo drag commits nothing, because `DocumentService::open` calls `Document::new` — a name and an EMPTY SCHEMA — and there is no world loader, so `TransformBinding::of_schema` finds no `Transform` to bind to. Nothing outside a test calls `DocumentSchema::declare_type`. The gizmo itself is real and tested: its three states, snapping, pivot and space modes, per-axis numeric entry and one-transaction rule are held by cy-editor-viewport's own suites against a document that declares a Transform. samples/05b-editor-window/README.md carries the argument, and the driver re-attempts the drag every run.",
    "TASK 5.3, 'a gizmo drag returned to its origin restores exact values, in one transaction' — HELD BY `editor` BELOW rather than by an artefact criterion, for the reason above: it is a Cargo test (`a_drag_that_ended_where_it_began_records_nothing`) and the artefact cannot reach it until opening a world produces content.",
    "TASK 5.4, 'an agent composes a scene, writes and reloads a script, and observes the result' — TWO OF FOUR. Composing and writing are exercised by `agent-artefact` below, including undo removing the written file from disk and redo restoring it byte for byte. RELOADING is unreachable: `project.build` is `external-effect`, no `--agent-scope` grants that class (cy-editor-app/src/main.rs declares `read` and `author` and no third), so `project.reload` answers 'nothing has been built'. OBSERVING is unreachable in the same configuration: `viewport:` needs a frame and the code that claims frames — cy-editor-shell's `ViewportLink` — belongs to the window, so `--mcp` has no host for it. Both refusals are asserted by the artefact, so the day either is closed the run reports it.",
    "TASK 5.2, 'the viewport image is the engine's, proven by comparison against a direct render' — PROVEN ACROSS A PROCESS BOUNDARY rather than against a direct render, and the stronger half is the one that runs: `viewport-transport` below requires the editor's imported image to match the publisher's frames with zero torn and zero newer, on a real second process, under the validation layer. `window-artefact` adds the composited half — the pixels in the window's viewport are saturated, which the editor's own charcoal chrome never is, so they came out of another process's GPU allocation. A byte-for-byte comparison against a direct render needs an engine that renders a world, which is `live-editing`'s.",
    "TASK 2.3, 'selection by clicking, over M5's engine-side picking' — DARK IN THE WINDOW, AND FOUND BY DRIVING IT. The window composites the runtime's frames and the viewport MODEL never learns that any arrived: `cy-editor-shell::viewport_link` imports the texture and calls `set_view_state`, and nothing anywhere calls `cy_editor_viewport::Viewport::pump`. So `Viewport::pick` answers `None`, a click reports 'No frame has arrived yet' while the overlay beside it reads 'announced 1016 · skipped 0', `interaction_view()` falls back to the state the editor ASKED for rather than the state a frame was rendered with, and the published gizmo layout has nothing to arrive on. `ViewportSession` already implements `Transport`, so the fix is one `viewport.pump(&mut session, now)` per frame in `ViewportLink::begin_frame`. Recorded in samples/05b-editor-window/README.md; it is in a crate this change does not own.",
