# TASK 1.0.3, AND IT IS THE ONE CHECK THAT KEEPS THE TOOLKIT DECISION REVERSIBLE. design.md §1:
# "Without a test, `egui::Color32` will appear in `cy-editor-visual` within a milestone, because it
# is locally reasonable every single time." A separate criterion from `editor` above — which does run
# it — because this is the one whose FAILURE has a different meaning from every other failure in that
# suite: it does not mean the editor is broken, it means the boundary that lets the toolkit be
# replaced has gone, and nothing else in the tree would say so.
[[criterion]]
id = "toolkit-containment"
describe = "the interface toolkit is named by at most one crate, the graphics API by that crate and the viewport transport and nothing else, the exception list is as short as it claims to be, no headless crate names either, and the transport draws nothing"
