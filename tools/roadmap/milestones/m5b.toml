reason = "this host runs one operating system; the other two are built only by the CI matrix"
ci_job = "build-and-test"

# --- What comes next ---------------------------------------------------------------------------------

# `**` rather than `*`, for the reason recorded against M0's `m1-open`: `openspec archive` moves a
# closed change under `openspec/changes/archive/`, and a pattern that only matches an *open* change
# turns red on the day the next milestone closes — which is the one day this criterion should be most
# satisfied.
#
# M5's ledger renamed its own successor criterion to `m5b-open` when M5.5 was inserted, and said in
# as many words: "this criterion will name `*m6*` again the moment M5.5's ledger is written — at
# which point it becomes M5.5's `m6-open`". This is that criterion, and the rung after M5.5 is M6.
[[criterion]]
id = "m6-open"
describe = "the change for the next rung exists — open, or closed and archived — so the ladder continues deliberately. That rung is M6, whose named spike is the derivation key model"
source = "tasks 5.11, delivery-roadmap"
kind = "path"
path = "openspec/changes/**/*m6*/proposal.md"
ci_job = "milestone-m5b"
