# --- The viewport, which is the milestone's hardest claim -------------------------------------------

# TASK 2.1 AND TASK 5.2. This is the criterion that would fail if the editor ever started drawing an
# approximation, and it is the one the whole toolkit decision was taken on: the editor imports the
# runtime's dma-buf, waits on a timeline semaphore across a process boundary with a BOUNDED HOST WAIT
# rather than a queue wait, and reads whole frames while the runtime writes the others. It also holds
# the two defects this milestone found and fixed — an image imported in a layout the validation layer
# disagreed with, and the announce-after-submit ordering that is the only reason a SIGKILLed runtime
# leaves the editor alive.
[[criterion]]
id = "viewport-transport"
describe = "the engine's frame reaches the editor across a real process boundary with nothing torn and nothing newer than announced, in a layout the Vulkan validation layer agrees with, and the editor survives that process being killed"
source = "tasks 1.0.1, 1.0.1b, 1.0.1c, 1.0.1d, 2.1, 5.2"
kind = "command"
run = "CARGO_TARGET_DIR=\"$(just _editor-target-dir)\" cargo test --manifest-path editor/Cargo.toml -p cy-editor-viewport-transport --test across_a_process_boundary"
timeout_s = 3600
requires = "gpu"
reason = "the transport imports a dma-buf with an explicit DRM format modifier and waits on an exported timeline semaphore; there is no software path and a machine with no device cannot judge it"
ci_job = "milestone-m5b"

