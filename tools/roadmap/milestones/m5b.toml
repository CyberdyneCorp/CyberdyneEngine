# The M5.5 row the proposal inserts, as data. An exit tier is a FLOOR rather than an equality: a
# later milestone advancing one of these past its M5.5 level must not make this recipe fail.
#
# --- READ THESE FOUR AS CLAIMS SOMEBODY STILL HAS TO EARN -----------------------------------------
#
# M5's ledger amended four rows at its own gate and wrote down why, which is the practice this table
# inherits. The four to watch here, and what would have to be true:
#
#   editor-ui-ux         working.  The window exists, docks, tabs, persists a workspace, runs
#       keyboard-first with chords, generates its inspector from reflection and surfaces
#       notifications without interrupting — and samples/05b-editor-window drives all of it through
#       synthesised input rather than through a model. What is thinner than the task list: no
#       per-row visibility toggle in the outliner (NodeState has no visibility field), no content
#       thumbnails, and no complex-script text shaping — egui has no HarfBuzz, so RTL and Indic are
#       unhandled, which design.md §1 names as a cost of the toolkit choice and which cannot be
#       fixed from here.
#
#   editor-visual-language working.  Charcoal chrome, the semantic palette, X red / Y green / Z blue,
#       selection as a thin outline that does not glow, gizmos separated by SHAPE, the orientation
#       widget carrying three axes and nothing else, chrome as overlay, surfaces by luminance step,
#       tabular figures, and the engine's own vocabulary — with `cy-editor-interface`'s vocabulary
#       gate rejecting another engine's product words in any registered command's prose. What is
#       thinner: the performance overlay sits bottom-left where the reference and the design document
#       both put it top-left. Recorded in samples/05b-editor-window/README.md's task 4.4 table.
#
#   editor-agent-interface working.  MCP behind an engine-owned interface, gated at build time and
#       proven absent without the feature; tools projected from the registry with declared
#       exclusions; resources for the hierarchy, an entity, the selection, assets and diagnostics;
#       manipulation through the interactive path; source authoring as a transaction with a COMPUTED
#       effect class; attribution; scope and budget. What is thinner, and it is the milestone's own
#       headline: an agent cannot trigger a build, cannot therefore reload, and cannot look at the
#       viewport in the configuration it runs in. Three small changes, none of them in this file, and
#       every one of them is asserted by the artefact so that closing it is visible.
#
#   editor-viewport-and-gizmos working (unchanged from M5, exercised for the first time).  The
#       viewport presents the engine's own image with no copy through the CPU, across a process
#       boundary, measured. Gizmo geometry, states, snapping, pivots and numeric entry are built and
#       tested. What is NOT exercised is a drag against a real world, for the reason the notes above
#       give.
[criterion.expect_tiers]
editor-ui-ux = "working"
editor-visual-language = "working"
editor-agent-interface = "working"
editor-viewport-and-gizmos = "working"
editor-rust-application = "working"
editor-documents-and-transactions = "working"
editor-architecture = "seed"
asset-import-pipeline = "working"
live-editing = "seed"
text-and-fonts = "seed"
project-and-plugins = "working"
core-type-system = "complete"
scene-graph-and-nodes = "complete"
native-abi = "complete"

