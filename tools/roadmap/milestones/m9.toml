# OFF and gated NOTHING — no `if(CY_NETWORKING)` and no `#if defined` anywhere in the tree, which is
# `CY_UI`'s shape and what M8.b's gate found. Both directions are checked, because an option tested
# in neither is exactly what was wrong with it.
[[criterion]]
