# THE ONE FINDING OF M9'S ADVERSARIAL PASS THAT IS IN THE ENGINE RATHER THAN IN THE CHECKING.
#
# The pass did what the brief asks — "drop packets, reorder them, duplicate them, and confirm the
# four-player session holds" — at the artefact's own 8 % and then above it. The session holds at 8 %
# (4 of 4 clients converge, 271 rollbacks, 0 effects played twice) and at 0 %. At 15 % two clients
# converge. AT 25 % NONE DOES, AND IT IS NOT SLOWNESS:
#
#   ticks=180  datagrams offered 3325  delivered 2559   client0 frontier 54  rollbacks 12
#   ticks=900  datagrams offered 16727 delivered 12757  client0 frontier 54  rollbacks 12
#
# Five times the session, five times the traffic, TWELVE THOUSAND datagrams delivered by the
# transport — and the client's authoritative frontier is frozen at tick 54 of 900, to the tick, with
# the same twelve rollbacks. The datagrams arrive and the application never sees them: the
# reliable-ORDERED stream is stuck behind a hole it never fills, and nothing anywhere notices.
#
# AND THE MODULE ALREADY HAS THE SIGNAL THAT WOULD SAY SO. `ReliabilityChannel::abandoned()` is set
# when a datagram exhausts `RetransmitPolicy::maximum_attempts` — its own comment reads "The
# connection is then over, and saying so is better than retrying forever" — and
# `grep -rn 'abandoned()' src/ samples/` outside `src/networking/src/` and its tests returns
# NOTHING. It is the third armed-and-unread mechanism this milestone has met: the determinism
# firewall (task 1.4b, armed here) and the breadcrumb ring (declared above, still open) are the
# other two, and this one was found by attacking the invariant rather than by reading the code.
#
# WHY IT IS A GAP RATHER THAN A DEMOTION. `networking-and-replication` reaches Working on what a
# real project depends on, and a four-player session over a real adverse network is the artefact
# that shows it. A loss rate at which a reliable stream gives up is a real limit of a real transport;
# what is missing is that the limit is neither detected, reported, nor recovered from —
# `replay-and-rollback`'s "a peer that cannot catch up resynchronises from a snapshot" has no
# trigger, because nothing asks whether the peer is still being caught up at all.
[[criterion]]
id = "reliable-channel-stalls-under-loss"
describe = "A RELIABLE-ORDERED CHANNEL UNDER 25 % LOSS STOPS DELIVERING AND NOTHING NOTICES. The four-player session converges at 0 % and at 8 %; at 25 % no client's frontier ever advances past tick 54, at 180 ticks and at 900 alike, while the transport goes on delivering twelve thousand datagrams. `ReliableEndpoint::abandoned()` is the signal that would say so and has no caller outside its own module, and resynchronisation has no trigger. This criterion runs the session at 25 % and asks for four converged clients"
source = "tasks 8.3, networking-and-replication, replay-and-rollback"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
out="$("$d/samples/09-multiplayer/cy_sample_multiplayer" --only session --ticks 180 --loss 25 2>&1)"
echo "$out" | grep -E "session_(datagrams_offered|datagrams_delivered|converged_clients|duplicate_effects) = |client0_frontier = "
converged=$(echo "$out" | sed -n 's/^session_converged_clients = //p')
duplicated=$(echo "$out" | sed -n 's/^session_duplicate_effects = //p')
test "$duplicated" -eq 0 || { echo "the side-effect ledger let $duplicated effect(s) play twice"; exit 1; }
echo "$converged of 4 clients converged at 25 % loss; the ledger suppressed every duplicate effect at every loss rate measured"
test "$converged" -eq 4
'''
known_gap = "a reliable-ordered channel stops delivering to the application under sustained heavy loss and nothing detects it: the frontier freezes, the transport keeps delivering, `abandoned()` has no caller, and resynchronisation is never triggered. The session holds at the 8 % the artefact uses and at 0 %; it does not at 25 %. Closing it is a reader for the signal the module already raises, and a resync path behind it"
known_gap_closes = "m10"
ci_job = "milestone-m9"

[[criterion]]
id = "gameplay-benchmarks"
describe = "`gameplay-framework`'s PERFORMANCE TABLE IS BENCHMARKED RATHER THAN ASSERTED. The specification's table — 100k active entities, 1M resident, 10k batch spawn, 100k commands a second, indexed queries, integer tag tests, no virtual dispatch — 'SHALL be benchmarked rather than asserted'. At M9 `benchmarks/baseline.json` held six entries and every one of them was `ecs/*` or `harness/*`, and this was a DECLARED GAP until M10 added `benchmarks/gameplay/`: five bodies with committed thresholds, covering the five rows of the table a measurement can speak to. bench_gameplay.cpp names the two it cannot and why, and benchmarks/README.md carries the frame-time fraction the table's last sentence asks for"
source = "tasks 5.1, gameplay-framework"
kind = "command"
run = '''
python3 - <<'CHECK'
import json, sys
recorded = json.load(open("benchmarks/baseline.json"))["benchmarks"]
ids = sorted(recorded)
gameplay = [name for name in ids if name.startswith("gameplay/")]
print(f"{len(gameplay)} gameplay benchmark(s) of {len(ids)} in benchmarks/baseline.json: {ids}")
sys.exit(0 if gameplay else 1)
CHECK
'''
ci_job = "milestone-m9"

# --- What this machine cannot answer --------------------------------------------------------------
#
# ONE ARCHITECTURE, ONE OPERATING SYSTEM. `design.md` §1.4 states it, and it also states what to do
# when the honest mechanism is not buildable inside the milestone: "the honest record is a
# **`known_gap` with a rung that must close it**, never a criterion quietly reported green."
#
# THIS CRITERION WAS `where = "ci"` UNTIL THE CLOSING GATE READ IT, AND THAT WAS THE M8.c DEFECT
# EXACTLY. `where = "ci"` reports NOT EVALUATED on this host — correct — but ci.yml runs the ledger
# with `--ci`, which makes `unmet_requirement()` return nothing and RUNS the command. The command was
# `just test-integration -R replay_log`: a single-leg suite, byte-identical to `replay-log`'s own
# command four sections above, which `criteria.fingerprint` therefore deduplicates into it. So the
# criterion described as "lockstep holds across two platforms" would have gone GREEN in continuous
# integration the first time that job ran, satisfied by a suite with no second architecture in it —
# a criterion whose suite contains no reference to the thing it describes, which is the finding M8.c
# closed on and the reason this gate re-reads every criterion it inherits.
#
# WHAT REPLACES IT RUNS EVERYWHERE AND FAILS EVERYWHERE, and it fails on the true statement: nothing
# in this repository compares a state hash between two architectures. The legs run independently, so
# the shape that would close it is an upload-then-compare job — one leg publishes
# `LockstepSession::publish_hash`'s digest as an artefact, a following job downloads both and
# compares — and the check below looks for exactly that job. It closes at M11, which is the rung
# that owns the platform matrix ("Metal and D3D12 backends, a native platform backend, mobile
# targets"), not at M10, whose subject is worlds.
#
# AND THE SINGLE-LEG SUITE IS NOT LOST: `replay-log` runs it, under its own name, describing what it
# actually asserts.
[[criterion]]
id = "lockstep-cross-platform"
describe = "LOCKSTEP HOLDS ACROSS TWO PLATFORMS FOR THE CrossPlatform PROFILE — AND NOTHING IN THIS TREE HAS COMPARED A STATE HASH BETWEEN TWO ARCHITECTURES, so this runs, fails, and names the rung. `DeterminismConfiguration::require(DeterminismProfile::Lockstep)` refuses in this tree with DeterministicMathMissing rather than granting what nothing measured, and `docs/roadmap/status.yaml` does not record `simulation-and-determinism` as claiming cross-architecture determinism. The check looks for the only shape that could close it: a continuous-integration job that downloads one leg's published hash and compares it with another's"
source = "tasks 0.3, 3.3, ROADMAP M9, design.md §1.4"
kind = "command"
run = '''
python3 - <<'CHECK'
import pathlib, re, sys

workflows = sorted(pathlib.Path(".github/workflows").glob("*.y*ml"))
comparing = []
for path in workflows:
    text = path.read_text(encoding="utf-8")
    for block in re.split(r"\n(?=  [A-Za-z0-9_-]+:\n)", text):
        name = block.strip().split(":", 1)[0].strip()
        lowered = block.lower()
        if "lockstep" not in lowered:
            continue
        if "download-artifact" not in lowered:
            continue
        comparing.append(f"{path.name}:{name}")
print(f"{len(workflows)} workflow(s) examined; "
      f"{len(comparing)} job(s) compare a lockstep hash between legs: {comparing or 'none'}")
if not comparing:
    print("  no job publishes one architecture's state hash and compares it with another's, so the")
    print("  CrossPlatform guarantee is unmeasured rather than met. The six-leg matrix in ci.yml")
    print("  includes linux-arm64, macos-arm64 and windows-arm64: the legs exist and the comparison")
    print("  between them does not.")
sys.exit(0 if comparing else 1)
CHECK
'''
known_gap = "this host has one architecture and one operating system, and no continuous-integration job compares a state hash between two of them. The legs exist — ci.yml's build and test matrices are six, including linux-arm64, macos-arm64 and windows-arm64 — but they run independently, so closing this needs an upload-then-compare job that M9 did not build. It is declared rather than reported NOT EVALUATED because `where = \"ci\"` would have made it PASS in continuous integration, satisfied by a single-leg suite, which is the defect this practice exists to catch"
known_gap_closes = "m11"
ci_job = "milestone-m9"

