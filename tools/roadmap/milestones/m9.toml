# THE EXIT CRITERION'S OWN WORD IS "MEASURED", AND IT IS A CURVE RATHER THAN A POPULATION.
# `cy_net_bandwidth_curve` runs the real `InterestSet` and the real `PriorityScheduler` at eight
# populations and prints CSV; this criterion requires the budget to hold at EVERY row and the
# entities examined to scale with the peer's cells rather than with the world. Asserting a budget at
# one population would satisfy neither half of the sentence.
[[criterion]]
id = "bandwidth-curve"
describe = "BANDWIDTH STAYS WITHIN BUDGET AS ENTITY COUNT SCALES, measured as a curve: the real interest set and the real scheduler at eight populations from 100 to 20,000. Three properties, each read off the rows rather than asserted at one population — the peak bytes never exceed the declared budget; interest management excludes part of the world at every population; and the SELECTED set saturates while the world grows two hundredfold, with the remainder deferred rather than dropped"
source = "tasks 4.4, ROADMAP M9 (measured, not assumed)"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
csv="$(mktemp)"
trap 'rm -f "$csv"' EXIT
"$d/src/networking/tools/cy_net_bandwidth_curve" > "$csv"
cat "$csv"
python3 - "$csv" <<'CHECK'
import csv, sys
rows = list(csv.DictReader(open(sys.argv[1], newline="")))
if len(rows) < 4:
    sys.exit(f"the curve has {len(rows)} point(s): that is a population, not a curve")
over = [r for r in rows if int(r["peak_bytes"]) > int(r["bytes_budget"])]
if over:
    sys.exit(f"the budget is exceeded at {len(over)} population(s): {over[0]}")
everything = [r for r in rows if int(r["candidates"]) >= int(r["population"])]
if everything:
    sys.exit(f"interest management excluded nothing at {len(everything)} population(s): "
             f"{everything[0]}")
first, last = rows[0], rows[-1]
world = int(last["population"]) / max(1, int(first["population"]))
selected = int(last["peak_selected"]) / max(1, int(first["peak_selected"]))
if selected * 4 >= world:
    sys.exit(f"the selected set grew {selected:.1f}x while the world grew {world:.1f}x: "
             "the budget is not bounding anything")
if int(last["deferred_total"]) == 0:
    sys.exit("nothing was deferred at the largest population, so the budget never bit")
print(f"{len(rows)} populations; the budget held at every one "
      f"({last['peak_bytes']} of {last['bytes_budget']} bytes at {last['population']} entities); "
      f"the world grew {world:.0f}x and the selected set {selected:.1f}x, "
      f"with {last['deferred_total']} deferrals")
CHECK
'''
