    "THE DIAGNOSTICS AND GAMEPLAY ROWS DID NOT REACH COMPLETE AT M9, and three declared gaps were why rather than a substitute for saying so: breadcrumbs were armed and had no callers outside their own module, a produced crash artefact still contained the build machine's absolute paths, and `gameplay-framework`'s performance table was specified to be benchmarked and was benchmarked nowhere. Each was a small, nameable piece of work, which is exactly what a declared gap is for — and M10 closed all three, deleting each declaration in the change that closed it. The criteria remain and still run; `breadcrumbs-adopted`, `crash-artefact-paths` and `gameplay-benchmarks` below say what each defends now.",
