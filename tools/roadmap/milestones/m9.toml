# --- The whole tree, in every profile -------------------------------------------------------------
#
# THE IDENTICAL STRING TEN EARLIER LEDGERS USED. `criteria.fingerprint` collapses declarations that
# do the same work, so declaring it here COLLAPSES all of them into one run of it, reported as
# `m1:four-profiles`. That is the whole point of the flat ledger and the reason this string must not
# be "improved" here.
#
# IT MATTERS MORE AT THIS MILESTONE THAN AT ANY EARLIER ONE. M8.c's artefact was red in Debug and
# nobody had looked — a budget measured in `dev` against a path six times slower at `-O0`. Every
# figure this milestone reports is a count rather than a timing, precisely so that the four profiles
# have to agree about it: `cmake/profiles.cmake` compiles Debug at `-O0`, Development and Profile at
# `-O2` and Shipping at `-O3` with interprocedural optimisation, and the spike measured all four
# bit-identical on every one of the engine's own primitives.
[[criterion]]
id = "four-profiles"
describe = "all four profiles build clean and just test-all is green in each — including src/replay/, src/networking/ and the four-player artefact. CY_NETWORKING defaults ON, as `delivery-roadmap` requires of a capability at Working, and `networking-option-off` above is the other direction"
source = "tasks 8.1"
kind = "command"
run = "for p in debug dev profile release; do d=\"${CY_BUILD_DIR:+${CY_BUILD_DIR}/$p}\"; CY_BUILD_DIR=\"$d\" just build-engine --profile \"$p\" || exit 1; CY_BUILD_DIR=\"$d\" just test-all --profile \"$p\" || exit 1; done"
timeout_s = 28800
