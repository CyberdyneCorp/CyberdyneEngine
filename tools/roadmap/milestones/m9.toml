# M9 — Integrity: the exit criteria, as data.
#
# The sources are openspec/changes/implement-m9-integrity/tasks.md and the M9 row of
# docs/ROADMAP.md; every criterion below names which. `delivery-roadmap` requires each to be a recipe
# that exits zero, a command that exits zero, a benchmark within a threshold, or a committed artefact
# that is regenerated and compared — so an intention that cannot be run is a note at the bottom of
# this file, not a criterion.
#
# --- THIS LEDGER DECLARES ONLY M9's OWN CRITERIA, AND THERE IS NO `m8c-green` --------------------
#
# The ledger has been flat since M5 and `just roadmap-test` fails a ledger that invokes another one.
# `just roadmap-milestone m9` evaluates the permanent set directly — the criteria of every milestone
# whose `class = "milestone"` gate carries `state = "green"` and which sits BELOW M9 on the ladder,
# merged and deduplicated, each distinct check run exactly once — and then the criteria in this file.
# `criteria.build_plan` is the rule and tools/roadmap/README.md states it.
#
# A criterion here whose `run` string is identical to one an earlier ledger declared COLLAPSES into
# it and is reported under the earlier label — `m0:format` rather than `m9:format`. The static gates
# are declared anyway, as every ledger since M3 has, because a ledger that does not name the checks
# its milestone had to satisfy is a ledger nobody can read. `four-profiles` below is deliberately
# spelled with the identical string ten earlier ledgers used, for the same reason.
#
# --- EVERY COMMAND IN THIS FILE WAS RUN, EXACTLY AS WRITTEN --------------------------------------
#
# Thirteen gates have run and eighteen of twenty-two findings were in the CHECKING rather than in the
# engine. M6 shipped four criteria that never executed anything; M8.b shipped one that was INVERTED;
# M8.c shipped one whose suite contained no reference to the thing it described — deleting the
# enforcement point left it passing 44 of 44. So, as every ledger since M8.b has required, and with
# one addition this milestone makes:
#
#   * no argument passed THROUGH a `just` recipe contains a shell metacharacter, because `just`'s
#     `*args` is interpolated textually into `bash -c` and an unquoted parenthesis reaches bash;
#   * every `-R` pattern is a `^…$` anchor or one plain word, and every one of them was listed with
#     `ctest -N` and its SELECTION READ rather than counted;
#   * every criterion was executed on this machine and its output pasted into the closing report;
#   * **and every criterion this milestone adds was MUTATED** — the thing it guards was broken and
#     the criterion was watched go red. A check that cannot fail is not a check, and that sentence
#     is this milestone's whole subject.
#
# --- THE THREE CRITERIA THAT ARE THE MILESTONE ---------------------------------------------------
#
#   multiplayer-session     four players, real packet loss, and four clients that roll back and
#                           converge on the host's state hash without playing an effect twice.
#   multiplayer-replay      the recorded log replayed to the IDENTICAL `RecordLog::hash` and the
#                           identical state hash at every tick — a digest, not a tolerance.
#   multiplayer-divergence  a divergence injected on purpose and narrowed to one field of one
#                           component on one entity, with the window that reproduces it.
#
# Each of the three requires the artefact's named step to be IN the output as well as requiring the
# act to pass, for `m8c:slice-control`'s reason: an act deleted from `multiplayer.py` would report
# nothing and exit zero, and that must not read as green.
#
# --- ONE CRITERION IS NOT EVALUATED HERE, AND THAT IS THE HONEST ANSWER --------------------------
#
# `lockstep-cross-platform` carries `where = "ci"` with a reason. This host has ONE ARCHITECTURE and
# ONE OPERATING SYSTEM; the spike's §1.4 says so and `tools/roadmap/criteria.py` has the mechanism —
# `unmet_requirement()` reports NOT EVALUATED rather than passing it. It is declared rather than
# omitted because the question is real and the CI matrix is where it can be asked.
#
# --- AND GAPS ARE DECLARED RATHER THAN HIDDEN ----------------------------------------------------
#
# `known_gap` is M8.c's mechanism and it is used here for what it is for: a criterion that RUNS, that
# FAILS, that PRINTS its failure with the rung that must close it, and that does not hold a permanent
# merge gate red forever. A declared gap that starts PASSING fails the ledger, so none of them can
# outlive itself. Each was found by an implementing agent auditing its own row rather than by the
# gate, and each is why `diagnostics-profiling-and-crash` and `gameplay-framework` do NOT reach
# Complete at this milestone — see `roadmap-tiers` below.
#
# THE DIRECTION THAT KEEPS THEM FROM ROTTING IS THE OTHER ONE, AND IT HAS NOW FIRED. M10 closed
# `breadcrumbs-adopted`, `crash-artefact-paths` and `gameplay-benchmarks`; each declaration was
# deleted in the change that closed it, because the ledger fails a gap that starts passing with THE
# GAP IS CLOSED, DELETE THE DECLARATION. The three criteria are still here and still run — what is
# gone is the marker that said they were allowed to fail. What they now defend, and the suites that
# hold the behaviour behind each, is in their own `describe`.

schema = 1
id = "m9"
name = "Integrity"
artefact = "samples/09-multiplayer — a four-player session over a simulated adverse network, recorded and read four more ways. At 180 ticks on one seeded substrate: 3,346 datagrams offered and 276 destroyed, 73 duplicated, and 95 player inputs that never arrived by the host's deadline and were substituted; 271 rollbacks over 1,530 re-simulated ticks across four clients, every one of which converged on the host's state hash with every tick of the session ultimately simulated from authoritative input; 936 effects offered through the one door RollbackEngine::offer, 630 suppressed by the side-effect ledger, 306 played and 0 played twice; a 990-record log replayed into a fresh world to the IDENTICAL RecordLog::hash and the identical state hash at every tick, and again after seeking to the checkpoint at tick 80; a divergence injected at tick 123 and narrowed to entity 4294967298, component Health(202), field shield(2), with the window — last agreeing tick 122, the checkpoint at tick 120, four commands and the session seed — that reproduces it; and a 720-record crash replay buffer covering ticks 49 to 179, written, read back and re-simulated to the hash the artefact itself carries. The determinism firewall M8.c left armed and guarding nothing is armed here over a real registry and reports 4 of 4 components guarded with 0 underived"

# Non-binding, because none can be settled by running something. `delivery-roadmap` requires a
# criterion that cannot be evaluated by a machine to be restated as a check or moved here.
