# THE FOUR PROFILES HAVE TO AGREE ABOUT THE SESSION, AND THAT IS THE ARTEFACT'S HALF OF §1.2.
#
# The spike's finding is that a determinism profile is a BUILD-CONFIGURATION contract rather than
# only a source contract: two builds of identical source differing in a compile flag produce
# different state hashes. `determinism-lint` checks that from the build's side, over every covered
# module. This checks it from the artefact's side, over a program that plays a session: Debug at
# `-O0` with `CY_UNOPTIMISED` and Development at `-O2` must produce BYTE-IDENTICAL output — every
# count, every state hash and every log digest — from one seed.
#
# It is also the check M8.c's gate would have wanted: its artefact was red in Debug and nobody had
# looked. Every figure this milestone reports is a count rather than a timing precisely so that the
# four profiles have to agree about it.
[[criterion]]
id = "multiplayer-profiles-agree"
describe = "THE SAME SESSION, BUILT TWO WAYS, PRODUCES THE SAME BYTES. Debug at -O0 with CY_UNOPTIMISED and Development at -O2, one seed, and a `diff` over the program's whole output — 125 figures including every state hash, the recorded and replayed `RecordLog::hash`, the narrowed divergence's two field hashes and the crash artefact's reproduced hash. A build-configuration difference that moved a last bit would move the root hash, which is what §1.2 of the design measured and what this refuses to let regress"
