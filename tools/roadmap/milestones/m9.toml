# ================================================================================================
# THE EXIT CRITERION THAT IS A CONFIGURE-TIME REFUSAL, AND WHY IT IS A FIXTURE RATHER THAN A TEST
# ================================================================================================
#
# `docs/ROADMAP.md`: "A session declaring a determinism profile a subsystem cannot meet is REJECTED
# AT CONFIGURATION, not discovered later." A test binary cannot check that: by the time a test runs,
# the configure has already succeeded. So this criterion configures three throwaway projects that
# include `src/core/determinism/cmake/determinism_profile.cmake` and declare a profile over a target
# whose compile options cannot meet it, and requires the first two to FAIL and the third to SUCCEED.
#
# THE THIRD CASE IS THE ONE THAT MAKES IT A CHECK. A criterion that only required failures would
# pass on a function that refused everything, including every module in the engine — which is a
# refusal mechanism nobody could ship. Removing either `message(FATAL_ERROR ...)` from
# `cy_determinism_verify_profiles()` turns this red on the matching case; removing the whole
# function turns it red on both.
[[criterion]]
id = "profile-refused-at-configuration"
describe = "A SESSION DECLARING A PROFILE ITS BUILD CANNOT MEET IS REFUSED WHEN IT IS CONFIGURED. Three fixtures over the real `cy_declare_determinism_profile()`: a target with no contraction flag is refused naming the module and the guarantee, a target with `-ffast-math` is refused naming the option, and a target with the flag configures cleanly — because a refusal that refused everything would not be one"
source = "tasks 2.2, ROADMAP M9 (rejected at configuration, not discovered later)"
kind = "command"
run = '''
set -e
root="$PWD"
work="$(mktemp -d)"
trap 'rm -rf "$work"' EXIT
cat > "$work/CMakeLists.txt" <<'FIXTURE'
cmake_minimum_required(VERSION 3.24)
project(cy_determinism_refusal CXX)
include("${CY_REFUSAL_ROOT}/src/core/determinism/cmake/determinism_profile.cmake")
file(WRITE "${CMAKE_CURRENT_BINARY_DIR}/unit.cpp" "int cy_refusal_unit() { return 0; }\n")
add_library(cy_refusal STATIC "${CMAKE_CURRENT_BINARY_DIR}/unit.cpp")
target_compile_options(cy_refusal PRIVATE ${CY_REFUSAL_OPTIONS})
cy_declare_determinism_profile(cy_refusal PROFILE SamePlatform
    REASON "a fixture that declares a profile its compile options cannot meet")
FIXTURE
configure_case() {
    cmake -S "$work" -B "$work/$1" -G Ninja -D CY_REFUSAL_ROOT="$root" \
          -D CY_REFUSAL_OPTIONS="$2" > "$work/$1.log" 2>&1
}
if configure_case no-flag ""; then
    echo "the configure SUCCEEDED with no contraction flag: the refusal is gone"; exit 1
fi
grep -q "Determinism profile refused at configuration" "$work/no-flag.log"
grep -q "floating-point contraction off" "$work/no-flag.log"
if configure_case fast-math "-ffp-contract=off;-ffast-math"; then
    echo "the configure SUCCEEDED with -ffast-math: the refusal is gone"; exit 1
fi
grep -q "fast-math transformations disallowed" "$work/fast-math.log"
if ! configure_case clean "-ffp-contract=off"; then
    echo "the configure FAILED with the flag present: the refusal refuses everything"
    cat "$work/clean.log"; exit 1
fi
echo "refused: no flag, and -ffast-math. Configured: the flag present."
'''
timeout_s = 900
ci_job = "milestone-m9"

