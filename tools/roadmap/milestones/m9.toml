describe = "`CY_NETWORKING` DEFAULTS ON AND GATES SOMETHING. A configure with no `-D` at all must produce `CY_NETWORKING:BOOL=ON` in the cache AND declare the targets behind it — the module and the artefact — because an option whose default nobody checked is how it came to gate nothing for a whole milestone"
source = "tasks 4.1, delivery-roadmap"
