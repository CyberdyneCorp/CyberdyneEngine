    "tasks 7.5 — opening the M10 change is `m10-open` below, which asks only that the change exists. AT THE TIME THIS FILE WAS WRITTEN IT FAILS, and it is meant to, exactly as m8c.toml's `m9-open` did: openspec/changes/ holds `implement-m9-integrity` and no `implement-m10-*`. The next rung IS M10 — `record.MILESTONES` carries m10 after m9 and no further split has been declared.",
    "tasks 8.x — the gate itself. A milestone cannot make passing its own gate one of the criteria that gate evaluates.",
    "THE ARTEFACT'S FIGURES ARE EXACT RATHER THAN APPROXIMATE, and that is a property of the subject rather than of the machine: the condition simulator draws every drop, duplicate, delay and reorder from a seeded `determinism::RandomStream` indexed by the datagram ordinal, so two runs at one seed destroy the same datagrams. `multiplayer-control` below is the criterion that requires it, by running the session twice and comparing every figure. No number in `artefact` above is a timing.",
