describe = "the change for the next rung exists — open, or closed and archived — so the ladder continues deliberately. That rung is M10, Worlds: environment as one substrate with one producer per field, which `record.MILESTONES` already carries after m9 and against which no further split has been declared"
source = "tasks 7.5, delivery-roadmap"
kind = "path"
path = "openspec/changes/**/*m10*/proposal.md"
ci_job = "milestone-m9"

# THE TIER FLOOR, AND THREE CELLS THIS MILESTONE PLANNED AND DID NOT REACH.
#
# The M9 row of docs/ROADMAP.md planned SIX Complete cells, which would have been the largest load
# any milestone in this plan carries. `design.md` §4 said at proposal time that three of the six were
# contingent, and named the row it expected to demote. What the implementing agents found, auditing
# their own rows rather than waiting for the gate, is a different three:
#
#   simulation-and-determinism  working   NOT Complete, and THE CLOSING GATE DEMOTED IT — the
#                                         seventh consecutive gate to demote a cell, and the one
#                                         demotion no implementing agent proposed. Profiles declared
#                                         and refused at configuration, deterministic parallelism,
#                                         stable iteration, the floating-point policy with its
#                                         thirteen forbidden functions, generated codecs,
#                                         hierarchical hashing, the validator and the lint all
#                                         landed, and Seed -> Working is a real advance. Two
#                                         requirements of the twenty are unmet with no recorded
#                                         exemption, and Complete means every one of them:
#                                           * "Floating-point policy" obliges the engine to provide
#                                             deterministic math types as an optional module —
#                                             fixed-point scalars, vectors, angles and
#                                             transcendental approximations. There is no such
#                                             module, and `profile.h` says so in its own comment:
#                                             "There is no such module in this tree yet". Two of the
#                                             five profiles in the specification's own table cannot
#                                             be granted by this engine.
#                                           * "Simulation performance and testing" obliges a
#                                             strategy-scale determinism benchmark — eight
#                                             participants, 100 000 units, 5 000 agent groups, run
#                                             for minutes under 1, 8 and 16 workers — and names it
#                                             "the reference, not a small synthetic case". Nothing
#                                             of the kind exists; `benchmarks/baseline.json` holds
#                                             six entries and every one is `ecs/*` or `harness/*`,
#                                             which is the same evidence that demotes
#                                             `gameplay-framework` two rows below. A row demoted for
#                                             an absent benchmark and a row completed over the same
#                                             absence cannot both be right.
#                                         Its Complete cell moves to M11, with the deterministic
#                                         math module, because the guarantee that module turns on
#                                         cannot be measured on one architecture.
#   replay-and-rollback         working   REACHED, from nothing.
#   networking-and-replication  working   REACHED, from nothing — and `design.md` §4's predicted
#                                         demotion was this row, which did not need it.
#   diagnostics-profiling-and-crash working NOT Complete. Rolling capture, crash artefacts and
#                                         reproduction artefacts landed; breadcrumbs have no callers
#                                         and a produced artefact still carries absolute paths. Two
#                                         declared gaps above, both closing at M10.
#   save-and-persistence        working   NOT Complete, and unchanged: confidentiality is a
#                                         vetted-AEAD dependency decision rather than a coding task,
#                                         and conflict resolution is unstarted.
#   gameplay-framework          working   NOT Complete, and unchanged: the performance table is
#                                         specified to be benchmarked and is benchmarked nowhere.
#
# FOUR demotions recorded rather than four cells claimed thin, and the fourth was found at the gate
# by reading the specification requirement by requirement rather than by reading the summary. That is
# the practice M5's gate started and M6's, M7's, M8.a's and M8.c's continued, and it is the reason
# this ledger is worth reading at all.
# THE CHECK THAT WOULD HAVE FOUND THE SIX, and it is here because this gate found them by reading.
#
# The M9 column of `docs/roadmap/capability-matrix.md` carried TEN cells and SEVEN of them said
# Complete. Six of those seven belong to rows this milestone never proposed, never touched and never
# audited — `camera-system`, `core-jobs-and-concurrency`, `ecs-core`,
# `gameplay-abilities-and-effects`, `physics` and `sequencing-and-cinematics` — parked in this column
# since the plan was first drawn. Every existing check passed over them: `plan-consistency` compares
# the plan documents WITH EACH OTHER, and they agreed; `roadmap-record` compares the record with
# `openspec/specs/`; `roadmap-tiers` compares the record with the six rows this ledger names. Nothing
# compared THE COLUMN WITH THE RECORD, so a milestone could close with its own column claiming seven
# completions and the record holding one, and no gate would say a word.
#
# This is that comparison, and it is not milestone-specific in shape: every capability with a cell in
# the M9 column must be RECORDED at that tier or above in `docs/roadmap/status.yaml`. The six cells
# were moved to M11 rather than claimed, which is what made this pass.
[[criterion]]
id = "record-matches-plan"
describe = "every tier the M9 COLUMN of the capability matrix claims is a tier the status record supports — the comparison no existing check made, which is how six Complete cells sat in this milestone's column for rows it never examined"
source = "tasks 8.4, delivery-roadmap"
kind = "command"
run = '''
python3 - <<'CHECK'
import sys
sys.path.insert(0, "tools/roadmap")
import plan, record

matrix = plan.read_matrix()
recorded = {e.capability: e for e in record.load()}
short = []
cells = 0
for capability, columns in sorted(matrix.cells.items()):
    planned = columns.get("m9")
    if planned is None:
        continue
    cells += 1
    have = recorded.get(capability)
    tier = have.tier if have else "none"
    if have is None or plan.tier_rank(tier) < plan.tier_rank(planned):
        short.append(f"  {capability}: the M9 column plans {planned} and the record holds {tier}"
                     + (f" from {have.milestone}" if have and have.milestone else ""))
print(f"the M9 column carries {cells} cell(s); {len(short)} of them exceed the status record")
for line in short:
    print(line)
sys.exit(1 if short else 0)
CHECK
'''
ci_job = "milestone-m9"

