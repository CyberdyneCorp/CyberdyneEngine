# --- The committed pictures -----------------------------------------------------------------------
#
# RULE 14, AND EACH ONE SAYS WHICH KIND IT IS ON ITS OWN FACE. M8.c's gate found that a picture which
# does not say whether it is engine output or a drawing gets read as whichever of the two is more
# flattering. `m9-bandwidth-curve.png` is ENGINE OUTPUT — every point is a number the scheduler
# produced. The other five are DIAGRAMS and are labelled as such, because this milestone's subjects
# are a record, a reconciliation and a divergence, none of which has a photograph.

# TASK 7.5b, FIRST HALF: A COMMITTED PICTURE THAT WENT STALE WOULD STILL PASS A `kind = "path"`.
#
# M8.c's closing gate found it and could not fix it inside its own scope: the six criteria below
# check that a FILE EXISTS. `delivery-roadmap` allows "a committed artefact that is regenerated and
# compared", and M8.c's gate reported what making that real needs — a fixed parameter set and a
# tolerance. Both exist here, and the measurement came out better than the tolerance:
#
#   THE THREE ENGINE-OUTPUT FIGURES REGENERATE BYTE-IDENTICALLY, FROM A DEBUG BUILD AT -O0 AGAINST
#   PICTURES DRAWN BY A DEVELOPMENT BUILD AT -O2. Every number behind them is an integer — the
#   scheduler's byte counts, the rollback depths, the substituted inputs, the field a divergence
#   narrowed to — which is the property `multiplayer-profiles-agree` asserts for the session and
#   which the pictures inherit.
#
# THE FIXED PARAMETER SET is `multiplayer.py`'s own defaults, `--ticks 180 --seed 0x0910C0FF`, and
# `cy_net_bandwidth_curve`'s eight populations, which take no arguments at all. THE TOLERANCE is
# stated and is a fallback rather than the assertion: bytes first, and if a future matplotlib writes
# the same picture differently, a pixel comparison with a mean absolute difference of at most 1/255
# and at most one pixel in a thousand differing at all. A changed curve moves far more than that; a
# re-encoded PNG moves far less.
#
# WHAT THIS DOES NOT COVER, SAID PLAINLY. Three of the six pictures are not regenerable here and stay
# `kind = "path"`: `m9-determinism-spike-matrix.png` is drawn by a spike that lives outside this
# repository, and `m9-one-record-five-readers.png` and `m9-replay-rollback-divergence.png` are
# DIAGRAMS with no program behind them. A diagram is checked by reading it, and saying so is better
# than a check that pretends otherwise.
[[criterion]]
id = "figures-regenerated"
describe = "THE THREE ENGINE-OUTPUT FIGURES ARE REGENERATED AND COMPARED, not merely present: the four-player session, the narrowed divergence and the bandwidth curve are redrawn from a fresh run at the artefact's own fixed parameters and compared against the committed files. A picture that went stale — a run whose numbers moved, a figure nobody redrew — fails here, which is what a path criterion cannot do"
source = "tasks 7.5b, 6.5, delivery-roadmap"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
work="$(mktemp -d)"
trap 'rm -rf "$work"' EXIT
mkdir -p "$work/shots"
# The artefact's own defaults are the fixed parameter set: --ticks 180 --seed 0x0910C0FF.
python3 samples/09-multiplayer/multiplayer.py --build-dir "$d" --work "$work/run" --shots "$work/shots" > "$work/artefact.log" || { tail -30 "$work/artefact.log"; exit 1; }
"$d/src/networking/tools/cy_net_bandwidth_curve" > "$work/curve.csv"
python3 src/networking/tools/curve.py "$work/curve.csv" "$work/shots/m9-bandwidth-curve.png" > /dev/null
python3 - "$work/shots" <<'CHECK'
import hashlib, pathlib, sys

FIGURES = ("m9-multiplayer-session.png", "m9-divergence-narrowed.png", "m9-bandwidth-curve.png")
MEAN_TOLERANCE = 1.0 / 255.0     # a re-encoding moves nothing; a changed curve moves whole regions
PIXEL_FRACTION = 0.001

fresh = pathlib.Path(sys.argv[1])
committed = pathlib.Path("docs/design/images")
stale = []
for name in FIGURES:
    a, b = committed / name, fresh / name
    if not b.is_file():
        stale.append(f"{name}: the run drew no such figure")
        continue
    digest = (hashlib.sha256(a.read_bytes()).hexdigest(),
              hashlib.sha256(b.read_bytes()).hexdigest())
    if digest[0] == digest[1]:
        print(f"  {name}: byte-identical to the regenerated figure ({digest[0][:16]})")
        continue
    try:
        import matplotlib.image as image
        import numpy
    except ImportError:
        stale.append(f"{name}: the bytes differ and no pixel comparison is available")
        continue
    one, two = image.imread(a), image.imread(b)
    if one.shape != two.shape:
        stale.append(f"{name}: regenerated at {two.shape} against a committed {one.shape}")
        continue
    difference = numpy.abs(one.astype("float64") - two.astype("float64"))
    mean = float(difference.mean())
    moved = float((difference.max(axis=2) > MEAN_TOLERANCE).mean())
    if mean <= MEAN_TOLERANCE and moved <= PIXEL_FRACTION:
        print(f"  {name}: within tolerance (mean {mean:.5f}, {moved * 100:.3f}% of pixels moved)")
    else:
        stale.append(f"{name}: mean difference {mean:.5f} over {moved * 100:.2f}% of pixels — the committed picture is not this run's")
if stale:
    print(f"{len(stale)} committed figure(s) are not what the engine draws today:")
    for line in stale:
        print(f"  {line}")
    sys.exit(1)
print(f"{len(FIGURES)} committed figure(s) regenerated and compared; none is stale")
CHECK
'''
timeout_s = 7200
ci_job = "milestone-m9"

