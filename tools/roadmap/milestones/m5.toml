ci_job = "format"

[[criterion]]
id = "lint"
describe = "clang-tidy is clean over the C and C++ M5 added. It says nothing about the editor, which is Rust: `editor` below is that half, and the two are separate criteria because they are separate toolchains with separate failure modes"
source = "tasks 7.7"
kind = "recipe"
run = "just quality-lint"
ci_job = "lint"

[[criterion]]
id = "layering"
describe = "the layer order holds with the editor layer occupied for the first time — and the editor is not in this check at all, because it reaches the engine ONLY over the C ABI and links no engine target. That is enforced by the editor workspace containing no path to one, and by its own layering test, not by this recipe"
source = "tasks 7.7, design.md"
