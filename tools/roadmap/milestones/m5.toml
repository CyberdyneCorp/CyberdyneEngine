# M5 — Authorable: the exit criteria, as data. Task 7.9.
#
# The sources are section 7 of openspec/changes/implement-m5-authorable/tasks.md and the M5 row of
# docs/ROADMAP.md; every criterion below names which. `delivery-roadmap` requires each to be a
# recipe that exits zero, a test that passes, a benchmark within a threshold, or a committed
# artefact that is regenerated and compared — so an intention that cannot be run is a note at the
# bottom of this file, not a criterion.
#
# `ci_job` names the gate in tools/roadmap/gates.toml under which continuous integration runs the
# criterion. It is required on every criterion, including the ones this machine can evaluate: a
# criterion that passes locally and runs nowhere else is not a gate. A criterion that cannot be
# evaluated on the host running the recipe — another operating system, no display, no GPU — carries
# a `reason`, is reported as not evaluated rather than as passed, and is counted separately.
#
# --- THIS IS THE FIRST LEDGER WRITTEN AGAINST A FLAT PERMANENT SET --------------------------------
#
# Every earlier ledger opened with an `m<n-1>-green` criterion that ran the previous milestone's
# recipe, so closing M4 ran M3's ledger, which ran M2's, which ran M1's, which ran M0's. That is
# gone — task 0.1 of this milestone removed it — and there is deliberately NO `m4-green` criterion
# below. `just roadmap-milestone m5` evaluates the permanent set directly: the criteria of every
# milestone whose `class = "milestone"` gate in gates.toml carries `state = "green"` and which sits
# below M5 on the ladder, merged and deduplicated, each distinct check run exactly once, plus the
# criteria in this file. `criteria.build_plan` is the rule and tools/roadmap/README.md states it.
#
# What that changes for the reader of this file: a criterion here whose `run` string is identical to
# one an earlier ledger declared COLLAPSES INTO IT and is reported under the earlier milestone's
# label — `m0:format` rather than `m5:format`. The static gates below are declared anyway, as M3's
# and M4's are, because a ledger that does not name the checks its milestone had to satisfy is a
# ledger nobody can read; they cost nothing to declare and one run each.
#
# --- WHERE THE EDITOR'S OWN TESTS ARE, AND WHY THEY ARE ONE CRITERION -----------------------------
#
# The editor is a Rust workspace and its tests are Cargo's: 505 of them across fourteen crates,
# including the ones that hold this milestone's invariants — that a document can only be mutated
# through a transaction, that the workspace's layers cannot be depended on upward, that every crate
# but the audited SDK forbids `unsafe`, that the four build profiles mean in Cargo what they mean in
# CMake, and that the editor survives its runtime being killed. They run under ONE command,
# `just build-editor-check`, so they are one criterion (`editor`) with a long description rather
# than nine criteria that would all pass and fail together. That is the same shape as M4's `abi`.
#
# THE GAP THIS CLOSES IS THE ONE THREE SEPARATE REPORTS NAMED: until this milestone nothing ran
# `just build-editor-check` automatically. It was green in all four profiles, called by no CI job
# and by no other recipe, so a change that broke the editor's clippy, its rustfmt or its 505 tests
# merged silently. The `editor` gate and the `editor` job in .github/workflows/ci.yml land with this
# file for that reason.

schema = 1
id = "m5"
name = "Authorable"
artefact = "samples/05-editor-session — a scripted editor session across three processes: it opens a project, imports a glTF asset, authors a scene against a hosted runtime, outlives that runtime being killed with SIGKILL mid-session, and recovers and saves the unsaved work in a new editor process"

# Non-binding, because none can be settled by running something. `delivery-roadmap` requires a
# criterion that cannot be evaluated by a machine to be restated as a check or moved here.
notes = [
    "tasks 7.9 — `just roadmap-milestone m5` is this recipe, so it cannot be one of the criteria it evaluates.",
    "tasks 7.10 — docs/roadmap/status.yaml and docs/roadmap/capability-matrix.md are corrected where M5 recorded an intention the implementation changed, and record what is thinner than the tasks claim. `roadmap-tiers` below checks the record; no tool can tell an intention from its correction.",
    "tasks 7.11 — archiving this change happens after this recipe passes, so it cannot be one of the criteria it must satisfy.",
    "tasks 7.12 — opening the M6 change is `m6-open` below, which asks only that the change exists. Whether the derivation key model is the right named spike is a judgement.",
    "ROADMAP M5, 'Picking returns the object the renderer actually drew' — EVALUATED BY THIS RECIPE, and deliberately not as a criterion of its own. Engine-side picking and the viewport transport are cases inside `unit.render_server`, and m3.toml already declares `just test-unit -R render_server` as its `render-server` criterion. That criterion is in the permanent set, so this ledger runs it — once, labelled `m3:render-server`. Declaring the identical command here would collapse into it and lose this file's wording; declaring a NARROWER one would run the same suite twice to say less. This note is the honest form: the check exists, this recipe evaluates it, and the milestone it is filed under is M3's. It is also the clearest demonstration of what the flat ledger bought.",
    "ROADMAP M5, 'The generated inspector edits a reflected type with no per-type editor code' — HELD BY `editor` BELOW rather than by a criterion of its own, because it is a Cargo test: cy-editor-interface's suite builds a catalogue out of a real `CyInterface` table reached through dlopen and generates a form from it. What is thinner than the task list is that the inspector VIEW MODEL reads a document's schema rather than a reflected engine type over the SDK — the SDK's `ComponentSchema` is built and tested and not yet wired to it. Recorded here because it is exactly the kind of gap a green recipe hides.",
    "ROADMAP M5, 'manipulate it with gizmos ... enter play mode' IN THE ARTEFACT — NOT SATISFIED, and the artefact says so on every run rather than being quietly narrowed. `cy_editor_services::builtin::register` registers six commands and none of them transforms anything, starts a simulation or imports; the machinery for all three exists and is tested (`cy_editor_viewport::gizmo`, `cy_editor_viewport::play`, tools/import/). session.py names the three command identifiers it wants, reports each as present or missing, and runs them the day they are registered. samples/05-editor-session/README.md carries the whole argument.",
    "THERE IS NO `text` GATE, and text-and-fonts reaches Seed. The suite runs — `text` below is a criterion — and it is covered by `just test-all` in the build-and-test gate. M4 made the same call for camera and audio and stated the rule: what separates a gate from a suite is an invariant a later milestone can silently undo, and a gate list that names every module is a gate list nobody reads.",
    "The gate set this milestone's criteria join on close is tools/roadmap/gates.toml; `just roadmap-gates` prints it. M5 adds editor, editor-session, asset-import and live-editing to it.",
]

# --- What M5 must not have broken -----------------------------------------------------------------
#
# No criterion, and for the first time no `m<n>-green` criterion either. M4's, M3's, M2's and M1's
# criteria are in the permanent set and `just roadmap-milestone m5` evaluates that set directly,
# once and deduplicated, before it reaches the criteria below. The rule the old chaining criterion
# enforced is unchanged and still enforced; the nesting is what went, and this is the first ledger
# written after it did.

# --- The static gates: cheap, and they fail first -------------------------------------------------

[[criterion]]
id = "specs"
describe = "openspec validate --specs --strict passes"
source = "tasks 7.11"
kind = "recipe"
run = "just quality-specs"
ci_job = "specs"

[[criterion]]
id = "format"
describe = "the formatting gate is green over the modules M5 added — the importer, the text server, the derived cache and the render server's picking and viewport transport"
