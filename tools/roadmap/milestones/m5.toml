# The M5 row of docs/ROADMAP.md and the proposal's capability list, as data. An exit tier is a FLOOR
# rather than an equality: a later milestone advancing one of these past its M5 level must not make
# this recipe fail.
#
# READ `live-editing = "working"` AS A CLAIM SOMEBODY STILL HAS TO EARN. It is what the ROADMAP row
# and the proposal both say, so it is what this ledger asks for; the import workstream's own report
# says that only the asset half is delivered and that marking it Working "would be the first thing a
# reviewer finds untrue". Whoever closes M5 either finishes it or amends this table with the reason —
# what must not happen is the table being quietly relaxed to match whatever the record says.
[criterion.expect_tiers]
editor-rust-application = "working"
editor-documents-and-transactions = "working"
editor-architecture = "working"
editor-viewport-and-gizmos = "working"
editor-ui-ux = "working"
asset-import-pipeline = "working"
live-editing = "working"
text-and-fonts = "seed"
editor-agent-interface = "seed"
editor-visual-language = "seed"
project-and-plugins = "complete"
core-type-system = "complete"
scene-graph-and-nodes = "complete"
native-abi = "complete"

# --- The editor, which is the milestone ------------------------------------------------------------

# TASKS 7.1, 7.2, 7.3, 7.5 AND 6.3, ALL UNDER ONE COMMAND, AND THE DESCRIPTION IS THE LIST BECAUSE
# THE COMMAND IS ONE. `just build-editor-check` runs the SDK generator's own selftest, rustfmt over
# the hand-written sources, clippy with the workspace's pedantic lint table as errors, and 505 tests.
[[criterion]]
id = "editor"
describe = "the editor's own gates and its whole test suite: the generated SDK bindings are what regeneration produces, rustfmt and clippy are clean, and every invariant this milestone pins is held by a test — a document mutated only through a transaction and the test that writes around it and fails, undo and redo round-tripping a session, the journal replaying after an abnormal termination, no crate depending upward or sideways on another, every crate but the audited SDK forbidding unsafe code, the four profiles meaning in Cargo what they mean in CMake, the generated inspector built from a real CyInterface table reached through dlopen, and the editor surviving a runtime process killed under it"
source = "tasks 2.x, 3.x, 4.6, 6.3, 7.1, 7.2, 7.3, 7.5, ROADMAP M5"
kind = "recipe"
run = "just build-editor-check"
timeout_s = 3600
ci_job = "editor"

# HARD-WON, AND THE REASON IT IS A SEPARATE CRITERION: `debug-assertions` is off in two of the four
# Cargo profiles, exactly as CY_ASSERT is compiled out of Profile and Shipping. A rule that is only
# a `debug_assert!` is no rule at all there, and `panic = "abort"` was deliberately kept OUT of the
# shipping profile so that `cargo test` can run in it — which would be worth nothing if nothing ever
# ran the tests there. This is what runs them there.
[[criterion]]
id = "editor-profiles"
describe = "the editor's gates and tests in all four profiles, so the two configurations that compile the assertions out are configurations something has been run in"
source = "tasks 2.1, 7.7"
kind = "command"
run = "for p in debug dev profile release; do just build-editor-check --profile \"$p\" || exit 1; done"
timeout_s = 7200
ci_job = "editor"

[[criterion]]
id = "editor-three-platforms"
describe = "the editor's headless tests run in continuous integration on Linux, Windows and macOS — the ROADMAP's exit criterion, and the reason the `editor` gate names three platforms while `editor-session` names one"
source = "ROADMAP M5 (Editor headless tests run in continuous integration on all three platforms)"
kind = "recipe"
run = "just build-editor-check"
where = "ci"
reason = "this host runs one operating system; the other two are built only by the CI matrix, and neither has ever built this workspace"
ci_job = "editor"

# --- The artefact --------------------------------------------------------------------------------------

# TASK 6.1 AND TASK 6.2, AND 6.2 IS THE ONE THE MILESTONE IS ABOUT. The session runs three real
# processes — the engine's importer, the editor, and a hosted runtime on the other side of a Unix
# domain socket — and kills the runtime with SIGKILL while the editor is connected to it and has not
# yet run its act. The kill is ORDERED rather than timed: the act reaches the editor through a FIFO,
# so every command in it provably runs after the runtime died. The first attempt at this raced and
# killed the runtime after the editor had already exited, which is a green run that proves nothing.
[[criterion]]
id = "artefact"
describe = "the scripted session: a project opened and its manifest validated, a glTF imported to six sub-assets with both sidecars written and a second import served from the cache, a scene authored against a hosted runtime, that runtime killed mid-session with the editor completing every command afterwards and surfacing the loss with a remedy, and the unsaved work offered back and saved in a new editor process"
source = "tasks 6.1, 6.2, 7.1, ROADMAP M5"
kind = "recipe"
run = "just test-smoke -R editor_session"
ci_job = "editor-session"

# AND THE ARTEFACT'S OWN NEGATIVE CASES. The test above can only report that the session passed; it
# says nothing about whether the two assertions that carry it still FIRE. This requires the act that
# kills the runtime to REJECT a run where the runtime was left alive, and the act that authors
# against a hosted runtime to reject a session whose runtime never answered. Separate rather than a
# flag, so that a failure names which half broke: "the editor stopped surviving its runtime" and
# "the check that would have noticed has stopped working" are different defects.
[[criterion]]
id = "artefact-selftest"
describe = "the session driver's own negative cases, which require its two load-bearing assertions to fail when they should"
source = "tasks 6.2, testing-and-quality"
kind = "recipe"
run = "just test-integration -R editor_session_selftest"
ci_job = "editor-session"

[[criterion]]
id = "sample-recipe"
describe = "just run-editor-session runs the artefact through the workflow a contributor uses, rather than only through the test that registers it — the act that kills the runtime, which is the one worth watching"
source = "tasks 6.1"
kind = "recipe"
run = "just run-editor-session --only survive"
ci_job = "editor-session"

# --- Import ---------------------------------------------------------------------------------------------

[[criterion]]
id = "asset-import"
describe = "the importer framework and what it refuses: an importer that is handed bytes and cannot open a file, a second file read only through the resolver that records it as a dependency in the same act, two importers refused one extension, an option refused that the schema does not declare, setting an option to its default producing the same cache key as never setting it, mesh welding that keeps a hard edge and a texture seam, cache-order-independent simplification, glTF to meshes and materials and a hierarchy with collision proxies from the naming convention, and a failed import that is NOT cached"
source = "tasks 5.1, ROADMAP M5 (asset-import-pipeline)"
kind = "command"
run = "just test-unit -R import && just test-integration -R import_"
ci_job = "asset-import"

[[criterion]]
id = "derived-cache"
describe = "the one derived-data cache under the importer: a derivation key whose every contribution is framed so that two different inputs cannot collide, a miss that is not an error, a record that cannot be read being deleted rather than reported as a build failure, dependencies re-digested through the caller's resolver because the key cannot cover what a producer discovered while running, and a hit that REPRODUCES the output rather than skipping it"
source = "tasks 5.1, ROADMAP M5 (the cook cache, dependency tracking)"
kind = "command"
run = "just test-unit -R assets && just test-integration -R assets_io"
ci_job = "asset-import"

# --- Live editing ----------------------------------------------------------------------------------------

# TASK 1.1 AND TASK 7.6. M4 proved the reload model — serialize, migrate by name, recreate, never
# dlclose — and left the milestone with nothing that reloaded a module while the runtime was live.
# That was M4's recorded half-satisfied criterion and it is this milestone's first requirement.
[[criterion]]
id = "live-reload"
describe = "a module reloads while the runtime is live and world state survives it, applied at a frame boundary rather than under a system, over a directory of generations rather than one file — because a Swift image needs a distinct module name per generation and copying a file cannot produce one"
source = "tasks 1.1, 5.2, 7.6, ROADMAP M5 (live-editing)"
kind = "recipe"
run = "just test-integration -R live_reload"
ci_job = "live-editing"

[[criterion]]
id = "runtime-inspection"
describe = "runtime inspection over the ABI: the world's components, their fields and their chunks read from outside the process that owns them, which is what an editor attached to a running game actually does"
source = "tasks 1.2, 5.2, ROADMAP M5 (runtime inspection)"
kind = "recipe"
run = "just test-integration -R abi_inspector"
ci_job = "live-editing"

# --- Text at Seed ------------------------------------------------------------------------------------------

[[criterion]]
id = "text"
describe = "the text server at Seed: a backend that refuses a shaping level it cannot provide BY NAME rather than silently downgrading, a right-to-left or vertical request refused rather than laid out wrongly, a glyph key that is a face and a size and a subpixel position and nothing else, and an atlas that counts thrashes — which is the number that says it is too small, and not its occupancy"
source = "tasks 5.3, ROADMAP M5 (text-and-fonts)"
kind = "recipe"
run = "just test-unit -R text"
ci_job = "build-and-test"

# --- Every profile, and the sanitizers -------------------------------------------------------------------------

# ONE BUILD DIRECTORY PER PROFILE, EVEN WHEN CY_BUILD_DIR IS SET — m2.toml's finding E, restated
# because the failure it describes cost an agent an hour. The command is identical to the one M1, M2,
# M3 and M4 declare, so the plan collapses all five into ONE run of it and reports it as
# `m1:four-profiles`: this is the deduplication the milestone's task 0.1 was for, and the reason the
# same string is written here rather than a variation of it.
#
# It now covers the editor too, without saying so: `just test-all` includes `smoke.editor_session`,
# which builds the editor in the profile under test before running the session.
[[criterion]]
id = "four-profiles"
describe = "all four profiles build clean and just test-all is green in each — including the M5 artefact's session, which builds the editor in the profile under test"
source = "tasks 7.7"
kind = "command"
run = "for p in debug dev profile release; do d=\"${CY_BUILD_DIR:+${CY_BUILD_DIR}/$p}\"; CY_BUILD_DIR=\"$d\" just build-engine --profile \"$p\" || exit 1; CY_BUILD_DIR=\"$d\" just test-all --profile \"$p\" || exit 1; done"
timeout_s = 28800
ci_job = "profiles"

# TASK 7.8. NO PRE-CONFIGURED TREE AND NO FLAGS, WHICH IS THE WHOLE POINT — M4's equivalent
# criterion passed by configuring its own tree with `-D CY_SHADER_SLANG=OFF` while the CI job it
# stood for passed no such flag and went on failing, and because the workaround covered the one
# failure somebody had noticed, two others survived undetected. `just test-sanitize` already builds a
# sanitized tree of its own and honours CY_BUILD_DIR as the PARENT of it, so this command is the one
# a person or a job runs with nothing in front of it.
[[criterion]]
id = "sanitizers"
describe = "AddressSanitizer and UndefinedBehaviorSanitizer are clean over every C++ suite M5 added: the importer and its glTF reader and mesh operations, the text server and its glyph atlas, the derived-data cache, and live reload over the ABI"
source = "tasks 7.8"
kind = "command"
run = "for t in import text assets abi_live_reload; do just test-sanitize --sanitizer address,undefined --tests \"$t\" || exit 1; done"
timeout_s = 14400
ci_job = "sanitizers"

[[criterion]]
id = "three-platforms"
describe = "build and test are green on Linux, Windows and macOS with M5's modules in the tree"
source = "ROADMAP M5, delivery-roadmap"
kind = "command"
run = "just env-doctor && just build-engine && just test-all"
where = "ci"
reason = "this host runs one operating system; the other two are built only by the CI matrix"
ci_job = "build-and-test"

# --- What comes next ---------------------------------------------------------------------------------------

# `**` rather than `*`, for the reason recorded against M0's `m1-open`: `openspec archive` moves a
# closed change under `openspec/changes/archive/`, and a pattern that only matches an *open* change
# turns red on the day the next milestone closes — which is the one day this criterion should be
# most satisfied.
[[criterion]]
id = "m6-open"
describe = "the M6 change exists — open, or closed and archived — so the ladder continues deliberately"
source = "tasks 7.12"
kind = "path"
path = "openspec/changes/**/*m6*/proposal.md"
ci_job = "milestone-m5"
