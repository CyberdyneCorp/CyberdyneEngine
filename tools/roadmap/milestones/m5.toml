describe = "the generated-code gate, all three of its commands: the headers are current and reproducible, the generator's own fixtures still reject what they are meant to reject, and THIRD_PARTY.md matches the dependency manifest. M5 adds a fourth generator — the Rust SDK's — whose currency is checked by `editor` below, because it is a Cargo test rather than a recipe"
source = "tasks 7.7, delivery-roadmap (a gate a ledger does not run is a gate a milestone can break invisibly)"
