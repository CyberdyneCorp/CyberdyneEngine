# M2 — World: the exit criteria, as data. Task 6.9.
#
# The sources are section 6 of openspec/changes/implement-m2-world/tasks.md and the M2 row of
# docs/ROADMAP.md; every criterion below names which. `delivery-roadmap` requires each to be a
# recipe that exits zero, a test that passes, a benchmark within a threshold, or a committed
# artefact that is regenerated and compared — so an intention that cannot be run is a note at the
# bottom of this file, not a criterion.
#
# `ci_job` names the gate in tools/roadmap/gates.toml under which continuous integration runs the
# criterion. It is required on every criterion, including the ones this machine can evaluate: a
# criterion that passes locally and runs nowhere else is not a gate. A criterion that cannot be
# evaluated on the host running the recipe — another operating system, no display — carries a
# `reason`, is reported as not evaluated rather than as passed, and is counted separately.
#
# The first criterion is M1's whole set, for the reason m1.toml records against M0's: a later
# milestone may not break an earlier milestone's gate, and the way to keep that true is for the
# closing recipe to run it rather than for a reviewer to remember it. M1's ledger runs M0's, so this
# one criterion carries the whole ladder below it.

schema = 1
id = "m2"
name = "World"
artefact = "samples/02-headless-sim — authors a scene, cooks it into archetype blocks, ticks 10,000 fixed steps, and prints a hierarchical state hash that reproduces across processes and after snapshot restore"

# Non-binding, because none can be settled by running something. `delivery-roadmap` requires a
# criterion that cannot be evaluated by a machine to be restated as a check or moved here.
notes = [
    "tasks 6.9 — `just roadmap-milestone m2` is this recipe, so it cannot be one of the criteria it evaluates.",
    "tasks 6.10 — docs/roadmap/status.yaml and docs/roadmap/capability-matrix.md are corrected where M2 recorded an intention the implementation changed, and record what is thinner than the tasks claim. `roadmap-tiers` below checks the record; no tool can tell an intention from its correction.",
    "tasks 6.11 — archiving this change happens after this recipe passes, so it cannot be one of the criteria it must satisfy.",
    "ROADMAP M2 — 'a bulk-copy activation is benchmarked' is `ecs-blocks` below, which runs the 100,000-row activation inside the integration suite's per-case time budget. That is a threshold a regression trips, but it is NOT a committed ns/entity figure compared against benchmarks/baseline.json: no benchmark runner exists for the ECS, only for the job system. The numbers the spike measured — 3.7 ns/entity for cell activation against 11.2 for a template spawn into partly full chunks — are recorded in openspec and in samples/02-headless-sim/README.md rather than gated. A `cy_add_benchmark(NAME ecs ...)` is the honest fix and it belongs to whoever owns src/ecs/.",
    "tasks 6.1 — 'identical across restore-from-snapshot' is checked as the round trip: capture, diverge, restore, and the hash matches again. Re-running a restored snapshot and reproducing the trajectory needs the clock rewound to the same epoch, and `Simulation` exposes only `reset_epoch()`, which by design enters a new one. That is M9's, and samples/02-headless-sim/README.md says so where a reader of the hash will look.",
    "tasks 6.3, 6.7, 6.8 — the sanitizer passes and the three non-default profiles each cost a build of their own. They are criteria rather than notes because they are runnable; expect this recipe to take a working session rather than a coffee break.",
    "tasks 6.7 — FIXED AT THE GATE, AND THE RESIDUAL IS RECORDED. `just test-all --profile debug` failed 8 runs in 10 on `unit.reflect_registry` and, once that was fixed, 16 in 30 on `unit.scene`. Both were M2's own additions overrunning the taxonomy's one-millisecond unit budget at -O0: the registry's growth case does twenty thousand lookups and moved to integration.reflect_scaling, and three scene files whose cases walk the whole tree moved to integration.scene_scale. After both moves the same measurement is 1 failure in 30, on test_hierarchy.cpp's first case, which pays the process cold start. That residual is a property of a per-case wall-clock budget at -O0 rather than of any code M2 wrote; it is recorded in docs/roadmap/capability-matrix.md and in src/scene/tests/CMakeLists.txt, and until it is addressed `four-profiles` is flaky at roughly three per cent in the Debug configuration.",
    "The gate set this milestone's criteria join on close is tools/roadmap/gates.toml; `just roadmap-gates` prints it. M2 adds state-hash, cooked-blocks, scene-coherence and structural-deferral to it.",
]

