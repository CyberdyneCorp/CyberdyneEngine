# ONE INVOCATION PER SUITE, RATHER THAN ONE REGEX. `just` substitutes `{{args}}` as *text* into a
# recipe's shell and then again into the private recipe it calls, so a `|` in a suite regex is
# re-read as a pipe on the way down and the run silently becomes a different one — the first attempt
# at this criterion ran the wrong sanitizer over the wrong suites and reported `scene: command not
# found`. A loop in the criterion needs no quoting to survive anything, and it names what it covers.
#
# NOT `--tests .` — the whole set — although that is the stronger claim and takes 34 s here.
# `just test-sanitize` exports CY_TEST_BUDGET_SCALE=0 to give a five-to-twenty-times-slower binary
# room, and tests/unit/harness/test_assertions.cpp:60 asserts `budget_scale() > 0.0`, so the harness
# suite fails under every sanitizer run that includes it. M1's gate never did (`--tests jobs`), so
# nothing had met it. That is a defect in tests/unit/harness/ or in just/test.just and it is
# reported rather than worked around; when it is fixed, this criterion becomes `--tests .`.
[[criterion]]
id = "asan-world"
describe = "AddressSanitizer and UndefinedBehaviorSanitizer are clean over every suite M2 added, with the intentional lifetime allocations declared"
source = "tasks 6.8"
kind = "command"
run = "for t in ecs scene serialize determinism runtime; do just test-sanitize --sanitizer address,undefined --tests \"$t\" || exit 1; done"
timeout_s = 7200
ci_job = "sanitizers"

[[criterion]]
id = "tsan-world"
describe = "ThreadSanitizer is clean over the suite that runs two systems over one world at once — the first thing in the engine that does"
source = "tasks 6.8"
kind = "recipe"
run = "just test-sanitize --sanitizer thread --tests ecs_scheduling"
timeout_s = 7200
ci_job = "sanitizers"

# ONE BUILD DIRECTORY PER PROFILE, EVEN WHEN CY_BUILD_DIR IS SET. Without the `:+` below, a
# developer who redirects the build tree gets all four profiles configured into that one directory,
# each configure overwriting the last, and the criterion fails for a reason that has nothing to do
# with the code. That is not hypothetical: it cost an agent an hour during M1 and is written into
# this milestone's handoff notes as finding E. With CY_BUILD_DIR unset the recipes already pick
# `build/<profile>`, so the expansion is empty and the default is unchanged.
[[criterion]]
id = "four-profiles"
describe = "all four profiles build clean and just test-all is green in each — deferral is refused in Profile and Shipping too, where CY_ASSERT is compiled out"
source = "tasks 6.7"
kind = "command"
run = "for p in debug dev profile release; do d=\"${CY_BUILD_DIR:+${CY_BUILD_DIR}/$p}\"; CY_BUILD_DIR=\"$d\" just build-engine --profile \"$p\" || exit 1; CY_BUILD_DIR=\"$d\" just test-all --profile \"$p\" || exit 1; done"
timeout_s = 14400
ci_job = "profiles"

[[criterion]]
id = "three-platforms"
describe = "build and test are green on Linux, Windows and macOS with M2's modules in the tree"
source = "ROADMAP M2, delivery-roadmap"
kind = "command"
run = "just env-doctor && just build-engine && just test-all"
where = "ci"
reason = "this host runs one operating system; the other two are built only by the CI matrix"
ci_job = "build-and-test"

# --- What comes next ---------------------------------------------------------------------------------

# `**` rather than `*`, for the reason recorded against M0's `m1-open`: `openspec archive` moves a
# closed change under `openspec/changes/archive/`, and a pattern that only matches an *open* change
# turns red on the day the next milestone closes — which is the one day this criterion should be
# most satisfied.
[[criterion]]
id = "m3-open"
describe = "the M3 change exists — open, or closed and archived — so the ladder continues deliberately"
source = "tasks 6.12"
kind = "path"
path = "openspec/changes/**/*m3*/proposal.md"
ci_job = "milestone-m2"
