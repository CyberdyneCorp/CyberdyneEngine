# THE OPTIONS THIS MILESTONE ADDED, EACH BUILT WITH ITS FEATURE OFF. Hard rule: a delivered feature
# is on by default AND must build with its option off, and M8.b's own spike found
# `-DCY_RENDERER_VULKAN=OFF` could not be configured at all — an option declared, defaulted on, and
# never once built without. Three new options default ON in this milestone and this is the check
# that they are still removable.
#
# CY_UI JOINED THIS LIST AT THE CLOSING GATE, and how it got there is the whole argument for the
# criterion. `ui-system` reached Working over six modules, forty-five unit cases, a scale suite and
# an accessibility audit — with `CY_UI` still at OFF, the default it was given when src/ui/ did not
# exist, and gating NOTHING: there was no `if(CY_UI)` and no `#if defined(CY_UI)` anywhere in the
# tree, so `-D CY_UI=OFF` and the default build produced identical output. An option that removes
# nothing satisfies "SHALL be removable at build time via CY_UI" by never being tested either way.
# `delivery-roadmap` lists exactly this as a shape that SHALL be checked rather than re-discovered,
# and it was re-discovered.
#
# CY_NAVIGATION IS SWITCHED OFF TOGETHER WITH CY_AI, AND THAT IS THE DECLARED DEPENDENCY RATHER THAN
# A WORKAROUND. `cmake/features.cmake`'s CY_FEATURE_REQUIRES_ALL carries `CY_AI|CY_NAVIGATION`,
# because `ai-system` requires agents to "drive movement through the navigation system rather than
# implementing their own pathfinding". `-D CY_NAVIGATION=OFF` alone is REFUSED at configure time
# with the two ways out named — which is the behaviour that rule wants, and it is what this
# criterion found the first time it was run.
[[criterion]]
id = "feature-options-off"
describe = "the whole tree configures and builds with each of this milestone's new feature options switched off — CY_ANIMATION alone, CY_AI alone, CY_UI alone, and CY_NAVIGATION together with the CY_AI that depends on it. A capability that cannot be removed at build time is not behind an option, whatever cmake/features.cmake says; and samples/08-vertical-slice declares nothing at all in the configurations where its subjects are absent, rather than turning a removable feature into a configure error naming the artefact"
source = "tasks 5.x, 6.x, 9.x, delivery-roadmap, testing-and-quality"
kind = "command"
run = "set -e; d=\"${CY_BUILD_DIR:+${CY_BUILD_DIR}/off-animation}\"; CY_BUILD_DIR=\"$d\" just build-engine --profile dev -D CY_ANIMATION=OFF; d=\"${CY_BUILD_DIR:+${CY_BUILD_DIR}/off-ai}\"; CY_BUILD_DIR=\"$d\" just build-engine --profile dev -D CY_AI=OFF; d=\"${CY_BUILD_DIR:+${CY_BUILD_DIR}/off-ui}\"; CY_BUILD_DIR=\"$d\" just build-engine --profile dev -D CY_UI=OFF; d=\"${CY_BUILD_DIR:+${CY_BUILD_DIR}/off-navigation}\"; CY_BUILD_DIR=\"$d\" just build-engine --profile dev -D CY_NAVIGATION=OFF -D CY_AI=OFF"
timeout_s = 14400
ci_job = "milestone-m8b"
