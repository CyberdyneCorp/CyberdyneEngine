# THIS CRITERION WAS INVERTED AND THE CLOSING GATE FOUND IT BY RUNNING IT. It read
#
#     if just run-vertical-slice --only control; then echo '...not a control'; exit 1; fi
#
# — asserting that the DRIVER exits non-zero. It does not, and it should not: `--only control` runs
# act 4, whose job is to run the sample with `--interpret-control` and require THAT to fail. The
# inversion already lives inside slice.py, at `run_sample(..., expect_failure=True)`, so the wrapper
# inverted it a second time and the criterion was red on a tree where the negative control worked
# perfectly. It had never been run as written; the artefact's own report shows act 4 passing and
# this line untried.
#
# WHAT IT ASSERTS NOW, AND WHY BOTH HALVES ARE NEEDED. The run must SUCCEED — the planted
# per-entity virtual tick was found and the sample exited non-zero because of it — AND the named
# step must appear in the output. Without the second half, deleting `act_control` from slice.py
# would leave `--only control` reporting zero steps and exiting zero, and this criterion would go
# green over a control that no longer exists. That is the exact shape of M6's four criteria that
# never ran.
[[criterion]]
id = "slice-control"
describe = "THE NEGATIVE CONTROL, demonstrated on every ledger run rather than asserted once. `--interpret-control` adds a per-entity object with a virtual tick() and calls it in the loop; the interpretation audit must FIND it by name and the sample must return non-zero because of it. Act 4 of the driver is what requires that failure, so this criterion requires the ACT to pass and requires its named step to be in the output — a control that was deleted would report zero steps and exit zero, and that must not read as green"
source = "tasks 12.1, 12.4, ROADMAP M8.b (no graph is interpreted at runtime)"
kind = "command"
run = "set -o pipefail; out=$(just run-vertical-slice --only control 2>&1); status=$?; echo \"$out\"; if [ $status -ne 0 ]; then echo 'the negative control act did not pass'; exit 1; fi; echo \"$out\" | grep -q 'an interpreted consumer is FOUND and the run fails because of it' || { echo 'the negative control act ran and did not report its step: it has been removed or renamed'; exit 1; }"
timeout_s = 3600
ci_job = "milestone-m8b"

