# TEXT-AND-FONTS IS WORKING HERE AND NOT COMPLETE, AND THE CLOSING GATE READ THE SPECIFICATION
# AGAINST THE TREE RATHER THAN AGAINST THE MODULE'S SUMMARY. `text-and-fonts` requires, in normative
# text: "The engine integrates **HarfBuzz** (shaping), **ICU** (Unicode algorithms), and
# **FreeType** (rasterisation)"; "The engine SHALL load: TrueType and OpenType (`.ttf`, `.otf`,
# `.ttc`), WOFF and WOFF2, bitmap"; "Text SHALL be shaped through HarfBuzz"; plus variable-font
# axes, OpenType feature selection and colour glyphs. None of those three libraries is in
# deps/manifest.toml — that file defers all three by name and says the cost out loud — the only
# font the engine can load is `ImageGridFont`, a bitmap grid, and `TextCapabilities` still declares
# `complex_shaping`, `variable_fonts` and `colour_glyphs` false at the server.
#
# WHAT M8.b ACTUALLY BUILT, AND IT IS REAL: src/text/, which is the bidirectional algorithm, line
# breaking including a Thai dictionary, Arabic joining, itemisation, the shaping cache and
# localisation, engine-owned and over `cy::core` alone, with 39 unit cases. That raises the
# ALGORITHMS from a capability query that said `false` to code that answers — which is Working, and
# is exactly what src/text/README.md claims for itself in its own first line. It does not put a
# `.ttf` in the engine. The Complete cell moves to M11, where three third-party integrations belong.
text-and-fonts = "working"

# AUDIO IS WORKING HERE AND NOT COMPLETE, AND THE CLOSING GATE MEASURED WHY. `audio` names Steam
# Audio in a requirement — "The engine SHALL support **Steam Audio** as an `AcousticsBackend`" — and
# two things are true of it on this tree: `SteamAudioBackend::simulate` returns
# `ErrorCode::NotImplemented` rather than simulating, and `-D CY_AUDIO_STEAM_AUDIO=ON` cannot be
# CONFIGURED at all. The gate ran it:
#
#   CMake Error at _deps/steam_audio-src/core/CMakeLists.txt:235 (find_package):
#     Could not find a package configuration file provided by "PFFFT"
#
# — upstream expects PFFFT, IPP and FFTS as pre-installed packages that deps/manifest.toml does not
# provide. That is the same shape as this milestone's own spike finding: an option declared,
# defaulted off, and never once built. src/audio/README.md says "the honest place to find out is the
# milestone's gate rather than a claim in this file", and this is the finding out.
#
# EVERYTHING ELSE IN `audio` IS DELIVERED and is what Working records: acoustic geometry and its
# cache, the asynchronous simulation, importance tiers, voice virtualisation, the effect chain and
# interactive music, over 27 unit cases, with `FallbackAcoustics` answering every query in every
# build. The Complete cell moves to M8.c, which is where a spatial-acoustics dependency belongs.
audio = "working"

