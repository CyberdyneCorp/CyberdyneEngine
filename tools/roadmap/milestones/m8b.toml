# M8.b — Systems: the exit criteria, as data.
#
# The sources are openspec/changes/implement-m8b-systems/tasks.md and the M8.b row of
# docs/ROADMAP.md; every criterion below names which. `delivery-roadmap` requires each to be a recipe
# that exits zero, a command that exits zero, a benchmark within a threshold, or a committed artefact
# that is regenerated and compared — so an intention that cannot be run is a note at the bottom of
# this file, not a criterion.
#
# --- THIS LEDGER DECLARES ONLY M8.b's OWN CRITERIA, AND THERE IS NO `m8a-green` -------------------
#
# The ledger has been flat since M5 and `just roadmap-test` fails a ledger that invokes another one.
# `just roadmap-milestone m8b` evaluates the permanent set directly — the criteria of every milestone
# whose `class = "milestone"` gate carries `state = "green"` and which sits BELOW M8.b on the ladder,
# merged and deduplicated, each distinct check run exactly once — and then the criteria in this file.
# `criteria.build_plan` is the rule and tools/roadmap/README.md states it.
#
# A criterion here whose `run` string is identical to one an earlier ledger declared COLLAPSES into
# it and is reported under the earlier label — `m0:format` rather than `m8b:format`. The static gates
# are declared anyway, as every ledger since M3 has, because a ledger that does not name the checks
# its milestone had to satisfy is a ledger nobody can read. `four-profiles` below is deliberately
# spelled with the identical string eight earlier ledgers used, for the same reason.
#
# --- EVERY COMMAND IN THIS FILE WAS RUN, EXACTLY AS WRITTEN ---------------------------------------
#
# M6's closing gate found FOUR criteria in m6.toml that had never executed anything: they were
# written as `just test-integration -R "world_(activation|streaming)"`, `just`'s `*args` is a string
# interpolated textually into `bash -c`, and the parentheses reached bash unquoted. Each reported
# `FAILED exit 2` in 0.0 s having run no test. M7's and M8.a's ledgers both recorded that the defect
# in `just/test.just` was still live; it still is, and this file works around it the same way.
#
# So: no argument passed THROUGH a `just` recipe in this file contains a shell metacharacter. Every
# `-R` pattern is one plain word or a `^…$` anchor with no alternation, suites are joined with `&&`
# at the criterion's own level rather than with an alternation inside a recipe's arguments, and every
# command below was executed on this machine and its output pasted into the closing report. Each was
# also checked to have SELECTED something — `N/N Test #NNN … Passed`, with N greater than zero,
# rather than a green run over nothing. THAT CHECK IS THE WHOLE OF WHY THIS PARAGRAPH EXISTS, and it
# is the one M6 skipped.
#
# AND IT CAUGHT M7's OTHER TRAP TWICE WHILE THIS FILE WAS BEING WRITTEN. `-R text` also selects
# `unit.virtual_texturing`, because "virtual_texturing" contains "text"; `-R ui` also selects
# `unit.build_graph`, because "build" contains "ui". Both are exactly the defect M7's gate recorded
# when `--tests text` swept up `render.virtual_texturing_gpu`. The fix here is the suite's own
# prefix — `-R unit.text`, `-R unit.ui` — which is still one plain word to the shell and no longer
# a substring of somebody else's suite. Every pattern below was listed with `ctest -N` and its
# selection READ, not counted.
#
# --- WHY SO MANY CRITERIA NAME `milestone-m8b` AS THEIR CI JOB ------------------------------------
#
# The same arithmetic M7's and M8.a's ledgers recorded. M8.b declares ONE new gate — `milestone-m8b`,
# at `joins-on-close` — and points its own suites at it rather than inventing thirty more permanent
# gates whose jobs belong to `.github/workflows/ci.yml`, which is task 13.4's file and not this
# change's section 13. Until that gate flips to green the criteria below whose `ci_job` is
# `milestone-m8b` are run by `just roadmap-milestone m8b` and by nothing in continuous integration;
# the moment it flips they join the permanent set entire. Where an existing permanent gate's own
# `runs` list demonstrably covers a criterion it is named instead, and eight of them are.
#
# --- WHAT M8.b ADDS TO THE PERMANENT SET, AND WHAT IT COSTS ---------------------------------------
#
# THIRTY-NINE own criteria beyond the static gates — forty-seven in all — which is the largest
# single addition any milestone has made, and the reason is the milestone's own shape: eleven
# capabilities to Working and three to Complete, over nine directories that did not exist when it
# opened. **Exactly one carries `requires = "gpu"`** — `render.assembly`, the frame put on a real
# device — and it is reported NOT EVALUATED rather than passed on a machine without one. Everything
# else M8.b claims can be judged on a machine with no graphics device and no display, including the
# closing artefact: the slice
# assembles a frame and records no pass, and its picture is a committed file rather than a criterion
# that takes one.
#
# --- THE ARTEFACT, AND WHY IT IS FOUR CRITERIA RATHER THAN ONE ------------------------------------
#
# `samples/08-vertical-slice` is one program and one driver, and the four ways of reaching it answer
# different questions — the split m6.toml, m7.toml and m8a.toml each made.
#
#   slice-artefact    the CTest entry, so `just test-all` runs it and `build-and-test` covers it on
#                     every pull request. No display, no device.
#   slice-recipe      the same run through the workflow a contributor types, which builds the engine
#                     first — so it fails when the recipe rots, which the CTest entry cannot see.
#                     It also runs the scale act at the criterion's own figure of 8,000 agents,
#                     which the CTest entry deliberately does not.
#   slice-control     THE NEGATIVE CONTROL. `--interpret-control` puts a per-entity virtual `tick()`
#                     in the loop; the audit must FIND it and the program must exit non-zero. The
#                     criterion passes only when that run FAILS. Task 12.4 asks that a recorded gap
#                     exit non-zero; this is that, demonstrated on every ledger run.
#   screenshot-slice  the committed picture, which is what makes the milestone evaluable by LOOKING.

schema = 1
id = "m8b"
name = "Systems"
artefact = "samples/08-vertical-slice — a playable game assembled out of this milestone's systems: a 48 m arena whose navigation mesh Recast builds from its own collision triangles, two teams of characters that sense through a scheduled perception pass, think through a compiled behaviour program, steer through the crowd solver, animate through a compiled pose program with root motion integrated on the deterministic half, and cast a compiled ability that applies effects and emits cues; a heads-up interface that lays out, flattens, batches and passes its own accessibility audit; a 2D menu through the sprite batcher; sound scored into importance tiers with the music transitioning on a bar; and a frame assembled out of the renderer's own eight modules in which every draw resolves to a slot the material table holds — 8,000 agents at 10.0 ms a tick, costing 1.26 us each against 1.10 us at 2,000 — a factor of 1.14 for four times the population — identical over two processes, and leading with a median that three consecutive runs put at 690.5, 686.5 and 697.5 us while their worst ticks were 1062, 986 and 557"

# Non-binding, because none can be settled by running something. `delivery-roadmap` requires a
# criterion that cannot be evaluated by a machine to be restated as a check or moved here.
notes = [
    "`just roadmap-milestone m8b` is this recipe, so it cannot be one of the criteria it evaluates.",
    "tasks 13.3 — docs/roadmap/status.yaml, docs/roadmap/capability-matrix.md, docs/ROADMAP.md and docs/roadmap/dependencies.md are the closing change's. `roadmap-tiers` below checks the record, `roadmap-record` checks that the record and openspec/specs/ agree, and `plan-consistency` checks that the four plan documents agree with each other. AT THE TIME THIS FILE WAS WRITTEN `roadmap-tiers` FAILS, and it is meant to — the same forcing function M8.a's ledger declared and for the same reason: the record still carries `visual-scripting`, `gameplay-abilities-and-effects`, `animation-and-skinning`, `ui-system` and `rendering-2d` at none, and `gameplay-framework`, `camera-system`, `audio` and `text-and-fonts` below their exit tiers, while M8.b's row of ROADMAP.md exits all of them higher. `ai-system` and `navigation` are already at working and already name this change, which is what the rest of the column has to look like.",
    "tasks 13.4 — moving ci.yml's `milestone` job to `m8b` is checked by `workflows` below (`just ci-check`), which goes red the moment `milestone-m8b` is green above the newest ledger any workflow evaluates. It is a check, but it is the closing change's edit to make and not this file's.",
    "tasks 13.5 — opening the M8.c change is `m8c-open` below, which asks only that the change exists. AT THE TIME THIS FILE WAS WRITTEN IT FAILS, and it is meant to, exactly as `roadmap-tiers` does: openspec/changes/ holds `implement-m8b-systems` and `split-m8b-defer-spectacle`, and no `implement-m8c-*` yet. `split-m8b-defer-spectacle` is the change that DEFERRED the work to M8.c; it is not the change that DOES it, and a glob that matched it would go green over a rung nobody has opened. THE NEXT RUNG IS M8.c AND NOT M9: `split-m8-authorable-and-systems` put VFX, cinematics and inference there after this milestone's spike found it larger than its plan assumed, and `record.MILESTONES` already carries `m8c` between `m8b` and `m9`. A ledger that asked for `m9` here would be asking the ladder to skip a rung it has already declared.",
    "tasks 14.x — the gate itself. A milestone cannot make passing its own gate one of the criteria that gate evaluates.",
    "THE COMPILED SCRIPT AND ABILITY PROGRAM DIGESTS WERE NOT REPRODUCIBLE ACROSS PROCESSES, the artefact recorded it as a gap rather than describing it, and the closing gate CLOSED it — which is the sequence this ledger is for. `finish_digest` in src/graph/src/lower_script.cpp hashed each constant with `hash_bytes(&constant, sizeof(constant))`; `cy::graph::script::Value` is 32 bytes of which four are padding between `z` and `handle` that no member initialiser touches, so the digest closed over indeterminate bytes and three runs of one graph gave three digests. A byte dump at the gate found a fragment of a spilled stack address in exactly those four, which is why it moved between processes and not within one, and why `smoke.vertical_slice` was green at `--profile release` and red at `--profile dev` on the same tree. This is a cook key and the back-end selection key `visual-scripting` requires to be stable, so it reached past the artefact. The fix hashes the five fields through `script::hash_constant`; `src/graph/tests/test_lowering.cpp` compares the program's own digest against the same sum recomputed field by field and was proved to go red when the old line is restored; and `expr.h` gained a `static_assert` on `sizeof(Immediate)` beside the three places that still hash a struct as bytes.",
    "THREE PERFORMANCE FINDINGS IN MODULES THE ARTEFACT ONLY USES, each measured and each named in samples/08-vertical-slice/README.md: `Crowd::rebuild_grid` is O(agents x occupied cells) because its cell lookup rescans the cell table from the start (72 ms a tick against 9 ms, at 8,000 agents, on cell size alone); `PerceptionScheduler`'s broad phase has no spatial index although its header describes one, so its cost is (due observers x targets x queries built); and `ThinkReport::starved` counts an agent promoted out of a coarse tier, because starvation is measured against the CURRENT tier's interval using a `last_think_tick` earned under the previous one. None is fixed here — each belongs to a module this artefact does not own — and the artefact is configured so that none of them is what its budgets measure.",
    "THE ARTEFACT'S BUDGETS ARE SHAPE BOUNDS AND NOT MACHINE NUMBERS, declared in `Budgets` in samples/08-vertical-slice/slice.h and printed by the program so the driver compares a measurement against the source rather than against a number copied into a script. Every absolute figure is set well above what the reference machine measures, because a bound tight enough to be a measurement of the host fails on a loaded build agent and teaches everyone to ignore it. What actually catches a regression is the linearity factor beside them — the cost per agent at four times the population, which a quadratic cannot hold and a slow machine does not affect.",
]

