# --- Section 2: CyberGraph, the expression core, and a lowering each ------------------------------
#
# THE SPIKE REFUTED THE PLAN'S PREMISE AND THESE TWO SUITES ARE WHAT IT BUILT INSTEAD. One IR cannot
# serve seven consumers — five escape hatches against a budget of two — so what exists is three
# layers: a shared authoring layer every consumer adopts, a shared pure-expression SSA core
# generalised from the material IR by four named extensions, and a lowering per consumer to the form
# its own specification names. `unit.cybergraph` is the first layer and
# `integration.graph_compiler` is the other two, INCLUDING THE ANCHOR: given the material op table
# and type lattice as a domain, the core reproduces the tree's own reference material at IR digest
# f48f3faf395e52fd, post-pipeline digest 178a3630921e0506 and program digest 7f74500626ea001a.
# src/rendering/material/ was not modified and its cook keys are intact.

