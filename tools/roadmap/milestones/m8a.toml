# TASK 6.7, "A RECORDED GAP EXITS NON-ZERO", DEMONSTRATED RATHER THAN ASSERTED — and demonstrated
# with a real backend rather than a switch that fakes a failure. `cy::physics::reference` declares
# `Capabilities::contact_resolution = false`: it integrates motion and resolves nothing, so the
# sphere falls THROUGH the box, the artefact records a gap and `artefact.Report.exit_code` derives 1
# from it. This criterion passes only when that run FAILS.
#
# It is also the check that `physics`'s "swapping the backend changes no gameplay" is being taken
# seriously: the same authored world, the same session, the same bridge, and the only difference is
# which solver was asked for.
[[criterion]]
id = "authoring-control"
describe = "the artefact's negative control: run against a backend that resolves no contacts, the sphere falls through the box, a gap is recorded and the run returns non-zero. The criterion inverts it, so it fails if the artefact ever passes a run it should not"
source = "tasks 6.7, samples/harness/artefact.py"
kind = "command"
run = "if just run-authoring --no-window --runs 1 --physics reference; then echo 'the negative control PASSED, which means it is not a control'; exit 1; fi; echo 'the negative control failed, as it must'"
timeout_s = 3600
ci_job = "milestone-m8a"

