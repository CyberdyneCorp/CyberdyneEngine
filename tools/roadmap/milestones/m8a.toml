# --- One world: the seam M7 left open, which everything else is downstream of ---------------------

# TASKS 1.1, 1.2 AND 1.3. THE CLAIM IS NOT "A FILE FORMAT EXISTS", it is that the editor's document
# and the engine's scene are ONE WORLD. `unit.scene_serialization` holds the arithmetic that makes
# that possible without transmitting anything: `DocumentId = FNV-1a-128(asset path)` and
# `NodeId = FNV-1a-128(document ++ ordinal)` computed identically in C++ and in Rust, a `.cyworld`
# that round-trips byte for byte, and all twelve of `cy_editor_documents::Operation`'s variants
# decoded — including the three this module has nothing to do with, because a reader that skipped one
# by guessing its length would misread the next operation as something it is not.
[[criterion]]
id = "world-transactions"
describe = "the engine reads and writes .cyworld and decodes the editor's own transaction stream: derived identities that cross the process boundary without being sent, a byte-identical round trip, every operation variant decoded rather than skipped, and an unknown tag refusing the whole transaction instead of guessing its length"
source = "tasks 1.1, 1.2, design.md §1"
kind = "recipe"
run = "just test-unit -R scene_serialization"
ci_job = "milestone-m8a"

# TASK 1.3 AND 1.4, and this is the half that only exists when there are two processes:
# `integration.editor_window_one_world` drives the runtime's world view and its pick wire without a
# device, which is what makes it a criterion a hosted runner can judge rather than one it skips.
[[criterion]]
id = "one-world"
describe = "the runtime's view of the editor's world: a transaction lands in the frame the commit produced, a pick resolves against the frame the viewport is showing, and a world larger than the scene's slots reports the overflow with both numbers rather than dropping nodes quietly"
source = "tasks 1.1, 1.3, 1.4"
kind = "recipe"
run = "just test-integration -R editor_window_one_world"
ci_job = "milestone-m8a"

[[criterion]]
id = "world-runtime"
describe = "the runtime that hosts the authored world, checked without one: the world view, the overlay and the message counter that `Message::Play` pushed past the end of its own array before this milestone caught it"
source = "tasks 1.1, 5.1"
kind = "recipe"
run = "just test-unit -R editor_window_runtime"
ci_job = "milestone-m8a"

# --- Primitives, and the property that a generated one is not a special case ----------------------

# TASKS 2.1 TO 2.4. A `.cyprim` is a SOURCE ASSET and `PrimitiveImporter` is an entry in the same
# `ImporterRegistry` as glTF, FBX and OBJ, so after the parse there is one code path: `finish_mesh`,
# `emit_mesh_with_lods`, `emit_collision`, `emit_prefab`, under the option names the model importers
# already declare. That is what makes design.md §2's "give it nothing to tell apart" true rather than
# policed, and it is why 2.4 needs no criterion of its own: a generated mesh goes through the single
# derivation key because it goes through the single importer pipeline.
[[criterion]]
id = "primitives"
describe = "box, sphere, cylinder, plane and capsule generated beside the importers rather than in the editor: a .cyprim is a source asset, its importer is an ordinary entry in the registry, a parameter the shape does not take is an error on both sides of the boundary, and the mesh is cooked through the derivation key and cache every other format uses"
source = "tasks 2.1, 2.4, design.md §2"
kind = "recipe"
run = "just test-integration -R import_primitive"
ci_job = "milestone-m8a"

