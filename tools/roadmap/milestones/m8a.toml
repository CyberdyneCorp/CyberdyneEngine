# --- The editor's own half --------------------------------------------------------------------

# `just build-editor-check` below runs all of these and more, and is declared with the string M5's
# ledger used so that the two collapse. This criterion is the narrower one, and it earns its place
# for the reason m5b.toml gives for splitting `no-toolkit-leak` out of `editor`: these six suites
# fail for a different reason from the rest of that command, and naming them is what tells a reader
# which of M8.a's claims the editor holds up.
[[criterion]]
id = "editor-authoring"
describe = "the editor's own M8.a suites: a primitive is one transaction that undoes and redoes to the same identity, a generated primitive and an imported mesh are literally the same entity because one function builds both, an import lands in the world through a transaction, a body and its collider are ONE transaction (because cy::physics refuses a dynamic body with no collider, so two would leave a world that cannot simulate for one undo step), pressing play reaches the runtime, and a world opens and saves"
