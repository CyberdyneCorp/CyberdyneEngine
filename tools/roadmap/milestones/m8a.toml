# The M8.a row of docs/ROADMAP.md, as data. An exit tier is a FLOOR rather than an equality: a later
# milestone advancing one of these past its M8.a level must not make this recipe fail.
#
# --- READ THE TWO COMPLETES AS CLAIMS SOMEBODY STILL HAS TO EARN ---------------------------------
#
# M5's ledger amended four rows at its own gate, M5.5's inherited the practice, M6's demoted five and
# M7's demoted five more. These two are the ones M8.a's gate has to judge, and what would have to be
# true:
#
#   serialization-and-prefabs  complete.  A `.cyworld` is now read AND written by the engine
#       (`cy::scene::serialization`), the type section is the document's own schema so a transaction
#       addresses the fields the file declares, a name this build does not know is CARRIED rather
#       than dropped, and the round trip is byte-identical. What a gate should look at before
#       agreeing: prefab instantiation and override are `Operation` variants that
#       `apply_transaction` decodes and COUNTS AS IGNORED — the engine does not act on them — so
#       "prefabs" in the capability's name is held up by the editor's side alone.
#
#   editor-documents-and-transactions  complete.  A created primitive, an imported mesh and an added
#       body are each one transaction; undo returns the world to empty in the document AND in the
#       engine's world, which the artefact checks from both ends. What a gate should look at: a node
#       still has no NAME in this model (see the notes above), and `file.save` remains the only way
#       a document reaches disk, which no agent scope grants.
#
# AT THE TIME THIS FILE WAS WRITTEN THIS CRITERION FAILS, on exactly those two rows, because
# docs/roadmap/status.yaml still records both at working. Task 7.4 is what closes it. It is declared
# now rather than later precisely so that it is impossible to close this milestone without doing so.
# --- AMENDED AT THE CLOSING GATE, AND THIS IS THE THIRD LEDGER IN A ROW TO BE ------------------------
#
# The two floors above read `complete` when this file was written and they now read `working`. Task
# 7.4 did not close the criterion by editing the record to agree with the plan; the gate checked both
# claims against the code and neither is supported, so the PLAN was corrected. M5's gate amended four
# rows this way, M6's five, M7's six. The two arguments, in full, are in docs/ROADMAP.md's M8.a
# section and in docs/roadmap/capability-matrix.md#where-m8as-tiers-are-thin. In one line each:
#
#   serialization-and-prefabs  "Apply and extract" has no implementation anywhere in the tree —
#       `grep -rniE 'apply.?(overrides|to.?prefab)|extract.?(to.?)?prefab' src/ tools/ editor/crates`
#       finds `Resolver::apply_overrides` (resolution, not authoring) and `InputUser` and nothing
#       else — and src/scene/serialization/README.md has said so since M2 and still says so on this
#       tree. M8.a taught the engine to DECODE `InstantiatePrefab` and `SetPrefabOverride` and to
#       count them as ignored, which is honest and is not the requirement. The Complete cell is now
#       M8.b.
#
#   editor-documents-and-transactions  "Source control integration" is unstarted: no provider trait,
#       no Git provider, no Perforce provider, no null provider. `grep -rniE 'source.control'
#       editor/crates/*/src/` returns seven hits and every one is a comment or a remedy string. A
#       capability with one of twelve requirements unstarted is not Complete. The Complete cell is
#       now M11, beside every other editor-* row.
#
# WHAT THAT LEAVES THIS CRITERION CHECKING, said plainly rather than left for a reader to notice:
# all six floors below are now at or under what the record ALREADY held before this milestone, so
# `roadmap-tiers` passes over an unchanged status.yaml tier column. It is a floor, not an advance —
# it fails if a later change demotes one of these rows, which is what a floor is for, and it is NOT
# evidence that M8.a moved anything. What M8.a moved is recorded in the `milestone` and `change`
# fields of those rows, which now name it: three of them recorded a tier the tree did not support
# until this milestone built `src/physics/`, `asset.import` and `cy::gameplay::PlaySession`.
#
[criterion.expect_tiers]
editor-ui-ux = "working"
asset-import-pipeline = "working"
physics = "working"
gameplay-framework = "seed"
serialization-and-prefabs = "working"
editor-documents-and-transactions = "working"

# TASK 7.6 AND 7.3. THE DOUBLE-STAR GLOB IS THE POINT, and m6.toml's own comment says why: a change
# lives at `openspec/changes/<name>/` while it is open and at `openspec/changes/archive/<date>-<name>/`
# once it closes, so a pattern that only matched an open change would turn red on the day the next
# milestone closed — which is the one day this criterion should be most satisfied. `**` matches both
# depths.
[[criterion]]
id = "m8b-open"
describe = "the change for the next rung exists — open, or closed and archived — so the ladder continues deliberately. That rung is M8.b, whose named risk spike is the one graph IR seven consumers must agree on, and which is the whole reason M8 was split"
source = "tasks 7.3, 7.6, delivery-roadmap"
kind = "path"
path = "openspec/changes/**/*m8b*/proposal.md"
ci_job = "milestone-m8a"

# --- Every profile ------------------------------------------------------------------------------

# THE IDENTICAL COMMAND M1, M2, M3, M4, M5, M5.5, M6 AND M7 DECLARE, written out rather than varied
# so that the plan COLLAPSES all nine into one run of it, reported as `m1:four-profiles`. That is the
# whole point of the flat ledger and the reason this string must not be "improved" here.
[[criterion]]
id = "four-profiles"
describe = "all four profiles build clean and just test-all is green in each — including M8.a's artefact and the six suites its two new directories brought, none of which is behind a CY_* option except the Jolt backend, which is ON and whose absence the bridge's own tests tolerate"
source = "tasks 8.2"
kind = "command"
run = "for p in debug dev profile release; do d=\"${CY_BUILD_DIR:+${CY_BUILD_DIR}/$p}\"; CY_BUILD_DIR=\"$d\" just build-engine --profile \"$p\" || exit 1; CY_BUILD_DIR=\"$d\" just test-all --profile \"$p\" || exit 1; done"
timeout_s = 28800
ci_job = "profiles"
