# M8.a — Authorable: the exit criteria, as data.
#
# The sources are openspec/changes/implement-m8a-authorable/tasks.md and the M8.a row of
# docs/ROADMAP.md; every criterion below names which. `delivery-roadmap` requires each to be a recipe
# that exits zero, a command that exits zero, a benchmark within a threshold, or a committed artefact
# that is regenerated and compared — so an intention that cannot be run is a note at the bottom of
# this file, not a criterion.
#
# --- THIS LEDGER DECLARES ONLY M8.a's OWN CRITERIA, AND THERE IS NO `m7-green` --------------------
#
# The ledger has been flat since M5 and `just roadmap-test` fails a ledger that invokes another one.
# `just roadmap-milestone m8a` evaluates the permanent set directly — the criteria of every milestone
# whose `class = "milestone"` gate carries `state = "green"` and which sits BELOW M8.a on the ladder,
# merged and deduplicated, each distinct check run exactly once — and then the criteria in this file.
# `criteria.build_plan` is the rule and tools/roadmap/README.md states it.
#
# A criterion here whose `run` string is identical to one an earlier ledger declared COLLAPSES into
# it and is reported under the earlier label — `m0:format` rather than `m8a:format`. The static gates
# are declared anyway, as every ledger since M3 has, because a ledger that does not name the checks
# its milestone had to satisfy is a ledger nobody can read. `editor`, `editor-profiles` and
# `four-profiles` below are deliberately spelled with the identical string an earlier ledger used,
# for the same reason.
#
# --- EVERY COMMAND IN THIS FILE WAS RUN, EXACTLY AS WRITTEN ---------------------------------------
#
# M6's closing gate found FOUR criteria in m6.toml that had never executed anything: they were
# written as `just test-integration -R "world_(activation|streaming)"`, `just`'s `*args` is a string
# interpolated textually into `bash -c`, and the parentheses reached bash unquoted. Each reported
# `FAILED exit 2` in 0.0 s having run no test. M7's ledger recorded that the defect in
# `just/test.just` was still live; it still is, and this file works around it the same way.
#
# So: no argument passed THROUGH a `just` recipe in this file contains a shell metacharacter. Every
# `-R` pattern is one plain word (`smoke.authoring`'s dot is a regular expression's, not a shell's),
# suites are joined with `&&` at the criterion's own level rather than with an alternation inside a
# recipe's arguments, and every command below was executed on this machine and its output pasted
# into the closing report. Each was also checked to have SELECTED something: `1/1 Test #NNN … Passed`
# rather than a green run over nothing.
#
# --- WHY SO MANY CRITERIA NAME `milestone-m8a` AS THEIR CI JOB ------------------------------------
#
# The same arithmetic M7's ledger recorded. M8.a declares ONE new gate — `milestone-m8a`, at
# `joins-on-close` — and points its own suites at it rather than inventing a dozen more permanent
# gates whose jobs belong to `.github/workflows/ci.yml`, which is task 7.5's file and not this
# change's section 6. Until that gate flips to green the criteria below whose `ci_job` is
# `milestone-m8a` are run by `just roadmap-milestone m8a` and by nothing in continuous integration;
# the moment it flips they join the permanent set entire. Where an existing permanent gate's own
# `runs` list demonstrably covers a criterion it is named instead, and eleven of them are.
#
# --- WHAT M8.a ADDS TO THE PERMANENT SET, AND WHAT IT COSTS ---------------------------------------
#
# NINETEEN own criteria beyond the static gates, of which sixteen run suites this milestone's two new
# directories and four new editor modules brought: `src/physics/`, `src/gameplay/play/`,
# `tools/import`'s primitive and OBJ importers, and `cy_editor_services`' primitives, assets and
# bodies. **None carries `requires = "gpu"` or `requires = "display"`.** That is worth saying
# plainly beside M7, whose subject was a frame and four of whose criteria a hosted runner cannot
# judge: everything M8.a claims can be checked on a machine with no graphics device, because the
# artefact's measuring half is headless by construction and its photograph is a committed file
# rather than a criterion that takes one.
#
# --- THE ARTEFACT, AND WHY IT IS FOUR CRITERIA RATHER THAN ONE ------------------------------------
#
# `samples/08a-authoring` is one driver and one program, and the four ways of reaching it answer
# different questions — the split m6.toml and m7.toml both made, plus one they did not.
#
#   authoring-artefact   the CTest entry, so `just test-all` runs it and `build-and-test` covers it
#                        on every pull request. 3.5 s, no display, no device.
#   authoring-recipe     the same run through the workflow a contributor types, which also builds
#                        the editor and the engine first — so it fails when the recipe rots, which
#                        the CTest entry cannot see.
#   authoring-control    THE NEGATIVE CONTROL, and it is new here. `--physics reference` swaps in a
#                        backend that declares `contact_resolution = false`, the sphere falls through
#                        the box, the artefact records a GAP and returns 1. The criterion passes only
#                        when that run FAILS. Task 6.7 asks that a recorded gap exit non-zero; this
#                        is that, demonstrated on every ledger run rather than asserted once.
#   screenshot-authoring the committed picture, which is what makes the milestone evaluable by
#                        LOOKING.

schema = 1
id = "m8a"
name = "Authorable"
artefact = "samples/08a-authoring — one editor session against one engine runtime that creates a box and a sphere in an empty world, places the sphere three metres above the box through the gizmo's own manipulation, adds a rigid body to each, presses play so that the runtime builds two Jolt bodies from the authored world and simulates it, stops so that the world's bytes are identical to what was authored, and undoes back to an empty world in both processes — with the fall itself measured headlessly by replaying the editor's own transaction journal into `cy::gameplay::PlaySession`: 2270 mm in 55 ticks, coming to rest 20 mm inside the contact height the two colliders imply, identically over six sessions"

# Non-binding, because none can be settled by running something. `delivery-roadmap` requires a
# criterion that cannot be evaluated by a machine to be restated as a check or moved here.
notes = [
    "`just roadmap-milestone m8a` is this recipe, so it cannot be one of the criteria it evaluates.",
    "tasks 7.4 — docs/roadmap/status.yaml, docs/roadmap/capability-matrix.md, docs/ROADMAP.md and docs/roadmap/dependencies.md are the closing change's. `roadmap-tiers` below checks the record, `roadmap-record` checks that the record and openspec/specs/ agree, and `plan-consistency` checks that the four plan documents agree with each other. AT THE TIME THIS FILE WAS WRITTEN `roadmap-tiers` FAILS, and it is meant to: the record still carries `serialization-and-prefabs` and `editor-documents-and-transactions` at working, and M8.a's row of ROADMAP.md exits both at complete. It is the forcing function for task 7.4 and nothing else can be.",
    "tasks 7.5 — moving ci.yml's `milestone` job to `m8a` is checked by `workflows` below (`just ci-check`), which goes red the moment `milestone-m8a` is green above the newest ledger any workflow evaluates. It is a check, but it is the closing change's edit to make and not this file's.",
    "tasks 7.6 — opening the M8.b change is `m8b-open` below, which asks only that the change exists.",
    "tasks 8.x — the gate itself. A milestone cannot make passing its own gate one of the criteria that gate evaluates.",
    "THE EDITOR'S TWO HEADLESS SURFACES CANNOT, BETWEEN THEM, AUTHOR A PLACED SCENE, and the artefact performs both refusals rather than describing them. `cy_editor_app::run_script` makes every argument a `Value::Text` and the registry validates kinds, so a `.cyscript` cannot supply a vec3, a float, an int or a bool — `scene.translate amount=0,3,0` is refused and so is `scene.add-body mass=2`. The `author` agent scope parses typed arguments (`cy_editor_agent::tool`) but grants `game/` and no irreversible mutation, so `scene.create-primitive` (which writes `assets/primitives/`) and `file.save` are both refused to it. Neither is a defect in what M8.a built; together they decide how the artefact has to be driven, and each is a few lines away in a file section 6 does not own.",
    "A NODE HAS NO NAME. `cy_editor_documents` carries none — the third field of a `.cyworld`'s `node` line is its LAYER — so `cy_editor_viewmodels::hierarchy::label_of` labels a node by the first component it carries that has fields, and the milestone's own screenshot shows a box and a sphere as two outliner rows both reading `Transform`. `scene.create-primitive`'s description says its `name` argument names \"the source asset, the generated mesh sub-asset and the node\"; it names the first two. No criterion here can check it, because naming a node is a concept the document model does not have.",
    "THE MESH A PRIMITIVE REFERENCES REACHES NO RENDERER. `cy::render::MeshRenderer` is a declared name in `src/scene/src/node_template.cpp`'s catalogue with no reflected type behind it, so a `MeshRenderer` component round-trips through `.cyworld` and is read by nothing that draws. `samples/05b-editor-window/runtime` presents every node through M3's fixed box slots, which is why the artefact's photograph shows a box above a box. That is `editor-viewport-and-gizmos` and the renderer's work, and it is why this milestone does not claim `rendering-*` anything.",
]

