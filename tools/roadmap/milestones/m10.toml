# half, and the criteria are shaped the way M8.c shaped its own: **the device criterion has a
# companion that needs no device**, so nothing this milestone claims about VFX is judgeable only on a
# machine with a GPU — `vfx-device` beside `vfx-runtime`, exactly as `m8c:vfx-device` sat beside
# `m8c:vfx-runtime`.
#
# AND `cy::vfx` STILL DOES NOT LINK A DEVICE. `cy::vfx-gpu` is a separate module under src/vfx/gpu/,
# which is what keeps `integration.vfx` headless and is checked by `layering` above rather than
# asserted here.

[[criterion]]
id = "vfx-values"
describe = "THE VALUE MODEL, THE BUDGET CONTROLLER AND THE EVENT CHANNELS — seventeen cases and the unit half of `cy::vfx`, unchanged since M8.c and declared here because this is the milestone that claims the row. The quantisation half is what makes a GPU-resident layout real: a tolerance of zero never quantises, the smallest encoding whose step fits the tolerance is chosen, an encoding that cannot represent the range reports a step of ZERO rather than a small one, and a quantised attribute READS BACK QUANTISED. The controller half: over budget the least important class is reduced first and Critical last, Critical survives at its floor with the reserved minimum reported, hysteresis moves nothing between the thresholds, and pinned mode REPORTS the excess and corrects nothing"
source = "tasks 5.1, vfx-system"
kind = "recipe"
