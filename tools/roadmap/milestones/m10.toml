# --- What this milestone knows it did not finish ---------------------------------------------------
#
# FOUR DECLARED GAPS, counting `sky-field-round-trip` above and `world-frame-budget` before it. Each
# RUNS on every evaluation, each PRINTS its failure with the rung that must close it, and a declared
# gap that starts PASSING fails the ledger — so none of them can outlive itself. They are declared
# rather than deleted for `m8c:steam-audio-configures`' reason: a milestone that quietly dropped a
# requirement is repeating exactly what these gates keep finding.
#
# THREE OF THE FOUR ARE THE SAME GAP SEEN FROM THREE SIDES, and saying so is more useful than filing
# them as three unrelated pieces of work. M10 shipped no `.slang` module for an environment field, a
# terrain material, a water surface, grass expansion or a cloud march. That is why the substrate is
# re-sampled at 152 000 terrain vertices on the processor every frame, why the sky is a 6 384-
# direction dome rather than a per-pixel march, and why the artefact costs 122 ms a frame. The fourth
# — `fields-one-vegetation-potential` — is unrelated and is a configuration defect rather than a
# missing shader.
#
# THE FOURTH USED TO BE `fields-one-wind-declaration` AND IT IS CLOSED. The standard `wind` field had
# two mutually exclusive declarations; `weather-and-wind` is the field's named producer, so foliage's
# was deleted and foliage reads. The criterion is still below with its `known_gap` removed, pointed
# at the regression that repair brought with it — `tests/integration/test_standard_fields.cpp`, every
# field every producing module declares, into one registry, both ways round. THAT TEST FOUND A SECOND
# PAIR IMMEDIATELY: `vegetation-potential`, declared `UNorm8`/`Static`/`Persistent` by foliage and
# `UNorm16`/`SlowlyVarying`/`Authoritative` by weather's ecosystem half, refusing each other in
# either order exactly as `wind` did. It is NOT the same repair — `wind` had a producer two
# specifications name, while this pair is two rows' answers to "what does vegetation recover toward"
# — so it is declared rather than decided here.

# FOUND BY M10's OWN CLOSING GATE AND CLOSED IN THE SAME MILESTONE — WHICH IS WHY THIS CRITERION IS
# STILL HERE AND NO LONGER CARRIES A `known_gap`.
#
# `environment-fields` lists the standard field names for one stated reason — "they are listed so
# that two rows naming `wetness` name one field" — and `FieldRegistry::declare()` enforces it: an
# identical re-declaration is accepted and a DIFFERENT one is refused, because widening a range or
# changing an encoding changes what every already-stored byte means. A classification is in that
# comparison, and it has to be: `wind` being authoritative in one module and presentation-only in
# another is not a formatting difference, it is two different answers to "may gameplay read this".
#
# TWO MODULES ANSWERED IT DIFFERENTLY AND ONE OF THEM WAS WRONG. `foliage::wind_field_declaration()`
# declared `environment::fields::kWind` as `SimulationClass::Presentation`, "for a world that has no
# weather row yet"; `weather::weather_field_declaration(WeatherField::Wind, …)` declares the same
# field `SimulationClass::Authoritative`. Three requirements settle it for weather, and none of them
# is about which module came first: `weather-and-wind`'s "where weather affects gameplay — visibility
# affecting detection, WIND AFFECTING PROJECTILES — that state SHALL be authoritative";
# `environment-fields` naming `weather-and-wind` as the wind field's producer; and weather's own
# passing `integration.weather_fields`, which requires `FieldReader::open(wind, Authoritative)` to
# succeed and cannot under a presentation declaration. **So foliage's declaration is deleted and
# foliage READS.** src/foliage/include/cy/foliage/wind.h carries the reasoning in the space it left,
# and `unit.foliage` now links `cy::weather` to take the field from the row that produces it rather
# than declaring a second copy in a fixture.
#
# WHY NOTHING CAUGHT IT, AND WHAT DOES NOW. No target in the tree declared both: each module's suite
# links one of the two, and samples/10-world links both but takes `wind` from weather and never
# called foliage's factory. The defect was a SEAM between two modules, which is the class a
# per-module suite is structurally unable to see — so the repair brought a regression with it,
# `tests/integration/test_standard_fields.cpp`. It links every row that declares a field, registers
# each through the entry point a project calls, reads each module's declarations back out of its own
# registry rather than restating them, and declares the lot into one registry BOTH WAYS ROUND.
#
# THE FIRST THING THAT TEST DID WAS FIND A SECOND PAIR. `fields-one-vegetation-potential` below is
# it, declared as a gap rather than repaired here, and the reason is in its own note.
[[criterion]]
id = "fields-one-wind-declaration"
describe = "**EVERY DECLARATION OF A STANDARD FIELD NAME, FROM EVERY MODULE THAT MAKES ONE, INTO ONE REGISTRY, IN EITHER ORDER — ALL ACCEPTED.** `foliage::wind_field_declaration()` declared `environment::fields::kWind` Presentation while `weather::weather_field_declaration(WeatherField::Wind, …)` declares it Authoritative, and `FieldRegistry::declare()` refuses the second of two DIFFERENT declarations in either order — so a project that used `cy::foliage` and `cy::weather` together failed at startup, and no per-module suite could see it because no target in the tree declared both. `weather-and-wind` is the field's producer by its own requirement, by `environment-fields` and by weather's own passing test, so foliage's declaration is gone and foliage reads. The check registers terrain, water, weather, foliage and sky into one registry forwards and backwards and judges the number of refused standard names, which is a number the suite measures rather than a word it prints"
source = "M10 gate and its repair; environment-fields (the standard field names), foliage, weather-and-wind"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
# `-V` AND NOT `--output-on-failure`, for `sky-field-round-trip`'s reason two hundred lines above:
# the line this judges is printed by a case that PASSES, and `--output-on-failure` prints nothing
# for a suite that passes.
#
# AND THE SUITE'S EXIT CODE IS DELIBERATELY NOT WHAT IS JUDGED. Its second case asserts the state of
# `fields-one-vegetation-potential` — the declared gap below — so that suite goes red on the day
# that gap CLOSES. Reading the count off the `standard fields:` line keeps this criterion about the
# standard names and nothing else; the line is printed whether the case passed or failed.
out="$(ctest --test-dir "$d" -R '^integration.standard_fields$' -V 2>&1 || true)"
line="$(printf '%s\n' "$out" | grep -o 'standard fields: .*' | head -1)"
test -n "$line" || { echo "the standard-field composition case did not run — it has been renamed or deleted"; exit 1; }
echo "$line"
printf '%s\n' "$out" | grep -oE "the standard field '[a-z-]+' is declared by .*" | head -5
printf '%s\n' "$line" | python3 -c '
import re, sys
line = sys.stdin.read()
found = re.search(r"([0-9]+) declaration\(s\) of ([0-9]+) standard name\(s\), refused ([0-9]+)", line)
if not found:
    sys.exit("the summary line no longer reports declarations, names and refusals")
declarations, names, refused = (int(found.group(index)) for index in (1, 2, 3))
if names < 8:
    sys.exit(f"only {names} of the twelve standard names are declared by any module: a composition "
             f"this thin would accept every declaration for want of a second one")
if refused:
    sys.exit(f"{refused} declaration(s) of a standard field name were refused: two modules declare "
             f"one standard field differently, and a project using both rows fails at startup")
print(f"{declarations} declaration(s) of {names} standard name(s) compose in one registry, "
      f"both ways round, with none refused")
'
'''
timeout_s = 7200
ci_job = "milestone-m10"

# THE PAIR THE WIND REPAIR'S OWN REGRESSION TEST FOUND ON ITS FIRST RUN.
#
# `vegetation-potential` is not a standard name — neither `environment::fields` nor any
# specification lists it — so it is two MODULE-PRIVATE namespaces colliding, which is the same
# defect one layer down. `foliage::vegetation_potential_declaration()` declares it `UNorm8`,
# `Static`, one level, `Persistent`, as the potential its own `vegetation` field recovers toward;
# `weather::weather_field_declaration(WeatherField::VegetationPotential, …)` declares it `UNorm16`,
# `SlowlyVarying`, three levels, `Authoritative`, as the potential `vegetation-density` recovers
# toward. No configuration reconciles them and each refuses the other, so `FoliageSystem::
# register_producer()` and `WeatherFields::declare()` cannot both run against one registry with the
# ecosystem half on.
#
# WHY IT IS DECLARED HERE RATHER THAN REPAIRED. The `wind` pair had an answer written down three
# times over — a named producer and a requirement about projectiles. This pair does not. Behind it
# is a larger question the two rows have never been asked together: foliage's `vegetation` is the
# density its placement actually achieved and weather's `vegetation-density` is the ecosystem state
# that drives placement, and `weather-and-wind`'s "weather and environment SHALL maintain macro
# ecosystem state as fields — vegetation density …" says which row owns the ecosystem. Whether those
# are one quantity with two names — and therefore whether foliage should be producing a vegetation
# field at all — is a modelling decision across two rows, and a gate-closing phase is the wrong place
# to take it quietly.
[[criterion]]
id = "fields-one-vegetation-potential"
describe = "**`vegetation-potential` HAS TWO MUTUALLY EXCLUSIVE DECLARATIONS AND A PROJECT USING `cy::foliage` AND `cy::weather` STILL FAILS AT STARTUP.** foliage declares it UNorm8/Static/one level/Persistent as the potential its own `vegetation` field recovers toward; weather's ecosystem half declares it UNorm16/SlowlyVarying/three levels/Authoritative as the potential `vegetation-density` recovers toward. `FieldRegistry::declare()` refuses the second in either order. The check runs the same composition the criterion above does and requires NO refusal anywhere in it, not merely none among the standard names"
source = "M10 close; tests/integration/test_standard_fields.cpp; environment-fields, foliage, weather-and-wind"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
out="$(ctest --test-dir "$d" -R '^integration.standard_fields$' -V 2>&1 || true)"
line="$(printf '%s\n' "$out" | grep -o 'composition: .*' | head -1)"
test -n "$line" || { echo "the whole-composition case did not run — it has been renamed or deleted"; exit 1; }
echo "$line"
printf '%s\n' "$line" | python3 -c '
import re, sys
line = sys.stdin.read()
found = re.search(r"refused forwards ([0-9]+), backwards ([0-9]+)", line)
if not found:
    sys.exit("the composition line no longer reports refusals in both directions")
forwards, backwards = int(found.group(1)), int(found.group(2))
if forwards or backwards:
    sys.exit(f"{forwards} refused declaring forwards and {backwards} backwards: two modules declare "
             f"one field differently and the substrate refuses the second, so a project that "
             f"registers both rows fails at startup")
print("every field every producing module declares composes in one registry, both ways round")
'
'''
timeout_s = 7200
ci_job = "milestone-m10"

# THE OTHER HALF OF `environment-fields`' "CPU AND GPU ACCESS", AND src/environment/README.md SAYS SO
# IN ITS OWN WORDS: "`environment-fields`' 'CPU and GPU access' requirement is therefore
# HALF-DISCHARGED here, and the half that is missing is the device."
#
# `fields-gpu-agreement` above is real and is not this: it packs the tile table into the buffer layout
# `gpu.h` fixes and decodes it with a SECOND implementation that calls neither `decode_value()` nor
# `combine_layers()`, which is evidence rather than one implementation called twice. What it does not
# do is run that decode on a device. No `.slang` module samples an environment field anywhere in this
# tree, which is why the artefact re-samples the substrate at 152 000 terrain vertices ON THE
# PROCESSOR every frame and why `world-frame-budget` above is 63 ms of one band.
[[criterion]]
id = "fields-sampled-on-a-device"
describe = "**AN ENVIRONMENT FIELD IS SAMPLED IN A SHADER, AND NO SHADER IN THIS TREE SAMPLES ONE.** `environment-fields` requires CPU and GPU access to the same field; `gpu.h` fixes and documents the buffer layout and `integration.environment_gpu` proves the decode agrees — on the processor, twice. The device half needs a `.slang` module written against that layout, bound through the GPU scene, and measured against a real device, and it does not exist. Six of M10's module READMEs record the same absence against their own rows: no shader for an environment field, a terrain material, a water surface, grass expansion or a cloud march. **THE CHECK NO LONGER LOOKS FOR A SHADER MODULE, IT RUNS THE SHADER'S COMPILER**: the first version of it greped `*.slang` for `field_image`, which a comment satisfies — `falsify.py audit --weak` calls that shape `presence-only` and this project has shipped seven checks that could not fail. It now requires `cy/field.slang` and its two consumers to TYPE-CHECK through the engine's own Slang front end inside a program that calls them, and requires the checked-in SPIR-V `render.environment_field` measures to be word-for-word what this module compiles to today — the only thing in the tree that ties that suite's ULP figures to a source file, because the probe's SPIR-V is embedded for builds with no compiler"
source = "tasks 1.1, environment-fields (CPU and GPU access), src/environment/README.md"
kind = "command"
run = '''
set -eo pipefail
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null

# WHAT THIS CHECK USED TO BE, AND WHY IT IS NOT THAT ANY MORE. It was
# `grep -rl "FieldImageHeader\|field_image\|kFieldImage" --include='*.slang' src/`, and a comment
# carrying one of those words satisfied it. `tools/roadmap/falsify.py audit --weak` names that shape
# `presence-only`: the verdict is that some text exists. This project has now shipped SEVEN checks
# that could not fail, and a criterion whose subject is "a shader SAMPLES a field" answered by a
# string in a file is the same defect, so it is answered by running the shader's compiler instead.
#
# TWO HALVES, AND NEITHER IS A STRING.
#
#   the module TYPE-CHECKS through the engine's own Slang front end, inside a program that CALLS it
#   — `smoke.material_slang`'s last case, whose probe calls `cyFieldSampleScene`,
#   `cyTerrainSampleSubstrate`, `cyTerrainShade`, `cyCloudShadowAt` and `cyCloudShadowAttenuate`, so
#   a sampler that is deleted, renamed or given a signature nothing can call fails to compile;
#
#   the SPIR-V that `render.environment_field` measures is the SPIR-V THIS MODULE COMPILES TO TODAY.
#   `tests/render/shaders/field_probe_spirv.h` is checked in — the render suite must run in builds
#   with no shader compiler at all — so without this half, editing `cy/field.slang` changes nothing
#   that any suite executes, and the ULP numbers that criterion prints are about bytes nobody can
#   trace to a source file. Recompiling the probe and requiring word-for-word equality is what ties
#   the measurement to the module, and it is the only thing in the tree that does.
binary="$d/src/rendering/material/tests/cy_test_smoke_material_slang"
test -x "$binary" || binary="$d/cy_test_smoke_material_slang"
test -x "$binary" || { echo "no cy_test_smoke_material_slang under $d: this build has no Slang front end, so nothing in it compiles a shader and the claim cannot be judged here"; exit 1; }
filter='the environment field sampler and its consumers compile against the standard library'
out="$("$binary" "-tc=$filter" 2>&1)" || {
    printf '%s\n' "$out" | tail -40
    echo "the environment field sampler and its two consumers do NOT compile against the engine's standard library"
    exit 1
}
selected=$(printf '%s' "$out" | sed -nE 's/.*test cases: *([0-9]+) \|.*/\1/p' | head -1)
test "${selected:-0}" -ge 1 || { echo "the compile case is no longer in smoke.material_slang — renamed, deleted, or this filter is stale"; exit 1; }
printf '%s\n' "$out" | grep -o 'cy.field + cy.terrain_shade + cy.cloud_shadow compiled to .*'

slangc="$d/Development/bin/slangc"
test -x "$slangc" || slangc="$(find "$d" -type f -name slangc -perm -u+x 2>/dev/null | head -1)"
test -x "${slangc:-/nonexistent}" || { echo "no slangc under $d: the checked-in SPIR-V cannot be re-derived, so nothing ties cy/field.slang to what render.environment_field measures"; exit 1; }
work="$(mktemp -d)"
trap 'rm -rf "$work"' EXIT
for entry in sampleFieldBound sampleFieldBindless; do
    "$slangc" tests/render/shaders/field_probe.slang -I src/rendering/shaders \
        -target spirv -profile spirv_1_5 -entry "$entry" -stage compute \
        -fvk-use-entrypoint-name -o "$work/$entry.spv"
done
python3 - "$work/sampleFieldBound.spv" "$work/sampleFieldBindless.spv" \
    tests/render/shaders/field_probe_spirv.h <<'CHECK'
import re
import struct
import sys


def compiled(path):
    data = open(path, "rb").read()
    if len(data) % 4 or len(data) < 20:
        sys.exit(f"{path}: slangc produced no whole SPIR-V module")
    return list(struct.unpack(f"<{len(data) // 4}I", data))


text = open(sys.argv[3]).read()
embedded = {name: [int(word, 16) for word in re.findall(r"0x([0-9A-Fa-f]+)U", body)]
            for name, body in re.findall(r"(k\w+Spirv)\[\]\s*=\s*\{(.*?)\};", text, re.S)}
fresh = {"kFieldProbeBoundSpirv": compiled(sys.argv[1]),
         "kFieldProbeBindlessSpirv": compiled(sys.argv[2])}
stale = []
for name in sorted(fresh):
    mine, theirs = fresh[name], embedded.get(name)
    if theirs is None:
        sys.exit(f"{name} is not in field_probe_spirv.h: the suite that measures the device "
                 f"sampler no longer runs a module this check can re-derive")
    verdict = "identical" if mine == theirs else "DIFFERENT"
    print(f"  {name}: {len(mine)} words recompiled, {len(theirs)} embedded — {verdict}")
    if mine != theirs:
        stale.append(name)
if stale:
    sys.exit("the checked-in SPIR-V is not what cy/field.slang compiles to today (" +
             ", ".join(stale) + "). render.environment_field measures those bytes, so its "
             "agreement figures are about a shader that is no longer in the tree. Regenerate with "
             "the invocation in tests/render/shaders/field_probe.slang's header comment.")
print("an environment field is sampled in a shader: the sampler and its two consumers type-check "
      "through the engine's own front end, and the module the device suite measures is this one")
CHECK
'''
ci_job = "milestone-m10"

# --- Section 8: the record, the tiers, and the next rung -------------------------------------------

# TASK 8.2, AND THE DOUBLE-STAR GLOB IS THE POINT. m6.toml's own comment says why: a change lives at
# `openspec/changes/<name>/` while it is open and at `openspec/changes/archive/<date>-<name>/` once
# it closes, so a pattern that only matched an open change would turn red on the day the next
# milestone closed — which is the one day this criterion should be most satisfied. `**` matches both
# depths.
#
# AT THE TIME THIS FILE WAS WRITTEN IT FAILS, AND IT IS MEANT TO, exactly as m8c.toml's `m9-open` and
# m9.toml's `m10-open` did before it: `openspec/changes/` holds `implement-m10-worlds` and no
# `implement-m11-*`. Task 8.5 is what closes it.
#
# AND WHEN IT WAS CLOSED, M11 TURNED OUT TO BE FIVE RUNGS. `implement-m11-reach` task 0.1 split it
# into `m11a` … `m11e`, so `record.MILESTONES` now carries those five in place of `m11`. This
# criterion is unaffected by that — `*m11*` matches the umbrella change and all five rung changes —
# and the rung it points at is M11.a, which is where four of this file's own declared gaps close.
# The platform matrix three of them used to be filed against is M11.d and M11.e's.
[[criterion]]
id = "m11-open"
describe = "the change for the next rung exists — open, or closed and archived — so the ladder continues deliberately. That rung is M11, which `record.MILESTONES` already carries after m10, and which this milestone hands four things: `sky-field-round-trip`, `fields-one-vegetation-potential`, `world-frame-budget` and the two questions this host cannot ask"
source = "tasks 8.5, delivery-roadmap"
kind = "path"
path = "openspec/changes/**/*m11*/proposal.md"
ci_job = "milestone-m10"

# THE CHECK M9's GATE ADDED, POINTED AT THIS MILESTONE'S OWN COLUMN, AND IT IS NOT MILESTONE-SPECIFIC
# IN SHAPE. `plan-consistency` compares the plan documents WITH EACH OTHER and they agree;
# `roadmap-record` compares the record with `openspec/specs/`; `roadmap-tiers` compares the record
# with the rows this ledger names. Nothing compared THE COLUMN WITH THE RECORD until M9 wrote this,
# and the six cells it found had been parked in M9's column since the plan was first drawn.
#
# THE M10 COLUMN HAS THE SAME SHAPE OF CELL IN IT. Besides the eleven rows this milestone proposed,
# it carries Complete cells for `navigation`, `rendering-global-illumination` and
# `world-partition-and-streaming` — three rows M10 never proposed, never touched and never audited.
# This criterion is what refuses to let them close silently: either the work is done and the record
# says so, or the cells move, and both are deliberate acts rather than an omission nobody noticed.
[[criterion]]
id = "record-matches-plan"
describe = "**EVERY TIER THE M10 COLUMN OF THE CAPABILITY MATRIX CLAIMS IS A TIER THE STATUS RECORD SUPPORTS.** The comparison no check made before M9's gate wrote it, pointed at this milestone's column — which carries not only the eleven rows M10 proposed but Complete cells for `navigation`, `rendering-global-illumination` and `world-partition-and-streaming`, three rows this milestone never examined. A cell that outlives its evidence is how a plan comes to claim more than a tree contains, and this is the check that makes moving one a deliberate act"
source = "tasks 8.3, 9.4, delivery-roadmap"
kind = "command"
run = '''
python3 - <<'CHECK'
import sys
sys.path.insert(0, "tools/roadmap")
import plan, record

matrix = plan.read_matrix()
recorded = {e.capability: e for e in record.load()}
short = []
cells = 0
for capability, columns in sorted(matrix.cells.items()):
    planned = columns.get("m10")
    if planned is None:
        continue
    cells += 1
    have = recorded.get(capability)
    tier = have.tier if have else "none"
    # `plan.TIERS` IS ("seed", "working", "complete") AND DOES NOT CARRY "none", so ranking an
    # unrecorded capability raises rather than reporting. M9 declared this check with
    # `plan.tier_rank(tier)` reached unconditionally and never met the case, because every
    # capability in its column was already recorded at some tier. SEVEN OF M10's ARE AT `none`
    # UNTIL TASK 8.3 WRITES THEM, so the unrecorded case is the normal one here and a criterion
    # that raised a ValueError would be failing for a reason that is about this script.
    if have is None or tier not in plan.TIERS:
        short.append(f"  {capability}: the M10 column plans {planned} and the record holds "
                     f"nothing yet")
    elif plan.tier_rank(tier) < plan.tier_rank(planned):
        short.append(f"  {capability}: the M10 column plans {planned} and the record holds {tier}"
                     + (f" from {have.milestone}" if have.milestone else ""))
print(f"the M10 column carries {cells} cell(s); {len(short)} of them exceed the status record")
for line in short:
    print(line)
sys.exit(1 if short else 0)
CHECK
'''
ci_job = "milestone-m10"

