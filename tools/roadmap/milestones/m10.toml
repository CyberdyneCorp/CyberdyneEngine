# --- Section 1: the substrate, and the producers that are not allowed to fork it -------------------
#
# `environment-fields` is the milestone — design.md §4's first line — and seven of M10's eight rows
# write into it. Five criteria over it, and they are NOT five names for one `ctest` invocation:
# `criteria.fingerprint` collapses declarations that run the same command, so a ledger that listed
# one suite five times would be reported as one check and READ as five. Where a claim needs to be
# separable from the suite that carries it, the criterion runs the NAMED CASES under `doctest`'s own
# `-tc` filter and REQUIRES THE FILTER TO HAVE SELECTED THEM — because a filter that matches nothing
# exits zero, and "the case was renamed" and "the case passed" must not look the same from here.

[[criterion]]
id = "fields-substrate"
describe = "THE SUBSTRATE ITSELF: a field's identity is its name and is the same number everywhere forever; a declaration that cannot mean anything is refused by reason; the encoding decides the precision two readers are held to; the layer rule is declared rather than emergent; the SPARSE TILED STORE — an empty region costs nothing and samples the declared default, a sample takes the finest resident level and says which one it was, a category is read exactly because nothing averages it, a volumetric field and a planar one are one code path, a region carries a version and a change names its bounds, a write is visible when it is published and not while it is being made, and an evicted tile gives its bytes back while a guaranteed one refuses. Twenty-nine cases, one suite, one criterion"
source = "tasks 1.1, environment-fields"
kind = "recipe"
run = "just test-unit -R ^unit.environment$"
timeout_s = 7200
ci_job = "milestone-m10"

# THE EXIT CRITERION OF SECTION 1, AND IT IS A REFUSAL RATHER THAN A DIAGNOSTIC.
#
# `docs/ROADMAP.md` M10: "a second producer registration fails". design.md §2 says why the shape is
# a refusal and not a warning — "a diagnostic that fires at runtime has already shipped the defect"
# — and tasks.md 1.2 says the refusal IS the criterion and must be shown to fail with the check
# removed. `FieldRegistry::claim()` is where it lives: it records the conflict, names the incumbent
# AND the challenger in the error's own message, and hands back no token, so the refused producer
# has nothing to write with. Delete the `if (record->claimed)` block and all three cases go red.
[[criterion]]
id = "one-producer-refused"
describe = "**A SECOND PRODUCER FOR ONE FIELD IS REFUSED, AND THE REFUSAL NAMES BOTH OF THEM.** Three cases, run by name: the second claim fails naming the incumbent and the challenger; the refused producer CANNOT WRITE, because a claim that failed hands back no token and a write needs one; and a claim on an undeclared field or by an unnamed producer is refused too, so the mechanism is not satisfied by refusing everything. The filter's selection is checked, because a `-tc` that matched nothing would exit zero and read as green"
source = "tasks 1.2, ROADMAP M10 (a second producer registration fails), design.md §2"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
filter='a second producer is refused*,the refused producer cannot write*,a claim on an undeclared field*'
out="$("$d/cy_test_unit_environment" "-tc=$filter" 2>&1)" || { echo "$out"; echo "the refusal cases FAILED"; exit 1; }
echo "$out" | tail -4
selected=$(printf '%s' "$out" | sed -nE 's/.*test cases: *([0-9]+) \|.*/\1/p' | head -1)
echo "the filter selected ${selected:-0} case(s) of the three it names"
test "${selected:-0}" -eq 3 || { echo "the named refusal cases are not in unit.environment any more — renamed, deleted, or the filter is stale"; exit 1; }
'''
timeout_s = 7200
ci_job = "milestone-m10"

# DETERMINISM IS INHERITED RATHER THAN RE-INVENTED — design.md §3 — so what this checks is that the
# substrate DEFERS to `simulation-and-determinism` rather than growing a second opinion. Two halves,
# and the second is the one a suite can satisfy vacuously: a gameplay-visible answer that moved when
# a finer tile streamed in would be a field whose value depends on what the renderer happened to
# load, which is the defect `gameplay_level` exists to prevent and which no firewall would catch.
[[criterion]]
id = "fields-determinism-split"
describe = "**THE DETERMINISM SPLIT, AND IT IS `simulation-and-determinism`'s MECHANISM AND NOT A SECOND ONE.** Five cases by name: the firewall refuses a gameplay reader of a visual field AT THE OPEN rather than at the sample; configuration validation names the crossing before a frame has run; a gameplay-visible field may not be produced by a GPU pass; a gameplay-visible field's gameplay level must be resident everywhere; and — the half a firewall cannot give — a gameplay-visible sample DOES NOT MOVE when a finer tile streams in, and does not depend on the order tiles arrived in"
source = "tasks 1.4, design.md §3, simulation-and-determinism"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
# `a gameplay-visible field*` deliberately covers two cases — the GPU-production refusal and the
# resident-everywhere rule — because a doctest filter is comma-separated and several of these case
# names contain commas of their own.
filter='the firewall refuses a gameplay reader*,configuration validation names the crossing*,a gameplay-visible field*,a gameplay-visible sample does not move*,the order tiles arrive in does not change*'
out="$("$d/cy_test_unit_environment" "-tc=$filter" 2>&1)" || { echo "$out"; echo "the determinism-split cases FAILED"; exit 1; }
echo "$out" | tail -4
selected=$(printf '%s' "$out" | sed -nE 's/.*test cases: *([0-9]+) \|.*/\1/p' | head -1)
echo "the filter selected ${selected:-0} case(s) of the six it names"
test "${selected:-0}" -eq 6 || { echo "the named firewall and streaming-invariance cases are not in unit.environment any more"; exit 1; }
'''
timeout_s = 7200
ci_job = "milestone-m10"

[[criterion]]
