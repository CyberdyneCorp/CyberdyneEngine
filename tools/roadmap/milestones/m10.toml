# M10 — Worlds: the exit criteria, as data.
#
# The sources are openspec/changes/implement-m10-worlds/tasks.md and the M10 row of
# docs/ROADMAP.md; every criterion names which. `delivery-roadmap` requires each to be a recipe that
# exits zero, a command that exits zero, a benchmark within a threshold, or a committed artefact
# that is regenerated and compared — so an intention that cannot be run is a note at the bottom of
# this file, not a criterion.
#
# --- THIS FILE WAS OPENED BY THE SPIKE AND IS FINISHED BY TASK 8.1 --------------------------------
#
# It carried, at the moment it was first written, exactly the two criteria TASK 0.2 owed: the two
# questions the spike could not answer on this host, declared through the ledger's own
# `requires`/`where` mechanism rather than written as a sentence somewhere. A third was added when
# M10's own gate ran and refuted one of the claims it was asked to check. **Task 8.1 EXTENDED this
# file rather than replacing it** — all three of those criteria are still below, in their original
# words, because replacing the file would have dropped the milestone's only honest NOT EVALUATED and
# its most expensive finding at the same time. What task 8.1 added is everything else M10 has to be
# able to fail on: the substrate's one-producer-per-field refusal, terrain, water, foliage, weather,
# the atmosphere, the PCG row's four conditions, `vfx-system`'s GPU path, `tests/determinism/`, the
# artefact and its budget curve, the record, and the next rung.
#
# ONE EXISTING CRITERION WAS EDITED, AND ONLY ITS `run`. `sky-field-round-trip` was declared with
# `ctest --output-on-failure`, which prints nothing for a suite that PASSES — and the suite does
# pass, because the two assertions that would fail are commented out in `test_cloud_shadows.cpp`
# with a note saying so. So the criterion failed with `the sky round-trip case did not run`: the
# right verdict reached for the wrong reason, which is a criterion that would go on failing after
# the gap closed. It now runs the suite under `ctest -V`, reads the `through the store:` line the
# case prints either way, and fails on the NUMBERS — `lowest` at the declared default and a spread
# of nothing. Its `describe`, its `known_gap` and its rung are untouched.
#
# `milestone-m10` is declared in gates.toml at `state = "joins-on-close"`, which is where it stays:
# a green gate with no matching `milestone` job in ci.yml is the pattern gates.toml's own header
# forbids, and flipping it belongs to task 8.4's change together with that job's move. Nothing in
# this file may be read as having flipped it.
#
# --- WHY BOTH OF THESE ARE `where = "ci"` AND NEITHER IS `requires = "gpu"` -----------------------
#
# `unmet_requirement()` reports NOT EVALUATED for `where = "ci"` on a developer's machine, which is
# the honest answer for a question this host cannot ask. `requires = "gpu"` would NOT do it: this
# machine has a DRM render node, so `_has_gpu()` is true, the criterion would RUN here, and it would
# report a pass measured against one vendor's driver and one vendor's floating-point behaviour —
# which is not the claim. A criterion that passes on the machine least able to judge it is the exact
# defect `requires` exists to prevent, so the mechanism is used for what it says rather than for
# what is convenient.
#
# And in continuous integration these do not become free: each `run` looks for the ONLY SHAPE that
# could answer it — a job that publishes one leg's digest and compares it against another's — so a
# green there means the comparison exists, not that a single-leg suite ran. That is M9's
# `lockstep-cross-platform` lesson, kept: `where = "ci"` must never be a way of making a question
# disappear.

schema = 1
id = "m10"
name = "Worlds"
artefact = "samples/10-world — one world, seven modules, one simulated day, and no content at all: no asset, no mesh and no texture anywhere in it. From one seed on the command line: a nine-node graph over 576 regions of 64 m producing 9 792 region-evaluations across 9 stages and 2 242 points, whose accepted set becomes 456 FOLIAGE CLUSTERS through `pcg::FoliageOutputAdapter` with no entity anywhere; 49 terrain tiles over three levels from that raster, 2.2 MB resident, 294 912 triangles meshed, elevation -41.2 m to 180.1 m, 0 vertices stitched to a coarser neighbour; a four-cascade spectral ocean, three authoritative bands and one visual-only, at 2.03 m significant height and 79.1 m peak wavelength; 39 032 foliage instances in 561 clusters of four species at 17.3 BYTES AN INSTANCE; 23 fields declared in one substrate and 19 of them claimed by FOUR DIFFERENT PRODUCERS, which is the milestone's whole subject in one line; and 11 264 directions integrated into the atmosphere tables. Then the day: the sun crossing +24.2 deg at noon and -51.7 deg at midnight, a front arriving at 13:19 that drops the temperature from 7.7 C to -6.3 C, takes the wind from 4 m/s to 21.6 m/s and the precipitation from 0.3 mm/h to 31.4 mm/h, and snow accumulating to 2.4 m on the windward probe while the world's centre reads 0.000 m all morning — one westerly's orographic precipitation, from the declared model rather than a painted patch. And task 7.2: a crater stamped through `terrain::TerrainDeltaStore`, recorded into `world::PersistenceOverlay` as one subsystem blob of 2 976 bytes, the delta store CLEARED and the crater verified gone, restored from the overlay alone, and 0 of 289 probes over its footprint disagreeing with the pre-save surface — bit for bit, because a height delta is stored and restored as the same f32 and a tolerance would hide a lossy round trip. Two runs at one seed produce the identical report and the identical still; a different seed produces a different world. WHAT IT COSTS IS THE HONEST HEADLINE: about 122 ms a frame at 960x540 against a 16.7 ms budget, nearly flat across the cycle, and the three largest bands — the substrate re-sampled at every terrain vertex, the cloud march, and water's foam field — are all three of them work a shipping engine would do in a shader. `world-frame-budget` below is that, as a declared gap. And there are NO RIVERS: `cy::water`'s `RiverNetwork` is built and tested and this world has an ocean, a fjord coastline and no river spline in it, which the sample's README says on its own face."

