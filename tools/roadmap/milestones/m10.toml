# --- Section 4: procedural content generation -----------------------------------------------------
#
# THE MILESTONE'S NAMED RISK, AND THE SPIKE THAT RAN BEFORE IT. `docs/roadmap/risks.md` names region
# invalidation in PCG as M10's spike, design.md §1 is what it answered, and §1.6 turned the answer
# into FOUR CONDITIONS the row must satisfy to be allowed caching and spatial invalidation at all.
# Those four conditions are criteria here — `pcg-spike-conditions` — rather than a paragraph in the
# design, because §1.6's own sentence is "each is a test before it is prose".
#
# AND THE SPIKE'S OWN LESSON IS THE REASON THE CASES ARE NAMED RATHER THAN COUNTED. The spike's first
# contention meter counted order-dependence in a FULL run, where it is zero by construction, and duly
# reported "reproduces" for a variant that does not. A suite whose name is asserted and whose cases
# are not is the same defect one level up.

[[criterion]]
id = "pcg-core"
describe = "TYPED DATASETS, THE COMPILED GRAPH, AND THE DERIVED-DATA CACHE — thirty-nine cases. The dataset's own rules: a point set refuses to grow past the capacity it reserved, retain COMPACTS IN PLACE AND KEEPS EACH SURVIVOR'S ORIGINAL SLOT (which is what makes identity survive a filter), a digest covers positions, slots, identities and columns and treats negative zero as zero, an attribute is interned once and refuses a second type. The compiler's refusals and its optimisations: dead nodes eliminated and NAMED, a compute over a constant folded, a chain of filters fused, two reads of one field fused into one sampling, a subgraph inlined twice minting DIFFERENT identities, a scripted node reported as a barrier by name. And the cache: every contribution the specification names moves the derivation key, a field version change moves it and the field ORDER does not, a budgeted program's region is refused by the cache AND THE REFUSAL SAYS WHY"
source = "tasks 4.1, 4.3, procedural-content-generation"
kind = "recipe"
run = "just test-unit -R ^unit.pcg$"
timeout_s = 7200
ci_job = "milestone-m10"

[[criterion]]
id = "pcg-identity"
describe = "**STABLE GENERATED IDENTITY**, which `docs/ROADMAP.md` names as an exit criterion and design.md §1.6 makes the fourth condition: identity is a pure function of SEED, NODE, REGION AND SLOT, a node's identity comes from its NAME and not from its position in the graph, the generation stream is separate from the identity derivation, a region key separates negative coordinates from their unsigned twins, derived identities do not collide over a world of regions and slots, and every identity source has a name so a refusal can print the one it refused. §1.4 is the number this has to beat, and the spike's own first attempt — `fold_multiply(region + 1, slot + 1)`, which for small operands is plain multiplication and therefore not injective — is why 'do not collide' is a case and not an assumption"
source = "tasks 4.2, ROADMAP M10 (stable generated identity), design.md §1.6"
kind = "recipe"
run = "just test-integration -R ^integration.pcg_identity$"
timeout_s = 7200
ci_job = "milestone-m10"

[[criterion]]
id = "pcg-generation"
describe = "GENERATION, REGIONS AND SPATIAL INVALIDATION — the suite the spike's answer became. Thirteen cases including the budget and cancellation properties that make a generator usable inside a frame: a budgeted run IN STEPS produces exactly what one unbudgeted run produces, and a cancelled run keeps its place and resumes to the same world. Plus a generator not declared for a domain refusing to run in it, a stage that rewrites a shared buffer re-running its consumer wherever it ran, a region naming the change AND the dependency path that reached it, and dilation clamped to the extent with a region set enumerating canonically"
source = "tasks 4.3, procedural-content-generation"
