id = "roadmap-tiers"
describe = "the status record is at this milestone's exit tiers: SEVEN capabilities from nothing or Seed to Working, an eighth — `vfx-system` — advanced from Seed on the GPU compute path M8.c deferred here, and of the three rows M9 demoted, two completed and ONE DEMOTED A SECOND TIME. `save-and-persistence` is recorded at Working, not Complete: task 6.2 is unticked, its confidentiality half is a vetted-AEAD dependency decision and its conflict resolution is unstarted. design.md §4 says what a second demotion means and it is said here rather than absorbed"
source = "tasks 8.3, ROADMAP M10, delivery-roadmap"
