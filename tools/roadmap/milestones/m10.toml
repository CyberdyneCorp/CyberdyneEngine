# THE SPIKE'S FINDING, AS A CHECK THAT CAN FAIL. design.md §1.1: a dependency-driven partial
# regeneration reproduces a full one bit for bit, in every trial, for output AND for identity. If
# that stops being true, §4's contingency fires and caching and spatial invalidation come OUT of the
# row — so this is the criterion that stands between the plan and a silent scope change.
#
# FOUR CASES, AND THE THIRD AND FOURTH ARE WHAT KEEP THE FIRST TWO HONEST. "Reproduces the full one"
# is satisfied by a partial regeneration that simply re-ran everything, so the transitive-edge case
# requires it to evaluate FEWER regions than a full run and MORE than it changed; and a partial
# regeneration over a world that was never fully generated has to be REFUSED, because a cache that
# answers from nothing reproduces anything.
#
# AND WHAT IT DOES NOT COVER, MEASURED RATHER THAN ASSUMED. Breaking `derive_identity()` so that
# every even slot in a region shares an identity leaves this criterion GREEN and turns `pcg-identity`
# and `pcg-override-survives-regeneration` red. That is correct and it is worth writing down: this
# is a SELF-CONSISTENCY check — two runs of one derivation, compared with each other — so a
# derivation that is stable and wrong satisfies it perfectly. `pcg-identity` is the criterion that
# judges the derivation, and reading this one as covering identity QUALITY would be reading a
# comparison of a thing with itself as a comparison with the truth.
[[criterion]]
id = "pcg-partial-reproduces-full"
describe = "**A PARTIAL REGENERATION REPRODUCES THE FULL ONE, BIT FOR BIT AND IDENTITY FOR IDENTITY** — the spike's measured finding, kept as a running check rather than a recorded number. Four cases by name: two full generations of one seed identical in output and in identity; the partial regeneration reproducing the full one; the transitive edge evaluating fewer regions than a full run AND MORE THAN IT CHANGED, so 're-run everything' cannot satisfy it; and a partial regeneration over a world that was never fully generated REFUSED rather than answered. The filter's selection is checked, because a `-tc` that matched nothing exits zero"
source = "tasks 0.1, 4.3, design.md §1.1, §4"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
filter='two full generations of one seed are identical*,a partial regeneration reproduces the full one*,the transitive edge evaluates fewer regions*,a partial regeneration over a world that was never fully generated is refused*'
out="$("$d/cy_test_integration_pcg_generation" "-tc=$filter" 2>&1)" || { echo "$out"; echo "the regeneration cases FAILED — design.md §4's contingency has fired"; exit 1; }
echo "$out" | tail -4
selected=$(printf '%s' "$out" | sed -nE 's/.*test cases: *([0-9]+) \|.*/\1/p' | head -1)
echo "the filter selected ${selected:-0} case(s) of the four it names"
test "${selected:-0}" -eq 4 || { echo "the named regeneration cases are not in integration.pcg_generation any more"; exit 1; }
'''
timeout_s = 7200
ci_job = "milestone-m10"

# THE FOUR CONDITIONS §1.6 IMPOSED ON THE ROW, EACH AS THE REFUSAL IT IS MEANT TO BE.
#
#   1. invalidation is a fixed point, not a declared radius   — a node observed to read outside its
#                                                               declared reach is named
#   2. a node is a pure function of its declared inputs       — reading a sibling's OUTPUT is
#                                                               refused at graph-compile time
#   3. an iterative operator declares convergence, not a budget — and a budgeted result is not
#                                                               cacheable
#   4. identity derives from stable identifiers                — minting it from traversal order is
#                                                               refused
#
# Three of the four are compile-time refusals in `unit.pcg` and the first is a run-time observation
# in `integration.pcg_generation`, so this criterion runs both binaries. Deleting any one refusal
# from the compiler drops the selected count and turns this red without touching a single assertion.
[[criterion]]
id = "pcg-spike-conditions"
describe = "**THE FOUR CONDITIONS THE SPIKE IMPOSED ON THIS ROW, AS TESTS.** A node that reads a sibling's accepted output is REFUSED AND NAMED (condition 2); a node that mints identity from traversal order is refused and named (condition 4); an iterative node with no bound and a cross-region solve with no policy are refused, a relaxation whose halo cannot hold its passes is refused, and a program with a budgeted iterative stage IS NOT CACHEABLE while one with convergence is (condition 3); and what a region was RECORDED TO READ narrows the next dirty set below its declared reach (condition 1 — a fixed point measured rather than a radius declared). design.md §1.6: 'each is a test before it is prose'"
source = "tasks 0.1, 4.1, 4.3, design.md §1.6"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
compile_filter='a node that reads a sibling*,a node that mints identity from traversal order is refused*,an iterative node with no bound*,a relaxation whose halo cannot hold its passes is refused*,a program with a budgeted iterative stage is not cacheable*'
out="$("$d/cy_test_unit_pcg" "-tc=$compile_filter" 2>&1)" || { echo "$out"; echo "the graph-compile refusals FAILED"; exit 1; }
echo "$out" | tail -3
selected=$(printf '%s' "$out" | sed -nE 's/.*test cases: *([0-9]+) \|.*/\1/p' | head -1)
echo "conditions 2, 3 and 4: ${selected:-0} case(s) selected of the five named"
test "${selected:-0}" -eq 5 || { echo "a named graph-compile refusal is gone from unit.pcg"; exit 1; }
reach_filter='what a region was recorded to read narrows the next dirty set*'
out="$("$d/cy_test_integration_pcg_generation" "-tc=$reach_filter" 2>&1)" || { echo "$out"; echo "the declared-reach case FAILED"; exit 1; }
echo "$out" | tail -3
selected=$(printf '%s' "$out" | sed -nE 's/.*test cases: *([0-9]+) \|.*/\1/p' | head -1)
echo "condition 1: ${selected:-0} case(s) selected of the one named"
test "${selected:-0}" -eq 1 || { echo "the declared-reach case is gone from integration.pcg_generation"; exit 1; }
'''
timeout_s = 7200
ci_job = "milestone-m10"

# THE OTHER EXIT CRITERION `docs/ROADMAP.md` NAMES FOR THIS ROW, and design.md §1.4 is the reason it
# is five cases rather than one: the spike measured that overrides are the thing a regeneration
