[[criterion]]
id = "layering"
describe = "THE ENGINE'S LAYER ORDER HOLDS WITH SEVEN NEW MODULES IN IT, AND THAT IS THIS MILESTONE'S ARCHITECTURAL CLAIM RATHER THAN A FORMALITY. `cy::weather` does not link `cy::water`; `cy::water` does not link `cy::terrain`; `cy::pcg` links neither `cy::foliage` nor `cy::ecs`; none of them links the renderer, and `cy::vfx` does not link a device — `cy::vfx-gpu` in src/vfx/gpu/ is where the device is, which is what keeps `integration.vfx` headless. Those absences are what 'one substrate, and the producers that are not allowed to fork it' MEANS, and this is the check that makes them a link-graph fact rather than a paragraph in a README"
source = "tasks 8.1, design.md §2, engine-architecture"
