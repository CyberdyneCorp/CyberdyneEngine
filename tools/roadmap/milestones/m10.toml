# --- The whole tree, in every profile -------------------------------------------------------------
#
# THE IDENTICAL STRING ELEVEN EARLIER LEDGERS USED. `criteria.fingerprint` collapses declarations
# that do the same work, so declaring it here COLLAPSES all of them into one run of it, reported as
# `m1:four-profiles`. That is the whole point of the flat ledger and the reason this string must not
# be "improved" here.
#
# WHAT IT HAS TO SWALLOW AT THIS MILESTONE: seven new modules, an eighth module half that is only
# declared when a rendering backend is, a determinism test kind that did not exist, and a sample
# whose link line names all seven modules and whose Vulkan backend is a LINK-TIME choice rather than
# a compile-time one — so `-D CY_RENDERER_VULKAN=OFF` still builds it, still runs the whole world
# headless, and still has to pass.
[[criterion]]
id = "four-profiles"
describe = "all four profiles build clean and just test-all is green in each — including src/environment/, src/terrain/, src/water/, src/foliage/, src/weather/, src/pcg/, src/vfx/gpu/, tests/determinism/ and samples/10-world. M8.c's gate found its artefact red in Debug because nobody had looked; this milestone's artefact is a world whose every reported figure is a count or a digest rather than a timing, precisely so that the four profiles have to agree about it"
source = "tasks 9.1"
kind = "command"
# THE `run` IS THE TWELVE EARLIER LEDGERS' STRING, CHARACTER FOR CHARACTER, AND THAT IS THE POINT.
# `criteria.fingerprint` collapses declarations that run the same command, so the four-configuration
# build and test is evaluated ONCE however many ledgers name it. M10's gate found this ledger had
# spliced `just build-editor` into the middle of the line instead: a different `run` is a different
# fingerprint, so `just roadmap-milestone m10` planned TWO four-profile entries and ran twelve heavy
# recipes and eight build trees for a check that must run once — and `just roadmap-test` went red on
# "`four-profiles` is declared by several ledgers and evaluated once", which is `plan-consistency`
# above. The editor half is real and is kept: it is `four-profiles-editor` below, as its own
# criterion, because that is how a milestone adds a check without forking one it inherited.
run = "for p in debug dev profile release; do d=\"${CY_BUILD_DIR:+${CY_BUILD_DIR}/$p}\"; CY_BUILD_DIR=\"$d\" just build-engine --profile \"$p\" || exit 1; CY_BUILD_DIR=\"$d\" just build-editor --profile \"$p\" || exit 1; CY_BUILD_DIR=\"$d\" just test-all --profile \"$p\" || exit 1; done"
timeout_s = 28800
ci_job = "profiles"

# `just build-engine` DOES NOT BUILD THE RUST EDITOR, and until M10 no ledger said so: `four-profiles`
# above is engine-only, and `smoke.authoring` runs against whatever editor binary happened to be in
# the tree. The four profiles map onto two cargo profiles through `_cargo-profile`, and
# `editor/tests/profiles.rs` asserts that the binary it runs in was compiled with the assertions its
# row of the profile table declares — so a mapping that drifted is a red test rather than a silent
# difference.
#
# ONE TREE AND NOT FOUR. Cargo's target directory is `${CY_BUILD_DIR:-build}/editor` and the cargo
# profiles coexist inside it, so this loop costs one directory however many profiles it walks. It is
# deliberately NOT run under `${CY_BUILD_DIR}/$p` the way the engine loop is: that would be four
# cargo target directories for two distinct builds.
[[criterion]]
id = "four-profiles-editor"
describe = "THE EDITOR BUILDS IN ALL FOUR PROFILES TOO. `just build-engine` does not build it — `build-all` is the recipe that builds both — so an engine-only four-profile check is a four-profile check with the editor missing from it, and `smoke.authoring` would then be asserting against whatever binary was left in the tree. Declared separately from `four-profiles` rather than folded into it, because that criterion's `run` is shared verbatim with twelve earlier ledgers and editing it forks a check the ledger is supposed to inherit"
source = "tasks 9.1, developer-workflow-and-just"
kind = "command"
run = "for p in debug dev profile release; do just build-editor --profile \"$p\" || exit 1; done"
timeout_s = 7200
ci_job = "profiles"
