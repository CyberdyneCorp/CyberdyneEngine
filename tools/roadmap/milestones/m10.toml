# THE GPU HALF, ON A REAL DEVICE, AND IT IS THE CELL. Six cases, and three of them are the exact
# sentences M8.c could not claim: state RESIDENT in GPU buffers advancing the same population the CPU
# executor does; population and dispatch size coming FROM THE DEVICE rather than from this process,
# which is what "indirect dispatch driven by GPU-maintained counts" means and is not satisfiable by a
# dispatch sized on the host; the GPU sort ordering the live list back to front with the lever
# removing it; and async compute used where the device HAS a queue, with turning it off changing
# nothing about the result.
[[criterion]]
id = "vfx-device"
describe = "**PARTICLE STATE RESIDENT IN GPU BUFFERS, INDIRECT DISPATCH DRIVEN BY GPU-MAINTAINED COUNTS, ASYNC COMPUTE WHERE THE DEVICE EXPOSES A QUEUE, AND THE GPU SORT BEHIND `BudgetLevers::sorted`** — on a device, through `cy::vfx-gpu`. Six cases: the device advances the same population the CPU executor does; population and dispatch size come from the DEVICE and not from this process; the particle-count lever bounds the population the device holds; the cap reduces a block that is ALREADY FULL and not only one that is filling; the GPU sort orders the live list back to front and the lever removes it; async compute is used where the device has a queue and turning it off changes nothing. Its companion `vfx-runtime` above needs no device, so the row is not judgeable only where a GPU is"
source = "tasks 5.1, 5.2, ROADMAP M10, vfx-system"
# KIND `command` AND NOT `recipe`, AND THE THREE LINES BELOW ARE WHY. M10's gate ran this
# criterion against a tree with `render.vfx_gpu` DELETED and it stayed GREEN. `just/test.just`'s
# `_ctest` gives the render kind `--no-tests=ignore` where every other kind gets
# `--no-tests=error`, because the render suites are not declared at all in a build with no
# rendering backend (tests/render/CMakeLists.txt) and a suite that failed on every machine
# without one is a suite nobody would keep in the set. That exemption is right for
# `just test-render` with no argument — and it means an EMPTY SELECTION EXITS ZERO, so a
# criterion that names one render suite through the recipe asserts nothing about that suite: rename
# it, delete it, or configure the tree without Vulkan, and the criterion still passes having run
# NOTHING. The registration is therefore asserted here, in the criterion, before the suite is run.
# The recipe is left alone: its exemption is load-bearing for `test-all` on a device-free machine,
# and any other ledger naming ONE render suite needs this same guard rather than a changed recipe.
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
ctest --test-dir "$d" -N -R '^render.vfx_gpu$' 2>/dev/null | grep -q 'render.vfx_gpu' || {
    echo "render.vfx_gpu is not registered in $d — the suite has been renamed or deleted, or this"
    echo "tree was configured with no rendering backend. Either way the GPU particle path is"
    echo "UNMEASURED, and the render recipe would report that as a pass by running nothing."
    exit 1
}
just test-render -R '^render.vfx_gpu$'
'''
requires = "gpu"
reason = "particle state resident in GPU buffers and a dispatch sized by the device cannot be measured on a machine with no device, and must not be reported as passing there — `vfx-runtime` is the companion that needs none"
timeout_s = 7200
ci_job = "milestone-m10"

# --- Section 6: `tests/determinism/` stops being empty ---------------------------------------------
#
# M9's OWN GATE FOUND THE DIRECTORY EMPTY. `tests/CMakeLists.txt` says in as many words that the
# determinism kind "joins them at M9", `testing-and-quality` gives the row a location and a 10 s
# budget, and M9 put its determinism cases in `unit` and `integration` instead — a defensible reading
# of a taxonomy whose other rows are graded by COST, which left the one row graded by SUBJECT with
# nothing in it. Three criteria, and the third is the one that stops the kind from quietly emptying
# again: a taxonomy row nobody counts is a taxonomy row that can go back to zero.

[[criterion]]
id = "determinism-golden-replay"
describe = "**A GOLDEN REPLAY WITH COMMITTED HASHES, WHICH NOTHING IN THIS TREE DID BEFORE M10.** `src/replay/tests/test_bitexact.cpp` records and replays in one process, so a change in the simulation moves BOTH SIDES of its comparison at once and cannot notice. Three cases against bytes committed under `tests/determinism/golden/`: a session recorded TODAY encodes to the committed bytes; the committed replay reproduces the committed state hash AT EVERY TICK rather than at the end; and a replay from a build this one cannot reproduce is REFUSED rather than replayed, which is the difference between a golden file and a trap. It drives the engine's own `sim.h` — a real world, four participants, one command producer each, real state codecs — because a committed hash of a fixture invented in the test directory proves that addition is stable"
source = "tasks 6.4, testing-and-quality, simulation-and-determinism"
kind = "recipe"
run = "just test-determinism -R ^determinism.golden_replay$"
timeout_s = 7200
ci_job = "milestone-m10"

[[criterion]]
id = "determinism-fuzzing-and-saves"
describe = "REPLAY AND SAVE FUZZING AND THE TRANSACTIONAL SAVE TESTS, in the row `testing-and-quality` puts them in. The replay fuzzer's three cases are about what a reader must never do: a truncated replay is refused AT EVERY TRUNCATION with a reason; a corrupted byte NEVER yields a different log accepted as this one; and a file that is not a replay at all is reported Corrupt rather than as a mismatch — `classify()`'s rule from M9, fuzzed rather than asserted. Beside them the save fuzzer and `save_kill_nine`, the two suites written at M6 as `integration` and MOVED into this kind rather than copied here, because a module's suites are declared from the module in this tree and a second copy is a copy that drifts"
source = "tasks 6.4, testing-and-quality, save-and-persistence"
kind = "command"
# THREE ANCHORED INVOCATIONS AND NOT ONE ALTERNATION, AND THAT IS M6's LESSON RATHER THAN A STYLE
# CHOICE. `just`'s `*args` is interpolated TEXTUALLY into `bash -c`, so `-R 'a|b|c'` reaches bash
# with the pipes live; four of m6.toml's criteria were written that way, reported `exit 2` in 0.0 s
# having run no test, and sat in two permanent gates and a CI job for a milestone.
# `selftest.test_just_arguments` is the lint that now refuses it, and it refused this line first.
run = "just test-determinism -R ^determinism.replay_fuzz$ && just test-determinism -R ^determinism.save_fuzz$ && just test-determinism -R ^determinism.save_kill_nine$"
timeout_s = 7200
ci_job = "milestone-m10"

# AND THE COUNT, BECAUSE THE DEFECT THIS REPAIRS WAS AN EMPTY DIRECTORY THAT NOBODY'S CHECK NOTICED.
# `just test-determinism` over a kind with no suites in it is GREEN — `ctest` with a label nothing
# carries exits zero — which is precisely how the row stayed empty from M9 to M10 with a permanent
# gate running `test-all` the whole time. This criterion asks the taxonomy how many suites the kind
# has, and deleting them all turns it red instead of turning it quiet.
[[criterion]]
id = "determinism-kind-populated"
describe = "**THE DETERMINISM KIND HAS SUITES IN IT, AND THAT IS A CHECK RATHER THAN AN OBSERVATION.** `ctest` with a label nothing carries exits ZERO, so `just test-determinism` was green for the whole of M9 over an empty directory and no gate said a word. This counts the suites carrying the `determinism` label and requires at least four — the golden replay, the replay fuzzer, the save fuzzer and the kill-nine transactional test that `testing-and-quality`'s row enumerates"
source = "tasks 6.4, testing-and-quality, delivery-roadmap"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
suites=$(ctest --test-dir "$d" -L determinism -N 2>/dev/null | sed -nE 's/^ *Test +#[0-9]+: (.*)$/\1/p')
count=$(printf '%s\n' "$suites" | grep -c . || true)
echo "$count suite(s) carry the determinism label:"
printf '  %s\n' $suites
test "$count" -ge 4 || { echo "the determinism kind has fewer suites than testing-and-quality's row enumerates — a kind that empties is a kind that goes green by running nothing"; exit 1; }
'''
timeout_s = 7200
ci_job = "milestone-m10"

# --- Section 7: the artefact — samples/10-world ---------------------------------------------------
#
# ONE PROGRAM IN WHICH THE SEVEN THINGS M10 BUILT ARE WIRED TO EACH OTHER rather than each to its own
# suite, and it is the first target in the repository that names all seven. There is no CTest entry
# for it and that is deliberate: the picture needs a graphics device, and a suite that skipped on
# every machine without one would be a suite whose failure nobody would notice. So the artefact is
# checked the way `just capture-virtual-geometry` is — by criteria a person and a gate can run, split
# by what each needs.
#
#   world-artefact       needs NO device. Generate, cook, claim, place, simulate, and the crater that
#                        round-trips through the persistence overlay. This is the part that can run
#                        anywhere, and it is most of the claim.
#   world-seed-control   the negative control, and it is what makes the one above a measurement: the
#                        same seed twice gives the same world, and a DIFFERENT seed gives a different
#                        one. A capture that was accidentally constant would look exactly like a
#                        capture that was correct — the sample's own README says so and this is the
#                        check behind that sentence.
#   world-still          needs a device. Two runs at one seed draw the byte-identical still.
#   world-budget-curve   task 7.3's curve, measured across the cycle rather than asserted at one
#                        time of day.
#   world-frame-budget   and the honest verdict on it, which is a DECLARED GAP: it does not hold one.

[[criterion]]
id = "world-artefact"
describe = "**THE WORLD, WITH NO DEVICE AND NO CONTENT AT ALL** — no asset, no mesh and no texture anywhere in this artefact; the world is the seed. `cy::pcg` generates over regions, `cy::pcg-adapters` turns the accepted points into foliage CLUSTERS rather than entities, `cy::terrain` cooks the raster into tiles over three levels and CLAIMS `soil`, `cy::water` floats a spectral ocean and claims `water-depth`, `water-distance`, `water-flow` and `water-shore-wetness`, `cy::weather` builds a climate over terrain's own elevation and claims `wind`, `temperature`, `wetness`, `snow-depth` and fourteen more, `cy::foliage` READS the substrate and terrain's surface back out and plants tens of thousands, and `cy::rendering::sky` integrates the atmosphere. Then task 7.2: a crater stamped through `terrain::TerrainDeltaStore`, recorded into `world::PersistenceOverlay` as a subsystem blob, THE DELTA STORE CLEARED AND THE CRATER VERIFIED GONE, restored from the overlay alone, and every probe over its footprint compared bit for bit against the surface as it stood before the save. The program EXITS NON-ZERO if a probe disagrees or if none was compared, so this criterion is checking a check"
source = "tasks 7.1, 7.2, ROADMAP M10"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
out="$("$d/samples/10-world/cy_sample_world" --headless --seconds 4 --fps 4 --seed 0x10C0FFEE 2>&1)" || {
    echo "$out"; echo "the world did not build, or the persistence round trip failed"; exit 1; }
echo "$out"
echo "$out" | grep -q "=== the world, as its producers reported it ===" || {
    echo "the producers' report is not in the output: it has been removed or renamed"; exit 1; }
# `fields` rather than `weather`: the substrate's own line is where weather's work shows up in this
# report — 23 fields declared and 19 claimed by four different producers — and the hour lines below
# it carry the wind, the temperature and the snow. A module that stopped producing would drop the
# claimed count, which is the number this asks for.
for module in pcg terrain water foliage fields sky; do
    echo "$out" | grep -qE "^  $module " || { echo "$module reported nothing: it is no longer in this world"; exit 1; }
done
# THE NUMBER IS `%u claimed` AND NOTHING ELSE ON THAT LINE IS MEASURED: the word "four" beside it
# is a literal in the sample's own format string rather than a count of producers, so a criterion
# that matched on it would be asserting a constant. What is asked for is a claimed count above zero
# — a substrate every producer forgot to claim into would print `23 declared, 0 claimed`.
echo "$out" | grep -qE "^  fields +[0-9]+ declared, [1-9][0-9]* claimed" || {
    echo "no producer claimed a field: the substrate is declared and empty"; exit 1; }
echo "$out" | grep -q "m10 task 7.2: a crater that survives a save" || {
    echo "the persistence act is not in the output"; exit 1; }
echo "$out" | grep -qE "and 0 of [1-9][0-9]* probes over the crater disagree" || {
    echo "the crater did not round-trip bit for bit, or no probe was compared"; exit 1; }
echo "seven modules reported, and the crater round-tripped with every probe agreeing"
'''
timeout_s = 7200
ci_job = "milestone-m10"

# THE NEGATIVE CONTROL, AND IT IS THE REASON THE CRITERION ABOVE IS A MEASUREMENT.
#
# M9's `multiplayer-control` is the shape and design.md §1.6's sentence is the reason: "a check that
# cannot fail is not a check". A world that was accidentally CONSTANT — a generator whose seed reached
# nothing — would satisfy "two runs agree" perfectly and would satisfy nothing else. So both
# directions, in one criterion: the same seed reproduces the world, and a different seed does not.
#
# WALL-CLOCK MILLISECONDS ARE NORMALISED OUT AND NOTHING ELSE IS. The report prints how long each
# stage took, which is this host's number rather than this world's; every other figure — region and
# point counts, the program digest, tile counts, bytes resident, triangles, plants placed, the
# crater's depths and probe counts, the sky's integrated directions — is compared verbatim.
[[criterion]]
id = "world-seed-control"
describe = "**THE WORLD IS THE SEED, AND NOTHING ELSE — IN BOTH DIRECTIONS.** Two runs at one seed produce the identical report, figure for figure, with wall-clock milliseconds normalised out and nothing else touched; and a run at a DIFFERENT seed produces a different one. The second half is what makes the first a measurement rather than a tautology: a generator whose seed reached nothing would pass 'two runs agree' and fail nothing, which is precisely the accident a capture cannot be distinguished from by looking at it"
source = "tasks 7.1, design.md §1.6 (a check that cannot fail is not a check)"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
work="$(mktemp -d)"
trap 'rm -rf "$work"' EXIT
# TWO NORMALISATIONS, AND THE SECOND ONE IS A FINDING THIS CRITERION MADE ON ITS FIRST RUN. Wall
# clock is this host's number rather than this world's, so `123.4 ms` goes. And the budget line
# names WHICH FRAME WAS WORST — `(frame 1, sun +3.8 deg)` — which is chosen by the wall clock too:
# two runs of one seed duly picked frame 1 and frame 0 and the criterion reported "the world is not
# the seed" over a difference that is entirely the machine's. Both are normalised; every other
# figure, and there are dozens, is compared verbatim.
strip_timings() { sed -E 's/[0-9]+(\.[0-9]+)? ms/<ms>/g; s/\(frame [0-9]+, sun [-+0-9.]+ deg\)/(worst frame <n>)/g'; }
# BOTH SEEDS ARE VALID HEXADECIMAL AND THAT IS NOT A DETAIL. `--seed` refuses a value it cannot
# parse and exits 2; the sample's report then goes nowhere, the file is EMPTY, and an empty file
# differs from a populated one — so a mistyped control seed would make the negative half of this
# criterion pass by comparing a world against nothing. It is the exact shape of false green this
# criterion exists to refuse, so each run is required to have produced a report.
world() {
    "$d/samples/10-world/cy_sample_world" --headless --seconds 2 --fps 2 --seed "$2" \
        > "$work/$1.raw" || { cat "$work/$1.raw"; echo "the run at seed $2 did not complete"; exit 1; }
    strip_timings < "$work/$1.raw" > "$work/$1.txt"
    grep -q "the world, as its producers reported it" "$work/$1.txt" || {
        echo "the run at seed $2 produced no report"; exit 1; }
}
world a 0x5EED
world b 0x5EED
world other 0x0FFBEEF
if ! diff "$work/a.txt" "$work/b.txt"; then
    echo "two runs at one seed disagree: the world is not the seed"; exit 1
fi
figures=$(grep -cE '[0-9]' "$work/a.txt")
echo "two runs at seed 0x5EED agree on all $figures figure-bearing lines"
if diff -q "$work/a.txt" "$work/other.txt" > /dev/null; then
    echo "A DIFFERENT SEED PRODUCED THE IDENTICAL WORLD: the seed reaches nothing and the agreement above means nothing"
    exit 1
fi
echo "a different seed produced a different world ($(diff "$work/a.txt" "$work/other.txt" | grep -c '^<') line(s) differ)"
'''
timeout_s = 7200
ci_job = "milestone-m10"

[[criterion]]
id = "world-still"
describe = "**THE PICTURE IS A FUNCTION OF THE SEED TOO.** Two runs at one seed draw the byte-identical still on a device — which is the claim the committed `m10-world.png` rests on, and the one thing the headless criteria above cannot reach because they draw nothing. The still is written to a temporary path rather than over the committed file: a criterion that rewrote the artefact it is checking would always agree with itself"
source = "tasks 7.1, 7.4"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
work="$(mktemp -d)"
trap 'rm -rf "$work"' EXIT
# `--frames` AS WELL AS `--still`, AND THAT IS NOT BELT AND BRACES. `main.cpp` opens the graphics
# device only when `--frames` is given — `wants_pictures = !options.frames.empty() && !headless` —
# so `--still` ON ITS OWN RUNS THE WHOLE WORLD, WRITES NOTHING AND EXITS ZERO WITHOUT SAYING SO.
# This criterion was written that way first and reported "there is no device here after all" on a
# machine that has one. Four frames at 640x360 is a few megabytes, which is why the take is short.
for run in a b; do
    mkdir -p "$work/$run"
    "$d/samples/10-world/cy_sample_world" --frames "$work/$run" --still "$work/$run.png" \
        --seconds 2 --fps 2 --width 640 --height 360 --seed 0x5EED > "$work/$run.log" 2>&1 || {
        tail -20 "$work/$run.log"; echo "the take failed"; exit 1; }
    test -s "$work/$run.png" || { tail -20 "$work/$run.log"; echo "no still was drawn: no graphics device answered"; exit 1; }
done
one=$(sha256sum "$work/a.png" | cut -d" " -f1)
two=$(sha256sum "$work/b.png" | cut -d" " -f1)
echo "$one"
echo "$two"
test "$one" = "$two" || { echo "two runs at one seed drew different pictures"; exit 1; }
grep -E "vulkan validation errors" "$work/a.log" || true
echo "two runs at one seed drew the byte-identical still"
'''
requires = "gpu"
reason = "the still is drawn on a graphics device; on a machine with none the program reports which device it did not find and writes no frames, which must not read as a pass"
timeout_s = 7200
ci_job = "milestone-m10"

# TASK 7.3's OWN WORD IS "CURVE", AND IT IS THERE BECAUSE A MAXIMUM PRINTED IN A LOG IS EXACTLY THE
# ASSERTION THAT TASK IS WRITTEN TO REFUSE. This criterion checks that the measurement EXISTS and has
# the shape the task asks for — every frame, per producer, across a full day/night cycle with the sun
# actually crossing the horizon in it. Whether the curve is any GOOD is the criterion after it, and
# separating the two is the whole point: the measurement is real and the verdict is bad.
[[criterion]]
id = "world-budget-curve"
describe = "**THE ENVIRONMENT DEMO'S FRAME BUDGET IS MEASURED AS A CURVE ACROSS THE CYCLE, NOT ASSERTED AT ONE TIME OF DAY.** `--budget <csv>` writes every frame's cost per producer; this requires the CSV to be a curve rather than a population — many rows, one per frame — to carry a per-producer column for each of the seven modules, and to cover a full day/night cycle with the sun genuinely above the horizon in some rows and below it in others. A summary line printed at noon would satisfy none of those"
source = "tasks 7.3, ROADMAP M10"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
work="$(mktemp -d)"
trap 'rm -rf "$work"' EXIT
"$d/samples/10-world/cy_sample_world" --headless --seconds 8 --fps 8 --seed 0x5EED \
    --budget "$work/budget.csv" > "$work/run.log" 2>&1 || { tail -20 "$work/run.log"; exit 1; }
head -2 "$work/budget.csv"
python3 - "$work/budget.csv" <<'CHECK'
import csv, sys
rows = list(csv.DictReader(open(sys.argv[1], newline="")))
if len(rows) < 32:
    sys.exit(f"the budget has {len(rows)} row(s): that is a sample, not a curve across a cycle")
columns = set(rows[0])
sun = next((name for name in columns if "sun" in name.lower()), "")
if not sun:
    sys.exit(f"no column reports the sun's elevation, so nothing says this is a CYCLE: {sorted(columns)}")
elevations = [float(row[sun]) for row in rows]
if max(elevations) <= 0.0 or min(elevations) >= 0.0:
    sys.exit(f"the sun never crosses the horizon over the take ({min(elevations):.1f} to "
             f"{max(elevations):.1f} deg): this is a time of day, not a cycle")
# NOT `pcg`: generation runs once, before the take, and a per-frame column for it would be a
# column of zeros. Its cost is in the build report the artefact prints instead.
missing = [name for name in ("terrain", "water", "weather", "foliage", "sky")
           if not any(name in column.lower() for column in columns)]
if missing:
    sys.exit(f"the curve attributes no cost to {', '.join(missing)}: "
             f"a per-frame total is not a per-producer curve. Columns: {sorted(columns)}")
# BY PRIORITY AND NOT BY COLUMN ORDER, AND THIS CRITERION GOT IT WRONG FIRST. The CSV's first
# column is `frame` — the frame INDEX — and a search that accepted the first of
# ("frame_ms", "frame", "total_ms") to appear in the header duly reported "frame cost 0.0 to
# 63.0 ms" over a take of 64 frames. A cost column resolved to a counter is a measurement of
# nothing that looks exactly like a measurement.
frame = next((name for name in ("frame_ms", "total_ms", "frame") if name in columns), "")
costs = [float(row[frame]) for row in rows] if frame else []
print(f"{len(rows)} frames, {len(columns)} columns, sun from {min(elevations):.1f} to "
      f"{max(elevations):.1f} deg"
      + (f"; frame cost {min(costs):.1f} to {max(costs):.1f} ms" if costs else ""))
CHECK
'''
timeout_s = 7200
ci_job = "milestone-m10"

# THE VERDICT, AND IT IS A DECLARED GAP RATHER THAN A MISSING CRITERION.
#
# tasks.md 7.3 asks the environment demo to HOLD its frame budget across a full day/night cycle. It
# does not: about 122 ms mean and about 145 ms worst at 960x540, seven times a 60 Hz budget, nearly
# flat across the cycle. The three largest bands are the substrate re-sampled at every terrain vertex
# (63.0 ms — four `sample_deterministic()` calls at each of 152 000 vertices, every frame), the cloud
# march (23.2 ms — 6 384 `compose_sky()` calls a frame) and water's foam field, and ALL THREE ARE
# WORK A SHIPPING ENGINE WOULD DO IN A SHADER. They are the same three GPU debts six of M10's module
# READMEs record against their own rows, which is why the rung that closes this is the rung that
# writes `cy/field.slang` and a sky shader rather than a rung that optimises this loop.
#
# It is declared rather than omitted for `m8c:steam-audio-configures`' reason, and rather than
# softened into "the budget is measured" for M6's: a milestone that quietly restates a requirement it
# did not meet is doing the thing this ledger exists to prevent. `world-budget-curve` above is the
# measurement and passes; this is the budget and fails.
[[criterion]]
id = "world-frame-budget"
describe = "**THE ENVIRONMENT DEMO HOLDS ITS FRAME BUDGET ACROSS A FULL DAY/NIGHT CYCLE — AND IT DOES NOT.** Measured rather than asserted, which is what makes this a number instead of an opinion. With a device drawing, `just capture-world` at 960x540 measures about 122 ms mean and 145 ms worst; this criterion runs HEADLESS, so the submit-and-wait band is absent and it measures about 106 ms mean and 116 ms worst — SEVEN TIMES a 16.7 ms 60 Hz frame either way, which is the point. The three largest bands come out in the same order in both: the substrate re-sampled at every terrain vertex at 63.0 ms, the cloud march at 23.2 ms and water's foam field at 12.0 ms. The curve is nearly flat across the cycle and the only band that knows the time of day is the cloud march. This criterion asks for the worst frame of the take to be inside 16.7 ms and prints what it actually was, with the three bands beside it"
source = "tasks 7.3, ROADMAP M10 (the environment demo holds its frame budget)"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
work="$(mktemp -d)"
trap 'rm -rf "$work"' EXIT
"$d/samples/10-world/cy_sample_world" --headless --seconds 8 --fps 8 --seed 0x5EED \
    --budget "$work/budget.csv" > "$work/run.log" 2>&1 || { tail -20 "$work/run.log"; exit 1; }
grep -A 3 "task 7.3" "$work/run.log" || true
python3 - "$work/budget.csv" <<'CHECK'
import csv, sys
BUDGET_MS = 1000.0 / 60.0
rows = list(csv.DictReader(open(sys.argv[1], newline="")))
# BY PRIORITY AND NOT BY COLUMN ORDER: the CSV's first column is `frame`, the frame INDEX, and
# taking the first match in header order made this report the mean and maximum of a counter —
# 31.5 ms and 63.0 ms over a 64-frame take — which is a number-shaped nothing. `frame_ms` first.
frame = next((name for name in ("frame_ms", "total_ms") if name in rows[0]), "")
if not frame:
    sys.exit(f"no column reports the frame's cost: {sorted(rows[0])}")
costs = sorted(float(row[frame]) for row in rows)
mean = sum(costs) / len(costs)
worst = costs[-1]
# `producers_ms` is excluded because it is the SUM of the bands beside it: including it would
# report the total as the largest band and say nothing about where the time goes.
bands = {name: sum(float(row[name]) for row in rows) / len(rows)
         for name in rows[0] if name.endswith("_ms") and name not in (frame, "producers_ms")}
top = sorted(bands.items(), key=lambda pair: -pair[1])[:3]
print(f"{len(rows)} frames: {mean:.1f} ms mean, {worst:.1f} ms worst, against a {BUDGET_MS:.1f} ms "
      f"budget — {worst / BUDGET_MS:.1f}x over at the worst frame")
print("  the three largest bands: " + ", ".join(f"{name} {value:.1f} ms" for name, value in top))
sys.exit(0 if worst <= BUDGET_MS else 1)
CHECK
'''
known_gap = "the environment demo costs about 122 ms a frame against a 16.7 ms budget, and the three bands that make it are the substrate re-sampled at every terrain vertex, the cloud march and water's foam field — all three of them work a shipping engine would do in a shader. M10 shipped no `.slang` module for an environment field, a terrain material, a water surface, grass expansion or a cloud march, and six of its module READMEs record that gap against their own rows. This closes when those shaders exist, not by optimising the CPU loop"
known_gap_closes = "m11a"
timeout_s = 7200
ci_job = "milestone-m10"

# --- The committed pictures -----------------------------------------------------------------------
#
# RULE 14, AND EACH ONE SAYS WHICH KIND IT IS ON ITS OWN FACE — M8.c's gate found that a picture which
# does not say whether it is engine output or a drawing gets read as whichever of the two is more
# flattering.
#
# WHY THESE ARE `kind = "path"` AND M9's THREE WERE REGENERATED AND COMPARED. M9's figures are drawn
# from INTEGER counts — byte counts, rollback depths, substituted inputs — so a fresh run redraws
# them byte-identically and staleness is detectable. M10's two engine-output figures are not of that
# kind: `m10-world.png` is drawn ON A DEVICE, and `m10-world-budget.png` plots WALL-CLOCK
# MILLISECONDS from this host, which the sample's own README measures as moving 2.3 ms of mean and
# 6.6 ms of worst frame between six captures of one seed. A byte comparison would fail on a different
# GPU or a busier machine, and a pixel tolerance wide enough to survive both would not detect a
# changed curve either. So the determinism claim behind the picture is checked directly instead —
# `world-still` above compares two fresh stills to each other on whatever device is present, and
# `world-seed-control` compares the whole report — and these three criteria check that the committed
# files are there. Saying which half is covered is better than a comparison that pretends.
[[criterion]]
id = "screenshot-world"
describe = "THE ARTEFACT'S STILL: a generated world at 10:21, terrain shaded by soil and wetness and vegetation the substrate carries, a spectral ocean, snow on the windward hills and not on the ones behind them, and a cloud deck weather drives. ENGINE OUTPUT, drawn on a device by `just capture-world` from nothing but a seed — and the straight-edged slabs in the sky are the honest artefact of a 6 384-direction dome rather than a per-pixel cloud march, which the sample's README says on its own face"
source = "tasks 7.4"
