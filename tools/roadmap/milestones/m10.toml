# --- Section 0: what the spike could not answer on this host ---------------------------------------

[[criterion]]
id = "pcg-regeneration-cross-platform"
describe = "A CONTINUOUS-INTEGRATION JOB COMPARES ONE ARCHITECTURE'S GENERATED-REGION DIGEST WITH ANOTHER'S, AND GOES RED WHEN THEY DIFFER. The M10 spike measured, over 24 configurations and 12 trials, that a dependency-driven partial regeneration reproduces a full one bit for bit on ONE x86-64 host (design.md §1.1); it says nothing about a second architecture, and M9 §1.2 already measured that the engine's own math primitives move under `-march=native` with contraction at the compiler's default. **THE CHECK WAS A WORD-GREP AND M11.a's GATE SAID SO**: it asked for a job block mentioning a `pcg` word beside `download-artifact`, which a job that compares nothing satisfies by saying those words. It now RUNS the comparison job's own command over digests written for it — two architectures whose generated world differs must turn that command red, which requires the job to ask for the generation claim at all and not the simulation claim alone, and an empty world and a single leg must be refused rather than reported as agreement. WHETHER THE TWO ARCHITECTURES ACTUALLY AGREE IS NOT THIS CRITERION: that is `m11a:pcg-regenerates-across-architectures`, which carries `where = \"ci\"` because this host has one architecture. What is answerable here, on any host, is whether the job would notice"
source = "tasks 0.2, design.md §1.5"
kind = "command"
run = "python3 tools/ci/cross_leg_audit.py --claim pcg"
ci_job = "milestone-m10"

# IT NO LONGER CARRIES `where = "ci"`, AND THE REASON IS THAT THE CHECK CHANGED RATHER THAN THE HOST.
# `where = "ci"` was correct while the criterion's only hope was to be answered by a second
# architecture, and it is what let the word-grep sit unread on every developer's machine. What it
# asks now — does the comparison this workflow runs go red when two legs disagree? — needs a
# workflow, a shell and python3, all of which this host has. The claim that needs the second
# architecture is `m11a:pcg-regenerates-across-architectures` and it still carries its `where`.
#
# WHAT MUST BREAK IT: renaming `--pcg` in ci.yml leaves the job comparing the simulation hash and no
# longer the generated world, so two legs whose worlds differ pass it. `just roadmap-falsify` applies
# that mutation to a sandboxed copy of the tree and requires this criterion to go RED on it.
[criterion.falsifies]
mutate = "rename-token"
target = ".github/workflows/ci.yml"
token = "--pcg"
note = "the generation claim dropped from the comparison: the job still compares, and no longer compares this"

[[criterion]]
id = "pcg-gpu-domain-agreement"
describe = "A GPU EXECUTION DOMAIN REPRODUCES THE CPU DOMAIN'S OUTPUT FOR THE SAME SEED — AND THIS HOST HAS ONE GPU VENDOR, so an agreement measured here would be an agreement with one driver. `procedural-content-generation`'s execution domains include a GPU one, and the M10 spike's graph ran entirely on the CPU: nothing in design.md §1 measured a GPU domain at all. The check looks for the only shape that could close it: a continuous-integration job that runs the generation on two different GPU vendors and compares the digests. **THE CHECK WAS STRENGTHENED AT M11.a AND THE REASON IS THE WHOLE OF ITS VALUE**: it asked only that some job block mention `gpu`, a `pcg` word and `download-artifact`, and M11.a's cross-leg comparison job — which compares a CPU-domain digest between two ARCHITECTURES and no GPU domain at all — turned it green the moment its own comment explained why it does not answer this. A criterion a neighbouring job satisfies by mentioning the subject is a criterion that cannot fail. It now asks the job to NAME TWO GPU VENDORS, which is what running on two of them requires of a workflow"
source = "tasks 0.2, 4.1, design.md §1.5"
kind = "command"
run = '''
python3 - <<'CHECK'
import pathlib, re, sys

# TWO DIFFERENT GPU VENDORS, NAMED. A workflow cannot run on a vendor's driver without saying so —
# a hosted runner has no device at all, so the job has to name the runner label or the image that
# carries one — and requiring the NAME is what stops a job that merely discusses GPUs from
# satisfying a claim about two of them. The list is the vendors whose drivers a runner could carry.
VENDORS = ("nvidia", "amd", "radeon", "intel", "apple", "qualcomm", "adreno", "mali", "powervr")

workflows = sorted(pathlib.Path(".github/workflows").glob("*.y*ml"))
comparing = []
mentions = []
for path in workflows:
    text = path.read_text(encoding="utf-8")
    for block in re.split(r"\n(?=  [A-Za-z0-9_-]+:\n)", text):
        name = block.strip().split(":", 1)[0].strip()
        lowered = block.lower()
        if "gpu" not in lowered:
            continue
        if not re.search(r"\bpcg\b|procedural|generated-region", lowered):
            continue
        if "download-artifact" not in lowered:
            continue
        mentions.append(f"{path.name}:{name}")
        named = sorted({vendor for vendor in VENDORS if vendor in lowered})
        if len(named) >= 2:
            comparing.append(f"{path.name}:{name} ({', '.join(named)})")
print(f"{len(workflows)} workflow(s) examined; {len(mentions)} job(s) mention a GPU beside a "
      f"generated-region digest; {len(comparing)} of them name two vendors: {comparing or 'none'}")
if mentions and not comparing:
    print(f"  {', '.join(mentions)} mention(s) the subject and name(s) no two vendors' drivers.")
if not comparing:
    print("  no job runs procedural generation on a GPU on two vendors and compares the results, so")
    print("  'the GPU execution domain agrees with the CPU one' is UNMEASURED rather than met. A")
    print("  single-vendor comparison would answer a different question and must not read as green.")
    print("  TWO THINGS ARE ABSENT AND ONLY ONE IS A RUNNER QUESTION: `cy::pcg::ExecutionDomain` is")
    print("  Editor, Cook, Runtime, Streaming, Dynamic — there is no GPU domain in this tree to run")
    print("  — and no leg of ci.yml's matrices has a device. determinism.cross_leg's last case")
    print("  asserts the first of those and goes red the day a GPU domain is added.")
sys.exit(0 if comparing else 1)
CHECK
'''
where = "ci"
reason = "this host has one GPU vendor, so agreement measured here would be agreement with one driver rather than between two, and `requires = \"gpu\"` would make it RUN and PASS on exactly that evidence"
ci_job = "milestone-m10"
known_gap = "there is no GPU execution domain in this tree to compare. `cy::pcg::ExecutionDomain` is Editor, Cook, Runtime, Streaming and Dynamic — `procedural-content-generation`'s \"CPU and GPU execution\" requirement is discharged on the processor only — so the criterion needs TWO absent things and only one of them is a runner question: the domain itself, and two GPU vendors in a matrix whose hosted runners have no device at all. M11.a built the cross-leg comparison job that closed `m9:lockstep-cross-platform` and `m10:pcg-regeneration-cross-platform` and DELIBERATELY DID NOT ANSWER THIS ONE — `tools/ci/cross_leg_digests.py --gpu-domain` prints every leg's `pcg-gpu-domain` field and refuses. The forcing function for the first half is `determinism.cross_leg`'s last case, which asserts that no execution domain names a device and goes red the day one does"
known_gap_closes = "m11e"

# --- A GAP M10'S GATE FOUND, DECLARED RATHER THAN HIDDEN ------------------------------------------
#
# Found by the gate agent refuting "terrain, water and sky each reach Working ... and each is a
# producer into the substrate". Terrain and water survived: suppressing their `publish()` turned
# their suites red. Sky did not — its suite PASSED with the publish suppressed, because every
# substantive assertion read `stats()`, the producer's own in-memory summary, rather than the store.
#
# Strengthening the test then showed the claim is not merely unasserted but FALSE: twenty-five
# samples inside the radius all return the declared default while `stats()` reports a real shadow.
# The producer computes a cloud shadow and nothing readable reaches the substrate.

# --- WHAT M10'S CLOSING GATE MEASURED AGAINST THIS GAP, AND IT CONTRADICTS THE DIAGNOSIS ----------
#
# Nothing below is edited: the criterion runs, it fails, and a declared gap that started passing
# would fail the ledger. What is added is the measurement, because a record that asserts a cause the
# tree refutes is the defect `record-matches-plan` exists to catch, one level down.
#
# The gate instrumented the case itself — `store.tiles_of()` over both declared levels, the raw tile
# bytes, and a 65x65 sweep at 64 m — and found:
#
#   * the Regional level holds 4 tiles whose LOWEST RAW BYTE IS 28, and the Macro level 4 whose
#     lowest is 1. The shadow is in the store, quantised, where the producer said it wrote it.
#   * `CloudShadowField::sample(store, {960, 0, -1600})` returns 0.1098 — 28/255 — so the shadow is
#     READ BACK THROUGH THE SUBSTRATE by the same public sampler every consumer would use. The round
#     trip works; "nothing readable reaches the substrate" is not what the tree does.
#   * `sample()` at the origin reports `resolved = true`, level 1, 4 lattice reads, value 1.0. It
#     resolves a real tile and that tile really holds 255 there.
#   * 1089 samples at 32 m spacing across the whole 512 m radius all read exactly 1.0, and a profile
#     along +x out to 2560 m reads 1.0 at every step. The shade in this sky is OFF-AXIS, at a scale
#     set by the 16x16 weather map at 1000 m a texel: the 5x5 grid at 128 m the case walks is a
#     square of ground this particular sky leaves in full sun.
#
# So the case fails for the same class of reason the gap was written about — a probe that does not
# reach what it measures — one layer out. Proved by construction: widening ONLY the case's sampling
# (65x65 at 64 m, nothing else touched, no assertion relaxed) makes the line read
# `through the store: 4225 samples, lowest 0.109804, highest 1` and this criterion PASSES.
#
# M11 OWNS THE DECISION, and it is one of two, not a repair to slip in here: either the case samples
# where the field varies — at which point this gap is CLOSED and its declaration must be deleted in
# the same change, which is not a closing gate's call to make — or the gap is restated as what is
# actually unproven, that no CONSUMER (terrain, foliage, water, illumination) reads the field at all.
# `declare_consumers()` names those four and nothing in the tree opens a reader as any of them.

[[criterion]]
id = "sky-field-round-trip"
describe = "THE SKY COMPUTES A CLOUD SHADOW AND THE SUBSTRATE CANNOT SEE IT. `CloudShadowField::update` reports darkest < 0.5 and brightest > 0.9 over tiles it says it wrote, and `CloudShadowField::sample` returns the declared 1.0 at every point inside `radius_metres`. `atmosphere-sky-and-clouds` requires the shadow to be \"consumed by terrain, foliage, water, and illumination\", which is what reading it through the field is for; today none of them could. Terrain and water round-trip correctly through the same store, so this is the sky's write path and not the substrate's."
source = "M10 gate, claim 2; openspec/specs/atmosphere-sky-and-clouds/spec.md"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
# `-V` AND NOT `--output-on-failure`, AND THAT EDIT IS THE DIFFERENCE BETWEEN A CHECK AND A
# COINCIDENCE. The case PASSES today — the two assertions that would fail are commented out in
# test_cloud_shadows.cpp with a note saying they fail — so `--output-on-failure` printed nothing and
# this criterion failed with "the case did not run": the right verdict for the wrong reason, and one
# that would go on failing after the gap closed. Under `-V` the `through the store:` line the case
# prints either way is readable, and the numbers in it are what is judged.
out="$(ctest --test-dir "$d" -R '^integration.render_sky_fields$' -V 2>&1 || true)"
line="$(printf '%s\n' "$out" | grep -o 'through the store: .*' | head -1)"
test -n "$line" || { echo "the sky round-trip case did not run — it has been renamed or deleted"; exit 1; }
printf '%s\n' "$out" | grep -o 'broken cloud: .*' | head -1
echo "$line"
printf '%s\n' "$line" | python3 -c '
import re, sys
line = sys.stdin.read()
found = re.search(r"lowest ([0-9.eE+-]+), highest ([0-9.eE+-]+)", line)
if not found:
    sys.exit("the round-trip line no longer reports lowest and highest")
lowest, highest = float(found.group(1)), float(found.group(2))
if lowest >= 0.99 or highest - lowest <= 0.01:
    sys.exit(f"every sample inside the radius reads {lowest} against a declared default of 1.0, "
             f"with a spread of {highest - lowest}: the producer computes a cloud shadow and "
             f"nothing readable reaches the substrate")
print(f"the cloud shadow reaches the substrate: lowest {lowest}, spread {highest - lowest}")
'
'''
ci_job = "milestone-m10"

