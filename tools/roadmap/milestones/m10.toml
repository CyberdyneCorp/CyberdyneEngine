source = "tasks 4.2, ROADMAP M10 (a hand-placed override survives regeneration), design.md §1.4"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
filter='a moved tree stays moved across a regeneration of its region*,a felled tree does not return*,a locked instance survives a regeneration that no longer produces it*,an override whose instance is gone is an orphan*,a generator version change opens the spatial anchor*'
out="$("$d/cy_test_unit_pcg" "-tc=$filter" 2>&1)" || { echo "$out"; echo "the override cases FAILED"; exit 1; }
echo "$out" | tail -4
selected=$(printf '%s' "$out" | sed -nE 's/.*test cases: *([0-9]+) \|.*/\1/p' | head -1)
echo "the filter selected ${selected:-0} case(s) of the five it names"
test "${selected:-0}" -eq 5 || { echo "the named override cases are not in unit.pcg any more"; exit 1; }
'''
