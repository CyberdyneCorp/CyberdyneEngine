# --- The artefact, and the suites that photograph it --------------------------------------------------

# TASKS 6.4 AND 7.6, AND THE HALF OF 7.2 A GREP CANNOT REACH. This is the criterion that runs
# everywhere: it needs no GPU, no window and no Vulkan build, and it renders the MILESTONE'S OWN
# FRAME — samples/03-first-light's, through cy::sample-first-light — against a device that executes
# nothing. What it asserts is everything about a frame that is decided rather than drawn.
[[criterion]]
id = "render-null"
describe = "the artefact's frame compiles and records with no GPU at all: five passes then four, one submit, the barrier batches in the recorded stream equal to the number the plan derived, and two runs producing an identical plan hash and an identical command stream"
source = "tasks 6.4, 7.1, 7.2, 7.6, ROADMAP M3 (rendering identically through the null backend in continuous integration)"
kind = "recipe"
run = "just test-render -R null_frame"
ci_job = "render-device"

[[criterion]]
id = "xr-prerequisites"
describe = "the three deferred-scope checks tests/render/README.md has recorded since M0: two views are ONE submission of the geometry, the frame's inputs are arguments rather than a clock, and the view reaches submission through memory rather than through a re-recorded command"
source = "tasks 6.5, 7.7, ROADMAP M3 (the XR prerequisite checks pass)"
kind = "recipe"
run = "just test-render -R xr_prerequisites"
ci_job = "render-device"

# ONE BUILD DIRECTORY OF ITS OWN, AND CY_RENDERER_VULKAN=ON. The default build has the backend off
# — cmake/features.cmake, and M3 did not change that — so a criterion that needs a device has to
# configure a tree that has one. `${CY_BUILD_DIR:+...}` keeps a developer who redirects the build
# tree from configuring two profiles into one directory, which is m2.toml's finding E.
[[criterion]]
id = "conventions"
describe = "the conventions asserted FROM THE DEVICE: the depth buffer clears to 0, near maps to 1 and far to 0 as sampled back, the nearer surface wins whichever order the two are drawn in, a scene a million units out renders bit-identically to the same scene at the origin, and the axis conventions hold against rendered output rather than only against the arithmetic"
source = "tasks 5.1, 5.2, 5.3, 5.4, 7.5, ROADMAP M3 (camera-relative rendering and reversed-Z proven by test)"
kind = "command"
run = "d=\"${CY_BUILD_DIR:-build/vulkan}\"; CY_BUILD_DIR=\"$d\" just build-engine -D CY_RENDERER_VULKAN=ON && CY_BUILD_DIR=\"$d\" just test-render -R conventions"
timeout_s = 3600
requires = "gpu"
reason = "this host has no graphics device, and a convention sampled back off a device cannot be sampled back off nothing"
ci_job = "render-device"

[[criterion]]
id = "golden"
describe = "the golden images pass on Vulkan: the artefact's frame against its committed reference with zero validation errors, the same frame a million units out against THE SAME reference file, the shadow-off control against a different one, and the null backend deriving the same frame structure the device did"
source = "tasks 6.3, 7.1, 7.5, ROADMAP M3 (golden-image tests pass on Vulkan)"
kind = "command"
run = "d=\"${CY_BUILD_DIR:-build/vulkan}\"; CY_BUILD_DIR=\"$d\" just build-engine -D CY_RENDERER_VULKAN=ON && CY_BUILD_DIR=\"$d\" just test-render -R golden"
timeout_s = 3600
requires = "gpu"
reason = "this host has no graphics device, and a golden image cannot be photographed without one"
ci_job = "render-device"

[[criterion]]
id = "vulkan-frame"
describe = "a whole frame through the graph on a real device with the validation layers AND synchronisation validation on, producing zero validation errors — because a frame that renders but trips validation is not a frame that works"
source = "tasks 2.3.1, 2.3.3, ROADMAP M3"
kind = "command"
run = "d=\"${CY_BUILD_DIR:-build/vulkan}\"; CY_BUILD_DIR=\"$d\" just build-engine -D CY_RENDERER_VULKAN=ON && CY_BUILD_DIR=\"$d\" just test-smoke -R vulkan_frame"
timeout_s = 3600
requires = "gpu"
reason = "this host has no graphics device; the null backend runs the same derivation and is covered by render-null above"
ci_job = "render-device"

[[criterion]]
id = "sample-recipe"
describe = "just run-sample first-light runs the artefact through the workflow a contributor uses, rather than only through the test that links it — on the DEFAULT build, where the null backend is what answers"
source = "tasks 6.1, 6.2"
kind = "recipe"
run = "just run-sample first-light --frames 4"
ci_job = "render-device"

# --- Every profile, and the sanitizers ----------------------------------------------------------------

# ONE BUILD DIRECTORY PER PROFILE, EVEN WHEN CY_BUILD_DIR IS SET — m2.toml's finding E, restated
# because the failure it describes cost an agent an hour and would cost the next one the same.
[[criterion]]
id = "four-profiles"
describe = "all four profiles build clean and just test-all is green in each — including the render suites, which run in every profile because CY_ASSERT is compiled out of two of them and a graph invariant that was only an assertion would be no invariant at all there"
source = "tasks 7.8"
kind = "command"
run = "for p in debug dev profile release; do d=\"${CY_BUILD_DIR:+${CY_BUILD_DIR}/$p}\"; CY_BUILD_DIR=\"$d\" just build-engine --profile \"$p\" || exit 1; CY_BUILD_DIR=\"$d\" just test-all --profile \"$p\" || exit 1; done"
timeout_s = 28800
ci_job = "profiles"

[[criterion]]
id = "sanitizers-render"
describe = "AddressSanitizer and UndefinedBehaviorSanitizer are clean over every suite M3 added, and ThreadSanitizer over the one that records a frame from several job workers at once — which is where the parallel-recording defect was found"
source = "tasks 7.9"
kind = "command"
run = "for t in rhi render_graph render_ shader material; do just test-sanitize --sanitizer address,undefined --tests \"$t\" || exit 1; done && just test-sanitize --sanitizer thread --tests render_graph"
timeout_s = 14400
ci_job = "sanitizers"

[[criterion]]
id = "three-platforms"
describe = "build and test are green on Linux, Windows and macOS with M3's modules in the tree"
source = "ROADMAP M3, delivery-roadmap"
kind = "command"
run = "just env-doctor && just build-engine && just test-all"
where = "ci"
reason = "this host runs one operating system; the other two are built only by the CI matrix"
ci_job = "build-and-test"

# --- What comes next ---------------------------------------------------------------------------------

# `**` rather than `*`, for the reason recorded against M0's `m1-open`: `openspec archive` moves a
# closed change under `openspec/changes/archive/`, and a pattern that only matches an *open* change
# turns red on the day the next milestone closes — which is the one day this criterion should be
# most satisfied.
[[criterion]]
id = "m4-open"
describe = "the M4 change exists — open, or closed and archived — so the ladder continues deliberately"
source = "tasks 7.13"
kind = "path"
path = "openspec/changes/**/*m4*/proposal.md"
ci_job = "milestone-m3"
