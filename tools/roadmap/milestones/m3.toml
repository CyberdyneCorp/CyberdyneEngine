# TASK 7.2 LIVES HERE. `just quality-layers` runs three source-level rules and their negative
# fixtures: the layer order, the `gpuapi` rule (no Vulkan, Slang or SPIR-V header above
# src/backends/), and the `barriers` rule — no barrier-emitting symbol outside src/backends/rhi/ and
# src/rendering/graph/. The fixtures are what make it a gate rather than a grep that has stopped
# firing: each violation is introduced deliberately and the check must reject it.
#
# The RUNTIME half of the same invariant is `render-null` below, which counts the barrier batches in
# a recorded command stream and requires the number to equal the number the compiled plan derived —
# so no barrier reached the stream from outside the graph either.
[[criterion]]
id = "layering"
describe = "the layer order holds, no Vulkan/Slang/SPIR-V header appears above src/backends/, and NO BARRIER CALL EXISTS OUTSIDE THE RENDER GRAPH — each proven by introducing one and requiring the check to reject it"
source = "tasks 7.2, ROADMAP M3 (a grep-level check finds no barrier call outside the render graph)"
kind = "recipe"
run = "just quality-layers"
ci_job = "layering"

