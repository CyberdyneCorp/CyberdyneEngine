# --- The artefact, and the suites that photograph it --------------------------------------------------

# TASKS 6.4 AND 7.6, AND THE HALF OF 7.2 A GREP CANNOT REACH. This is the criterion that runs
# everywhere: it needs no GPU, no window and no Vulkan build, and it renders the MILESTONE'S OWN
# FRAME — samples/03-first-light's, through cy::sample-first-light — against a device that executes
# nothing. What it asserts is everything about a frame that is decided rather than drawn.
[[criterion]]
id = "render-null"
describe = "the artefact's frame compiles and records with no GPU at all: five passes then four, one submit, the barrier batches in the recorded stream equal to the number the plan derived, and two runs producing an identical plan hash and an identical command stream"
source = "tasks 6.4, 7.1, 7.2, 7.6, ROADMAP M3 (rendering identically through the null backend in continuous integration)"
kind = "command"
run = """
set -e
d="${CY_BUILD_DIR:-build/dev}"
# THE BODY BUILDS FIRST, AND IT DID NOT UNTIL M11.c's CLOSING ROUND. Without this line the
# criterion runs `ctest` over whatever binary the build tree already holds, so a mutation of the
# source it is about never reaches the artefact under test — and `prove --mutate-the-tree` correctly
# reported that such a criterion "cannot go red" while the behaviour it names was genuinely broken.
# `m3:golden` and `m3:conventions` have always built first; this one did not. On a warm tree it is a
# no-op check, and on a cold one it is the difference between judging this tree and judging the last.
just build-engine --profile dev > /dev/null
ctest --test-dir "$d" -N -R '^render.null_frame$' 2>/dev/null | grep -q 'render.null_frame' || {
    echo "render.null_frame is not registered in $d — the suite has been renamed or deleted, or this tree"
    echo "was configured with no rendering backend. Either way the behaviour is UNMEASURED, and"
    echo "just test-render passes --no-tests=ignore, so it would report running nothing as a pass."
    exit 1
}
just test-render -R '^render.null_frame$'
"""
ci_job = "render-device"

# THE MUTATION TAKES THE HOST BOUNDARY OUT OF THE FRAME, WHICH IS WHAT THIS CRITERION COUNTS.
# The sample's last pass reads the readback buffer and writes nothing, so `.side_effect()` is the
# only thing that keeps a render graph from culling it — the sample's own comment beside it says
# exactly that, and says the declaration is what makes the graph emit the transfer-to-host barrier.
# Delete it and the "host read" pass is culled, and the "colour readback" pass that feeds it goes
# with it, so `passes_recorded` falls off 5 and `passes_culled` rises off 0. It compiles: the
# builder's return value is discarded at every other call site in this file too.
#
# `.read(shadow, Access::FragmentSampledRead)` WAS DECLARED FIRST AND THE PROVER REFUTED IT — "the
# criterion still PASSES with 1 file(s) mutated". Written down rather than quietly replaced: the
# reasoning was that the shadow pass would be culled once nothing consumed its output, and it was
# wrong, because the forward pass still WRITES the colour target the readback consumes and the
# shadow attachment is still written by a pass the compiler keeps. The lesson generalises — a
# mutation aimed at a pass the graph might cull has to be aimed at the pass the graph culls FIRST.
[criterion.falsifies]
mutate = "delete-lines"
target = "samples/03-first-light/renderer.cpp"
token  = ".side_effect();"
note   = "the mechanism: `side_effect()` is the only reason a pass that reads and does not write survives compilation, so with it gone the graph culls the host-read pass and the readback pass behind it, and `render.null_frame`'s first case fails on the pass counts it asserts. The verdict recorded in falsifiability.toml is the prover's own observation of that against a built tree; this note is the argument for the target and not a substitute for the measurement. The suite needs no device, so the red reproduces on every machine."

[[criterion]]
id = "xr-prerequisites"
describe = "the three deferred-scope checks tests/render/README.md has recorded since M0: two views are ONE submission of the geometry, the frame's inputs are arguments rather than a clock, and the view reaches submission through memory rather than through a re-recorded command"
source = "tasks 6.5, 7.7, ROADMAP M3 (the XR prerequisite checks pass)"
kind = "command"
run = """
set -e
d="${CY_BUILD_DIR:-build/dev}"
# THE BODY BUILDS FIRST, AND IT DID NOT UNTIL M11.c's CLOSING ROUND. Without this line the
# criterion runs `ctest` over whatever binary the build tree already holds, so a mutation of the
# source it is about never reaches the artefact under test — and `prove --mutate-the-tree` correctly
# reported that such a criterion "cannot go red" while the behaviour it names was genuinely broken.
# `m3:golden` and `m3:conventions` have always built first; this one did not. On a warm tree it is a
# no-op check, and on a cold one it is the difference between judging this tree and judging the last.
just build-engine --profile dev > /dev/null
ctest --test-dir "$d" -N -R '^render.xr_prerequisites$' 2>/dev/null | grep -q 'render.xr_prerequisites' || {
    echo "render.xr_prerequisites is not registered in $d — the suite has been renamed or deleted, or this tree"
    echo "was configured with no rendering backend. Either way the behaviour is UNMEASURED, and"
    echo "just test-render passes --no-tests=ignore, so it would report running nothing as a pass."
    exit 1
}
just test-render -R '^render.xr_prerequisites$'
"""
ci_job = "render-device"

# ONE BUILD DIRECTORY OF ITS OWN, AND CY_RENDERER_VULKAN=ON. The default build has the backend off
# — cmake/features.cmake, and M3 did not change that — so a criterion that needs a device has to
# configure a tree that has one. `${CY_BUILD_DIR:+...}` keeps a developer who redirects the build
# tree from configuring two profiles into one directory, which is m2.toml's finding E.
# THE MUTATION STOPS THE MULTIVIEW MASK REACHING THE RECORDED COMMAND, WHICH IS THE CLAIM.
# "Two views are ONE submission of the geometry" is observable only in what the submission carries:
# one rendering scope, one draw, two layers and a mask with two bits in it. The null backend is the
# production code that carries `RenderingInfo::view_mask` into that stream, and with the assignment
# gone the recorded mask keeps its zero default — one scope and one draw still, but no second view.
# The case then fails on `popcount_of(mask) == 2` and on nothing else, which is the half of the
# claim this mutation is aimed at. It compiles: the field is default-initialised.
[criterion.falsifies]
mutate = "delete-lines"
target = "src/backends/rhi/null/src/null_command_buffer.cpp"
token  = "command.d = info.view_mask;"
note   = "a renderer that looped over the eyes would record two scopes and two draws and fail this case already; what nothing else catches is a single submission that reaches the device naming ONE view. This deletes the line that carries the second one, and leaves the scope and draw counts the case also asserts untouched, so the red names the multiview mask rather than the frame."

[[criterion]]
id = "conventions"
describe = "the conventions asserted FROM THE DEVICE: the depth buffer clears to 0, near maps to 1 and far to 0 as sampled back, the nearer surface wins whichever order the two are drawn in, a scene a million units out renders bit-identically to the same scene at the origin, and the axis conventions hold against rendered output rather than only against the arithmetic"
source = "tasks 5.1, 5.2, 5.3, 5.4, 7.5, ROADMAP M3 (camera-relative rendering and reversed-Z proven by test)"
kind = "command"
run = """
set -e
d="${CY_BUILD_DIR:-build/dev}"
CY_BUILD_DIR="$d" just build-engine -D CY_RENDERER_VULKAN=ON > /dev/null
ctest --test-dir "$d" -N -R '^render.conventions$' 2>/dev/null | grep -q 'render.conventions' || {
    echo "render.conventions is not registered in $d — the suite has been renamed or deleted, or this tree"
    echo "was configured with no rendering backend. Either way the behaviour is UNMEASURED, and"
    echo "just test-render passes --no-tests=ignore, so it would report running nothing as a pass."
    exit 1
}
just test-render -R '^render.conventions$'
"""
timeout_s = 3600
requires = "gpu"
reason = "this host has no graphics device, and a convention sampled back off a device cannot be sampled back off nothing"
ci_job = "render-device"

# THE MUTATION IS ONE ENTRY OF THE REVERSED-Z PROJECTION, WHICH IS THIS CRITERION'S SUBJECT.
# `perspective_reversed_z` builds its matrix from `Mat4::zero()`, so deleting the m(2,3) assignment
# leaves that entry at zero and the depth mapping stops sending the near plane to 1 and the far
# plane to 0 — the exact sentence `core-math`'s header states and this suite samples back out of a
# real depth buffer. It compiles, and it is deliberately NOT the m(3,2) = -1 line, which would make
# every point fail the perspective divide and turn the suite red for a reason no reader could tell
# from a broken camera.
[criterion.falsifies]
mutate = "delete-lines"
target = "src/core/math/src/projection.cpp"
token  = "m.at(2, 3) = far_plane * near_plane / span;"
note   = "the reversed-Z cases render a triangle at the near plane and one at the far plane and read the depth buffer back; with this entry zero the projection no longer separates them the way the convention says. The camera-relative and axis-convention cases in the same suite are left alone by it, so the red is attributable to the convention this mutation breaks."

[[criterion]]
id = "golden"
describe = "the golden images pass on Vulkan: the artefact's frame against its committed reference with zero validation errors, the same frame a million units out against THE SAME reference file, the shadow-off control against a different one, and the null backend deriving the same frame structure the device did"
source = "tasks 6.3, 7.1, 7.5, ROADMAP M3 (golden-image tests pass on Vulkan)"
kind = "command"
run = """
set -e
d="${CY_BUILD_DIR:-build/dev}"
CY_BUILD_DIR="$d" just build-engine -D CY_RENDERER_VULKAN=ON > /dev/null
ctest --test-dir "$d" -N -R '^render.golden$' 2>/dev/null | grep -q 'render.golden' || {
    echo "render.golden is not registered in $d — the suite has been renamed or deleted, or this tree"
    echo "was configured with no rendering backend. Either way the behaviour is UNMEASURED, and"
    echo "just test-render passes --no-tests=ignore, so it would report running nothing as a pass."
    exit 1
}
just test-render -R '^render.golden$'
"""
timeout_s = 3600
requires = "gpu"
reason = "this host has no graphics device, and a golden image cannot be photographed without one"
ci_job = "render-device"

# THE MUTATION CHANGES THE PICTURE WITHOUT CHANGING ANYTHING ELSE, which is what a golden-image
# criterion has to be able to notice. `Sun::ambient` defaults to 0.03 and this scene sets 0.10;
# deleting the assignment leaves the default, every shadowed texel darkens, and the committed
# reference no longer matches within `kChannelTolerance`. Nothing else moves: the same passes, the
# same draws, the same command stream, the same resolution. Truncating the reference PNG was the
# other candidate and is weaker — it would prove only that the criterion opens the file.
[criterion.falsifies]
mutate = "delete-lines"
target = "samples/03-first-light/scene.cpp"
token  = "sun_.ambient = 0.10F;"
note   = "the claim is that the artefact's frame is compared against a committed reference rather than against itself; a shading change the reference does not have is the mutation that separates those two. `golden.h`'s tolerance is two 8-bit steps and the ambient term moves the shadowed texels by far more than that, so the difference is a shading result rather than a rounding."

[[criterion]]
id = "vulkan-frame"
describe = "a whole frame through the graph on a real device with the validation layers AND synchronisation validation on, producing zero validation errors — because a frame that renders but trips validation is not a frame that works"
source = "tasks 2.3.1, 2.3.3, ROADMAP M3"
kind = "command"
run = "d=\"${CY_BUILD_DIR:-build/vulkan}\"; CY_BUILD_DIR=\"$d\" just build-engine -D CY_RENDERER_VULKAN=ON && CY_BUILD_DIR=\"$d\" just test-smoke -R vulkan_frame"
timeout_s = 3600
requires = "gpu"
reason = "this host has no graphics device; the null backend runs the same derivation and is covered by render-null above"
ci_job = "render-device"

[[criterion]]
id = "sample-recipe"
describe = "just run-sample first-light runs the artefact through the workflow a contributor uses, rather than only through the test that links it — on the DEFAULT build, where the null backend is what answers"
source = "tasks 6.1, 6.2"
kind = "recipe"
run = "just run-sample first-light --frames 4"
ci_job = "render-device"

# --- Every profile, and the sanitizers ----------------------------------------------------------------

# ONE BUILD DIRECTORY PER PROFILE, EVEN WHEN CY_BUILD_DIR IS SET — m2.toml's finding E, restated
# because the failure it describes cost an agent an hour and would cost the next one the same.
[[criterion]]
id = "four-profiles"
describe = "all four profiles build clean and just test-all is green in each — including the render suites, which run in every profile because CY_ASSERT is compiled out of two of them and a graph invariant that was only an assertion would be no invariant at all there"
source = "tasks 7.8"
kind = "command"
run = '''
python3 tools/roadmap/matrix.py build debug-default dev-default profile-default release-default || exit 1
for p in debug dev profile release; do
    d="$(python3 tools/roadmap/matrix.py path "$p-default")"
    CY_BUILD_DIR="$d" just build-editor --profile "$p" || exit 1
    CY_BUILD_DIR="$d" just test-all --profile "$p" || exit 1
done
'''
timeout_s = 28800
ci_job = "profiles"
# WHAT IT HOLDS WHILE IT RUNS, declared rather than derived: the four matrix rows, and Cargo.
needs = ["build:ledger-matrix/debug-default", "build:ledger-matrix/dev-default",
         "build:ledger-matrix/profile-default", "build:ledger-matrix/release-default", "cargo"]

[criterion.falsifies]
mutate = "delete-lines"
target = "samples/07-fidelity/frame.cpp"
token  = "const volatile f32 fov_y = kShotFovY;"
note   = "deleting the run-time read of the shot's field of view (the line that made render.virtual_geometry_shaded agree across profiles in M11.c) leaves `shot_world_to_clip` naming an undeclared variable, so every profile's build fails and the matrix build exits red before the loop starts. Every mutation verb subtracts, so none can reproduce the release-only fold on its own: a subtraction that still compiles in this file changes every profile alike. The mutation therefore shows the criterion's exit code carries a per-profile build failure; the release-only class itself is held by unit.fidelity_shot_projection, which this criterion runs in all four profiles."

[[criterion]]
id = "sanitizers-render"
describe = "AddressSanitizer and UndefinedBehaviorSanitizer are clean over every suite M3 added, and ThreadSanitizer over the one that records a frame from several job workers at once — which is where the parallel-recording defect was found"
source = "tasks 7.9"
kind = "command"
run = "for t in rhi render_graph render_ shader material; do just test-sanitize --sanitizer address,undefined --tests \"$t\" || exit 1; done && just test-sanitize --sanitizer thread --tests render_graph"
timeout_s = 14400
ci_job = "sanitizers"

[[criterion]]
id = "three-platforms"
describe = "build and test are green on Linux, Windows and macOS with M3's modules in the tree"
source = "ROADMAP M3, delivery-roadmap"
kind = "command"
run = "just env-doctor && just build-engine && just test-all"
where = "ci"
reason = "this host runs one operating system; the other two are built only by the CI matrix"
ci_job = "build-and-test"

# --- What comes next ---------------------------------------------------------------------------------

# `**` rather than `*`, for the reason recorded against M0's `m1-open`: `openspec archive` moves a
# closed change under `openspec/changes/archive/`, and a pattern that only matches an *open* change
# turns red on the day the next milestone closes — which is the one day this criterion should be
# most satisfied.
[[criterion]]
id = "m4-open"
describe = "the M4 change exists — open, or closed and archived — so the ladder continues deliberately"
source = "tasks 7.13"
kind = "path"
path = "openspec/changes/**/*m4*/proposal.md"
ci_job = "milestone-m3"
