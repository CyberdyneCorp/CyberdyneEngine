# --- The RHI and the render graph -------------------------------------------------------------------

[[criterion]]
id = "rhi"
describe = "the explicit RHI: devices, queues, command buffers, resources, pipelines, and a capability model that is queried rather than assumed — over the null backend, which was written first so that the RHI is an interface rather than a wrapper (design.md §1)"
source = "tasks 2.1.1, 2.1.2, 2.1.3, ROADMAP M3 (rhi-and-render-graph)"
kind = "recipe"
run = "just test-unit -R rhi"
ci_job = "render-frame"

[[criterion]]
id = "render-graph"
describe = "passes declare reads and writes and the graph derives everything else: barriers, transient aliasing, pass scheduling, culling, async compute, parallel recording and the resource lifetime"
source = "tasks 2.2.1 to 2.2.8, ROADMAP M3 (automatic barriers, aliasing and scheduling)"
kind = "recipe"
run = "just test-unit -R render_graph"
ci_job = "render-graph"

# TASK 7.3. The measurement and its control are one test rather than two builds:
# `CompileOptions::enable_aliasing` is a compile-time option of the PLAN, so the same process can
# derive both and compare, and the figure the plan reports is the figure the device reserves.
[[criterion]]
id = "aliasing"
describe = "transient aliasing measurably reduces peak GPU memory against a no-aliasing plan, and the alias-edge ordering that makes it sound across queues is checked with it"
source = "tasks 7.3, ROADMAP M3 (transient aliasing reduces peak GPU memory measurably)"
kind = "recipe"
run = "just test-integration -R render_graph_scale"
ci_job = "render-graph"

# --- The shader pipeline ------------------------------------------------------------------------------

[[criterion]]
id = "shaders"
describe = "the compilation pipeline, permutations and specialization, reflection-driven binding, the shader library and its tiered cache, global parameters and diagnostics — all of it exercised with CY_SHADER_SLANG off, over the SPIR-V passthrough, which is the shipping path rather than a stub"
source = "tasks 3.1 to 3.8, ROADMAP M3 (shader-system)"
kind = "recipe"
run = "just test-unit -R shader"
ci_job = "shader-pipeline"

# TASK 7.4. Hot reload is M2's carried-forward debt 1.4 and M3's first consumer of it: the watcher
# reports a change only after it has held the same fingerprint for the settle period, which is what
# stops a half-written shader being compiled.
[[criterion]]
id = "hot-reload"
describe = "a shader edit reaches a built pipeline without a restart: the watcher notices, the module recompiles, and exactly the pipeline states that named the rebuilt program are invalidated"
source = "tasks 3.5, 7.4, ROADMAP M3 (shader hot reload replaces a material's shader without a restart)"
kind = "recipe"
run = "just test-integration -R shader_pipeline"
ci_job = "shader-pipeline"

