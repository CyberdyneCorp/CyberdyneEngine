# M3 — First light: the exit criteria, as data. Task 7.10.
#
# The sources are section 7 of openspec/changes/implement-m3-first-light/tasks.md and the M3 row of
# docs/ROADMAP.md; every criterion below names which. `delivery-roadmap` requires each to be a
# recipe that exits zero, a test that passes, a benchmark within a threshold, or a committed
# artefact that is regenerated and compared — so an intention that cannot be run is a note at the
# bottom of this file, not a criterion.
#
# `ci_job` names the gate in tools/roadmap/gates.toml under which continuous integration runs the
# criterion. It is required on every criterion, including the ones this machine can evaluate: a
# criterion that passes locally and runs nowhere else is not a gate. A criterion that cannot be
# evaluated on the host running the recipe — another operating system, no display, NO GPU — carries
# a `reason`, is reported as not evaluated rather than as passed, and is counted separately.
#
# `requires = "gpu"` is new at this milestone and is the honest half of a rendering ledger: the
# conventions sampled back off a device and the golden images cannot be evaluated without one, and
# a milestone recipe that quietly skipped them would report M3 green on exactly the machines least
# able to judge it. criteria.py's `_has_gpu()` is the probe and `CY_HAS_GPU` overrides it.
#
# M2's, M1's and M0's criteria are evaluated by this recipe too, for the reason m1.toml records: a
# later milestone may not break an earlier milestone's gate, and the way to keep that true is for the
# closing recipe to run it rather than for a reviewer to remember it. The runner merges the whole
# ladder below this milestone into one flat, deduplicated set; nothing in this file re-runs another
# milestone's recipe. See the section below.

schema = 1
id = "m3"
name = "First light"
artefact = "samples/03-first-light — a lit, textured, shadowed scene with a moving camera, rendered through the render graph, photographed by golden images and compiled identically through the null backend with no GPU"

# Non-binding, because none can be settled by running something. `delivery-roadmap` requires a
# criterion that cannot be evaluated by a machine to be restated as a check or moved here.
notes = [
    "tasks 7.10 — `just roadmap-milestone m3` is this recipe, so it cannot be one of the criteria it evaluates.",
    "tasks 7.11 — docs/roadmap/status.yaml and docs/roadmap/capability-matrix.md are corrected where M3 recorded an intention the implementation changed, and record what is thinner than the tasks claim. `roadmap-tiers` below checks the record; no tool can tell an intention from its correction.",
    "tasks 7.12 — archiving this change happens after this recipe passes, so it cannot be one of the criteria it must satisfy.",
    "tasks 7.13 — opening the M4 change is `m4-open` below, which asks only that the change exists. Whether its named spike is the right one is a judgement.",
    "ROADMAP M3, 'the null backend records the same graph' — checked as STRUCTURE rather than as a plan hash, in render.golden's fourth case: passes, culls, submits, barriers, barrier batches, ownership transfers, draws and triangles all agree between the two backends. The plan HASHES differ and should: `CompiledGraph::plan_hash` covers every placement offset, and a placement offset comes from the device's own memory requirements, which a synthetic allocator's alignments are not. Claiming hash equality across backends would have been claiming something false.",
    "ROADMAP M3, 'a scene one million units from the origin renders without visible precision loss' — render.golden's second case compares the far scene against THE SAME reference file as the near one, so the claim asserted is bit-identity rather than 'no visible loss'. render.conventions makes the same claim off the depth buffer. Both need a device and both carry requires = 'gpu'.",
    "THE ARTEFACT DOES NOT OPEN A WINDOW, and this is a real gap rather than a choice. `DisplayServer::create_surface(GraphicsApi::Vulkan, ...)` exists and works (task 2.3.2) and `SwapchainDescription` takes the surface it produces — but `cy::rhi::Device` exposes no way to obtain the API instance a surface must be created against: `native_handle()` returns the VkDevice and the VkInstance stays inside src/backends/rhi/vulkan/. So a host can create a window and a device and cannot join them. samples/03-first-light renders offscreen and writes a PPM with --capture. Closing it is a small accessor on the RHI in engine-owned terms; it belongs to whoever owns src/backends/rhi/ and it is recorded here rather than worked around.",
    "THE XR FRAME-TIMING SEAM IS HALF OPEN. render.xr_prerequisites checks the half a renderer can violate — the frame's inputs are arguments and no clock reaches it, proved by a byte-identical command stream across two renders separated by other work. The half that is NOT open is `cy::Runtime::tick()`, which takes no predicted display time, so a host cannot yet tell the engine when a frame will be displayed. tests/render/README.md and the case's own comment say so; it is small today and gets expensive once anything downstream reads the runtime's clock instead.",
    "GOLDEN IMAGES ARE NOT A CONTINUOUS-INTEGRATION GATE and the `render-device` gate says which suites it actually runs where. A committed reference is a photograph of one implementation; a hosted runner has no GPU and the default build has CY_RENDERER_VULKAN off, so what runs there is render.null_frame and render.xr_prerequisites — everything about the frame that is decided rather than drawn. The golden images are evaluated on a machine with a device, which is what `requires = 'gpu'` records.",
    "tasks 7.9 — the nightly sanitizer schedule exists (ci.yml's `sanitize-nightly`); `sanitizers-render` below is the pull-request half over M3's own suites.",
    "The gate set this milestone's criteria join on close is tools/roadmap/gates.toml; `just roadmap-gates` prints it. M3 adds render-graph, render-frame, render-device and shader-pipeline to it.",
]

# --- What M3 must not have broken -----------------------------------------------------------------
#
# No criterion, deliberately. M2's criteria — and every earlier milestone's — are in the permanent
# set, and `just roadmap-milestone m3` evaluates that set directly, once and deduplicated, before it
# reaches the criteria below. `criteria.build_plan` is the rule; `gates.toml` is where a milestone
# says its criteria have joined the set, by carrying `state = "green"`.
#
# This file used to open with an `m2-green` criterion running `just roadmap-milestone m2`, and that
# is how the ladder chained: M4's ledger ran M3's, which ran M2's, which ran M1's, which ran M0's.
# One run of M4's ledger was then 118 criterion evaluations over 91 distinct checks — 27 of them
# re-running something another ledger had already run — with `four-profiles`, a full
# four-configuration build and test, executed four times because four ledgers declared it, and every
# criterion's failure probability multiplied by the number of ledgers naming it. The same run is now
# 87 evaluations, one per distinct check. The rule the criterion enforced is unchanged and is still
# enforced; the nesting is what went. See openspec/changes/implement-m5-authorable, delivery-roadmap.

