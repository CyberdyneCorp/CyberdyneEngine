note   = "THE SAME MUTATION EVERY LEDGER'S `workflows` CRITERION TAKES, because every ledger runs the same `just ci-check` and the thing it guards is the same: a permanent gate whose commands no job in .github/workflows/ runs. Deleting the layering gate's command from every job is exactly that drift, and it is the smallest edit that produces it. Carried across from m11b.toml, which earned it first; the alternatives m11b rejected are rejected here for its reasons — deleting a whole job file makes the recipe red for a missing file rather than for the drift, and deleting the gate from gates.toml makes the two agree again, which is green."

