         "build:ledger-matrix/profile-default", "build:ledger-matrix/release-default", "cargo"]

[criterion.falsifies]
mutate = "delete-lines"
target = "samples/07-fidelity/frame.cpp"
token  = "const volatile f32 fov_y = kShotFovY;"
note   = "deleting the run-time read of the shot's field of view (the line that made render.virtual_geometry_shaded agree across profiles in M11.c) leaves `shot_world_to_clip` naming an undeclared variable, so every profile's build fails and the matrix build exits red before the loop starts. Every mutation verb subtracts, so none can reproduce the release-only fold on its own: a subtraction that still compiles in this file changes every profile alike. The mutation therefore shows the criterion's exit code carries a per-profile build failure; the release-only class itself is held by unit.fidelity_shot_projection, which this criterion runs in all four profiles."

# --- Section 1: the two backends, moved here from M11.d sections 2 and 3 --------------------------
#
# These three criteria are M11.d's, word for word, carried across rather than rewritten: the claim
# did not change, the machine that can judge it did. m11d.toml's own header records the move from
# the other side so neither file can be read as the whole story.

[[criterion]]
id = "metal-backend-is-native"
describe = "`src/backends/rhi-metal/` compiles and runs as a NATIVE backend rather than a translation layer. The check builds the backend, passes its RHI conformance suites, and renders the committed golden scene through native MSL and Metal argument buffers. Hosted CI still cannot claim Apple-family tile memory or Tier 2 argument buffers; the checked-in M3 Pro ledger supplies that hardware evidence separately and names the device that answered"
source = "tasks 1, rhi-and-render-graph, moved from m11d tasks 2"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
pattern='^(integration.rhi_metal|integration.rhi_metal_shader|integration.rhi_metal_surface|render.golden_backends)$'
registered=$(ctest --test-dir "$d" -N -R "$pattern" 2>/dev/null | grep -c 'Test *#' || true)
echo "$registered of 4 suite(s) match $pattern"
test "$registered" -ge 4 || { echo "a suite this criterion names is not registered — renamed, deleted, or never written"; exit 1; }
ctest --test-dir "$d" -R "$pattern" --output-on-failure
'''
where = "ci"
reason = "Metal exists only on macOS and this host is Linux with no Apple toolchain; the claim is reported NOT EVALUATED here rather than passed, and the macOS leg of the matrix is where it is answered"
ci_job = "milestone-m11d5"

[[criterion]]
id = "d3d12-backend-exists"
describe = "a D3D12 backend exists and passes the RHI conformance suite. THERE WERE NO D3D12 FILES ANYWHERE IN THE TREE WHEN THIS RUNG OPENED, which is why this criterion is a build-and-run rather than a parity comparison"
source = "tasks 2, rhi-and-render-graph, moved from m11d tasks 3"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
pattern='^(unit.rhi_d3d12|integration.rhi_d3d12)$'
registered=$(ctest --test-dir "$d" -N -R "$pattern" 2>/dev/null | grep -c 'Test *#' || true)
echo "$registered of 2 suite(s) match $pattern"
test "$registered" -ge 2 || { echo "a suite this criterion names is not registered — renamed, deleted, or never written"; exit 1; }
ctest --test-dir "$d" -R "$pattern" --output-on-failure
'''
where = "ci"
reason = "D3D12 exists only on Windows and this host is Linux; reported NOT EVALUATED here rather than passed by a suite that did not run"
ci_job = "milestone-m11d5"

[[criterion]]
id = "golden-images-across-three-backends"
describe = "the M3 golden images match across Vulkan, Metal and D3D12 within tolerance. IT IS THE MILESTONE'S FIRST EXIT CRITERION AS ROADMAP.md HAS STATED IT SINCE THE PLAN WAS DRAWN, it is the one claim no single leg can make, and it moved out of M11.d with its subject so that THIS rung cannot close on 'it compiles somewhere'"
source = "tasks 3, ROADMAP M11.d.5 exit criteria, moved from m11d"
kind = "command"
run = "just test-render --compare-backends vulkan metal d3d12"
where = "ci"
reason = "three backends live on three operating systems and no single machine has all three; the comparison is between legs of the matrix, which is the same shape as the cross-leg digest job M11.a built"
ci_job = "milestone-m11d5"

# --- Section 2: the three claims a Linux host CAN judge -------------------------------------------
#
# A rung whose every criterion says NOT EVALUATED on the machine it is written on is a rung nobody
# can develop against, and this ladder already has one terminus collecting twenty-seven gaps. These
# three run here, fail here, and are the ones an author iterates on.

[[criterion]]
id = "device-identity-is-named"
describe = "THE SPIKE'S SHARPEST FINDING, TURNED INTO A CHECK. Every hosted Windows image presents TWO adapters, both `Microsoft Basic Render Driver`, and adapter 0 does NOT set `DXGI_ADAPTER_FLAG_SOFTWARE` — so the ordinary 'pick the first adapter without the software flag' selects a software rasteriser and reports it as hardware. The rule this rung adopts is that the label comes from the ADAPTER'S IDENTITY, never from its flag, and that every device report names which device answered. The arithmetic is engine-side, so a Linux host with no Metal and no D3D12 can judge it in full"
source = "tasks 4, rhi-and-render-graph, m11d design.md section 1.4.1"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
binary="$d/cy_test_unit_rhi"
test -x "$binary" || { echo "no $binary — the suite unit.rhi does not exist"; exit 1; }
filter='a software device is labelled from its identity*,a device report names the device that answered*'
out="$("$binary" "-tc=$filter" 2>&1)" || { echo "$out"; echo "the named case(s) FAILED"; exit 1; }
echo "$out" | tail -3
selected=$(printf '%s' "$out" | sed -nE 's/.*test cases: *([0-9]+) \|.*/\1/p' | head -1)
echo "the filter selected ${selected:-0} case(s) of the 2 it names"
test "${selected:-0}" -ge 2 || { echo "the named case(s) are not in unit.rhi any more — renamed, deleted, or the filter is stale"; exit 1; }
'''
ci_job = "milestone-m11d5"

[[criterion]]
id = "renderer-options-off-is-clean"
describe = "M8.c's rule applied to the two options this rung delivers: the engine builds and passes its suites with `CY_RENDERER_METAL` and `CY_RENDERER_D3D12` OFF as well as ON. A Linux host is the RIGHT place to check it rather than a limitation — off is the configuration every machine that is not a Mac or a Windows box builds, and a backend that has quietly become mandatory shows up here first"
source = "tasks 1, 2, build-system-and-platforms, m8c:feature-options-off"
kind = "command"
run = '''
set -eo pipefail
d="${CY_BUILD_DIR:-build/dev}/renderers-off"
declared=$(grep -c 'CY_RENDERER_METAL|\|CY_RENDERER_D3D12|' cmake/features.cmake || true)
echo "$declared of 2 renderer options declared in cmake/features.cmake"
test "$declared" -ge 2 || { echo "an option this criterion names is not declared"; exit 1; }
CY_BUILD_DIR="$d" just build-engine --profile dev -DCY_RENDERER_METAL=OFF -DCY_RENDERER_D3D12=OFF
CY_BUILD_DIR="$d" just test-all --profile dev
'''
timeout_s = 7200
ci_job = "milestone-m11d5"

[[criterion]]
id = "rhi-row-at-complete-grade"
describe = "every requirement of `rhi-and-render-graph` maps to a test, a gate or a recorded exemption. The row has been Working since M3 and the whole gap to Complete was the second and third backends; this is the rung that reads it at Complete grade, and it needs no device to do so. `just quality-requirements` is one of `testing-and-quality`'s gates and is M11.d's to build; measured on the tree this rung opened on it answers **0 of 12 requirements mapped**, which is the honest red this criterion starts from"
source = "tasks 5, rhi-and-render-graph, testing-and-quality"
kind = "command"
run = "just quality-requirements rhi-and-render-graph"
ci_job = "milestone-m11d5"

# --- Section 3: the artefact ----------------------------------------------------------------------

[[criterion]]
id = "three-backend-images-committed"
describe = "one committed screenshot per backend, each labelled with the backend and the DEVICE that produced it — hardware, paravirtual or software. The rule since M8.c holds: a picture is the only evidence that distinguishes a frame that was drawn from a suite that exited zero, and three files rather than one is the difference between this rung's artefact and any single leg's"
source = "tasks 6, ROADMAP M11.d.5 closing artefact"
kind = "command"
run = '''
set -eo pipefail
missing=0
for backend in vulkan metal d3d12; do
    found=$(ls docs/design/images/m11d5-three-backends-"$backend"*.png 2>/dev/null | head -1 || true)
    if [ -n "$found" ]; then
        echo "  $backend: $found"
    else
        echo "  $backend: no docs/design/images/m11d5-three-backends-$backend*.png"
        missing=$((missing + 1))
    fi
done
echo "$missing of 3 backend images missing"
test "$missing" -eq 0
'''
ci_job = "milestone-m11d5"

# --- Section 4: the record, and the next rung -----------------------------------------------------

[[criterion]]
id = "roadmap-tiers"
describe = "the status record is at this rung's exit tier. ONE ROW, AND IT IS THE OLDEST UNFINISHED ONE ON THE LADDER: `rhi-and-render-graph` has been Working since M3 over a single backend. IT FAILS UNTIL THE CLOSING CHANGE WRITES IT AND IT IS MEANT TO"
source = "tasks, ROADMAP M11.d.5, delivery-roadmap"
kind = "tiers"
ci_job = "milestone-m11d5"

[criterion.expect_tiers]
rhi-and-render-graph = "complete"

# THE HANDOVER CHECK, in the shape `implement-m11-reach` task 0.1 settled for all five rungs and
# which this sixth one inherits unchanged. M11.d's own handover check was re-pointed at THIS rung in
# the same change that created it — a handover that still named M11.e would have skipped a rung.
[[criterion]]
id = "m11e-open"
describe = "the next rung's change exists — open, or closed and archived — AND has been deliberately entered. That rung is M11.e, Ship: the last on the ladder, which this rung hands three backends drawing one scene, and whatever it could not finish"
source = "tasks, implement-m11-reach task 0.1, delivery-roadmap"
kind = "command"
run = '''
set -eo pipefail
# the double-star glob the ladder has used since M8.a: openspec/changes/**/*m11e*/proposal.md
dirs=$(find openspec/changes -type d -name '*m11e*' | sort)
test -n "$dirs" || { echo "no change directory matching openspec/changes/**/*m11e*/"; exit 1; }
entered=""
for d in $dirs; do
    test -f "$d/proposal.md" || continue
    echo "  $d/proposal.md"
    # A CHECKED TASK OUTSIDE SECTION 0, and the exclusion is the point. Section 0 is a rung's own
    # decision-and-spike section, which the split that opened all five rungs could answer in advance;
    # a checked box there says the rung was SCOPED. A checked box in the body says the rung was
    # STARTED, which is the deliberate act this criterion is standing in for.
    if [ -f "$d/tasks.md" ] && grep -qE '^- \[x\] [1-9]' "$d/tasks.md"; then
        entered="$entered $d"
    fi
done
if [ -z "$entered" ]; then
    echo "the next rung's change exists and nobody has entered it: no task outside its section 0 is checked."
    exit 1
fi
echo "entered:$entered"
'''
ci_job = "milestone-m11d5"

# Mirrors `m11b:m11c-open` — the handover check is a regex over a path assembled from a shell
# variable, so the prover cannot derive a mutation from its text. The smallest act that unclaims
# the next rung being entered is the checked task boxes going away.
[criterion.falsifies]
mutate = "delete-lines"
target = "openspec/changes/*m11e*/tasks.md"
token = "- [x] "
