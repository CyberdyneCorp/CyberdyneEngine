# M11.d.5 — Backends: the exit criteria of the rung M11.d's spike carved out of it.
#
# WHY THIS RUNG EXISTS, AND IT IS THE MACHINE RATHER THAN THE PLAN. M11.d was written carrying
# sections 2 (Metal, native) and 3 (D3D12, from nothing). The work of this project happens on a
# Linux host with one operating system and no Apple toolchain: **Metal cannot be compiled here and
# D3D12 cannot be compiled here.** Neither backend could be written or judged where M11.d is being
# worked, and half-building them there would have produced the one defect this project has paid for
# nine times — a check that cannot fail. So the two sections were MOVED, not deleted and not
# descoped, into this rung, which is inserted between M11.d and M11.e exactly as M5.5 was inserted
# between M5 and M6. `delivery-roadmap`'s "A spike may resize a milestone as well as redirect it"
# is the rule that permits it and `openspec/changes/implement-m11d5-backends/` is the change that
# records it.
#
# AND `golden-images-across-three-backends` MOVED WITH THEM, which is the half that matters. It is
# M11's first exit criterion as ROADMAP.md has stated it since the plan was drawn, it is the only
# claim no single leg can make, and leaving it behind in M11.d would have let THIS rung close on
# "it compiles somewhere". `delivery-roadmap`'s "A criterion follows its subject" says so in as many
# words: a criterion whose subject has been deferred moves with its subject, because leaving it
# behind produces a check with nothing to check.
#
# WHAT THE SPIKE ALREADY MEASURED ABOUT THIS RUNG'S OWN EVIDENCE, so it is not re-derived here.
# M11.d's spike ran a throwaway workflow whose tree was only the probes, on two runs
# (35438833469, 35439163646). Each probe created a device, cleared a 64x64 target to a known colour,
# read the pixel back and presented. The answers:
#
#   macos-14 arm64    MTLDevice yes, pixel exact, CAMetalLayer presented clean — "Apple Paravirtual
#                     device", NO Apple GPU family at all (Apple7=0, Apple8=0, Metal3=0, Mac2=1),
#                     argument buffers Tier 1, isDepth24Stencil8PixelFormatSupported=0
#   macos-13 x86_64   no runner was ever allocated, on either run
#   windows-2022 x64  ID3D12Device yes, pixel exact, swapchain on a hidden HWND hr=0 — "Microsoft
#   windows-11-arm    Basic Render Driver", software, ResourceHeapTier=2, and TWO adapters of which
#                     adapter 0 does NOT set DXGI_ADAPTER_FLAG_SOFTWARE
#
# THREE CONSEQUENCES THIS LEDGER IS WRITTEN AGAINST, none of them optional:
#
#   1. Tile memory and memoryless attachments are APPLE-FAMILY features and they are the entire
#      stated reason `rhi-and-render-graph` refuses MoltenVK. The thing a native Metal backend is
#      FOR cannot be exercised on any hosted runner. `metal-backend-is-native` below therefore
#      claims compile-create-draw-present and NOT the feature set, and the difference is a declared
#      deferral in design.md rather than a tick.
#   2. The engine's descriptor model is bindless and the bindless path needs argument buffers at
#      Tier 2. The hosted device is Tier 1, so `integration.rhi_metal` can pass there without the
#      descriptor model having been exercised once.
#   3. "Pick the first adapter without DXGI_ADAPTER_FLAG_SOFTWARE" selects a software rasteriser on
#      every hosted Windows image. A backend that trusts that flag reports hardware it does not
#      have and so do its golden images. `device-identity-is-named` below is that finding turned
#      into a check, and it is the ONE claim of this rung a Linux host can judge in full.
#
# THE STATIC GATES ARE SPELLED HERE EXACTLY AS THE OTHER RUNGS SPELL THEM, so they collapse to one
# check each across the ladder. `just roadmap-milestone m11d5` evaluates the permanent set once plus
# the criteria in this file; it invokes no other ledger.

schema = 1
id = "m11d5"
name = "Backends"
artefact = "ONE SCENE, THREE BACKENDS, THE SAME PICTURE: the M3 golden images rendered through Vulkan, Metal and D3D12 and compared across legs of the matrix within tolerance, one committed screenshot per backend under docs/design/images/, and EACH ONE LABELLED WITH THE DEVICE THAT ANSWERED — hardware, paravirtual or software — because a green tick that does not say which answered is a claim about hardware nobody ran."

notes = [
    "`just roadmap-milestone m11d5` is this recipe, so it cannot be one of the criteria it evaluates.",
    "THIS RUNG IS MOSTLY NOT EVALUABLE ON THE HOST IT IS WRITTEN ON, and that is recorded through `where`/`reason` rather than as a sentence. NOT EVALUATED is never a pass. Three criteria below CAN be judged here and are deliberately kept here rather than pushed onto a runner: `device-identity-is-named` (the labelling rule is engine-side arithmetic), `renderer-options-off-is-clean` (M8.c's rule, which a Linux host is the right place to check) and `rhi-row-at-complete-grade` (a requirement-to-evidence mapping, which needs no device).",
    "WHAT THIS RUNG MAY NOT CLAIM, and design.md of implement-m11d5-backends carries each as a declared deferral with a re-entry point rather than a criterion a hosted leg could fake: Apple-family tile memory and memoryless attachments; argument buffers at Tier 2; parity against references photographed on this project's own hardware; and D3D12 Resource Heap Tier 1, which hardware still ships and no hosted image presents.",
    "THE INTERFACE IS M11.d's AND IT IS BELOW THIS RUNG ON THE LADDER, so `m11d:rhi-interface-gaps-settled` and `m11d:null-backend-refuses-what-it-cannot-do` are inherited here rather than restated. The ordering is the whole point of the split M11.d's spike argued for: a gap closed inside a backend is a gap the other two backends rediscover.",
    "MSL AND DXIL ARE `shader-system`'s, WHICH IS M11.c's ROW, and `m11d:shader-targets-emitted` is the prerequisite check — it stays in M11.d and is inherited here. This rung cannot start without it and does not own it.",
]

