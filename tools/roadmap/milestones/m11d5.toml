[[criterion]]
id = "four-profiles"
describe = "all four profiles build clean and just test-all is green in each, on every desktop platform"
source = "tasks"
kind = "command"
run = '''
python3 tools/roadmap/matrix.py build debug-default dev-default profile-default release-default || exit 1
for p in debug dev profile release; do
    d="$(python3 tools/roadmap/matrix.py path "$p-default")"
    CY_BUILD_DIR="$d" just build-editor --profile "$p" || exit 1
