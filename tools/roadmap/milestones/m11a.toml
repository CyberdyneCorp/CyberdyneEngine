[[criterion]]
id = "cross-leg-digest-job"
describe = "THE JOB COMPARES, AND THE CHECK PROVES IT BY RUNNING THE JOB'S OWN COMPARISON. One job publishes a digest from each leg of a four-leg matrix and a second job downloads all of them and compares them; that much a reader can see. What a reader cannot see, and what M11.a's gate correctly refused to take on trust, is whether the command that job runs would NOTICE a disagreement — the first draft of this criterion asked only that one job block contain `upload-artifact`, `download-artifact` and the word `digest`, which a job that moves no bytes and runs `echo` satisfies in three lines. `tools/ci/cross_leg_audit.py` reads the workflow for the publisher, the downloader and the command between them, and then EXECUTES that command against digests it wrote: identical digests from two architectures must pass, and a changed simulation hash, a changed generated world, one leg alone, two legs of one architecture, a digest of zero and an empty workload must each turn it red. The dummy job is fixture one of `--selftest`, beside a publication with no comparison, a comparison that does not `needs:` its publication, a one-leg matrix, a matrix of one runner image, and a job that fails whatever it is given — six shapes that must be refused, checked on every `just ci-check`. **AND THE REPAIR-2 GATE REFUTED THAT REPAIR IN TURN, BECAUSE A COMMAND IS NOT A JOB.** It broke the workflow three ways and this criterion stayed GREEN on all three: `if: always()` changed to `if: false` on the comparison job, so nothing is ever compared and — GitHub scoring a SKIPPED job as success — the pipeline is green too; the matrix leg's publishing step deleted verbatim, so four legs upload a path nothing computed; and that step's command replaced by an `echo` or its flag misspelt, so the leg runs, exits, and routes nothing to the path it uploads. A command that discriminates, inside a job that never runs, over an artefact nobody wrote, is the dummy job again with more lines in it. So the audit now also asks IS THE COMPARISON SCHEDULED — evaluating every `if:` on the publishing job, the comparison job, the `needs:` chain between them and each step the chain is made of, against the workflow's own `on:` triggers, with a condition it cannot read reported as a finding rather than a pass — and DOES A LEG PUBLISH ANYTHING, by RUNNING the leg's own publishing command with the path it uploads redirected into a directory the check has deliberately not created and with `CY_BUILD_DIR` pointed inside a regular file so no build can succeed: the real command creates that directory before it dies at the build, an `echo` exits 0 having created nothing, and a misspelt flag dies having touched nothing at all. Each of the three mutations above now turns all three criteria red, and each is a fixture of `--selftest`, which requires a refusal to SAY the thing its fixture is about so that a rule which began refusing everything cannot pass for twelve discriminating ones. **AND THE REPAIR-3 GATE REFUTED THAT REPAIR IN TURN, BECAUSE A JOB IS NOT A RUN.** It added one line — `continue-on-error: true` on the comparison step — and all three criteria stayed GREEN, as did `just ci-check`, which printed \"this repository's own workflows carry a comparison that discriminates\" over a comparison whose answer was being discarded: the comparator still runs, still exits 1 when two architectures disagree, and the job's conclusion is SUCCESS, so the pipeline is green and the disagreement is a grey tick. Red is a property of the RUN, not of a process's exit code. The audit now walks the chain a third time asking DOES THE RED REACH THE PIPELINE — every `continue-on-error:` on the publishing job, the comparison job and each step between them, evaluated per trigger against the workflow's own `on:`, with an expression it cannot read reported as a finding; and the `if-no-files-found:` of the step that uploads the digest, which at anything but `error` lets a leg that computed nothing stay green and drop out of the comparison in silence while the legs that remain agree with each other. Five fixtures of `--selftest` are that family, the gate's own one-liner among them, and each turns all three criteria red. What it does not claim is that anyone has made the run REQUIRED for a merge: branch protection is a repository setting and lives in no file in this tree."
source = "tasks 2.1, simulation-and-determinism (CrossPlatform), procedural-content-generation"
kind = "command"
run = "python3 tools/ci/cross_leg_audit.py --claim job"
ci_job = "milestone-m11a"

# WHAT MUST BREAK IT, AND IT IS NOW THE MUTATION THE REPAIR-2 GATE USED RATHER THAN THE ONE THE
