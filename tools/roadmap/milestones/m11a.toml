# --- Section 1: the device-side field sampler, which three of the seven gaps point at --------------
#
# `m10:fields-sampled-on-a-device` asks whether ANY `.slang` module samples an environment field, and
# the answer today is zero of the twenty-six in the tree. That criterion goes green the moment one
# exists. This rung's bar is higher on purpose: the sampler has to agree with the processor's, and
# the consumers the requirement names have to use it, because a shader nobody binds is a file.

[[criterion]]
id = "field-sampler-written"
describe = "`cy/field.slang` exists and is WRITTEN AGAINST THE BUFFER LAYOUT `gpu.h` ALREADY FIXES — checked by comparing the two, constant for constant, rather than by finding the word `kFieldImage` in the file. `src/environment/`'s README says this module is owed by the first renderer-facing row to sample a field in a shader, and no renderer-facing row had: the fifteen modules under src/rendering/shaders/cy/ were brdf, cluster, color, frame, fullscreen, globals, light, material, noise, packing, particle, sampling, shadow, tonemap and view. THE FIRST VERSION OF THIS CHECK WAS A WORD-GREP AND `falsify.py audit --weak` NAMED IT `presence-only`: the verdict is that this text exists, which is the shape this project has shipped seven times. What `written against the layout gpu.h fixes` actually asserts is an AGREEMENT between two artefacts, and an agreement is checkable — sixteen numbers, the image magic, the layout version, the header and entry word counts, the tile edge, the five `FieldEncoding` members, the five `FieldLayerRule` members and `FieldInterpolation::Linear`, read out of the shader and out of `gpu.h`, `field.h` and `store.h` and required to be equal. A shader that decodes a layout the engine does not write is what this closes, and it is invisible to a grep because both files still contain the word"
source = "tasks 1.1, environment-fields (CPU and GPU access), src/environment/README.md"
kind = "command"
run = '''
set -eo pipefail
module=src/rendering/shaders/cy/field.slang
if [ ! -f "$module" ]; then
    echo "no $module — the shader-side environment-field sampler does not exist"
    echo "  modules present: $(ls src/rendering/shaders/cy/ 2>/dev/null | tr '\n' ' ')"
    exit 1
fi
echo "$module exists, $(wc -l < "$module") line(s)"
python3 - <<'CHECK'
import re
import sys

SHADER = "src/rendering/shaders/cy/field.slang"
GPU = "src/environment/include/cy/environment/gpu.h"
FIELD = "src/environment/include/cy/environment/field.h"
STORE = "src/environment/include/cy/environment/store.h"
shader, gpu, field_h, store_h = (open(path).read() for path in (SHADER, GPU, FIELD, STORE))


def shader_constant(name):
    found = re.search(rf"public static const uint {name}\s*=\s*([0-9a-fA-Fx']+)u;", shader)
    if not found:
        sys.exit(f"{SHADER} no longer declares {name}: the module cannot be compared with the "
                 f"layout gpu.h fixes, so nothing holds the shader and the engine in step")
    return int(found.group(1).replace("'", ""), 0)


def engine_constant(text, where, name):
    found = re.search(rf"inline constexpr u32 {name}\s*=\s*([0-9a-fA-Fx']+)U?;", text)
    if not found:
        sys.exit(f"{where} no longer declares {name}")
    return int(found.group(1).replace("'", ""), 0)


def engine_enum(name):
    """`enum class <name> : u8 { A = 0, B, ... }` as {member: value}, comments and all."""
    found = re.search(rf"enum class {name}\s*:\s*u8\s*\{{(.*?)\}};", field_h, re.S)
    if not found:
        sys.exit(f"{FIELD} no longer declares enum class {name}")
    members, value = {}, 0
    for line in re.sub(r"//[^\n]*", "", found.group(1)).splitlines():
        for piece in (part.strip() for part in line.split(",")):
            if not piece:
                continue
            member = re.match(r"(\w+)\s*(?:=\s*([0-9]+))?$", piece)
            if not member:
                sys.exit(f"{FIELD}'s {name} has a member this check cannot read: {piece!r}")
            if member.group(2) is not None:
                value = int(member.group(2))
            members[member.group(1)] = value
            value += 1
    return members


pairs = [(name, shader_constant(name), engine_constant(gpu, GPU, name))
         for name in ("kFieldImageMagic", "kFieldImageVersion", "kFieldImageHeaderWords",
                      "kFieldImageEntryWords")]
pairs.append(("the tile edge in cells", shader_constant("kFieldTileCells"),
              engine_constant(store_h, STORE, "kTileCells")))
encoding = engine_enum("FieldEncoding")
pairs += [(f"FieldEncoding::{member}", shader_constant(f"kFieldEncoding{member}"),
           encoding[member]) for member in ("F32", "UNorm8", "UNorm16", "Uint8", "Uint16")]
rule = engine_enum("FieldLayerRule")
pairs += [(f"FieldLayerRule::{member}", shader_constant(f"kFieldRule{member}"), rule[member])
          for member in ("Replace", "Add", "Multiply", "Max", "Min")]
pairs.append(("FieldInterpolation::Linear", shader_constant("kFieldInterpolationLinear"),
              engine_enum("FieldInterpolation")["Linear"]))

for name, mine, theirs in pairs:
    print(f"  {name}: shader {mine}, engine {theirs}"
          f"{'' if mine == theirs else '   <-- DISAGREE'}")
wrong = [(name, mine, theirs) for name, mine, theirs in pairs if mine != theirs]
if wrong:
    sys.exit("cy/field.slang decodes a layout the engine does not write: " +
             "; ".join(f"{name} is {mine} in the shader and {theirs} in the engine"
                       for name, mine, theirs in wrong) +
             ". The shader would read a buffer it agrees with nobody about, and every value it "
             "returned would be wrong in a way no grep over either file can see.")
print(f"{len(pairs)} layout constants agree between cy/field.slang and gpu.h, field.h and store.h")
CHECK
'''
ci_job = "milestone-m11a"

# WHAT MUST BREAK IT: rename `kFieldImageHeaderWords` in `cy/field.slang` and the shader stops
# declaring the header size the engine writes — the module is then no longer written against the
# layout, which is exactly what this criterion claims. `just roadmap-falsify` applies that to a
# sandboxed copy of the tree and requires this criterion to go RED on it. It is DECLARED rather than
# derived because the check greps nothing: it reads four files and compares sixteen numbers, and the
# tooling derives mutations from a criterion's own searches.
[criterion.falsifies]
mutate = "rename-token"
target = "src/rendering/shaders/cy/field.slang"
token = "kFieldImageHeaderWords"
note = "the shader stops naming the header word count gpu.h fixes, so the two artefacts no longer agree"

[[criterion]]
id = "field-sampler-consumed"
describe = "the sampler is BOUND rather than written: at least two shader modules outside `field.slang` itself sample a field through it. A shader module nothing includes is a file, and `Cloud shadows` requires the field to be consumed by terrain, foliage, water and illumination — four consumers, of which this asks for two before a device is involved"
source = "tasks 1.1, 1.3, environment-fields, atmosphere-sky-and-clouds (Cloud shadows)"
kind = "command"
run = '''
set -eo pipefail
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null

# WHAT THIS USED TO BE: `grep -rl "cy/field.slang\|cy.field" --include='*.slang' src/ | grep -v field.slang`,
# count at least two. `falsify.py audit --weak` calls that `presence-only`, and it is satisfied by two
# modules that write `import cy.field;` and never call it — which is the exact defect the criterion's
# own text names, "a shader module nothing includes is a file", one level up.
#
# WHAT IT IS NOW: each named consumer is COMPILED, on its own, through a probe that calls only that
# consumer's public entry, and the emitted SPIR-V must reference the bindless table `cy/field.slang`
# declares at set 0, binding 3. A consumer that stops sampling leaves the table unreferenced and the
# compiler drops it, so the check goes red on the thing that matters rather than on the import line.
# The negative control is recorded rather than asserted: a probe calling `cyTerrainShade` — which
# takes an already-sampled substrate — compiles to SPIR-V with ZERO references to the table, so this
# is a discriminating test and not one every program passes.
slangc="$d/Development/bin/slangc"
test -x "$slangc" || slangc="$(find "$d" -type f -name slangc -perm -u+x 2>/dev/null | head -1)"
test -x "${slangc:-/nonexistent}" || { echo "no slangc under $d: this build has no Slang front end, so whether a consumer samples cannot be judged here"; exit 1; }
work="$(mktemp -d)"
trap 'rm -rf "$work"' EXIT

cat > "$work/cy_terrain_shade.slang" <<'PROBE'
import cy.terrain_shade;
[[vk::binding(0, 3)]] RWStructuredBuffer<float> cyConsumerProbeOut;
[shader("compute")]
[numthreads(1, 1, 1)]
void cyConsumerProbe(uint3 thread : SV_DispatchThreadID)
{
    CyTerrainFields fields;
    fields.waterDistance = 0u;
    fields.wetness = 1u;
    fields.snowDepth = 2u;
    fields.vegetation = 3u;
    const CyTerrainSubstrate substrate = cyTerrainSampleSubstrate(fields, 1.0, 2.0, 3.0);
    cyConsumerProbeOut[thread.x] = substrate.waterDistanceMetres + substrate.wetness +
                                   substrate.snowDepthMetres + substrate.vegetation;
}
PROBE

cat > "$work/cy_cloud_shadow.slang" <<'PROBE'
import cy.cloud_shadow;
[[vk::binding(0, 3)]] RWStructuredBuffer<float> cyConsumerProbeOut;
[shader("compute")]
[numthreads(1, 1, 1)]
void cyConsumerProbe(uint3 thread : SV_DispatchThreadID)
{
    cyConsumerProbeOut[thread.x] = cyCloudShadowAt(4u, 1.0, 2.0, 3.0) +
                                   cyCloudShadowAttenuate(float3(1.0), 4u, 1.0, 2.0, 3.0).x;
}
PROBE

sampling=0
for probe in "$work"/cy_*.slang; do
    module="$(basename "$probe" .slang)"
    if ! "$slangc" "$probe" -I src/rendering/shaders -target spirv -profile spirv_1_5 \
            -entry cyConsumerProbe -stage compute -fvk-use-entrypoint-name \
            -o "$work/$module.spv" > "$work/$module.log" 2>&1; then
        echo "$module does not compile against cy/field.slang:"
        tail -20 "$work/$module.log"
        continue
    fi
    hits=$(strings -a "$work/$module.spv" | grep -c '^cyEnvironmentFields$' || true)
    if [ "$hits" -gt 0 ]; then
        sampling=$((sampling + 1))
        echo "$module samples: its compiled module references the bindless field table"
    else
        echo "$module compiles and NEVER SAMPLES: nothing in its emitted SPIR-V reaches the"
        echo "  bindless table cy/field.slang declares, so the import is decoration"
    fi
done
echo "$sampling of 2 named consumers sample an environment field through cy/field.slang"
test "$sampling" -ge 2
'''
ci_job = "milestone-m11a"

# WHAT MUST BREAK IT: rename `cyFieldSampleScene` in `cy/field.slang` and the two consumers stop
# compiling — a module that cannot resolve the sampler is not consuming it. That is the mutation the
# tooling applies; the OTHER direction, a consumer that compiles and stops sampling, is what the
# SPIR-V reference test above catches and what the negative control in its comment measures.
[criterion.falsifies]
mutate = "rename-token"
target = "src/rendering/shaders/cy/field.slang"
token = "cyFieldSampleScene"
note = "the sampler's entry point renamed: both consumers fail to compile, because they call it"

[[criterion]]
id = "field-device-agrees-with-cpu"
describe = """the device sampler and the processor sampler return the same value at the same positions, COMPARED BIT-EXACTLY. `integration.environment_gpu` proves the decode agrees on the processor TWICE — one packer and a second independent decoder — and that is evidence about a layout rather than about a device. `render.environment_field` samples the same field at the same points through `cy/field.slang` on a graphics device and through `sample_field_image()` over the same bytes, and reports bit-identical counts and ULP distances rather than a tolerance.

TWO EDITS TO WHAT THIS LEDGER FIRST SAID, BOTH FORCED BY MEASUREMENT.

FIRST, THE SUITE. This criterion named `integration.environment_gpu`, which links `cy::environment` alone — a layer-2 module that may not name a device or the renderer, which is the invariant the `layering` criterion above exists to hold. The device case is `render.environment_field` under tests/, layer 7, where `render.gpu_culling` and `render.conventions` already are; it is `KIND render` because that taxonomy's budget and timeout are the ones written for a suite that talks to a GPU.

SECOND, THE BOUND. M11.a's spike mutated the `UNorm16` decode's divisor from 65535 to 65536 and every value in its report changed WHILE EVERY FIELD STAYED INSIDE ITS DECLARED PRECISION; the same mutation on `UNorm8` here moves the worst difference to 0.00383735 against a declared precision of 0.00392157 — still inside. A criterion written as "within the field's declared precision" cannot fail on the defect it exists for. So the suite asserts bit-identity at lattice centres for an `F32` encoding, three ULP there for a quantised one (Vulkan specifies `OpFDiv` to 2.5 ULP, which is the one-ULP difference measured), and the declared-precision bound across a sweep with the ULP figures reported beside it."""
source = "tasks 1.1, 1.2, environment-fields (CPU and GPU access), design.md 1.4"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
binary="$d/tests/render/cy_test_render_environment_field"
test -x "$binary" || binary="$d/cy_test_render_environment_field"
test -x "$binary" || { echo "no cy_test_render_environment_field — the suite render.environment_field does not exist"; exit 1; }
out="$("$binary" 2>&1)" || { echo "$out"; echo "the device agreement suite FAILED"; exit 1; }
printf '%s\n' "$out" | grep -E 'sentinels alive|sweep|lattice centres'
selected=$(printf '%s' "$out" | sed -nE 's/.*test cases: *([0-9]+) \|.*/\1/p' | head -1)
echo "the suite ran ${selected:-0} case(s) of the 2 it declares"
test "${selected:-0}" -ge 2 || { echo "a case has been renamed, deleted or skipped"; exit 1; }
# A SKIP IS NOT A PASS. device.h prints this line and returns when the machine has no Vulkan device;
# the criterion carries requires = "gpu" so such a machine reports NOT EVALUATED, and a run that got
# here having skipped would be reporting a green over a suite that did nothing.
printf '%s\n' "$out" | grep -q 'no Vulkan device on this machine' && { echo "the suite skipped: no device"; exit 1; }
# AND THE NUMBERS. Every sentinel dead, every position resolved, and the content varying — the three
# ways a device comparison passes while measuring nothing.
printf '%s\n' "$out" | python3 -c '
import re, sys
text = sys.stdin.read()
sentinels = re.search(r"sentinels alive: ([0-9]+) of ([0-9]+)", text)
if not sentinels:
    sys.exit("the suite no longer reports its sentinel count: the dispatch cannot be shown to have run")
if int(sentinels.group(1)) != 0:
    sys.exit(f"{sentinels.group(1)} of {sentinels.group(2)} answer words were never written: the dispatch did not run")
rows = re.findall(r"(\w[\w ()]*?): ([0-9]+) comparisons, ([0-9]+) bit-identical, worst ([0-9]+) ulp", text)
if len(rows) < 4:
    sys.exit(f"expected four reported comparisons (two fields, sweep and lattice centres), saw {len(rows)}")
unresolved = [int(value) for value in re.findall(r"([0-9]+) unresolved", text)]
if not unresolved or any(count != 0 for count in unresolved):
    sys.exit(f"positions fell outside the written tiles: {unresolved} unresolved — both samplers then answer the declared default and agree about nothing")
for name, compared, identical, ulp in rows:
    print(f"  {name.strip()}: {compared} comparisons, {identical} bit-identical, worst {ulp} ulp")
print("the device sampler agrees with the processor over", sum(int(row[1]) for row in rows), "comparisons")
'
'''
requires = "gpu"
reason = "sampling a field in a shader needs a graphics device; on a machine without one the claim is reported NOT EVALUATED rather than passed, because the processor half already passes and would make a green look like agreement"
timeout_s = 3600
ci_job = "milestone-m11a"

[[criterion]]
id = "world-budget-headless"
describe = "the world demo's headless frame cost is inside 16.7 ms across a full day/night cycle, at a seed the tuning did not use. Headless was 106 ms at M10, so this is the same claim the device criterion makes with the draw removed — and it is the half every machine can judge"
source = "tasks 1.2, ROADMAP M11.a exit criteria"
kind = "command"
run = '''
set -eo pipefail
just run-sample 10-world --headless --seed 20260913 --cycle --budget-ms 16.7
'''
timeout_s = 3600
