# --- Section 9: the four rows whose Working tier no criterion evaluates ----------------------------
#
# `m9:record-matches-plan-history` now closes at M11.e, because it cannot pass until the last of its
# four rows is evaluated AND recorded, and two of the four are M11.d's rows and two are M11.e's. What
# THIS rung owes is the first half: criteria that EVALUATE the rows, so that the tier a later rung
# records is one something re-checks. A tier written into a record nothing re-checks is the defect the
# gap is about, one level down.

[[criterion]]
id = "the-four-rows-are-evaluated"
describe = "each of `testing-and-quality`, `build-system-and-platforms`, `developer-workflow-and-just` and `thirdparty-dependencies` is BOTH named by a criterion that runs something AND expected above `seed` by some ledger's `expect_tiers`. Before the five M11 ledgers were written, `build-system-and-platforms` appeared in no ledger but m0.toml at all, and the only tier expectation naming any of the four was `m0:roadmap-tiers` expecting `seed` — which is a FLOOR and can never contradict a Working claim. **THIS CRITERION WENT GREEN THE DAY THE FIVE LEDGERS LANDED AND IT IS A REGRESSION GUARD FROM HERE ON**: it goes red again if the criteria that evaluate a row are deleted or its tier expectation is dropped. The other half of the defect — the tiers actually being RECORDED — is `m9:record-matches-plan-history`, which fails today and closes at M11.e"
source = "tasks, delivery-roadmap (A recorded tier is evaluated by a criterion)"
kind = "command"
run = '''
set -eo pipefail
python3 - <<'CHECK'
import pathlib, sys, tomllib
rows = ["testing-and-quality", "build-system-and-platforms",
        "developer-workflow-and-just", "thirdparty-dependencies"]
# TWO HALVES, AND THE GAP IS ABOUT BOTH. A criterion that RUNS something and declares the row it is
# evaluating — `source` is that declaration, and `describe` is prose, so only `source` is read; and a
# tier expectation ABOVE `seed` somewhere, because `_check_tiers` treats an exit tier as a FLOOR and
# a `seed` expectation can never contradict a Working claim. This criterion excludes itself: a check
# that counted its own declaration would be the same defect one level up.
RANK = {"seed": 0, "working": 1, "complete": 2}
evaluating = {row: [] for row in rows}
floors = {row: [] for row in rows}
for path in sorted(pathlib.Path("tools/roadmap/milestones").glob("*.toml")):
    for criterion in tomllib.loads(path.read_text(encoding="utf-8")).get("criterion", ()):
        label = f"{path.stem}:{criterion['id']}"
        if criterion["kind"] == "tiers":
            for row, tier in criterion.get("expect_tiers", {}).items():
                if row in rows and RANK.get(tier, 0) > RANK["seed"]:
                    floors[row].append(f"{label} expects {tier}")
            continue
        if criterion["id"] == "the-four-rows-are-evaluated":
            continue
        for row in rows:
            if row in str(criterion.get("source", "")):
                evaluating[row].append(label)
short = []
for row in rows:
    print(f"  {row}")
    print(f"    runs:  {', '.join(evaluating[row]) or 'NOTHING RUNS FOR THIS ROW'}")
    print(f"    floor: {', '.join(floors[row]) or 'NO LEDGER EXPECTS IT ABOVE seed'}")
    if not evaluating[row] or not floors[row]:
        short.append(row)
sys.exit(1 if short else 0)
CHECK'''
ci_job = "milestone-m11a"

