# --- Section 6: the world that streams ------------------------------------------------------------

[[criterion]]
id = "world-streams"
describe = "`samples/10-world` streams. It keeps the whole world resident today, meshes every terrain tile at level 0 and reports `MeshReport::stitched_vertices` as zero precisely so a reader can see that nothing streamed — which is why `world-partition-and-streaming`'s Complete cell was moved off M10 by its own gate. The check asks for tiles evicted and vertices stitched to a coarser neighbour, both of which are zero today"
source = "tasks, world-partition-and-streaming, src/terrain/README.md"
kind = "command"
run = '''
set -eo pipefail
# WHAT THIS USED TO RUN, AND WHY IT MEASURED NOTHING — REPAIR 2. It was
# `just run-sample 10-world --headless --seed 20260913 --stream-report`, and neither the name nor
# the flag existed: the sample is `world` (`10-world` is the directory) and `--stream-report` was
# never a flag `samples/10-world/main.cpp` parsed. The recipe exited 2 at `no sample '10-world'`,
# the two greps never ran, and `roadmap-falsify` recorded the exit as `red against a built tree` —
# a criterion that could not run, filed as a criterion watched going red.
#
# The sample now PRINTS what it streams at the end of every take, off `TerrainStore::tile_count()`
# rather than off a counter, so these two greps read a measurement and no flag is needed.
work="$(mktemp -d)"
trap 'rm -rf "$work"' EXIT
just run-sample world --headless --seed 20260913 --seconds 1 --fps 4 | tee "$work/stream.txt"
grep -q "=== world-partition-and-streaming" "$work/stream.txt" || {
    echo "the sample no longer reports its residency at all: this criterion cannot be judged by"
    echo "its absence, because an absent line is what a renamed section and an unstreamed world"
    echo "look like alike"
    exit 1
}
grep -E "evicted: [1-9]" "$work/stream.txt"
grep -E "stitched_vertices: [1-9]" "$work/stream.txt"
'''
timeout_s = 3600
ci_job = "milestone-m11a"

