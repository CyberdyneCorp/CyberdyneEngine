[[criterion]]
id = "the-four-rows-are-evaluated"
describe = "each of `testing-and-quality`, `build-system-and-platforms`, `developer-workflow-and-just` and `thirdparty-dependencies` is BOTH evaluated by a criterion THIS LEDGER ACTUALLY RUNS AND expected above `seed` by some ledger's `expect_tiers`. Before the five M11 ledgers were written, `build-system-and-platforms` appeared in no ledger but m0.toml at all, and the only tier expectation naming any of the four was `m0:roadmap-tiers` expecting `seed` — which is a FLOOR and can never contradict a Working claim. **THE `ACTUALLY RUNS` HALF IS NOT DECORATION**: when the five ledgers landed, this check went green on criteria declared in m11d and m11e, which `criteria.build_plan` does not put in M11.a's plan at all — so a row could be `evaluated` by something that will not execute until two rungs after the tier is recorded. It reads the plan rather than the directory for that reason, and it excludes itself, because a check that counted its own declaration would be the same defect one level up. The other half — the tiers actually being RECORDED — is `m9:record-matches-plan-history`, which fails today and closes at M11.e"
source = "tasks 5.1, delivery-roadmap (A recorded tier is evaluated by a criterion)"
kind = "command"
run = '''
set -eo pipefail
python3 - <<'CHECK'
import pathlib, sys, tomllib
sys.path.insert(0, "tools/roadmap")
import criteria, gates
rows = ["testing-and-quality", "build-system-and-platforms",
        "developer-workflow-and-just", "thirdparty-dependencies"]
# TWO HALVES, AND THE GAP IS ABOUT BOTH.
#
# ONE: a criterion that RUNS something, declares the row it is evaluating, and is IN THIS LEDGER'S
# OWN PLAN. `source` is the declaration — `describe` is prose, so only `source` is read — and
# `build_plan` is the second half of it: a ledger evaluates the permanent set plus its own criteria
# and nothing else, so a criterion declared in m11d is not a check this rung has, however well it
# reads in the directory. That is precisely how this criterion first passed.
#
# TWO: a tier expectation ABOVE `seed` somewhere, because `_check_tiers` treats an exit tier as a
# FLOOR and a `seed` expectation can never contradict a Working claim. That half reads every ledger,
# including the rungs that will record the tier, because the floor is the thing a later gate is held
# to rather than a check this rung runs.
RANK = {"seed": 0, "working": 1, "complete": 2}
plan = criteria.build_plan("m11a", gates.permanent_milestones(gates.load()))
evaluating = {row: [] for row in rows}
floors = {row: [] for row in rows}
for entry in plan.entries:
    criterion = entry.criterion
    if criterion.kind == "tiers" or criterion.id == "the-four-rows-are-evaluated":
        continue
    for row in rows:
        if row in criterion.source:
            evaluating[row].append(entry.label)
for path in sorted(pathlib.Path("tools/roadmap/milestones").glob("*.toml")):
    for criterion in tomllib.loads(path.read_text(encoding="utf-8")).get("criterion", ()):
        if criterion["kind"] != "tiers":
            continue
        for row, tier in criterion.get("expect_tiers", {}).items():
            if row in rows and RANK.get(tier, 0) > RANK["seed"]:
                floors[row].append(f"{path.stem}:{criterion['id']} expects {tier}")
short = []
print(f"M11.a's plan is {len(plan.entries)} criteria; these are the ones that name a row:")
for row in rows:
    print(f"  {row}")
    print(f"    runs here: {', '.join(evaluating[row]) or 'NOTHING IN THIS PLAN RUNS FOR THIS ROW'}")
    print(f"    floor:     {', '.join(floors[row]) or 'NO LEDGER EXPECTS IT ABOVE seed'}")
    if not evaluating[row] or not floors[row]:
        short.append(row)
sys.exit(1 if short else 0)
CHECK'''
ci_job = "milestone-m11a"

