# --- Section 1: the device-side field sampler, which three of the seven gaps point at --------------
#
# `m10:fields-sampled-on-a-device` asks whether ANY `.slang` module samples an environment field, and
# the answer today is zero of the twenty-six in the tree. That criterion goes green the moment one
# exists. This rung's bar is higher on purpose: the sampler has to agree with the processor's, and
# the consumers the requirement names have to use it, because a shader nobody binds is a file.

[[criterion]]
id = "field-sampler-written"
describe = "`cy/field.slang` exists and is WRITTEN AGAINST THE BUFFER LAYOUT `gpu.h` ALREADY FIXES — checked by comparing the two, constant for constant, rather than by finding the word `kFieldImage` in the file. `src/environment/`'s README says this module is owed by the first renderer-facing row to sample a field in a shader, and no renderer-facing row had: the fifteen modules under src/rendering/shaders/cy/ were brdf, cluster, color, frame, fullscreen, globals, light, material, noise, packing, particle, sampling, shadow, tonemap and view. THE FIRST VERSION OF THIS CHECK WAS A WORD-GREP AND `falsify.py audit --weak` NAMED IT `presence-only`: the verdict is that this text exists, which is the shape this project has shipped seven times. What `written against the layout gpu.h fixes` actually asserts is an AGREEMENT between two artefacts, and an agreement is checkable — sixteen numbers, the image magic, the layout version, the header and entry word counts, the tile edge, the five `FieldEncoding` members, the five `FieldLayerRule` members and `FieldInterpolation::Linear`, read out of the shader and out of `gpu.h`, `field.h` and `store.h` and required to be equal. A shader that decodes a layout the engine does not write is what this closes, and it is invisible to a grep because both files still contain the word"
source = "tasks 1.1, environment-fields (CPU and GPU access), src/environment/README.md"
kind = "command"
run = '''
set -eo pipefail
module=src/rendering/shaders/cy/field.slang
if [ ! -f "$module" ]; then
    echo "no $module — the shader-side environment-field sampler does not exist"
    echo "  modules present: $(ls src/rendering/shaders/cy/ 2>/dev/null | tr '\n' ' ')"
    exit 1
fi
echo "$module exists, $(wc -l < "$module") line(s)"
python3 - <<'CHECK'
import re
import sys

SHADER = "src/rendering/shaders/cy/field.slang"
GPU = "src/environment/include/cy/environment/gpu.h"
FIELD = "src/environment/include/cy/environment/field.h"
STORE = "src/environment/include/cy/environment/store.h"
shader, gpu, field_h, store_h = (open(path).read() for path in (SHADER, GPU, FIELD, STORE))


def shader_constant(name):
    found = re.search(rf"public static const uint {name}\s*=\s*([0-9a-fA-Fx']+)u;", shader)
    if not found:
        sys.exit(f"{SHADER} no longer declares {name}: the module cannot be compared with the "
                 f"layout gpu.h fixes, so nothing holds the shader and the engine in step")
    return int(found.group(1).replace("'", ""), 0)


def engine_constant(text, where, name):
    found = re.search(rf"inline constexpr u32 {name}\s*=\s*([0-9a-fA-Fx']+)U?;", text)
    if not found:
        sys.exit(f"{where} no longer declares {name}")
    return int(found.group(1).replace("'", ""), 0)


def engine_enum(name):
    """`enum class <name> : u8 { A = 0, B, ... }` as {member: value}, comments and all."""
    found = re.search(rf"enum class {name}\s*:\s*u8\s*\{{(.*?)\}};", field_h, re.S)
    if not found:
        sys.exit(f"{FIELD} no longer declares enum class {name}")
    members, value = {}, 0
    for line in re.sub(r"//[^\n]*", "", found.group(1)).splitlines():
        for piece in (part.strip() for part in line.split(",")):
            if not piece:
                continue
            member = re.match(r"(\w+)\s*(?:=\s*([0-9]+))?$", piece)
            if not member:
                sys.exit(f"{FIELD}'s {name} has a member this check cannot read: {piece!r}")
            if member.group(2) is not None:
                value = int(member.group(2))
            members[member.group(1)] = value
            value += 1
    return members


pairs = [(name, shader_constant(name), engine_constant(gpu, GPU, name))
         for name in ("kFieldImageMagic", "kFieldImageVersion", "kFieldImageHeaderWords",
                      "kFieldImageEntryWords")]
pairs.append(("the tile edge in cells", shader_constant("kFieldTileCells"),
              engine_constant(store_h, STORE, "kTileCells")))
encoding = engine_enum("FieldEncoding")
pairs += [(f"FieldEncoding::{member}", shader_constant(f"kFieldEncoding{member}"),
           encoding[member]) for member in ("F32", "UNorm8", "UNorm16", "Uint8", "Uint16")]
rule = engine_enum("FieldLayerRule")
pairs += [(f"FieldLayerRule::{member}", shader_constant(f"kFieldRule{member}"), rule[member])
          for member in ("Replace", "Add", "Multiply", "Max", "Min")]
pairs.append(("FieldInterpolation::Linear", shader_constant("kFieldInterpolationLinear"),
              engine_enum("FieldInterpolation")["Linear"]))

for name, mine, theirs in pairs:
    print(f"  {name}: shader {mine}, engine {theirs}"
          f"{'' if mine == theirs else '   <-- DISAGREE'}")
wrong = [(name, mine, theirs) for name, mine, theirs in pairs if mine != theirs]
if wrong:
    sys.exit("cy/field.slang decodes a layout the engine does not write: " +
             "; ".join(f"{name} is {mine} in the shader and {theirs} in the engine"
                       for name, mine, theirs in wrong) +
             ". The shader would read a buffer it agrees with nobody about, and every value it "
             "returned would be wrong in a way no grep over either file can see.")
print(f"{len(pairs)} layout constants agree between cy/field.slang and gpu.h, field.h and store.h")
CHECK
'''
ci_job = "milestone-m11a"

# WHAT MUST BREAK IT: rename `kFieldImageHeaderWords` in `cy/field.slang` and the shader stops
# declaring the header size the engine writes — the module is then no longer written against the
# layout, which is exactly what this criterion claims. `just roadmap-falsify` applies that to a
# sandboxed copy of the tree and requires this criterion to go RED on it. It is DECLARED rather than
# derived because the check greps nothing: it reads four files and compares sixteen numbers, and the
# tooling derives mutations from a criterion's own searches.
# THE `known_gap` AND `known_gap_closes` MARKERS THAT STOOD HERE ARE DELETED, BY M11.c's CLOSING
# GATE AND ON THE LEDGER'S OWN INSTRUCTION. `just roadmap-milestone m11c` reported "THE GAP IS
# CLOSED, DELETE THE DECLARATION: m11a:field-sampler-written now passes", and a marker that outlives its gap is the
# next thing nobody notices — `_summarise` fails the ledger for it in the other direction. The
# gap named M11.c as the rung that closes it and this is that act; the criterion itself, its
# `describe` and its `run` are untouched.

[criterion.falsifies]
mutate = "rename-token"
target = "src/rendering/shaders/cy/field.slang"
token = "kFieldImageHeaderWords"
note = "the shader stops naming the header word count gpu.h fixes, so the two artefacts no longer agree"

[[criterion]]
id = "field-sampler-consumed"
describe = "the sampler is BOUND rather than written: at least two shader modules outside `field.slang` itself sample a field through it. A shader module nothing includes is a file, and `Cloud shadows` requires the field to be consumed by terrain, foliage, water and illumination — four consumers, of which this asks for two before a device is involved"
source = "tasks 1.1, 1.3, environment-fields, atmosphere-sky-and-clouds (Cloud shadows)"
kind = "command"
run = '''
set -eo pipefail
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null

# WHAT THIS USED TO BE: `grep -rl "cy/field.slang\|cy.field" --include='*.slang' src/ | grep -v field.slang`,
# count at least two. `falsify.py audit --weak` calls that `presence-only`, and it is satisfied by two
# modules that write `import cy.field;` and never call it — which is the exact defect the criterion's
# own text names, "a shader module nothing includes is a file", one level up.
#
# WHAT IT IS NOW: each named consumer is COMPILED, on its own, through a probe that calls only that
# consumer's public entry, and the emitted SPIR-V must reference the bindless table `cy/field.slang`
# declares at set 0, binding 3. A consumer that stops sampling leaves the table unreferenced and the
# compiler drops it, so the check goes red on the thing that matters rather than on the import line.
# The negative control is recorded rather than asserted: a probe calling `cyTerrainShade` — which
# takes an already-sampled substrate — compiles to SPIR-V with ZERO references to the table, so this
# is a discriminating test and not one every program passes.
slangc="$d/Development/bin/slangc"
test -x "$slangc" || slangc="$(find "$d" -type f -name slangc -perm -u+x 2>/dev/null | head -1)"
test -x "${slangc:-/nonexistent}" || { echo "no slangc under $d: this build has no Slang front end, so whether a consumer samples cannot be judged here"; exit 1; }
work="$(mktemp -d)"
trap 'rm -rf "$work"' EXIT

cat > "$work/cy_terrain_shade.slang" <<'PROBE'
import cy.terrain_shade;
[[vk::binding(0, 3)]] RWStructuredBuffer<float> cyConsumerProbeOut;
[shader("compute")]
[numthreads(1, 1, 1)]
void cyConsumerProbe(uint3 thread : SV_DispatchThreadID)
{
    CyTerrainFields fields;
    fields.waterDistance = 0u;
    fields.wetness = 1u;
    fields.snowDepth = 2u;
    fields.vegetation = 3u;
    const CyTerrainSubstrate substrate = cyTerrainSampleSubstrate(fields, 1.0, 2.0, 3.0);
    cyConsumerProbeOut[thread.x] = substrate.waterDistanceMetres + substrate.wetness +
                                   substrate.snowDepthMetres + substrate.vegetation;
}
PROBE

cat > "$work/cy_cloud_shadow.slang" <<'PROBE'
import cy.cloud_shadow;
[[vk::binding(0, 3)]] RWStructuredBuffer<float> cyConsumerProbeOut;
[shader("compute")]
[numthreads(1, 1, 1)]
void cyConsumerProbe(uint3 thread : SV_DispatchThreadID)
{
    cyConsumerProbeOut[thread.x] = cyCloudShadowAt(4u, 1.0, 2.0, 3.0) +
                                   cyCloudShadowAttenuate(float3(1.0), 4u, 1.0, 2.0, 3.0).x;
}
PROBE

sampling=0
for probe in "$work"/cy_*.slang; do
    module="$(basename "$probe" .slang)"
    if ! "$slangc" "$probe" -I src/rendering/shaders -target spirv -profile spirv_1_5 \
            -entry cyConsumerProbe -stage compute -fvk-use-entrypoint-name \
            -o "$work/$module.spv" > "$work/$module.log" 2>&1; then
        echo "$module does not compile against cy/field.slang:"
        tail -20 "$work/$module.log"
        continue
    fi
    hits=$(strings -a "$work/$module.spv" | grep -c '^cyEnvironmentFields$' || true)
    if [ "$hits" -gt 0 ]; then
        sampling=$((sampling + 1))
        echo "$module samples: its compiled module references the bindless field table"
    else
        echo "$module compiles and NEVER SAMPLES: nothing in its emitted SPIR-V reaches the"
        echo "  bindless table cy/field.slang declares, so the import is decoration"
    fi
done
echo "$sampling of 2 named consumers sample an environment field through cy/field.slang"
test "$sampling" -ge 2
'''
ci_job = "milestone-m11a"

# WHAT MUST BREAK IT: rename `cyFieldSampleScene` in `cy/field.slang` and the two consumers stop
# compiling — a module that cannot resolve the sampler is not consuming it. That is the mutation the
# tooling applies; the OTHER direction, a consumer that compiles and stops sampling, is what the
# SPIR-V reference test above catches and what the negative control in its comment measures.
# THE `known_gap` AND `known_gap_closes` MARKERS THAT STOOD HERE ARE DELETED, BY M11.c's CLOSING
# GATE AND ON THE LEDGER'S OWN INSTRUCTION. `just roadmap-milestone m11c` reported "THE GAP IS
# CLOSED, DELETE THE DECLARATION: m11a:field-sampler-consumed now passes", and a marker that outlives its gap is the
# next thing nobody notices — `_summarise` fails the ledger for it in the other direction. The
# gap named M11.c as the rung that closes it and this is that act; the criterion itself, its
# `describe` and its `run` are untouched.

[criterion.falsifies]
mutate = "rename-token"
target = "src/rendering/shaders/cy/field.slang"
token = "cyFieldSampleScene"
note = "the sampler's entry point renamed: both consumers fail to compile, because they call it"

[[criterion]]
id = "field-device-agrees-with-cpu"
describe = """the device sampler and the processor sampler return the same value at the same positions, COMPARED BIT-EXACTLY. `integration.environment_gpu` proves the decode agrees on the processor TWICE — one packer and a second independent decoder — and that is evidence about a layout rather than about a device. `render.environment_field` samples the same field at the same points through `cy/field.slang` on a graphics device and through `sample_field_image()` over the same bytes, and reports bit-identical counts and ULP distances rather than a tolerance.

TWO EDITS TO WHAT THIS LEDGER FIRST SAID, BOTH FORCED BY MEASUREMENT.

FIRST, THE SUITE. This criterion named `integration.environment_gpu`, which links `cy::environment` alone — a layer-2 module that may not name a device or the renderer, which is the invariant the `layering` criterion above exists to hold. The device case is `render.environment_field` under tests/, layer 7, where `render.gpu_culling` and `render.conventions` already are; it is `KIND render` because that taxonomy's budget and timeout are the ones written for a suite that talks to a GPU.

SECOND, THE BOUND. M11.a's spike mutated the `UNorm16` decode's divisor from 65535 to 65536 and every value in its report changed WHILE EVERY FIELD STAYED INSIDE ITS DECLARED PRECISION; the same mutation on `UNorm8` here moves the worst difference to 0.00383735 against a declared precision of 0.00392157 — still inside. A criterion written as "within the field's declared precision" cannot fail on the defect it exists for. So the suite asserts bit-identity at lattice centres for an `F32` encoding, three ULP there for a quantised one (Vulkan specifies `OpFDiv` to 2.5 ULP, which is the one-ULP difference measured), and the declared-precision bound across a sweep with the ULP figures reported beside it."""
source = "tasks 1.1, 1.2, environment-fields (CPU and GPU access), design.md 1.4"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
binary="$d/tests/render/cy_test_render_environment_field"
test -x "$binary" || binary="$d/cy_test_render_environment_field"
test -x "$binary" || { echo "no cy_test_render_environment_field — the suite render.environment_field does not exist"; exit 1; }
out="$("$binary" 2>&1)" || { echo "$out"; echo "the device agreement suite FAILED"; exit 1; }
printf '%s\n' "$out" | grep -E 'sentinels alive|sweep|lattice centres'
selected=$(printf '%s' "$out" | sed -nE 's/.*test cases: *([0-9]+) \|.*/\1/p' | head -1)
echo "the suite ran ${selected:-0} case(s) of the 2 it declares"
test "${selected:-0}" -ge 2 || { echo "a case has been renamed, deleted or skipped"; exit 1; }
# A SKIP IS NOT A PASS. device.h prints this line and returns when the machine has no Vulkan device;
# the criterion carries requires = "gpu" so such a machine reports NOT EVALUATED, and a run that got
# here having skipped would be reporting a green over a suite that did nothing.
printf '%s\n' "$out" | grep -q 'no Vulkan device on this machine' && { echo "the suite skipped: no device"; exit 1; }
# AND THE NUMBERS. Every sentinel dead, every position resolved, and the content varying — the three
# ways a device comparison passes while measuring nothing.
printf '%s\n' "$out" | python3 -c '
import re, sys
text = sys.stdin.read()
sentinels = re.search(r"sentinels alive: ([0-9]+) of ([0-9]+)", text)
if not sentinels:
    sys.exit("the suite no longer reports its sentinel count: the dispatch cannot be shown to have run")
if int(sentinels.group(1)) != 0:
    sys.exit(f"{sentinels.group(1)} of {sentinels.group(2)} answer words were never written: the dispatch did not run")
rows = re.findall(r"(\w[\w ()]*?): ([0-9]+) comparisons, ([0-9]+) bit-identical, worst ([0-9]+) ulp", text)
if len(rows) < 4:
    sys.exit(f"expected four reported comparisons (two fields, sweep and lattice centres), saw {len(rows)}")
unresolved = [int(value) for value in re.findall(r"([0-9]+) unresolved", text)]
if not unresolved or any(count != 0 for count in unresolved):
    sys.exit(f"positions fell outside the written tiles: {unresolved} unresolved — both samplers then answer the declared default and agree about nothing")
for name, compared, identical, ulp in rows:
    print(f"  {name.strip()}: {compared} comparisons, {identical} bit-identical, worst {ulp} ulp")
print("the device sampler agrees with the processor over", sum(int(row[1]) for row in rows), "comparisons")
'
'''
requires = "gpu"
reason = "sampling a field in a shader needs a graphics device; on a machine without one the claim is reported NOT EVALUATED rather than passed, because the processor half already passes and would make a green look like agreement"
timeout_s = 3600
ci_job = "milestone-m11a"

[criterion.falsifies]
mutate = "rename-token"
target = "tests/render/test_field_device.cpp"
token  = "sentinels alive"
note   = "the three numeric guards in the body are what stop a device comparison passing while measuring nothing, and the first of them reads the suite's own sentinel count out of its output. Renaming the line the suite prints it on leaves the suite green and the criterion RED — `the suite no longer reports its sentinel count: the dispatch cannot be shown to have run` — which is the branch that would otherwise never be exercised. Renaming a CASE was rejected: that fires the `selected >= 2` check, which the `-tc` criteria in this ledger already exercise."

# ================================================================================================
# THE TWO CRITERIA THAT CARRY `m10:world-frame-budget`, AND BOTH OF THEM WERE DEAD — REPAIR 2
# ================================================================================================
#
# As written at this rung they were `just run-sample 10-world ... --cycle --budget-ms 16.7`, and
# THREE separate things in that line did not exist: the sample is called `world` and not `10-world`
# (`10-world` is the DIRECTORY; `just/run.just` globs `samples/*/cy_sample_<name>` and says so in its
# own comment), and neither `--cycle` nor `--budget-ms` was a flag `samples/10-world/main.cpp` parsed.
# The recipe therefore printed `run-sample: no sample '10-world' in <build>/samples.` and exited 2 on
# every machine, having run nothing at all.
#
# AND `roadmap-falsify` RECORDED THAT EXIT AS A PROOF. Both criteria sat in `falsifiability.toml` as
# `red against a built tree`, with the exit-2 line quoted in the record, which is the verdict a
# criterion earns by being watched failing for its subject's sake. A check that cannot run is not
# distinguishable, by exit code, from a check that ran and failed — the seven-times defect, committed
# by the mechanism built to end it. `falsify._inspect_samples` now refuses a sample name no
# `samples/*/CMakeLists.txt` declares, exactly as `_inspect_recipes` refuses an absent recipe.
#
# `--cycle` IS NOT RESTORED, AND THE REASON IS THAT IT COULD NOT BE FALSE. `samples/10-world`'s own
# header fixes it — "a take is exactly one simulated day" — so every run of it is a full day/night
# cycle by construction and a flag asserting that would be a flag with no false case. What the two
# criteria pass instead is the take LENGTH (`--seconds 8 --fps 8`, the 64 frames
# `m10:world-frame-budget` measures over, so the two are comparable) and the budget.
#
# THE JUDGEMENT IS IN THE PROGRAM. `--budget-ms` makes the sample compare the WORST frame of the
# cycle against the budget and exit non-zero, printing the three largest bands beside it. It is in
# the program rather than in a Python block here so that the same arithmetic serves
# `m10:world-frame-budget`'s CSV and these two, and so that a person running the sample by hand gets
# the same verdict the ledger gets.
[[criterion]]
id = "world-budget-headless"
describe = "the world demo's authoritative headless simulation stays inside 16.7 ms for every frame of the same 64-frame day/night cycle. Visual terrain shading, cloud composition, and foam evolution are omitted because they are presentation work dispatched only by the rendered path; the executable judges the worst frame and fails when it exceeds the budget"
source = "tasks 1.2, ROADMAP M11.a exit criteria"
kind = "command"
run = '''
set -eo pipefail
just run-sample world --headless --seed 20260913 --seconds 8 --fps 8 --budget-ms 16.7
'''
timeout_s = 3600
ci_job = "milestone-m11a"


[criterion.falsifies]
mutate = "rename-token"
target = "samples/10-world/main.cpp"
token  = "--budget-ms"
note   = "THE MUTATION THIS CRITERION OWES THE DAY IT GOES GREEN, declared now rather than then. It is RED as written — the take costs about 114 ms a frame against 16.7 — so `falsify.prove` takes the `red in the tree` route and runs no mutation at all; what makes TODAY's red trustworthy is `_inspect_samples`, which refuses a sample name no `samples/*/CMakeLists.txt` declares and would have refused this criterion outright in the state the gate found it. When the three bands move into shaders and the budget is met, `reconcile` demands an ordinary mutation proof before the ladder will take the green, and this is it: rename the flag the sample parses and the run exits 2 at `unknown argument` instead of printing a measured verdict, so the criterion goes red again. Renaming `OVER the budget` was rejected — the criterion reads the sample's exit code and not its words, so that mutation would change nothing and be recorded as one that cannot fail."
[[criterion]]
id = "world-budget-on-a-device"
describe = "the world demo stays inside 16.7 ms for every frame of the 64-frame day/night cycle while a real graphics device draws it, MEASURED ON A QUIET HOST. The rendered path must dispatch terrain field shading, cloud composition, and temporal foam once per frame, emit frame images, report zero RHI validation errors, and fail if a required dispatch or rendered-output manifest is absent. THE QUIET HOST IS PART OF THE CLAIM because a frame budget on a loaded machine measures the machine: this binary held at 10.8 ms worst alone on the host and missed at 58 to 286 ms beside 24 spinning processes. `--quiet-host` waits up to ten minutes before the take for every other process together to use at most two cores and for CPU pressure to stay at or under 10%, then judges the take again a second at a time, with this program's own CPU time subtracted, and requires its BUSIEST second to be quiet too, since one busy second is enough to make the worst frame. A host that is not quiet FAILS the criterion with a `host too busy:` reason and its numbers; it is never a pass and never a skip. `smoke.world_quiet_host_before` and `smoke.world_quiet_host_across` prove each check is live by loading the host on purpose"
source = "tasks 1.2, ROADMAP M11.a exit criteria"
kind = "command"
run = '''
set -eo pipefail
work="$(mktemp -d)"
trap 'rm -rf "$work"' EXIT
mkdir -p "$work/frames"
just run-sample world --seed 20260913 --seconds 8 --fps 8 --frames "$work/frames" --budget-ms 16.7 --quiet-host
'''
# DECLARED, NOT LEFT TO DERIVATION: the body is underivable today and so runs alone anyway, but a
# quiet host is this criterion's premise and it must not start running beside other criteria the day
# the body becomes derivable.
needs = ["exclusive"]
requires = "gpu"
reason = "the measurement with a device drawing needs one; `world-budget-headless` above carries the same claim on every machine, which is M8.c's rule that no claim is judgeable only where a GPU is"
timeout_s = 3600
ci_job = "milestone-m11a"


[criterion.falsifies]
mutate = "rename-token"
target = "samples/10-world/main.cpp"
token  = "--budget-ms"
note   = "the same mutation as the headless criterion above and owed for the same reason: this one is red because the frame costs about 128 ms with the draw included, and the day it is not, the ladder asks for a mutation that turns it back red before it will take the green."

# --- Section 3: the sky's write path, and the consumers the requirement names ----------------------
[[criterion]]
id = "sky-field-consumed-outside-the-sky"
describe = '''ILLUMINATION READS THE CLOUD SHADOW FIELD, AND THE TWO ANSWERS DIFFER. CLOSED AT M11.c. `m10:sky-field-round-trip` is about the write path; this is the half that gap does NOT check — `atmosphere-sky-and-clouds` says the field is consumed by terrain, foliage, water and illumination, and at M10 nothing outside `src/rendering/sky/` read it at all. **WHAT THIS CRITERION WAS UNTIL M11.c WAS A `grep -rln`**, and M11.a/b gate classified the shape: presence-only, nothing built is run, no two observations compared, so it goes red for a word and not for a defect — and a word is all it would have taken to turn green. **WHAT IT IS NOW IS A RUN.** `integration.render_illumination_clouds` builds a real `CloudWeatherMap`, produces a real field, searches the written ground THROUGH `rendering::cloud_shadow_at` for the darkest and the brightest cell — found rather than chosen, because M10 dug exactly that hole with twenty-five hand-picked probes on ground that is genuinely in full sun — and runs `apply_cloud_shadows` at both. This criterion reads the two numbers it prints and REQUIRES THEM TO DIFFER: `authored 100000 lux, shaded 10980.4 lux, lit 100000 lux`. A consumer that read the field and ignored it, or a sampler that answered its declared default, makes the shaded and the lit answer the same number and this goes red. The grep is kept as a cheap precondition — the consumer must be under `src/` and outside the sky and outside a test directory — but it is no longer the verdict.'''
source = "tasks 1.3, atmosphere-sky-and-clouds (Cloud shadows); M11.c task 5.2"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null

# THE PRECONDITION, AND IT IS NO LONGER THE VERDICT. TESTS AND COMMENTS ARE NOT CONSUMERS: the first
# version of this check counted src/rendering/material/tests/test_slang_program.cpp, which compiles
# `cy.cloud_shadow` and never reads the field. So: no test directories, and the match must be a CALL.
readers=$(grep -rln "cloud_shadow_field_id\|CloudShadowField::sample" \
    --include='*.cpp' --include='*.h' src/ \
    | grep -v "^src/rendering/sky/" | grep -v "/tests/" || true)
count=$(printf '%s' "$readers" | grep -c . || true)
echo "$count file(s) outside src/rendering/sky/ read the cloud shadow field:"
printf '%s\n' "${readers:-  none}"
test "$count" -ge 1 || {
    echo "  nothing outside the sky calls the field's sampler, so there is no consumer to run"
    exit 1
}

# THE VERDICT: run the consumer and compare two answers.
binary="$d/cy_test_integration_render_illumination_clouds"
test -x "$binary" || { echo "no $binary — illumination has no suite that reads the field"; exit 1; }
out="$("$binary" 2>&1)" || { printf '%s\n' "$out" | tail -40; echo "the illumination consumer suite FAILED"; exit 1; }
if ! line="$(printf '%s\n' "$out" | grep -o 'illumination through the cloud shadow field: .*' | head -1)"; then line=""; fi
test -n "$line" || { echo "the consumer case printed nothing — it has been renamed, skipped or deleted"; exit 1; }
echo "$line"
printf '%s\n' "$line" | python3 -c '
import re, sys
line = sys.stdin.read()
found = re.search(r"authored ([0-9.eE+-]+) lux, shaded ([0-9.eE+-]+) lux, lit ([0-9.eE+-]+) lux", line)
if not found:
    sys.exit("the consumer line no longer reports an authored, a shaded and a lit illuminance")
authored, shaded, lit = (float(found.group(index)) for index in (1, 2, 3))
if authored <= 0.0:
    sys.exit("the sun this case shades is dark before the cloud reaches it: nothing is being measured")
if shaded >= lit:
    sys.exit(f"the sun under the darkest cloud the producer wrote delivers {shaded} lux and the sun "
             f"in the open delivers {lit}: illumination declares the field as a consumer and does "
             f"not read it, or the sampler answers its declared default")
print(f"illumination reads the field: {shaded} lux under the cloud against {lit} lux beside it, "
      f"{100.0 * (1.0 - shaded / lit):.1f}% darker")
'
'''
ci_job = "milestone-m11a"

[criterion.falsifies]
mutate = "delete-lines"
target = "src/rendering/lighting/src/cloud_shadow.cpp"
token  = "light.intensity *= report.transmittance;"
note   = "the claim is that ILLUMINATION READS the field rather than declaring that it does. The mutation deletes the one line that applies what it read — the consumer still samples, still reports a transmittance, still compiles, and the sun it hands back is the sun it was given. That is precisely the state M10 left the tree in with four consumers declared to the registry and none of them sampling, and it is what the grep this criterion used to be could not tell apart from a working one. Watched: shaded and lit both read 100000 lux and the criterion says so by name."

[[criterion]]
id = "sky-field-round-trips"
describe = "the two assertions parked in `src/rendering/sky/tests/test_cloud_shadows.cpp` are restored as the check and pass: a producer that reports writing darkened tiles is read back darkened. The parked assertions are the evidence that the defect was known and the test was loosened rather than the code fixed, so restoring them is the closure and not a new test. THE SUITE NAMED HERE WAS WRONG WHEN THIS LEDGER WAS WRITTEN — test_cloud_shadows.cpp is `integration.render_sky_fields`, and `unit.render_sky` is test_sky.cpp, which does not name the cloud shadow field at all. A criterion that runs a suite not containing the file it greps can go green over the defect it exists for, so it runs the right suite and READS THE NUMBERS, exactly as `m10:sky-field-round-trip` does: a case that is renamed or skipped prints no round-trip line and fails on its absence rather than on the suite's exit code"
source = "tasks 1.3, src/rendering/sky/tests/test_cloud_shadows.cpp"
kind = "command"
run = '''
set -eo pipefail
parked=$(grep -c "parked\|M11\|disabled" src/rendering/sky/tests/test_cloud_shadows.cpp || true)
echo "$parked line(s) in test_cloud_shadows.cpp still mention a parked or deferred assertion"
test "$parked" -eq 0
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
out="$(ctest --test-dir "$d" -R '^integration.render_sky_fields$' -V 2>&1)" || { printf '%s\n' "$out" | tail -40; exit 1; }
# `if !` RATHER THAN A BARE ASSIGNMENT, and the next line is the reason. Under `set -eo pipefail` a
# command substitution whose pipeline ends in a grep that matched nothing makes the ASSIGNMENT fail,
# so the shell exits at this line and the message below — the one that says which of the ways this
# criterion can fail actually happened — is never printed. Watched: with the round-trip line renamed
# in the suite, this criterion went red with no output after its first echo.
if ! line="$(printf '%s\n' "$out" | grep -o 'through the store: .*' | head -1)"; then line=""; fi
test -n "$line" || { echo "the round-trip case printed nothing — it has been renamed, skipped or deleted"; exit 1; }
echo "$line"
printf '%s\n' "$line" | python3 -c '
import re, sys
line = sys.stdin.read()
found = re.search(r"([0-9]+) samples, lowest ([0-9.eE+-]+), highest ([0-9.eE+-]+)", line)
if not found:
    sys.exit("the round-trip line no longer reports a sample count, a lowest and a highest")
count, lowest, highest = int(found.group(1)), float(found.group(2)), float(found.group(3))
if count == 0:
    sys.exit("no cell the producer wrote resolved through the store: nothing was published")
if lowest >= 0.99 or highest - lowest <= 0.01:
    sys.exit(f"{count} cells read back with a lowest of {lowest} and a spread of {highest - lowest}: "
             f"the producer computes a cloud shadow and nothing readable reaches the substrate")
print(f"the cloud shadow reaches the substrate: {count} cells, lowest {lowest}, spread {highest - lowest}")
'
'''
ci_job = "milestone-m11a"

# --- Section 4: one `vegetation-potential` --------------------------------------------------------
#
# A modelling decision across two rows before it is a code change. `weather-and-wind` owns macro
# ecosystem state including vegetation density; `FoliageSystem::register_producer()` declares and
# claims a `vegetation` field of its own. Whether those are one quantity with two names is the
# question, and `integration.standard_fields` goes red on purpose the day it is answered, because it
# asserts the KNOWN state rather than the desired one.

[criterion.falsifies]
mutate = "rename-token"
target = "src/rendering/sky/tests/test_cloud_shadows.cpp"
token  = "through the store"
note   = "M7's defect was a sky test asserting against the PRODUCER's own statistics instead of the store, and the line this renames is the one the corrected case prints after reading the substrate back THROUGH the store. Renaming it takes the criterion red at `the round-trip case printed nothing — it has been renamed, skipped or deleted`, which is the half that no other criterion covers. A mutation cannot be derived here: the derivable one is the `parked|M11|disabled` grep, whose tokens are — correctly — absent from the file, so it would change nothing and be reported as a criterion naming a token that is not there."

[[criterion]]
id = "both-producers-register"
describe = "a project that registers `cy::foliage`'s and `cy::weather`'s producers STARTS. Today `vegetation-potential` is declared UNorm8/Static/Presentation-side by one and UNorm16/SlowlyVarying/Authoritative by the other, `FieldRegistry::declare()` refuses the second in either order, and the project fails at startup. The case composes both in both directions, because a fix that works in one order is a fix to the order"
source = "tasks 1.4, environment-fields (One producer per field)"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
# TWO PLACES, because `cy_add_test` puts a suite's binary where the CMakeLists.txt that declares it
# lives: tests/integration/ declares this one from its own directory, while the suites declared by a
# deferred call from the top level land at the build root. Naming only one of them made this
# criterion fail with "the suite does not exist" over a suite that was built and green — a red for
# the wrong reason, which is as unreadable as a green for the wrong reason.
binary="$d/tests/integration/cy_test_integration_standard_fields"
test -x "$binary" || binary="$d/cy_test_integration_standard_fields"
test -x "$binary" || { echo "no cy_test_integration_standard_fields under $d — the suite integration.standard_fields does not exist"; exit 1; }
filter='both producers register in both directions*'
out="$("$binary" "-tc=$filter" 2>&1)" || { echo "$out"; echo "the named case(s) FAILED"; exit 1; }
echo "$out" | tail -3
selected=$(printf '%s' "$out" | sed -nE 's/.*test cases: *([0-9]+) \|.*/\1/p' | head -1)
echo "the filter selected ${selected:-0} case(s) of the 1 it names"
test "${selected:-0}" -ge 1 || { echo "the named case(s) are not in integration.standard_fields any more — renamed, deleted, or the filter is stale"; exit 1; }
'''
ci_job = "milestone-m11a"

