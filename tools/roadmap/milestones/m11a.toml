# --- Section 9: the four rows whose Working tier no criterion evaluates ----------------------------
#
# `m9:record-matches-plan-history` now closes at M11.e, because it cannot pass until the last of its
# four rows is evaluated AND recorded, and two of the four are M11.d's rows and two are M11.e's. What
# THIS rung owes is the first half: criteria that EVALUATE the rows, so that the tier a later rung
# records is one something re-checks. A tier written into a record nothing re-checks is the defect the
# gap is about, one level down.
#
# TASKS 5.1 AND 5.2, AND WHY THE FOUR BELOW READ THE MATRIX RATHER THAN THE SPECIFICATION.
# `docs/roadmap/capability-matrix.md` already writes out, per row, the evidence its Working claim was
# argued from — "the evidence below is what such criteria would have to assert", in its own words. So
# each criterion re-checks THAT argument against this tree rather than deriving a new one: a check
# whose subject drifts away from the claim it was written for is the same defect one more level down.
# `tools/roadmap/row_evidence.py` is the one place the four arguments live, quoted at each check.
#
# WHAT THEY ARE NOT. None of them records a tier and none of them touches `docs/roadmap/status.yaml`.
# `delivery-roadmap` makes recording a closing gate's act and M11.a's design §7 says so in as many
# words; the four Complete cells stay at M11.d and M11.e where the work that earns them is scoped.
# What this rung owes is that the Working tier a later rung records is one something can contradict.

known_gap = "DECLARED AT M11.c's GATE-FINDINGS PHASE AND NOT BY THE RUNG THAT OWNS IT. This criterion was RED when `milestone-m11a` was flipped to `state = \"green\"` in gates.toml, and nobody declared it; `tools/roadmap/falsifiability.toml` records the prover's own verdict for it as `red against a built tree`, which is the verdict a criterion earns by never having been watched passing. The declaration is the WEAKER of the two honest remedies and it is the only one this phase may take: the stronger one is reverting milestone-m11a to `joins-on-close`, and a closed milestone's gate belongs to the Close phase. Re-run on 2026-09-17 against build/m11c-record: `unit.audio_acoustics` is registered with 31 cases and the filter `steam audio simulates*` selects 0 of them. `src/audio/src/acoustics.cpp`'s `SteamAudioBackend::simulate` still returns `NotImplemented` under a comment that says in as many words IT IS NOT WRITTEN, and the four upstream dependencies M8.c costed have still never been fetched. THIS IS THE SECOND RUNG THIS ONE DEFECT HAS OUTLIVED: `m8c:steam-audio-configures` named M11.a as the rung that closes it, M11.a closed without closing it, and that gap is re-pointed at M11.e in the same act as this declaration. M11.e owns `thirdparty-dependencies` to Complete and is the only rung allowed to record a deferral, which is the honest second outcome here — `audio`'s own requirement that content SHALL NOT depend on Steam Audio being present is already satisfied by FallbackAcoustics, so a deferral costs the engine nothing and a Complete cell over a backend returning NotImplemented would cost it the record."
known_gap_closes = "m11e"
known_gap_declared_by = "m11c"

