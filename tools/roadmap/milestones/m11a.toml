[[criterion]]
id = "the-four-rows-are-evaluated"
describe = "each of `testing-and-quality`, `build-system-and-platforms`, `developer-workflow-and-just` and `thirdparty-dependencies` is evaluated by a criterion THIS LEDGER ACTUALLY RUNS which DECLARES that it evaluates the row, is expected above `seed` by some ledger, and IS EVALUATED BEFORE IT IS RECORDED — no rung that expects the row above `seed` comes before the rung that evaluates it, and the tier the record holds today is not ahead of the evaluation either. **THE FIRST HALF WAS REFUTED AT M11's GATE AND THIS IS THE REPAIR**: it asked whether the row's name appeared in a criterion's `source`, and `source` is a CITATION — eight criteria in this plan cite `testing-and-quality` because that specification governs them, seven cite `developer-workflow-and-just` — so deleting either row's evaluator left the guard green with bystanders standing in for it, and the gate said so: it \"cannot detect the deletion of two of the four evaluators\". The question is now asked of `criterion.evaluates`, a field only the evaluating criterion declares, through `criteria.evaluators` so that no caller can re-invent it as a substring of prose. The `ACTUALLY RUNS` half is the second repair, from the first time this check passed: it went green on criteria declared in m11d and m11e, which `criteria.build_plan` does not put in M11.a's plan at all — a row `evaluated` by something that will not execute until two rungs after the tier is recorded. It reads the plan rather than the directory for that reason"
source = "tasks 5.1, delivery-roadmap (A recorded tier is evaluated by a criterion)"
kind = "command"
run = '''
set -eo pipefail
python3 - <<'CHECK'
import pathlib, sys, tomllib
sys.path.insert(0, "tools/roadmap")
import criteria, gates, record
# FOUR LEGS PER ROW, AND EACH IS A DIFFERENT WAY THE SAME CLAIM HAS ALREADY FAILED.
#
# ONE: something in THIS LEDGER'S PLAN declares that it evaluates the row. `criterion.evaluates`
# rather than a substring of `criterion.source`, because `source` is a citation and citations are
# what made this check green over two deleted evaluators; `build_plan` rather than the directory,
# because a criterion declared in m11d is not a check this rung runs, however well it reads.
#
# TWO: a tier expectation ABOVE `seed` somewhere on the ladder, because `criteria._check_tiers`
# treats an exit tier as a FLOOR and a `seed` expectation can never contradict a Working claim.
# That half reads every ledger, including the rungs that will record the tier.
#
# THREE: THE RECORDING NEVER PRECEDES THE EVALUATION. A floor is what a later gate is held to, so
# every rung declaring one must sit at or after the rung whose criterion evaluates the row. This is
# the ordering `m9:record-matches-plan-history` was re-declared for: M10 recorded four tiers no
# criterion evaluated and M10's own gate put the record back.
#
# FOUR: the same rule against the record as it stands. A row the record holds above `seed` names the
# milestone that advanced it, and that milestone may not come before the rung that evaluates it.
ROWS = ("testing-and-quality", "build-system-and-platforms",
        "developer-workflow-and-just", "thirdparty-dependencies")
RANK = {"seed": 0, "working": 1, "complete": 2}
LADDER = {rung: index for index, rung in enumerate(record.MILESTONES)}

plan = criteria.build_plan("m11a", gates.permanent_milestones(gates.load()))
declares_anywhere = {row: [] for row in ROWS}
floors = {row: [] for row in ROWS}
for path in sorted(pathlib.Path("tools/roadmap/milestones").glob("*.toml")):
    for declaration in criteria.load(path.stem).criteria:
        for row in declaration.evaluates:
            if row in declares_anywhere:
                declares_anywhere[row].append(path.stem)
        if declaration.kind != "tiers":
            continue
        for row, tier in declaration.expect_tiers.items():
            if row in floors and RANK.get(tier, 0) > RANK["seed"]:
                floors[row].append((path.stem, f"{path.stem}:{declaration.id} expects {tier}"))

entries = {entry.capability: entry for entry in record.load()}
short = []
print(f"M11.a's plan is {len(plan.entries)} criteria; these are the ones that DECLARE a row:")
for row in ROWS:
    here = [entry.label for entry in criteria.evaluators(plan.entries, row)]
    earliest = min((LADDER[rung] for rung in declares_anywhere[row]), default=None)
    held = entries.get(row)
    too_early = [why for rung, why in floors[row]
                 if earliest is None or LADDER.get(rung, len(LADDER)) < earliest]
    print(f"  {row}")
    print(f"    runs here:  {', '.join(here) or 'NOTHING IN THIS PLAN DECLARES IT EVALUATES THIS ROW'}")
    print(f"    declared:   {', '.join(sorted(declares_anywhere[row])) or 'no ledger at all'}")
    print(f"    floor:      {'; '.join(why for _rung, why in floors[row]) or 'NO LEDGER EXPECTS IT ABOVE seed'}")
    print(f"    recorded:   {held.tier if held else 'not in the record'} at {held.milestone if held else '-'}")
    if not here:
        short.append(f"{row}: no criterion this ledger runs declares that it evaluates it")
    if not floors[row]:
        short.append(f"{row}: no ledger expects it above seed, so no floor can contradict a claim")
    if too_early:
        short.append(f"{row}: recorded before it is evaluated — {'; '.join(too_early)} "
                     f"but the evaluator is declared at {sorted(declares_anywhere[row]) or 'nowhere'}")
    if held and RANK.get(held.tier, 0) > RANK["seed"] and (
            earliest is None or LADDER.get((held.milestone or "").lower(), -1) < earliest):
        short.append(f"{row}: the record holds {held.tier} from {held.milestone}, "
                     f"which is before the rung that evaluates it")
for line in short:
    print(f"  SHORT {line}")
print(f"{len(short)} shortfall(s) over {len(ROWS)} rows")
sys.exit(1 if short else 0)
CHECK'''
ci_job = "milestone-m11a"
# THE MUTATION IS THE GATE'S OWN COMPLAINT, EXECUTED: take away one evaluator's declaration and the
# row has nothing in this plan that evaluates it. The line deleted is the declaration itself rather
# than the whole criterion, because `delete-lines` is a line-wise verb and half a TOML table is a
# criterion that fails to LOAD — a mutation that kills the tool proves nothing about the subject.
# Deleting each of the four criteria whole is the same mutation by hand, and the change that wrote
# this records that it was done for all four.
[criterion.falsifies]
mutate = "delete-lines"
target = "tools/roadmap/milestones/m11a.toml"
token = 'evaluates = ["testing-and-quality"]'

