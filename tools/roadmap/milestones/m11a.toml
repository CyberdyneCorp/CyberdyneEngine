[[criterion]]
id = "save-inspector"
describe = "a save can be inspected and diffed. `Save diagnostics and inspection` asks what is in a save, why a field is in it, and what changed between two of them. `cy/save/inspect.h` answers all three through the engine's own loader, and this criterion runs both halves of it: the `a save is inspected*` and `a semantic diff*` cases of `unit.save`, which hold the inspector to a committed three-generation fixture save, and `cy_save_inspect` itself over that fixture — its entity counts, one `why` line per saved field and entry, and the semantic diff of its last two generations"
source = "save-and-persistence (Save diagnostics and inspection), src/save/README.md, openspec/changes/close-save-system-gaps"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
binary="$d/cy_test_unit_save"
test -x "$binary" || { echo "no $binary — the suite unit.save does not exist"; exit 1; }
filter='a save is inspected*,a semantic diff*'
out="$("$binary" "-tc=$filter" 2>&1)" || { echo "$out"; echo "the named case(s) FAILED"; exit 1; }
echo "$out" | tail -3
selected=$(printf '%s' "$out" | sed -nE 's/.*test cases: *([0-9]+) \|.*/\1/p' | head -1)
echo "the filter selected ${selected:-0} case(s) of the 7 it names"
test "${selected:-0}" -ge 7 || { echo "the named case(s) are not in unit.save any more — renamed, deleted, or the filter is stale"; exit 1; }
tool="$d/tools/save/cy_save_inspect"
test -x "$tool" || { echo "no $tool — the save inspector's command line was not built"; exit 1; }
fixture=src/save/tests/data/inspect-campaign
shown="$("$tool" show "$fixture" --why)" || { echo "$shown"; echo "cy_save_inspect show FAILED over the committed fixture"; exit 1; }
printf '%s\n' "$shown" | grep -Fx "entities modified=2 created=0 tombstoned=1 fragments=1" || { echo "$shown"; echo "the inspector's counts are not the fixture's"; exit 1; }
why=$(printf '%s\n' "$shown" | grep -c '^why ' || true)
echo "the inspector explained ${why} saved field(s) and entries of the 7 the fixture's newest generation holds"
test "$why" -eq 7
diffed="$("$tool" diff "$fixture@2" "$fixture@3")" || { echo "$diffed"; echo "cy_save_inspect diff FAILED"; exit 1; }
printf '%s\n' "$diffed"
printf '%s\n' "$diffed" | grep -q '^diff entity-reverted .*entity=10000000000000000000000000000002'
printf '%s\n' "$diffed" | grep -q '^diff field-changed .*entity=1000000000000000000000000000000a component=9402:- field=2:-'
printf '%s\n' "$diffed" | grep -Fxq "diff total=6"
'''
