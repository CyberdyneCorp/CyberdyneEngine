# M11.a — Foundations: the exit criteria of the first of M11's five rungs.
#
# WHY THIS FILE EXISTS AT ALL, which is the same sentence as "why M11 is five rungs".
# `implement-m11-reach` task 0.1 answered the question the capability matrix had carried since M6.
# M11 completed SIXTY-FIVE of seventy-six capabilities behind ONE closing artefact, seventeen of them
# arriving at M10's gate because a gate refused a claim rather than because anyone planned the work
# there. M8's split rule is about RISK; this one is about JUDGEMENT — a milestone whose scope cannot
# be judged by one closing artefact is several milestones sharing a number, because a gate that
# cannot name what it is looking at is not a gate.
#
# THIS RUNG IS THE DEBTS. Seven declared gaps named `m11` as the rung that closes them; six now name
# `m11a` and one names `m11e`, and every one of them is a criterion that RUNS and FAILS today. The
# rule they are under has not changed: a declared gap that starts PASSING fails the ledger until its
# declaration is deleted, so none of the seven can be quietly fixed and none can be quietly forgotten.
#
# THE ORDER MATTERS AND IS NOT A PREFERENCE. Nothing downstream of this rung is credible while the
# gaps are open: an editor rung authoring content into a world that costs 122 ms a frame against
# 16.7 is authoring into a world nobody can ship, and an image rung tuning a picture that no shader
# samples the environment through is tuning the wrong thing.
#
# WHAT IS NOT A CRITERION HERE. The spike — port the 63.0 ms substrate band to a shader and measure
# it before scoping the other two — is not one: `docs/roadmap/risks.md` says a spike may not be
# merged and its only deliverable is a decision, consumed in design.md §1 where the rows that depend
# on it can read it. What IS checkable is the shader the spike produces, and `field-sampler-written`
# below is that.

schema = 1
id = "m11a"
name = "Foundations"
artefact = "the M10 world demo inside a 16.7 ms budget on a device, with the environment substrate sampled in a shader rather than re-sampled at every terrain vertex on the processor, the world streaming rather than resident, and the ledger reporting each of the seven inherited gaps either closed with its declaration deleted or still red with the reason it did not close here."

notes = [
    "`just roadmap-milestone m11a` is this recipe, so it cannot be one of the criteria it evaluates.",
    "THE STATIC GATES ARE SPELLED HERE EXACTLY AS THE LEDGERS BELOW SPELL THEM, and that is deliberate: `criteria.fingerprint` collapses declarations that run the same command under the same conditions, so `specs`, `format`, `lint`, `layering`, `workflows`, `generated-code`, `roadmap-record`, `plan-consistency` and `four-profiles` are ONE check each however many rungs declare them. A rung that re-worded a `run` string would double the work and multiply its own failure probability by the number of ledgers naming it, which is the defect `_check_flat_ledger` exists to catch.",
    "tasks 9.3 — the handover criterion. `m11b-open` below is NOT `kind = \"path\"` over `openspec/changes/**/*m11b*/proposal.md`, and the reason is the split itself: all five rung changes were opened together, so that path exists ALREADY and the criterion would pass the moment it was written. A criterion that cannot go red is not a criterion. The double-star glob is kept as the search — the same shape, matching an open change and an archived one alike — and what it asks is ENTRY rather than existence: the next rung's change exists AND somebody has deliberately entered it. `implement-m11-reach` task 0.1 records that decision for all five rungs, so the ladder has one handover check rather than five different ones.",
    "THE SEVEN INHERITED GAPS ARE NOT RE-DECLARED HERE WITH THE SAME `run` STRINGS. They live in m8c.toml, m9.toml and m10.toml, they are in the permanent set this ledger inherits once those gates are green, and they still run on every evaluation. Restating one here would collapse into the original declaration and report nothing new. What this file declares instead is the STRONGER claim each gap's closure is supposed to produce — a sampler with consumers rather than a non-zero count of shader modules, a budget held across a cycle rather than a single measurement — so that closing a gap and satisfying this rung are two different bars.",
    "tasks 10.x — the gate itself. A milestone cannot make passing its own gate one of the criteria that gate evaluates.",
    "`just quality-requirements` DOES NOT EXIST YET AND THE CRITERIA THAT CALL IT WILL SAY SO. `testing-and-quality` requires every requirement to map to a test, a gate or a recorded exemption, and the tool that checks it is one of that row's four absent gates — the row is M11.d's. It is named here rather than avoided because the mapping IS the Complete-grade claim these rows are being judged on: whichever rung reaches it first writes the tool, and M11.d is where it is finished. A criterion that names an absent recipe fails loudly with the recipe's name in it, which is the honest red.",
]

