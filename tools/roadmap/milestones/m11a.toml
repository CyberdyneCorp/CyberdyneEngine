describe = "the status record is at this rung's exit tiers: twelve rows from Working to Complete. IT FAILS UNTIL THE CLOSING CHANGE WRITES THEM, AND IT IS MEANT TO — M8.a's and M8.b's ledgers declared the identical forcing function and said so in their own notes. A row this rung demotes instead is recorded at Working with its reason, and the expectation below moves to the rung that takes it"
