[[criterion]]
id = "save-benchmark"
describe = "the large-world save benchmark the requirement says the engine SHALL maintain RUNS, stays within its committed baseline, and shows save cost scaling with changes rather than with world size. `benchmarks/save/` measures one autosave — the capture through `cy::world-persistence` and the encoding of every dirty region — over a world of 1 048 576 persistent objects and over one sixteen times smaller, with the same 20 480 dirty records in both; this criterion runs it, compares each body against `benchmarks/baseline.json`, and requires the two bodies to stay within 1.5x of each other"
