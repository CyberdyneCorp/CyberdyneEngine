results="$d/benchmarks/results/cy_bench_save.json"
mkdir -p "$(dirname "$results")"
"$runner" --json "$results"
python3 benchmarks/tools/compare.py --results "$results" --baseline benchmarks/baseline.json
python3 - "$results" <<'CHECK'
import json, sys
measured = {entry["name"]: entry for entry in json.load(open(sys.argv[1]))["benchmarks"]}
large = measured.get("save/autosave-1m-objects")
small = measured.get("save/autosave-64k-objects")
