# --- Section 1: the device-side field sampler, which three of the seven gaps point at --------------
#
# `m10:fields-sampled-on-a-device` asks whether ANY `.slang` module samples an environment field, and
# the answer today is zero of the twenty-six in the tree. That criterion goes green the moment one
# exists. This rung's bar is higher on purpose: the sampler has to agree with the processor's, and
# the consumers the requirement names have to use it, because a shader nobody binds is a file.

[[criterion]]
id = "field-sampler-written"
describe = "`cy/field.slang` exists and is written against the buffer layout `gpu.h` already fixes. `src/environment/`'s README says this module is owed by the first renderer-facing row to sample a field in a shader, and no renderer-facing row has: the fifteen modules under src/rendering/shaders/cy/ are brdf, cluster, color, frame, fullscreen, globals, light, material, noise, packing, particle, sampling, shadow, tonemap and view"
source = "tasks 1.1, environment-fields (CPU and GPU access), src/environment/README.md"
kind = "command"
run = '''
set -eo pipefail
module=src/rendering/shaders/cy/field.slang
if [ ! -f "$module" ]; then
    echo "no $module — the shader-side environment-field sampler does not exist"
    echo "  modules present: $(ls src/rendering/shaders/cy/ 2>/dev/null | tr '\n' ' ')"
    exit 1
fi
echo "$module exists, $(wc -l < "$module") line(s)"
grep -q "FieldImageHeader\|field_image\|kFieldImage" "$module"
'''
ci_job = "milestone-m11a"

[[criterion]]
id = "field-sampler-consumed"
describe = "the sampler is BOUND rather than written: at least two shader modules outside `field.slang` itself sample a field through it. A shader module nothing includes is a file, and `Cloud shadows` requires the field to be consumed by terrain, foliage, water and illumination — four consumers, of which this asks for two before a device is involved"
source = "tasks 1.1, 1.3, environment-fields, atmosphere-sky-and-clouds (Cloud shadows)"
kind = "command"
run = '''
set -eo pipefail
users=$(grep -rl "cy/field.slang\|cy.field" --include='*.slang' src/ 2>/dev/null | grep -v "cy/field.slang" || true)
count=$(printf '%s' "$users" | grep -c . || true)
echo "$count .slang module(s) include the field sampler: ${users:-none}"
test "$count" -ge 2
'''
ci_job = "milestone-m11a"

[[criterion]]
id = "field-device-agrees-with-cpu"
describe = "the device sampler and the processor sampler return the same value at the same positions. `integration.environment_gpu` proves the decode agrees on the processor TWICE — one packer and a second independent decoder — and that is evidence about a layout rather than about a device. This case samples the same field at the same points through both paths and compares"
source = "tasks 1.1, environment-fields (CPU and GPU access)"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
binary="$d/cy_test_integration_environment_gpu"
test -x "$binary" || { echo "no $binary — the suite integration.environment_gpu does not exist"; exit 1; }
filter='the device sampler agrees with the processor*'
out="$("$binary" "-tc=$filter" 2>&1)" || { echo "$out"; echo "the named case(s) FAILED"; exit 1; }
echo "$out" | tail -3
selected=$(printf '%s' "$out" | sed -nE 's/.*test cases: *([0-9]+) \|.*/\1/p' | head -1)
echo "the filter selected ${selected:-0} case(s) of the 1 it names"
test "${selected:-0}" -ge 1 || { echo "the named case(s) are not in integration.environment_gpu any more — renamed, deleted, or the filter is stale"; exit 1; }
'''
requires = "gpu"
reason = "sampling a field in a shader needs a graphics device; on a machine without one the claim is reported NOT EVALUATED rather than passed, because the processor half already passes and would make a green look like agreement"
ci_job = "milestone-m11a"

# --- Section 2: the frame budget, which is the honest headline of M10's artefact -------------------
#
# `m10:world-frame-budget` measures about 122 ms a frame with a device drawing and about 106 ms
# headless, against 16.7 ms — seven times over either way — nearly flat across the day/night cycle,
# with the three largest bands in the same order in both takes. THE CRITERIA HERE ARE TWO, AND THE
# COMPANION WITHOUT A DEVICE IS M8.c's RULE KEPT: nothing a milestone claims should be judgeable only
# on the machines with a GPU in them.

[[criterion]]
id = "world-budget-headless"
describe = "the world demo's headless frame cost is inside 16.7 ms across a full day/night cycle, at a seed the tuning did not use. Headless was 106 ms at M10, so this is the same claim the device criterion makes with the draw removed — and it is the half every machine can judge"
source = "tasks 1.2, ROADMAP M11.a exit criteria"
kind = "command"
run = '''
set -eo pipefail
just run-sample 10-world --headless --seed 20260913 --cycle --budget-ms 16.7
'''
timeout_s = 3600
ci_job = "milestone-m11a"

[[criterion]]
id = "world-budget-on-a-device"
describe = "and with a device drawing. The three bands the gap names — the substrate re-sampled at every terrain vertex at 63.0 ms, the cloud march at 23.2 ms and water's foam field at 12.0 ms — are all three of them work a shipping engine does in a shader, and this is the measurement that says whether moving them there did what the spike predicted"
source = "tasks 1.2, ROADMAP M11.a exit criteria"
kind = "command"
run = '''
set -eo pipefail
just run-sample 10-world --seed 20260913 --cycle --budget-ms 16.7
'''
requires = "gpu"
reason = "the measurement with a device drawing needs one; `world-budget-headless` above carries the same claim on every machine, which is M8.c's rule that no claim is judgeable only where a GPU is"
timeout_s = 3600
ci_job = "milestone-m11a"

