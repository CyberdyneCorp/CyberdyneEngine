# --- Section 3: the sky's write path, and the consumers the requirement names ----------------------

[[criterion]]
id = "sky-field-consumed-outside-the-sky"
describe = "something outside `src/rendering/sky/` reads the cloud shadow field. `m10:sky-field-round-trip` is about the write path — `update` reports writing tiles darker than 0.5 and `sample` returns the declared 1.0 at all twenty-five points inside `radius_metres` — and this is the half that gap does NOT check: the requirement says the field is consumed by terrain, foliage, water and illumination, and at M10 nothing outside that one directory read it at all"
source = "tasks 1.3, atmosphere-sky-and-clouds (Cloud shadows)"
kind = "command"
run = '''
set -eo pipefail
# TESTS AND COMMENTS ARE NOT CONSUMERS, and the first version of this check counted one. It matched
# src/rendering/material/tests/test_slang_program.cpp, which compiles `cy.cloud_shadow` and never
# reads the field — a criterion satisfied by a string in a file is the shape this project has
# shipped five times. So: no test directories, and the match must be a CALL — `cloud_shadow_field_id`
# or `CloudShadowField::sample` — rather than the words appearing anywhere in the file.
readers=$(grep -rln "cloud_shadow_field_id\|CloudShadowField::sample" \
    --include='*.cpp' --include='*.h' src/ \
    | grep -v "^src/rendering/sky/" | grep -v "/tests/" || true)
count=$(printf '%s' "$readers" | grep -c . || true)
echo "$count file(s) outside src/rendering/sky/ read the cloud shadow field:"
printf '%s\n' "${readers:-  none}"
if [ "$count" -lt 2 ]; then
    echo "  `atmosphere-sky-and-clouds` requires the field to be consumed by terrain, foliage,"
    echo "  water and illumination. `CloudShadowField::declare_consumers()` declares all four to"
    echo "  the registry and none of them reads it: a declared consumer that never samples is a"
    echo "  configuration entry, not a consumer."
fi
test "$count" -ge 2
'''
ci_job = "milestone-m11a"

[[criterion]]
id = "sky-field-round-trips"
describe = "the two assertions parked in `src/rendering/sky/tests/test_cloud_shadows.cpp` are restored as the check and pass: a producer that reports writing darkened tiles is read back darkened. The parked assertions are the evidence that the defect was known and the test was loosened rather than the code fixed, so restoring them is the closure and not a new test. THE SUITE NAMED HERE WAS WRONG WHEN THIS LEDGER WAS WRITTEN — test_cloud_shadows.cpp is `integration.render_sky_fields`, and `unit.render_sky` is test_sky.cpp, which does not name the cloud shadow field at all. A criterion that runs a suite not containing the file it greps can go green over the defect it exists for, so it runs the right suite and READS THE NUMBERS, exactly as `m10:sky-field-round-trip` does: a case that is renamed or skipped prints no round-trip line and fails on its absence rather than on the suite's exit code"
source = "tasks 1.3, src/rendering/sky/tests/test_cloud_shadows.cpp"
kind = "command"
run = '''
set -eo pipefail
parked=$(grep -c "parked\|M11\|disabled" src/rendering/sky/tests/test_cloud_shadows.cpp || true)
echo "$parked line(s) in test_cloud_shadows.cpp still mention a parked or deferred assertion"
test "$parked" -eq 0
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
out="$(ctest --test-dir "$d" -R '^integration.render_sky_fields$' -V 2>&1)" || { printf '%s\n' "$out" | tail -40; exit 1; }
line="$(printf '%s\n' "$out" | grep -o 'through the store: .*' | head -1)"
test -n "$line" || { echo "the round-trip case printed nothing — it has been renamed, skipped or deleted"; exit 1; }
echo "$line"
printf '%s\n' "$line" | python3 -c '
import re, sys
line = sys.stdin.read()
found = re.search(r"([0-9]+) samples, lowest ([0-9.eE+-]+), highest ([0-9.eE+-]+)", line)
if not found:
    sys.exit("the round-trip line no longer reports a sample count, a lowest and a highest")
count, lowest, highest = int(found.group(1)), float(found.group(2)), float(found.group(3))
if count == 0:
    sys.exit("no cell the producer wrote resolved through the store: nothing was published")
if lowest >= 0.99 or highest - lowest <= 0.01:
    sys.exit(f"{count} cells read back with a lowest of {lowest} and a spread of {highest - lowest}: "
             f"the producer computes a cloud shadow and nothing readable reaches the substrate")
print(f"the cloud shadow reaches the substrate: {count} cells, lowest {lowest}, spread {highest - lowest}")
'
'''
ci_job = "milestone-m11a"

# --- Section 4: one `vegetation-potential` --------------------------------------------------------
#
# A modelling decision across two rows before it is a code change. `weather-and-wind` owns macro
# ecosystem state including vegetation density; `FoliageSystem::register_producer()` declares and
# claims a `vegetation` field of its own. Whether those are one quantity with two names is the
# question, and `integration.standard_fields` goes red on purpose the day it is answered, because it
# asserts the KNOWN state rather than the desired one.

[[criterion]]
id = "both-producers-register"
describe = "a project that registers `cy::foliage`'s and `cy::weather`'s producers STARTS. Today `vegetation-potential` is declared UNorm8/Static/Presentation-side by one and UNorm16/SlowlyVarying/Authoritative by the other, `FieldRegistry::declare()` refuses the second in either order, and the project fails at startup. The case composes both in both directions, because a fix that works in one order is a fix to the order"
source = "tasks 1.4, environment-fields (One producer per field)"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
# TWO PLACES, because `cy_add_test` puts a suite's binary where the CMakeLists.txt that declares it
# lives: tests/integration/ declares this one from its own directory, while the suites declared by a
# deferred call from the top level land at the build root. Naming only one of them made this
# criterion fail with "the suite does not exist" over a suite that was built and green — a red for
# the wrong reason, which is as unreadable as a green for the wrong reason.
binary="$d/tests/integration/cy_test_integration_standard_fields"
test -x "$binary" || binary="$d/cy_test_integration_standard_fields"
test -x "$binary" || { echo "no cy_test_integration_standard_fields under $d — the suite integration.standard_fields does not exist"; exit 1; }
filter='both producers register in both directions*'
out="$("$binary" "-tc=$filter" 2>&1)" || { echo "$out"; echo "the named case(s) FAILED"; exit 1; }
echo "$out" | tail -3
selected=$(printf '%s' "$out" | sed -nE 's/.*test cases: *([0-9]+) \|.*/\1/p' | head -1)
echo "the filter selected ${selected:-0} case(s) of the 1 it names"
test "${selected:-0}" -ge 1 || { echo "the named case(s) are not in integration.standard_fields any more — renamed, deleted, or the filter is stale"; exit 1; }
'''
ci_job = "milestone-m11a"

# --- Section 5: the one CI job that answers three criteria -----------------------------------------
#
# `m9:lockstep-cross-platform`, `m10:pcg-regeneration-cross-platform` and
# `m10:pcg-gpu-domain-agreement` each look for exactly one shape — a job that publishes one leg's
# digest and compares it with another's — and each fails or reports NOT EVALUATED for want of it. The
# legs already exist: ci.yml's matrices include linux-arm64, macos-arm64 and windows-arm64 and they
# run independently. ONE JOB ANSWERS THREE CRITERIA, and building it once rather than three times is
# most of the reason this rung exists.

[[criterion]]
id = "cross-leg-digest-job"
describe = "THE JOB COMPARES, AND THE CHECK PROVES IT BY RUNNING THE JOB'S OWN COMPARISON. One job publishes a digest from each leg of a four-leg matrix and a second job downloads all of them and compares them; that much a reader can see. What a reader cannot see, and what M11.a's gate correctly refused to take on trust, is whether the command that job runs would NOTICE a disagreement — the first draft of this criterion asked only that one job block contain `upload-artifact`, `download-artifact` and the word `digest`, which a job that moves no bytes and runs `echo` satisfies in three lines. `tools/ci/cross_leg_audit.py` reads the workflow for the publisher, the downloader and the command between them, and then EXECUTES that command against digests it wrote: identical digests from two architectures must pass, and a changed simulation hash, a changed generated world, one leg alone, two legs of one architecture, a digest of zero and an empty workload must each turn it red. The dummy job is fixture one of `--selftest`, beside a publication with no comparison, a comparison that does not `needs:` its publication, a one-leg matrix, a matrix of one runner image, and a job that fails whatever it is given — six shapes that must be refused, checked on every `just ci-check`"
source = "tasks 2.1, simulation-and-determinism (CrossPlatform), procedural-content-generation"
kind = "command"
run = "python3 tools/ci/cross_leg_audit.py --claim job"
ci_job = "milestone-m11a"

# WHAT MUST BREAK IT: deleting every `download-artifact` line from ci.yml leaves the legs
# publishing into artefacts nothing collects, which is the state this rung found and the state
# the word-grep could not tell from the state it built. `just roadmap-falsify` applies that to a
# sandboxed copy of the tree and requires this criterion to go RED on it.
[criterion.falsifies]
mutate = "delete-lines"
target = ".github/workflows/ci.yml"
token = "download-artifact"
note = "the download step removed: four legs publish a digest and no job collects them"

[[criterion]]
