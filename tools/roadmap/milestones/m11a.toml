# --- Section 7: `save-and-persistence`, re-scoped before it is implemented -------------------------
#
# Demoted at M9 and again at M10, so by `delivery-roadmap`'s own rule it is MIS-SCOPED RATHER THAN
# LATE and is re-scoped through a change against its own specification before it is recorded either
# way. Read requirement by requirement the row is nine satisfied, three unmet, eight partial — eleven
# pieces of work rather than the two M9 named. THE FOUR BELOW ARE THE FOUR THAT ARE CHECKABLE WITHOUT
# JUDGEMENT; the rest are ordinary requirements the tier floor covers.

[[criterion]]
id = "save-inspector"
describe = "a save can be inspected and diffed. `Save diagnostics and inspection` asks what is in a save, why a field is in it, and what changed between two of them; there is no inspector in the tree and no semantic diff"
source = "save-and-persistence (Save diagnostics and inspection), src/save/README.md"
kind = "command"
run = '''
set -e
d="${CY_BUILD_DIR:-build/dev}"
just build-engine --profile dev > /dev/null
binary="$d/cy_test_unit_save"
test -x "$binary" || { echo "no $binary — the suite unit.save does not exist"; exit 1; }
filter='a save is inspected*,a semantic diff*'
out="$("$binary" "-tc=$filter" 2>&1)" || { echo "$out"; echo "the named case(s) FAILED"; exit 1; }
echo "$out" | tail -3
selected=$(printf '%s' "$out" | sed -nE 's/.*test cases: *([0-9]+) \|.*/\1/p' | head -1)
echo "the filter selected ${selected:-0} case(s) of the 2 it names"
test "${selected:-0}" -ge 2 || { echo "the named case(s) are not in unit.save any more — renamed, deleted, or the filter is stale"; exit 1; }
