# THE LADDER'S HANDOVER CHECK, AND WHY IT IS NOT `kind = "path"`.
#
# Every rung since M8.a has closed by opening the next one, checked by a `kind = "path"` criterion
# over `openspec/changes/**/*<next>*/proposal.md`. The double-star glob is the point and m6.toml's
# comment says why: a change lives at `openspec/changes/<name>/` while it is open and at
# `openspec/changes/archive/<date>-<name>/` once it closes, so a pattern matching only an open change
# would turn red on the day the next milestone closed.
#
# THE SPLIT BREAKS THAT CRITERION IN ONE SPECIFIC WAY. M11's five rung changes were opened TOGETHER,
# so `openspec/changes/implement-m11b-authoring/proposal.md` exists already and a `kind = "path"`
# criterion over it would pass the moment it was written and could never go red. A criterion that
# cannot fail is not a criterion. So the glob is kept as the SEARCH — same shape, matching an open
# change and an archived one alike — and what is asked of the result is ENTRY rather than existence:
# somebody has deliberately started the next rung. `implement-m11-reach` task 0.1 records this for
# all five rungs, so the ladder has one handover check rather than five different ones.
[[criterion]]
id = "m11b-open"
describe = "the next rung's change exists — open, or closed and archived — AND has been deliberately entered, which after a simultaneous split is what 'opened' has to mean. That rung is M11.b, Authoring: the editor off Seed and a real game made in it, which `record.MILESTONES` carries after m11a"
source = "tasks 9.3, 9.7, implement-m11-reach task 0.1, delivery-roadmap"
kind = "command"
run = '''
set -eo pipefail
# the double-star glob the ladder has used since M8.a: openspec/changes/**/*m11b*/proposal.md
dirs=$(find openspec/changes -type d -name '*m11b*' | sort)
test -n "$dirs" || { echo "no change directory matching openspec/changes/**/*m11b*/"; exit 1; }
entered=""
for d in $dirs; do
    test -f "$d/proposal.md" || continue
    echo "  $d/proposal.md"
    # A CHECKED TASK OUTSIDE SECTION 0, and the exclusion is the point. Section 0 is a rung's own
    # decision-and-spike section, which the split that opened all five rungs could answer in advance;
    # a checked box there says the rung was SCOPED. A checked box in the body says the rung was
    # STARTED, which is the deliberate act this criterion is standing in for.
    if [ -f "$d/tasks.md" ] && grep -qE '^- \[x\] [1-9]' "$d/tasks.md"; then
        entered="$entered $d"
    fi
done
if [ -z "$entered" ]; then
    echo "the next rung's change exists and nobody has entered it: no task outside its section 0 is checked."
    echo "  The five rung changes were opened together by the split, so existence alone cannot go red;"
    echo "  what this criterion asks is that the ladder continues as a deliberate act."
    exit 1
fi
echo "entered:$entered"
'''
ci_job = "milestone-m11a"

[[criterion]]
id = "ladder-carries-five-rungs"
describe = "the split is applied in every place that reads it, and not in four of the five. `record.MILESTONES` carries m11a … m11e in position and no longer carries `m11`; each has a ledger, a gate and a floor in `selftest.MINIMUM_CRITERIA`; and the matrix has five M11 columns. M8's split found THREE readers that silently dropped its new columns, and this is the check that would have caught all three"
source = "tasks 9.2, implement-m11-reach task 0.1, delivery-roadmap (An inserted milestone's rung is checked)"
kind = "command"
run = '''
set -eo pipefail
python3 - <<'CHECK'
import pathlib, sys, tomllib
sys.path.insert(0, "tools/roadmap")
import plan as plan_module
import record as record_module
import selftest as selftest_module
rungs = ("m11a", "m11b", "m11c", "m11d", "m11e")
problems = []
order = record_module.MILESTONES
if "m11" in order:
    problems.append("record.MILESTONES still carries `m11` beside the five rungs")
for rung in rungs:
    if rung not in order:
        problems.append(f"record.MILESTONES omits {rung}")
    if not (pathlib.Path("tools/roadmap/milestones") / f"{rung}.toml").is_file():
        problems.append(f"no ledger for {rung}")
    if rung not in selftest_module.MINIMUM_CRITERIA:
        problems.append(f"selftest.MINIMUM_CRITERIA has no floor for {rung}")
gates = tomllib.loads(pathlib.Path("tools/roadmap/gates.toml").read_text(encoding="utf-8"))
declared = {gate.get("milestone") for gate in gates["gate"]}
for rung in rungs:
    if rung not in declared:
        problems.append(f"gates.toml declares no milestone gate for {rung}")
columns = plan_module.read_matrix().milestones
for rung in rungs:
    if rung not in columns:
        problems.append(f"the capability matrix has no {rung} column")
for problem in problems:
    print(f"  {problem}")
print(f"{len(problems)} problem(s) with the five-rung ladder")
sys.exit(1 if problems else 0)
CHECK
'''
ci_job = "milestone-m11a"
