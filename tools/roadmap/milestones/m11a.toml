'''
ci_job = "milestone-m11a"

# --- Section 5: the one CI job that answers three criteria -----------------------------------------
#
# `m9:lockstep-cross-platform`, `m10:pcg-regeneration-cross-platform` and
# `m10:pcg-gpu-domain-agreement` each look for exactly one shape — a job that publishes one leg's
# digest and compares it with another's — and each fails or reports NOT EVALUATED for want of it. The
# legs already exist: ci.yml's matrices include linux-arm64, macos-arm64 and windows-arm64 and they
# run independently. ONE JOB ANSWERS THREE CRITERIA, and building it once rather than three times is
# most of the reason this rung exists.

[[criterion]]
id = "cross-leg-digest-job"
describe = "a continuous-integration job publishes one leg's digest and downloads another's to compare them. The check reads the workflows rather than trusting a name: a job that uploads an artefact and never downloads one from a second leg is a publication, not a comparison"
source = "tasks 2.1, simulation-and-determinism (CrossPlatform), procedural-content-generation"
kind = "command"
run = '''
set -eo pipefail
python3 - <<'CHECK'
import pathlib, re, sys
comparing = []
for path in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
    text = path.read_text(encoding="utf-8")
    for block in re.split(r"\n(?=  [A-Za-z0-9_-]+:\n)", text):
        name = block.strip().split(":", 1)[0].strip()
        lowered = block.lower()
        if "upload-artifact" in lowered and "download-artifact" in lowered and "digest" in lowered:
            comparing.append(f"{path.name}:{name}")
print(f"{len(comparing)} job(s) publish one leg's digest and compare another's: {comparing or 'none'}")
if not comparing:
    print("  three criteria in three ledgers look for this one job: m9:lockstep-cross-platform,")
    print("  m10:pcg-regeneration-cross-platform and m10:pcg-gpu-domain-agreement. The legs exist")
    print("  and run independently; the comparison between them does not.")
sys.exit(0 if comparing else 1)
CHECK
'''
ci_job = "milestone-m11a"

[[criterion]]
id = "lockstep-agrees-across-architectures"
describe = "and the digests AGREE. The job existing is one claim and the answer it returns is another: a disagreement between two architectures is a FINDING this rung reports, not a failure it hides, and the criterion exists to be capable of going red on it"
source = "tasks 2.1, simulation-and-determinism (CrossPlatform)"
kind = "command"
run = "just test-determinism --compare-legs"
where = "ci"
reason = "this host has one architecture and one operating system, so the comparison cannot be made here at all; it is reported NOT EVALUATED rather than passed by a single-leg suite, which is the defect m9:lockstep-cross-platform was declared to avoid"
ci_job = "milestone-m11a"

[[criterion]]
id = "pcg-regenerates-across-architectures"
describe = "a generated region reproduces bit-for-bit on a second architecture, and the GPU execution domain reproduces the CPU domain's output on more than one vendor's driver. Both were reported NOT EVALUATED at M10 for want of the job above; with the job they become answerable, and either answer is worth having"
source = "tasks 2.1, procedural-content-generation (Deterministic derivation, Execution domains)"
kind = "command"
run = "just test-determinism --compare-legs --pcg"
where = "ci"
reason = "one host with one GPU vendor cannot compare two; `requires = \"gpu\"` would make this RUN here and PASS on one driver's floating-point behaviour, which is not the claim"
ci_job = "milestone-m11a"

