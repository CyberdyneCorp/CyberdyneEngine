# ADDED AT M4'S GATE, AND THE REASON IS A DEFECT THIS FILE DID NOT CATCH. M0's `generated-code`
# criterion runs `just generate-check` — one of the THREE commands its own gate declares in
# tools/roadmap/gates.toml. The other two are `just generate-test` and `just maintenance-deps-check`,
# and no milestone ledger ran either. So when M4 turned CY_AUDIO on by default — correctly; it
# delivered the miniaudio backend — `tools/gen/tests/run_tests.py`'s
# `test_optional_backend_requires_its_subsystem` went red, because it asserted that
# `-DCY_AUDIO_STEAM_AUDIO=ON` fails and relied on CY_AUDIO defaulting off to make that true. It
# stayed red through the whole milestone with every ledger green: 20 of 21, in a permanent gate that
# has existed since M0.
#
# The test is fixed (it now names `-DCY_AUDIO=OFF`, so it asserts the rule rather than the default),
# and this criterion is here so that the next flip of a default is caught by the recipe that closes
# the milestone rather than by the pull request after it. It runs the gate's commands verbatim.
[[criterion]]
id = "generated-code"
describe = "the generated-code gate, all three of its commands: the headers are current and reproducible, the generator's own fixtures still reject what they are meant to reject, and THIRD_PARTY.md matches the dependency manifest"
source = "delivery-roadmap (a gate a ledger does not run is a gate a milestone can break invisibly)"
kind = "command"
run = "just generate-check && just generate-test && just maintenance-deps-check"
timeout_s = 3600
ci_job = "generated-code"

