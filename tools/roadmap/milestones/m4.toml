# --- The artefact ------------------------------------------------------------------------------------------

# TASK 6.1, MEASURED RATHER THAN CLAIMED. The smoke test runs the sample, then runs THE SAME BINARY
# with `--no-behaviours` — the same module, the same level built out of it, the same five servers,
# the same scripted input through the same command stream, and neither deciding behaviour created.
# The command log hashes identically and nothing moves. A grep can only fail on the words somebody
# thought to forbid; this fails on any decision at all having leaked to the C++ side.
[[criterion]]
id = "sample-artefact"
describe = "the artefact plays itself headless and exits cleanly — it moves, jumps, is blocked by the level, is heard and is followed by a camera — and the identical run with the Swift behaviours absent produces no motion, no sound and no camera movement while every line of the host still runs"
source = "tasks 5.1, 5.3, 5.4, 6.1, ROADMAP M4"
kind = "recipe"
run = "just test-smoke -R character_sample"
ci_job = "character-artefact"

[[criterion]]
id = "no-cpp-gameplay"
describe = "the static half of the same claim: the Swift/C++ partition, one call into the game per tick, the direction of every component access against the boundary the game declares, and no copied tunable — with the check's own negative cases, which edit the live tree in memory and require each rule to reject its violation"
source = "tasks 5.3, 6.1"
kind = "recipe"
run = "just test-integration -R character_no_cpp_gameplay"
ci_job = "character-artefact"

[[criterion]]
