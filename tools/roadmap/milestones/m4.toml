# --- Every profile, and the sanitizers -------------------------------------------------------------------------

# ONE BUILD DIRECTORY PER PROFILE, EVEN WHEN CY_BUILD_DIR IS SET — m2.toml's finding E, restated
# because the failure it describes cost an agent an hour and would cost the next one the same.
# CY_ASSERT is compiled out of Profile and Shipping, so a rule that is only an assertion is no rule
# at all there: the ABI's borrow-epoch check, the command stream's validation and the input
# resolver's arbitration are all comparisons rather than assertions for exactly that reason, and
# this criterion is what would catch one that had quietly become an assertion.
[[criterion]]
id = "four-profiles"
describe = "all four profiles build clean and just test-all is green in each — including the Swift suites and the artefact's smoke test, which build the game module at swiftc -O in Profile and Shipping and at -Onone in the other two"
source = "tasks 6.8"
kind = "command"
run = "for p in debug dev profile release; do d=\"${CY_BUILD_DIR:+${CY_BUILD_DIR}/$p}\"; CY_BUILD_DIR=\"$d\" just build-engine --profile \"$p\" || exit 1; CY_BUILD_DIR=\"$d\" just test-all --profile \"$p\" || exit 1; done"
timeout_s = 28800
ci_job = "profiles"

# TASK 6.9, AND IT CARRIES A WORKAROUND THAT IS NOT MINE TO REMOVE. `just test-sanitize` builds the
# dev profile, and CY_SHADER_SLANG now defaults to ON there (M3's carried-forward debt 1.4), so the
# sanitized build compiles Slang's own code-generator tool under LeakSanitizer and the BUILD fails on
# a third party's leak — `Slang::StringRepresentation::createWithCapacityAndLength` inside
# `fiddle::Parser::parseFiddleNode`. It is a build-tool leak reached only because Slang is on by
# default in dev, and it has nothing to do with the suites under test. So the sanitize tree is
# configured with the front end off, which is what the ABI agent measured this against and what this
# command does. THE REAL FIX belongs to whoever owns just/test.just: either exclude `_deps` from the
# leak check, or have `test-sanitize` configure with -D CY_SHADER_SLANG=OFF itself.
[[criterion]]
id = "sanitizers"
describe = "AddressSanitizer and UndefinedBehaviorSanitizer are clean over every suite M4 added — the ABI and its module loader, the input resolver, the physics interface and its character controller, the gameplay command stream, and the camera and audio servers"
source = "tasks 6.9"
kind = "command"
run = "d=\"${CY_BUILD_DIR:-build}/m4-sanitize\"; for s in address undefined; do cmake -B \"$d/sanitize-$s\" -D CY_SHADER_SLANG=OFF > /dev/null || exit 1; done; for t in abi input physics gameplay camera audio; do CY_BUILD_DIR=\"$d\" just test-sanitize --sanitizer address --tests \"$t\" || exit 1; CY_BUILD_DIR=\"$d\" just test-sanitize --sanitizer undefined --tests \"$t\" || exit 1; done"
timeout_s = 14400
ci_job = "sanitizers"

[[criterion]]
id = "three-platforms"
describe = "build and test are green on Linux, Windows and macOS with M4's modules in the tree"
source = "ROADMAP M4, delivery-roadmap"
kind = "command"
run = "just env-doctor && just build-engine && just test-all"
where = "ci"
reason = "this host runs one operating system; the other two are built only by the CI matrix, and neither has ever loaded a Swift game module"
ci_job = "build-and-test"

