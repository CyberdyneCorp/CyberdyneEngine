[[criterion]]
id = "m5-open"
describe = "the M5 change exists — open, or closed and archived — so the ladder continues deliberately"
source = "tasks 6.13"
kind = "path"
path = "openspec/changes/**/*m5*/proposal.md"
ci_job = "milestone-m4"
