# --- The invariants this milestone pins ------------------------------------------------------------------

# TASK 6.4. The suite holds it three independent ways, and the third is the one that matters: a
# PARTIAL bypass — one axis through the command stream and one read from a side channel — runs
# perfectly, validates, fills the log, and diverges only on replay. That is what the requirement is
# actually protecting against, and it is invisible to every other kind of test.
[[criterion]]
id = "command-stream"
describe = "the simulation reads input only through the validated command stream, proven by a test that bypasses it and fails: no input dependency on the gameplay module, no input member on the context a system is handed, and a partial bypass whose replay diverges"
source = "tasks 4.4.3, 4.4.6, 6.4, design.md §3, ROADMAP M4"
kind = "recipe"
run = "just test-unit -R gameplay"
ci_job = "command-stream"

# TASK 6.6. The negative control at the end of the unit suite is what keeps this from passing
# vacuously: it computes what "sample the current state each tick" would have answered on the same
# events and requires the two to differ.
[[criterion]]
id = "input-fixed-tick"
describe = "a press and a release between two ticks are both observed by the following tick, over the action layer and again against real SDL3 events — with the negative control that requires the level-sampling answer to differ"
source = "tasks 4.1.4, 6.6, design.md §5, ROADMAP M4"
kind = "command"
run = "just test-unit -R input && just test-integration -R sdl3_input"
ci_job = "input-fixed-tick"

