# --- The boundary ---------------------------------------------------------------------------------------

# TASK 6.2, AND IT IS THE CRITERION WITH THE LONGEST TAIL. Everything else on this list can be fixed
# in the milestone that broke it. A reordered ABI entry cannot: by M5 the editor is compiled against
# this table, and an ABI that has been reordered once is an ABI nobody can trust.
[[criterion]]
id = "abi-gate"
describe = "the compatibility gate: the current interface table against its committed baseline, failing on anything but an append and printing the approval stanza a recorded break would take"
source = "tasks 2.3, 6.2, design.md §1, ROADMAP M4"
kind = "recipe"
run = "just quality-abi"
ci_job = "abi"

[[criterion]]
id = "abi"
describe = "the flat C interface and everything that crosses it: opaque handles and POD structs, the versioned table read through a size prefix in both directions, values marshalled and released without a leak, errors as codes and never as exceptions, callbacks into modules, type registration from a module, and the reload sequence — including THE GATE'S OWN NEGATIVE CASES, which reorder an entry, remove one and append one against the real baseline"
source = "tasks 2.1 to 2.8, 6.2, ROADMAP M4 (native-abi)"
kind = "command"
run = "just test-unit -R abi && just test-integration -R abi_"
ci_job = "abi"

[[criterion]]
id = "swift-api"
describe = "the Swift API tests in continuous integration: the overlay is what regeneration produces, the generator's own selftest, the package's cases under `swift test`, and a real Swift module loaded and driven by the engine's loader"
source = "tasks 3.8, 6.7, ROADMAP M4 (Swift API tests run in continuous integration)"
kind = "recipe"
run = "just test-integration -R swift_"
ci_job = "swift-api"

# TASK 6.3, AS FAR AS IT GOES — see the note above about the half of it that is not satisfied.
[[criterion]]
id = "swift-reload"
describe = "a Swift behaviour's state survives a reload across a LAYOUT CHANGE, carried by name through the module's own serializer — including an ARC-managed String, which the spike measured being read as 3.5e18 by the obvious implementation — and a module whose schema predates the blob is refused with the previous generation left live"
source = "tasks 0.2, 3.7, 6.3, ROADMAP M4"
kind = "recipe"
run = "just test-integration -R swift_reload"
ci_job = "swift-api"

