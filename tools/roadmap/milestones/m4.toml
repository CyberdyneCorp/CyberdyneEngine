id = "physics"
describe = "the physics interface and the character controller: shapes, bodies, filtering, contact events, the four query kinds, fixed-step integration on the simulation clock, and DETERMINISM ACROSS RUNS ON ONE PLATFORM — the property M9's rollback is priced on"
source = "tasks 4.2.1 to 4.2.6, 6.5, ROADMAP M4 (physics is deterministic across runs on one platform; the character controller test suite passes)"
kind = "recipe"
run = "just test-unit -R physics"
ci_job = "physics"

