# --- Every profile, and the sanitizers -------------------------------------------------------------------------

# ONE BUILD DIRECTORY PER PROFILE, EVEN WHEN CY_BUILD_DIR IS SET — m2.toml's finding E, restated
# because the failure it describes cost an agent an hour and would cost the next one the same.
# CY_ASSERT is compiled out of Profile and Shipping, so a rule that is only an assertion is no rule
# at all there: the ABI's borrow-epoch check, the command stream's validation and the input
# resolver's arbitration are all comparisons rather than assertions for exactly that reason, and
# this criterion is what would catch one that had quietly become an assertion.
[[criterion]]
id = "four-profiles"
describe = "all four profiles build clean and just test-all is green in each — including the Swift suites and the artefact's smoke test, which build the game module at swiftc -O in Profile and Shipping and at -Onone in the other two"
source = "tasks 6.8"
kind = "command"
run = "for p in debug dev profile release; do d=\"${CY_BUILD_DIR:+${CY_BUILD_DIR}/$p}\"; CY_BUILD_DIR=\"$d\" just build-engine --profile \"$p\" || exit 1; CY_BUILD_DIR=\"$d\" just test-all --profile \"$p\" || exit 1; done"
timeout_s = 28800
ci_job = "profiles"

# TASK 6.9. THIS CRITERION CARRIED A WORKAROUND UNTIL M4'S GATE, AND THE WORKAROUND IS WHY THE
# CRITERION COULD NOT HAVE CAUGHT THE THING IT WAS WORKING AROUND. `just test-sanitize` builds the
# dev profile, and M4's task 1.4 turned CY_SHADER_SLANG on there, so from that commit the sanitized
# configuration compiled Slang — a thousand targets of third-party C++, including generators the
# build itself runs — with whichever sanitizer was asked for. THREE MODES, THREE FAILURES:
#
#   address     LeakSanitizer failed the BUILD on slang-fiddle: 818 214 bytes in 3 617 allocations
#               inside `fiddle::Parser::parseFiddleNode`.
#   thread      slang-embed could not start: "FATAL: ThreadSanitizer: unexpected memory mapping".
#               cmake/sanitizers.cmake prints that diagnosis at configure time and just/test.just
#               applied `setarch -R` to the TESTS; nothing applied it to the build, because until
#               now no instrumented binary ran during one.
#   undefined   smoke.shader_slang failed on Slang's own COM smart pointer —
#               "member call on address … object has invalid vptr", slang-com-ptr.h:193.
#
# This file's answer was to pre-configure the sanitize tree with `-D CY_SHADER_SLANG=OFF`, which made
# the criterion pass while `.github/workflows/ci.yml`'s `sanitize` job — the permanent gate this
# criterion stands for, and the thing that actually runs on a pull request — went on failing, because
# it passes no such flag. A criterion that runs a different configuration from its own gate is a
# criterion that cannot speak for it; and because the workaround covered the one mode somebody had
# noticed, the other two survived to M4's gate undetected.
#
# FIXED AT THE ROOT, IN just/test.just, which configures the sanitized tree with
# -D CY_SHADER_SLANG=OFF. What that costs is that `smoke.shader_slang` is not sanitized, and it
# cannot be: with the vptr check quietened the suite fails again on Slang failing to dlopen its own
# downstream plugins in that tree. `shader-system` calls the front end a tool-time dependency whose
# shipping path is the SPIR-V passthrough, so what a sanitized run is for is unaffected. Two one-line
# wrappers land with it and stay although Slang's absence makes both inert today, because both are
# properties of any dependency that runs a binary during its own build: the build runs with
# `detect_leaks=0` (turned back on before ctest, so every suite is still leak-checked) and under
# `setarch -R` when the sanitizer is thread. This command is now the same one CI runs, with nothing
# in front of it.
[[criterion]]
id = "sanitizers"
describe = "AddressSanitizer and UndefinedBehaviorSanitizer are clean over every suite M4 added — the ABI and its module loader, the input resolver, the physics interface and its character controller, the gameplay command stream, and the camera and audio servers"
source = "tasks 6.9"
kind = "command"
run = "d=\"${CY_BUILD_DIR:-build}/m4-sanitize\"; for t in abi input physics gameplay camera audio; do CY_BUILD_DIR=\"$d\" just test-sanitize --sanitizer address --tests \"$t\" || exit 1; CY_BUILD_DIR=\"$d\" just test-sanitize --sanitizer undefined --tests \"$t\" || exit 1; done"
timeout_s = 14400
ci_job = "sanitizers"

[[criterion]]
id = "three-platforms"
describe = "build and test are green on Linux, Windows and macOS with M4's modules in the tree"
source = "ROADMAP M4, delivery-roadmap"
kind = "command"
run = "just env-doctor && just build-engine && just test-all"
where = "ci"
reason = "this host runs one operating system; the other two are built only by the CI matrix, and neither has ever loaded a Swift game module"
ci_job = "build-and-test"

