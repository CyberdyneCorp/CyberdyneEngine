# M4 — Playable: the exit criteria, as data. Task 6.10.
#
# The sources are section 6 of openspec/changes/implement-m4-playable/tasks.md and the M4 row of
# docs/ROADMAP.md; every criterion below names which. `delivery-roadmap` requires each to be a
# recipe that exits zero, a test that passes, a benchmark within a threshold, or a committed
# artefact that is regenerated and compared — so an intention that cannot be run is a note at the
# bottom of this file, not a criterion.
#
# `ci_job` names the gate in tools/roadmap/gates.toml under which continuous integration runs the
# criterion. It is required on every criterion, including the ones this machine can evaluate: a
# criterion that passes locally and runs nowhere else is not a gate. A criterion that cannot be
# evaluated on the host running the recipe — another operating system, no display, no GPU — carries
# a `reason`, is reported as not evaluated rather than as passed, and is counted separately.
#
# THIS MILESTONE ADDS A THIRD KIND OF HOST THIS FILE CANNOT SPEAK FOR, and unlike "no GPU" it has no
# `requires` token. A machine with no Swift toolchain does not build samples/04-character AT ALL —
# the sample's gameplay IS a Swift module, and bindings/swift/ and samples/04-character/ both decline
# to register their suites rather than registering ones that skip.
#
# WHAT THAT DOES TO THE CRITERIA BELOW, MEASURED RATHER THAN ASSUMED. Through M4's close this
# paragraph said they "do not fail, they are absent: `just test-smoke -R character_sample` matches no
# test and ctest exits zero". THAT IS WRONG, and in the safer direction: just/test.just passes
# `--no-tests=error` for every kind but `unclassified` and `render`, so
#     ctest --label-regex "^smoke$" --no-tests=error -R zzz_nonexistent   ->  exit 8
# and `sample-artefact`, `no-cpp-gameplay` and `swift-reload` all FAIL on such a machine rather than
# passing vacuously. The one that really does pass having judged less is `swift-api`: its `swift_`
# regex still matches the three suites that need no toolchain — the overlay's currency, the
# generator's selftest, and the engine linking no Swift runtime — while integration.swift_package and
# integration.swift_reload are simply not there, so it reports green over three of five.
#
# `just env-doctor` reports the toolchain and diagnoses the `~/.profile` case specifically. It is
# ADVISORY and deliberately so — just/env.just carries the reasoning, which is that M0's `doctor`
# criterion is in the permanent set and therefore runs first in every ledger, this one included.
#
# M3's, M2's, M1's and M0's criteria are evaluated by this recipe too, for the reason m1.toml
# records: a later milestone may not break an earlier milestone's gate, and the way to keep that true
# is for the closing recipe to run it rather than for a reviewer to remember it. The runner merges
# the whole ladder below this milestone into one flat, deduplicated set; nothing in this file re-runs
# another milestone's recipe. See the section below.

schema = 1
id = "m4"
name = "Playable"
artefact = "samples/04-character — a third-person character controller written entirely in Swift: it moves, jumps, collides with a level, is heard, and is followed by a camera, with the same binary able to run the identical host over the identical level with no deciding behaviour at all and produce no motion"

# Non-binding, because none can be settled by running something. `delivery-roadmap` requires a
# criterion that cannot be evaluated by a machine to be restated as a check or moved here.
notes = [
    "tasks 6.10 — `just roadmap-milestone m4` is this recipe, so it cannot be one of the criteria it evaluates.",
    "tasks 6.11 — docs/roadmap/status.yaml and docs/roadmap/capability-matrix.md are corrected where M4 recorded an intention the implementation changed, and record what is thinner than the tasks claim. `roadmap-tiers` below checks the record; no tool can tell an intention from its correction.",
    "tasks 6.12 — archiving this change happens after this recipe passes, so it cannot be one of the criteria it must satisfy.",
    "tasks 6.13 — opening the M5 change is `m5-open` below, which asks only that the change exists. Whether the live bridge's latency is the right named spike is a judgement.",
    "ROADMAP M4, 'a Swift module hot-reloads WHILE THE SAMPLE RUNS, preserving world state' — HALF SATISFIED, and the missing half is named rather than glossed. `swift-reload` below loads a real Swift module, creates behaviours holding live state including an ARC-managed `String`, rebuilds it with a changed layout, reloads it and reads the state back through the module's own serializer — which is the whole of the claim except the words 'while the sample runs'. samples/04-character loads generation 0 and never reloads: it declares `hot_reload = true`, the loader supports it, and nothing calls `reload()`. Wiring a file watcher into that host is small and belongs to M5, where the editor needs one anyway. See samples/04-character/README.md, which says the same thing from the other side.",
    "ROADMAP M4, 'the ABI gate rejects a reordered OR REMOVED entry and accepts an appended one' — the gate's own selftest is what proves all three, and it runs as `integration.abi_gate` inside the `abi` criterion below rather than as a criterion of its own. It edits the LIVE header in memory and runs the real gate against the real baseline; a fixture directory would go stale, and worse, a parser that stopped recognising the table would let a hand-written 'reordered' fixture and a hand-written 'correct' one both describe nothing.",
    "THE SAMPLE DOES NOT OPEN A WINDOW AND DRAWS NOTHING, and this is M3's recorded gap rather than a choice made here. `cy::rhi::Device` exposes no way to obtain the graphics-API instance a window surface must be created against, so a host can create a window and a device and cannot join them; m3.toml records it and samples/03-first-light renders offscreen for the same reason. samples/04-character instead produces the `cy::render::ViewDescription` a renderer would draw, every tick, and counts it — so `camera-system`'s 'Render view production' is exercised on the camera's side and on no other. A criterion asserting that the character is visible does not exist because nothing could evaluate it.",
    "PHYSICS RUNS OVER THE REFERENCE BACKEND IN THE SAMPLE, BY DEFAULT AND DELIBERATELY. `physics` requires that swapping the backend change no gameplay, so the artefact must be runnable over either; `--jolt` runs the same script over Jolt and was checked by hand at M4's close — 400 ticks over each backend produced THE SAME command-log hash (7c8c40b0be09a58c), the same input frame hash, the same 11 footsteps, 3 landings, 1 jump and 1 climbed step, and positions that differ in the metres, which is exactly the shape a backend swap should and should not change. READ THE CUE COUNTS AS A COINCIDENCE OF 400 TICKS RATHER THAN AS A PROPERTY: at 900 ticks the same two runs give 22 footsteps / 11 landings / 9 climbed steps over the reference backend and 30 / 4 / 1 over Jolt, while the command log (0e4d14a10f4582a9) and the input frame hash (269545449d8dd9f3) stay identical. What the requirement asks to be invariant is the gameplay and the log, not the trajectory. It is not a criterion because CY_PHYSICS may be off in a build that is otherwise complete, and a criterion that silently passes when its subject is absent is the pattern this file exists to avoid. The CONFORMANCE claim is `physics-jolt` below, which runs the same cases against Jolt through the interface.",
    "The gate set this milestone's criteria join on close is tools/roadmap/gates.toml; `just roadmap-gates` prints it. M4 adds abi, swift-api, command-stream, input-fixed-tick, physics and character-artefact to it.",
