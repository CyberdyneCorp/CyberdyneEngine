case = "the cost model is computed at cook time from rows and bytes"
note = "Entity count, I/O bytes and estimated activation time are computed at cook time, before anything loads, and the estimate is the function the planner spends against. `TickReport::worst_cost_divergence` reports estimate-versus-measured divergence, but no case asserts it; CPU/GPU memory, physics body and navigation tile counts are not in `CellCost`."

