requirement = "Validation"
evidence = "exempt:m11d"
note = "FOUR OF THE FIVE VALIDATION KINDS THIS REQUIREMENT NAMES EXIST AND ARE THE EVIDENCE OF THE ROWS ABOVE: compiler tests asserting liveness, dead-code elimination, folding and fusion produce the expected IR (`integration.vfx_compiler`), statistical simulation tests at a fixed seed and fixed rate (`integration.vfx`), budget tests holding a target under synthetic overload with Critical surviving (`unit.vfx_values` and `integration.vfx`), and event bound tests (both). The fifth CANNOT BE OBSERVED ON THIS HOST, and it is the one this requirement writes a scenario for: golden images `compared perceptually ACROSS EVERY BACKEND`, failing and IDENTIFYING BOTH BACKENDS when Vulkan and Metal diverge. This tree has one compiled backend — `src/backends/rhi-metal/README.md` records that `src/device.mm` has never been compiled anywhere, and there is no D3D12 backend at all — so a cross-backend comparison here would have one side. `render.vfx` writes its pictures on the one device this host has. WHAT WOULD OBSERVE IT: the same golden effect run on a second and a third backend and compared, which is M11.d's whole subject — the same project on a second and a third desktop."

[[coverage]]
row = "vfx-system"
requirement = "The determinism firewall names where it is enforced"
evidence = "test:integration.gameplay_firewall"
case = "a refused write is reported with the writer, the component and the path"
note = "the requirement's demand is a SINGLE ENFORCEMENT POINT `every authoritative write passes through — not a review, not a naming convention, and not a diagnostic that a caller may choose to read`, plus a development-build report naming the writing system, the component and the path. The case is the report half at exactly that granularity, and it is the ECS's rather than VFX's because that is where the point is: VFX declares its origin through `WriteScope(WriteOrigin::Vfx)` and does not decide what it is allowed to do. The arming half — which components are guarded, derived from reflection with the underived ones declared by hand WITH A REASON — is `gameplay: arming derives what reflection says and counts what it could not` and `gameplay: a by-hand declaration with no reason or no component is refused` in the same suite, and the cook-time half of the inference clause is `a non-pinned model feeding an authoritative node is refused at cook time`."

[[coverage]]
row = "vfx-system"
requirement = "The firewall's test is a negative control"
evidence = "test:integration.gameplay_firewall"
case = "with the enforcement point disabled the same writes land and the digest diverges"
note = "this requirement asks for a DEMONSTRATION rather than an assertion — `the test that proves the firewall SHALL fail when the firewall is removed, and that SHALL be demonstrated rather than assumed` — so the case IS the demonstration, inside one process: it disarms the enforcement point, runs the same simulation, and requires exactly the inversion of the armed case — zero refusals, the VFX and inference writes LANDING, and the state digest DIVERGING from the control run. Every one of those would have to be false for the armed case to pass with the firewall removed. The disarm carries a reason string and the case requires it to be non-empty, so a capture taken with the firewall down cannot be mistaken for a clean one. The subject is not deferred this time: M8.b carried this criterion with neither VFX nor inference in the tree, and both are here."
