note = "Several items are structural: weather's link line excludes foliage, VFX, water, terrain and rendering, standard_fields refuses a second wind declaration, VFX and foliage tests assert they own no wind model, and the weather grid is independent of world cells. Cloud shadows through virtual shadow pages, a stored world-scale volumetric cloud field and quality settings altering state have no dedicated check. Re-enter with an audit naming the check for each of the nine patterns and a fixture proving each fires."

# --- world-partition-and-streaming ----------------------------------------------------------------
#
# Swept for M11.e: every requirement this row had not yet answered. An exemption names what is
# not built and the case that would replace it.

[[coverage]]
row = "world-partition-and-streaming"
requirement = "The persistent world is distinct from the ECS world"
evidence = "gate:layering"
note = "The one-direction rule is structural: src/world/ sits in the `scene` layer (4) above cy::ecs (1), and the layering gate refuses any source-level include of a higher layer, so no ECS system can name `cy/world/` and activation can only publish into `ecs::World::instantiate()`. The naming half is a convention the module holds (no type under `cy::world` is called `World`; see src/world/CMakeLists.txt), and no check enforces it."

[[coverage]]
row = "world-partition-and-streaming"
requirement = "The world asset is metadata, not content"
evidence = "exempt:m11e"
note = "No world asset type exists. `PartitionConfig::signature()` is documented as the value a world asset would record, and `CellBuilder` cooks cells in memory, but there is no index-only `WorldAsset` holding partition settings, layer definitions, the cell index and global entity references, and no authoring-chunk format. Re-enter with a case that moves one prop in a multi-chunk authored world and requires only that chunk's bytes to change while the world asset stays byte-identical and sized by cells and layers, not by entity count."

[[coverage]]
row = "world-partition-and-streaming"
requirement = "World coordinates"
evidence = "test:unit.world"
case = "a position is exact in 32-bit local coordinates a thousand kilometres out"
note = "Exact round trip of a position a thousand kilometres out through the cell-relative form, with the local offset bounded by the cell and the naive f32 form shown to fail. Companions: `simulation-local coordinates are exact relative to a region origin` and `normalizing rebases a local offset past a boundary into the next cell`. The wire scenario is networking's; this case does not observe replication."

[[coverage]]
row = "world-partition-and-streaming"
requirement = "Partitioner interface"
evidence = "exempt:m11e"
note = "`Partitioner` is an abstract interface in partition.h and `HierarchicalGrid` is the default, with `uniform_grid_config` as a one-level hierarchy (`a uniform grid is a hierarchy of one level, and overlap enumeration is ordered`) and per-level assignment (`bounds decide the level and the cell, not the pivot`). No octree partitioner exists and no case drives streaming or cooking through a project-supplied partitioner. Re-enter with a test-local Partitioner subclass that WorldStreaming, CellBuilder and cell identity accept unchanged, plus an octree implementation."

[[coverage]]
row = "world-partition-and-streaming"
requirement = "Stable cell identity"
evidence = "test:unit.world"
case = "content may change; partition settings changing is what invalidates cell identity"
note = "Identity is unchanged when partition settings are unchanged (content is not an input), and a changed cell size or origin is reported by `compare_partitions` with the reason and both signatures. The companion `a cell identifier is stable across runs and opaque to its coordinate` covers determinism and opacity."

[[coverage]]
row = "world-partition-and-streaming"
requirement = "Entity spatial binding and streaming policy"
evidence = "test:unit.world"
case = "global, owner-managed and transient content is not assigned to a spatial cell"
note = "AlwaysLoaded, RuntimeManaged, OwnerManaged and Transient placements are not assigned a spatial cell. `bounds decide the level and the cell, not the pivot` covers the bounds scenario. Owner-relative streaming of an attached weapon is not observed beyond the policy refusing a cell."

[[coverage]]
row = "world-partition-and-streaming"
requirement = "Large entities occupy coarser levels"
evidence = "test:unit.world"
case = "a mountain is not duplicated, and oversized content is reported"
note = "A three-kilometre landform gets one coordinate at the coarsest level with `forced_to_coarsest` set, which is the flag a cook report names. A 400 m wall lands at level 1 in the companion bounds case."

[[coverage]]
row = "world-partition-and-streaming"
requirement = "Runtime cells carry subsystem payloads"
evidence = "test:integration.world_streaming"
case = "a dedicated server never requires the rendering channels"
note = "A dedicated-server source never requires the geometry, texture, audio or illumination channels, so payloads are requested per channel. `a channel added later streams for cells already resident, without reloading them` shows them separately streamable. Content-addressed chunk storage is the `CellPayload::chunk` seam only: no cooker writes cells to chunks yet (src/world/README.md), so the chunk-granular patching scenario is unobserved."

[[coverage]]
row = "world-partition-and-streaming"
requirement = "Cells are cooked in ECS-native form"
evidence = "test:integration.world_activation"
case = "activation is a bulk copy: values land in ECS chunks with no per-entity work"
note = "A thousand cooked rows land in ECS chunks of one archetype with no per-entity construction, and column values arrive in row order. unit.world's `a cook produces archetype blocks, not an entity-by-entity object graph` pins the cooked shape, and the cooked-blocks and world-streaming gates hold the invariant."

[[coverage]]
row = "world-partition-and-streaming"
requirement = "Residency and activation are distinct"
evidence = "test:integration.world_streaming"
case = "residency and activation are separate: bytes resident with simulation off"
note = "A prefetch-only source makes cells resident with bytes counted while the ECS world publishes zero entities, so residency and activation are controlled separately. Asset residency and simulation detail are other capabilities' axes and are not asserted here."

[[coverage]]
row = "world-partition-and-streaming"
requirement = "Streaming sources"
evidence = "test:unit.world"
case = "the camera is not the only source, and sources combine"
note = "A camera and a distant unit group each register a source and the cells around both are required. `two sources over one cell merge: the union of channels, the most urgent class` covers combination. integration.world_streaming's `urgent beats predicted, and the budget defers rather than stalls` covers the Critical teleport source."

[[coverage]]
row = "world-partition-and-streaming"
requirement = "Streaming shapes and prediction"
evidence = "test:unit.world"
case = "a vehicle streams along its predicted route ahead of arrival"
note = "Velocity and horizon prediction request cells ahead of the vehicle and not behind it, and urgency ranks the cell it stands in above the predicted ones. Companions cover path (ordered by arc length), cone and box shapes. Spline is Path with pre-sampled points by design (sources.h). The Frustum shape exists, but no case covers frustum prioritisation."

[[coverage]]
row = "world-partition-and-streaming"
requirement = "Streaming channels"
evidence = "test:integration.world_streaming"
case = "a channel added later streams for cells already resident, without reloading them"
note = "A source's mask gains a channel and the delta streams for cells already resident with no reload. `a dedicated server never requires the rendering channels` covers the spectator/server split. unit.world's `a channel delta names only what is missing` covers the arithmetic."

[[coverage]]
row = "world-partition-and-streaming"
requirement = "Streaming priority, deadlines, and budgets"
evidence = "test:integration.world_streaming"
case = "urgent beats predicted, and the budget defers rather than stalls"
note = "A Critical teleport request wins I/O over a background prefetch and the prefetch is deferred, not stalled. Companions: `activation is spread across ticks and never exceeds its budget` and `memory pressure evicts the lowest priority, and reports what it cannot free`."

[[coverage]]
row = "world-partition-and-streaming"
requirement = "Activation is staged and published atomically"
evidence = "test:integration.world_activation"
case = "preparation spans frames and nothing is observable until publication"
note = "Preparation spans several calls into private staging with nothing in the ECS world until publication. `publication is refused before the cell is ready, so it is never partial` and `withdrawal is atomic and keeps the staging, so republishing is one instantiate` cover the reverse path. Bulk physics body registration is a physics consumer this module does not call."

[[coverage]]
row = "world-partition-and-streaming"
requirement = "Cell lifecycle events"
evidence = "test:integration.world_activation"
case = "events are queued and consumed in a declared order, never called back"
note = "Transitions are queued as structured events and consumed by declared order rather than callbacks. integration.world_streaming's `a request made while consuming an event is queued, not processed re-entrantly` covers the no-re-entrancy scenario."

[[coverage]]
row = "world-partition-and-streaming"
requirement = "Persistent entity identity"
evidence = "exempt:m11e"
note = "`PersistentId` is assigned at authoring time and duplicates are a named cook error (`duplicate persistent identifiers are a cook error, and are named` in unit.world). No registry resolves a persistent identifier to a runtime entity, and no case moves an entity between authoring chunks or edits its prefab. Re-enter with a registry-backed resolve and a case that reorganises authoring data and requires identity and references to survive."

[[coverage]]
row = "world-partition-and-streaming"
requirement = "Cross-cell references"
evidence = "exempt:m11e"
note = "`PersistentReference` and the four `ReferencePolicy` values exist, and RequireLoaded feeds the hard dependency closure (`a RequireLoaded reference builds the hard dependency closure at cook time`). Nothing resolves a reference: there is no API returning a runtime entity or a defined unresolved result, and LoadOnDemand issues no streaming request. Re-enter with a resolve call and a case that resolves a reference into an unloaded cell (unresolved, non-blocking) and a LoadOnDemand reference that queues a request."

[[coverage]]
row = "world-partition-and-streaming"
requirement = "Dependency explosion detection"
evidence = "test:integration.world_streaming"
case = "walking into one cell that pulls a chain is reported with the chain"
note = "Four cells chained by RequireLoaded produce a report for the first with three forced cells, `over_threshold` set against a configured limit, and the first link of the chain named. At runtime the closure is made resident. `DependencyReport` also carries forced bytes. The threshold sets a flag; no build exists to fail on it."

[[coverage]]
row = "world-partition-and-streaming"
requirement = "World layers"
evidence = "test:unit.world"
case = "a layer is identified by a number, so renaming it is safe"
note = "Membership keys on a numeric LayerId, so renaming keeps state and identity. `an editor-only layer is not cooked and cannot be activated` covers editor-only layers. `rows are grouped by archetype and by layer, so a layer switch is whole blocks` shows layered entities still partitioned into cells."

[[coverage]]
row = "world-partition-and-streaming"
