note = "Each compiled backend (SSE, NEON, AVX2) is compared bit for bit against the always-compiled scalar reference. `SIMD: the bulk transform scenario — ten thousand points by one matrix` covers the batch API, and integration.math_simd_avx2 builds the same source with -mavx2. Vec3 being 12 bytes is asserted in unit.math."

[[coverage]]
row = "core-math"
requirement = "Spatial acceleration structures"
evidence = "test:integration.math_spatial"
case = "DynamicBvh: a movement inside the margin does not restructure the tree"
note = "A move inside the fat margin returns without restructuring. Companions in the suite: `DynamicBvh: a frustum query omits nothing that the exact test accepts`, ray and AABB queries, `Bvh<T>: a static build answers the same queries brute force does`, and SpatialHash and Octree cases."

[[coverage]]
