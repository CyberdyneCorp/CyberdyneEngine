note = "NOT DECLARED ANYWHERE. This requirement asks five content classes to declare a shadow caster policy selected FROM THE SHADOW TEXEL FOOTPRINT, and no such declaration exists: `src/foliage/` states in `cook.h` that there is no foliage shadow path at all (it publishes `rendering::vg::GeometryInstance` and is shadowed by the same passes as anything else), its aggregate and canopy tiers are the general geometry hierarchy selected on SCREEN error rather than on shadow texels, `src/terrain/` has no separate shadow renderer to forbid and therefore nothing to check, and neither water's `SHALL NOT cast opaque shadows by default` nor the translucent staging is expressed as a policy a test could read. What would observe it is a policy table keyed by content class and resolved against `shadow_texel_world_size()`, with a case requiring a forest past a measured footprint to cast from one aggregate rather than from its leaves, and water to answer `no opaque shadow` without an authored distance anywhere in the decision."

[[coverage]]
row = "virtual-shadows"
requirement = "Multi-view page sharing"
evidence = "test:unit.render_shadows"
case = "two views needing one page mark it once, and the secondary view weighs less"
note = "WRITTEN FOR THIS MAP, because the mechanism was in `pages.h` and nothing exercised it. There is no merge STEP to test — two views mark the same page id and compaction merges them — so the case is written against the two ways that construction can be wrong. A set that emitted the shared page twice is one page rasterised once per view; a merge that kept the LAST view's weight is a reflection probe deciding the main camera's shadow quality, so the main camera marks FIRST and the probe SECOND and the case would pass on a last-writer merge if written the other way round. It then follows the weight downstream: under pressure the probe-only page coarsens through `apply_resolution_bias` and the shared page does not, and at equal age and class the shared page outranks the probe's in `staleness_priority`. Proved red before it was recorded, twice: compaction's `math::max` replaced by `math::min` takes the shared page's weight to the probe's 0.2, and deleting the merge branch altogether emits three pages where two views need two."

[[coverage]]
