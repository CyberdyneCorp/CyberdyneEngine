# Which test, gate, criterion or recorded deferral answers each requirement of a capability row.
#
# READ BY tools/roadmap/requirements.py, WHICH `just quality-requirements` RUNS. Five criteria across
# four ledgers ask whether a row is at Complete grade — `m11a:network-at-complete-grade`,
# `m11b:gameplay-at-complete-grade`, `m11b:editor-at-complete-grade`,
# `m11c:material-compiler-at-complete-grade` and `m11e:every-requirement-maps` — and until this file
# existed they ran a recipe that was not there, which `just` refused at argument parsing. The check
# that reports "nothing has read this specification end to end" is the point of the exercise; an
# empty map is that report, and it is an honest red rather than a missing one.
#
# AN ENTRY IS A CLAIM THE TOOL CHECKS, not a sentence:
#
#   evidence = "test:unit.save"             a suite a committed cy_add_test() declares, AND
#   case     = "a save round-trips"         the test case in it that answers this requirement
#   evidence = "rust:cy-editor-documents::transaction::tests::undo_and_redo_walk_one_ordered_sequence"
#   evidence = "gate:build-and-test"        a gate in tools/roadmap/gates.toml
#   evidence = "criterion:m11a:world-streams"   a criterion that falsifiability.toml PROVES can fail
#   evidence = "exempt:m11e"                a deferral, with `note` saying why, closing at that rung
#
# Every one of those is resolved against the tree: a suite that is renamed or deleted turns the row
# RED rather than leaving a green tick behind, which is the failure mode M11.a's gate found in the
# record audit one level down. So is an entry naming a requirement the specification no longer asks.
#
# THE `case` AND THE PROOF ARE WHAT STOP AN ENTRY FROM BEING A SENTENCE. Without them, twenty-four
# requirements could be answered by naming one suite twenty-four times, and any criterion — including
# one nobody has ever shown can fail — would count. The case is searched for in the sources beside
# the `cy_add_test` that declares the suite, so it cannot be borrowed from elsewhere; the proof is
# read out of `tools/roadmap/falsifiability.toml`, which `just roadmap-test` re-earns.
# `tools/roadmap/selftest.py::test_requirements_coverage` breaks each of those rules on purpose.
#
# WRITING AN ENTRY MEANS READING THE REQUIREMENT. That is the work these criteria exist to force and
# it is not work a tool can do: `requirements.py` deliberately cannot author this file. Add entries
# as rows are read, one requirement at a time, and the count in each run's summary moves.

schema = 1

# --- terrain --------------------------------------------------------------------------------------
#
# Mapped for #29's terrain tools, which added brush modifiers to the stack and hole brushes to the
# editor. The other thirteen requirements of this row have not been read against the tree yet.

[[coverage]]
row = "terrain"
requirement = "Terrain modifier stack"
evidence = "test:integration.terrain_authoring"
case = "inserting erosion beneath a sculpt preserves the sculpt and reapplies it above"
note = "Sculpts are stamps kept by the stack, so a pass inserted beneath one reapplies it. The same suite pins the scoped road re-evaluation, determinism and the cook that flattens the stack. The editor's brush modifiers change only their footprint, and removing one restores the region byte for byte."

[[coverage]]
row = "terrain"
requirement = "Terrain holes and decoration"
evidence = "test:integration.terrain_authoring"
case = "a hole brush removes rendering and collision exactly where it cuts"
note = "A hole brush's cut quads are exactly the ones meshing omits, and collision marks hole samples over them. unit.terrain's 'a hole is not a surface, and every consumer agrees' covers queries. integration.terrain_geometry derives navigation from the holed collision, and terrain_authoring's road case covers decoration and foliage suppression."

# --- navigation -----------------------------------------------------------------------------------
#
# Swept for M11.e task 6.1a. The four exemptions below are implementation gaps, not missing test
# names: each note states the absent seam and the case that must replace the exemption.

[[coverage]]
row = "navigation"
requirement = "Navigation mesh"
evidence = "test:integration.navigation_build"
case = "the agent radius erodes the walkable surface away from a hole, on either back end"
note = "The case runs the engine and Recast builders over the same geometry and requires a 0.5 m agent radius to remove the otherwise walkable route. Companion cases in this suite pin slope and layer/tag/volume filtering, while unit.navigation pins tile adjacency and neighbour preservation on rebuild."

[[coverage]]
row = "navigation"
requirement = "Runtime mesh updates"
evidence = "test:unit.navigation"
case = "an obstacle marks a footprint without a rebuild"
note = "The mesh version and tile generation stay unchanged while the affected polygons become unwalkable, so the case distinguishes obstacle carving from a voxelisation rebuild. Tile replacement and stale-reference cases in the same suite cover the other update path."

[[coverage]]
row = "navigation"
requirement = "Navigation volumes"
evidence = "test:unit.navigation"
case = "a flying path climbs over a blocked canyon cell"
note = "A sparse six-connected NavVolume climbs over a blocked 3D canyon cell. Companion cases apply area costs and masks, force budget and unreachable-target partial paths, and issue surface and volume point-path queries through the same NavigationSpace and deterministic SpatialPathQueue. NavAgent declares its representation; a mixed-world case verifies walker and flyer use separate queues."

[[coverage]]
row = "navigation"
requirement = "Navigation streaming"
evidence = "test:unit.navigation"
case = "a path into unloaded content is abstract now and refined when it arrives"
note = "The case unloads the destination region, requires an abstract path whose local segment is deferred, then republishes the tile and requires refinement. Its companion cases cover path invalidation on unload, hierarchy residency and navigation tiling independent of world-cell size."

[[coverage]]
row = "navigation"
requirement = "Pathfinding"
evidence = "test:unit.navigation"
case = "an area mask excludes a type entirely and a cost multiplier only prefers against it"
note = "One three-tile route holds endpoints constant while a water mask makes the answer partial and a water multiplier keeps the route valid but raises its cost. Adjacent cases pin closest partial results, node-budget reporting and deterministic asynchronous delivery."

[[coverage]]
row = "navigation"
requirement = "Hierarchical pathfinding"
evidence = "test:unit.navigation"
case = "a cross-map plan runs over the region graph rather than the polygon graph"
note = "The query exposes and asserts abstract regions and connections for a long path rather than merely accepting any path. Companion cases refine one segment at a time, preserve an unloaded region's identity and recompute only the rebuilt region's connections."

[[coverage]]
row = "navigation"
requirement = "Path smoothing"
evidence = "test:unit.navigation"
case = "A* crosses a tile boundary and the funnel pulls the path straight"
note = "The corridor crosses multiple polygons and a tile boundary but the produced point path is exactly its two endpoints, so deleting the funnel reduction leaves extra corners. The rounding case separately keeps endpoints while applying simplification and a corner radius. Companion funnel cases pull diagonal and off-axis paths across a quad grid to their two endpoints in both directions, bend around a carved obstacle only at its corners, and turn an L-shaped corridor at exactly its inner corner, so a side test with the wrong sign returns portal corners instead."

[[coverage]]
row = "navigation"
requirement = "Flow fields"
evidence = "test:integration.navigation_fields"
case = "a cache shares one field and releases it when the last user leaves"
note = "Two acquisitions for one destination return one cached field, reference counts change independently, and the final release removes it. Other cases in the suite pin per-cell guidance, byte-for-byte deterministic generation and bounded incremental regeneration."

[[coverage]]
row = "navigation"
requirement = "Off-mesh links"
evidence = "test:unit.navigation"
case = "a link an agent lacks the capability for is not expanded"
note = "The only connection between otherwise disconnected regions is an off-mesh link; a capable agent receives the tagged endpoints and an incapable one cannot expand it. Re-snap and invalid-endpoint cases cover link lifetime across tile rebuilds."

[[coverage]]
row = "navigation"
requirement = "Local avoidance"
evidence = "test:integration.navigation_crowd"
case = "two agents approaching head-on steer around each other and do not interpenetrate"
note = "The agents request mutually colliding velocities, then the solver must change both velocities and preserve separation. Companion cases isolate priority yielding, reduced-tier work and the advisory path/field-following boundary."

[[coverage]]
row = "navigation"
requirement = "Crowd simulation"
evidence = "test:integration.navigation_crowd"
case = "eight thousand agents hold their declared budget"
note = "Eight thousand agents run for thirty ticks; the case bounds neighbour work against all-pairs growth and, in optimised builds, measures per-agent cost. Priority, deterministic replay and tiered-fidelity cases in the same suite cover the behavioural clauses."

[[coverage]]
row = "navigation"
requirement = "Navigation components"
evidence = "test:unit.navigation"
case = "a following agent repaths when the mesh version it was built against moves on"
note = "The component system observes a newer mesh version, invalidates the held corridor and issues a replacement query. The same suite pins fixed component registration, arrival events, failed off-mesh targets, repath rate limits and explicit flow-field following."

[[coverage]]
row = "navigation"
requirement = "Multiple navigation worlds"
evidence = "test:unit.navigation"
case = "overlapping navigation worlds route agents and obstacles only to their own mesh"
note = "NavWorlds binds independent mesh/queue pairs by world ID and rejects a queue paired with the wrong mesh. At identical coordinates an obstacle blocks the walking world while an agent in the other world still receives a path query; the agents' world IDs select the correct binding."

[[coverage]]
row = "navigation"
requirement = "2D navigation"
evidence = "test:unit.navigation"
case = "tilemap path detours around a blocked cell"
note = "The Vec2 API consumes tilemap-authored polygons per chunk, preserves references in unchanged chunks and routes around a removed cell. A companion case generates the same planar graph from convex 2D collision footprints and checks that the blocked cell cannot be queried."

[[coverage]]
row = "navigation"
requirement = "Navigation debugging"
evidence = "test:unit.navigation"
case = "navigation debug exposes a disconnected gap behind a partial path"
note = "The test requests a path across missing content, checks that it is partial, then verifies the debug command stream shows both polygon islands but no cross-tile adjacency. Companion tests cover all nine independently selectable overlay families, query counts and timing, path lengths and repath rates; integration.navigation_build measures tile voxelisation time. PathResult already reports cost, expanded/visited nodes and budget exhaustion."

[[coverage]]
row = "navigation"
requirement = "Environment-driven navigation"
evidence = "test:unit.water"
case = "downstream is cheaper than upstream, through the flow field"
note = "The case holds the river and endpoints constant, reverses travel direction and requires downstream cost below upstream while cross-flow remains symmetric and dry ground stays neutral. integration.terrain_geometry separately proves collision-derived surfaces, declared material costs and dirty regions."

# --- physics --------------------------------------------------------------------------------------
