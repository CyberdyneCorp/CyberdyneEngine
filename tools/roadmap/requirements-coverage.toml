note = "every rung of the declared chain walked in one case, in order, against one cache: nothing resident answers `Unshadowed`; with an approximation available, `Approximation`; with a coarser page of the same light on the shared lattice, `CoarserPage` naming that page; with the page itself rendered, `Requested`; with both dirtied, `StalePage` returning the page's own physical slot, because stale contents are a rung and not a black square; and past `max_stale_frames` it moves on rather than showing last minute's shadow. `The substitution used SHALL be recorded per page and reportable` is the `SubstitutionLedger` in the same case, and `the frame SHALL never wait` is the `starved` path in `a page that has only just arrived is not evicted underneath its own light`."

[[coverage]]
