# --- terrain --------------------------------------------------------------------------------------
#
# Swept for M11.e: every requirement this row had not yet answered. An exemption names what is
# not built and the case that would replace it.

[[coverage]]
row = "terrain"
requirement = "Terrain representations"
evidence = "test:unit.terrain"
case = "a column can carry more than one surface, and no consumer assumes a heightmap"
note = "The query primitive is a column: a source can report several surfaces above one point and the query answers for any representation without assuming a heightmap. Heightfield is the shipped representation. `a structural deformation is refused, naming the representation it needs` shows the SDF slot admitted but unimplemented, as the spec's Planned status allows."

[[coverage]]
row = "terrain"
requirement = "Tiled hierarchical storage"
evidence = "test:unit.terrain"
case = "there is no global grid: an absent region costs nothing and does not fault"
note = "Storage is sparse tiles at several levels and an absent region costs nothing. Companions: `a tile identity is stable, opaque, and derived from the coordinate and the level`, `the coordinate scheme is replaceable, and changing it renames every tile`, and `terrain tiles are a cell channel, and a cell's footprint is arithmetic`. No streaming binder pages tiles through cells yet (src/terrain/README.md)."

[[coverage]]
row = "terrain"
requirement = "Terrain is a geometry source"
evidence = "test:integration.terrain_cook"
case = "a terrain tile becomes virtual geometry through the engine's own builder"
note = "A terrain tile is meshed and handed to `rendering::vg::build_geometry()`, the same virtual-geometry builder other meshes use, with no terrain renderer. integration.terrain_geometry's `a fine tile yields to a coarser neighbour, exactly onto its edge`, `meshing is deterministic and cacheable, and an edit changes the key` and `a hole leaves an opening, and the fallback path reports its reduced detail` cover watertightness, caching and the fallback."

[[coverage]]
row = "terrain"
requirement = "Terrain material layers"
evidence = "test:unit.terrain"
case = "a texel keeps its dominant layers, and the cooker names what it dropped and where"
note = "Each texel keeps its dominant few layers and the cooker names the dropped layer and its location. Companions: `the per-texel bound is configurable below the storage bound`, `the material graph is evaluated once per page, and sampling it is a fetch`, `a local edit re-produces locally`, `without virtual texturing the path degrades and says what it cost`. integration.terrain_cook's `shading does not scale with the world's layer count` covers shading cost. Pages come from terrain's MaterialPageCache, not virtual-texturing's PageProducer."

[[coverage]]
row = "terrain"
requirement = "Material frequency separation"
evidence = "test:unit.terrain"
case = "frequencies are composed, and which band dominates depends on the footprint"
note = "Macro, meso, detail and micro bands are composed, and the dominant band changes with the sampling footprint, so no single tiling scale dominates every viewing distance. The case checks band composition arithmetic, not a rendered image."

[[coverage]]
row = "terrain"
requirement = "Environment-aware terrain material inputs"
evidence = "test:unit.terrain"
case = "a rule reads an environment field as a first-class input"
note = "A material rule reads an environment field (with slope and altitude) as a first-class input to choose a layer with no painted mask. `rules and painting compose, and painting wins locally` covers the override scenario."

[[coverage]]
row = "terrain"
requirement = "Deformation classes"
evidence = "test:unit.terrain"
case = "a footprint is cheap: visual deformation invalidates rendering and nothing else"
note = "A Visual deformation invalidates rendering only. `a crater is not: it moves the surface and invalidates collision and navigation` covers the Gameplay class for the affected region, and `a structural deformation is refused, naming the representation it needs` shows the Structural class refused until an SDF exists."

[[coverage]]
row = "terrain"
requirement = "Terrain deltas use the persistence overlay"
evidence = "test:integration.terrain_persistence"
case = "a mining pit survives a save, through the world's own persistence overlay"
note = "A pit is recorded as a height delta in the world's own persistence overlay, saved, reloaded over unchanged cooked tiles and reproduced. `a networked terrain change is a bounded message, not a resend of terrain` covers replication size."

[[coverage]]
row = "terrain"
requirement = "Terrain collision"
evidence = "test:integration.terrain_geometry"
case = "collision is coarser than rendering, independent of it, and carries the hole"
note = "Collision is built at its own coarser resolution, independent of the render mesh, and carries holes. integration.terrain_authoring's `a hole brush removes rendering and collision exactly where it cuts` matches holes between the two. Bulk physics registration on cell activation is not wired, because no streaming binder exists yet."

[[coverage]]
row = "terrain"
requirement = "Terrain navigation contribution"
evidence = "test:integration.terrain_geometry"
case = "the navigation surface is derived from collision and takes declared costs"
note = "The navigation surface is derived from the collision representation with declared material costs applied, not special-case code. unit.terrain's `a crater is not: it moves the surface and invalidates collision and navigation` emits the regional navigation dirty region. Incremental navmesh tile rebuild after a trench is navigation's and is not driven from here."

[[coverage]]
row = "terrain"
requirement = "Terrain hierarchical level of detail"
evidence = "test:unit.terrain"
case = "a macro tile is a decimation of its children, sample for sample"
note = "Coarse levels are derived from their children by decimation, not authored, so a coarse sample equals the fine sample at the same place and transitions have no seam. `detail coarsens with distance, and the store says why a position is coarse` covers distance-driven level selection. Rendering a macro level with fine tiles absent at continental range is not observed."

[[coverage]]
row = "terrain"
requirement = "Terrain queries"
evidence = "test:unit.terrain"
case = "a query answers height, normal, slope and material without a physics query"
note = "Height, normal, slope and material come from the terrain representation with no physics query. Companions: `a query into unstreamed terrain answers from the coarsest resident level and says so`, `queries are batchable, and a batch answers what one at a time answers`, `a ray against the surface finds the crossing, and misses when there is none`."

[[coverage]]
row = "terrain"
requirement = "Terrain diagnostics"
evidence = "test:unit.terrain"
case = "detail coarsens with distance, and the store says why a position is coarse"
note = "`TerrainStore::explain()` reports why a position is coarse (distance, budget or resident), with the level used and its bytes, which is the per-tile why-coarse answer. `TerrainDiagnostics` reports tiles per level, bytes and hole quads. The debug views (tile bounds, cluster output, layer counts, deltas, collision and navigation overlays) are not observed by a case."

