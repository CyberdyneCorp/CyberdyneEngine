# --- xr-support -----------------------------------------------------------------------------------
#
# Swept for M11.e: every requirement this row had not yet answered. An exemption names what is
# not built and the case that would replace it.

[[coverage]]
row = "xr-support"
requirement = "XR is deferred but not precluded"
evidence = "criterion:m3:xr-prerequisites"
note = "The criterion runs render.xr_prerequisites over the three structural prerequisites — one submission for two views, frame inputs as arguments rather than a clock, and view data reaching submission through memory — and is proven able to fail. A change that assumed one view, a fixed rate or an owned loop would turn it red."

[[coverage]]
row = "xr-support"
requirement = "Multi-view rendering prerequisite"
evidence = "test:render.xr_prerequisites"
case = "render.xr_prerequisites: two views are one submission of the geometry"
note = "A camera asking for two views records one geometry submission amplified across both layers, not two draws. render.msaa_multiview's 'multi-view and its per-view baseline render the same layers, chosen by capability' renders the layered target on a device."

[[coverage]]
row = "xr-support"
requirement = "Runtime-driven frame timing prerequisite"
evidence = "test:render.xr_prerequisites"
case = "render.xr_prerequisites: the frame's inputs are arguments, not a clock"
note = "The same camera argument, rendered again after other frames have run, records the same command stream, so a frame's output depends on its arguments and not on a clock it reads. An external runtime can therefore drive one frame against a predicted display time. A host-driven tick entry point is the runtime's and is not exercised by this case."

[[coverage]]
row = "xr-support"
requirement = "Late-latching prerequisite"
evidence = "test:render.xr_prerequisites"
case = "render.xr_prerequisites: the view reaches submission through memory, not commands"
note = "View matrices are read from a buffer at submission, so changing that buffer after recording changes the view without re-recording draw commands."

[[coverage]]
row = "xr-support"
requirement = "Planned XR interface"
evidence = "exempt:m11e"
note = "XR is a planned capability and nothing implements it: there is no XRSystem, no OpenXR backend, and no session lifecycle, reference spaces, swapchain or action-based XR input. Only the prerequisites are held (render.xr_prerequisites). Re-enter when an OpenXR-backed XRSystem exists, with a case that drives the session through idle, ready, synchronised, visible, focused and stopping and requires simulation to pause when the session is not visible."

[[coverage]]
row = "xr-support"
requirement = "Planned XR tracking model"
evidence = "exempt:m11e"
note = "There are no trackers, tracked poses with velocity and confidence, or tracking-origin entity in the tree; XR is planned and unimplemented. Re-enter with a tracking model and a case where a controller loses tracking, its confidence drops while its last pose holds, and recentring moves the origin so the head pose maps to the intended world position."

[[coverage]]
row = "xr-support"
requirement = "Planned XR rendering features"
evidence = "exempt:m11e"
note = "Foveated rendering from a runtime density map, composition layers and passthrough compositing all depend on an XR runtime the engine does not have. Re-enter with an XR backend and cases where a supplied density map drives the existing VRS path and a UI panel is submitted as a composition layer at runtime resolution."

[[coverage]]
row = "xr-support"
requirement = "Comfort and safety requirements"
evidence = "exempt:m11e"
note = "No XR frame-rate budget, locomotion comfort defaults, boundary API or cadence warning exists, because XR is unimplemented. Re-enter with an XR session and a case where frames consistently exceed the display cadence, requiring a prominent development-build report, and a boundary query answered from the runtime."
