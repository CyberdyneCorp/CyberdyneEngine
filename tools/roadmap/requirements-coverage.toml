evidence = "test:integration.jobs_system"
case = "a task context carries its worker, its scratch and its name"
note = "A task reads its worker index, scratch allocator and name from the context. 'scheduling ten thousand tasks touches the general allocator not at all' shows task records come from per-worker slabs, and `unit.jobs`'s 'released scratch is poisoned in a development build' and 'a scratch scope releases what its body allocated' cover bulk reclamation and poisoning."

[[coverage]]
row = "core-jobs-and-concurrency"
requirement = "Coroutines are the asynchronous model"
evidence = "test:integration.jobs_coroutines"
case = "a cell load reads as a sequence, and its worker is released while it waits"
note = "A read, decompress and activate chain is one coroutine whose worker is released between steps. The suite also awaits jobs, task groups and cancellation, and 'coroutine frames come from the per-thread slabs, not the general heap' covers allocation; `integration.jobs_blocking` awaits a GPU fence and a timer."

[[coverage]]
row = "core-jobs-and-concurrency"
requirement = "Workers never block on I/O or the GPU"
evidence = "test:integration.jobs_blocking"
case = "a file read is submitted asynchronously and its continuation is scheduled"
note = "The read goes to the asynchronous service and its continuation is scheduled on completion. The same suite has 'a GPU fence is awaited through a completion notification, never by spinning', 'a thread executing a job that tries to block on I/O is refused and counted' and 'a worker held inside a declared blocking region is reported by name'."

[[coverage]]
row = "core-jobs-and-concurrency"
requirement = "Cancellation"
evidence = "test:unit.jobs"
case = "cancellation propagates to children and not to parents"
note = "Cancelling a parent source cancels child tokens and not the reverse; a child of a cancelled parent is born cancelled. `integration.jobs_system`'s 'a task cancelled before it begins does not run its body' and 'long-running work observes its token at a bounded interval' cover cooperative observation, and `integration.jobs_blocking`'s 'a cancelled task that never observes its token is reported' covers the unresponsive-task scenario."

[[coverage]]
row = "core-jobs-and-concurrency"
requirement = "Priority classes, fairness, and deadlines"
evidence = "exempt:m11e"
note = "Five priority classes exist and two scenarios are proven: `integration.jobs_system`'s 'background work still progresses under sustained high-priority load' bounds background progress under saturation, and `integration.jobs_determinism`'s 'deterministic mode ignores deadline hints' runs the same order with opposite deadlines. 'Teleport beats prefetch' has no case: nothing shows an urgent task preferred over a pending speculative one in normal mode. Re-enter with a single-worker case that queues a Background prefetch and then a Critical preparation and asserts the Critical one runs first."

[[coverage]]
row = "core-jobs-and-concurrency"
requirement = "Long-running work is chunked"
evidence = "exempt:m11e"
note = "The framework halves exist: `integration.jobs_system`'s 'long-running work observes its token at a bounded interval' and `integration.jobs_blocking`'s 'a task that runs longer than the limit is reported with its name'. Missing: no progress-reporting contract for long-running tasks, and no case shows cooking, navigation generation, light baking or import chunked at Background priority while the editor stays responsive. Re-enter with a chunked import job that reports progress, is cancellable, and leaves the interface thread responsive."

[[coverage]]
row = "core-jobs-and-concurrency"
requirement = "Deterministic scheduling mode"
evidence = "test:integration.jobs_determinism"
case = "determinism does not require single-threaded execution"
note = "The fixed order holds across four workers with every task run once; 'single-threaded deterministic mode runs the exact submission order' is the debugging mode and 'a floating-point reduction is bit-identical across runs and worker counts' shows the two agree. Chaos is covered twice: 'chaos mode randomises permitted order without changing any result' keeps dependencies, and `integration.determinism_scale`'s 'determinism: chaos scheduling finds an ordering dependency and names its tick' shows an order-dependent reduction caught while its stable control is not."

[[coverage]]
row = "core-jobs-and-concurrency"
requirement = "Deterministic parallel primitives"
evidence = "test:integration.jobs_determinism"
case = "a floating-point reduction is bit-identical across runs and worker counts"
note = "A 20,000-element float reduction is bit-identical across runs and worker counts because combination order follows the partitioning. 'an exclusive scan is deterministic and correct' and 'a parallel sort produces the same array every run' cover the other primitives; `unit.jobs`'s 'structural changes commit in a deterministic order, not in completion order' covers ordered commit, and `integration.determinism_scale`'s chaos case covers caught order reliance."

[[coverage]]
row = "core-jobs-and-concurrency"
requirement = "Synchronisation primitives"
evidence = "test:unit.jobs"
case = "a read-write lock admits many readers or one writer"
note = "`sync.h` declares exactly the required set (Thread, Mutex, RecursiveMutex, RwLock, Semaphore, ConditionVariable, SpinLock, Event, Atomic, AtomicFlag, AtomicRefCount). `unit.jobs` fixes the semantics of the read-write lock, spin lock, semaphore, event, flag and reference count, and `integration.jobs_sync` covers timed waits, cross-thread hand-over and the condition variable. The hot-loop guidance is design guidance, served by `DoubleBuffered`, `SpscQueue` and per-thread command buffers."

[[coverage]]
row = "core-jobs-and-concurrency"
requirement = "Command queue for single-threaded servers"
evidence = "test:integration.jobs_command_queue"
case = "a fire-and-forget call returns immediately and is applied at the drain"
note = "The submission returns immediately and the owner applies it at its next drain. The suite covers submission-order replay, oversize payloads going to the arena and never the heap, 'a synchronous call blocks until the owner has run it and written the result back', and 'repeated synchronous calls in one frame are counted so they can be identified'."

[[coverage]]
row = "core-jobs-and-concurrency"
requirement = "Double buffering across thread boundaries"
evidence = "test:unit.jobs"
case = "a double buffer publishes only at the swap"
note = "A reader sees the published buffer while the writer fills the other, and the swap publishes with a generation count. This answers the stable-snapshot scenario at the primitive; the case does not show each named consumer (render transforms, event channels, input state, debug draw) adopting it."

[[coverage]]
row = "core-jobs-and-concurrency"
requirement = "Frame pacing and synchronisation points"
evidence = "exempt:m11e"
note = "`unit.rhi`'s 'frames pace, and a frame slot's command buffers are recycled' shows frame slots ring over `frames_in_flight` (default 2) on the null device, which has no real fence. Missing: no case observes the CPU waiting on the oldest frame's fence before reusing its resources, and the four synchronisation points (stage flush, frame stage, snapshot publication, GPU submission) are not enumerated or tested as a set. Re-enter with a device-backed case that saturates frames in flight and observes the wait on the oldest fence."

[[coverage]]
row = "core-jobs-and-concurrency"
requirement = "Concurrency diagnostics"
evidence = "test:integration.jobs_diagnostics"
case = "the critical path is the longest chain, not the sum of the durations"
note = "The reported critical path is the longest dependency chain with its constituent tasks. 'job and task events land on the M0 shared trace' writes task records into the shared trace, and 'idle and busy time are both reported, so an idle worker can be explained' reports idle time behind a serial chain. ThreadSanitizer runs over the job suites through the `sanitizers` gate."

