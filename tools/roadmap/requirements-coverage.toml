[[coverage]]
row = "scene-graph-and-nodes"
requirement = "Node is a view onto an entity"
evidence = "test:unit.scene"
case = "reading a node property reads the entity's component"
note = "The node's local transform is written and then read back by a direct ECS get of LocalTransform with no node involved, so a node that cached a value would fail, which is 'Property access goes to components'. 'a Node is a tree pointer and an entity id, and nothing else' holds the handle's size. 'entities without nodes are fully first class and are not in the tree' and 'a node destroyed by a system through a command buffer is invalid at the flush' are the other two scenarios. Gate scene-coherence runs integration.scene_scale's invariants over the same façade."

[[coverage]]
row = "scene-graph-and-nodes"
requirement = "Hierarchy and naming"
evidence = "test:unit.scene"
case = "paths resolve absolutely, relatively and through the parent"
note = "Absolute, relative and '../Camera' paths resolve to the sibling or to a null handle when absent, which is 'Path lookup'. 'a sibling name collision is resolved by suffixing', 'children are ordered, and the order survives a removal', 'an alias is project-unique and resolves through the component that holds it' and 'the tree is the ECS relation, visible to systems' cover the rest. integration.scene_scale's 'reparenting with keep-world recomputes the local transform' is 'Reparenting preserves world transform'."

[[coverage]]
row = "scene-graph-and-nodes"
requirement = "Transform model"
evidence = "test:integration.scene_scale"
case = "only the moved node's subtree is recomputed"
note = "In a large hierarchy, one node moves and propagation recomputes only its subtree, by the count it reports, which is 'Dirty subtree only'. 'a root's world transform is its local transform, exactly', 'writing a world transform derives the local one and keeps it authoritative', 'the interpolated transform is presentation state, and the firewall says so' and 'the render phase leaves the interpolation history alone' cover the root rule, 'Writing world transform' and interpolation."

[[coverage]]
row = "scene-graph-and-nodes"
requirement = "Node types and components"
evidence = "test:unit.scene"
case = "a project template is a data declaration, registered at startup"
note = "A project template is a data declaration of components and defaults, registered at startup with no engine change, which is 'Template is data'. 'composition over inheritance: two components on one entity, no new type' is the light-that-emits-sound scenario, and 'a UI document attaches at one node and its elements are not entities' is 'UI attaches at one point'. 'the shipped catalogue is declared, and reports which entries this world can build' holds the engine's template list and says which entries this world's registered components can build."

[[coverage]]
row = "scene-graph-and-nodes"
requirement = "Visibility and enablement"
evidence = "test:integration.scene_scale"
case = "a hidden parent hides its subtree and leaves it simulating"
note = "A parent set invisible hides its whole subtree's effective visibility while the subtree stays enabled and in gameplay queries, which is 'Hidden parent hides children'. 'a disabled subtree is excluded from queries and its data survives' is the second scenario, and 'a child disabled on its own stays disabled when its parent is re-enabled' and 'reparenting under a hidden node inherits its effective visibility' are the inheritance edge cases. Effective state is published by the same propagation pass as transforms."

[[coverage]]
row = "scene-graph-and-nodes"
requirement = "Node lifecycle callbacks"
evidence = "test:unit.scene"
case = "onReady runs child-first, exactly once per attachment"
note = "A subtree added to the tree delivers onReady to every descendant before its ancestors, once, which is 'Ready runs bottom-up once'. 'an unimplemented callback is in no dispatch list and costs nothing' is 'Callbacks are opt-in'. 'leaving and re-entering the tree fires exit and ready again', 'onDestroy runs child-first while the components still exist' and 'onEnable and onDisable follow the effective state, published by propagation' cover the rest of the table's order."

[[coverage]]
row = "scene-graph-and-nodes"
requirement = "Behaviours bridge nodes and systems"
evidence = "test:integration.scene_scale"
case = "many instances of a batched behaviour cost one system, not one call each"
note = "Many instances of a batchable behaviour run as one generated system iterating chunks, not one call per instance, which is 'Guidance on scale'. 'a behaviour that cannot batch falls back to a system that dispatches per instance' is the fallback, still a scheduled system ('Behaviour dispatch is a system'). 'the report names every behaviour, its dispatch, and why' is 'The cost is known at build time', and 'the batching decision is a function of the declaration alone' makes the decision depend on the declaration and nothing else."

[[coverage]]
row = "scene-graph-and-nodes"
requirement = "Groups and tags"
evidence = "test:integration.scene_scale"
case = "broadcast reaches every member in a deterministic order"
note = "A broadcast to a group reaches every member in the same order however the members were added, which is 'Broadcast to a group'. 'group membership is a tag component and is queryable from a system' is the implementation the requirement names, and 'a broadcast may destroy the node it was handed' keeps the iteration safe."

[[coverage]]
row = "scene-graph-and-nodes"
requirement = "Scenes and worlds"
evidence = "test:integration.scene_scale"
case = "an additive load adds a scene root, and unloading destroys exactly its entities"
note = "A second scene loads additively under its own scene root, and unloading it destroys exactly its entities and leaves the first scene's, which is 'Additive load'. 'an asynchronous load is spread across pumps and is not active until it is finished' is 'Async scene load'. 'a replacing load unloads what was there' and 'a node reparented out of its scene is still destroyed with it' cover replacement and ownership."

[[coverage]]
row = "scene-graph-and-nodes"
requirement = "Coherence invariants"
evidence = "test:integration.scene_scale"
case = "writing Parent directly, outside the node API, is caught"
note = "A system writes the ECS Parent directly, and the coherence check fails, identifying the entity, which is the scenario. 'a tree built and propagated through the node API satisfies every invariant' is the positive control, and 'a LocalTransform written without marking it is caught after propagation', 'an effective-state tag that disagrees with the flags is caught' and 'an entity that loses its NodeName stops being a node rather than becoming half one' cover invariants 4, 5 and 2. Gate scene-coherence runs this suite."

