evidence = "test:unit.pcg"
case = "a compiled program carries identifiers, and its stages resolve no names"
note = "Attributes are interned once to compiled identifiers (`an attribute is interned once and answers to its identifier`, and one interned with a second type is refused), and compiled stages carry identifiers, not names. Point sets, rasters and their digests are typed datasets. Generators emit datasets to output adapters, never runtime objects (`a generated result is not an entity by default`)."

[[coverage]]
