# --- virtual-shadows --------------------------------------------------------------------------------
#
# FOURTEEN CASES — ONE OF THEM WRITTEN FOR THIS MAP — AND SIX RECORDED DEFERRALS. The split is not a
# judgement about which requirements matter; it is `src/rendering/shadows/README.md`'s own line
# drawn requirement by requirement. That module holds every decision about WHICH pages exist, WHEN
# they are re-rendered and WHAT they cost, and each of those is arithmetic over positions, bounds
# and frame counts that `tests/` finds headless. What it does not hold, and says so in its own
# section heading, is the DEVICE half: the compute dispatch that marks pages from the depth buffer,
# GPU-driven caster selection against page frusta, page-batched indirect rasterisation, and the
# filtering kernels.
#
# THE SIX DEFERRALS ARE PARKED AT M11.e AND THAT IS A CLAIM, NOT A SHRUG. No rung between here and
# 1.0 owns the device half of this row — M11.c task 4.4 says in as many words that `virtual-shadows`
# does not reach Complete on this rung, M11.d is a second and third desktop and M11.e is mobile,
# distribution and the 1.0 record. M11.e is therefore the LAST rung at which an absence of this row
# can still be recorded rather than shipped, which is what `exempt:m11e` says. Each note names the
# mechanism that is missing and what would observe it, so the deferral can be closed by building
# that rather than by deleting the entry.
#
# `Multi-view page sharing` was the one requirement that was untested AND testable: the mechanism is
# in `pages.h` — two views mark the same page id and compaction merges them, weighted by the view's
# own priority — and nothing exercised it. The case was written for this map and proved red before
# it was recorded.
#
# EVERY TEST-BACKED ENTRY IN THIS ROW HAS BEEN MUTATION-PROVED. Fourteen mapped requirements,
# fourteen experiments against `build/m11c-final`, each running the mapped case BY NAME after the
# behaviour the requirement names was deleted or inverted: fourteen of fourteen go red. ONE case —
# `Deformation and cache validity` — survived its first mutation and was strengthened; THREE more
# needed BOTH of the mechanisms that implement the sentence deleted before they moved, and each of
# those notes says which two. The six `exempt:m11e` entries are read, not mutated.
#

