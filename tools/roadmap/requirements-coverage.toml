# Which test, gate, criterion or recorded deferral answers each requirement of a capability row.
#
# READ BY tools/roadmap/requirements.py, WHICH `just quality-requirements` RUNS. Five criteria across
# four ledgers ask whether a row is at Complete grade — `m11a:network-at-complete-grade`,
# `m11b:gameplay-at-complete-grade`, `m11b:editor-at-complete-grade`,
# `m11c:material-compiler-at-complete-grade` and `m11e:every-requirement-maps` — and until this file
# existed they ran a recipe that was not there, which `just` refused at argument parsing. The check
# that reports "nothing has read this specification end to end" is the point of the exercise; an
# empty map is that report, and it is an honest red rather than a missing one.
#
# AN ENTRY IS A CLAIM THE TOOL CHECKS, not a sentence:
#
#   evidence = "test:unit.save"             a suite a committed cy_add_test() declares, AND
#   case     = "a save round-trips"         the test case in it that answers this requirement
#   evidence = "rust:cy-editor-documents::transaction::tests::undo_and_redo_walk_one_ordered_sequence"
#   evidence = "gate:build-and-test"        a gate in tools/roadmap/gates.toml
#   evidence = "criterion:m11a:world-streams"   a criterion that falsifiability.toml PROVES can fail
#   evidence = "exempt:m11e"                a deferral, with `note` saying why, closing at that rung
#
# Every one of those is resolved against the tree: a suite that is renamed or deleted turns the row
# RED rather than leaving a green tick behind, which is the failure mode M11.a's gate found in the
# record audit one level down. So is an entry naming a requirement the specification no longer asks.
#
# THE `case` AND THE PROOF ARE WHAT STOP AN ENTRY FROM BEING A SENTENCE. Without them, twenty-four
# requirements could be answered by naming one suite twenty-four times, and any criterion — including
# one nobody has ever shown can fail — would count. The case is searched for in the sources beside
# the `cy_add_test` that declares the suite, so it cannot be borrowed from elsewhere; the proof is
# read out of `tools/roadmap/falsifiability.toml`, which `just roadmap-test` re-earns.
# `tools/roadmap/selftest.py::test_requirements_coverage` breaks each of those rules on purpose.
#
# WRITING AN ENTRY MEANS READING THE REQUIREMENT. That is the work these criteria exist to force and
# it is not work a tool can do: `requirements.py` deliberately cannot author this file. Add entries
# as rows are read, one requirement at a time, and the count in each run's summary moves.

schema = 1

# WHAT IS HERE, AND WHAT IS DELIBERATELY NOT. Nine entries across two rows, written by reading those
# two specifications requirement by requirement. The other fifteen requirements of those rows, and
# every requirement of every other row the five criteria name, stay UNANSWERED and each run prints
# them by title. Several of them have a case in the tree that answers PART of them — and a part
# recorded as an answer is precisely the green tick that outlives its subject, so those are left for
# whoever reads the requirement end to end.

