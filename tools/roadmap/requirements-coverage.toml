# --- vfx-system ------------------------------------------------------------------------------------
#
# TWENTY-SIX OF TWENTY-SIX, and the shape of the row is: twenty-one answered by a case, five by a
# recorded deferral. M8.c built this capability and M10 finished its GPU dispatch and its renderer
# kinds, so most of what `vfx-system` asks is observed by `unit.vfx_values`,
# `integration.vfx_compiler`, `integration.vfx`, `render.vfx_gpu` and — for the determinism firewall,
# which VFX declares and the ECS enforces — `integration.gameplay_firewall`.
#
# THE RULE APPLIED, BECAUSE A ROW THIS SIZE NEEDS ONE. An entry is a `test:` when a case observes the
# requirement's operative claim; it is an `exempt:` when NOTHING IN THIS TREE OBSERVES THE
# REQUIREMENT'S SUBJECT AT ALL. The five exemptions are not "partly done" — each names a subject that
# is absent, and four of the five are absences `src/vfx/README.md` already records under "Deliberate
# limits, recorded rather than hidden". Where a case reaches the requirement's normative sentences
# but not one of its scenarios, the note says which scenario and where the shortfall is recorded,
# rather than the entry being silently downgraded to a deferral it does not need.
#
# TWO CASES WERE WRITTEN FOR THIS MAP, because two requirements were testable and untested:
#
#   `a mesh emitter publishes one instance row a particle, and no entity anywhere` — the tree had
#   only the NEGATIVE direction of `publish_mesh_instances` (the plume declares no `mesh` attribute,
#   so both of that case's assertions are zeroes). The publication could have written no row at all,
#   or the mesh reference into the material field, and stayed green.
#
#   `an exposed parameter is set on one instance and the other instance does not move` —
#   `SimulationWorld::set_parameter` was called by NO test in this tree. A `set_parameter` that wrote
#   nothing, or that wrote into every instance's words, was green; `EffectInstance::parameter_base`
#   exists precisely so that one effect's Intensity is not every effect's.
#
# Both were proved red before they were proved green — see the change's tasks for the mutations.

