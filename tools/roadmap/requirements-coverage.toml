# --- residency ------------------------------------------------------------------------------------
#
# Swept for M11.e: every requirement this row had not yet answered. An exemption names what is
# not built and the case that would replace it.

[[coverage]]
row = "residency"
requirement = "Shared policy, separate storage"
evidence = "test:render.virtual_texturing_gpu"
case = "residency: texture and geometry arbitrate for one budget over one frame's feedback"
note = "`rendering::vt::FrameResidency` registers Subsystem::Texture and Subsystem::Geometry against one ResidencyServer and feeds both from one frame's GPU dispatches, so one policy admits and reduces over two caches that keep their own storage. The separation is structural: a page is a Subsystem tag plus an opaque 56-bit number and the module depends only on cy::core-base and cy::core-memory, so it cannot hold page contents. unit.residency's 'a shadow page is not a geometry page: regeneration cost is weighed' answers the second scenario, and integration.virtual_geometry_residency's 'two subsystems share one policy, and geometry declares its lever' is the geometry half off the device. NOT BUILT: only two of the four caches are registered. Virtual shadows and GI only mirror the lever shape in their own budget.h, and no shadow or illumination page is scored by this policy, so 'One policy, four caches' is half observed. KIND render: the suite skips on a machine with no Vulkan device."

[[coverage]]
row = "residency"
requirement = "Unified render importance"
evidence = "exempt:m11e"
note = "WHAT EXISTS: `residency::ImportanceTable` derives one importance from coverage and a gameplay mark, and applies declared per-subsystem transforms. unit.residency's 'a hero unit is important once: one declaration reaches every consumer' and 'weighting, not redefinition: shadows weight distance more strongly than textures' hold the table's arithmetic, and `GpuInstance::importance` (gpu_scene.h, offset 148) is a field in the GPU scene. WHAT IS MISSING: nothing consumes either one. No file outside src/servers/residency names ImportanceTable, and no geometry LOD, texture page priority, shadow resolution, animation rate or GI quality decision reads GpuInstance::importance. 'its geometry, textures, shadows, animation, and illumination SHALL all receive higher quality' is therefore never observed. REPLACING CASE: publish one instance's importance into the GPU scene, raise its gameplay mark, and require virtual geometry's selected error, the virtual texture request score and the shadow page resolution for that instance to rise, all read through the table's per-subsystem transform."

[[coverage]]
row = "residency"
requirement = "Request priority"
evidence = "test:unit.residency"
case = "a texture page and a shadow page are comparable, and the decision is explicable"
note = "Both pages are scored by the one `score_request()` and the case requires the comparison and the explanation of the decision. 'scoring is monotonic in each of its seven terms' covers importance, coverage, detail deficit, confidence, time until needed, age and cost. 'a million pixels request the same page and one request reaches the scheduler' is the compaction scenario, and the merge and ordering cases beside it keep compaction deterministic. GPU-side compaction is the virtual texturing resolve pass's, which hands FrameResidency an already compacted list (render.virtual_texturing_gpu)."

[[coverage]]
row = "residency"
requirement = "Deadline propagation"
evidence = "test:unit.residency"
case = "one prediction becomes one deadline per consumer, all agreeing about how soon"
note = "One `Prediction` is announced on the DeadlineBus and becomes one deadline per subsystem with the same due time and confidence. The case compares every consumer's due_seconds to a single double. 'a camera cut is announced: the earlier prediction wins' is the cut scenario (a Sequence-sourced prediction sooner than camera extrapolation wins and a later one cannot push it back), and 'a narrower mask prepares fewer consumers' covers a sequence pre-roll aimed at audio. NOT BUILT: virtual texturing's `prefetch()` is the only engine consumer of the bus. The sequencer's `publish_preload()` emits PreloadRequests with lead ticks (integration.sequencing_playback, 'sequence_playback: a shot is warm before it starts, and a miss is reported') that do not reach the bus, so 'A shot list is a schedule' is not observed end to end."

[[coverage]]
row = "residency"
requirement = "Budgets and pressure response"
evidence = "test:unit.residency"
case = "coordinated reduction walks the declared order rather than broadcasting"
note = "Illumination, texture and shadow levers are declared with a reduction order, and the plan at Elevated pressure must step them in that order to the declared values and leave undeclared levers alone. That is 'reduce across subsystems in a declared order, rather than each evicting independently'. 'pressure applies the declared plan, and pinned mode stops it' covers pinned mode, 'relaxing waits out the dwell; tightening does not' covers hysteresis, and 'making room evicts the cheapest to lose, and never a held or guaranteed page' is the protection of high-importance and held content. A subsystem's budget is a byte count with a budget-tree name (`SubsystemPolicy`), and the policy is driven by `PressureResponder::on_pressure`."

[[coverage]]
row = "residency"
requirement = "Eviction and churn control"
evidence = "test:unit.residency"
case = "churn is visible: an eviction re-requested inside the window is counted"
note = "An eviction re-requested inside the churn window is counted against its subsystem, which is the 'Churn is visible' scenario. 'no oscillation: a page that arrived this frame cannot leave this frame' (policy) and 'the minimum residency age stops a page leaving the frame it arrived in' with 'a page evicted this frame is not admitted again this frame' (server) are the minimum age and hysteresis. 'a shadow page is not a geometry page: regeneration cost is weighed' and 'recency decays rather than cliffs, and an active page is preferred' cover the eviction inputs, and 'a hold and a guarantee are facts, not weights' covers the pinned and guaranteed pages."

[[coverage]]
row = "residency"
requirement = "No residency system blocks another"
evidence = "exempt:m11e"
note = "HALF-BUILT. The configuration half exists: `ResidencyServer::declare_dependency` and `validate_dependencies` reject a cycle of hard dependencies and accept a cycle of coarse ones, held by unit.residency's 'a cycle of hard residency dependencies is a configuration error'. The frame half does not. No shadow pass consults a texture's guaranteed coarse level, which virtual-shadows' 'Shadow rasterisation never waits on texture residency' records as exempt (the `shadow_critical` flag has no consumer in src/servers/render/virtual_texturing/), and no GI or geometry consumer declares a dependency in engine code. 'Shadows do not wait for textures' is therefore unobserved. REPLACING CASE: a shadow program samples a virtual texture whose fine pages are not resident, the frame completes without waiting, the coarse level answers, and the fine page is queued for a later frame. Add the cycle case beside it as a companion."

[[coverage]]
row = "residency"
requirement = "Residency diagnostics"
evidence = "test:unit.residency"
case = "why is this blurry: every cause is a value rather than a guess"
note = "`ResidencyServer::explain()` answers per page with a QualityReason (NeverRequested, AwaitingProduction, Resident, BudgetBlocked and the rest) plus `desired_level` and `resident_level`, which is the 'Why is this blurry' scenario. 'prediction quality is measurable: prefetched against sampled' reports the prefetched fraction actually sampled for each prediction source, and 'a deadline met and a deadline missed are counted apart, per consumer' covers outstanding deadlines and misses. Per-subsystem counts, bytes against budget and churn are `SubsystemStats`. NOT BUILT: the per-SCREEN-PIXEL query. Explanations are per page, and nothing maps a pixel to the pages it sampled."

