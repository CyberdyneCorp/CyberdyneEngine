# top of the file — so every case here builds a real structure and traces a real ray, and none of
# them needs a GPU. The device half of the capability claim is `m11c:ray-tracing-on-the-device`, a
# gpu-gated criterion of the M11.c ledger, and it is not what any entry below leans on.

