requirement = "Shadow rasterisation never waits on texture residency"
evidence = "exempt:m11e"
note = "HALF-BUILT, and the built half is the half that cannot stall. Every texture a shadow program can sample is marked `shadow_critical` by `material/src/lowering.cpp` and asserted so by `integration.material_lowering`, and `shadow_critical_level()` derives the guaranteed coarse level from the page geometry so a project cannot pin something so fine that the guarantee stops being one. WHAT IS MISSING IS THE CONSUMER: nothing in `src/servers/render/virtual_texturing/` reads the flag — its `make_mip_tail_resident` guarantee is per texture and the word `shadow` does not appear in the module — so no coarse representation is actually pinned on account of a shadow program. What would observe it is a case that asks the virtual texturing system for a fine page it does not have while a shadow program samples that texture, and requires the coarse level to answer, the frame not to block, and the page to be queued for refresh."

[[coverage]]
row = "virtual-shadows"
requirement = "Update classes and staleness"
evidence = "test:integration.render_shadow_control"
case = "a camera cut is spread over frames by priority, and critical pages never wait"
note = "the requirement forbids a fixed cap on pages per frame — `a hard cap turns a camera cut into a stall` — so the case is a real cut: two thousand dirty pages against an allocation that affords about a hundred. It requires the selection to be a proper subset with a non-zero deferral and a spend inside the allocation, and all four `Critical` pages present wherever they sat in the input, which is `content whose shadow must be exact SHALL NOT be allowed to go stale`. The ordering itself is `a critical page outranks everything, and staleness ordering follows what would show` in `unit.render_shadows`, where age, importance and motion are varied one at a time. MUTATION-PROVED, AND IT TAKES BOTH BELTS TO BREAK IT. Deleting `staleness_priority`'s Critical branch alone leaves the case GREEN, because `select_pages_to_render` never defers a Critical page for cost whatever its rank; deleting that exemption alone leaves it green too, because a Critical page sorts first and is therefore affordable. The proof deletes both, and `critical_selected == 4` goes red."

[[coverage]]
row = "virtual-shadows"
requirement = "Shadow budget"
evidence = "test:integration.render_shadow_control"
case = "the shadow controller settles on every load in the sweep, and none settles over budget"
note = "41 load magnitudes from x1.00 to x2.40, each held 800 frames with lever changes counted over the last 450 — the certification is the SWEEP because the levers are a discrete ladder and one step magnitude can make any control law look stable (the arbiter spike's own first draft passed a single load and oscillated on 27 of 71). The companion cases carry the rest of the requirement: `the reserved minimum is declared and reported rather than silently crossed`, `pinned mode stops everything and reports the overrun instead of correcting it`, and `released from pressure, authored quality comes back on every load`. The declared reduction ORDER is `ShadowLever`'s enumerator order. What the sweep does not certify, and says so in the module README, is that the declared relative costs describe a real shadow pass; that needs a measured device pass. MUTATION-PROVED ON THE SENTENCE THE SWEEP DECIDES, WHICH IS NOT THE HYSTERESIS ONE. Disabling the tighten path — a subsystem over its allocation that never moves a lever — turns `over_budget` red, which is the requirement's own `WHEN shadow cost exceeds its allocation THEN ... SHALL be adjusted`. Removing the tighten MARGIN does NOT move this case, because the sweep's arbiter half gates its own grant at `relax_margin` and supplies the band the subsystem's margins would: the hysteresis clause is decided by `without the margin the controller ratchets quality away and never gives it back` in the same suite, which that mutation does turn red."

[[coverage]]
row = "virtual-shadows"
requirement = "Filtering and softness"
evidence = "exempt:m11e"
note = "NOT BUILT FOR PAGED LOOKUPS. `rendering-lighting-and-shadows`' filtering exists and is tested — `filtering.h` carries the PCF radius, the PCSS penumbra from a blocker search and the specialization sample counts, and `cy/shadow.slang` holds the taps — but every one of them is written against an ATLAS TILE (`filter_radius_uv` takes an atlas size and a tile size). The sentence this requirement turns on is `filter kernels SHALL account for page boundaries so that filtering never samples across into unrelated pages`, and nothing in the tree resolves a tap that crosses a page edge: two adjacent virtual pages can sit anywhere in the physical cache, so an atlas-relative kernel samples an unrelated light's page. The stochastic path is likewise absent — no shadow visibility signal reaches `src/rendering/denoising/`. What would observe it is a case that places two virtual pages of one light in non-adjacent physical slots and requires a kernel straddling their shared edge to read the neighbour through the page table rather than through physical adjacency. `ShadowLever::FilterQuality` is the budget-lever sentence and is already declared and swept."

[[coverage]]
row = "virtual-shadows"
requirement = "Bias derived, not tuned"
evidence = "test:unit.render_shadows"
case = "shadow bias is derived from three measurements, and overrides are counted"
note = "the requirement names three inputs and the case varies each one alone: a coarser texel footprint raises the constant and the normal offset, a grazing surface raises the slope term, and a caster with half a metre of geometric error raises the normal offset by at least that — the term a conventional shadow map has no reason to have. Receiver-plane information shrinks the constant without detaching contact, which is the requirement's last sentence. The `SHALL be reportable` half is the same case's ledger: two overrides in twenty is not suspect, eight in twenty-six is, and the worst ratio is reported — `a scene requiring many overrides indicates a defect in the derivation`."

[[coverage]]
row = "virtual-shadows"
requirement = "Contact and traced refinement"
evidence = "exempt:m11e"
note = "NOT BUILT. `ShadowLever::Refinement` exists and is first in the reduction order, which is the requirement's second scenario (`refinement SHALL be reduced before paged shadow quality is`) and is swept by `integration.render_shadow_control` — but there is nothing behind the lever: no screen-space contact trace, and no traced path, because `cy::rhi::Capability::RayTracing` is an enumerator nothing in this tree sets (M11.c task 4.4 records the same blockage for this row's `RayTraced` and `Hybrid` modes and says they are downstream of task 2.6). What would observe it is a case in which a receiver resting on a surface, at a page footprint deliberately too coarse for the contact, gains contact detail from refinement while the paged result underneath is unchanged — an ADDITION to the paged result, per pixel by importance, which is the half a global toggle would fail."

[[coverage]]
row = "virtual-shadows"
requirement = "Fallback chain"
evidence = "test:unit.render_shadows"
case = "the fallback chain always answers, and says which rung it took"
note = "every rung of the declared chain walked in one case, in order, against one cache: nothing resident answers `Unshadowed`; with an approximation available, `Approximation`; with a coarser page of the same light on the shared lattice, `CoarserPage` naming that page; with the page itself rendered, `Requested`; with both dirtied, `StalePage` returning the page's own physical slot, because stale contents are a rung and not a black square; and past `max_stale_frames` it moves on rather than showing last minute's shadow. `The substitution used SHALL be recorded per page and reportable` is the `SubstitutionLedger` in the same case, and `the frame SHALL never wait` is the `starved` path in `a page that has only just arrived is not evicted underneath its own light`."

[[coverage]]
row = "virtual-shadows"
requirement = "Content-specific caster policy"
evidence = "exempt:m11e"
note = "NOT DECLARED ANYWHERE. This requirement asks five content classes to declare a shadow caster policy selected FROM THE SHADOW TEXEL FOOTPRINT, and no such declaration exists: `src/foliage/` states in `cook.h` that there is no foliage shadow path at all (it publishes `rendering::vg::GeometryInstance` and is shadowed by the same passes as anything else), its aggregate and canopy tiers are the general geometry hierarchy selected on SCREEN error rather than on shadow texels, `src/terrain/` has no separate shadow renderer to forbid and therefore nothing to check, and neither water's `SHALL NOT cast opaque shadows by default` nor the translucent staging is expressed as a policy a test could read. What would observe it is a policy table keyed by content class and resolved against `shadow_texel_world_size()`, with a case requiring a forest past a measured footprint to cast from one aggregate rather than from its leaves, and water to answer `no opaque shadow` without an authored distance anywhere in the decision."

[[coverage]]
row = "virtual-shadows"
requirement = "Multi-view page sharing"
evidence = "test:unit.render_shadows"
case = "two views needing one page mark it once, and the secondary view weighs less"
note = "WRITTEN FOR THIS MAP, because the mechanism was in `pages.h` and nothing exercised it. There is no merge STEP to test — two views mark the same page id and compaction merges them — so the case is written against the two ways that construction can be wrong. A set that emitted the shared page twice is one page rasterised once per view; a merge that kept the LAST view's weight is a reflection probe deciding the main camera's shadow quality, so the main camera marks FIRST and the probe SECOND and the case would pass on a last-writer merge if written the other way round. It then follows the weight downstream: under pressure the probe-only page coarsens through `apply_resolution_bias` and the shared page does not, and at equal age and class the shared page outranks the probe's in `staleness_priority`. Proved red before it was recorded, twice: compaction's `math::max` replaced by `math::min` takes the shared page's weight to the probe's 0.2, and deleting the merge branch altogether emits three pages where two views need two."

[[coverage]]
row = "virtual-shadows"
requirement = "Shadow diagnostics"
evidence = "exempt:m11e"
note = "HALF-BUILT, and the built half is real: `PageEntry` carries the light, the clip level, the virtual and physical page, the state, the age, the update class, the pin and — the one this requirement is most specific about — `dirty_reason` and `dirty_source_id`, kept as the FIRST reason rather than the last, which `a caster that moves dirties the pages it left and the pages it entered, and no more` asserts by name and id. `ShadowCacheStatistics` answers the profiler's pages resident, requested, dirty, rendered, evicted and starved, and `entries()` is deterministic so an overlay cannot flicker. WHAT IS MISSING is everything downstream of a device pass: the caster count per page and the last render cost of a real rasterisation, the cost of page marking, caster culling, rasterisation and filtering as separate numbers, and every visualisation the requirement enumerates — no shadow debug view exists in this tree. What would observe it is a debug-view registry entry per visualisation, checked the way `clouds: every debug view draws something, and a weather rejection is its own colour` checks the sky's, plus per-pass timings from the passes deferred above."
