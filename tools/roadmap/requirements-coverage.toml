[[coverage]]
row = "virtual-texturing"
requirement = "Residency models"
evidence = "exempt:m11e"
note = "`ResidencyModel` has the four models and `StreamedMip is a first-class model and is not virtual` pins their classification, but nothing outside the virtual-texturing module reads a texture's model. There is no single texture handle routed by model, and the material compiler does not pick a sampling path from it. Re-enter with a material sampling one handle under each model and a case where a model change recompiles the material with no authored edit."

[[coverage]]
row = "virtual-texturing"
requirement = "Virtual address space"
evidence = "test:unit.virtual_texturing"
case = "the encoding is versioned, so a volumetric space can arrive later"
note = "The address carries a version field, so a volumetric encoding can be added without invalidating existing addresses. `an address round-trips through its own encoding` and `a field beyond its bit budget is reported rather than silently wrapped` cover the encoding. `a frame is never missing, only coarser — over the whole address space` addresses a texture in full with only the tail resident. Descriptions hold no physical placement."

[[coverage]]
row = "virtual-texturing"
requirement = "Page tables"
evidence = "test:unit.virtual_texturing"
case = "the lookup answers identically whichever representation is in force"
note = "The lookup returns the same answer under flat and sparse tables. `a small address space is flat and a large one is sparse` covers the size choice, `many pages becoming resident is one batch, not one call each` covers batched updates, and `the generation advances on every rewrite, so a stale read is detectable` covers generations. render.virtual_texturing_gpu uploads the table and samples it from a shader."

[[coverage]]
row = "virtual-texturing"
requirement = "Tiles and borders"
evidence = "exempt:m11e"
note = "Border sizing is arithmetic only: `a border is sized for the filtering the sampling path may use` derives it from anisotropy and refuses a thin border. No tile is cooked with replicated neighbour texels, no case samples across a tile edge to show the absence of a seam, and tile size is a description field rather than a measured, recorded decision. Re-enter with a cooked-tile border fill, a device case that filters anisotropically across a tile boundary against an unpaged reference, and a recorded tile-size measurement."

[[coverage]]
row = "virtual-texturing"
requirement = "Physical tile cache"
evidence = "test:unit.virtual_texturing"
case = "a thousand virtual textures share one cache"
note = "A thousand virtual textures of one format class share one physical cache. `the semantic decides the cache class and the mip reduction, in one place` separates colour, normal, mask and HDR classes, and `a full cache refuses rather than choosing a victim` leaves eviction to the residency policy."

[[coverage]]
row = "virtual-texturing"
requirement = "Resident mip tail"
evidence = "test:unit.virtual_texturing"
case = "a frame is never missing, only coarser — over the whole address space"
note = "Every page over the whole address space resolves after only the tail is resident (and is asserted missing before it is), and a fallback sample reports desired mip, resident mip and deficit. `the mip tail is pinned, and a cache too small to hold it is a configuration error` and the device suite's page-table sampling case hold the guarantee on the GPU."

[[coverage]]
row = "virtual-texturing"
requirement = "GPU feedback"
evidence = "test:render.virtual_texturing_gpu"
case = "vt feedback: a shader writes it, the GPU resolves it, and no pixel reaches the CPU"
note = "A shader writes per-page counts and the GPU compacts them, so the CPU maps only the compacted list. `bytes_read` is asserted and the list is compared in order with the CPU mirror. `vt feedback: the density lever is a quality lever and it moves the sample count` covers density, and m7:virtual-texturing-gpu (proven) runs this suite. Feedback in a visibility-buffer pipeline is not exercised."

[[coverage]]
row = "virtual-texturing"
requirement = "Predictive prefetch"
evidence = "test:unit.virtual_texturing"
case = "prefetch asks for coarse pages and leaves the fine ones to feedback"
note = "A WorldCell prediction hint goes through the residency server and requests only the coarse mips (21 pages, not mip 0), leaving the fine pages to feedback. The server counts these prefetches for prediction accuracy. Camera, cinematic and network hint sources share the PredictionSource enum and are not separately exercised."

[[coverage]]
row = "virtual-texturing"
requirement = "Runtime producers"
evidence = "exempt:m11e"
note = "The `PageProducer` interface, its declared cost and production on a worker pool exist, and test producers are driven through them (`the residency schedule becomes tiles, production, and pages the sampler can find`, `a producer that fails releases its tile instead of publishing a page`). The engine registers no producer of its own: none for cooked disk tiles, terrain composition (terrain's MaterialPageCache is separate), decals, world state or procedural. Production writes CPU staging, not the render graph. Re-enter with an engine terrain producer rendering through the render graph, cached until invalidated."

[[coverage]]
row = "virtual-texturing"
requirement = "Runtime page invalidation and persistence"
evidence = "exempt:m11e"
note = "Invalidation and persistence classes exist: `invalidation releases the affected tiles and never the mip tail` and `a runtime page declares how it persists, and a derived one is never saved`. No SaveGame page is ever written to the world persistence overlay as a delta over the cooked base, so the terraforming scenario has no mechanism. Re-enter with a produced page delta recorded through cy::world-persistence and a save/load case restoring it."

[[coverage]]
row = "virtual-texturing"
requirement = "Texture semantics and mip generation"
evidence = "exempt:m11e"
note = "`mip_reduction_for` maps each semantic to a reduction (`the semantic decides the cache class and the mip reduction, in one place`). The importer averages colour in the right space and can preserve alpha coverage (unit.import `texture: alpha coverage is preserved when asked for`). Nothing generates normal-map mips as renormalised vectors or height mips by a declared reduction, so the normal scenario fails. Re-enter with semantic-driven mip generation and a case that mips a normal map and requires every texel of every level to be unit length."

[[coverage]]
