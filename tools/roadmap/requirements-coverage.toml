note = "An overlay tombstone is applied to private staging during activation, so the destroyed entity never exists and the authored cell is unchanged. unit.world's `an unloaded region's state is available without loading it` and `a save against different content is detected, not silently applied` cover the other two scenarios."

[[coverage]]
row = "world-partition-and-streaming"
