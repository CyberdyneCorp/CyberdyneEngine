# FIVE CASES WERE WRITTEN FOR THIS MAP BECAUSE THE REQUIREMENTS THEY ANSWER HAD NONE. The parallel
# paragraph of "Frustum culling" had no case at all — `CullOptions::jobs` was never passed a job
# system by any test in the tree — and neither had the layout claim of "Spatial indexing", the
# frame-arena scenario of "Culling results", or the whole of "Culling diagnostics". EACH WAS WATCHED
# GOING RED BEFORE IT WAS BELIEVED, against build/m11c-cov-geom, by breaking the thing it names:
#
#   the broad phase reads three dense arrays      spatial.cpp: an always-visible instance also
#                                                 enters the renderable tree -> renderables 2, not 1
#   every stage the diagnostics name is counted   cull.cpp: `wall_nanoseconds = 0` -> the clock check
#   the result lists are the frame arena's        frame_memory.cpp: `reset_frame_arena()` stops
#                                                 resetting -> 4,512 bytes still held after the frame
#   eight workers produce the serial visible list cull.cpp: the merge runs in REVERSE partition
#                                                 order -> same 2,129 survivors, different order
#   below the threshold the same call runs        cull.cpp: `parallel_threshold` ignored -> 4
