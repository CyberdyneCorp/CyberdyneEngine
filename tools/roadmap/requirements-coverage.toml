requirement = "Engine-owned virtual geometry"
evidence = "exempt:m11e"
note = "THE OPTION REMOVES NOTHING IN THIS TREE. `CY_VIRTUAL_GEOMETRY` appears in cmake/features.cmake (its declaration and the cross-check that it needs a renderer), in this module's CMakeLists.txt comment and in src/ui's — and in NO `#if`, no `target_compile_definitions`, and no `if()` around a target or a source. The module compiles and links in every configuration, so `-D CY_VIRTUAL_GEOMETRY=OFF` produces a build that behaves identically to one with it on. That is precisely the defect cmake/features.cmake itself writes down for CY_NETWORKING at M9 — \"an option that removes nothing is not an option; it is a line in a table\" — and m8c's `feature-options-off` criterion does not catch it, because it asks whether the tree still BUILDS with the option off, which it does. The ownership half of this requirement is true and visible: the format, the hierarchy, the error metric, the page layout, the residency manager and the traversal are all in src/rendering/virtual_geometry/, with only the simplifier integrable behind an engine-owned interface. WHAT WOULD OBSERVE IT: a `#if defined(CY_VIRTUAL_GEOMETRY)` around the frame's use of `GpuTraversal` and `GeometryCache`, plus a case requiring an asset to render through its coarse resident representation with the option off — the shape `feature-options-off` already has for CY_VFX, one assertion deeper."

