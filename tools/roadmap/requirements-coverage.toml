# --- virtual-geometry ---------------------------------------------------------------------------------
#
# THE EIGHTEEN TEST-BACKED MAPPINGS WERE MUTATION-TESTED AGAINST build/m11c-final, ONE AT A TIME,
# AND TWO SURVIVED. Same experiment as the row above — break what the mapping names, rebuild one
# target, run the case by name, restore and verify by md5. 18 mutated, 16 red as they should be, 2
# SURVIVED and were repaired by strengthening the case: "Instance culling" (the projected-screen-size
# instance cull deleted — `minimum_instance_pixels` is zero throughout that suite, so the counter was
# always zero and the accounting identity could not see it) and "GPU page table and residency" (the
# generation frozen at eviction — the slot was never reused, so `redeem` refused for absence rather
# than for the generation). Both now go red under the same mutation. The eight EXEMPTIONS were read
# rather than mutated, which is what an exemption is for. What went red first time includes the four
# device cases, each broken on the DEVICE side rather than in the reference they are compared
# against: the GPU view packed with a wrong pixels-per-unit scale, the page table uploaded with every
# page marked resident, the attached pyramid never enabled in `HzbParams`, and the visibility
# buffer's material bin count forced to one.
#
# TWENTY-SIX OF TWENTY-SIX, and EIGHT OF THEM ARE EXEMPTIONS rather than tests. Each exemption names
# a verified absence in this tree and what would observe it; none of them says "not tested". The
# eight are not evenly distributed and that is the finding: the cook, the hierarchy, the page format,
# the residency manager, the GPU traversal and the visibility buffer are built and device-tested,
# and what is missing is everything that would connect them to a frame — the build-time option that
# removes nothing, the hardware rasterisation path, the budget controller, assemblies, the
# capability-driven path selection, the visualisation modes, tangent storage, and the
# class-appropriate cooker policies. src/rendering/virtual_geometry/README.md's "What is absent"
# section names four of the eight from the module's own side; this map found the other four by
# reading the specification against the tree.
#
# THREE CASES WERE WRITTEN FOR THIS MAP. The classes an asset declares had no round-trip case, the
# import report's figures were printed rather than asserted, and nothing anywhere asserted that the
# renderable component exposes no cluster, page or hierarchy concept — which is the whole of the
# "Gameplay API" requirement and the one a future field would break silently. Each was watched going
# red against build/m11c-cov-geom before it was believed:
#
#   the classes an asset declares are what a      asset.cpp: the header always writes
#   reader gets back                              `DeformationClass::Static` -> the reader gets 0
#   the import report carries every figure        cook/geometry.cpp: `cluster_metadata_bytes = 0`
#   the renderable component names an asset and   components.h: a reflected `resident_page_budget`
#   a material, and nothing below them            field -> the schema walk names it twice

[[coverage]]
