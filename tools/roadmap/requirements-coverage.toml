case = "Frustum: the AABB test is conservative and never omits an intersecting box"
note = "The AABB test accepts every intersecting box and rejects boxes beside and behind the frustum. `Aabb: corner indexing matches the frustum's sign-mask bit order` pins the sign-mask corner selection. integration.math_simd's batch cull is bit-identical to this scalar test."

[[coverage]]
