evidence = "test:integration.render_gi_pipeline"
case = "a frame runs every subsystem and the software tier answers on this machine"
note = "the requirement's content is a DECOMPOSITION — named subsystems with separate ownership, and hardware ray tracing as one tracing tier inside one renderer rather than a second renderer. The case runs one frame and requires each named subsystem to report its own work in its own record (field bricks solved, probes placed, surface pages updated, probes updated), and requires the world tier that answered to be the software one WITH the acceleration service inactive — which is the `no parallel renderer` half as an observation rather than as an intention. The separability half is the link graph `gi/lighting.h` declares: the caches name abstract seams and never each other."

