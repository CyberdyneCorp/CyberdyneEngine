# --- rendering-post-processing, temporal-rendering, rendering-lighting-and-shadows ------------------
#
# M11.c section 3's three rows, and THE COUNT IS ELEVEN OF THIRTY-SIX. That is the finding rather
# than the shortfall: reading these three specifications requirement by requirement is what the
# `image-rows-at-complete-grade` criterion exists to force, and most of what is unanswered is
# unanswered because the thing it asks for IS NOT BUILT — not because nobody wrote the entry.
#
# WHAT IS DELIBERATELY ABSENT, named so the next reader does not have to re-derive it:
#
#   post  `Ambient occlusion` asks for GTAO computed from depth and normals on a device, a bent
#         normal, and filtering through the shared denoiser; `unit.render_post` tests the ambient
#         term's arithmetic and no device pass exists. `Subsurface scattering`, `Motion blur`,
#         `Temporal upscaling` and `Variable-rate shading` have no implementation at all.
#         `Anti-aliasing` is the one that matters most to this rung and it is the one with least
#         behind it: `FramePassKind::Temporal` is declared by every assembled frame and NOTHING IN
#         THIS TREE RECORDS IT — there is no temporal resolve shader under `src/rendering/` — so
#         MSAA, TAA, FXAA and SMAA are four names with no pass between them.
#   temporal  `History resources` asks for render-graph integration and aliasing; `Motion vectors
#         are derived` asks for skinned, virtual-geometry, mesh-particle and world-space-UI motion
#         and the suite covers camera and static motion; `Temporal diagnostics` asks for a
#         VISUALISATION of motion vectors and disocclusion, which does not exist.
#   lighting  `Light types` asks for mobility classification, `Point and spot shadow projection` for
#         cube maps with per-face culling, `Shadow rendering optimisation` for proxy meshes and a
#         depth-only pipeline, `Decals` for GPU-scene residency, and `Stochastic many-light` for
#         ray-traced or shadow-map visibility on the selected samples. Each is a device path.
#
# AND ONE ENTRY THAT CANNOT BE WRITTEN YET. `rendering-post-processing` gains "The chain in the
# picture is the chain in the frame" in `openspec/changes/implement-m11c-image/specs/`, and
# `requirements.py` reads `openspec/specs/`, so an entry for it would name a requirement the
# specification does not yet ask. It is answered by `integration.render_assembly`'s "the frame
# passes through tone mapping, and says so itself" the moment the delta is synced.

