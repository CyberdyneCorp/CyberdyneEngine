note = "41 load magnitudes from x1.00 to x2.40, each held 800 frames with lever changes counted over the last 450 — the certification is the SWEEP because the levers are a discrete ladder and one step magnitude can make any control law look stable (the arbiter spike's own first draft passed a single load and oscillated on 27 of 71). The companion cases carry the rest of the requirement: `the reserved minimum is declared and reported rather than silently crossed`, `pinned mode stops everything and reports the overrun instead of correcting it`, and `released from pressure, authored quality comes back on every load`. The declared reduction ORDER is `ShadowLever`'s enumerator order. What the sweep does not certify, and says so in the module README, is that the declared relative costs describe a real shadow pass; that needs a measured device pass. MUTATION-PROVED ON THE SENTENCE THE SWEEP DECIDES, WHICH IS NOT THE HYSTERESIS ONE. Disabling the tighten path — a subsystem over its allocation that never moves a lever — turns `over_budget` red, which is the requirement's own `WHEN shadow cost exceeds its allocation THEN ... SHALL be adjusted`. Removing the tighten MARGIN does NOT move this case, because the sweep's arbiter half gates its own grant at `relax_margin` and supplies the band the subsystem's margins would: the hysteresis clause is decided by `without the margin the controller ratchets quality away and never gives it back` in the same suite, which that mutation does turn red."

[[coverage]]
row = "virtual-shadows"
requirement = "Filtering and softness"
evidence = "test:render.soft_shadows"
case = "(b) the penumbra widens with the distance between blocker and receiver"
note = "SOFTNESS FROM THE SOURCE'S SHAPE, IN THE FRAME, FOR THE DIRECTIONAL LIGHT. `cy/shadow.slang` gained percentage-closer soft shadows — a rotated blocker search, the directional penumbra `(blocker - receiver) * depth_range * tan(angular radius) / width` from similar triangles, and a filter over a disc of that radius — and `lighting::make_pcss_shape` derives the one number the light contributes from its ANGULAR RADIUS and the map's footprint, so there is no softness parameter to tune. `cy/frame.slang` runs it behind `kSoftShadowPcss`. The named case renders `pipeline_test::FrameScene` with a directional map and two equal boxes, one resting on the floor and one hanging 1.6 m above it, and counts floor pixels in penumbra (neither the unshadowed nor the sunless frame's pixel, exactly): the hanging box's shadow has several times the resting one's where the 3x3 filter gives them the same. The same suite holds `(a) soft shadows off is the frame before the change, byte for byte` against a reference drawn by the pre-change SPIR-V and `(c) no light leaks into an umbra and no shadow speckles an open floor`; `integration.render_soft_shadows` measures the band on the host — `a penumbra widens with the distance between the blocker and the receiver` (each doubling of the height roughly doubles it) and `softness follows the light's angular radius, with nothing else to tune`, the first scenario. Filtering quality is the budget lever through `ShadowQuality`, which sets both tap counts. Each frame case was proved red by a mutation. STILL EXEMPT UNTIL m11e, BY NAME: kernels that account for PAGE boundaries — the frame's lookup is one map with no page table, so a tap crossing a virtual page edge into an unrelated physical page is not a case this frame can produce, and what would observe it is still a kernel straddling two non-adjacent physical slots of one light read through the page table; the stochastic few-sample path reconstructed through the shared denoiser as a visibility term (the second scenario) — the disc is rotated per pixel and not reseeded per frame, and no shadow visibility signal reaches `src/rendering/denoise/`; and softness for local lights, whose radius the frame's `GpuLight` does not carry."

[[coverage]]
row = "virtual-shadows"
requirement = "Bias derived, not tuned"
evidence = "test:unit.render_shadows"
case = "shadow bias is derived from three measurements, and overrides are counted"
note = "the requirement names three inputs and the case varies each one alone: a coarser texel footprint raises the constant and the normal offset, a grazing surface raises the slope term, and a caster with half a metre of geometric error raises the normal offset by at least that — the term a conventional shadow map has no reason to have. Receiver-plane information shrinks the constant without detaching contact, which is the requirement's last sentence. The `SHALL be reportable` half is the same case's ledger: two overrides in twenty is not suspect, eight in twenty-six is, and the worst ratio is reported — `a scene requiring many overrides indicates a defect in the derivation`."

[[coverage]]
row = "virtual-shadows"
requirement = "Contact and traced refinement"
evidence = "test:render.soft_shadows"
case = "(d) the contact term darkens where a coarse map misses the contact, and nowhere else"
note = "A SHORT SCREEN-SPACE TRACE, ADDED TO THE MAP'S RESULT, PER PIXEL AND BUDGETED. `src/rendering/contact_shadows/` traces each pixel toward the directional light through the prepass depth — lifted off its surface by a pixel's footprint along the prepass normal, `thickness` bounding what counts as inside an occluder — into a target the frame's `FramePassKind::ContactShadows` stage declares through `FrameStageDeclaration`; `cy/frame.slang` takes the DARKER of the map's visibility and the trace's, so refinement is an addition and never a replacement. The named case is the first scenario: a 128-texel map (14 cm a texel) over the pipeline scene, where every pixel that changes has the trace's term below one, every such term lies within the trace's reach of a box the geometry places there, no pixel gets brighter, and most floor pixels the geometry puts in contact shadow and the coarse map left lit go dark. `(e) the trace on the device is the host reference's` compares the dispatch with `contact_shadow_reference`, and `integration.rendering_contact_shadows` holds `an open plane traces to exactly one, at every light elevation` and `a contact darkens where the box is between the floor and the light, and nowhere else` against the analytic geometry. Selection is per pixel — beyond `max_distance` or facing away from the light a pixel is not traced — and `refinement is the budget lever: none traces nothing, and a shorter reach drops the far receivers` is the second scenario: `apply_refinement` scales the reach by `ShadowLever::Refinement`'s value and at zero nothing is traced while the map is untouched. Each frame case was proved red by a mutation. STILL EXEMPT UNTIL m11e, BY NAME: the TRACED path — a short ray through `ray-tracing-infrastructure` — because no device path in this tree traces a shadow ray (the rays still go to `cy::Bvh` on the processor); and importance beyond distance and facing, since no hero-receiver signal reaches the frame."

