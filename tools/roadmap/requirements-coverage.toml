note = "Ray/triangle hits return usable barycentrics, the picking scenario's last step. The suite also has ray casts, closest points, point-in-polygon and hulls, ear clipping, Delaunay, polygon booleans and offsetting, plane clipping, atlas packing, welding and tangents, with property checks in integration.math_geometry. The BVH-then-triangle picking path is the editor's."

[[coverage]]
