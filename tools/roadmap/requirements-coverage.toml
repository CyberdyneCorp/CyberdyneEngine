# WHAT IS HERE, AND WHAT IS DELIBERATELY NOT. Entries are added only after reading the complete
# requirement and identifying a case or gate that carries all of it. A neighbouring case that
# answers only one clause stays UNANSWERED; the remaining titles printed by the audit are work still
# owed rather than a reason to weaken an entry. The RHI entries above preserve PR #2's complete
# three-backend audit; the editor entries below add PR #3's independently reviewed coverage.

# --- live-editing ----------------------------------------------------------------------------------
#
# FIVE REQUIREMENTS HAVE EXECUTABLE EVIDENCE. The other six are recorded M11.e deferrals rather
# than borrowed from a neighbouring case: each note names the missing end-to-end behavior and the
# test that must replace the exemption. That is sufficient for an honest Working tier and
# deliberately insufficient for Complete.

[[coverage]]
row = "live-editing"
requirement = "Live editing is a compilation step"
evidence = "test:integration.editor_live_edit"
case = "a field edited while playing is announced before it is applied"
note = "the compiler is a compiler rather than a setter because `announce()` answers BEFORE the change is made, from the same function `apply()` uses — so the announcement cannot disagree with the outcome. That is the case."

[[coverage]]
row = "live-editing"
requirement = "Live edit policy"
evidence = "criterion:m11b:live-edit-policy-exists"
note = "the engine's policy table against the requirement's own table and against the classification the defaults are derived from, with RecreateEntity and RestartWorld never derived."

[[coverage]]
row = "live-editing"
requirement = "Runtime state is preserved"
evidence = "test:integration.editor_live_edit"
case = "a field edited while playing keeps the runtime state the simulation owns"
note = "the field classification governs what survives a live edit: Authoring is updated, RuntimeState and PersistentState are preserved. The case edits one field of each class and reads the runtime state back out of the session."

[[coverage]]
row = "live-editing"
requirement = "Play modes"
evidence = "criterion:m11b:play-modes-exist"
note = "the three modes as the engine declares them, as the editor declares them, and as this requirement's own table names them, required to agree on spelling, order, stepping and isolation."

[[coverage]]
row = "live-editing"
requirement = "Live bridge protocol"
evidence = "test:unit.editor_bridge"
case = "a tag this build does not know is reported rather than fatal"
note = "the requirement asks for a VERSIONED protocol, and the property that makes a version number worth anything is what an older build does with a newer message: report it, not die. That is the case, over a real socket pair."

[[coverage]]
row = "live-editing"
requirement = "Live asset reload"
evidence = "exempt:m11e"
note = "Asset replacement is implemented and observed by `integration.assets_watch` (`a reload replaces the bytes inside the asset every Ref already holds`) and failed reload keeps the prior payload. The requirement also demands publication at a safe GPU/task epoch and forbids consumers retaining raw pointers across frames; no single end-to-end case joins replacement to the retirement queue yet. Re-enter with a test that holds an in-flight resource reference across reload, proves the stable handle resolves the new payload, and proves the old payload is reclaimed only after the recorded epoch."

[[coverage]]
row = "live-editing"
requirement = "Shader and material live reload"
evidence = "exempt:m11e"
note = "`unit.shader_hot_reload` observes stable shader identity, rebuilt library entries and pipeline invalidation, and the material system separates parameters from structural programs. The editor-to-worker-to-publication path required here is incomplete: no case saves a shader through the editor, keeps the last working pipeline after a failed asynchronous compile, and observes the replacement in a subsequent frame. Re-enter with that device-backed lifecycle and a failure control that leaves the previous frame intact."

[[coverage]]
row = "live-editing"
requirement = "Module hot reload is a declared capability"
evidence = "exempt:m11e"
note = "`integration.abi_reload` covers declared reload, state migration, refusal when a live type would be dropped, and refusal for a module that did not opt in. The full quiesce/serialise/unregister/load/register/migrate/resume sequence is not observed as one lifecycle, and the editor build/reload surface currently exercises Swift development modules only. Re-enter with one case that records every phase in order while the main loop continues and names the blocking owned type on the negative path."

[[coverage]]
row = "live-editing"
requirement = "Runtime inspection"
evidence = "exempt:m11e"
note = "The live bridge and editor expose selected runtime state and diagnostics, but no inspector enumerates every domain this requirement names — entities, components, resources, memory, tasks, GPU scene, world cells, residency, schedules and logs — through all three play transports. Re-enter when the runtime publishes those records through the common bridge, with a read-only-default test and the same query replayed against local, separate-process and remote transports."

[[coverage]]
row = "live-editing"
requirement = "Runtime tweaking is distinct from authoring"
evidence = "exempt:m11e"
note = "The live-edit session preserves authoring data and runtime-owned fields, but the product has no complete keep-changes flow that diffs final runtime state, offers only Authoring fields, and commits selected values as one ordinary transaction. Re-enter with a play session that tweaks transform and health, keeps only transform, proves the document remained clean before promotion, and proves undo restores the authored transform."

[[coverage]]
row = "live-editing"
requirement = "Live editing diagnostics"
evidence = "exempt:m11e"
note = "Policy announcement and structured refusals exist, but the diagnostics surface does not yet account for every pending/applied edit, instance-set mismatch, overwrite by simulation, preservation loss, reload failure, protocol version and measured latency. Re-enter with a diagnostic ledger test that produces each outcome and requires the UI and bridge resource to report the same state, reason, remedy and latency."

# --- editor-architecture ---------------------------------------------------------------------------
#
# FOUR REQUIREMENTS HAVE PROVEN ROADMAP OR transaction evidence. The other nine are mapped to M11.e
# with the exact unsupported clauses and re-entry tests. Core authoring is now Working-grade; the
# exemptions keep broad build, deployment, debugger, renderer and collaboration claims from being
# mistaken for Complete.

[[coverage]]
row = "editor-architecture"
