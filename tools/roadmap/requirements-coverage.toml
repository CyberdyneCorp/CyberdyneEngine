note = "Three of the eleven contracts have consumers of cell lifecycle: water (`a continental river is one body whose runtime data is segmented` in integration.water_streaming), foliage and environment fields, and terrain has a cell channel and footprint arithmetic only. Rendering GPU-scene publication, physics bulk registration, navigation tile residency, GI payload ingestion, audio, networking replication cells and AI tier changes consume no cell event. Re-enter when each listed subsystem consumes `CellEventQueue`, with one case that activates a cell and observes each consumer at its declared point."

[[coverage]]
row = "world-partition-and-streaming"
requirement = "World cooking pipeline"
evidence = "exempt:m11e"
note = "`CellBuilder` is an in-memory cook of archetype blocks, references and cost. No pipeline resolves an authoring graph, applies variants, flattens hierarchy, partitions from authoring data, content-addresses results or cooks incrementally (src/world/README.md, `No cooker and no asset loading yet`). Re-enter with a world cook over the build graph and a case where one material edit recooks only dependent cells and a cell-size change repartitions with no authoring change."

[[coverage]]
row = "world-partition-and-streaming"
requirement = "World validation"
evidence = "exempt:m11e"
note = "`validate_cell` detects duplicate persistent identifiers (`duplicate persistent identifiers are a cook error, and are named`), the dependency report flags explosions, and `forced_to_coarsest` marks oversized entities. Broken references, dependency cycles, conflicting layers, missing migrations and orphaned overrides are undetected, there is no error/warning classification and no editor surface. Re-enter with a validator over a world holding each defect, a configured severity, and the same report from the editor."

[[coverage]]
