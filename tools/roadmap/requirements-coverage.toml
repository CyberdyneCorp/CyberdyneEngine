requirement = "Physically based atmosphere"
evidence = "test:unit.render_sky"
case = "atmosphere: a different planet gets a different sky, from its coefficients alone"
note = "the requirement's own first scenario, and it is decided by a RATIO rather than by a difference: Earth's zenith carries several times as much short-wavelength radiance as long, the dusty planet's is nearly grey and not merely dimmer, and the only thing that differs between the two runs is the scattering coefficients. `atmosphere: a composition change is a parameter transition, not a preset switch` beside it is the runtime-change half — `blend_atmospheres` at 0.5 is halfway in every coefficient and at the endpoints is the endpoints."

[[coverage]]
row = "atmosphere-sky-and-clouds"
requirement = "Precomputed atmospheric tables"
evidence = "test:integration.render_sky_tables"
case = "sky tables: the sky is a lookup — drawing it integrates no atmosphere"
note = "the requirement's opening sentence, COUNTED rather than described: four thousand sky directions are sampled and `stats().directions_integrated` is required not to have moved, so a table that silently fell back to marching fails. `sky tables: the sky view regenerates incrementally as the sun moves` is the incremental half — 96 sun positions over a quarter-day against a full `SkyViewTable` rebuild as the oracle, at three update budgets — and `sky tables: transmittance is tabulated, reused, and agrees with the march` is `regenerated only when the parameters they depend on change` — a second build of the same atmosphere counts a reuse and a changed one counts a rebuild, so the reuse cannot be a table that never rebuilds — with `SkyTableQuality` as the resolution setting and `stats()` as the reported generation cost. MUTATION-PROVED, AND THE FIRST ATTEMPT SURVIVED. `IncrementalSkyView::sample`'s body was replaced with a per-call `sky_radiance()` march, rebuilt, and this case stayed GREEN: `directions_integrated` is a counter only `update()` can move and `sample()` is `const`, so what the count decides is `update() was not re-run` rather than `the sky was not integrated per pixel`. The case was STRENGTHENED rather than re-pointed — inside one table column a lookup is a LINEAR blend of stored texels, so the midpoint of two azimuths in one column is exactly the mean of the two, and the marching mutant departs from that by 1.04% against the table's 1.7e-5%."

[[coverage]]
row = "atmosphere-sky-and-clouds"
requirement = "Aerial perspective"
evidence = "test:render.world_aerial_perspective"
case = "world aerial perspective: at the horizon the distant surface meets the sky"
note = "DISTANCE IS THE ATMOSPHERE'S, IN A FRAME. `samples/10-world` integrates `sky::AerialPerspectiveTable` every frame for its own camera from the world's `Atmosphere` and `AtmosphereTables` — the ones its sky lighting is composed from — and its one lit fragment path (terrain, foliage, and the sea when water shading is off) multiplies every fragment by the table's transmittance and adds its in-scattering through `cy/aerial_perspective.slang`, divided by the same exposure as the sky; with it on, the dome's clear sky is `sky::IncrementalSkyView::update_aerial` over the same tables. This case draws with that path's COMMITTED SPIR-V (`samples/10-world/shaders/world_spirv.h`) a dome coloured from that clear sky and a lit wall 800 km out whose top edge is the horizon, and requires every column's topmost wall texel to be within 0.03 of the sky texel above it after the shader's tone map — and more than 0.1 apart with aerial perspective off, so the comparison can fail. The requirement's neighbouring sentences are decided in the same suite and one other: `world aerial perspective: the device applies the atmosphere's table` (every wall texel at 6 m to 800 km is `lit * T + S` from the processor's `sample_at()` within 0.01; a wall at 6 m moves by under 0.001; walls further out approach the sky monotonically along the horizon), `world aerial perspective: a changed atmosphere moves the sky and the distance together` (eight times the aerosol, and a 6-degree sun, each move the sky and the distant wall by the same amount and leave them meeting — the 'not separately tuned' scenario as a measurement), `world aerial perspective: off, the frame is the frame before, and the sky is untouched` (bit-identical to the world's shaders pinned at 1fe6446 in `tests/render/world_before_aerial_perspective_spirv.h`); `integration.render_sky_tables`' `sky tables: a surface's aerial perspective is interpolated in depth from the eye`, `sky tables: the aerial perspective table integrated on workers is