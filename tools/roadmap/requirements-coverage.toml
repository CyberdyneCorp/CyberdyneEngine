note = "BAKED BY THE OFFLINE PATH TRACER, SHARING ITS SCENE, MATERIAL AND LIGHT REPRESENTATIONS: `lightmap_bake::bake_lightmaps` packs every receiving object into shared pages (`pack_atlas`: one rectangle per object from its world area, the level's texel density and its own resolution scale), rasterises each object's UV2 into its rectangle and path-traces every texel through `gi::PathTracer` over `MeshSceneTracer` — a static BVH of the level's triangles behind `SceneTracer`/`Occluder` — resolving materials through `gi::GiScene` cards built from the same triangles, for a configurable bounce count, emission as light, alpha-tested and transparent occlusion, buried texels rejected; then denoises through `denoise::Denoiser` with the chart as the hard boundary, dilates every rectangle to its edge, reconciles seams and encodes irradiance, directional or SH L1 planes. The named case holds atlas texels read back through `sample_lightmap` to an independent path-traced reference at 24 points: relative error 0.046 against a bound of 0.10 (32 samples per texel, denoised over a two-pass cascade, against 512 at the point). The same suite holds: 'directional and SH L1 lightmaps keep a normal map's response; irradiance does not' (the scenario; the directional texel stores the gradient of E(n)/pi as the normal tilts, estimated from the same samples), 'an emissive surface lights the room with no placed light at all', 'an alpha-tested surface shadows through its coverage, a transparent one partly', 'a texel buried in a neighbouring object is rejected and filled from its own surface', 'a wide buried strip is filled from its own chart, not the padding beside it' (a regression case: the dilation had a fixed pass count and mixed charts), 'the lightmap bake seeds the dynamic caches from the same run' (every probe valid, a Hybrid query confident on the first frame) and 'the cooked lightmap round-trips, and an unchanged level bakes to the same bytes'. `integration.build_content`'s 'a level bakes to a cooked lightmap, and an unchanged level bakes nothing' is the build-graph node, content-keyed. `render.lightmaps` takes it into `cy/frame.slang`'s ambient term through each draw's `gi_address` and the cooked TexCoords2 stream — bleeding, host/device agreement, the volume excluded for a lightmapped surface as `gi::exclusion_for()` says, and no lightmap byte-identical to a reference drawn before lightmaps existed. Each case proved red by a mutation. LIGHT MOBILITY AND THE SHADOW MASK (the 'Stationary light with shadow mask' scenario, host half): 'a stationary light bakes its indirect light and a shadow mask, not its direct term' — mask 0 under a blocker and 1 in the open, the texel matching the path tracer's indirect-only answer, a Static bake adding exactly the shadowed direct term over pi (0.895 against 0.898), the light's unshadowed direct times the mask equal to its shadowed direct at one and at three times the baked intensity, and every texel of an all-shadow rectangle's gutter dilated to shadow — 'a movable light bakes nothing, not even its bounce', 'a static light bakes exactly what DirectAndIndirect baked before mobility existed' (byte-identical planes), 'a fifth stationary light is refused by name' and 'the cooked lightmap carries the shadow mask, and a version 1 payload still decodes'. A bake that sets no mobility keeps main's texel planes byte for byte. INCREMENTAL REBAKE ('Incremental rebake'): 'moving one object re-solves its region and keeps every other texel byte for byte' (two objects of five traced, 30% of the full bake's rays, every changed texel inside their rectangles, the region within 2% of a full bake), 'a rebake with nothing moved traces nothing and changes nothing', and 'a rebake whose level no longer packs the same falls back to a full bake'. Each proved red by a mutation (openspec/changes/add-lightmap-mobility-and-rebake/evidence/falsification.txt). THE FRAME'S USE OF THE SHADOW MASK (the device half of 'Stationary light with shadow