note = "AUTO-EXPOSURE RUNS ON THE DEVICE NOW. `src/rendering/grading/` meters the frame's scene-referred colour before bloom with three compute dispatches — clear, a 256-bin EV100 histogram, and an adapt pass that takes the percentile mean, the compensation curve and the EV clamps and steps the EV100 toward it at the brightening or darkening speed — and its graded resolve applies that EV (one frame later, so no frame waits on its own metering) or a manual one, as the scalar multiply `1 / (1.2 · 2^EV100)` before the tone curve. The named case renders `pipeline_test::FrameScene` on Vulkan: from four stops under, within 5 % of the gap by `adaptation_seconds(speed, 0.05)` and not half-way before the stated half time; every frame equal to the host's `adapt_ev100` of the device's metered target; a four-times light step metered as two stops and reached at the brightening speed, the step back at the slower darkening one — the second scenario, adaptation speed clamped to the EV range; and the metered frame byte-identical to the same EV pushed manually. Its companions: `the device histogram is the host's bin for bin, and the metered exposure is the host's` (a synthetic room with a bright window, every bin equal to the host's binning and the target and adapted EV equal to `metered_ev100`/`adapt_ev100` to 1e-3 — the first scenario, the window rejected by the percentile, on the device) and `a manual EV100 one stop higher halves every unclipped pixel` (manual exposure as a physical multiply, through a linear curve). unit.render_post keeps the host halves — `a small bright window does not blow out the room`, `the camera's three controls agree with EV, and adaptation has two speeds`, `a manual EV100 reaches the frame's stops through the saturation constant`, `the histogram's binning and the adaptation's deadline are the metering's own`. Every device case was proved red by a mutation. STILL EXEMPT UNTIL m11e, BY NAME: a METERING MASK (every pixel weighs one), and exposure 'published