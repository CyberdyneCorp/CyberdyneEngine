# ====================================================================================================
# M11.c's FIVE MAPPED IMAGE ROWS, CARRIED TO COMPLETE GRADE — the thirty requirements the nine
# entries above did not answer. Written by reading each requirement against the tree, one at a time.
#
# THE RULE THESE THIRTY WERE DECIDED BY, stated because a reader must be able to check the decision
# rather than take it: an entry NAMES A CASE only when (i) every scenario the requirement states is
# observed by a case over the real implementation, and (ii) the mechanism the requirement names
# exists in this tree. Where either fails, the entry is an EXEMPTION that says which sentence has no
# subject here and what would observe it — because a case that would pass with the missing half
# still missing is the green tick this file's header warns about, and it is indistinguishable from a
# real one afterwards.
#
# THE SHAPE OF THE ANSWER, AND IT IS THE FINDING. Eight of the thirty are cases; twenty-two are
# recorded deferrals. That ratio is not a shortage of reading: these five rows carry deep CPU-side
# coverage — parameter derivations, policies, keys, refusals — and what is missing from them is
# almost always A DEVICE PASS. There is no ambient occlusion, fog, depth of field, motion blur,
# bloom, temporal resolve or upscaling shader under `src/rendering/` at all; `git ls-files
# 'src/rendering/**/*.slang'` answers twenty-five files and not one of them is a post-process
# effect. Every one of those deferrals names that, rather than saying "not tested".
#
# THREE CASES WERE WRITTEN FOR THIS MAP AND EACH WAS PROVED RED FIRST, by breaking the thing it
# names and watching it fail: the compute reload case (`shader-system`), the point-light cube-face
# case (`rendering-lighting-and-shadows`) and the invalidation-cause case (`temporal-rendering`).
# ====================================================================================================

