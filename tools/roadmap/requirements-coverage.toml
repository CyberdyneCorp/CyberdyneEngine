evidence = "test:integration.physics_jolt"
case = "a dynamic body falls onto static geometry and stops on it"
note = "The Jolt target links only the engine-owned PhysicsServer surface, while Jolt headers and linkage remain private to the backend; this case creates, steps and queries Jolt entirely through that interface. The reference suites exercise the same vocabulary without backend changes."

[[coverage]]
row = "physics"
requirement = "Jolt as the 3D backend"
evidence = "test:integration.physics_jolt"
case = "one thousand identical box colliders create one Jolt shape"
note = "The case creates one thousand engine shape handles and checks the backend's native-shape creation count is one, directly pinning the Jolt shape cache. Job-bridge, filter, body-id and tuning behaviour are exercised by neighbouring Jolt and conformance cases."

[[coverage]]
row = "physics"
requirement = "2D physics"
evidence = "test:integration.physics_jolt"
case = "a 2D body cannot leave the plane, and Jolt is the one enforcing it"
note = "A body receives out-of-plane motion through the real 3D backend and remains locked to its plane. unit.physics_server separately requires Vec2 query inputs/results, angle conversion and extrusion of a circle to a cylinder rather than leaking 3D implementation types."

[[coverage]]
row = "physics"
requirement = "Physics components"
evidence = "test:integration.physics_bridge"
case = "all eight components are declared, and each names its fields"
note = "The state schema enumerates exactly the eight component families in the requirement and checks their authored versus runtime fields. Bridge and server cases then create static, kinematic and dynamic bodies, compounds, every declared shape family and the triangle-mesh rejection."

[[coverage]]
row = "physics"
requirement = "Fixed-step integration"
evidence = "test:integration.physics_behaviour"
case = "a frame with several ticks steps physics once per tick and never in between"
note = "The case feeds multiple fixed ticks plus a variable render phase and counts server steps, so moving a step outside the Physics stage changes the count. Companion cases pin transform publication, interpolation alpha and teleport suppression."

[[coverage]]
row = "physics"
requirement = "Collision events"
evidence = "test:integration.physics_jolt"
case = "collision events arrive with the pair, the phase and a contact point"
note = "A real resolved contact produces enter/stay/exit data with the ordered pair and contact point. unit.physics_server separately pins trigger channels, normals, user data, contact filtering, bounded buffering and stable pair normalisation."

[[coverage]]
row = "physics"
requirement = "Collision filtering"
evidence = "test:unit.physics_server"
case = "a filter pair collides only when BOTH masks accept the other's layer"
note = "The case flips each mask independently and requires mutual acceptance, preventing an asymmetric one-way implementation. Companion cases require the project collision matrix and both masks, and the event suite proves ignored pairs produce no contact until restored."

[[coverage]]
row = "physics"
requirement = "Queries"
evidence = "test:integration.physics_jolt"
case = "a raycast excludes its own body and reports the surface it hit"
note = "The ray starts from a body that must be ignored and validates the ground hit through the public interface. Shape-cast, overlap, closest-point, filtering, all-hit ordering, concurrent reads and mid-step rejection are pinned by adjacent Jolt and server cases."

[[coverage]]
row = "physics"
requirement = "Character controller"
evidence = "test:integration.physics_behaviour"
case = "a character on a moving platform is carried by it"
note = "The platform is kinematic and the controller must inherit its displacement rather than merely avoid it. The suite also isolates stair lifting, tall-wall refusal, steep-slope classification and slide, ceiling collision, floating motion, self exclusion and teleport reset."

[[coverage]]
row = "physics"
requirement = "Constraints"
evidence = "test:integration.physics_jolt"
case = "a Jolt hinge motor respects its torque cap and angular limit"
note = "The case compares weak and strong torque caps and verifies the hinge angle limit. Companion Jolt cases exercise fixed, point, slider, distance, cone, swing-twist, six-degree, gear and rack solver behavior, including per-axis limits, motors and springs, force/torque break events and handle lifetime. integration.physics_simulation verifies ECS Joint creation and teardown; the reference backend explicitly reports constraints unsupported. Reversing the Jolt gear ratio made its coupling case fail and the mapping was restored."

[[coverage]]
row = "physics"
requirement = "Soft bodies and additional simulation"
evidence = "test:integration.physics_ragdoll"
case = "powered ragdoll motor tracks animation after an impulse and hit weight recovers"
note = "The named case exercises powered pose following, physical hit displacement and recovery; disabling authored motor torque makes it fail. Companion ragdoll cases generate/refine a profile, seed animated world pose and velocity, exercise continuous full-body blend, keep full mode simulation-driven despite later animation targets, preserve partial-body locomotion, and verify teardown, rollback and reference-backend refusal. Removing blend output or velocity transfer makes the full-ragdoll case fail. Jolt integration.physics_jolt separately verifies cloth contact/readback and vehicle drivetrain, wheel-state and lifecycle behavior; the reference backend refuses both optional features."

[[coverage]]
row = "physics"
requirement = "Determinism"
evidence = "test:integration.physics_behaviour"
case = "two runs of the same scene on the same binary produce identical state hashes"
note = "Two independently constructed runs compare every per-tick state hash rather than only their final transforms. Companion cases report the first divergent tick/body and reject cross-platform or lockstep sessions that classify physics as authoritative."

[[coverage]]
row = "physics"
requirement = "Physics debugging"
evidence = "test:integration.physics_jolt"
case = "a dense contact scene exposes narrow-phase cost in step diagnostics"
note = "The dense-contact case demonstrates a narrow-phase bottleneck with broad, narrow and solve job costs. Companion Jolt cases assert solver-space collider geometry (including convex and mesh triangles), contacts, sleep, velocities, centres of mass, broad-phase bounds, joint anchors and limits, active/contact/constraint/island counters, and solver phase timings. unit.physics_server covers stateless query input/result overlays. Mutating the narrow-phase cost or solver-space shape centre fails the focused tests."

[[coverage]]
row = "physics"
requirement = "Heightfield and terrain collision"
evidence = "test:unit.physics_server"
case = "bulk creation is all or nothing"
note = "The case makes one invalid member abort an entire body batch and verifies no partial terrain region remains. The shape suite separately proves heightfield holes affect bounds, while terrain_geometry limits deformation invalidation to the affected collision tile and keeps navigation derived from the same representation."

[[coverage]]
row = "physics"
requirement = "Buoyancy and water interaction"
evidence = "test:integration.physics_buoyancy"
case = "a floating physics body pitches under multi-point authoritative swell"
note = "The layer-4 driver transforms body-local hull samples, queries authoritative water, and applies force and torque through PhysicsServer. The named Jolt case observes actual angular velocity from multi-point spectral swell; removing torque application makes it fail. The reference-backend case observes lift after stepping and checks origin-rebased sampling and dynamic-only validation. Companion unit.water cases pin submerged-volume force, drag, current advection, character water states and render-band agreement."

[[coverage]]
row = "physics"
requirement = "Physics world teardown"
evidence = "test:integration.physics_teardown"
case = "sixty-four play sessions under load, each torn down with work in flight"
note = "Each round creates a world and bridge with bodies, steps under four competing worker threads and destroys it immediately; completion also requires the job system to remain live. Companion cases prove shape release, stale bridge-handle diagnostics and the same play/stop ordering over Jolt's in-flight job bridge."

