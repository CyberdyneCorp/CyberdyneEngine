evidence = "test:unit.world"
case = "a scenario layer is loaded before it is switched, and replication is one pair"
note = "A scenario layer is Loaded ahead and then Activated, and the replication stream is one (layer, state) pair per change. integration.world_streaming's `a scenario switch is one operation over every published cell` and integration.world_activation's `a layer switch publishes and withdraws whole blocks, not entities` cover the single-operation switch."

[[coverage]]
row = "world-partition-and-streaming"
requirement = "World hierarchical level of detail"
evidence = "test:integration.world_streaming"
case = "the HLOD proxy is showing exactly while its cells are not published"
note = "The proxy stays visible exactly while its covered cells are unpublished and is swapped in the same tick they publish. unit.world's `a proxy is visible exactly while its cells are not, and the swap is one step` covers partial coverage. Proxies are declared with an asset id; cook-time aggregation of static content into proxies is not built."

[[coverage]]
row = "world-partition-and-streaming"
requirement = "Dynamic entity migration"
evidence = "test:unit.world"
case = "a vehicle crosses a hundred cells without rewriting its home cell"
note = "A vehicle crosses a hundred cells in the dynamic index with its home cell untouched and nothing written to the overlay until a checkpoint files the position under the home cell. `occupants of a runtime cell are found so a deactivation can apply their policy` covers the deactivation policy."

[[coverage]]
