# --- text-and-fonts -------------------------------------------------------------------------------
#
# Swept for M11.e: every requirement this row had not yet answered. An exemption names what is
# not built and the case that would replace it.

[[coverage]]
row = "text-and-fonts"
requirement = "Engine-owned text interface"
evidence = "test:unit.text"
case = "server: the minimal backend says what it cannot do"
note = "The minimal backend is behind the TextServer interface, and every TextCapabilities field it lacks reads false (complex shaping, bidirectional, dictionary breaking, colour, variable fonts, SDF, vertical, kashida). 'server: asking for the complete backend names what is missing' and 'server: a right-to-left request is refused rather than approximated' cover the capability query and the refusal. No HarfBuzz, ICU or FreeType type exists in the tree to leak. The complete backend itself is not built."

[[coverage]]
row = "text-and-fonts"
requirement = "Font loading"
evidence = "exempt:m11e"
note = "ONLY IMAGE-GRID FONTS LOAD. src/servers/text/README.md: a font arrives as caller-supplied bytes, and ImageGridFont is the only face format. There is no FreeType, so no TrueType, OpenType, TTC, WOFF or WOFF2 loading, no variable-font instancing (FontDesc declares axes; TextCapabilities::variable_fonts is false), no OpenType feature selection, no synthetic bold or italic, and no system-font query. What works: unit.text 'server: a missing glyph falls back, and a missing everywhere becomes a box' is the Missing-glyph scenario minus the system fallback. Replacement: a backend case that loads an OpenType face with a weight axis, rasterises a glyph at two axis values and requires distinct cache entries."

[[coverage]]
row = "text-and-fonts"
requirement = "Glyph rasterisation and atlas"
evidence = "exempt:m11e"
note = "THE ATLAS IS COMPLETE, BUT THE RENDERING MODES ARE NOT. unit.text covers dynamic packing, growth with repack, LRU eviction under pressure, thrash counting and occupancy ('atlas: under pressure it evicts the least recently used', 'atlas: re-inserting something it threw away is counted as thrashing'), which answers the Atlas-pressure scenario. Grayscale from image-grid fonts is the only mode. Subpixel (LCD), monochrome rasterisation from outlines, MSDF, colour glyphs, hinting and subpixel positioning are declared false in TextCapabilities, so the MSDF and Colour-glyphs scenarios have nothing to observe. Replacement: an MSDF rasterisation case that renders one glyph at two scales from one atlas entry within an edge-error bound, plus a COLR glyph landing in a colour atlas."

[[coverage]]
row = "text-and-fonts"
requirement = "Text shaping"
evidence = "test:unit.text_unicode"
case = "text_shape: Arabic letters take their contextual forms"
note = "Engine-owned Arabic joining selects isolated, initial, medial and final forms, and 'a mark is transparent and does not break a join' covers marks inside a join. 'text_itemise: runs split by script, direction and face' covers run segmentation, and 'text_cache: the same string with the same parameters is shaped once' is the shaping-cache scenario. GAPS (src/text/README.md): HarfBuzz is not integrated, so GSUB/GPOS ligatures beyond lam-alef, mark positioning from font tables, Indic reordering, kerning and vertical layout are absent. 'text_shape: the capabilities say what is missing without HarfBuzz' reports this."

[[coverage]]
row = "text-and-fonts"
requirement = "Bidirectional layout"
evidence = "test:unit.text_unicode"
case = "text_bidi: a mixed paragraph resolves per-run direction"
note = "A Hebrew and English paragraph resolves embedding levels and per-run direction. 'the paragraph level comes from the first strong character', 'an override forces a direction and a pop restores it' and 'a file path stays readable in a right-to-left context' (the structured-text scenario) cover the rest. The algorithm is engine-owned, not ICU. Isolating run sequences are approximated and reported ('an isolate is reported as approximated rather than silently different'), and paired brackets and mirroring are absent. Logical caret movement is 'text_grapheme: a caret moves by user-perceived character'."

[[coverage]]
row = "text-and-fonts"
requirement = "Line breaking and justification"
evidence = "test:unit.text_unicode"
case = "text_break: Thai needs a dictionary, and says which answer it gave"
note = "With a WordList, Thai breaks exactly at the dictionary word's end and the report says it used the dictionary. Without one, the fallback is reported. 'text_justify: the priority order decides which lever is pulled' covers inter-word, inter-character and kashida with a configurable priority, and 'text_overflow: an end ellipsis replaces exactly the glyphs that do not fit' is the ellipsis scenario. GAP: no Thai/Khmer/Lao dictionary ships (the project supplies one), and kashida positions come from the caller, not from font tables."

[[coverage]]
row = "text-and-fonts"
requirement = "Text layout objects"
evidence = "test:unit.text"
case = "server: an inline object takes its place in the flow"
note = "An inline object occupies its advance in the paragraph and is placed per its alignment, which is the inline-image scenario. 'server: a line measures, hit-tests and places a caret', 'server: a paragraph hit-tests to a line and a character' and the wrap and alignment cases cover TextLine and TextParagraph metrics. GAP: the minimal backend refuses right-to-left layout, so hit-testing in bidirectional text and split carets at direction boundaries (the second scenario) are not observable."

[[coverage]]
row = "text-and-fonts"
requirement = "Text rendering"
evidence = "exempt:m11e"
note = "NOTHING RENDERS TEXT. No module outside src/servers/text and src/text includes the text server for drawing. There is no glyph-quad emission, no atlas-batched draw, and no outline, shadow, gradient or per-character colour, in 2D UI, 2D world or 3D. unit.ui 'ui_layout: text drives layout through the measurer, and only where it must' uses text only for measurement. Replacement: a render-tier case that lays out a paragraph from one atlas, requires exactly one batched draw for it, and compares an outlined string against a golden image produced by distance thresholding."

[[coverage]]
row = "text-and-fonts"
requirement = "Localisation integration"
evidence = "test:unit.text_unicode"
case = "text_cache: a locale change invalidates the runs that depend on language"
note = "Changing the locale invalidates the cached shaped runs that depend on language and keeps the others, which is the scenario's first half. 'text_locale: direction follows the locale, and the script wins where it is given' covers default direction, and 'text_plural: the categories are the language's, not English's' covers plural rules. GAPS: plural rules are engine CLDR tables, not ICU. Number, currency and date formatting are absent (src/text/README.md). No UI re-layout on a locale change is observed."

[[coverage]]
row = "text-and-fonts"
requirement = "Font import and diagnostics"
evidence = "exempt:m11e"
note = "THERE IS NO FONT IMPORTER. tools/import has no font importer, so rendering mode, pre-rendered glyph ranges baked into a cooked atlas, fallback chain, OpenType defaults and variable-font instances cannot be configured at import, and the Pre-rendered-range scenario has no producer. The runtime half partly exists: TextDiagnostics carries atlas occupancy, eviction and thrash counts and shaping-cache hits ('atlas: occupancy is what was packed over what there is'). No per-frame rasterisation count, spike report or frequent-fallback report is asserted. Replacement: a unit.import case cooking a font with the Latin range pre-rendered, requiring those glyphs in the cooked atlas and zero rasterisations when the text server lays out Latin text from it."

