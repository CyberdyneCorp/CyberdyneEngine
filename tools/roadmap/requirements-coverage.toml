evidence = "test:unit.pcg"
case = "a node nothing consumes is eliminated, and the compiler names it"
note = "Dead-node elimination is reported by name. Companion cases cover constant folding and filter fusion (`a compute over a constant is folded, and a chain of filters is fused`), spatial query fusion (`two reads of one field are fused into one sampling`), parallelisation and GPU classification (`the forest graph compiles, and every pass reports what it did`), and subgraphs (`a subgraph is inlined twice and its two instances mint different identities`). Execution runs the compiled `Program`."

[[coverage]]
