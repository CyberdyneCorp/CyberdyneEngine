# criterion the falsifiability record proves can fail, and EIGHT ARE DEFERRED WITH A REASON — they
# are the subsystems this row does not have at Working, and each entry below names what is missing
# and what would observe it rather than saying `not tested`. `src/rendering/gi/README.md`'s "What is
# here at Working, and what is not" is the same list from the code's side.
#
# Where a requirement carries several scenarios and the suite carries a case for each, the entry
# names the case whose failure would be the requirement's failure and NAMES ITS SIBLINGS in the
# note — the shape `material-compiler`'s entries above use. A sibling named in prose is not a
# second answer; it is where to look next.

