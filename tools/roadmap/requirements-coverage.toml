#
# ALL NINE WERE MUTATION-TESTED AGAINST build/m11c-final, ONE AT A TIME, AND THREE SURVIVED.
# The experiment is the same each time: find the source line that implements the sentence the
# requirement makes, delete or invert it, rebuild the one target, run the mapped case BY NAME, and
# restore — every restore verified by md5 against the pre-phase blob. 9 mutated, 6 red as they
# should be, 3 SURVIVED THE DELETION OF THE BEHAVIOUR THEY NAME and were repaired by strengthening
# the case, never by re-pointing the mapping or softening the requirement. The three and their
# mutations are recorded in their own notes: "Frustum culling" (the layer/frustum order swapped),
# "Level of detail" (the coarsest-level fallback deleted) and "Visibility ranges and HLOD" (the
# parent-replaces-child step deleted). Each now goes red under the same mutation. The six that went
# red first time: `spatial.cpp`'s always-visible flat array removed; `Hzb::occludes` made to occlude
# nothing; the instance records never uploaded to the device; the swept-volume shadow rejection
# deleted; the motion list never filled; `rejected_by_range` no longer counted.
#
# NINE OF NINE, written by reading the specification requirement by requirement against
# src/rendering/culling/ (the CPU cull, the spatial index and the LOD chain),
# src/servers/render/culling/ (the GPU cull's records, its CPU reference and the hierarchical depth
# buffer) and src/rendering/gpu_culling/ (the dispatch on a device).
