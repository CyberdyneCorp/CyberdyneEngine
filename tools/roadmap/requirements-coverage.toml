[[coverage]]
row = "core-assets-and-io"
requirement = "Compression and cryptography"
evidence = "exempt:m11e"
note = "BLAKE3 AND ZSTD ARE HERE, BUT THE REST OF THE LIST IS NOT. unit.assets 'Scenario: Content hash' records the BLAKE3 hash of a cooked payload, and integration.assets_io 'Scenario: Tampered package' fails with an integrity error, so both scenarios are observed. Not present: compression.h declares CompressionMethod::Lz4 and Deflate as 'declared, not implemented', and hash.h states that SHA-256, HMAC, AES-GCM and a CSPRNG are absent. Package encryption is refused, not supported. Replacement: integration.assets_codec cases round-tripping LZ4 and Deflate, known-answer-vector cases for SHA-256, HMAC and AES-GCM, and a package written encrypted (after compression) that reads back with the key and is refused without it."

