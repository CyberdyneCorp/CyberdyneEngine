# Compile definitions that name the repository ROOT and are read as text, never opened.
#
# `just roadmap-milestone <rung> --incremental` treats a definition naming the repository root as
# "this object can read any file", which makes every criterion whose tests link the object UNKNOWN,
# and therefore selected. That is right by default and wrong for a definition that is only a string.
# Each entry here is a person's review that it is only a string, PINNED so the review cannot outlive
# the code it read: `used_by` is every file allowed to name one of `tokens` (in `pathspec`), and
# `digest` is over their content. The exemption LAPSES — the definition is a read again — when any
# of those files changes or another file names a token. Re-read them, then update the digest the
# lapsed message prints. See tools/roadmap/incremental.py, `exempt_definitions`.

[[definition]]
name = "CY_DIAG_SOURCE_ROOT"
reason = "the prefix sanitise_source_path() strips from a reported source location; it is compared with memcmp and never opened. Residual, accepted: a call to source_root() through a pointer, or spelt with a space before its parentheses, is not seen by the pin"
tokens = ["CY_DIAG_SOURCE_ROOT", "source_root()"]
pathspec = ["*.c", "*.cc", "*.cpp", "*.h", "*.hpp", "*.inl", "*.mm", "*.m"]
used_by = [
    "src/core/diagnostics/include/cy/core/diagnostics/source.h",
    "src/core/diagnostics/src/source.cpp",
    "src/core/diagnostics/tests/test_source_privacy.cpp",
]
digest = "fe288b243db10e1a"

# Build-tree files NO build edge produces, and what each is made from.
#
# A file written at configure time (configure_file, a generator run by execute_process) or fetched
# (FetchContent's `_deps/`) is made from files CMake READ, and nothing records which: file(STRINGS)
# and file(READ) are not ninja edges. `--incremental` therefore treats every such file a test is
# built from as "inputs unknown" — always selected — unless it matches an entry here. An entry is a
# person's trace of EVERY repository path the outputs are made from: `sources`, plus `generated_by`,
# the code that writes them, which is a source too. The CMake files above every source, `cmake/` and
# `CMakePresets.json` are added, as for any input. `digest` pins the review over `generated_by`: when
# that code changes it may read something new, so the entry LAPSES and its outputs are unknown again
# until somebody re-reads it and writes back the digest the lapsed message prints. CMake variables
# the code reads come from `cmake/`, `CMakePresets.json`, the CMakeLists.txt above it, the cache and
# the host — the first three are inputs already, and the last two are not repository files.
# `test_incremental_generated_headers` in selftest.py proves each source here selects its outputs.
# See tools/roadmap/incremental.py, `generated_origins`.

[[generated]]
name = "the toolchain fingerprint header"
outputs = ["src/core/assets/generated/cy/core/assets/toolchain_generated.h"]
reason = "configure_file() of the template, with the two dependency manifests read by _cy_assets_read_manifest through file(STRINGS); every other value is a CMake variable (compiler, system, flags, CY_SYSTEM_*)"
sources = [
    "src/core/assets/toolchain_generated.h.in",
    "deps/manifest.toml",
    "deps/host-tools.toml",
]
generated_by = ["src/core/assets/CMakeLists.txt"]
digest = "ef1d063fcce99703"

[[generated]]
name = "cy_features.h and cy_modules.h"
outputs = ["generated/include/cy_features.h", "generated/include/cy_modules.h"]
reason = "tools/gen/generate_headers.py renders them from the input file cmake/features.cmake writes: the feature options, CY_SETTINGS, and the module records cmake/modules.cmake reads from every module.json it globs under modules/ (CY_EXTRA_MODULE_PATHS is outside the repository)"
sources = ["modules"]
generated_by = ["cmake/features.cmake", "cmake/modules.cmake", "tools/gen/generate_headers.py"]
digest = "4def48dcc734aaa9"

[[generated]]
name = "cy_project.h"
outputs = ["generated/project/include/cy_project.h"]
reason = "tools/project/project.py emit-header, from project.json when it exists and otherwise from the project name and version and the module records cmake/modules.cmake read from modules/"
sources = ["project.json", "modules", "tools/project"]
generated_by = ["cmake/project.cmake", "cmake/modules.cmake", "tools/project/project.py", "tools/project/graph.py", "tools/project/schema.py"]
digest = "dbe8d493fbf3cae0"

[[generated]]
name = "the fetched third-party dependencies"
outputs = ["_deps/**", "include/glslang/**"]
reason = "FetchContent checks out the commit deps/manifest.toml pins for each dependency, and the dependency's own CMake — in that checkout — writes its configure-time files (SDL's build config and Wayland protocols, PCH stubs, glslang's build_info.h at the top of the tree) with the options cmake/ sets. No repository file is patched into a checkout"
sources = ["deps/manifest.toml"]
generated_by = ["cmake/dependencies.cmake"]
digest = "d054edb23deb3625"

# Build-tree files a build edge DOES produce, from MORE than the edge declares.
#
# `ninja -t inputs` lists what an edge DECLARES. A custom command whose program reads files it does
# not name — SwiftPM, which decides for itself what a package compiles — produces outputs the graph
# describes only in part, and the selector would skip a test that loads them after a change to a
# file the edge never named. The M11.d gate caught exactly that: `#error` appended to
# bindings/swift/Sources/CyberdyneABI/shim.c selected nothing and skipped m4:swift-reload and
# m4:sample-artefact. An entry here is a person's trace of EVERY repository path the command reads
# for its outputs; its `sources` are ADDED to the edge's own inputs. `generated_by` is the code that
# decides what the command reads — the driver, the manifest and the CMake that writes the edge — and
# `digest` pins the review over it: when any of it changes, the entry LAPSES and the outputs are
# unknown until somebody re-reads it and writes back the digest the lapsed message prints.
# `test_incremental_swiftpm_edges` in selftest.py proves each source here selects the tests loading
# each output, and that every tracked file of the Swift package is declared. See
# tools/roadmap/incremental.py, `edge_origins`.

[[edge]]
name = "the Swift reload fixture's three generations"
outputs = ["bindings/swift/modules/libCyGame_g*.so"]
reason = "bindings/swift/tools/cy_swift_module.py writes a one-target package under the build tree that depends on bindings/swift by path, copies each generation's *.swift from fixtures/reload/v1 and v2 into it, and runs `swift build` through swiftly. Traced with strace on build/m11d-selector-and-cache: SwiftPM reads bindings/swift/Package.swift and probes Package@swift-6.swift, Package@swift-6.3.swift and Package@swift-6.3.3.swift beside it; compiles every target CyberdyneKit depends on from Sources/ — the CyberdyneABI C target (shim.c, include/module.modulemap, the cy_abi.h copy), CyberdyneCore's generated overlay, CyberdyneKit and the CyberdyneMacros plugin; lists Tests/ and probes Plugins/ and a root module.modulemap; and swiftly looks for .swift-version up from the build tree to the repository root. So the whole package directory is declared, not a list of what exists today. bindings/swift/Package.resolved is NOT read — the resolution is the generated root package's, in the build tree — and swift-syntax, the toolchain and ~/.swiftpm are outside the repository"
sources = ["bindings/swift", ".swift-version"]
generated_by = ["bindings/swift/tools/cy_swift_module.py", "bindings/swift/Package.swift", "bindings/swift/CMakeLists.txt"]
digest = "2fe33254127c25bc"

[[edge]]
name = "the 04-character game module"
outputs = ["samples/04-character/module/libCyGame_g*.so"]
reason = "the same driver builds generation 0 from samples/04-character/game/*.swift against bindings/swift by path, so SwiftPM reads what it reads for the reload fixture — the whole package directory and .swift-version — plus the game's own sources"
sources = ["bindings/swift", ".swift-version", "samples/04-character/game"]
generated_by = ["bindings/swift/tools/cy_swift_module.py", "bindings/swift/Package.swift", "samples/04-character/CMakeLists.txt"]
digest = "9d2cea33602894e5"
