# The menus game module's manifest. `native-abi`: "module name, entry symbol, minimum ABI version,
# per-platform library paths, and whether the module is hot-reloadable".
#
# min_abi_minor = 15: the game rebinds through ABI 1.15's `input_rebind_*`, keeps the player's
# files with `user_data_*`, applies display settings with `video_*` and gives slots tooltips with
# `ui_widget_set_tooltip`, over 1.12's widget toolkit; an engine older than that does not have them.

name = "menus"
entry_symbol = "cy_module_entry"
min_abi_major = 1
min_abi_minor = 15
hot_reload = true

[platform.linux]
library = "libCyGame_g0.so"

[platform.windows]
library = "CyGame_g0.dll"

[platform.macos]
library = "libCyGame_g0.dylib"
